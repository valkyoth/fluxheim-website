services:
  fluxheim-website:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: fluxheim-website:1.7.12
    container_name: fluxheim-website
    restart: always
    stop_signal: SIGTERM
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    environment:
      FLUXHEIM_OTLP: "${FLUXHEIM_OTLP:-disabled}"
      FLUXHEIM_HSTS: "${FLUXHEIM_HSTS:-enabled}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
    ports:
      - "8080:8080"
