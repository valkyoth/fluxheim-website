services:
  fluxheim-website:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: fluxheim-website:1.6.30
    container_name: fluxheim-website
    restart: always
    stop_signal: SIGTERM
    stop_grace_period: 15s
    environment:
      FLUXHEIM_OTLP: "${FLUXHEIM_OTLP:-disabled}"
    ports:
      - "8080:8080"
