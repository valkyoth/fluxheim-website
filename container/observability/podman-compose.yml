name: fluxheim_website_observability

volumes:
  prometheus-data:
  grafana-data:

services:
  fluxheim-website:
    build:
      context: ../..
      dockerfile: container/Dockerfile
    image: fluxheim-website:1.8.3-observability
    container_name: "${FLUXHEIM_OBSERVABILITY_CONTAINER_PREFIX:-fluxheim-website}-observability"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    pids_limit: 128
    environment:
      FLUXHEIM_OTLP: "${FLUXHEIM_OTLP:-enabled}"
      FLUXHEIM_HSTS: "${FLUXHEIM_HSTS:-enabled}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Bearer ${OTEL_COLLECTOR_BEARER_TOKEN:-fluxheim-local-otlp-token}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      RUST_LOG: "fluxheim_website=info,tower_http=info"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - otel-collector

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    container_name: "${FLUXHEIM_OBSERVABILITY_CONTAINER_PREFIX:-fluxheim-website}-otel"
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      OTEL_COLLECTOR_BEARER_TOKEN: "${OTEL_COLLECTOR_BEARER_TOKEN:-fluxheim-local-otlp-token}"
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro,Z
    expose:
      - "4317"
      - "4318"
      - "9464"
    depends_on:
      - jaeger

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: "${FLUXHEIM_OBSERVABILITY_CONTAINER_PREFIX:-fluxheim-website}-prometheus"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    container_name: "${FLUXHEIM_OBSERVABILITY_CONTAINER_PREFIX:-fluxheim-website}-jaeger"
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"

  grafana:
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: "${FLUXHEIM_OBSERVABILITY_CONTAINER_PREFIX:-fluxheim-website}-grafana"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger
