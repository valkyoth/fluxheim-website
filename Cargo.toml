[package]
name = "fluxheim-website"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "EUPL-1.2"
publish = false
description = "Localized Rust website for Fluxheim."

[dependencies]
aho-corasick = "1.1.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio", "tracing"] }
http = "1.5.0"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["metrics", "rt-tokio", "trace"] }
sanitization = { version = "2.0.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
toml = "1.1.4"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"
