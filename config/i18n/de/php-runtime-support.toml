[[phrase]]
from = "PHP Runtime Support"
to = "PHP-Laufzeitunterstuetzung"
[[phrase]]
from = "adds the first production-compatible PHP path through"
to = "fuegt den ersten produktionskompatiblen PHP-Pfad ueber"
[[phrase]]
from = ". PHP is not part of the default binary. Each PHP runtime changes the security model from serving files and proxying HTTP to executing user code, so every PHP path is opt-in at compile time and opt-in per vhost or route."
to = "hinzu. PHP ist nicht Teil des Standard-Binary. Jede PHP-Laufzeit aendert das Sicherheitsmodell vom Ausliefern von Dateien und HTTP-Proxying zur Ausfuehrung von User-Code, daher ist jeder PHP-Pfad zur Compile-Zeit und pro vhost oder Route opt-in."
[[phrase]]
from = "Use this implementation model:"
to = "Dieses Implementierungsmodell verwenden:"
[[phrase]]
from = ": stable backwards-compatible path for PHP applications. This is implemented in"
to = ": stabiler rueckwaertskompatibler Pfad fuer PHP-Anwendungen. Dies ist implementiert in"
[[phrase]]
from = "<li>Managed <code>php-fpm</code>: zero-admin deployment mode inside the existing <code>php-fpm</code> feature. Fluxheim generates a minimal private php-fpm pool, spawns and supervises php-fpm, and connects to its private socket while still using the same FastCGI request path as external php-fpm.</li>"
to = "<li>Verwaltetes <code>php-fpm</code>: Zero-Admin-Deployment-Modus innerhalb des bestehenden <code>php-fpm</code>-Features. Fluxheim erzeugt einen minimalen privaten php-fpm-Pool, startet und ueberwacht php-fpm und verbindet sich mit dessen privatem Socket, waehrend weiterhin derselbe FastCGI-Request-Pfad wie bei externem php-fpm genutzt wird.</li>"
[[phrase]]
from = "feature. Fluxheim generates a minimal private php-fpm pool, spawns and supervises php-fpm, and connects to its private socket while still using the same FastCGI request path as external php-fpm."
to = "Feature. Fluxheim erzeugt einen minimalen privaten php-fpm-Pool, startet und ueberwacht php-fpm und verbindet sich mit dessen privatem Socket, waehrend weiterhin derselbe FastCGI-Request-Pfad wie bei externem php-fpm genutzt wird."
[[phrase]]
from = "As of the current review,"
to = "Zum Zeitpunkt der aktuellen Pruefung ist"
[[phrase]]
