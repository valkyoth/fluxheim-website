[[phrase]]
from = "instead of adding a new compile-time PHP runtime:"
to = "anstatt eine neue PHP-Laufzeit zur Compile-Zeit hinzuzufuegen:"
[[phrase]]
from = "Managed mode generates a minimal private php-fpm config, creates a Fluxheim-owned Unix socket, supervises the php-fpm master process, and shuts it down cleanly on reload or gateway shutdown. It is not implemented as a persistent"
to = "Der Managed-Modus erzeugt eine minimale private php-fpm-Konfiguration, erstellt einen Fluxheim-eigenen Unix-Socket, ueberwacht den php-fpm-Masterprozess und faehrt ihn bei Reload oder Gateway-Shutdown sauber herunter. Er ist nicht als persistenter"
[[phrase]]
from = "stdin/stdout worker pool for production apps, because normal WordPress, Laravel, Symfony, forum, and wiki applications expect per-request PHP isolation."
to = "stdin-/stdout-Worker-Pool fuer Produktions-Apps implementiert, weil normale WordPress-, Laravel-, Symfony-, Forum- und Wiki-Anwendungen PHP-Isolation pro Anfrage erwarten."
[[phrase]]
from = "The generated socket, config, pid, and php-fpm log files live under"
to = "Die erzeugten Socket-, Konfigurations-, PID- und php-fpm-Logdateien liegen unter"
[[phrase]]
from = ". Normal reload/drop cleanup removes the generated control files, but forced process termination can leave stale files behind because destructors do not run. They are safe to remove when Fluxheim is stopped."
to = ". Normales Reload-/Drop-Cleanup entfernt die erzeugten Steuerdateien, aber erzwungene Prozessbeendigung kann veraltete Dateien hinterlassen, weil Destruktoren nicht laufen. Sie koennen sicher entfernt werden, wenn Fluxheim gestoppt ist."
[[phrase]]
from = "Managed pools support the php-fpm process manager modes operators usually tune in"
to = "Managed Pools unterstuetzen die php-fpm-Process-Manager-Modi, die Betreiber ueblicherweise in"
[[phrase]]
from = "starts exactly"
to = "startet exakt"
[[phrase]]
from = "Fluxheim also writes bounded php-fpm directives for"
to = "Fluxheim schreibt auch begrenzte php-fpm-Direktiven fuer"
[[phrase]]
from = "are created with owner-only permissions when missing; if the managed pool drops to another"
to = "werden bei Bedarf mit Owner-only-Berechtigungen erstellt; wenn der Managed Pool auf einen anderen"
[[phrase]]
from = ", make those directories writable by that PHP worker identity before starting Fluxheim."
to = "wechselt, diese Verzeichnisse vor dem Start von Fluxheim fuer diese PHP-Worker-Identitaet beschreibbar machen."
[[phrase]]
from = "The PHP handler runs before static fallback. Existing non-PHP files under the PHP root are declined so the normal static server can serve assets. Missing paths use the configured front controller, normally"
