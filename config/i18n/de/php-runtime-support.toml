[[phrase]]
from = "Implemented feature flags:"
to = "Implementierte Feature-Flags:"
[[phrase]]
from = "is the only PHP runtime feature in the 1.3 line. Managed php-fpm is a runtime configuration mode under the same feature because it changes process lifecycle, not the request protocol."
to = "ist das einzige PHP-Laufzeit-Feature in der 1.3-Linie. Managed php-fpm ist ein Laufzeit-Konfigurationsmodus unter demselben Feature, weil es den Prozess-Lifecycle aendert, nicht das Request-Protokoll."
[[phrase]]
from = "The default feature set must not include"
to = "Das Standard-Feature-Set darf nicht enthalten:"
[[phrase]]
from = "Release order:"
to = "Release-Reihenfolge:"
[[phrase]]
from = ": shared ingress/TLS feature-graph split and focused image/profile cleanup."
