[[phrase]]
from = ", so Fluxheim process secrets such as admin tokens are not inherited by the child process. On reload/shutdown, Fluxheim asks the managed php-fpm master to terminate gracefully before escalating to a forced kill after a short deadline. A per-pool watchdog monitors the php-fpm master after startup and respawns it with bounded backoff if it crashes, so managed PHP service can recover without a Fluxheim config reload."
to = ", sodass Fluxheim-Prozess-Secrets wie Admin-Tokens nicht vom Child-Prozess geerbt werden. Bei Reload/Shutdown fordert Fluxheim den Managed-php-fpm-Master auf, sauber zu terminieren, bevor nach kurzer Frist zu einem erzwungenen Kill eskaliert wird. Ein Watchdog pro Pool ueberwacht den php-fpm-Master nach dem Start und startet ihn mit begrenztem Backoff neu, wenn er crasht, sodass Managed-PHP-Service ohne Fluxheim-Konfigurationsreload wiederhergestellt werden kann."
