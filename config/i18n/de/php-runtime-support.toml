[[phrase]]
from = "Retry policy for connection failures and connect timeouts on configured safe methods. Implemented as"
to = "Retry-Policy fuer Verbindungsfehler und Connect-Timeouts auf konfigurierten sicheren Methoden. Implementiert als"
[[phrase]]
from = "FastCGI cache-specific convenience config. Initial convenience preset implemented as"
to = "FastCGI-cache-spezifische Convenience-Konfiguration. Erstes Convenience-Preset implementiert als"
[[phrase]]
from = "FastCGI cache compatibility presets: cache keys, status TTLs, bypass/no-cache predicates, cache lock, stale-on-error/timeout, background refresh, and purge."
to = "FastCGI-Cache-Kompatibilitaetspresets: Cache-Keys, Status-TTLs, Bypass-/No-cache-Praedikate, Cache-Lock, Stale-on-error/-timeout, Background-Refresh und Purge."
[[phrase]]
from = "Super Cache/W3TC-style static-file fallbacks remain future work. They need a typed static-file probing design so Fluxheim can avoid broad rewrite-string interpolation while still matching common WordPress plugin cache layouts."
to = "Static-File-Fallbacks im Super-Cache-/W3TC-Stil bleiben zukuenftige Arbeit. Sie benoetigen ein typisiertes Static-File-Probing-Design, damit Fluxheim breite Rewrite-String-Interpolation vermeidet und trotzdem gaengige WordPress-Plugin-Cache-Layouts matcht."
[[phrase]]
from = "Turbine-Style PHP App Servers"
to = "PHP-App-Server im Turbine-Stil"
[[phrase]]
from = "Turbine-style PHP runtimes are outside Fluxheim's embedded PHP runtime plan. They are app servers with their own listener, worker, TLS, lifecycle, and metrics model. Operators can run one behind Fluxheim like any other HTTP upstream:"
to = "PHP-Laufzeiten im Turbine-Stil liegen ausserhalb von Fluxheims Plan fuer eingebettete PHP-Laufzeiten. Sie sind App-Server mit eigenem Listener-, Worker-, TLS-, Lifecycle- und Metrikmodell. Betreiber koennen sie wie jeden anderen HTTP-Upstream hinter Fluxheim betreiben:"
[[phrase]]
from = "Fluxheim should not duplicate that model as an embedded PHP runtime unless a future project exposes a small auditable library API with a clearly safer security boundary than reverse proxying."
to = "Fluxheim sollte dieses Modell nicht als eingebettete PHP-Laufzeit duplizieren, ausser ein zukuenftiges Projekt stellt eine kleine auditierbare Library-API mit klar sichererer Sicherheitsgrenze als Reverse Proxying bereit."
[[phrase]]
from = "Pure-Rust PHP"
to = "Pure-Rust PHP"
[[phrase]]
from = "Reload And Operations"
to = "Reload und Betrieb"
[[phrase]]
from = "PHP runtime selection and PHP runtime process settings should be classified as process-upgrade changes until a runtime proves safe snapshot-only reload semantics."
to = "PHP-Laufzeitauswahl und PHP-Laufzeitprozesseinstellungen sollten als Process-Upgrade-Aenderungen klassifiziert werden, bis eine Laufzeit sichere reine Snapshot-Reload-Semantik nachweist."
[[phrase]]
from = "Per-vhost PHP routing policy may later become snapshot-safe, but only after path resolution, runtime handles, and request isolation are immutable per runtime snapshot."
to = "PHP-Routing-Policy pro vhost kann spaeter snapshot-sicher werden, aber erst nachdem Pfadauflosung, Laufzeit-Handles und Request-Isolation pro Laufzeit-Snapshot unveraenderlich sind."
[[phrase]]
from = "Operational metrics include bounded Prometheus request totals, durations, STDERR event counts, php-fpm retry-attempt counts, and keepalive pool idle and event metrics for the PHP handler."
to = "Betriebsmetriken umfassen begrenzte Prometheus-Request-Gesamtzahlen, Dauerwerte, STDERR-Event-Zaehler, php-fpm-Retry-Versuchszaehler sowie Keepalive-Pool-Idle- und Event-Metriken fuer den PHP-Handler."
[[phrase]]
from = "; keep running them as release evidence when PHP behavior changes. The local WordPress smoke accepts"
to = "; sie weiter als Release-Nachweis ausfuehren, wenn sich PHP-Verhalten aendert. Der lokale WordPress-Smoke akzeptiert"
