[[phrase]]
from = "FastCGI bridge, WordPress-style front-controller support, strict script resolution, bounded request/response buffering, split-cookie normalization, and browser-validated WordPress login/admin flows."
to = "FastCGI-Bridge, WordPress-artige Front-Controller-Unterstuetzung, strikte Script-Aufloesung, begrenztes Request-/Response-Buffering, Split-Cookie-Normalisierung und browservalidierte WordPress-Login-/Admin-Flows."
[[phrase]]
from = ": focused php-fpm hardening and compatibility fixes found during production tests."
to = ": fokussiertes php-fpm-Hardening und Kompatibilitaetsfixes aus Produktionstests."
[[phrase]]
from = ": managed php-fpm mode as a config option under the existing"
