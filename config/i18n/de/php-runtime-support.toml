[[phrase]]
from = "feature, not as a separate Cargo runtime. The goal is a single-binary operator experience while retaining normal php-fpm request isolation and compatibility."
to = "Feature, nicht als separate Cargo-Laufzeit. Ziel ist eine Single-Binary-Betreibererfahrung bei Erhalt der normalen php-fpm-Request-Isolation und Kompatibilitaet."
[[phrase]]
from = "Minimal vhost TOML:"
to = "Minimales vhost-TOML:"
[[phrase]]
from = "Managed php-fpm mode keeps the runtime selection in"
