locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Fluxheim supports Prometheus metrics, OpenTelemetry metrics and traces, and structured logging. All observability features are opt-in at compile time."
to = "Fluxheim unterstützt Prometheus-Metriken, OpenTelemetry-Metriken und -Traces sowie strukturiertes Logging. Alle Observability-Funktionen sind zur Compile-Zeit optional."

[[phrase]]
from = "Requires <code class=\"text-gray-400\">metrics</code> feature"
to = "Erfordert das Feature <code class=\"text-gray-400\">metrics</code>"

[[phrase]]
from = "Requires <code class=\"text-gray-400\">metrics-otlp</code>"
to = "Erfordert <code class=\"text-gray-400\">metrics-otlp</code>"

[[phrase]]
