[[phrase]]
from = "Relative filesystem paths are resolved from the config file directory. Config sources must be real TOML files or real directories. Fluxheim rejects a symlink used as the top-level config source, rejects config sources below a symlinked directory, and ignores symlinked TOML entries inside split config directories, so a reload cannot be redirected through an unexpected filesystem pointer."
to = "Relative Dateisystempfade werden vom Verzeichnis der Konfigurationsdatei aufgeloest. Konfigurationsquellen muessen echte TOML-Dateien oder echte Verzeichnisse sein. Fluxheim lehnt einen Symlink als Top-Level-Konfigurationsquelle ab, lehnt Konfigurationsquellen unter einem symlinkten Verzeichnis ab und ignoriert symlinkte TOML-Eintraege in Split-Konfigurationsverzeichnissen, sodass ein Reload nicht ueber einen unerwarteten Dateisystemzeiger umgeleitet werden kann."
[[phrase]]
from = "Each TOML file is size-limited to 1 MiB; large deployments should use a split config directory instead of one huge file. Split config directories are limited to 256 visible TOML files."
to = "Jede TOML-Datei ist auf 1 MiB begrenzt; grosse Deployments sollten ein Split-Konfigurationsverzeichnis statt einer riesigen Datei nutzen. Split-Konfigurationsverzeichnisse sind auf 256 sichtbare TOML-Dateien begrenzt."
[[phrase]]
from = "Configured filesystem paths are also rejected when any existing path component is a symlink; missing final directories may still be created by the owning runtime module, but never through a symlinked prefix."
to = "Konfigurierte Dateisystempfade werden ebenfalls abgelehnt, wenn eine vorhandene Pfadkomponente ein Symlink ist; fehlende finale Verzeichnisse koennen weiterhin vom besitzenden Runtime-Modul erstellt werden, aber nie ueber ein symlinktes Praefix."
