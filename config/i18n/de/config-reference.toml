[[phrase]]
from = "Fluxheim extends the trusted-proxy list and deduplicates exact entries instead of replacing the earlier list. This keeps a later fragment from silently discarding the main config's client-IP trust boundary."
to = "erweitert Fluxheim die Trusted-Proxy-Liste und dedupliziert exakte Eintraege, statt die fruehere Liste zu ersetzen. Dadurch kann ein spaeteres Fragment die Client-IP-Vertrauensgrenze der Hauptkonfiguration nicht stillschweigend verwerfen."
