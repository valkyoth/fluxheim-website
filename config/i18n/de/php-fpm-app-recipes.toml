[[phrase]]
from = "This page maps common PHP application web-server requirements to Fluxheim's php-fpm/FastCGI primitives. It is intentionally documentation-first: add an application preset only after repeated production testing proves that a stable, security-sensitive pattern is common enough to encode in Fluxheim itself."
to = "Diese Seite ordnet gaengige Webserver-Anforderungen von PHP-Anwendungen den php-fpm-/FastCGI-Primitiven von Fluxheim zu. Sie ist bewusst dokumentationsorientiert: Ein Anwendungs-Preset sollte erst hinzugefuegt werden, nachdem wiederholte Produktionstests belegen, dass ein stabiles, sicherheitssensibles Muster haeufig genug ist, um es in Fluxheim selbst abzubilden."
