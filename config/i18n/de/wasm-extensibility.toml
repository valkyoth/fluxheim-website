[[phrase]]
from = "Compiled modules should be cached only with strong isolation by module hash, ABI version, feature set, and Fluxheim version."
to = "Kompilierte Module sollten nur mit starker Isolation nach Modul-Hash, ABI-Version, Feature-Set und Fluxheim-Version gecacht werden."

[[phrase]]
from = "Disabled by default at compile time and runtime."
to = "Standardmaessig zur Compile-Zeit und Laufzeit deaktiviert."

[[phrase]]
from = "Plugin files must be regular files below approved directories."
to = "Plugin-Dateien muessen regulaere Dateien unterhalb genehmigter Verzeichnisse sein."

[[phrase]]
from = "Plugin paths must reject symlinks and symlinked parents."
to = "Plugin-Pfade muessen Symlinks und symlinkte Eltern ablehnen."

[[phrase]]
from = "Plugin modules must be hashed and recorded in admin status."
to = "Plugin-Module muessen gehasht und im Admin-Status aufgezeichnet werden."

[[phrase]]
from = "Host calls must never expose admin tokens, ACME/EAB secrets, private keys, authorization headers, cookies, raw request bodies, or filesystem paths unless explicitly allowed and redacted."
to = "Host-Calls duerfen niemals Admin-Tokens, ACME-/EAB-Secrets, Private Keys, Authorization-Header, Cookies, rohe Request-Bodies oder Dateisystempfade offenlegen, ausser sie sind explizit erlaubt und redigiert."

[[phrase]]
from = "Plugins must not control routing destinations or upstream TLS verification directly. Cache-key influence is allowed only through constrained typed hook outputs that Fluxheim validates, bounds, and records."
to = "Plugins duerfen Routing-Ziele oder Upstream-TLS-Verifikation nicht direkt steuern. Cache-Key-Einfluss ist nur ueber eingeschraenkte typisierte Hook-Ausgaben erlaubt, die Fluxheim validiert, begrenzt und aufzeichnet."

[[phrase]]
from = "Plugin panics, traps, timeout, or fuel exhaustion must produce configured fail behavior and must not crash Fluxheim."
to = "Plugin-Panics, Traps, Timeout oder Fuel-Erschoepfung muessen konfiguriertes Fail-Verhalten erzeugen und duerfen Fluxheim nicht crashen."

