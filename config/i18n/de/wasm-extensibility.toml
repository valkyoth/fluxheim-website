[[phrase]]
from = "Planned Cargo features:"
to = "Geplante Cargo-Features:"

[[phrase]]
from = "Latest crate candidates checked on 2026-05-05:"
to = "Neueste Crate-Kandidaten geprueft am 2026-05-05:"

[[phrase]]
from = "WASM extensibility gives Fluxheim a sandboxed way to run operator-provided logic without compiling that logic into the Fluxheim binary. It should be treated as a major extension boundary, not as a small scripting feature."
to = "WASM-Erweiterbarkeit gibt Fluxheim einen sandboxed Weg, von Betreibern bereitgestellte Logik auszufuehren, ohne diese Logik in das Fluxheim-Binary zu kompilieren. Sie sollte als grosse Erweiterungsgrenze behandelt werden, nicht als kleines Scripting-Feature."

[[phrase]]
from = "The same runtime should cover the operational jobs commonly solved with F5 iRules, nginx Lua/OpenResty, HAProxy Lua/SPOE, and VCL-like cache policy hooks, instead of creating separate partial extension systems."
to = "Dieselbe Runtime sollte die betrieblichen Aufgaben abdecken, die ueblicherweise mit F5 iRules, nginx Lua/OpenResty, HAProxy Lua/SPOE und VCL-aehnlichen Cache-Policy-Hooks geloest werden, statt getrennte teilweise Erweiterungssysteme zu erzeugen."

[[phrase]]
from = "This is capability parity, not syntax compatibility: Fluxheim should expose typed, versioned host calls and bounded decisions rather than embedding Tcl, Lua, or an unrestricted scripting language."
to = "Das ist Capability-Paritaet, keine Syntax-Kompatibilitaet: Fluxheim sollte typisierte, versionierte Host-Calls und begrenzte Entscheidungen bereitstellen, statt Tcl, Lua oder eine unbeschraenkte Scriptsprache einzubetten."

[[phrase]]
from = "Design Goals"
to = "Designziele"

[[phrase]]
from = "Keep WASM runtime code out of default builds."
to = "WASM-Runtime-Code aus Standard-Builds heraushalten."

[[phrase]]
from = "Use a reviewed standard ABI where practical."
to = "Wo praktikabel ein geprueftes Standard-ABI verwenden."

[[phrase]]
from = "Start with request/response header hooks, access-control hooks, and bounded cache-policy hooks."
to = "Mit Request-/Response-Header-Hooks, Access-Control-Hooks und begrenzten Cache-Policy-Hooks starten."

[[phrase]]
from = "Cover the safe subset of iRules/Lua-style jobs over time: conditional routing, pool selection, persistence-key choice, synthetic deny/error responses, header mutation, logging/redaction, mirror/shadow selection, and cache policy."
to = "Mit der Zeit den sicheren Teil von iRules-/Lua-artigen Aufgaben abdecken: bedingtes Routing, Pool-Auswahl, Persistence-Key-Auswahl, synthetische Deny-/Error-Responses, Header-Mutation, Logging/Redaction, Mirror-/Shadow-Auswahl und Cache-Policy."

[[phrase]]
from = "Make all host calls explicit, small, and auditable."
to = "Alle Host-Calls explizit, klein und auditierbar machen."

[[phrase]]
from = "Keep plugin execution bounded by memory, fuel, wall-time, and output limits."
to = "Plugin-Ausfuehrung durch Memory-, Fuel-, Wall-Time- und Output-Limits begrenzen."

[[phrase]]
from = "Prevent plugins from seeing secrets, bodies, filesystem, network, or admin APIs unless explicitly granted by policy."
to = "Verhindern, dass Plugins Secrets, Bodies, Dateisystem, Netzwerk oder Admin-APIs sehen, ausser es wird explizit per Policy erlaubt."

[[phrase]]
from = "Make plugin failures isolated from the process and from unrelated requests."
to = "Plugin-Fehler vom Prozess und von unbeteiligten Requests isolieren."

[[phrase]]
from = "Stage 1: Header, Access-Control, And Cache Policy Hooks"
to = "Phase 1: Header-, Access-Control- und Cache-Policy-Hooks"

[[phrase]]
from = "The first useful scope should cover the common extension cases without exposing request bodies or arbitrary I/O."
to = "Der erste nuetzliche Scope sollte die gaengigen Erweiterungsfaelle abdecken, ohne Request-Bodies oder beliebiges I/O offenzulegen."

