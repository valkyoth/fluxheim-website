to = "Phase 2: Proxy-ABI-Kompatibilitaet"

[[phrase]]
from = "Fluxheim should evaluate a proxy-oriented WASM ABI rather than inventing a large custom API."
to = "Fluxheim sollte ein proxy-orientiertes WASM-ABI evaluieren, statt eine grosse Custom-API zu erfinden."

[[phrase]]
from = "Compatibility goals:"
to = "Kompatibilitaetsziele:"

[[phrase]]
from = "map Fluxheim request/response lifecycle into a stable plugin contract;"
to = "Fluxheims Request-/Response-Lifecycle in einen stabilen Plugin-Vertrag abbilden;"

[[phrase]]
from = "expose only the subset of ABI calls Fluxheim can implement safely;"
to = "nur den Teil der ABI-Calls offenlegen, den Fluxheim sicher implementieren kann;"

[[phrase]]
from = "reject unsupported ABI calls with deterministic errors;"
to = "nicht unterstuetzte ABI-Calls mit deterministischen Fehlern ablehnen;"

[[phrase]]
from = "version the host ABI and require plugin compatibility checks at startup;"
to = "das Host-ABI versionieren und Plugin-Kompatibilitaetspruefungen beim Start verlangen;"

[[phrase]]
from = "support per-vhost and per-route plugin attachment."
to = "Plugin-Anhaengung pro vhost und pro Route unterstuetzen."

[[phrase]]
from = "Compatibility does not mean every existing plugin should run unchanged. The security boundary and host-call behavior must stay explicit."
to = "Kompatibilitaet bedeutet nicht, dass jedes bestehende Plugin unveraendert laufen sollte. Sicherheitsgrenze und Host-Call-Verhalten muessen explizit bleiben."

