[[phrase]]
from = "Fluxheim resolves direct proxy upstream names when selecting an upstream peer for a request. If a Podman DNS name is temporarily missing, Fluxheim returns an upstream failure for that request instead of panicking the worker. Keep Fluxheim and its upstream containers on the same user-defined network, and avoid using load-balancer pools for container names that are expected to appear only after Fluxheim has already started until dynamic pool re-resolution is promoted to a stable feature."
to = "Fluxheim loest direkte Proxy-Upstream-Namen auf, wenn es einen Upstream-Peer fuer eine Anfrage auswaehlt. Wenn ein Podman-DNS-Name temporaer fehlt, gibt Fluxheim fuer diese Anfrage einen Upstream-Fehler zurueck, statt den Worker paniken zu lassen. Halte Fluxheim und seine Upstream-Container im selben user-defined Netzwerk und vermeide Load-Balancer-Pools fuer Container-Namen, die erst nach Fluxheims Start erscheinen sollen, bis dynamische Pool-Re-Resolution als stabiles Feature promoted ist."

