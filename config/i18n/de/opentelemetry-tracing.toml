to = "explizites Overflow-Verhalten unterstuetzen:"

[[phrase]]
from = "never block request workers on collector availability;"
to = "Request-Worker nie durch Collector-Verfuegbarkeit blockieren;"

[[phrase]]
from = "use HTTPS for remote collectors unless the network is already isolated and authenticated;"
to = "HTTPS fuer entfernte Collector verwenden, ausser das Netzwerk ist bereits isoliert und authentifiziert;"

[[phrase]]
from = "redact all configured sensitive fields before export."
to = "alle konfigurierten sensiblen Felder vor dem Export redigieren."

[[phrase]]
from = "The exporter supports HTTP and HTTPS. Keep loopback HTTP for local collectors; use HTTPS for collector endpoints that cross a host or container trust boundary. When no private CA bundle is configured, the HTTPS client uses the bundled WebPKI roots. Plaintext HTTP to a non-loopback collector logs a startup warning."
to = "Der Exporter unterstuetzt HTTP und HTTPS. Loopback-HTTP fuer lokale Collector beibehalten; HTTPS fuer Collector-Endpunkte verwenden, die eine Host- oder Container-Vertrauensgrenze ueberschreiten. Wenn kein privates CA-Bundle konfiguriert ist, nutzt der HTTPS-Client die gebuendelten WebPKI-Roots. Klartext-HTTP zu einem Nicht-Loopback-Collector protokolliert beim Start eine Warnung."

