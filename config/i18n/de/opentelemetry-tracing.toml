[[phrase]]
from = "Stage 3: OTLP Trace Export"
to = "Stufe 3: OTLP-Trace-Export"

[[phrase]]
from = "Trace export is optional and intended to send data to a local OpenTelemetry Collector or tracing backend. Prometheus can receive OTLP metrics over HTTP when its OTLP receiver is enabled, but it is not the direct trace storage target."
to = "Trace-Export ist optional und dafuer gedacht, Daten an einen lokalen OpenTelemetry Collector oder ein Tracing-Backend zu senden. Prometheus kann OTLP-Metriken ueber HTTP empfangen, wenn sein OTLP-Receiver aktiviert ist, ist aber nicht das direkte Trace-Speicherziel."

