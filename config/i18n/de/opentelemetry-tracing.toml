[[phrase]]
from = "Tracing is different from metrics and logs. Metrics show aggregate behavior, logs record events, and traces explain the path of a specific request through Fluxheim and its upstream services."
to = "Tracing unterscheidet sich von Metriken und Logs. Metriken zeigen aggregiertes Verhalten, Logs zeichnen Ereignisse auf, und Traces erklaeren den Weg einer bestimmten Anfrage durch Fluxheim und seine Upstream-Dienste."

[[phrase]]
from = "Design Goals"
to = "Designziele"

[[phrase]]
from = "Keep OpenTelemetry code out of default builds."
to = "OpenTelemetry-Code aus Standard-Builds heraushalten."

[[phrase]]
from = "Use W3C Trace Context propagation."
to = "W3C-Trace-Context-Propagation verwenden."

[[phrase]]
from = "Correlate access logs, security events, and traces through a trace ID."
to = "Access Logs, Sicherheitsereignisse und Traces ueber eine Trace-ID korrelieren."

[[phrase]]
from = "Pair new operational observability with Prometheus metrics where practical: metrics provide aggregate service health, while OpenTelemetry explains the request path behind those aggregate signals."
to = "Neue betriebliche Observability, wo sinnvoll, mit Prometheus-Metriken koppeln: Metriken liefern aggregierte Service-Health, waehrend OpenTelemetry den Anfragepfad hinter diesen aggregierten Signalen erklaert."

[[phrase]]
from = "Keep tracing overhead bounded through sampling and background export."
to = "Tracing-Overhead durch Sampling und Hintergrundexport begrenzen."

[[phrase]]
from = "Avoid storing secrets, cookies, authorization headers, raw request bodies, or high-cardinality labels in spans."
to = "Secrets, Cookies, Authorization-Header, rohe Request-Bodies oder Labels mit hoher Kardinalitaet nicht in Spans speichern."

[[phrase]]
from = "Make tracing incompatible with"
to = "Tracing inkompatibel machen mit"

[[phrase]]
from = "unless a future privacy-preserve propagation-only mode is explicitly designed."
to = "sofern nicht ein zukuenftiger datenschutzwahrender Nur-Propagation-Modus explizit entworfen wird."

