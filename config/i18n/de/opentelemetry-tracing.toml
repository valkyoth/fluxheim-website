to = "Server-Spans auf Request-Ebene mit Trace-ID, neu erzeugter Span-ID, optionaler Parent-Span-ID, Methode, vhost, aufgeloestem Routennamen, Status, Fehler-Flag, Body-Byte-Zaehlern, Cache-Phase/-Timing, Kompressions-Encoding und PHP-FPM-Ergebnis, wenn diese Module einkompiliert sind."

