to = "Wenn Release-Nachweise auf einem Host gesammelt werden, der nicht jedes FIPS-Backend bauen kann, nutze die Evidence-Skips pro Backend und hänge die fehlenden Backend-Nachweise vom unterstützten Builder an. Beispielsweise können Compiler von Rolling-Distributionen zu neu sein für"

[[phrase]]
from = "For stable or release-candidate builds, prefer the stable gate:"
to = "Für stabile Builds oder Release-Candidate-Builds das Stable Gate bevorzugen:"

[[phrase]]
from = "mode this stable gate is intentionally tag-blocking for container images: it runs the root image smoke plus representative Debian and Alpine variant image smokes before a tag should be pushed. Use"
to = "Modus ist dieses Stable Gate absichtlich tag-blockierend für Container-Images: Es führt den Root-Image-Smoke sowie repräsentative Debian- und Alpine-Varianten-Smokes aus, bevor ein Tag gepusht werden sollte. Nutze"

[[phrase]]
from = "when the release needs full local variant evidence. Use"
to = "wenn das Release vollständige lokale Varianten-Nachweise braucht. Nutze"

[[phrase]]
