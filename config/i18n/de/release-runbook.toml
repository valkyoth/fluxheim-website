to = "nur wenn gleichwertige Image-Nachweise bereits auf einem anderen Builder gesammelt wurden. Setze"

[[phrase]]
from = "to also build and run the focused load-balancer image against two local origins before tagging."
to = "um vor dem Tagging auch das fokussierte Load-Balancer-Image gegen zwei lokale Origins zu bauen und auszuführen."

[[phrase]]
from = "and later lines this stable gate includes the proxy cache and local observability smoke suites, plus compile and packaged-config checks for the published image profiles. That keeps cache, Prometheus/OpenTelemetry basics, and focused image feature wiring covered by the same command used for release evidence."
to = "und spätere Linien enthält dieses Stable Gate die Proxy-Cache- und lokalen Observability-Smoke-Suites sowie Compile- und Packaged-Config-Prüfungen für die veröffentlichten Image-Profile. Damit bleiben Cache, Prometheus-/OpenTelemetry-Grundlagen und fokussierte Image-Feature-Verdrahtung durch denselben Befehl abgedeckt, der für Release-Nachweise genutzt wird."

[[phrase]]
from = "reports a known upstream advisory that cannot be fixed in this repository yet, record it explicitly in the release notes with the package, advisory ID, impact, and removal condition."
to = "ein bekanntes Upstream-Advisory meldet, das in diesem Repository noch nicht behoben werden kann, erfasse es explizit in den Release Notes mit Paket, Advisory-ID, Auswirkung und Entfernungsbedingung."

