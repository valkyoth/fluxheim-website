to = "wiederholte providerseitige Ablehnung, Lag oder methodenspezifische Fehler erkennen und Read-Traffic zu gesuenderen Alternativen routen;"
[[phrase]]
from = "support optional quorum/compare mode for selected immutable reads, where Fluxheim asks multiple upstreams and only caches/returns data when responses agree;"
to = "optionalen Quorum-/Compare-Modus fuer ausgewaehlte unveraenderliche Reads unterstuetzen, bei dem Fluxheim mehrere Upstreams fragt und Daten nur cached/zurueckgibt, wenn Responses uebereinstimmen;"
[[phrase]]
