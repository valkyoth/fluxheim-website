to = "Fehlerhaftes JSON je nach Policy ablehnen oder durchreichen:"
[[phrase]]
from = "strict mode rejects malformed JSON before upstream;"
to = "Strict Mode lehnt fehlerhaftes JSON vor dem Upstream ab;"
[[phrase]]
