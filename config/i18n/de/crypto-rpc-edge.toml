[[phrase]]
from = "Crypto RPC Edge — Fluxheim Source Docs"
to = "Crypto-RPC-Edge - Fluxheim-Source-Dokumentation"
[[phrase]]
from = "Crypto RPC Edge"
to = "Crypto-RPC-Edge"
[[phrase]]
from = "Status: future optional module family."
to = "Status: kuenftige optionale Modulfamilie."
[[phrase]]
from = "The crypto RPC edge track is a future Fluxheim module family for running blockchain-aware RPC gateways in front of local nodes or hosted-compatible upstreams. It should be designed as focused compile-time modules, not as part of the default web/proxy build."
to = "Der Crypto-RPC-Edge-Track ist eine kuenftige Fluxheim-Modulfamilie fuer blockchainbewusste RPC-Gateways vor lokalen Nodes oder hosterkompatiblen Upstreams. Er sollte als fokussierte Compile-Time-Module entworfen werden, nicht als Teil des Standard-Web-/Proxy-Builds."
[[phrase]]
from = "The first concrete target is"
to = "Das erste konkrete Ziel ist"
[[phrase]]
from = ": native Ethereum/EVM JSON-RPC reverse proxying, bounded caching, and node-health-aware routing. A later"
to = ": natives Ethereum-/EVM-JSON-RPC-Reverse-Proxying, begrenztes Caching und node-health-bewusstes Routing. Ein spaeteres"
[[phrase]]
from = "review can evaluate ENS contenthash routing, but that should remain separate until the Ethereum RPC edge module is stable. Bitcoin, Cardano, and XRPL can use the same broad architecture later, but their finality, method policy, and transport models are different enough that they should be separate modules."
to = "Review kann ENS-contenthash-Routing bewerten, sollte aber getrennt bleiben, bis das Ethereum-RPC-Edge-Modul stabil ist. Bitcoin, Cardano und XRPL koennen spaeter dieselbe breite Architektur nutzen, aber ihre Finality-, Methoden-Policy- und Transportmodelle unterscheiden sich genug, um separate Module zu sein."
