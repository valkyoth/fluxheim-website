[[phrase]]
from = "Build cache keys from chain id, method, normalized params, and finality state."
to = "Cache-Keys aus Chain-ID, Methode, normalisierten Params und Finality-Zustand bilden."
[[phrase]]
from = "Never cache responses with JSON-RPC"
to = "Responses mit JSON-RPC"
[[phrase]]
from = "unless an explicit method policy says the error is immutable and safe."
to = "nie cachen, ausser eine explizite Methoden-Policy sagt, dass der Fehler unveraenderlich und sicher ist."
[[phrase]]
from = "Normalize upstream response handling so Fluxheim can remove hop-by-hop headers and apply existing response policy."
to = "Upstream-Response-Handling normalisieren, damit Fluxheim Hop-by-Hop-Header entfernen und die bestehende Response-Policy anwenden kann."
[[phrase]]
from = "Support multi-provider upstream pools so applications are not coupled to one centralized RPC provider."
to = "Multi-Provider-Upstream-Pools unterstuetzen, damit Anwendungen nicht an einen zentralisierten RPC-Provider gekoppelt sind."
[[phrase]]
from = "Batch behavior should be conservative. A batch is cacheable only when every call in the batch is individually cacheable under the current policy. Mixed cacheable/non-cacheable batches should pass through without storing, or be split only after a later design proves response ordering and error behavior."
to = "Batch-Verhalten sollte konservativ sein. Ein Batch ist nur cachebar, wenn jeder Call im Batch unter der aktuellen Policy einzeln cachebar ist. Gemischte cachebare/nicht cachebare Batches sollten ohne Speicherung durchgereicht oder erst nach einem spaeteren Design gesplittet werden, das Response-Reihenfolge und Fehlerverhalten beweist."
[[phrase]]
from = "Cacheable Method Policy"
to = "Policy fuer cachebare Methoden"
[[phrase]]
from = "Ethereum JSON-RPC is POST-heavy, so normal HTTP cache semantics are not enough. The"
to = "Ethereum-JSON-RPC ist POST-lastig, daher reichen normale HTTP-Cache-Semantiken nicht aus. Das"
[[phrase]]
