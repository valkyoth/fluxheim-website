[[phrase]]
from = "WebSocket sticky-routing primitives."
to = "WebSocket-Sticky-Routing-Primitive."
[[phrase]]
from = "It must not contain Ethereum-, Bitcoin-, Cardano-, or XRPL-specific cache rules. Each chain module owns its own method allow-list, finality model, cache admission rules, health probes, and WebSocket/subscription behavior."
to = "Es darf keine Ethereum-, Bitcoin-, Cardano- oder XRPL-spezifischen Cache-Regeln enthalten. Jedes Chain-Modul besitzt seine eigene Methoden-Allowlist, sein Finality-Modell, seine Cache-Admission-Regeln, Health-Probes und sein WebSocket-/Subscription-Verhalten."
[[phrase]]
from = "Why Ethereum First"
to = "Warum Ethereum zuerst"
[[phrase]]
from = "Ethereum/EVM is the cleanest first target because dApps commonly use standard HTTP/WebSocket JSON-RPC, redundant POST traffic is common, and the execution API exposes block tags such as"
to = "Ethereum/EVM ist das sauberste erste Ziel, weil dApps haeufig Standard-HTTP-/WebSocket-JSON-RPC nutzen, redundanter POST-Traffic verbreitet ist und die Execution-API Block-Tags wie"
[[phrase]]
from = "Those tags make cache safety easier to reason about than a generic blockchain proxy."
to = "Diese Tags machen Cache-Sicherheit leichter nachvollziehbar als bei einem generischen Blockchain-Proxy."
[[phrase]]
from = "Compile-Time Shape"
to = "Compile-Time-Form"
[[phrase]]
from = "Initial Ethereum-focused feature shape:"
to = "Anfaengliche Ethereum-fokussierte Feature-Form:"
[[phrase]]
from = "and any future crypto RPC module must remain absent from default, PHP, static-site, cache-edge, proxy-edge, privacy, and load-balancer builds unless selected explicitly. The default reverse proxy must not parse JSON-RPC bodies or pull chain-specific dependencies."
to = "und jedes kuenftige Crypto-RPC-Modul muessen in Default-, PHP-, Static-Site-, Cache-Edge-, Proxy-Edge-, Privacy- und Load-Balancer-Builds fehlen, sofern sie nicht explizit ausgewaehlt werden. Der Standard-Reverse-Proxy darf keine JSON-RPC-Bodies parsen oder chainspezifische Abhaengigkeiten ziehen."
[[phrase]]
from = "Possible later dependencies, after license/advisory review:"
to = "Moegliche spaetere Abhaengigkeiten nach Lizenz-/Advisory-Review:"
[[phrase]]
from = "or narrow Alloy crates for Ethereum JSON-RPC types;"
to = "oder schmale Alloy-Crates fuer Ethereum-JSON-RPC-Typen;"
[[phrase]]
from = "only if Fluxheim needs client-side calls beyond simple health probes;"
to = "nur wenn Fluxheim clientseitige Calls ueber einfache Health-Probes hinaus braucht;"
[[phrase]]
from = "a small local JSON-RPC classifier if the supported cacheable method set stays narrow enough to audit."
to = "ein kleiner lokaler JSON-RPC-Klassifizierer, wenn die unterstuetzte cachebare Methodengruppe klein genug fuer ein Audit bleibt."
[[phrase]]
from = "Avoid exposing third-party Ethereum types in public Fluxheim config. Config should stay plain TOML with strings, numbers, durations, and byte sizes."
to = "Keine Drittanbieter-Ethereum-Typen in oeffentlicher Fluxheim-Konfiguration offenlegen. Konfiguration sollte schlichtes TOML mit Strings, Zahlen, Dauern und Byte-Groessen bleiben."
[[phrase]]
from = "must be a separate compile-time feature because proof verification adds consensus, trie, precompile, and ZK-related dependencies that should not be pulled into a normal RPC cache/proxy build."
to = "muss ein separates Compile-Time-Feature sein, weil Proof-Verifikation Consensus-, Trie-, Precompile- und ZK-bezogene Abhaengigkeiten hinzufuegt, die nicht in einen normalen RPC-Cache-/Proxy-Build gezogen werden sollten."
