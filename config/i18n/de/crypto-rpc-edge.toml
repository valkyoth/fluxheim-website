to = "Hosted-Provider-Fallback explizit halten, damit Fluxheim Traffic, der lokal bleiben sollte, nicht stillschweigend zentralisiert."
[[phrase]]
from = "WebSocket Scope"
to = "WebSocket-Scope"
[[phrase]]
from = "WebSocket support should be beta after HTTP JSON-RPC caching is stable."
to = "WebSocket-Unterstuetzung sollte Beta sein, nachdem HTTP-JSON-RPC-Caching stabil ist."
[[phrase]]
from = "Rules:"
to = "Regeln:"
[[phrase]]
from = "sessions are never cacheable."
to = "Sessions sind nie cachebar."
[[phrase]]
from = "A WebSocket connection must stay pinned to one upstream."
to = "Eine WebSocket-Verbindung muss an einen Upstream gepinnt bleiben."
[[phrase]]
from = "If the upstream disconnects, Fluxheim should close the downstream connection rather than silently resubscribe unless an explicit resubscribe policy exists."
to = "Wenn der Upstream trennt, sollte Fluxheim die Downstream-Verbindung schliessen, statt still erneut zu abonnieren, sofern keine explizite Resubscribe-Policy existiert."
[[phrase]]
