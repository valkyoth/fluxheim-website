to = "oder ein kuenftiges Rate-Limit-Modul aktiviert ist;"
[[phrase]]
from = "request and response timeout controls;"
to = "Request- und Response-Timeout-Kontrollen;"
[[phrase]]
from = "response size limit;"
to = "Response-Groessenlimit;"
[[phrase]]
from = "cache-key length and cardinality bounds;"
to = "Cache-Key-Laengen- und Kardinalitaetsgrenzen;"
[[phrase]]
from = "optional stripping of sensitive request headers before upstream;"
to = "optionales Entfernen sensibler Request-Header vor dem Upstream;"
[[phrase]]
from = "no logging of full request params by default, because params may include addresses, calldata, signatures, or business-sensitive contract state."
to = "standardmaessig kein Logging vollstaendiger Request-Params, weil Params Adressen, Calldata, Signaturen oder geschaeftssensiblen Contract-State enthalten koennen."
[[phrase]]
from = "Do not expose upstream execution clients directly to arbitrary debug/admin namespaces through a broad allow-list. The default policy should allow only standard public read methods and explicitly selected write methods."
to = "Upstream-Execution-Clients nicht direkt ueber eine breite Allowlist beliebigen debug-/admin-Namespaces aussetzen. Die Default-Policy sollte nur standardmaessige oeffentliche Read-Methoden und explizit ausgewaehlte Write-Methoden erlauben."
[[phrase]]
from = "Privacy And Anonymity Research"
to = "Privacy- und Anonymitaetsforschung"
[[phrase]]
from = "Crypto RPC privacy is a separate problem from caching and load balancing. A normal reverse proxy can hide the user's IP address from the upstream provider, but the gateway itself can still see the requester, method, params, timing, and response unless the design deliberately removes or blinds that information."
to = "Crypto-RPC-Privacy ist ein separates Problem gegenueber Caching und Load Balancing. Ein normaler Reverse-Proxy kann die IP-Adresse des Benutzers vor dem Upstream-Provider verbergen, aber das Gateway selbst kann weiterhin Requester, Methode, Params, Timing und Response sehen, sofern das Design diese Informationen nicht bewusst entfernt oder blindet."
[[phrase]]
from = "Initial privacy-preserving controls should be practical and honest:"
to = "Anfaengliche privacy-wahrende Kontrollen sollten praktisch und ehrlich sein:"
[[phrase]]
from = "never log full params, responses, calldata, signatures, addresses, or transaction hashes by default;"
to = "standardmaessig nie vollstaendige Params, Responses, Calldata, Signaturen, Adressen oder Transaktions-Hashes loggen;"
[[phrase]]
from = "strip client-identifying headers before upstream unless explicitly allowed;"
to = "clientidentifizierende Header vor dem Upstream entfernen, sofern nicht explizit erlaubt;"
[[phrase]]
from = "support cache-only answers for finalized/immutable data, where Fluxheim can answer without contacting an upstream for that request;"
to = "Cache-only-Antworten fuer finalized/unveraenderliche Daten unterstuetzen, bei denen Fluxheim ohne Upstream-Kontakt fuer diesen Request antworten kann;"
[[phrase]]
from = "provide a privacy mode that rejects non-cacheable or identifying methods rather than forwarding them;"
to = "einen Privacy-Modus bereitstellen, der nicht cachebare oder identifizierende Methoden ablehnt, statt sie weiterzuleiten;"
[[phrase]]
from = "keep metrics cardinality-safe and avoid labels for addresses, hashes, contracts, ENS names, or raw method params;"
to = "Metriken kardinalitaetssicher halten und Labels fuer Adressen, Hashes, Contracts, ENS-Namen oder rohe Methoden-Params vermeiden;"
[[phrase]]
from = "document retention behavior for access logs, traces, cache metadata, and upstream health probes."
to = "Retention-Verhalten fuer Access-Logs, Traces, Cache-Metadaten und Upstream-Health-Probes dokumentieren."
[[phrase]]
from = "\"Verifiably anonymized\" RPC should remain research/beta until Fluxheim can state and test a real threat model. Candidate future designs:"
to = "\"Nachweisbar anonymisiertes\" RPC sollte Forschung/Beta bleiben, bis Fluxheim ein echtes Threat Model benennen und testen kann. Kandidaten fuer kuenftige Designs:"
[[phrase]]
from = "blind or relay-based read queries where the public gateway cannot link the external client identity to the upstream query;"
to = "blinde oder relaybasierte Read-Queries, bei denen das oeffentliche Gateway die externe Client-Identitaet nicht mit der Upstream-Query verknuepfen kann;"
[[phrase]]
from = "anonymous credential or token-bucket rate limiting that does not identify the caller to the RPC gateway;"
to = "anonyme Credential- oder Token-Bucket-Rate-Limits, die den Aufrufer gegenueber dem RPC-Gateway nicht identifizieren;"
[[phrase]]
from = "privacy-preserving audit proofs showing that request bodies and identifying headers were not logged."
to = "privacy-wahrende Audit-Proofs, die zeigen, dass Request-Bodies und identifizierende Header nicht geloggt wurden."
[[phrase]]
from = "Verification Co-Processing"
to = "Verifikations-Co-Processing"
[[phrase]]
from = "Goal: allow Fluxheim to verify selected blockchain-derived data at the edge before returning or caching it. Instead of trusting one RPC provider's response, Fluxheim can fetch proofs, verify them against a trusted block header or light-client state, and then return data with stronger integrity guarantees."
to = "Ziel: Fluxheim ermoeglichen, ausgewaehlte blockchainabgeleitete Daten am Edge zu verifizieren, bevor sie zurueckgegeben oder gecacht werden. Statt der Response eines einzelnen RPC-Providers zu vertrauen, kann Fluxheim Proofs abrufen, sie gegen einen vertrauenswuerdigen Block-Header oder Light-Client-Zustand verifizieren und dann Daten mit staerkeren Integritaetsgarantien zurueckgeben."
[[phrase]]
from = "Candidate verification modes:"
to = "Kandidaten fuer Verifikationsmodi:"
[[phrase]]
from = "Ethereum account/storage proof verification through"
to = "Ethereum-Account-/Storage-Proof-Verifikation ueber"
[[phrase]]
from = "using Merkle-Patricia trie proofs against a known state root."
to = "mit Merkle-Patricia-Trie-Proofs gegen eine bekannte State Root."
[[phrase]]
from = "Receipt or transaction inclusion checks against block bodies/receipts roots where proof material is available and bounded."
to = "Receipt- oder Transaktions-Inclusion-Checks gegen Block-Bodies/Receipts-Roots, wenn Proof-Material verfuegbar und begrenzt ist."
[[phrase]]
from = "Header verification through an embedded or sidecar light client such as a Helios-style model."
to = "Header-Verifikation ueber einen eingebetteten oder Sidecar-Light-Client wie ein Helios-artiges Modell."
[[phrase]]
from = "ZK proof verification for application-specific state claims where a mature verifier and proof format exist."
to = "ZK-Proof-Verifikation fuer anwendungsspezifische State-Claims, wenn ein ausgereifter Verifier und ein Proof-Format existieren."
[[phrase]]
from = "Candidate config shape:"
to = "Kandidaten-Konfigurationsform:"
[[phrase]]
from = "Verification must be explicit per method or route."
to = "Verifikation muss pro Methode oder Route explizit sein."
[[phrase]]
from = "Verification failure must default to fail-closed for protected methods."
to = "Verifikationsfehler muessen fuer geschuetzte Methoden standardmaessig fail-closed sein."
[[phrase]]
from = "Stale light-client checkpoints must make protected verification unavailable rather than silently falling back to provider trust."
to = "Veraltete Light-Client-Checkpoints muessen geschuetzte Verifikation unverfuegbar machen, statt still auf Provider-Vertrauen zurueckzufallen."
[[phrase]]
from = "Metrics must report verification result classes without labeling addresses, storage slots, transaction hashes, or raw proof identifiers."
to = "Metriken muessen Verifikations-Ergebnisklassen melden, ohne Adressen, Storage-Slots, Transaktions-Hashes oder rohe Proof-Identifier als Labels zu nutzen."
[[phrase]]
from = "Dependency guidance:"
to = "Abhaengigkeitsleitlinien:"
[[phrase]]
from = "Do not implement cryptographic proof systems from scratch."
to = "Kryptografische Proof-Systeme nicht von Grund auf implementieren."
[[phrase]]
from = "Open questions:"
to = "Offene Fragen:"
[[phrase]]
from = "Whether verification should run in-process, in a worker pool, or in a separate sidecar to isolate expensive proof work."
to = "Ob Verifikation in-process, in einem Worker-Pool oder in einem separaten Sidecar laufen sollte, um teure Proof-Arbeit zu isolieren."
[[phrase]]
from = "How to represent verified responses to downstream clients without inventing a misleading trust signal."
to = "Wie verifizierte Responses fuer Downstream-Clients dargestellt werden koennen, ohne ein irrefuehrendes Vertrauenssignal zu erfinden."
[[phrase]]
from = "How to combine proof verification with privacy-preserving RPC modes, since proof requests can themselves reveal the queried account/storage key."
to = "Wie Proof-Verifikation mit privacy-wahrenden RPC-Modi kombiniert werden kann, da Proof-Requests selbst den abgefragten Account-/Storage-Key offenlegen koennen."
[[phrase]]
from = "Light-client/header trust model is documented and tested."
to = "Light-Client-/Header-Trust-Model ist dokumentiert und getestet."
[[phrase]]
from = "Malformed, oversized, deeply nested, and inconsistent proofs fail safely."
to = "Fehlerhafte, uebergrosse, tief verschachtelte und inkonsistente Proofs schlagen sicher fehl."
[[phrase]]
from = "Verification timeout/cancellation is covered by tests."
to = "Verifikations-Timeout/-Cancellation ist durch Tests abgedeckt."
[[phrase]]
from = "Avoid labels for account addresses, transaction hashes, block hashes, raw contract addresses, or ENS names."
to = "Labels fuer Account-Adressen, Transaktions-Hashes, Block-Hashes, rohe Contract-Adressen oder ENS-Namen vermeiden."
[[phrase]]
from = "Chain health probes and upstream failover for read-only calls."
to = "Chain-Health-Probes und Upstream-Failover fuer Read-only-Calls."
[[phrase]]
from = "malformed JSON, oversized batches, unknown methods, and oversized responses are covered by tests;"
to = "fehlerhaftes JSON, uebergrosse Batches, unbekannte Methoden und uebergrosse Responses sind durch Tests abgedeckt;"
[[phrase]]
from = "docs include migration examples for Geth, Erigon, Reth, and hosted fallback."
to = "Docs enthalten Migrationsbeispiele fuer Geth, Erigon, Reth und Hosted-Fallback."
[[phrase]]
from = "Browsers do not normally resolve raw"
to = "Browser loesen rohe"
[[phrase]]
from = "names through DNS."
to = "Namen normalerweise nicht ueber DNS auf."
[[phrase]]
from = "because Bitcoin's safety model is based on confirmations and chain depth, not Ethereum's"
to = "weil Bitcoins Sicherheitsmodell auf Confirmations und Chain-Tiefe basiert, nicht auf Ethereums"
[[phrase]]
from = "Cardano support is feasible, but it is not a small variation of Ethereum RPC."
to = "Cardano-Support ist machbar, aber keine kleine Variante von Ethereum-RPC."
[[phrase]]
from = "XRPL exposes HTTP JSON-RPC and WebSocket APIs and has a useful distinction between current/open ledgers and validated ledgers."
to = "XRPL stellt HTTP-JSON-RPC- und WebSocket-APIs bereit und unterscheidet nuetzlich zwischen current/open Ledgers und validated Ledgers."
[[phrase]]
from = "preventing account/ledger identifiers from becoming high-cardinality metrics labels."
to = "verhindern, dass Account-/Ledger-Identifier zu hochkardinalen Metrik-Labels werden."
