[[phrase]]
from = "Pingora-exit continuation that shrinks the root compatibility surface and splits native health checks into HTTP/gRPC, database, exec, and TCP/TLS transport helpers with stronger probe bounds."
to = "Pingora-Exit-Fortsetzung, die die Root-Kompatibilitätsfläche verkleinert und native Health Checks in HTTP/gRPC-, Datenbank-, Exec- und TCP/TLS-Transporthelfer mit stärkeren Probe-Grenzen aufteilt."

[[phrase]]
from = "Native HTTP/2 upstream client primitive with bounded headers, bodies, trailers, request/response deadlines, and h2 tests for trailer, reset, size, and flow-control behavior."
to = "Native HTTP/2-Upstream-Client-Primitive mit begrenzten Headern, Bodies, Trailern, Request-/Response-Deadlines und h2-Tests für Trailer-, Reset-, Größen- und Flow-Control-Verhalten."

[[phrase]]
from = "Native HTTP/1.1 upstream pooling release with bounded keepalive reuse, pool-size config, upstream idle timeout handling, conservative no-reuse guards, and real socket reuse/expiry tests."
to = "Native HTTP/1.1-Upstream-Pooling-Version mit begrenzter Keepalive-Wiederverwendung, Poolgrößen-Konfiguration, Upstream-Idle-Timeout-Handling, konservativen No-Reuse-Schutzregeln und echten Socket-Reuse-/Expiry-Tests."

[[phrase]]
from = "Native HTTP/2 hardening release with reusable h2 connection primitives, response trailers, response-write lifetime, handler timeout, bounded DATA capacity, prohibited header/trailer rejection, and request-body zeroization."
to = "Native HTTP/2-Hardening-Version mit wiederverwendbaren h2-Verbindungsprimitiven, Response-Trailern, Response-Write-Lifetime, Handler-Timeout, begrenzter DATA-Kapazität, Ablehnung verbotener Header/Trailer und Request-Body-Zeroization."

[[phrase]]
from = "Native HTTP/2 preview gate with bounded header/body/stream/frame/send-buffer policy, h2 stack probe tests, and native HTTP/1.0 socket behavior coverage."
to = "Natives HTTP/2-Preview-Gate mit begrenzter Header-/Body-/Stream-/Frame-/Send-Buffer-Policy, h2-Stack-Probe-Tests und nativer HTTP/1.0-Socket-Verhaltensabdeckung."

[[phrase]]
from = "Native HTTP/1 protocol foundation with bounded request-head parsing, body-framing classification, Host validation, persistence classification, chunked decoding, and response-head parsing."
to = "Native HTTP/1-Protokollbasis mit begrenztem Request-Head-Parsing, Body-Framing-Klassifizierung, Host-Validierung, Persistenzklassifizierung, Chunked-Decoding und Response-Head-Parsing."

