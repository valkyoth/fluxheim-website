[[phrase]]
from = "Fluxheim accepts HTTPS OpenBao URLs, plus loopback HTTP URLs for local testing. Non-loopback plaintext HTTP OpenBao addresses are rejected. Transit encrypt/decrypt calls do not follow HTTP redirects, and Transit JSON responses are read through a bounded buffer before parsing so a compromised or misconfigured OpenBao endpoint cannot stream unbounded response bodies into the cache process."
to = "Fluxheim akzeptiert HTTPS-OpenBao-URLs sowie Loopback-HTTP-URLs fuer lokale Tests. Nicht-Loopback-Plaintext-HTTP-OpenBao-Adressen werden abgelehnt. Transit-Encrypt-/Decrypt-Aufrufe folgen keinen HTTP-Redirects, und Transit-JSON-Responses werden vor dem Parsen ueber einen begrenzten Buffer gelesen, damit ein kompromittierter oder falsch konfigurierter OpenBao-Endpoint keine unbegrenzten Response-Bodies in den Cache-Prozess streamen kann."

