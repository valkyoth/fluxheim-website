[[phrase]]
from = "Cache Encryption"
to = "Cache-Verschluesselung"

[[phrase]]
from = "What Gets Encrypted"
to = "Was verschluesselt wird"

[[phrase]]
from = "Cache encryption wraps objects stored by"
to = "Cache-Verschluesselung kapselt Objekte, die von"

[[phrase]]
from = ". It works with both disk backends:"
to = "gespeichert werden. Sie funktioniert mit beiden Disk-Backends:"

[[phrase]]
from = ": each persisted cache object is encrypted before it is written to its object file."
to = ": jedes persistierte Cache-Objekt wird verschluesselt, bevor es in seine Objektdatei geschrieben wird."

[[phrase]]
from = ": each persisted cache object is encrypted before it is placed into a bin file."
to = ": jedes persistierte Cache-Objekt wird verschluesselt, bevor es in eine Bin-Datei gelegt wird."

[[phrase]]
from = "Memory cache remains plaintext inside the Fluxheim process. In a tiered memory-plus-disk cache, memory hits stay fast and the persisted disk copy is encrypted at rest."
to = "Der Memory-Cache bleibt innerhalb des Fluxheim-Prozesses Klartext. In einem gestuften Memory-plus-Disk-Cache bleiben Memory-Hits schnell und die persistierte Disk-Kopie ist at-rest verschluesselt."

[[phrase]]
from = "The same encryption layer applies to reverse-proxy cache responses and to local/static cache responses when the selected cache policy has"
to = "Dieselbe Verschluesselungsschicht gilt fuer Reverse-Proxy-Cache-Responses und fuer lokale/statische Cache-Responses, wenn die ausgewaehlte Cache-Policy"

[[phrase]]
from = "Providers"
to = "Provider"

[[phrase]]
from = "uses AES-256-GCM with a 64-character hex key loaded from one safe file or credential. It is simple and fast, but Fluxheim must be able to read the raw cache key at startup. Filesystem disk-cache fills use bounded encrypted chunks with this provider, preserving the streaming memory profile of plain filesystem cache writes."
to = "nutzt AES-256-GCM mit einem 64-Zeichen-Hex-Key, der aus einer sicheren Datei oder Credential geladen wird. Das ist einfach und schnell, aber Fluxheim muss den rohen Cache-Key beim Start lesen koennen. Filesystem-Disk-Cache-Fills nutzen mit diesem Provider begrenzte verschluesselte Chunks und bewahren das Streaming-Memory-Profil einfacher Filesystem-Cache-Writes."

[[phrase]]
from = "sends object bytes to OpenBao Transit"
to = "sendet Objekt-Bytes an OpenBao-Transit-"

[[phrase]]
from = "endpoints and stores only the returned"
to = "Endpunkte und speichert nur den zurueckgegebenen"

[[phrase]]
from = "ciphertext in the cache backend. Use this when key custody, audit trails, and centralized rotation matter more than the added call latency on disk-cache reads and writes. Because the Transit API encrypts one complete plaintext value per request, Fluxheim caps concurrent OpenBao encrypted commit heap usage and can refuse a large cache fill under pressure rather than buffering too many objects at once."
to = "Ciphertext im Cache-Backend. Nutze dies, wenn Key-Custody, Audit-Trails und zentrale Rotation wichtiger sind als die zusaetzliche Aufruflatenz bei Disk-Cache-Reads und Writes. Da die Transit-API einen kompletten Klartextwert pro Request verschluesselt, begrenzt Fluxheim die gleichzeitige Heap-Nutzung verschluesselter OpenBao-Commits und kann unter Druck einen grossen Cache-Fill ablehnen, statt zu viele Objekte gleichzeitig zu puffern."

[[phrase]]
from = "Both providers bind the configured"
to = "Beide Provider binden die konfigurierte"

[[phrase]]
from = "and the combined cache key as authenticated data. A stored encrypted object cannot be silently moved to a different cache key."
to = "und den kombinierten Cache-Key als authentifizierte Daten. Ein gespeichertes verschluesseltes Objekt kann nicht unbemerkt zu einem anderen Cache-Key verschoben werden."

