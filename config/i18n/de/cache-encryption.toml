from = "Local Validation"
to = "Lokale Validierung"

[[phrase]]
from = "Run the local-key storage-bin smoke without external services:"
to = "Den Local-Key-Storage-Bin-Smoke ohne externe Dienste ausfuehren:"

[[phrase]]
from = "Run the optional OpenBao Transit smoke with Podman:"
to = "Den optionalen OpenBao-Transit-Smoke mit Podman ausfuehren:"

[[phrase]]
from = "The OpenBao smoke starts a disposable OpenBao dev container, enables Transit, creates a cache key, runs Fluxheim against a local origin, verifies"
to = "Der OpenBao-Smoke startet einen wegwerfbaren OpenBao-Dev-Container, aktiviert Transit, erstellt einen Cache-Key, fuehrt Fluxheim gegen einen lokalen Origin aus, verifiziert"

[[phrase]]
from = "and checks that the cache object contains Transit ciphertext rather than the plaintext response body."
to = "und prueft, dass das Cache-Objekt Transit-Ciphertext statt des Klartext-Response-Bodys enthaelt."

[[phrase]]
from = "Keep cache encryption opt-in. It adds CPU work for local-key encryption and network/service dependency for OpenBao Transit."
to = "Cache-Verschluesselung opt-in halten. Sie fuegt CPU-Arbeit fuer Local-Key-Verschluesselung und eine Netzwerk-/Dienstabhaengigkeit fuer OpenBao Transit hinzu."

[[phrase]]
from = "Prefer the local provider when large filesystem cache fills must preserve streaming memory behavior; OpenBao Transit is a whole-object external crypto boundary by design."
to = "Den lokalen Provider bevorzugen, wenn grosse Filesystem-Cache-Fills das Streaming-Memory-Verhalten bewahren muessen; OpenBao Transit ist bewusst eine externe Whole-Object-Krypto-Grenze."

[[phrase]]
from = "for high-churn encrypted caches that would otherwise create many small encrypted object files."
to = "fuer verschluesselte High-Churn-Caches bevorzugen, die sonst viele kleine verschluesselte Objektdateien erzeugen wuerden."

[[phrase]]
from = "Use memory plus encrypted disk when hot objects should remain fast but disk persistence must be protected."
to = "Memory plus verschluesselte Disk nutzen, wenn heisse Objekte schnell bleiben sollen, aber Disk-Persistenz geschuetzt werden muss."

[[phrase]]
from = "as cache-object authentication metadata. Changing it is a cache namespace cutover."
to = "als Authentifizierungsmetadaten fuer Cache-Objekte behandeln. Das Aendern ist ein Cache-Namespace-Cutover."

[[phrase]]
from = "Keep cache-status headers disabled in normal production responses unless they are needed for debugging."
to = "Cache-Status-Header in normalen Produktionsantworten deaktiviert lassen, ausser sie werden fuer Debugging benoetigt."

