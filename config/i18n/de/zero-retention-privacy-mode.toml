[[phrase]]
from = "Zero-Retention Privacy Mode — Fluxheim Source Docs"
to = "Zero-Retention-Privacy-Modus - Fluxheim-Source-Dokumentation"

[[phrase]]
from = "Zero-Retention Privacy Mode"
to = "Zero-Retention-Privacy-Modus"

[[phrase]]
from = "Zero-retention privacy mode is a future compile-time build profile for users who want Fluxheim to serve static files and reverse-proxy requests without persisting request logs, client IPs, request metadata, or per-client telemetry."
to = "Der Zero-Retention-Privacy-Modus ist ein kuenftiges Compile-Time-Build-Profil fuer Nutzer, die Fluxheim statische Dateien ausliefern und Requests reverse-proxyen lassen wollen, ohne Request-Logs, Client-IPs, Request-Metadaten oder Telemetrie pro Client zu speichern."

[[phrase]]
from = "This is the better name for the requested \"dark mode\": the goal is not visual appearance, but no application-level retention."
to = "Dies ist der bessere Name fuer den angefragten \"Dark Mode\": Ziel ist nicht das visuelle Erscheinungsbild, sondern keine Retention auf Anwendungsebene."

[[phrase]]
from = "Honest Boundary"
to = "Ehrliche Grenze"

[[phrase]]
from = "Fluxheim cannot be literally zero-knowledge at the network layer. A TCP/TLS server necessarily sees the peer address transiently while accepting and routing a connection. The operating system, container runtime, firewall, CDN, and upstream applications may also log traffic."
to = "Fluxheim kann auf Netzwerkebene nicht wortwoertlich Zero-Knowledge sein. Ein TCP/TLS-Server sieht die Peer-Adresse zwangslaeufig transient, waehrend er eine Verbindung annimmt und routet. Betriebssystem, Container-Runtime, Firewall, CDN und Upstream-Anwendungen koennen Traffic ebenfalls loggen."

[[phrase]]
from = "The privacy-mode guarantee should be scoped to Fluxheim itself:"
to = "Die Privacy-Mode-Garantie sollte auf Fluxheim selbst begrenzt sein:"

[[phrase]]
from = "no Fluxheim access logs;"
to = "keine Fluxheim-Access-Logs;"

[[phrase]]
from = "no Fluxheim request audit logs;"
to = "keine Fluxheim-Request-Audit-Logs;"

[[phrase]]
from = "no Fluxheim request metrics;"
to = "keine Fluxheim-Request-Metriken;"

[[phrase]]
from = "no persisted client IPs;"
to = "keine gespeicherten Client-IPs;"

[[phrase]]
from = "no persisted request paths, user agents, cookies, request IDs, or real-IP headers;"
to = "keine gespeicherten Request-Pfade, User-Agents, Cookies, Request-IDs oder Real-IP-Header;"

[[phrase]]
from = "no Fluxheim disk cache of proxied responses;"
to = "kein Fluxheim-Disk-Cache fuer proxied Responses;"

[[phrase]]
from = "no client-IP forwarding to upstreams by default."
to = "standardmaessig kein Client-IP-Forwarding an Upstreams."

[[phrase]]
from = "Operators still need to configure the OS, Podman/systemd, firewall, CDN, and upstream services consistently if they want a whole deployment to be zero-retention."
to = "Operatoren muessen OS, Podman/systemd, Firewall, CDN und Upstream-Dienste weiterhin konsistent konfigurieren, wenn ein ganzes Deployment Zero-Retention sein soll."

