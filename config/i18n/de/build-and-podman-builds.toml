[[phrase]]
from = "The OpenSSL feature makes Fluxheim fail closed, loads the OpenSSL FIPS provider, enables default FIPS properties for the process, and exposes provider/default property diagnostics. The rustls/AWS-LC candidate installs or passes the rustls FIPS provider and checks rustls&#x27; FIPS indicators for required configs. Either deployment still needs the selected module&#x27;s CMVP certificate, Security Policy, provider/build configuration, and platform evidence. See"
to = "Das OpenSSL-Feature laesst Fluxheim fail-closed arbeiten, laedt den OpenSSL-FIPS-Provider, aktiviert Default-FIPS-Properties fuer den Prozess und stellt Provider-/Default-Property-Diagnosen bereit. Der rustls-/AWS-LC-Kandidat installiert oder uebergibt den rustls-FIPS-Provider und prueft rustls-FIPS-Indikatoren fuer erforderliche Konfigurationen. Beide Deployments brauchen weiterhin das CMVP-Zertifikat des ausgewaehlten Moduls, Security Policy, Provider-/Build-Konfiguration und Plattformnachweise. Siehe"

[[phrase]]
from = "also closes other non-TLS crypto paths in FIPS/ISO-required mode: provider-backed admin auth is allowed in OpenSSL FIPS or rustls/AWS-LC FIPS builds, while local cache encryption, managed ACME, and remote/HTTPS OTLP export are rejected unless the path is non-secret, numeric-local-loopback-only, or externally evidenced as documented in the FIPS guide."
to = "schliesst im FIPS-/ISO-erforderlichen Modus auch andere Non-TLS-Crypto-Pfade: provider-backed Admin-Auth ist in OpenSSL-FIPS- oder rustls-/AWS-LC-FIPS-Builds erlaubt, waehrend lokale Cache-Verschluesselung, Managed ACME und Remote-/HTTPS-OTLP-Export abgelehnt werden, sofern der Pfad nicht non-secret, numeric-local-loopback-only oder extern wie im FIPS-Guide dokumentiert nachgewiesen ist."

