to = "transformierte Ausgabe nie cachen, wenn Request- oder Response-Policy Cache-Control: no-store sagt."

[[phrase]]
from = "Security Requirements"
to = "Sicherheitsanforderungen"

[[phrase]]
from = "The module is disabled by default at compile time and runtime."
to = "Das Modul ist zur Compile-Zeit und zur Laufzeit standardmaessig deaktiviert."

[[phrase]]
from = "Transform policy must be explicit per vhost or route."
to = "Die Transformations-Policy muss pro Vhost oder Route explizit sein."

[[phrase]]
from = "Only configured content types and extensions are eligible."
to = "Nur konfigurierte Content-Types und Erweiterungen sind zulaessig."

[[phrase]]
from = "Do not transform untrusted arbitrary binary responses."
to = "Keine nicht vertrauenswuerdigen beliebigen Binaerantworten transformieren."

[[phrase]]
from = "Do not process images from admin, metrics, ACME, CGI, PHP, or legacy listeners."
to = "Keine Bilder aus Admin-, Metrics-, ACME-, CGI-, PHP- oder Legacy-Listenern verarbeiten."

[[phrase]]
from = "Reject oversized metadata, malformed files, decoder errors, and unsupported formats with 415 Unsupported Media Type or a configured safe error."
to = "Uebergrosse Metadaten, fehlerhafte Dateien, Decoderfehler und nicht unterstuetzte Formate mit 415 Unsupported Media Type oder einem konfigurierten sicheren Fehler ablehnen."

[[phrase]]
from = "Strip EXIF/GPS/comment metadata by default."
to = "EXIF-/GPS-/Kommentar-Metadaten standardmaessig entfernen."

[[phrase]]
from = "Do not log raw image bytes or full source URLs with sensitive queries."
to = "Keine rohen Bildbytes oder vollstaendigen Source-URLs mit sensiblen Queries loggen."

[[phrase]]
from = "Codec dependencies require license and advisory review before enabling the module in release builds."
to = "Codec-Abhaengigkeiten brauchen Lizenz- und Advisory-Review, bevor das Modul in Release-Builds aktiviert wird."

[[phrase]]
from = "FFI-backed codecs must be behind separate feature flags and never included in default builds."
to = "FFI-gestuetzte Codecs muessen hinter separaten Feature-Flags liegen und duerfen nie in Standard-Builds enthalten sein."

