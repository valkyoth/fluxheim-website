to = "Transformations-Timeout."

[[phrase]]
from = "All limits must be enforced before decoding where possible and immediately after header parsing when dimensions are known. If dimensions are not known without a full decode, the request should use the stricter input-byte and timeout limits."
to = "Alle Limits muessen wo moeglich vor dem Decoding und unmittelbar nach dem Header-Parsing erzwungen werden, wenn Dimensionen bekannt sind. Wenn Dimensionen ohne vollstaendiges Decoding nicht bekannt sind, soll die Anfrage die strengeren Eingabebyte- und Timeout-Limits nutzen."

