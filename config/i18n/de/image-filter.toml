[[phrase]]
from = "Status: future optional module."
to = "Status: kuenftiges optionales Modul."

[[phrase]]
from = "Planned Cargo feature: image-filter."
to = "Geplantes Cargo-Feature: image-filter."

[[phrase]]
from = "This module adds safe, bounded image validation and transformation at the edge. It is intended for small static sites, media-heavy origins, and cache-backed deployments that want predictable image variants without adding a separate image service."
to = "Dieses Modul ergaenzt sichere, begrenzte Bildvalidierung und Transformation am Edge. Es ist fuer kleine statische Sites, medienlastige Origins und cachegestuetzte Deployments gedacht, die vorhersagbare Bildvarianten ohne separaten Bilddienst wollen."

[[phrase]]
from = "Design Goals"
to = "Designziele"

[[phrase]]
from = "Keep image transformation code out of the default binary."
to = "Bildtransformationscode aus dem Standard-Binary heraushalten."

[[phrase]]
from = "Enable per-vhost and per-route policies."
to = "Policies pro Vhost und pro Route ermoeglichen."

[[phrase]]
from = "Support static files and proxied origin responses."
to = "Statische Dateien und proxied Origin-Antworten unterstuetzen."

[[phrase]]
from = "Transform only explicitly allowed image content types."
to = "Nur ausdruecklich erlaubte Bild-Content-Types transformieren."

[[phrase]]
from = "Bound input bytes, decoded pixels, output bytes, CPU time, and concurrency."
to = "Eingabebytes, decodierte Pixel, Ausgabebytes, CPU-Zeit und Nebenlaeufigkeit begrenzen."

[[phrase]]
from = "Integrate with cache keys so transformed variants are isolated and purgeable."
to = "In Cache-Keys integrieren, damit transformierte Varianten isoliert und loeschbar sind."

[[phrase]]
from = "Prefer memory-safe Rust codecs where practical."
to = "Wo praktikabel speichersichere Rust-Codecs bevorzugen."

