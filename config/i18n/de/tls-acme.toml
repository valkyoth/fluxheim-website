[[phrase]]
from = "EAB — External Account Binding"
to = "EAB - External Account Binding"

[[phrase]]
from = "Some ACME CAs (such as Actalis) require External Account Binding credentials. Configure EAB in the ACME issuer section."
to = "Einige ACME-CAs (zum Beispiel Actalis) verlangen External-Account-Binding-Zugangsdaten. Konfiguriere EAB im ACME-Issuer-Abschnitt."

