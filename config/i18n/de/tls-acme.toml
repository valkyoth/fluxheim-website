to = "<p>Siehe <code>examples/acme-actalis.toml</code> im Repository für ein vollständig funktionierendes Beispiel.</p>"

[[phrase]]
from = "TLS Policy Profiles"
to = "TLS-Policy-Profile"

[[phrase]]
from = "Fluxheim supports two TLS policy profiles that control cipher suite and protocol version selection:"
to = "Fluxheim unterstützt zwei TLS-Policy-Profile, die Cipher-Suite- und Protokollversionsauswahl steuern:"

[[phrase]]
from = "— TLS 1.3 only. Strongest security. May not support very old clients."
to = "- Nur TLS 1.3. Stärkste Sicherheit. Unterstützt sehr alte Clients möglicherweise nicht."

[[phrase]]
from = "— TLS 1.2 + 1.3. Broader client compatibility. Follows Mozilla intermediate guidelines."
to = "- TLS 1.2 + 1.3. Breitere Client-Kompatibilität. Folgt den Mozilla-Intermediate-Richtlinien."

[[phrase]]
from = "<p>See <code>examples/tls-modern.toml</code> and <code>examples/tls-intermediate.toml</code> in the repository for checked policy examples.</p>"
to = "<p>Siehe <code>examples/tls-modern.toml</code> und <code>examples/tls-intermediate.toml</code> im Repository für geprüfte Policy-Beispiele.</p>"

[[phrase]]
from = "Important:"
to = "Wichtig:"

[[phrase]]
from = "<p><strong>Important:</strong> Set <code>strict_transport_security</code> in <code>[headers.response]</code> only when TLS is configured and working. An incorrect HSTS header on an HTTP-only host can make it unreachable.</p>"
to = "<p><strong>Wichtig:</strong> Setze <code>strict_transport_security</code> in <code>[headers.response]</code> nur, wenn TLS konfiguriert ist und funktioniert. Ein falscher HSTS-Header auf einem reinen HTTP-Host kann ihn unerreichbar machen.</p>"

[[phrase]]
from = "in the repository for a complete working example."
to = "im Repository fuer ein vollstaendig funktionierendes Beispiel."

[[phrase]]
from = "in the repository for checked policy examples."
to = "im Repository fuer gepruefte Policy-Beispiele."

[[phrase]]
from = "only when TLS is configured and working. An incorrect HSTS header on an HTTP-only host can make it unreachable."
to = "nur, wenn TLS konfiguriert ist und funktioniert. Ein falscher HSTS-Header auf einem reinen HTTP-Host kann ihn unerreichbar machen."
