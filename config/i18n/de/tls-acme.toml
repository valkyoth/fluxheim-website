[[phrase]]
from = "Fluxheim ships with rustls as the default TLS backend and full managed ACME support for automatic certificate issuance and renewal."
to = "Fluxheim wird mit rustls als Standard-TLS-Backend und vollständiger verwalteter ACME-Unterstützung für automatische Zertifikatsausstellung und -erneuerung ausgeliefert."

[[phrase]]
from = "TLS Backends"
to = "TLS-Backends"

[[phrase]]
from = "TLS backends are compile-time selections. Exactly one backend must be chosen when TLS is needed. Selecting more than one is a compile error."
to = "TLS-Backends werden zur Compile-Zeit ausgewählt. Wenn TLS benötigt wird, muss genau ein Backend gewählt werden. Mehr als eines auszuwählen ist ein Compile-Fehler."

