to = "Gibt Diagnoseausgaben aus, die OpenSSL-Version, Provider-Verfuegbarkeit und Default-FIPS-Property-Status zeigen."
[[phrase]]
from = "Install an OpenSSL build and FIPS provider covered by a CMVP certificate."
to = "Installieren Sie einen OpenSSL-Build und FIPS-Provider, die von einem CMVP-Zertifikat abgedeckt sind."
[[phrase]]
from = "Provide the OpenSSL config/module paths using the mechanism required by the module and operating system, commonly"
to = "Stellen Sie die OpenSSL-Konfigurations-/Modulpfade ueber den vom Modul und Betriebssystem geforderten Mechanismus bereit, ueblicherweise"
[[phrase]]
from = "property query without enabling OpenSSL global FIPS default properties. FIPS-required runtime startup then enables OpenSSL default FIPS properties for the process-default library context, verifies"
to = "Property-Abfrage, ohne globale OpenSSL-FIPS-Default-Properties zu aktivieren. Der FIPS-required-Runtime-Start aktiviert danach OpenSSL-Default-FIPS-Properties fuer den process-default Library-Kontext, prueft"
[[phrase]]
from = "Provider handles are intentionally kept loaded for the process lifetime. Moving between FIPS-required and non-FIPS TLS operation is a process-restart boundary, not a hot-reload boundary."
to = "Provider-Handles bleiben absichtlich fuer die Lebensdauer des Prozesses geladen. Der Wechsel zwischen FIPS-required- und Nicht-FIPS-TLS-Betrieb ist eine Prozessneustart-Grenze, keine Hot-Reload-Grenze."
[[phrase]]
from = "Fluxheim does not hardcode a provider directory. It lets OpenSSL use the platform's normal provider search rules, including"
to = "Fluxheim hardcodiert kein Provider-Verzeichnis. Es laesst OpenSSL die normalen Provider-Suchregeln der Plattform nutzen, einschliesslich"
[[phrase]]
from = "This is a native-code dependency boundary."
