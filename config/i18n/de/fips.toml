locale_id = "de-DE"
html_lang = "de-DE"
[[phrase]]
from = "FIPS-Capable Deployment — Fluxheim Source Docs"
to = "FIPS-faehiges Deployment - Fluxheim-Source-Dokumentation"
[[phrase]]
from = "FIPS / ISO-Capable Deployments"
to = "FIPS-/ISO-faehige Deployments"
[[phrase]]
from = "This document defines Fluxheim's FIPS 140-3 and ISO/IEC 19790 direction. It is intentionally strict about language: Fluxheim can provide FIPS/ISO-capable builds and fail-closed configuration enforcement, but Fluxheim itself is not a validated cryptographic module."
to = "Dieses Dokument definiert Fluxheims FIPS-140-3- und ISO/IEC-19790-Richtung. Es ist absichtlich streng in der Sprache: Fluxheim kann FIPS-/ISO-faehige Builds und Fail-Closed-Konfigurationserzwingung bereitstellen, aber Fluxheim selbst ist kein validiertes kryptografisches Modul."
[[phrase]]
from = "For a real FIPS-required deployment, the operator must use a cryptographic module validated by the NIST/CCCS Cryptographic Module Validation Program (CMVP), operate that module in its approved mode, and follow the module's published Security Policy."
to = "Fuer ein echtes FIPS-erforderliches Deployment muss der Operator ein kryptografisches Modul verwenden, das vom NIST/CCCS Cryptographic Module Validation Program (CMVP) validiert wurde, dieses Modul im genehmigten Modus betreiben und der veroeffentlichten Security Policy des Moduls folgen."
[[phrase]]
from = "Current release line:"
to = "Aktuelle Release-Linie:"
[[phrase]]
from = "Official References"
to = "Offizielle Referenzen"
[[phrase]]
from = "Fluxheim's FIPS work should be tracked against these primary sources:"
to = "Fluxheims FIPS-Arbeit sollte gegen diese Primaerquellen verfolgt werden:"
[[phrase]]
from = "Compliance Boundary"
to = "Compliance-Grenze"
[[phrase]]
from = "FIPS validation attaches to a cryptographic module and its tested operating environment, not to a web server merely because it links a library."
to = "FIPS-Validierung haengt an einem kryptografischen Modul und seiner getesteten Betriebsumgebung, nicht an einem Webserver nur deshalb, weil er eine Bibliothek linkt."
[[phrase]]
from = "Fluxheim can be responsible for:"
to = "Fluxheim kann verantwortlich sein fuer:"
[[phrase]]
from = "Selecting a TLS backend compiled for a FIPS-capable module path."
to = "Auswahl eines TLS-Backends, das fuer einen FIPS-faehigen Modulpfad kompiliert wurde."
[[phrase]]
from = "Restricting TLS protocol versions, cipher suites, groups, signatures, and certificate/key policy to NIST-approved settings."
to = "Beschraenkung von TLS-Protokollversionen, Cipher Suites, Gruppen, Signaturen und Zertifikats-/Key-Policy auf NIST-genehmigte Einstellungen."
[[phrase]]
from = "Triggering or verifying the selected backend's approved/FIPS mode where the backend exposes that check."
to = "Ausloesen oder Verifizieren des genehmigten/FIPS-Modus des gewaehlten Backends, wenn das Backend diese Pruefung offenlegt."
[[phrase]]
from = "Rejecting configs that request non-approved cryptography while FIPS-required mode is enabled."
to = "Ablehnen von Konfigurationen, die nicht genehmigte Kryptografie anfordern, waehrend FIPS-required-Modus aktiviert ist."
[[phrase]]
from = "Keeping Fluxheim-owned security-sensitive cryptography off non-validated fallback crates in FIPS-required builds."
to = "Fluxheim-eigene sicherheitssensitive Kryptografie in FIPS-required-Builds von nicht validierten Fallback-Crates fernhalten."
[[phrase]]
from = "Operators remain responsible for:"
to = "Operatoren bleiben verantwortlich fuer:"
[[phrase]]
from = "Choosing a CMVP-validated module with an active certificate appropriate for their environment."
to = "Auswahl eines CMVP-validierten Moduls mit aktivem Zertifikat, das zu ihrer Umgebung passt."
[[phrase]]
from = "Installing exactly the module build covered by the selected Security Policy."
to = "Exakte Installation des Modul-Builds, der von der gewaehlten Security Policy abgedeckt ist."
[[phrase]]
from = "Maintaining operational evidence for auditors."
to = "Pflege betrieblicher Nachweise fuer Auditoren."
[[phrase]]
from = "Fluxheim's status and diagnostic output are application indicators. They are not a replacement for the validated module's own service indicators, self-test status, or laboratory evidence."
to = "Fluxheims Status- und Diagnoseausgaben sind Anwendungsindikatoren. Sie ersetzen nicht die eigenen Service-Indikatoren, den Self-Test-Status oder Labor-Nachweise des validierten Moduls."
[[phrase]]
