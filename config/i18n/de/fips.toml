[[phrase]]
from = "Whether the approved-mode indicator comes from Fluxheim, the validated crypto module, or an external service."
to = "Ob der Approved-Mode-Indikator von Fluxheim, dem validierten Kryptomodul oder einem externen Dienst kommt."
[[phrase]]
from = "The exact error state and operator action when a provider check, self-test, or configuration guard fails."
to = "Der genaue Fehlerzustand und die Operator-Aktion, wenn ein Provider-Check, Self-Test oder Konfigurationsschutz fehlschlaegt."
[[phrase]]
from = "Request IDs and trace correlation IDs are treated as non-secret diagnostic identifiers. They are not used as authentication tokens, authorization decisions, key material, or SSPs."
to = "Request-IDs und Trace-Correlation-IDs werden als nicht geheime Diagnosekennungen behandelt. Sie werden nicht als Authentifizierungstoken, Autorisierungsentscheidungen, Schluesselmaterial oder SSPs genutzt."
[[phrase]]
from = "Temporary object names are used for collision resistance and race hardening, not for authentication or cryptographic secrecy. The OS RNG remains part of the deployment environment evidence."
to = "Temporaere Objektnamen werden fuer Kollisionsresistenz und Race-Hardening genutzt, nicht fuer Authentifizierung oder kryptografische Geheimhaltung. Der Betriebssystem-RNG bleibt Teil der Nachweise zur Deployment-Umgebung."
[[phrase]]
from = "Test and development certificate generation is not production evidence and must not be used to claim a regulated deployment boundary."
to = "Test- und Entwicklungs-Zertifikatserzeugung ist kein Produktionsnachweis und darf nicht genutzt werden, um eine regulierte Deployment-Grenze zu beanspruchen."
[[phrase]]
from = "Admin authentication needs a provider-routed MAC or a different externally-evidenced authentication boundary."
to = "Admin-Authentifizierung benoetigt einen provider-gerouteten MAC oder eine andere extern nachgewiesene Authentifizierungsgrenze."
[[phrase]]
from = "Managed ACME needs provider-routed account key generation, JWS account signing, External Account Binding HMAC, outbound ACME HTTPS transport, and challenge certificate handling, or it must remain outside strict FIPS/ISO-required deployments."
to = "Managed ACME benoetigt provider-geroutete Account-Key-Erzeugung, JWS-Account-Signierung, External-Account-Binding-HMAC, ausgehenden ACME-HTTPS-Transport und Challenge-Zertifikatsbehandlung, oder es muss ausserhalb strikter FIPS-/ISO-required-Deployments bleiben."
