to = "Beispiel fuer ein kuenftiges FIPS-required-TLS-Profil:"
[[phrase]]
from = "property query can fetch an approved cipher, enables OpenSSL default FIPS properties for the process, and verifies that the default fetch path rejects a non-FIPS cipher. The exact schema may grow when more backend proof fields are implemented. The important rule is fail closed: a FIPS/ISO-required config must not silently fall back to a non-validated provider or non-approved cipher."
to = "Property-Abfrage einen genehmigten Cipher abrufen kann, aktiviert OpenSSL-Default-FIPS-Properties fuer den Prozess und prueft, dass der Default-Abrufpfad einen Nicht-FIPS-Cipher ablehnt. Das genaue Schema kann wachsen, wenn weitere Backend-Proof-Felder implementiert werden. Die wichtige Regel ist Fail Closed: Eine FIPS-/ISO-required-Konfiguration darf nicht still auf einen nicht validierten Provider oder nicht genehmigten Cipher zurueckfallen."
[[phrase]]
from = "completes the OpenSSL FIPS-capable TLS proof path with an opt-in feature, runtime provider probe, and default-property enforcement; it still does not make a blanket FIPS-compliance claim for the deployment."
to = "vervollstaendigt den OpenSSL-FIPS-faehigen TLS-Proof-Pfad mit Opt-in-Feature, Runtime-Provider-Probe und Default-Property-Erzwingung; es erhebt weiterhin keinen pauschalen FIPS-Compliance-Anspruch fuer das Deployment."
[[phrase]]
from = "are intentionally small proof profiles. They are useful for local provider validation and release evidence, but they are not the only valid way to build a FIPS/ISO-capable Fluxheim binary."
to = "sind absichtlich kleine Proof-Profile. Sie sind nuetzlich fuer lokale Provider-Validierung und Release-Nachweise, aber sie sind nicht der einzige gueltige Weg, ein FIPS-/ISO-faehiges Fluxheim-Binary zu bauen."
[[phrase]]
from = "The recommended strict-boundary pattern is to use local/static certificate files generated and renewed by an approved external process. For conservative public-Web PKI evidence, configure that external process to use RSA 2048 or RSA 3072 certificate keys unless your assessor explicitly accepts an ECDSA profile and chain. Managed ACME can still be compiled into a FIPS-capable TLS binary by adding"
to = "Das empfohlene Strict-Boundary-Muster ist die Nutzung lokaler/statischer Zertifikatsdateien, die von einem genehmigten externen Prozess erzeugt und erneuert werden. Fuer konservative Public-Web-PKI-Nachweise konfigurieren Sie diesen externen Prozess fuer RSA-2048- oder RSA-3072-Zertifikatsschluessel, sofern Ihr Assessor nicht ausdruecklich ein ECDSA-Profil und eine ECDSA-Kette akzeptiert. Managed ACME kann weiterhin in ein FIPS-faehiges TLS-Binary kompiliert werden durch Hinzufuegen von"
[[phrase]]
from = "Requires OpenSSL 3.x behavior for the FIPS property query path."
to = "Erfordert OpenSSL-3.x-Verhalten fuer den FIPS-Property-Abfragepfad."
[[phrase]]
