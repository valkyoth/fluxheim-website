[[phrase]]
from = "<p>That gate fails when a Pingora crate is present without an exception, when an exception is stale, or when the current Fluxheim version has reached the exception&#x27;s <code>removal_target</code>. <code>cargo test</code> also runs <code>tests/pingora_dependency_policy.rs</code>, which checks the same removal targets against <code>Cargo.lock</code> so deadline drift is visible outside the release gate. Maintainers can test an upcoming release bump before editing <code>Cargo.toml</code> with:</p>"
to = "<p>Dieses Gate schlaegt fehl, wenn ein Pingora-Crate ohne Ausnahme vorhanden ist, wenn eine Ausnahme veraltet ist oder wenn die aktuelle Fluxheim-Version das <code>removal_target</code> der Ausnahme erreicht hat. <code>cargo test</code> fuehrt auch <code>tests/pingora_dependency_policy.rs</code> aus, das dieselben Entfernungsziele gegen <code>Cargo.lock</code> prueft, sodass Deadline-Drift ausserhalb des Release-Gates sichtbar ist. Maintainer koennen einen kommenden Release-Bump testen, bevor sie <code>Cargo.toml</code> bearbeiten, mit:</p>"

