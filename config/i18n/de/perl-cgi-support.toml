locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Perl CGI Support"
to = "Perl-CGI-Unterstuetzung"

[[phrase]]
from = "Perl CGI support is a future Fluxheim application-server milestone for legacy tools that still depend on RFC 3875 CGI execution. It must be opt-in at compile time and opt-in per vhost. It should not be part of the default runtime behavior because CGI executes local programs with request-controlled input."
to = "Perl-CGI-Unterstuetzung ist ein zukuenftiger Fluxheim-Application-Server-Meilenstein fuer Legacy-Werkzeuge, die noch von RFC-3875-CGI-Ausfuehrung abhaengen. Sie muss zur Compile-Zeit und pro vhost explizit aktiviert werden. Sie sollte nicht Teil des Standard-Laufzeitverhaltens sein, weil CGI lokale Programme mit request-gesteuerten Eingaben ausfuehrt."

[[phrase]]
from = "Current Recommendation"
to = "Aktuelle Empfehlung"

[[phrase]]
from = "The planned implementation path is"
to = "Der geplante Implementierungspfad ist"

[[phrase]]
from = ": high-level CGI implementation for Rust, MIT."
to = ": High-Level-CGI-Implementierung fuer Rust, MIT."

[[phrase]]
from = ": Tokio runtime support for CGI process execution, MIT."
to = ": Tokio-Runtime-Unterstuetzung fuer CGI-Prozessausfuehrung, MIT."

[[phrase]]
from = ": Unix resource limits, MIT."
to = ": Unix-Resource-Limits, MIT."

[[phrase]]
from = ": optional Linux path-based sandboxing, MIT OR Apache-2.0."
to = ": optionale Linux-pfadbasierte Sandbox, MIT OR Apache-2.0."

[[phrase]]
from = "The CGI module should use a normal external Perl interpreter first, for example"
to = "Das CGI-Modul sollte zuerst einen normalen externen Perl-Interpreter verwenden, zum Beispiel"

[[phrase]]
from = ", and should not embed Perl into Fluxheim. Process isolation is the main security boundary."
to = ", und Perl nicht in Fluxheim einbetten. Prozessisolation ist die wichtigste Sicherheitsgrenze."

[[phrase]]
from = "Compile-Time Features"
to = "Compile-Time-Features"

[[phrase]]
from = "Planned feature flags:"
to = "Geplante Feature-Flags:"

[[phrase]]
from = "The default binary should not enable Perl CGI. If a release profile later chooses to compile the module by default, runtime execution must still remain disabled unless a vhost explicitly enables it."
to = "Das Standard-Binary sollte Perl-CGI nicht aktivieren. Falls ein Release-Profil spaeter entscheidet, das Modul standardmaessig zu kompilieren, muss die Laufzeitausfuehrung trotzdem deaktiviert bleiben, ausser ein vhost aktiviert sie explizit."

[[phrase]]
from = "Config Shape"
to = "Konfigurationsform"

[[phrase]]
from = "Initial typed TOML target:"
to = "Anfaengliches typisiertes TOML-Ziel:"

[[phrase]]
from = "The CGI handler should run before normal static fallback for configured CGI paths. If CGI execution fails, Fluxheim must return an error response and must not serve the script source."
to = "Der CGI-Handler sollte fuer konfigurierte CGI-Pfade vor dem normalen statischen Fallback laufen. Wenn die CGI-Ausfuehrung fehlschlaegt, muss Fluxheim eine Fehlerantwort zurueckgeben und darf die Script-Quelle nicht ausliefern."

[[phrase]]
from = "Request Flow"
to = "Request-Ablauf"

[[phrase]]
from = "Match an enabled vhost CGI route."
to = "Eine aktivierte vhost-CGI-Route matchen."

[[phrase]]
from = "Resolve the requested script under the configured CGI root."
to = "Das angeforderte Script unterhalb der konfigurierten CGI-Root aufloesen."

[[phrase]]
from = "Canonicalize the root and script path."
to = "Root und Script-Pfad kanonisieren."

[[phrase]]
from = "Reject traversal, symlink escapes, hidden files, non-files, and scripts with unsafe permissions."
to = "Traversal, Symlink-Ausbrueche, versteckte Dateien, Nicht-Dateien und Scripts mit unsicheren Berechtigungen ablehnen."

[[phrase]]
from = "Build a strict CGI environment from the request."
to = "Aus dem Request eine strikte CGI-Umgebung bauen."

[[phrase]]
from = "Spawn the Perl interpreter with clean environment, configured uid/gid, resource limits, timeout, and optional Landlock restrictions."
to = "Den Perl-Interpreter mit sauberer Umgebung, konfigurierter uid/gid, Resource-Limits, Timeout und optionalen Landlock-Beschraenkungen starten."

[[phrase]]
from = "Pipe the bounded request body to stdin."
to = "Den begrenzten Request-Body nach stdin pipen."

[[phrase]]
from = "Parse stdout as CGI headers plus body."
to = "stdout als CGI-Header plus Body parsen."

[[phrase]]
from = "Capture stderr separately, cap it, sanitize it, and log it."
to = "stderr separat erfassen, begrenzen, bereinigen und loggen."

[[phrase]]
from = "Kill the process group on timeout, client cancellation, or output limit violation."
to = "Die Prozessgruppe bei Timeout, Client-Abbruch oder Output-Limit-Verletzung beenden."

[[phrase]]
from = "Security Requirements"
to = "Sicherheitsanforderungen"

[[phrase]]
from = "Before CGI is production eligible:"
to = "Bevor CGI produktionsreif ist:"

[[phrase]]
from = "CGI must be disabled unless both compile feature and vhost config enable it."
to = "CGI muss deaktiviert sein, ausser sowohl Compile-Feature als auch vhost-Konfiguration aktivieren es."

[[phrase]]
from = "must come from canonical path resolution, not string concatenation."
to = "muss aus kanonischer Pfadauflosung kommen, nicht aus String-Konkatenation."

[[phrase]]
from = "Dotfiles and hidden path segments are denied by default."
to = "Dotfiles und versteckte Pfadsegmente werden standardmaessig verweigert."

[[phrase]]
from = "Symlink escapes outside the CGI root are denied."
to = "Symlink-Ausbrueche ausserhalb der CGI-Root werden verweigert."

[[phrase]]
from = "Group/world-writable scripts are denied."
to = "Gruppen- oder weltbeschreibbare Scripts werden verweigert."

[[phrase]]
from = "The interpreter path must be absolute and validated at startup."
to = "Der Interpreter-Pfad muss absolut sein und beim Start validiert werden."

[[phrase]]
from = "The child environment starts empty by default."
to = "Die Child-Umgebung startet standardmaessig leer."

[[phrase]]
from = "Only strict RFC 3875 CGI variables are passed:"
to = "Nur strikte RFC-3875-CGI-Variablen werden uebergeben:"

[[phrase]]
from = ", and explicitly configured allow-list variables."
to = "und explizit konfigurierte Allow-List-Variablen."

[[phrase]]
from = "Incoming request body limits are enforced for declared and streaming bodies."
to = "Eingehende Request-Body-Limits werden fuer deklarierte und streamende Bodies durchgesetzt."

[[phrase]]
from = "CGI response headers have a hard byte limit."
to = "CGI-Response-Header haben ein hartes Byte-Limit."

[[phrase]]
from = "Malformed CGI headers, NUL bytes, and header injection are rejected."
to = "Fehlformatierte CGI-Header, NUL-Bytes und Header-Injection werden abgelehnt."

[[phrase]]
from = "stdout and stderr have independent byte caps."
to = "stdout und stderr haben unabhaengige Byte-Grenzen."

[[phrase]]
from = "stderr is sanitized before logging to avoid leaking secrets."
to = "stderr wird vor dem Logging bereinigt, um Secret-Leaks zu vermeiden."

[[phrase]]
from = "Child processes are spawned in their own process group where supported."
to = "Child-Prozesse werden, wo unterstuetzt, in ihrer eigenen Prozessgruppe gestartet."

[[phrase]]
from = "Timeouts kill the process group, not only the direct child."
to = "Timeouts beenden die Prozessgruppe, nicht nur das direkte Child."

[[phrase]]
from = "Resource limits should cover CPU, address space, file size, open files, and child processes."
to = "Resource-Limits sollten CPU, Address Space, Dateigroesse, offene Dateien und Child-Prozesse abdecken."

[[phrase]]
from = "Landlock, when enabled and available, should restrict file reads/writes to configured paths after all required files are opened."
to = "Landlock sollte, wenn aktiviert und verfuegbar, Datei-Lese-/Schreibzugriffe nach dem Oeffnen aller benoetigten Dateien auf konfigurierte Pfade beschraenken."

[[phrase]]
from = "Deployment Model"
to = "Deployment-Modell"

[[phrase]]
from = "The preferred deployment boundary is rootless Podman plus low-privilege Unix users inside the container. Fluxheim should not require privileged host access for CGI."
to = "Die bevorzugte Deployment-Grenze ist rootless Podman plus Unix-Benutzer mit niedrigen Rechten im Container. Fluxheim sollte fuer CGI keinen privilegierten Host-Zugriff benoetigen."

[[phrase]]
from = "can be documented as an advanced future option, but it should not be the primary security boundary because it needs privileges and careful filesystem construction."
to = "kann als erweiterte zukuenftige Option dokumentiert werden, sollte aber nicht die primaere Sicherheitsgrenze sein, weil es Privilegien und sorgfaeltigen Dateisystemaufbau benoetigt."

[[phrase]]
from = "Testing Plan"
to = "Testplan"

[[phrase]]
from = "Required tests before implementation is considered usable:"
to = "Erforderliche Tests, bevor die Implementierung als nutzbar gilt:"

[[phrase]]
from = "Compile checks with and without"
to = "Compile-Pruefungen mit und ohne"

[[phrase]]
from = "Config validation for unsafe interpreter paths, missing roots, bad limits, and remote/insecure writable paths."
to = "Konfigurationsvalidierung fuer unsichere Interpreter-Pfade, fehlende Roots, schlechte Limits und entfernte/unsichere beschreibbare Pfade."

[[phrase]]
from = "Path traversal and symlink escape tests."
to = "Tests fuer Path Traversal und Symlink-Ausbrueche."

[[phrase]]
from = "Denied source fallback tests."
to = "Tests fuer verweigerten Source-Fallback."

[[phrase]]
from = "Environment allow-list tests."
to = "Tests fuer Umgebungs-Allow-Lists."

[[phrase]]
from = "Timeout and process-kill tests."
to = "Tests fuer Timeout und Prozessbeendigung."

[[phrase]]
from = "stdout/stderr limit tests."
to = "stdout-/stderr-Limit-Tests."

[[phrase]]
from = "malformed header tests."
to = "Tests fuer fehlformatierte Header."

[[phrase]]
from = "request body limit tests for"
to = "Request-Body-Limit-Tests fuer"

[[phrase]]
from = "and streaming bodies."
to = "und streamende Bodies."

[[phrase]]
from = "rootless Podman smoke test with a tiny Perl CGI script."
to = "Rootless-Podman-Smoke-Test mit einem kleinen Perl-CGI-Script."

[[phrase]]
from = "Reload And Operations"
to = "Reload und Betrieb"

[[phrase]]
from = "CGI runtime settings should be process-upgrade changes until the process model is proven safe for snapshot-only reloads. Per-vhost route policy may later become snapshot-safe if it only changes immutable config and does not alter process pools, interpreter paths, uid/gid, Landlock policy, or resource limits."
to = "CGI-Laufzeiteinstellungen sollten Process-Upgrade-Aenderungen sein, bis das Prozessmodell als sicher fuer reine Snapshot-Reloads nachgewiesen ist. Per-vhost-Routenpolicy kann spaeter snapshot-sicher werden, wenn sie nur unveraenderliche Konfiguration aendert und keine Prozesspools, Interpreter-Pfade, uid/gid, Landlock-Policy oder Resource-Limits veraendert."

[[phrase]]
from = "Metrics should include CGI request totals, exit statuses, timeouts, output-limit violations, spawn failures, and stderr counts by vhost."
to = "Metriken sollten CGI-Request-Gesamtzahlen, Exit-Status, Timeouts, Output-Limit-Verletzungen, Spawn-Fehler und stderr-Zaehler nach vhost enthalten."

[[phrase]]
from = "headers are parsed explicitly."
to = "Header werden explizit geparst."

[[phrase]]
from = "is preserved, but header names and values are validated."
to = "bleibt erhalten, aber Header-Namen und -Werte werden validiert."
