[[phrase]]
from = "WAF Architecture — Fluxheim Source Docs"
to = "WAF-Architektur - Fluxheim-Source-Dokumentation"
[[phrase]]
from = "WAF Architecture"
to = "WAF-Architektur"
[[phrase]]
from = "Fluxheim WAF support is future optional security functionality. It must not be compiled into default builds. The normal secure default remains a small edge proxy/static server focused on strict protocol handling, TLS, cache, logging, and metrics."
to = "Fluxheim-WAF-Support ist kuenftige optionale Sicherheitsfunktionalitaet. Er darf nicht in Standard-Builds kompiliert werden. Der normale sichere Default bleibt ein kleiner Edge-Proxy/Static-Server mit Fokus auf strikter Protokollbehandlung, TLS, Cache, Logging und Metriken."
[[phrase]]
from = "The WAF goal is to provide a per-vhost request inspection layer that can block, score, or audit suspicious traffic without turning request workers into a slow or unbounded parsing path."
to = "Das WAF-Ziel ist eine Request-Inspection-Schicht pro Vhost, die verdaechtigen Traffic blockieren, bewerten oder auditieren kann, ohne Request-Worker in einen langsamen oder unbegrenzten Parsing-Pfad zu verwandeln."
[[phrase]]
from = "Long-term scope should cover the web-application security jobs operators expect from F5 BIG-IP ASM/Advanced WAF-class deployments, but through Fluxheim's optional modules and release gates. That includes signature/anomaly scoring, OWASP CRS-compatible rule paths where practical, positive-security policy over time, bot/reputation inputs, per-vhost dry-run/blocking modes, audit evidence, and integration points for load-balancer routing decisions. It is not part of the"
to = "Der langfristige Scope sollte die Web-Application-Security-Aufgaben abdecken, die Betreiber von Deployments der Klasse F5 BIG-IP ASM/Advanced WAF erwarten, aber ueber Fluxheims optionale Module und Release-Gates. Dazu gehoeren Signature-/Anomaly-Scoring, OWASP-CRS-kompatible Regelpfade, wo praktikabel, Positive-Security-Policy ueber die Zeit, Bot-/Reputation-Inputs, Dry-Run-/Blocking-Modi pro Vhost, Audit-Evidence und Integrationspunkte fuer Load-Balancer-Routing-Entscheidungen. Es ist nicht Teil des"
[[phrase]]
from = "load-balancer release."
to = "Load-Balancer-Releases."
[[phrase]]
