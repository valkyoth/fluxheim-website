to = "Schneller Weg fuer leere Platzhalter-Repositories"

[[phrase]]
from = "Use this only if the remote files are truly empty/placeholders and you are comfortable replacing them with the local Fluxheim project."
to = "Nutze dies nur, wenn die Remote-Dateien wirklich leer oder Platzhalter sind und du sie durch das lokale Fluxheim-Projekt ersetzen willst."

[[phrase]]
from = "<code>--force-with-lease</code> is safer than plain <code>--force</code> because it refuses to overwrite new remote commits you have not fetched."
to = "<code>--force-with-lease</code> ist sicherer als plain <code>--force</code>, weil es neue Remote-Commits nicht ueberschreibt, die du noch nicht gefetcht hast."

