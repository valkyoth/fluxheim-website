to = "Wenn das Projekt noch nicht initialisiert ist:"

[[phrase]]
from = "Fluxheim should keep <code>LICENSE</code> as <code>EUPL-1.2</code>. If the GitHub repository already has a different license file, decide before merging which license is authoritative."
to = "Fluxheim sollte <code>LICENSE</code> als <code>EUPL-1.2</code> behalten. Wenn das GitHub-Repository bereits eine andere Lizenzdatei hat, entscheide vor dem Merge, welche Lizenz massgeblich ist."

