[[phrase]]
from = "GitHub Repository Setup"
to = "GitHub-Repository-Einrichtung"

[[phrase]]
from = "This document explains how to connect this local Fluxheim folder to a GitHub repository that already contains placeholder files such as <code>.gitignore</code>, <code>README.md</code>, and <code>LICENSE</code>."
to = "Dieses Dokument erklaert, wie du diesen lokalen Fluxheim-Ordner mit einem GitHub-Repository verbindest, das bereits Platzhalterdateien wie <code>.gitignore</code>, <code>README.md</code> und <code>LICENSE</code> enthaelt."

