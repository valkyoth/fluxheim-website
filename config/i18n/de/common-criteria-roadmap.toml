to = "Klare Behandlung von Nicht-TLS-Kryptografie wie ACME, Cache-Verschluesselung, OpenBao, Request-IDs und ausgehendem HTTPS."
[[phrase]]
from = "Evidence showing whether crypto is internal, delegated to a validated module, or disabled in regulated profiles."
to = "Nachweise, die zeigen, ob Kryptografie intern ist, an ein validiertes Modul delegiert wird oder in regulierten Profilen deaktiviert ist."
