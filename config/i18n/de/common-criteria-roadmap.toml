[[phrase]]
from = "Structured access logs with request IDs."
to = "Strukturierte Access-Logs mit Request-IDs."
[[phrase]]
from = "Admin, config reload, self-healing, ACME, cache, TLS provider, and startup events."
to = "Admin-, Config-Reload-, Self-Healing-, ACME-, Cache-, TLS-Provider- und Startup-Events."
[[phrase]]
from = "Clear separation between security-relevant events and routine traffic noise."
to = "Klare Trennung zwischen sicherheitsrelevanten Events und routinemaessigem Traffic-Rauschen."
[[phrase]]
from = "Log size, retention, and redaction guidance for secrets and personal data."
to = "Anleitung zu Log-Groesse, Aufbewahrung und Redaction fuer Secrets und personenbezogene Daten."
[[phrase]]
from = "Failure behavior when logging sinks are unavailable."
to = "Fehlerverhalten, wenn Logging-Sinks nicht verfuegbar sind."
[[phrase]]
from = "Cryptographic Support"
to = "Kryptografische Unterstuetzung"
[[phrase]]
