locale_id = "de-DE"
html_lang = "de-DE"
[[phrase]]
from = "Common Criteria Roadmap"
to = "Common-Criteria-Roadmap"
[[phrase]]
from = "Common Criteria Readiness Roadmap"
to = "Common-Criteria-Readiness-Roadmap"
[[phrase]]
from = "This document tracks how Fluxheim can use ISO/IEC 15408:2026 concepts as an engineering and evidence framework. It is not a certification claim. Common Criteria evaluation is a product evaluation track, while FIPS 140-3 and ISO/IEC 19790 are cryptographic-module tracks. They can support each other, but they are not interchangeable."
to = "Dieses Dokument verfolgt, wie Fluxheim ISO/IEC-15408:2026-Konzepte als Engineering- und Nachweis-Framework nutzen kann. Es ist keine Zertifizierungsbehauptung. Eine Common-Criteria-Evaluierung ist ein Produktbewertungsweg, waehrend FIPS 140-3 und ISO/IEC 19790 Wege fuer kryptografische Module sind. Sie koennen einander stuetzen, sind aber nicht austauschbar."
[[phrase]]
from = "The practical value for Fluxheim is to make product boundaries, security functions, operator assumptions, tests, and lifecycle evidence explicit enough that a future Protection Profile or Security Target can be written without reconstructing years of engineering decisions."
to = "Der praktische Wert fuer Fluxheim besteht darin, Produktgrenzen, Sicherheitsfunktionen, Betreiberannahmen, Tests und Lifecycle-Nachweise so explizit zu machen, dass ein zukuenftiges Protection Profile oder Security Target geschrieben werden kann, ohne Jahre von Engineering-Entscheidungen zu rekonstruieren."
[[phrase]]
from = "Source Scope"
to = "Quellenumfang"
[[phrase]]
from = "The local reference set reviewed was the ISO/IEC 15408:2026 series:"
to = "Der lokal gepruefte Referenzsatz war die ISO/IEC-15408:2026-Reihe:"
[[phrase]]
from = "Part 1: introduction and general model."
to = "Teil 1: Einfuehrung und allgemeines Modell."
[[phrase]]
from = "Part 2: security functional components."
to = "Teil 2: funktionale Sicherheitskomponenten."
[[phrase]]
from = "Part 3: security assurance components."
to = "Teil 3: Sicherheits-Assurance-Komponenten."
[[phrase]]
from = "Part 4: evaluation methods and activities framework."
to = "Teil 4: Evaluierungsmethoden und Aktivitaeten-Framework."
[[phrase]]
from = "Part 5: predefined packages of security requirements."
to = "Teil 5: vordefinierte Pakete von Sicherheitsanforderungen."
[[phrase]]
from = "Do not copy licensed standard text into Fluxheim docs. Use this roadmap as a derived engineering checklist only."
to = "Kopieren Sie keinen lizenzierten Standardtext in Fluxheim-Dokumente. Verwenden Sie diese Roadmap nur als abgeleitete Engineering-Checkliste."
[[phrase]]
from = "Product Boundary"
to = "Produktgrenze"
[[phrase]]
from = "A future evaluation has to define the Target of Evaluation (TOE). Fluxheim should prepare for multiple possible TOE shapes:"
to = "Eine zukuenftige Evaluierung muss das Target of Evaluation (TOE) definieren. Fluxheim sollte sich auf mehrere moegliche TOE-Formen vorbereiten:"
[[phrase]]
from = "gateway binary only."
to = "nur Gateway-Binary."
[[phrase]]
from = "RPM installation including systemd units, default directories, and helper binaries."
to = "RPM-Installation einschliesslich systemd-Units, Default-Verzeichnissen und Helper-Binaries."
[[phrase]]
from = "Container image including entrypoint, base image, runtime filesystem layout, and"
to = "Container-Image einschliesslich Entrypoint, Basis-Image, Runtime-Dateisystemlayout und"
[[phrase]]
from = "FIPS/ISO OpenSSL profile where the validated OpenSSL provider is outside the Fluxheim TOE but part of the operational environment."
to = "FIPS/ISO-OpenSSL-Profil, bei dem der validierte OpenSSL-Provider ausserhalb des Fluxheim-TOE liegt, aber Teil der Betriebsumgebung ist."
[[phrase]]
from = "For each TOE shape, the evidence should identify:"
to = "Fuer jede TOE-Form sollten die Nachweise Folgendes identifizieren:"
[[phrase]]
from = "Physical and logical scope."
to = "Physischen und logischen Umfang."
[[phrase]]
from = "Required non-TOE hardware, software, firmware, services, and operator procedures."
to = "Erforderliche Nicht-TOE-Hardware, Software, Firmware, Services und Betreiberverfahren."
[[phrase]]
from = "Security functionality provided by Fluxheim itself."
to = "Sicherheitsfunktionalitaet, die Fluxheim selbst bereitstellt."
[[phrase]]
from = "Security functionality delegated to the operating system, OpenSSL, OpenBao, ACME issuer, container runtime, or external upstream."
to = "Sicherheitsfunktionalitaet, die an Betriebssystem, OpenSSL, OpenBao, ACME-Aussteller, Container-Runtime oder externen Upstream delegiert wird."
[[phrase]]
from = "Interfaces that are security-enforcing or security-supporting."
to = "Schnittstellen, die Sicherheit erzwingen oder unterstuetzen."
[[phrase]]
from = "Security Problem Definition"
to = "Definition des Sicherheitsproblems"
[[phrase]]
from = "Fluxheim should keep a living product-level security problem definition. It should not be limited to cryptography."
to = "Fluxheim sollte eine lebende Sicherheitsproblemdefinition auf Produktebene pflegen. Sie sollte nicht auf Kryptografie beschraenkt sein."
[[phrase]]
from = "Candidate assets:"
to = "Kandidaten-Assets:"
[[phrase]]
from = "TLS private keys and ACME account material."
to = "Private TLS-Schluessel und ACME-Kontomaterial."
[[phrase]]
from = "Admin bearer tokens and control-socket access."
to = "Admin-Bearer-Tokens und Control-Socket-Zugriff."
[[phrase]]
from = "Configuration snapshots and release artifacts."
to = "Konfigurations-Snapshots und Release-Artefakte."
[[phrase]]
from = "Cache encryption keys, object metadata, and cached response bodies."
to = "Cache-Verschluesselungsschluessel, Objektmetadaten und gecachte Response-Bodies."
[[phrase]]
from = "Request identity metadata, logs, traces, and metrics."
to = "Request-Identity-Metadaten, Logs, Traces und Metriken."
[[phrase]]
from = "PHP-FPM request parameters and spooled request bodies."
to = "PHP-FPM-Request-Parameter und gespulte Request-Bodies."
[[phrase]]
from = "Candidate threat classes:"
to = "Kandidaten-Bedrohungsklassen:"
[[phrase]]
from = "Remote request smuggling, routing bypass, cache poisoning, header injection, path traversal, request-body exhaustion, and protocol downgrade."
to = "Remote Request Smuggling, Routing-Bypass, Cache Poisoning, Header Injection, Path Traversal, Request-Body-Erschoepfung und Protokoll-Downgrade."
[[phrase]]
from = "Local filesystem and symlink attacks against runtime state, cache, spool, ACME, snapshot, and TLS paths."
to = "Lokale Dateisystem- und Symlink-Angriffe gegen Runtime-State-, Cache-, Spool-, ACME-, Snapshot- und TLS-Pfade."
[[phrase]]
from = "Misconfiguration that silently disables security controls."
to = "Fehlkonfiguration, die Sicherheitskontrollen stillschweigend deaktiviert."
[[phrase]]
from = "Compromised or lagging upstream services in proxy, PHP-FPM, ACME, OpenBao, OTLP, and future crypto-RPC deployments."
to = "Kompromittierte oder zurueckliegende Upstream-Services in Proxy-, PHP-FPM-, ACME-, OpenBao-, OTLP- und zukuenftigen Crypto-RPC-Deployments."
[[phrase]]
from = "Supply-chain compromise of build inputs, dependencies, container bases, and release artifacts."
to = "Supply-Chain-Kompromittierung von Build-Eingaben, Abhaengigkeiten, Container-Basen und Release-Artefakten."
[[phrase]]
from = "Candidate operational assumptions:"
to = "Kandidaten fuer betriebliche Annahmen:"
[[phrase]]
from = "The service runs as a dedicated Unix user."
to = "Der Service laeuft als dedizierter Unix-Benutzer."
[[phrase]]
from = "Runtime state directories are owned by the service user and not writable by untrusted users."
to = "Runtime-State-Verzeichnisse gehoeren dem Service-Benutzer und sind fuer nicht vertrauenswuerdige Benutzer nicht beschreibbar."
[[phrase]]
from = "Admin endpoints and control sockets are reachable only from trusted networks or local operators."
to = "Admin-Endpunkte und Control-Sockets sind nur aus vertrauenswuerdigen Netzwerken oder fuer lokale Betreiber erreichbar."
[[phrase]]
from = "Operators preserve release evidence, SBOMs, checksums, signatures, and module Security Policies."
to = "Betreiber bewahren Release-Nachweise, SBOMs, Pruefsummen, Signaturen und Modul-Security-Policies auf."
[[phrase]]
from = "External cryptographic modules and services are installed and operated within their own validation boundaries when a regulated deployment claims them."
to = "Externe kryptografische Module und Services werden innerhalb ihrer eigenen Validierungsgrenzen installiert und betrieben, wenn ein reguliertes Deployment sie beansprucht."
[[phrase]]
from = "Functional Requirement Mapping"
to = "Zuordnung funktionaler Anforderungen"
[[phrase]]
from = "Fluxheim should map existing and planned features to Common Criteria-style security functional areas. This is a roadmap classification, not formal SFR language."
to = "Fluxheim sollte bestehende und geplante Features auf Sicherheitsfunktionsbereiche im Common-Criteria-Stil abbilden. Dies ist eine Roadmap-Klassifizierung, keine formale SFR-Sprache."
[[phrase]]
from = "Security Audit"
to = "Security-Audit"
[[phrase]]
