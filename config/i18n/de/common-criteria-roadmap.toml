[[phrase]]
from = "Admin API and control-socket access expectations."
to = "Erwartungen an Admin-API- und Control-Socket-Zugriff."
[[phrase]]
from = "Assurance Evidence"
to = "Assurance-Nachweise"
[[phrase]]
from = "The ISO/IEC 15408-3 assurance families are useful as a release evidence checklist even without claiming an EAL."
to = "Die ISO/IEC-15408-3-Assurance-Familien sind auch ohne EAL-Behauptung als Release-Nachweis-Checkliste nuetzlich."
[[phrase]]
from = "Fluxheim should maintain:"
to = "Fluxheim sollte Folgendes pflegen:"
[[phrase]]
from = "Architecture notes for security-enforcing modules and interfaces."
to = "Architekturnotizen fuer sicherheitserzwingende Module und Schnittstellen."
[[phrase]]
from = "Functional specifications for config validation, routing, TLS, ACME, cache, PHP-FPM, admin, snapshots, logging, and telemetry."
to = "Funktionale Spezifikationen fuer Config-Validierung, Routing, TLS, ACME, Cache, PHP-FPM, Admin, Snapshots, Logging und Telemetrie."
[[phrase]]
from = "Operational guidance and preparative procedures for RPM, container, systemd, and source builds."
to = "Betriebsanleitungen und vorbereitende Verfahren fuer RPM-, Container-, systemd- und Source-Builds."
[[phrase]]
from = "Configuration management evidence: signed tags, SBOMs, lockfiles, release notes, changelog, build scripts, and dependency audit output."
to = "Konfigurationsmanagement-Nachweise: signierte Tags, SBOMs, Lockfiles, Release Notes, Changelog, Build-Skripte und Dependency-Audit-Ausgaben."
[[phrase]]
from = "Delivery evidence: checksums, signatures, image digests, release runbook, and reproducible-build output where available."
to = "Liefernachweise: Pruefsummen, Signaturen, Image-Digests, Release-Runbook und Reproducible-Build-Ausgaben, soweit verfuegbar."
[[phrase]]
from = "Flaw remediation evidence: security policy, issue process, pentest fixes, CodeQL, cargo-audit, cargo-deny, fuzzing, and regression tests."
to = "Nachweise zur Fehlerbehebung: Security Policy, Issue-Prozess, Pentest-Fixes, CodeQL, cargo-audit, cargo-deny, Fuzzing und Regressionstests."
[[phrase]]
from = "Developer test coverage and independent-test entry points that a third party can run without privileged production access."
to = "Entwicklertestabdeckung und Independent-Test-Einstiegspunkte, die Dritte ohne privilegierten Produktionszugriff ausfuehren koennen."
[[phrase]]
from = "Vulnerability analysis records for public-domain issues and pentest findings."
to = "Vulnerability-Analysis-Aufzeichnungen fuer oeffentliche Probleme und Pentest-Ergebnisse."
[[phrase]]
from = "Evaluation Methods"
to = "Evaluierungsmethoden"
[[phrase]]
from = "ISO/IEC 15408-4 is most useful to Fluxheim as a format for repeatable local security checks."
to = "ISO/IEC 15408-4 ist fuer Fluxheim vor allem als Format fuer wiederholbare lokale Sicherheitspruefungen nuetzlich."
[[phrase]]
from = "Every major security check should have:"
to = "Jede groessere Sicherheitspruefung sollte Folgendes haben:"
[[phrase]]
from = "A stable identifier."
to = "Eine stabile Kennung."
[[phrase]]
from = "Scope and objective."
to = "Umfang und Ziel."
[[phrase]]
from = "Required inputs and environment."
to = "Erforderliche Eingaben und Umgebung."
[[phrase]]
from = "Tool requirements."
to = "Tool-Anforderungen."
[[phrase]]
from = "Execution steps."
to = "Ausfuehrungsschritte."
[[phrase]]
from = "Pass/fail criteria."
to = "Pass/Fail-Kriterien."
[[phrase]]
from = "Output artifacts to archive."
to = "Zu archivierende Ausgabe-Artefakte."
[[phrase]]
from = "Rationale linking the check to a threat, requirement, or release gate."
to = "Begruendung, die die Pruefung mit einer Bedrohung, Anforderung oder einem Release-Gate verknuepft."
[[phrase]]
from = "Existing scripts that fit this pattern include release metadata validation, OWASP baseline checks, FIPS-capable OpenSSL and rustls/AWS-LC validation, config fixture validation, fuzzing targets, cargo-audit, cargo-deny, CodeQL, and PHP-FPM regression tests."
to = "Bestehende Skripte, die zu diesem Muster passen, umfassen Release-Metadatenvalidierung, OWASP-Baseline-Pruefungen, FIPS-faehige OpenSSL- und rustls/AWS-LC-Validierung, Config-Fixture-Validierung, Fuzzing-Targets, cargo-audit, cargo-deny, CodeQL und PHP-FPM-Regressionstests."
[[phrase]]
from = "Package Strategy"
to = "Paketstrategie"
[[phrase]]
from = "ISO/IEC 15408-5 packages are useful for long-term planning, but Fluxheim should not claim an EAL or Common Criteria conformance until a real Security Target and accredited evaluation path exist."
to = "ISO/IEC-15408-5-Pakete sind fuer langfristige Planung nuetzlich, aber Fluxheim sollte kein EAL und keine Common-Criteria-Konformitaet beanspruchen, bis ein echtes Security Target und ein akkreditierter Evaluierungspfad existieren."
[[phrase]]
from = "Practical near-term approach:"
to = "Praktischer kurzfristiger Ansatz:"
[[phrase]]
from = "Use EAL terminology only internally as an evidence maturity reference."
to = "EAL-Terminologie nur intern als Referenz fuer Nachweisreife verwenden."
[[phrase]]
from = "Avoid \"EAL-ready\" marketing language."
to = "\"EAL-ready\"-Marketingsprache vermeiden."
[[phrase]]
from = "Prefer \"Common Criteria evidence-aligned\" for documentation."
to = "\"Common Criteria evidence-aligned\" fuer Dokumentation bevorzugen."
[[phrase]]
from = "Track composed deployments separately, because Fluxheim often depends on OpenSSL, PHP-FPM, OpenBao, container runtimes, ACME issuers, and upstream applications."
to = "Zusammengesetzte Deployments separat verfolgen, weil Fluxheim oft von OpenSSL, PHP-FPM, OpenBao, Container-Runtimes, ACME-Ausstellern und Upstream-Anwendungen abhaengt."
[[phrase]]
from = "Roadmap"
to = "Roadmap"
[[phrase]]
from = "Phase 1 - Evidence Alignment"
to = "Phase 1 - Nachweisausrichtung"
[[phrase]]
from = "provides sections for TOE boundary, assumptions, security functions, operational environment, external dependencies, cryptographic module evidence, scanner output, and vulnerability-analysis records."
to = "stellt Abschnitte fuer TOE-Grenze, Annahmen, Sicherheitsfunktionen, Betriebsumgebung, externe Abhaengigkeiten, Krypto-Modulnachweise, Scanner-Ausgaben und Vulnerability-Analysis-Aufzeichnungen bereit."
[[phrase]]
from = "stable validation-script identifiers are documented in the evidence template for release metadata, feature validation, FIPS OpenSSL, FIPS rustls, OWASP baseline, SBOM, reproducible-build, cargo-audit, cargo-deny, CodeQL, and aggregated release evidence."
to = "stabile Validierungsskript-Kennungen sind in der Nachweisvorlage fuer Release-Metadaten, Feature-Validierung, FIPS OpenSSL, FIPS rustls, OWASP-Baseline, SBOM, Reproducible-Build, cargo-audit, cargo-deny, CodeQL und aggregierte Release-Nachweise dokumentiert."
[[phrase]]
from = "Expand docs so each security feature has operator guidance and test evidence."
to = "Dokumentation erweitern, damit jedes Sicherheitsfeature Betreiberanleitung und Testnachweise hat."
[[phrase]]
from = "Phase 2 - Security Target Draft"
to = "Phase 2 - Security-Target-Entwurf"
[[phrase]]
from = "Draft a non-certification Security Target-style document for one TOE shape: the RPM gateway profile is likely the most concrete first target."
to = "Ein nicht zertifizierendes Dokument im Security-Target-Stil fuer eine TOE-Form entwerfen: Das RPM-Gateway-Profil ist wahrscheinlich das konkreteste erste Ziel."
[[phrase]]
from = "Define the TOE boundary, security problem, objectives, requirements mapping, and summary specification in Fluxheim terminology."
to = "TOE-Grenze, Sicherheitsproblem, Ziele, Anforderungszuordnung und zusammenfassende Spezifikation in Fluxheim-Terminologie definieren."
[[phrase]]
from = "Keep it explicitly marked as an engineering draft, not an evaluated ST."
to = "Es explizit als Engineering-Entwurf markieren, nicht als evaluiertes ST."
[[phrase]]
from = "Phase 3 - Protection Profile Research"
to = "Phase 3 - Protection-Profile-Recherche"
[[phrase]]
from = "Check whether an existing firewall, TLS gateway, web server, reverse proxy, or network device Protection Profile can reasonably fit Fluxheim."
to = "Pruefen, ob ein bestehendes Protection Profile fuer Firewall, TLS-Gateway, Webserver, Reverse Proxy oder Netzwerkgeraet vernuenftig zu Fluxheim passt."
[[phrase]]
from = "If no profile fits, document why and identify which SFR groups would need a custom PP or direct-rationale ST."
to = "Wenn kein Profil passt, dokumentieren warum, und identifizieren, welche SFR-Gruppen ein eigenes PP oder ein Direct-Rationale-ST benoetigen wuerden."
[[phrase]]
from = "Phase 4 - External Evaluation Decision"
to = "Phase 4 - Entscheidung zur externen Evaluierung"
[[phrase]]
from = "Only pursue formal Common Criteria evaluation if there is a sponsor, a fixed TOE boundary, a lab, a target assurance package, and a maintenance budget."
to = "Eine formale Common-Criteria-Evaluierung nur verfolgen, wenn es Sponsor, feste TOE-Grenze, Labor, Ziel-Assurance-Paket und Wartungsbudget gibt."
[[phrase]]
from = "Do not combine formal Common Criteria claims with FIPS/ISO cryptographic module claims unless the evidence boundary for each is separately clear."
to = "Formale Common-Criteria-Claims nicht mit FIPS/ISO-Claims zu kryptografischen Modulen kombinieren, sofern die Nachweisgrenze fuer jeden nicht separat klar ist."
