[[phrase]]
from = "systemd Deployment"
to = "systemd-Deployment"

[[phrase]]
from = "Fluxheim can run as a native systemd service when you manually compile the binary or install an RPM package."
to = "Fluxheim kann als nativer systemd-Dienst laufen, wenn du das Binary manuell kompilierst oder ein RPM-Paket installierst."

[[phrase]]
from = "The packaged unit is intentionally conservative:"
to = "Die paketierte Unit ist absichtlich konservativ:"

[[phrase]]
from = "runs as the"
to = "laeuft als"

[[phrase]]
from = "user and group;"
to = "User und Gruppe;"

[[phrase]]
from = "validates the config before starting;"
to = "validiert die Konfiguration vor dem Start;"

[[phrase]]
from = "uses <code>/run/fluxheim</code>, <code>/var/lib/fluxheim</code>, <code>/var/cache/fluxheim</code>, and <code>/var/log/fluxheim</code> as writable service paths;"
to = "verwendet <code>/run/fluxheim</code>, <code>/var/lib/fluxheim</code>, <code>/var/cache/fluxheim</code> und <code>/var/log/fluxheim</code> als schreibbare Dienstpfade;"

[[phrase]]
from = "keeps <code>/etc/fluxheim</code> and <code>/srv/fluxheim</code> readable but not writable by the service;"
to = "haelt <code>/etc/fluxheim</code> und <code>/srv/fluxheim</code> fuer den Dienst lesbar, aber nicht schreibbar;"

[[phrase]]
from = "runs with"
to = "laeuft mit"

[[phrase]]
from = "and grants only"
to = "und gewaehrt nur"

[[phrase]]
from = ", allowing the unprivileged"
to = ", wodurch der unprivilegierte"

[[phrase]]
from = "user to bind production ports"
to = "User Produktionsports binden kann"

[[phrase]]
from = "without running the service as root;"
to = "ohne den Dienst als root auszufuehren;"

[[phrase]]
from = "uses strict system path protection, private temporary and device namespaces, kernel/control-group write protection, namespace restrictions, native syscall architecture filtering, and a conservative system-service/network syscall allow-list;"
to = "nutzt strikten Systempfad-Schutz, private temporaere und Device-Namespaces, Kernel-/Control-Group-Schreibschutz, Namespace-Restriktionen, native Syscall-Architekturfilterung und eine konservative Allow-List fuer System-Service-/Netzwerk-Syscalls;"

[[phrase]]
from = "limits address families to IPv4, IPv6, and Unix domain sockets;"
to = "begrenzt Address-Families auf IPv4, IPv6 und Unix-Domain-Sockets;"

[[phrase]]
from = "stops with"
to = "stoppt mit"

[[phrase]]
from = "and lets Fluxheim/Pingora shut down gracefully."
to = "und laesst Fluxheim/Pingora graceful herunterfahren."

[[phrase]]
from = "These systemd controls are the supported"
to = "Diese systemd-Controls sind die unterstuetzte"

[[phrase]]
from = "host sandbox. They are deployment-level controls and do not require a special Fluxheim binary."
to = "Host-Sandbox. Sie sind Deployment-Level-Controls und erfordern kein spezielles Fluxheim-Binary."

[[phrase]]
from = "The packaged native config listens on"
to = "Die paketierte native Konfiguration lauscht auf"

[[phrase]]
from = "by default. HTTPS uses"
to = "standardmaessig. HTTPS verwendet"

[[phrase]]
from = "once <code>server.tls_listen</code> and certificate paths are enabled."
to = "sobald <code>server.tls_listen</code> und Zertifikatspfade aktiviert sind."

[[phrase]]
