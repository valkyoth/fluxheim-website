[[phrase]]
from = "PHP-FPM production line, managed php-fpm supervision, config tester and ACME companion binaries, FIPS/ISO validation tracks, focused cache/proxy profiles, and security hardening"
to = "PHP-FPM-Produktionslinie, verwaltete php-fpm-Überwachung, Konfigurationstester- und ACME-Begleit-Binaries, FIPS/ISO-Validierungspfade, fokussierte Cache-/Proxy-Varianten und Sicherheitshärtung"

[[phrase]]
from = "Native HTTP/1 upstream/proxy foundation with bounded plain upstream forwarding, native proxy candidate inventory, proxy header parity, privacy-mode handling, and fail-closed eligibility."
to = "Native HTTP/1-Upstream-/Proxy-Grundlage mit begrenzter Plain-Upstream-Weiterleitung, nativer Proxy-Kandidateninventur, Proxy-Header-Parität, Privacy-Mode-Handling und Fail-Closed-Eignung."

[[phrase]]
from = "Enterprise load-balancer and runtime-ownership line: focused load-balancer binaries/images, runtime member and weight controls, managed affinity cookies, stream and HTTP boundary work, active and protocol-aware health checks, service discovery, background task ownership, cache crate boundaries, UDP beta guardrails, origin-protection budgets, ARM/macOS assets, and broad security hardening."
to = "Enterprise-Load-Balancer- und Laufzeit-Ownership-Linie: fokussierte Load-Balancer-Binaries/-Images, Member- und Gewichtskontrollen zur Laufzeit, verwaltete Affinity-Cookies, Stream- und HTTP-Grenzarbeit, aktive und protokollbewusste Health-Checks, Service Discovery, Ownership von Hintergrundtasks, Cache-Crate-Grenzen, UDP-Beta-Leitplanken, Origin-Schutz-Budgets, ARM-/macOS-Assets und breite Sicherheitshärtung."

[[phrase]]
from = "Proxy operations line with production proxy parity, richer route policy, traffic mirroring, dynamic upstream discovery, modular runtime/config split, Apple Silicon and Linux ARM64 release assets, GeoIP/Geo-Context, config-tester archives, and hardened TCP stream proxying"
to = "Proxy-Betriebslinie mit Produktions-Proxy-Parität, reichhaltigerer Routenrichtlinie, Traffic Mirroring, dynamischer Upstream-Erkennung, modularer Laufzeit-/Konfigurations-Trennung, Apple-Silicon- und Linux-ARM64-Release-Assets, GeoIP/Geo-Kontext, Konfigurationstester-Archiven und gehärtetem TCP-Stream-Proxying"

[[phrase]]
from = "Cache and observability baseline with route-scoped cache policy, memory/disk/tiered backends, encrypted disk cache, peer fill, range caching, Prometheus, and OpenTelemetry export"
