to = "Security-relevante Entscheidungen sollen sich zu kleinen Proof-Objekten bewegen:"

[[phrase]]
from = "The proof is not verbose per-request logging. It is a typed result that keeps policy decisions consistent across access control, cache admission, load-balancer selection, admin mutation, auth-request, GeoIP, rate limiting, Wasm hooks, and future WAF behavior."
to = "Der Proof ist kein ausfuehrliches Logging pro Request. Er ist ein typisiertes Ergebnis, das Policy-Entscheidungen ueber Access Control, Cache Admission, Load-Balancer-Auswahl, Admin-Mutation, auth-request, GeoIP, Rate Limiting, Wasm-Hooks und zukuenftiges WAF-Verhalten hinweg konsistent haelt."

