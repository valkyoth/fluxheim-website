[[phrase]]
from = "adds the first native HTTP/1 proxy cutover summary to the server plan. That summary is an eligibility signal, not a traffic switch: the production runtime remains on the compatibility adapter until every configured proxy path either has native parity or is explicitly kept on the compatibility path with a bounded reason. Operators should treat"
to = "fuegt dem Serverplan die erste native HTTP/1-Proxy-Cutover-Zusammenfassung hinzu. Diese Zusammenfassung ist ein Eligibility-Signal, kein Traffic-Switch: Die Produktionsruntime bleibt auf dem Compatibility-Adapter, bis jeder konfigurierte Proxy-Pfad entweder native Parity hat oder mit einem begrenzten Grund explizit auf dem Compatibility-Pfad gehalten wird. Operatoren sollen"

[[phrase]]
from = "as rollout evidence for the Pingora-exit line rather than as an active runtime adapter claim."
to = "als Rollout Evidence fuer die Pingora-Exit-Linie behandeln und nicht als aktiven Runtime-Adapter-Claim."

[[phrase]]
from = "adds the broader native runtime cutover summary. It reports remaining blockers such as native HTTP/1 proxy parity, native HTTP/2 downstream parity, admin, metrics, stream, and UDP service adapters. This is still diagnostic evidence only; it does not change the active runtime adapter."
to = "fuegt die breitere Native-Runtime-Cutover-Zusammenfassung hinzu. Sie meldet verbleibende Blocker wie native HTTP/1-Proxy-Parity, native HTTP/2-Downstream-Parity, Admin-, Metrics-, Stream- und UDP-Service-Adapter. Dies ist weiterhin nur Diagnostic Evidence; es aendert den aktiven Runtime-Adapter nicht."

[[phrase]]
from = "Later 1.6 releases may add a bounded in-memory fact ring for admin diagnostics. The ring must be optional, fixed-size, redacted by type, and safe to disable. It must never be required for request forwarding."
to = "Spaetere 1.6-Releases koennen einen begrenzten In-Memory-Fact-Ring fuer Admin-Diagnostik ergaenzen. Der Ring muss optional, fixed-size, nach Typ redigiert und sicher deaktivierbar sein. Er darf niemals fuer Request Forwarding erforderlich sein."

[[phrase]]
from = "Security Rules"
to = "Security-Regeln"

[[phrase]]
from = "Runtime facts do not create authority."
to = "Runtime Facts erzeugen keine Authority."

[[phrase]]
from = "Policy proofs are deterministic and bounded."
to = "Policy Proofs sind deterministisch und begrenzt."

[[phrase]]
from = "Sensitive identifiers are redacted at type boundaries, not manually at each log site."
to = "Sensible Identifier werden an Typgrenzen redigiert, nicht manuell an jeder Log-Stelle."

[[phrase]]
from = "Metrics stay low-cardinality."
to = "Metriken bleiben low-cardinality."

[[phrase]]
from = "Admin views expose bounded reasons, not raw secrets or private addresses in privacy-mode builds."
to = "Admin-Views zeigen begrenzte Gruende, nicht rohe Secrets oder private Adressen in Privacy-Mode-Builds."

[[phrase]]
from = "AI or Wasm consumers may only receive facts explicitly granted by policy."
to = "KI- oder Wasm-Consumer duerfen nur Facts erhalten, die explizit durch Policy freigegeben wurden."

[[phrase]]
from = "Derived or advisory facts are never authoritative unless promoted through a deterministic path."
to = "Abgeleitete oder beratende Facts sind niemals autoritativ, ausser sie werden ueber einen deterministischen Pfad promoted."

[[phrase]]
from = "If fact collection fails, request handling must keep its configured fail-open/fail-closed behavior and record only a bounded diagnostic if safe."
to = "Wenn Fact Collection fehlschlaegt, muss Request Handling sein konfiguriertes fail-open-/fail-closed-Verhalten beibehalten und nur dann eine begrenzte Diagnose aufzeichnen, wenn es sicher ist."

[[phrase]]
from = "Why This Matters"
to = "Warum das wichtig ist"

[[phrase]]
from = "Fluxheim has grown beyond a simple proxy. It now has cache, load balancing, admin mutation, snapshots, ACME, stream/UDP work, metrics, traces, and future Wasm/WAF/HTTP3 plans. A typed runtime-fact model lets operators and reviewers ask:"
to = "Fluxheim ist ueber einen einfachen Proxy hinausgewachsen. Es hat jetzt Cache, Load Balancing, Admin-Mutation, Snapshots, ACME, Stream-/UDP-Arbeit, Metriken, Traces und zukuenftige Wasm-/WAF-/HTTP3-Plaene. Ein typisiertes Runtime-Fact-Modell laesst Operatoren und Reviewer fragen:"

[[phrase]]
from = "why was this request denied?"
to = "warum wurde dieser Request abgelehnt?"

[[phrase]]
from = "why did this backend stop receiving traffic?"
to = "warum hat dieses Backend aufgehoert, Traffic zu erhalten?"

[[phrase]]
from = "why was this object not cached?"
to = "warum wurde dieses Objekt nicht gecacht?"

[[phrase]]
from = "which config epoch made this decision?"
to = "welche Config-Epoch hat diese Entscheidung getroffen?"

[[phrase]]
from = "which admin action changed this pool?"
to = "welche Admin-Aktion hat diesen Pool geaendert?"

[[phrase]]
from = "which facts are safe to export?"
to = "welche Facts koennen sicher exportiert werden?"

[[phrase]]
from = "That makes Fluxheim more self-aware and makes pentest review more local, without turning the proxy into a database."
to = "Das macht Fluxheim selbstbewusster und Pentest-Review lokaler, ohne den Proxy in eine Datenbank zu verwandeln."
