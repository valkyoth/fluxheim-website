[[phrase]]
from = "Runtime Facts And Policy Proofs"
to = "Runtime Facts und Policy Proofs"

[[phrase]]
from = "Fluxheim should understand its own runtime decisions without becoming a database. The goal is a small, typed, bounded model for operational evidence: what happened, which policy made the decision, and which public/redacted reason can be shown to an operator."
to = "Fluxheim soll seine eigenen Runtime-Entscheidungen verstehen, ohne zu einer Datenbank zu werden. Ziel ist ein kleines, typisiertes, begrenztes Modell fuer Operational Evidence: was passiert ist, welche Policy die Entscheidung getroffen hat und welcher oeffentliche oder redigierte Grund einem Operator gezeigt werden kann."

[[phrase]]
from = "This is inspired by two internal design patterns:"
to = "Dies ist von zwei internen Designmustern inspiriert:"

[[phrase]]
from = "Aesynx: no ambient authority, typed handles, explicit capability movement, bounded telemetry, fail-closed admission gates."
to = "Aesynx: keine ambient authority, typisierte Handles, explizite Capability-Bewegung, begrenzte Telemetry, fail-closed Admission-Gates."

[[phrase]]
from = "Skrifheim: canonical facts, worlds, policy decisions, redacted debug output, and deterministic proof objects."
to = "Skrifheim: kanonische Facts, Worlds, Policy-Entscheidungen, redigierte Debug-Ausgaben und deterministische Proof-Objekte."

[[phrase]]
from = "Fluxheim should adopt the discipline, not the database engine."
to = "Fluxheim soll die Disziplin uebernehmen, nicht die Datenbank-Engine."

[[phrase]]
from = "Non-Goals"
to = "Nicht-Ziele"

[[phrase]]
from = "This work must not put a database, graph engine, AI system, or unbounded audit store in the request hot path."
to = "Diese Arbeit darf keine Datenbank, Graph-Engine, kein KI-System und keinen unbegrenzten Audit-Store in den Request-Hot-Path legen."

[[phrase]]
from = "Runtime facts are not a replacement for logs, metrics, traces, or admin status. They are a typed internal shape that those systems can export safely."
to = "Runtime Facts sind kein Ersatz fuer Logs, Metriken, Traces oder Admin-Status. Sie sind eine typisierte interne Form, die diese Systeme sicher exportieren koennen."

