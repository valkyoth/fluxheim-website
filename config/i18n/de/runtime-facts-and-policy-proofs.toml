[[phrase]]
from = "The 1.6 line should start treating those as explicit versioned views with epochs and clear promotion rules. A candidate config should not become current state without validation evidence. Runtime mutations should record the policy epoch they were made under."
to = "Die 1.6-Linie soll beginnen, diese als explizite versionierte Views mit Epochs und klaren Promotion-Regeln zu behandeln. Ein Config-Kandidat soll ohne Validation Evidence nicht zum aktuellen Zustand werden. Runtime-Mutationen sollen die Policy-Epoch aufzeichnen, unter der sie vorgenommen wurden."

[[phrase]]
from = "1.6 Adoption Plan"
to = "1.6-Adoptionsplan"

[[phrase]]
from = "should document the initial runtime fact kinds, policy-proof shape, redaction levels, and epoch terminology. It should not change request behavior."
to = "soll die initialen Runtime-Fact-Arten, die Policy-Proof-Form, Redaction-Level und Epoch-Terminologie dokumentieren. Es soll das Request-Verhalten nicht aendern."

[[phrase]]
from = "Early 1.6 releases should introduce small types in a focused crate or"
to = "Fruehe 1.6-Releases sollen kleine Typen in einer fokussierten Crate oder"

[[phrase]]
from = "if the shape is still tiny."
to = "einfuehren, wenn die Form noch klein ist."

[[phrase]]
from = "The initial types are intentionally not wired into request handling yet. They exist so later 1.6 cutovers can migrate one decision path at a time without inventing new stringly-typed reasons."
to = "Die initialen Typen sind absichtlich noch nicht in das Request Handling verdrahtet. Sie existieren, damit spaetere 1.6-Cutover jeweils einen Entscheidungspfad migrieren koennen, ohne neue stringly-typed Gruende zu erfinden."

[[phrase]]
from = "Mid 1.6 releases should route selected decision paths through proof objects while replacing Pingora boundaries:"
to = "Mittlere 1.6-Releases sollen ausgewaehlte Entscheidungspfade durch Proof-Objekte routen, waehrend Pingora-Grenzen ersetzt werden:"

