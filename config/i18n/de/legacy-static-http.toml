locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Legacy Static HTTP Support"
to = "Legacy-Static-HTTP-Support"

[[phrase]]
from = "Legacy HTTP support is a future experimental compatibility feature for isolated devices that cannot speak modern HTTP. It must never be part of Fluxheim&#x27;s default binary and must never run on normal proxy, cache, admin, PHP, CGI, or TLS listener paths."
to = "Legacy-HTTP-Support ist ein zukuenftiges experimentelles Kompatibilitaetsfeature fuer isolierte Geraete, die kein modernes HTTP sprechen koennen. Es darf niemals Teil von Fluxheims Default-Binary sein und niemals auf normalen Proxy-, Cache-, Admin-, PHP-, CGI- oder TLS-Listener-Pfaden laufen."

[[phrase]]
from = "The modern protocol focus for Fluxheim remains strict HTTP/1.1 and HTTP/2 today, with HTTP/3/QUIC planned as the future performance and security direction. Legacy protocol support is a quarantined compatibility exception."
to = "Der moderne Protokollfokus fuer Fluxheim bleibt heute striktes HTTP/1.1 und HTTP/2, mit HTTP/3/QUIC als geplanter zukuenftiger Performance- und Security-Richtung. Legacy-Protokollsupport ist eine quarantined Kompatibilitaetsausnahme."

[[phrase]]
from = "Compile-Time Features"
to = "Compile-Time-Features"

[[phrase]]
from = "Planned feature flags:"
to = "Geplante Feature-Flags:"

[[phrase]]
from = "The default feature set must never include these features. Release checks should fail if"
to = "Das Default-Feature-Set darf diese Features niemals enthalten. Release-Checks sollten fehlschlagen, wenn"

[[phrase]]
from = "shows any legacy HTTP feature enabled by default."
to = "ein Legacy-HTTP-Feature standardmaessig aktiviert zeigt."

[[phrase]]
from = "Runtime Isolation"
to = "Runtime-Isolation"

[[phrase]]
from = "Legacy support requires explicit runtime config and dedicated listeners:"
to = "Legacy-Support erfordert explizite Runtime-Konfiguration und dedizierte Listener:"

[[phrase]]
from = "Legacy listeners must not share"
to = "Legacy-Listener duerfen"

[[phrase]]
from = ". Listener changes are process-upgrade changes."
to = "nicht teilen. Listener-Aenderungen sind Process-Upgrade-Aenderungen."

[[phrase]]
from = "HTTP/1.0 Static Mode"
to = "HTTP/1.0-Static-Modus"

[[phrase]]
from = "HTTP/1.0 support is allowed only for static file serving."
to = "HTTP/1.0-Support ist nur fuer statisches File-Serving erlaubt."

[[phrase]]
from = "Required behavior:"
to = "Erforderliches Verhalten:"

[[phrase]]
from = "Dedicated legacy listener only."
to = "Nur dedizierter Legacy-Listener."

[[phrase]]
from = "Explicit legacy vhost only."
to = "Nur expliziter Legacy-vhost."

[[phrase]]
from = "Static <code>GET</code> and <code>HEAD</code> only by default."
to = "Standardmaessig nur statisches <code>GET</code> und <code>HEAD</code>."

[[phrase]]
from = "No reverse proxying."
to = "Kein Reverse Proxying."

[[phrase]]
from = "No cache admission or cache lookup."
to = "Keine Cache-Aufnahme oder Cache-Lookups."

[[phrase]]
from = "No admin endpoints."
to = "Keine Admin-Endpunkte."

[[phrase]]
from = "No PHP or CGI execution."
to = "Keine PHP- oder CGI-Ausfuehrung."

[[phrase]]
from = "No compression/body filters."
to = "Keine Compression-/Body-Filter."

[[phrase]]
from = "No protocol upgrade."
to = "Kein Protokoll-Upgrade."

[[phrase]]
from = "No persistent connections."
to = "Keine persistenten Verbindungen."

[[phrase]]
from = "Always force <code>Connection: close</code>."
to = "Immer <code>Connection: close</code> erzwingen."

[[phrase]]
from = "Reject <code>Transfer-Encoding</code>."
to = "<code>Transfer-Encoding</code> ablehnen."

[[phrase]]
from = "Reject multiple or invalid <code>Content-Length</code>."
to = "Mehrfache oder ungueltige <code>Content-Length</code> ablehnen."

[[phrase]]
from = "Reject request bodies unless a later static-only use case is explicitly justified."
to = "Request-Bodies ablehnen, ausser ein spaeterer static-only Use Case ist explizit begruendet."

[[phrase]]
from = "If <code>Host</code> is absent, route only to the configured legacy vhost."
to = "Wenn <code>Host</code> fehlt, nur zum konfigurierten Legacy-vhost routen."

[[phrase]]
from = "If <code>Host</code> is present, still restrict the request to the configured legacy vhost and static root."
to = "Wenn <code>Host</code> vorhanden ist, den Request trotzdem auf den konfigurierten Legacy-vhost und die Static-Root beschraenken."

[[phrase]]
from = "The motivation is compatibility with old internal health checks, PLCs, and legacy enterprise equipment, not public internet service."
to = "Die Motivation ist Kompatibilitaet mit alten internen Health-Checks, PLCs und Legacy-Enterprise-Geraeten, nicht Public-Internet-Service."

[[phrase]]
from = "HTTP/0.9 Static Mode"
to = "HTTP/0.9-Static-Modus"

[[phrase]]
from = "HTTP/0.9 is too old and ambiguous for Pingora&#x27;s normal HTTP pipeline. It should be implemented, if ever, as a separate raw TCP service."
to = "HTTP/0.9 ist zu alt und mehrdeutig fuer Pingoras normale HTTP-Pipeline. Falls es je implementiert wird, sollte es als separater Raw-TCP-Service umgesetzt werden."

[[phrase]]
from = "Dedicated raw TCP listener only."
to = "Nur dedizierter Raw-TCP-Listener."

[[phrase]]
from = "One request per connection."
to = "Ein Request pro Verbindung."

[[phrase]]
from = "Accept only <code>GET /path</code> followed by line ending."
to = "Nur <code>GET /path</code> gefolgt von Line Ending akzeptieren."

[[phrase]]
from = "Static files only."
to = "Nur statische Dateien."

[[phrase]]
from = "No headers."
to = "Keine Header."

[[phrase]]
from = "No request body."
to = "Kein Request-Body."

[[phrase]]
from = "No TLS."
to = "Kein TLS."

[[phrase]]
from = "No vhost by <code>Host</code> header."
to = "Kein vhost ueber <code>Host</code>-Header."

[[phrase]]
from = "No PHP or CGI."
to = "Kein PHP oder CGI."

[[phrase]]
from = "No directory listing."
to = "Kein Directory-Listing."

[[phrase]]
from = "No redirects that rely on HTTP status codes."
to = "Keine Redirects, die auf HTTP-Statuscodes angewiesen sind."

[[phrase]]
from = "Close the connection after the response body."
to = "Verbindung nach dem Response-Body schliessen."

[[phrase]]
from = "Most unexpected input that resembles HTTP/0.9 should be treated as hostile and rejected."
to = "Die meisten unerwarteten Eingaben, die HTTP/0.9 aehneln, sollten als hostile behandelt und abgelehnt werden."

[[phrase]]
from = "Security Tests"
to = "Security-Tests"

[[phrase]]
from = "Before implementation is considered usable:"
to = "Bevor die Implementierung als nutzbar gilt:"

[[phrase]]
from = "HTTP/1.0 <code>Transfer-Encoding: chunked</code> must be rejected."
to = "HTTP/1.0 <code>Transfer-Encoding: chunked</code> muss abgelehnt werden."

[[phrase]]
from = "Multiple <code>Content-Length</code> values must be rejected."
to = "Mehrere <code>Content-Length</code>-Werte muessen abgelehnt werden."

[[phrase]]
from = "Invalid <code>Content-Length</code> must be rejected."
to = "Ungueltige <code>Content-Length</code> muss abgelehnt werden."

[[phrase]]
from = "<code>Upgrade</code> headers must be rejected."
to = "<code>Upgrade</code>-Header muessen abgelehnt werden."

[[phrase]]
from = "Keep-alive attempts must still close the connection."
to = "Keep-alive-Versuche muessen die Verbindung trotzdem schliessen."

[[phrase]]
from = "HTTP/1.0 requests must never reach proxy/cache/admin/PHP/CGI paths."
to = "HTTP/1.0-Requests duerfen niemals Proxy-/Cache-/Admin-/PHP-/CGI-Pfade erreichen."

[[phrase]]
from = "HTTP/0.9 malformed request lines must be rejected."
to = "Malformed HTTP/0.9-Request-Lines muessen abgelehnt werden."

[[phrase]]
from = "HTTP/0.9 traversal attempts must be rejected."
to = "HTTP/0.9-Traversal-Versuche muessen abgelehnt werden."

[[phrase]]
from = "HTTP/0.9 absolute URLs and scheme-prefixed paths must be rejected."
to = "HTTP/0.9-Absolute-URLs und Scheme-prefixed Paths muessen abgelehnt werden."

[[phrase]]
from = "Both modes must reuse the existing static resolver&#x27;s canonical path checks."
to = "Beide Modi muessen die kanonischen Pfadchecks des bestehenden Static-Resolvers wiederverwenden."

[[phrase]]
from = "Metrics and access logs must label legacy protocol traffic clearly."
to = "Metriken und Access-Logs muessen Legacy-Protokoll-Traffic klar labeln."

[[phrase]]
from = "Relationship To Pingora Smuggling Advisories"
to = "Beziehung zu Pingora-Smuggling-Advisories"

[[phrase]]
from = "Pingora versions before <code>0.8.0</code> had HTTP request-smuggling vulnerabilities around HTTP/1.0 transfer-encoding parsing and premature upgrade handling. Fluxheim already tracks Pingora <code>0.8.0</code>, but legacy support must still add its own stricter rejection layer because compatibility modes are especially exposed to ambiguous parsing attacks."
to = "Pingora-Versionen vor <code>0.8.0</code> hatten HTTP-Request-Smuggling-Schwachstellen rund um HTTP/1.0-Transfer-Encoding-Parsing und vorzeitiges Upgrade-Handling. Fluxheim trackt bereits Pingora <code>0.8.0</code>, aber Legacy-Support muss trotzdem eine eigene strengere Reject-Schicht ergaenzen, weil Kompatibilitaetsmodi besonders stark mehrdeutigen Parsing-Angriffen ausgesetzt sind."

[[phrase]]
from = "Legacy support must not weaken the normal modern listener behavior."
to = "Legacy-Support darf das normale moderne Listener-Verhalten nicht abschwaechen."

