[[phrase]]
from = "On Unix, Fluxheim normalizes the snapshot store root and <code>configs</code> directory to mode <code>0700</code>, and writes <code>current</code>, config snapshots, and metadata snapshots as mode <code>0600</code>. Operators should still run the service with a restrictive umask such as <code>0077</code> or <code>0027</code> as defense in depth for any future state files."
