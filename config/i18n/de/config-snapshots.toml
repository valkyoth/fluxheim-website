to = "zurueck und laesst den Pointer auf dem aktuellen Snapshot."

[[phrase]]
from = "Apply the durable current snapshot to the running proxy if the reload classifier marks it"
to = "Den dauerhaften aktuellen Snapshot auf den laufenden Proxy anwenden, wenn der Reload-Classifier ihn als"

