[[phrase]]
from = ", which is an explicit operator declaration that TLS or mTLS is terminated by a trusted local sidecar, reverse proxy, or load balancer before traffic reaches the plain admin listener. First-class admin TLS/mTLS is still tracked as future work; do not expose the admin listener over cleartext networks."
to = ". Das ist eine explizite Betreiber-Erklaerung, dass TLS oder mTLS von einem vertrauenswuerdigen lokalen Sidecar, Reverse Proxy oder Load Balancer terminiert wird, bevor Traffic den unverschluesselten Admin-Listener erreicht. First-class Admin-TLS/mTLS bleibt als kuenftige Arbeit verfolgt; exponiere den Admin-Listener nicht ueber Cleartext-Netzwerke."

