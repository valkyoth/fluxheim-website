to = "Den Kandidaten bestaetigen, nachdem lokale Health-Checks erfolgreich sind:"

[[phrase]]
from = "Force rollback to the previous known-good snapshot after local health checks fail:"
to = "Rollback auf den vorherigen Known-good-Snapshot erzwingen, nachdem lokale Health-Checks fehlschlagen:"

[[phrase]]
from = "The fail endpoint validates the previous snapshot and applies it with the same snapshot-safe reload gate. It also moves the durable current pointer back only after the running proxy accepts the rollback."
to = "Der Fail-Endpunkt validiert den vorherigen Snapshot und wendet ihn mit demselben snapshot-safe Reload-Gate an. Er verschiebt den dauerhaften Current-Pointer erst zurueck, nachdem der laufende Proxy das Rollback akzeptiert."

[[phrase]]
from = "Report health-check results from a local watchdog:"
to = "Health-Check-Ergebnisse von einem lokalen Watchdog melden:"

[[phrase]]
from = "Successful reports confirm the pending snapshot once"
to = "Erfolgreiche Reports bestaetigen den ausstehenden Snapshot, sobald"

[[phrase]]
from = "is reached. Failed reports roll back when the observed error rate exceeds"
to = "erreicht ist. Fehlgeschlagene Reports rollen zurueck, wenn die beobachtete Fehlerrate"

[[phrase]]
from = "Pending validation fails closed. If the validation window expires before a confirm request, the Pingora self-healing watchdog attempts the same known-good rollback without waiting for operator traffic. Admin requests also enforce the deadline as a secondary guard."
to = "Ausstehende Validierung faellt geschlossen aus. Wenn das Validierungsfenster vor einem Confirm-Request ablaeuft, versucht der Pingora-Self-Healing-Watchdog dasselbe Known-good-Rollback, ohne auf Betreiber-Traffic zu warten. Admin-Requests erzwingen die Deadline ebenfalls als sekundaeren Guard."

[[phrase]]
from = "Public proxy traffic does not confirm or roll back pending snapshots. This keeps unauthenticated data-plane clients from influencing admin reload state. Only authenticated admin self-healing actions, local watchdog expiry, and explicit operator-driven health reports can advance pending validation."
to = "Oeffentlicher Proxy-Traffic bestaetigt keine ausstehenden Snapshots und rollt sie nicht zurueck. Dadurch koennen unauthentifizierte Data-Plane-Clients den Admin-Reload-State nicht beeinflussen. Nur authentifizierte Admin-Self-Healing-Aktionen, lokaler Watchdog-Ablauf und explizite betreibergetriebene Health-Reports koennen die ausstehende Validierung voranbringen."

[[phrase]]
from = "The self-healing path uses these state transitions:"
to = "Der Self-Healing-Pfad nutzt diese Zustandsuebergaenge:"

