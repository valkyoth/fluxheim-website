locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Fluxheim uses two layers for reload safety:"
to = "Fluxheim nutzt zwei Ebenen fuer sichere Reloads:"

[[phrase]]
from = "Runtime snapshots: immutable in-memory state behind <code>ArcSwap</code>."
to = "Runtime-Snapshots: unveraenderlicher In-Memory-Zustand hinter <code>ArcSwap</code>."

[[phrase]]
from = "Durable snapshots: validated TOML configs stored on disk with a current pointer."
to = "Dauerhafte Snapshots: validierte TOML-Konfigurationen auf Disk mit einem Current-Pointer."

[[phrase]]
from = "The runtime snapshot model means old requests can keep using the config they started with while new requests use the new config after an atomic pointer swap. The durable snapshot store gives operators an auditable rollback target and the admin API a current pointer to apply."
to = "Das Runtime-Snapshot-Modell bedeutet, dass alte Requests die gestartete Konfiguration weiter nutzen koennen, waehrend neue Requests nach einem atomaren Pointer-Swap die neue Konfiguration verwenden. Der dauerhafte Snapshot-Store gibt Betreibern ein auditierbares Rollback-Ziel und der Admin-API einen anwendbaren Current-Pointer."

[[phrase]]
from = "Store Layout"
to = "Store-Layout"

[[phrase]]
from = "Use an operator-chosen state directory, for example"
to = "Verwende ein vom Betreiber gewaehltes State-Verzeichnis, zum Beispiel"

[[phrase]]
from = "<code>current</code> contains the active snapshot id. Fluxheim uses an atomically replaced pointer file instead of a symlink. A symlink swap is a good Linux-only design, but the pointer file keeps the store straightforward in rootless Podman, restricted volume mounts, and non-Unix development environments while still using write-temp-and-rename semantics."
to = "<code>current</code> enthaelt die aktive Snapshot-ID. Fluxheim nutzt eine atomar ersetzte Pointer-Datei statt eines Symlinks. Ein Symlink-Swap ist ein gutes reines Linux-Design, aber die Pointer-Datei haelt den Store in rootless Podman, eingeschraenkten Volume-Mounts und Nicht-Unix-Entwicklungsumgebungen einfach und nutzt weiterhin Write-temp-and-rename-Semantik."

[[phrase]]
from = "Snapshot config files contain the validated effective config, written back as TOML. Metadata files contain the snapshot id, creation time, and optional operator message. Operator messages are trimmed and limited to 4096 bytes of non-control text before they are written or loaded. Generated snapshot ids contain Unix time plus a process-local sequence; they do not include the Fluxheim process id."
to = "Snapshot-Konfigurationsdateien enthalten die validierte effektive Konfiguration, wieder als TOML geschrieben. Metadatendateien enthalten Snapshot-ID, Erstellungszeit und optionale Betreiber-Nachricht. Betreiber-Nachrichten werden getrimmt und vor dem Schreiben oder Laden auf 4096 Byte Nicht-Kontrolltext begrenzt. Generierte Snapshot-IDs enthalten Unix-Zeit plus eine prozesslokale Sequenz; sie enthalten nicht die Fluxheim-Prozess-ID."

[[phrase]]
from = "The store is deliberately conservative about filesystem indirection. Snapshot ids may only contain ASCII letters, digits, <code>_</code>, and <code>-</code>, and are limited to 128 bytes; the store root cannot contain <code>..</code> or sit below a symlinked parent directory; the store root and <code>configs</code> directory must be real directories; the <code>configs</code> directory must remain inside the snapshot store; and <code>current</code>, snapshot TOML files, and metadata TOML files are opened as regular files. Symlinked store roots, pointer, config, metadata, or <code>configs</code> paths are rejected so a rollback cannot be redirected to an operator-unapproved file. Atomic writes also require an already validated real parent directory and will not replace a symlinked destination. Snapshot reads are bounded: <code>current</code> is limited to 4 KiB and snapshot TOML/metadata reads are limited to 16 MiB. Snapshot stores are limited to 1024 snapshots; operators should export or prune old snapshots before that limit."
to = "Der Store ist bei Dateisystem-Indirektion bewusst konservativ. Snapshot-IDs duerfen nur ASCII-Buchstaben, Ziffern, <code>_</code> und <code>-</code> enthalten und sind auf 128 Byte begrenzt; die Store-Root darf kein <code>..</code> enthalten und nicht unter einem symlinkten Parent-Verzeichnis liegen; die Store-Root und das <code>configs</code>-Verzeichnis muessen echte Verzeichnisse sein; das <code>configs</code>-Verzeichnis muss innerhalb des Snapshot-Stores bleiben; und <code>current</code>, Snapshot-TOML-Dateien und Metadaten-TOML-Dateien werden als regulaere Dateien geoeffnet. Symlinkte Store-Roots, Pointer, Konfigurationen, Metadaten oder <code>configs</code>-Pfade werden abgelehnt, damit ein Rollback nicht auf eine vom Betreiber nicht freigegebene Datei umgeleitet werden kann. Atomare Writes erfordern ausserdem ein bereits validiertes echtes Parent-Verzeichnis und ersetzen kein symlinktes Ziel. Snapshot-Reads sind begrenzt: <code>current</code> ist auf 4 KiB begrenzt und Snapshot-TOML-/Metadaten-Reads sind auf 16 MiB begrenzt. Snapshot-Stores sind auf 1024 Snapshots begrenzt; Betreiber sollten alte Snapshots vor diesem Limit exportieren oder bereinigen."

