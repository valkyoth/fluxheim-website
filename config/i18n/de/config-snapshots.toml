to = "Ein konfigurierbares Health-Fenster mit dem Background-Watchdog ueberwachen."

[[phrase]]
from = "Treat clear failures as broken, for example local health-check failure, startup-owned service failure, or an authenticated failure report from the local watchdog."
to = "Klare Fehler als broken behandeln, zum Beispiel lokalen Health-Check-Fehler, startup-eigenen Service-Fehler oder einen authentifizierten Failure-Report vom lokalen Watchdog."

[[phrase]]
from = "Automatically swap back to the previous known-good runtime snapshot when the new snapshot is unhealthy."
to = "Automatisch zum vorherigen Known-good-Runtime-Snapshot zuruecktauschen, wenn der neue Snapshot unhealthy ist."

[[phrase]]
from = "Leave process-upgrade-only changes to the supervisor/Pingora upgrade path."
to = "Process-upgrade-only-Aenderungen dem Supervisor-/Pingora-Upgrade-Pfad ueberlassen."

[[phrase]]
from = "The first implementation should be conservative. It should prefer keeping the old known-good config over guessing that a risky new config is healthy."
to = "Die erste Implementierung sollte konservativ sein. Sie sollte die alte Known-good-Konfiguration lieber behalten, statt zu raten, dass eine riskante neue Konfiguration gesund ist."

