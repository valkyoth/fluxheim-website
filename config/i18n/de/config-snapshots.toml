from = "The reload endpoint returns"
to = "Der Reload-Endpunkt gibt"

[[phrase]]
from = "when the current snapshot requires a process upgrade, such as listener, TLS backend/mode, admin service, or metrics service, or startup-owned load-balancer service changes. Existing requests keep their old runtime snapshot; new requests use the freshly swapped proxy snapshot."
to = "zurueck, wenn der aktuelle Snapshot ein Prozess-Upgrade erfordert, etwa bei Listener, TLS-Backend/-Modus, Admin-Service, Metrics-Service oder startup-eigenen Load-Balancer-Service-Aenderungen. Bestehende Requests behalten ihren alten Runtime-Snapshot; neue Requests nutzen den frisch getauschten Proxy-Snapshot."

[[phrase]]
from = "Load-balancer service changes include adding or removing vhost/route pools and changing static pool members, file/DNS/HTTP discovery sources, discovery refresh intervals, or HTTP discovery bearer-token files. These refresh loops are registered at process startup, so use the normal supervisor/process-upgrade path for those changes."
to = "Load-Balancer-Service-Aenderungen umfassen das Hinzufuegen oder Entfernen von vhost-/Routen-Pools und das Aendern statischer Pool-Mitglieder, File-/DNS-/HTTP-Discovery-Quellen, Discovery-Refresh-Intervalle oder HTTP-Discovery-Bearer-Token-Dateien. Diese Refresh-Loops werden beim Prozessstart registriert, daher nutze fuer solche Aenderungen den normalen Supervisor-/Prozess-Upgrade-Pfad."

