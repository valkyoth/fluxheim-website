[[phrase]]
from = "The recommended container mode is rootless with host ports mapped to the container&#x27;s high internal listener ports. If a deployment deliberately runs the container as root for direct low-port binding, keep mounted config, content, certificate, cache, and runtime directories separate and permission them for the chosen runtime user."
to = "Der empfohlene Container-Modus ist rootless, wobei Host-Ports auf die hohen internen Listener-Ports des Containers gemappt werden. Wenn ein Deployment den Container absichtlich als root fuer direktes Low-Port-Binding ausfuehrt, halte gemountete Konfiguration, Content, Zertifikate, Cache- und Runtime-Verzeichnisse getrennt und berechtige sie fuer den gewaehlten Runtime-User."

[[phrase]]
from = "The recommended native package mode binds public ports directly. The packaged default config listens on <code>80</code>, and the systemd unit grants only <code>CAP_NET_BIND_SERVICE</code> so the service can also bind <code>443</code> when TLS is enabled without running Fluxheim as root."
to = "Der empfohlene native Paketmodus bindet Public Ports direkt. Die paketierte Default-Konfiguration lauscht auf <code>80</code>, und die systemd-Unit gewaehrt nur <code>CAP_NET_BIND_SERVICE</code>, damit der Dienst auch <code>443</code> binden kann, wenn TLS aktiviert ist, ohne Fluxheim als root auszufuehren."

[[phrase]]
from = "Fluxheim&#x27;s memory-safety baseline does not replace operational security checks. Continue running dependency audits, license checks, malformed request framing tests, TLS scans, and load smoke tests for every stable release branch."
