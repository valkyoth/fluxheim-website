[[phrase]]
from = "Known Migration Boundaries"
to = "Bekannte Migrationsgrenzen"

[[phrase]]
from = "The following are intentional current load-balancer boundaries. They are not defects in the shipped load-balancer behavior; they are architectural gaps tracked for future module lines."
to = "Die folgenden Punkte sind absichtliche aktuelle Load-Balancer-Grenzen. Sie sind keine Defekte im ausgelieferten Load-Balancer-Verhalten, sondern architektonische Luecken, die fuer zukuenftige Modullinien verfolgt werden."

[[phrase]]
from = "Runtime add/remove/update-member operations are available for static upstream pools only. DNS/file/HTTP-discovery pools reject them because discovery refresh owns the live member set."
to = "Runtime-Add/Remove/Update-Member-Operationen sind nur fuer statische Upstream-Pools verfuegbar. DNS-/File-/HTTP-Discovery-Pools lehnen sie ab, weil der Discovery-Refresh den Live-Member-Satz besitzt."

[[phrase]]
from = "Runtime weight changes are available for round-robin and least-* selectors. Hash/ring selectors need future table-rebuild semantics before runtime weights are accepted there."
to = "Runtime-Gewichtsaenderungen sind fuer Round-Robin- und Least-*-Selektoren verfuegbar. Hash-/Ring-Selektoren brauchen zukuenftige Table-Rebuild-Semantik, bevor Runtime-Gewichte dort akzeptiert werden."

[[phrase]]
from = "Bounded-load consistent hashing is local to one Fluxheim process. It avoids selecting an over-bound hash target when another eligible ring candidate is available, but it does not coordinate load across multiple Fluxheim nodes."
to = "Bounded-Load-Consistent-Hashing ist lokal fuer einen Fluxheim-Prozess. Es vermeidet die Auswahl eines ueberlasteten Hash-Ziels, wenn ein anderer geeigneter Ring-Kandidat verfuegbar ist, koordiniert Last aber nicht ueber mehrere Fluxheim-Nodes."

[[phrase]]
from = "UDP, GSLB/DNS steering, WAF, VPN/firewall appliance behavior, and scripted iRules/Lua/Wasm behavior are intentionally separate roadmap lines."
to = "UDP, GSLB/DNS-Steuerung, WAF, VPN-/Firewall-Appliance-Verhalten und gescriptetes iRules/Lua/Wasm-Verhalten sind absichtlich separate Roadmap-Linien."

[[phrase]]
from = "<code>proxy.load_balance.queue</code> is opt-in. Defaults keep fail-fast behavior when no backend is selectable."
to = "<code>proxy.load_balance.queue</code> ist opt-in. Die Defaults behalten Fail-Fast-Verhalten bei, wenn kein Backend waehlbar ist."

[[phrase]]
from = "when nginx configs express preferred regions or manual failover tiers rather than simple backup-only behavior."
to = "wenn nginx-Konfigurationen bevorzugte Regionen oder manuelle Failover-Stufen statt einfachem Backup-only-Verhalten ausdruecken."

[[phrase]]
