[[phrase]]
from = "after the member has drained to zero in-flight requests. These backend-set mutations are local in-memory changes in the current release. Runtime backend sets are capped at 256 members, and the zero in-flight check is a best-effort mutation-time gate; Fluxheim warns if a narrow race leaves a request completing against a removed or retargeted address. Runtime-added or retargeted members carry address and configured weight only; aliases, tags, backup membership, priority groups, locality metadata, and per-upstream caps remain static-config fields. DNS/file-discovery pools and Maglev selectors reject runtime backend-set mutation."
to = "nachdem das Member auf null In-flight-Requests geleert wurde. Diese Backend-Set-Mutationen sind in der aktuellen Version lokale In-Memory-Aenderungen. Runtime-Backend-Sets sind auf 256 Members begrenzt, und die Null-In-flight-Pruefung ist ein Best-Effort-Gate zum Mutationszeitpunkt; Fluxheim warnt, wenn ein enges Race eine Anfrage gegen eine entfernte oder neu ausgerichtete Adresse abschliessen laesst. Zur Runtime hinzugefuegte oder neu ausgerichtete Members tragen nur Adresse und konfiguriertes Gewicht; Aliase, Tags, Backup-Mitgliedschaft, Priority-Groups, Locality-Metadaten und Per-Upstream-Caps bleiben Static-Config-Felder. DNS-/File-Discovery-Pools und Maglev-Selektoren lehnen Backend-Set-Mutationen zur Runtime ab."

