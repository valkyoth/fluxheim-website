[[phrase]]
from = "Use <code>weight=default</code>, <code>reset</code>, <code>clear</code>, or <code>configured</code> to clear the override. Hash, consistent-hash, bounded-load consistent, Maglev, and power-of-two selectors reject runtime weights in the current release because their ring/table or weighted-sampling semantics need a separate design."
to = "Verwende <code>weight=default</code>, <code>reset</code>, <code>clear</code> oder <code>configured</code>, um den Override zu loeschen. Hash-, Consistent-Hash-, Bounded-Load-Consistent-, Maglev- und Power-of-Two-Selektoren lehnen Runtime-Gewichte in der aktuellen Release ab, weil ihre Ring-/Table- oder Weighted-Sampling-Semantik ein separates Design braucht."

