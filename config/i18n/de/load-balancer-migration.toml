[[phrase]]
from = "Load Balancer Migration Notes"
to = "Load-Balancer-Migrationshinweise"

[[phrase]]
from = "Fluxheim <code>1.5.x</code> focuses on HTTP/TCP edge load-balancer operations that map cleanly from HAProxy, nginx, Envoy, and F5 LTM-style pools. The validated starting fixture is <code>examples/load-balancer-enterprise.toml</code>"
to = "Fluxheim <code>1.5.x</code> konzentriert sich auf HTTP/TCP-Edge-Load-Balancer-Betrieb, der sauber aus HAProxy-, nginx-, Envoy- und F5-LTM-artigen Pools abgebildet werden kann. Die validierte Start-Fixture ist <code>examples/load-balancer-enterprise.toml</code>"

[[phrase]]
from = ". For pull-based control-plane upstream lists, use"
to = ". Fuer pull-basierte Control-Plane-Upstream-Listen verwende"

[[phrase]]
from = ". For local command-based monitors, use"
to = ". Fuer lokale command-basierte Monitore verwende"

[[phrase]]
from = ". Exec monitor command paths and arguments are normal configuration data, so do not put credentials in argv; let the local helper read protected local secrets it owns. Runtime status and health-check backend summaries expose only the protocol, not the exec command path or arguments."
to = ". Exec-Monitor-Befehlspfade und Argumente sind normale Konfigurationsdaten; lege daher keine Zugangsdaten in argv ab. Der lokale Helper soll geschuetzte lokale Secrets lesen, die ihm gehoeren. Runtime-Status und Health-Check-Backend-Zusammenfassungen zeigen nur das Protokoll, nicht den Exec-Befehlspfad oder seine Argumente."

[[phrase]]
from = "This is a migration guide for pool behavior, not a claim that Fluxheim clones every product module. UDP, GSLB/DNS steering, WAF policy, VPN/firewall appliance behavior, and iRules/Lua/Wasm scripting are tracked as separate roadmap lines."
to = "Dies ist ein Migrationsleitfaden fuer Pool-Verhalten, keine Behauptung, dass Fluxheim jedes Produktmodul kopiert. UDP, GSLB/DNS-Steuerung, WAF-Policy, VPN-/Firewall-Appliance-Verhalten und iRules/Lua/Wasm-Scripting werden als separate Roadmap-Linien verfolgt."

