from = ", and related headers as untrusted remote input."
to = "und verwandte Header als nicht vertrauenswuerdige Remote-Eingaben behandeln."

[[phrase]]
from = "The direct peer IP should remain available in logs as"
to = "Die direkte Peer-IP sollte in Logs weiterhin als"

[[phrase]]
from = "The restored client IP should be stored separately as"
to = "Die wiederhergestellte Client-IP sollte separat als"

[[phrase]]
from = "so operators can audit whether traffic is actually coming through Cloudflare."
to = "gespeichert werden, damit Betreiber pruefen koennen, ob Traffic tatsaechlich ueber Cloudflare kommt."

[[phrase]]
from = "Header Handling"
to = "Header-Behandlung"

[[phrase]]
from = "Accepted headers after trust validation:"
to = "Akzeptierte Header nach der Vertrauensvalidierung:"

[[phrase]]
from = ": visitor IP to use for logs, WAF/rate-limit decisions, and admin visibility."
to = ": Besucher-IP fuer Logs, WAF-/Rate-Limit-Entscheidungen und Admin-Sichtbarkeit."

[[phrase]]
from = ": request correlation ID for structured logs and optional response echoing."
to = ": Request-Korrelations-ID fuer strukturierte Logs und optionales Response-Echoing."

[[phrase]]
from = ": coarse country signal for logs/metrics after cardinality controls."
to = ": grobes Laendersignal fuer Logs/Metriken nach Kardinalitaetskontrollen."

[[phrase]]
from = ": optional scheme metadata, parsed strictly as JSON if needed."
to = ": optionale Scheme-Metadaten, bei Bedarf strikt als JSON geparst."

[[phrase]]
from = ": optional context fields, never security authorities."
to = ": optionale Kontextfelder, niemals Security-Authorities."

[[phrase]]
from = "Reject or ignore malformed IP values."
to = "Fehlformatierte IP-Werte ablehnen oder ignorieren."

[[phrase]]
from = "Never let untrusted Cloudflare headers override socket-derived metadata."
to = "Niemals zulassen, dass nicht vertrauenswuerdige Cloudflare-Header aus dem Socket abgeleitete Metadaten ueberschreiben."

[[phrase]]
from = ", city, device, worker, or bot headers as authorization decisions."
to = ", City-, Device-, Worker- oder Bot-Header als Autorisierungsentscheidungen verwenden."

[[phrase]]
from = "Keep metrics labels bounded. Country labels may be allowed only as fixed two-letter country codes plus"
to = "Metrik-Labels begrenzen. Laender-Labels duerfen nur als feste zweibuchstabige Laendercodes plus"

[[phrase]]
from = "; never use free-form city names as labels."
to = "zugelassen werden; niemals frei formulierte Staedtenamen als Labels verwenden."

[[phrase]]
from = "Redact or bound all header values in logs."
to = "Alle Header-Werte in Logs redigieren oder begrenzen."

[[phrase]]
from = "IP Range Refresh"
to = "IP-Range-Refresh"

[[phrase]]
from = "load a configured pinned Cloudflare IP range file;"
to = "eine konfigurierte gepinnte Cloudflare-IP-Range-Datei laden;"

[[phrase]]
from = "validate every CIDR;"
to = "jedes CIDR validieren;"

[[phrase]]
from = "refuse startup if Cloudflare mode requires trusted ranges and none are usable."
to = "den Start verweigern, wenn der Cloudflare-Modus vertrauenswuerdige Ranges verlangt und keine nutzbar sind."

[[phrase]]
from = "fetch Cloudflare's official IP range API daily or on a configured interval;"
to = "Cloudflares offizielle IP-Range-API taeglich oder in einem konfigurierten Intervall abrufen;"

[[phrase]]
from = "validate the complete response before swapping it in;"
to = "die komplette Antwort validieren, bevor sie ausgetauscht wird;"

[[phrase]]
from = "keep the last known-good range set if refresh fails;"
to = "das letzte als gut bekannte Range-Set behalten, wenn der Refresh fehlschlaegt;"

[[phrase]]
from = "last_failure"
to = "last_failure"

[[phrase]]
from = "last_success"
to = "last_success"

[[phrase]]
from = "and active range count in metrics and admin status;"
to = "und die aktive Range-Anzahl in Metriken und Admin-Status erfassen;"

[[phrase]]
from = "never block request workers while refreshing."
to = "Request-Worker waehrend des Refreshs niemals blockieren."

[[phrase]]
from = "or equivalent atomic state so new requests see the fresh range set without interrupting active requests."
to = "oder aequivalenten atomaren Zustand verwenden, damit neue Requests das frische Range-Set sehen, ohne aktive Requests zu unterbrechen."

[[phrase]]
from = "Origin CA Automation"
to = "Origin-CA-Automatisierung"

[[phrase]]
from = "Cloudflare Origin CA certificates are separate from Let's Encrypt/ACME certificates. They are trusted by Cloudflare for edge-to-origin TLS, not by normal browsers directly."
to = "Cloudflare-Origin-CA-Zertifikate sind von Let's-Encrypt-/ACME-Zertifikaten getrennt. Cloudflare vertraut ihnen fuer Edge-to-Origin-TLS, normale Browser aber nicht direkt."

[[phrase]]
from = "Generate a private key locally with strict permissions."
to = "Einen Private Key lokal mit strikten Berechtigungen erzeugen."

[[phrase]]
from = "Generate a CSR for configured hostnames."
to = "Einen CSR fuer konfigurierte Hostnames erzeugen."

[[phrase]]
from = "Call the Cloudflare Origin CA create-certificate API."
to = "Die Cloudflare-Origin-CA-Create-Certificate-API aufrufen."

[[phrase]]
from = "Persist certificate and key through Fluxheim's atomic snapshot/storage pattern."
to = "Zertifikat und Key ueber Fluxheims atomares Snapshot-/Storage-Muster persistieren."

[[phrase]]
from = "Validate certificate hostnames and expiry."
to = "Zertifikat-Hostnames und Ablauf validieren."

[[phrase]]
from = "Reload TLS state without downtime through the existing cert reload model."
to = "TLS-Zustand ohne Downtime ueber das bestehende Zertifikat-Reload-Modell neu laden."

[[phrase]]
from = "Optionally revoke superseded Origin CA certificates after a safe overlap period."
to = "Ersetzte Origin-CA-Zertifikate optional nach einer sicheren Ueberlappungszeit widerrufen."

[[phrase]]
from = "API token must be least-privilege and loaded from a secret path or environment, not committed into config snapshots."
to = "Das API-Token muss Least-Privilege sein und aus einem Secret-Pfad oder der Umgebung geladen werden, nicht in Konfigurations-Snapshots committed."

[[phrase]]
from = "Token, CSR private key, and certificate private key must never be logged."
to = "Token, CSR-Private-Key und Zertifikat-Private-Key duerfen niemals geloggt werden."

[[phrase]]
from = "Renewal should happen well before expiry and expose failures through admin/metrics/logging."
to = "Renewal sollte deutlich vor Ablauf erfolgen und Fehler ueber Admin, Metriken und Logging sichtbar machen."

[[phrase]]
from = "The operator must be able to disable automation and use their own certificate files."
to = "Der Betreiber muss Automatisierung deaktivieren und eigene Zertifikatsdateien nutzen koennen."

[[phrase]]
from = "Authenticated Origin Pulls"
to = "Authenticated Origin Pulls"

[[phrase]]
from = "Authenticated Origin Pulls add mTLS client-certificate verification from Cloudflare to the origin."
to = "Authenticated Origin Pulls ergaenzen mTLS-Client-Zertifikat-Verifikation von Cloudflare zum Origin."

[[phrase]]
from = "Global AOP: easiest setup, but the Cloudflare-provided client certificate is shared across Cloudflare accounts and proves only that the connection came from Cloudflare's network."
to = "Globales AOP: einfachstes Setup, aber das von Cloudflare bereitgestellte Client-Zertifikat wird ueber Cloudflare-Konten geteilt und beweist nur, dass die Verbindung aus Cloudflares Netzwerk kam."

[[phrase]]
from = "Zone-level AOP: uses a user-uploaded certificate and is stricter."
to = "Zone-Level-AOP: nutzt ein vom Benutzer hochgeladenes Zertifikat und ist strikter."

[[phrase]]
from = "Per-hostname AOP: uses a user-uploaded certificate for specific hostnames and is preferred for mixed or high-security deployments."
to = "Per-Hostname-AOP: nutzt ein vom Benutzer hochgeladenes Zertifikat fuer bestimmte Hostnames und wird fuer gemischte oder hochsichere Deployments bevorzugt."

[[phrase]]
from = "configured AOP CA bundle per listener/vhost;"
to = "konfiguriertes AOP-CA-Bundle pro Listener/Vhost;"

[[phrase]]
from = "certificate verification during TLS handshake where the selected TLS backend supports it;"
to = "Zertifikatsverifikation waehrend des TLS-Handshakes, wo das ausgewaehlte TLS-Backend sie unterstuetzt;"

[[phrase]]
from = "certificate reload without dropping active requests;"
to = "Zertifikat-Reload ohne aktive Requests zu verlieren;"

[[phrase]]
from = "metrics/logs for AOP success/failure counts;"
to = "Metriken/Logs fuer AOP-Erfolgs- und Fehlerzaehler;"

[[phrase]]
from = "clear validation warnings when a deployment relies only on global AOP."
to = "klare Validierungswarnungen, wenn ein Deployment nur auf globales AOP setzt."

