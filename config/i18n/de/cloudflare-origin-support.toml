from = "the direct peer socket IP is in the validated Cloudflare IP range set;"
to = "die direkte Peer-Socket-IP liegt im validierten Cloudflare-IP-Range-Set;"

[[phrase]]
from = "Authenticated Origin Pulls mTLS verification succeeded;"
to = "die mTLS-Verifikation von Authenticated Origin Pulls war erfolgreich;"

[[phrase]]
