to = "ein zukuenftiger explizit vertrauenswuerdiger Listener ist fuer privaten Cloudflare-Tunnel-Traffic konfiguriert."

[[phrase]]
from = "If none of those conditions succeeds, Fluxheim must treat"
to = "Wenn keine dieser Bedingungen erfolgreich ist, muss Fluxheim"

