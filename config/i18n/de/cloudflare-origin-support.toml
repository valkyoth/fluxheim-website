locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Cloudflare Origin Support"
to = "Cloudflare-Origin-Unterstuetzung"

[[phrase]]
from = "No Cloudflare module should be compiled into the default binary."
to = "Kein Cloudflare-Modul sollte in das Standard-Binary kompiliert werden."

[[phrase]]
from = "Restore the real visitor IP only for verified Cloudflare-originated requests."
to = "Die echte Besucher-IP nur fuer verifizierte Anfragen wiederherstellen, die von Cloudflare stammen."

[[phrase]]
from = "Correlate access logs with Cloudflare Ray IDs."
to = "Access-Logs mit Cloudflare-Ray-IDs korrelieren."

[[phrase]]
from = "Support Cloudflare IP range refresh without downtime."
to = "Cloudflare-IP-Range-Refresh ohne Downtime unterstuetzen."

[[phrase]]
from = "Support Cloudflare Origin CA certificate issuance as an optional automation."
to = "Die Ausstellung von Cloudflare-Origin-CA-Zertifikaten als optionale Automatisierung unterstuetzen."

[[phrase]]
from = "Support Authenticated Origin Pulls as an optional mTLS hardening layer."
to = "Authenticated Origin Pulls als optionale mTLS-Haertungsschicht unterstuetzen."

[[phrase]]
from = "Keep Cloudflare credentials out of config snapshots and logs."
to = "Cloudflare-Zugangsdaten aus Konfigurations-Snapshots und Logs heraushalten."

[[phrase]]
from = "No dependency on Cloudflare in default builds."
to = "Keine Abhaengigkeit von Cloudflare in Standard-Builds."

[[phrase]]
from = "No automatic mutation of Cloudflare zone settings in the MVP."
to = "Keine automatische Aenderung von Cloudflare-Zone-Einstellungen im MVP."

[[phrase]]
from = "No promise that Cloudflare global AOP proves the user's specific account."
to = "Kein Versprechen, dass globales Cloudflare-AOP das konkrete Konto des Benutzers beweist."

[[phrase]]
from = "No replacement for normal ACME/own-certificate support."
to = "Kein Ersatz fuer normale ACME- oder eigene Zertifikat-Unterstuetzung."

[[phrase]]
from = "Reviewed crate candidates as of 2026-05-05:"
to = "Gepruefte Crate-Kandidaten mit Stand 2026-05-05:"

