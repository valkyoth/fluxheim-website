[[phrase]]
from = "Sentinel Mesh"
to = "Sentinel Mesh"
[[phrase]]
from = "Sentinel Mesh — Fluxheim Source Docs"
to = "Sentinel Mesh - Fluxheim-Source-Dokumentation"
[[phrase]]
from = "Sentinel Mesh: Smart WireGuard Load Balancing"
to = "Sentinel Mesh: Smartes WireGuard-Load-Balancing"
[[phrase]]
from = "Sentinel Mesh is a future Fluxheim architecture for a self-healing smart load balancer. It combines Pingora's proxy and load-balancing hooks with a private WireGuard transport and real-time backend telemetry. The goal is to route by observed health and load instead of only round-robin or static weights."
to = "Sentinel Mesh ist eine kuenftige Fluxheim-Architektur fuer einen selbstheilenden smarten Load Balancer. Sie kombiniert Pingoras Proxy- und Load-Balancing-Hooks mit privatem WireGuard-Transport und Echtzeit-Backend-Telemetrie. Ziel ist Routing nach beobachteter Health und Last statt nur Round-Robin oder statischen Gewichten."
[[phrase]]
from = "This is a design target, not an implemented module."
to = "Dies ist ein Designziel, kein implementiertes Modul."
[[phrase]]
from = "Keep backend traffic private and encrypted even across clouds or sites."
to = "Backend-Traffic auch ueber Clouds oder Sites hinweg privat und verschluesselt halten."
[[phrase]]
from = "Support rootless/local operation where possible."
to = "Rootless-/lokalen Betrieb unterstuetzen, wo moeglich."
[[phrase]]
from = "Route requests to the healthiest backend using current telemetry."
to = "Requests anhand aktueller Telemetrie zum gesuendesten Backend routen."
[[phrase]]
from = "Expose clear operator state showing why a backend was selected."
to = "Klaren Operator-Zustand anzeigen, der zeigt, warum ein Backend ausgewaehlt wurde."
[[phrase]]
from = "Allow manual drain and maintenance controls without restarting Fluxheim."
to = "Manuelle Drain- und Wartungskontrollen ohne Neustart von Fluxheim erlauben."
[[phrase]]
from = "Keep all state transitions testable as ordinary Rust logic."
to = "Alle Zustandsuebergaenge als normale Rust-Logik testbar halten."
[[phrase]]
from = "Replacing kernel WireGuard for every deployment. Kernel WireGuard should remain an option when host networking is available and preferred."
to = "Kernel-WireGuard fuer jedes Deployment ersetzen. Kernel-WireGuard sollte eine Option bleiben, wenn Host-Networking verfuegbar und gewuenscht ist."
[[phrase]]
from = "Building a general service mesh in the first version."
to = "Ein allgemeines Service Mesh in der ersten Version bauen."
[[phrase]]
from = "Trusting backend-reported telemetry without authentication and sanity checks."
to = "Backend-gemeldeter Telemetrie ohne Authentifizierung und Plausibilitaetspruefungen vertrauen."
[[phrase]]
