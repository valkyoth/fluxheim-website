locale_id = "de-DE"
html_lang = "de-DE"
[[phrase]]
from = "Release Checklist — Fluxheim Source Docs"
to = "Release-Checkliste - Fluxheim-Source-Dokumentation"
[[phrase]]
from = "Use this checklist before publishing a Fluxheim release, changing dependency versions, changing TLS/cache/proxy behavior, or building an image for other people to run."
to = "Nutze diese Checkliste, bevor du ein Fluxheim-Release veröffentlichst, Dependency-Versionen änderst, TLS-/Cache-/Proxy-Verhalten änderst oder ein Image baust, das andere ausführen sollen."
[[phrase]]
from = "Version And Toolchain"
to = "Version und Toolchain"
[[phrase]]
from = "Confirm the Rust version in"
to = "Bestätige die Rust-Version in"
[[phrase]]
from = "Run the release metadata preflight:"
to = "Führe den Preflight für Release-Metadaten aus:"
[[phrase]]
from = "Check that the pinned Rust version is still the current stable release before release work starts."
to = "Prüfe vor Beginn der Release-Arbeit, dass die festgelegte Rust-Version weiterhin das aktuelle stabile Release ist."
[[phrase]]
from = "Install or update the tools with locked dependency resolution:"
to = "Installiere oder aktualisiere die Tools mit gesperrter Dependency-Auflösung:"
[[phrase]]
from = "Dependency, License, And Advisory Gates"
to = "Dependency-, Lizenz- und Advisory-Gates"
[[phrase]]
from = "only as a deliberate dependency maintenance step."
to = "nur als bewussten Schritt zur Dependency-Wartung."
[[phrase]]
from = "Before tagging, verify compatible dependency updates are exhausted. This gate intentionally ignores"
to = "Prüfe vor dem Tagging, dass kompatible Dependency-Updates ausgeschöpft sind. Dieses Gate ignoriert absichtlich"
[[phrase]]
from = "packages while Fluxheim is still exiting the Pingora compatibility runtime dependency surface:"
to = "Pakete, solange Fluxheim die Pingora-Kompatibilitätsfläche bei Runtime-Dependencies noch verlässt:"
[[phrase]]
from = "Pingora-exit line, capture the runtime baseline evidence before tagging."
to = "Pingora-Exit-Linie müssen vor dem Tagging Runtime-Baseline-Nachweise erfasst werden."
[[phrase]]
from = "mode records locked dependency trees and the per-profile Pingora dependency surface, including native web TLS proof profiles;"
to = "Modus zeichnet gesperrte Dependency-Bäume und die Pingora-Dependency-Fläche je Profil auf, einschließlich nativer Web-TLS-Nachweisprofile;"
[[phrase]]
from = "mode also records the default release-binary size and local performance baseline:"
to = "Modus zeichnet außerdem die Größe des Standard-Release-Binarys und die lokale Performance-Baseline auf:"
[[phrase]]
from = "Review every new dependency for maintenance status and SPDX license metadata."
to = "Prüfe jede neue Dependency auf Wartungsstatus und SPDX-Lizenzmetadaten."
[[phrase]]
from = "Review every new build script, procedural macro,"
to = "Prüfe jedes neue Build-Skript, prozedurale Makro,"
[[phrase]]
from = "crate, vendored native source, native tool invocation, Cargo alias, and CI workflow edit as build-host code execution."
to = "Crate, vendored nativen Quellcode, nativen Tool-Aufruf, Cargo-Alias und jede CI-Workflow-Änderung als Codeausführung auf dem Build-Host."
[[phrase]]
from = "strict: unknown registries, git sources, and unknown licenses stay denied."
to = "streng: unbekannte Registries, Git-Quellen und unbekannte Lizenzen bleiben verboten."
[[phrase]]
from = "exceptions narrow, versioned, and documented with a removal condition."
to = "Ausnahmen eng, versioniert und mit einer Bedingung zur Entfernung dokumentiert."
[[phrase]]
from = "For unmaintained transitive dependencies inherited from Pingora or TLS backends, prefer upstream fixes over local forks. Track the package, advisory ID, upstream source, Fluxheim reachability, and removal condition in"
to = "Bei unmaintained transitiven Dependencies aus Pingora oder TLS-Backends sind Upstream-Fixes lokalen Forks vorzuziehen. Verfolge Paket, Advisory-ID, Upstream-Quelle, Fluxheim-Erreichbarkeit und Entfernungsbedingung in"
[[phrase]]
from = "and release notes. Do not promote an ignored advisory from warning to accepted risk without a written reason."
to = "und Release Notes. Stufe ein ignoriertes Advisory ohne schriftliche Begründung nicht von einer Warnung zu einem akzeptierten Risiko hoch."
[[phrase]]
from = "Run the release wrapper:"
to = "Führe den Release-Wrapper aus:"
[[phrase]]
from = "The wrapper runs formatting, clippy, tests, selected feature builds, example config validation,"
to = "Der Wrapper führt Formatierung, clippy, Tests, ausgewählte Feature-Builds, Beispielkonfigurationsvalidierung,"
[[phrase]]
from = "gateway scope is defined in the versioning plan and must cover representative multi-site gateway configs before a stable tag."
to = "Gateway-Scope ist im Versionierungsplan definiert und muss vor einem stabilen Tag repräsentative Multi-Site-Gateway-Konfigurationen abdecken."
[[phrase]]
from = "For the stable-release gate without incubator module checks, use:"
to = "Für das Stable-Release-Gate ohne Incubator-Modulprüfungen verwende:"
[[phrase]]
from = "Run the core localhost smoke directly when changing stable static/proxy behavior:"
to = "Führe den Core-Localhost-Smoke direkt aus, wenn stabiles Static-/Proxy-Verhalten geändert wird:"
[[phrase]]
from = "<p>This smoke requires <code>openssl</code> for a temporary self-signed certificate. It covers HTTP static hosting, HTTP proxying, static certificate storage validation, HTTPS static hosting, and HTTPS proxying.</p>"
to = "<p>Dieser Smoke benötigt <code>openssl</code> für ein temporäres selbstsigniertes Zertifikat. Er deckt HTTP-Static-Hosting, HTTP-Proxying, Validierung statischer Zertifikatsspeicherung, HTTPS-Static-Hosting und HTTPS-Proxying ab.</p>"
[[phrase]]
from = "for a temporary self-signed certificate. It covers HTTP static hosting, HTTP proxying, static certificate storage validation, HTTPS static hosting, and HTTPS proxying."
to = "für ein temporäres selbstsigniertes Zertifikat. Er deckt HTTP-Static-Hosting, HTTP-Proxying, Validierung statischer Zertifikatsspeicherung, HTTPS-Static-Hosting und HTTPS-Proxying ab."
[[phrase]]
from = "Confirm GitHub CodeQL default setup is enabled for"
to = "Bestätige, dass das GitHub-CodeQL-Default-Setup aktiviert ist für"
[[phrase]]
from = ". Do not also enable an advanced CodeQL workflow for the same repository; GitHub rejects advanced SARIF uploads when default setup is active."
to = ". Aktiviere nicht zusätzlich einen erweiterten CodeQL-Workflow für dasselbe Repository; GitHub weist erweiterte SARIF-Uploads zurück, wenn das Default-Setup aktiv ist."
[[phrase]]
from = "Confirm the Rust CI workflow still runs the core feature matrix in both check and release modes, plus the"
to = "Bestätige, dass der Rust-CI-Workflow die Core-Feature-Matrix weiterhin sowohl im Check- als auch im Release-Modus ausführt, plus den"
[[phrase]]
from = "TLS And Certificate Storage"
to = "TLS und Zertifikatsspeicherung"
[[phrase]]
from = "Static certificate chains and private keys are supported. Bought certificates remain a first-class deployment mode."
to = "Statische Zertifikatsketten und private Schlüssel werden unterstützt. Gekaufte Zertifikate bleiben ein erstklassiger Deployment-Modus."
[[phrase]]
from = "In the default rustls build, validate the default downstream certificate and at least one vhost-specific SNI certificate per TLS listener."
to = "Validiere im standardmäßigen rustls-Build das Default-Downstream-Zertifikat und mindestens ein vhost-spezifisches SNI-Zertifikat pro TLS-Listener."
[[phrase]]
from = "The core smoke generates temporary static certificates and proves static, proxied, and SNI-selected vhosts over a TLS listener."
to = "Der Core-Smoke erzeugt temporäre statische Zertifikate und weist statische, proxied und per SNI ausgewählte vhosts über einen TLS-Listener nach."
[[phrase]]
from = "ACME config and renewal queue planning are implemented, but account/order and challenge runtime work is not release-ready yet. Do not document automated ACME issuance as operational until that runtime is implemented and tested."
to = "ACME-Konfiguration und Renewal-Queue-Planung sind implementiert, aber Account-/Order- und Challenge-Runtime-Arbeit ist noch nicht releasebereit. Dokumentiere automatisierte ACME-Ausstellung nicht als betriebsfähig, bis diese Runtime implementiert und getestet ist."
[[phrase]]
from = "Validate production-like TLS storage before startup:"
to = "Validiere produktionsnahe TLS-Speicherung vor dem Start:"
[[phrase]]
from = "On Unix, private keys should be owner-only ("
to = "Unter Unix sollten private Schlüssel nur dem Eigentümer zugänglich sein ("
[[phrase]]
from = ") and ACME storage directories should be owner-only ("
to = ") und ACME-Speicherverzeichnisse sollten nur dem Eigentümer zugänglich sein ("
[[phrase]]
from = "Core Build Matrix"
to = "Core-Build-Matrix"
[[phrase]]
from = "release, confirm the stable core binaries compile. This matrix intentionally excludes post-1.0 modules such as load balancing, metrics, admin, ACME runtime, WAF, PHP/CGI, Cloudflare automation, legacy HTTP, and WASM."
to = "Release bestätige, dass die stabilen Core-Binaries kompilieren. Diese Matrix schließt Post-1.0-Module wie Load Balancing, Metrics, Admin, ACME-Runtime, WAF, PHP/CGI, Cloudflare-Automatisierung, Legacy-HTTP und WASM absichtlich aus."
[[phrase]]
from = "For faster local iteration before a release tag, run the same matrix as checks instead of release builds:"
to = "Für schnellere lokale Iteration vor einem Release-Tag führe dieselbe Matrix als Checks statt als Release-Builds aus:"
[[phrase]]
from = "Validate the representative split-config fixture set before a"
to = "Validiere das repräsentative Split-Config-Fixture-Set vor einem"
[[phrase]]
from = "Stable Release Security And Stability Gate"
to = "Sicherheits- und Stabilitäts-Gate für stabile Releases"
[[phrase]]
from = "Passing memory-safe Rust builds is not enough for a proxy. Before every stable release, run this gate against the stable modules included in that release and record the results in the release notes. For"
to = "Speichersichere Rust-Builds zu bestehen reicht für einen Proxy nicht aus. Führe dieses Gate vor jedem stabilen Release gegen die darin enthaltenen stabilen Module aus und erfasse die Ergebnisse in den Release Notes. Für"
[[phrase]]
from = ", the target is the documented basic-sites preview. For"
to = "ist das Ziel die dokumentierte Basic-Sites-Preview. Für"
[[phrase]]
from = ", the target is the gateway core needed for representative multi-site configs. For later minors, include every module promoted to"
to = "ist das Ziel der Gateway-Core, der für repräsentative Multi-Site-Konfigurationen benötigt wird. Bei späteren Minor-Releases schließe jedes Modul ein, das auf"
[[phrase]]
from = "in that release."
to = "in diesem Release hochgestuft wurde."
[[phrase]]
from = "Local checks that can be run from this repository:"
to = "Lokale Checks, die aus diesem Repository ausgeführt werden können:"
[[phrase]]
from = "Run the local gate wrapper:"
to = "Führe den lokalen Gate-Wrapper aus:"
[[phrase]]
from = "For faster iteration before release week, run the same local gate in check mode:"
to = "Für schnellere Iteration vor der Release-Woche führe dasselbe lokale Gate im Check-Modus aus:"
[[phrase]]
from = "The stable gate includes the mapped OWASP Top 10 2025 baseline in quick"
to = "Das Stable-Gate enthält die zugeordnete OWASP-Top-10-2025-Baseline im schnellen"
[[phrase]]
from = "mode. Run the deeper representative-test mode when the release touches request handling, admin, PHP, TLS, logging, cache, dependency, or error-handling code:"
to = "Modus. Führe den tieferen repräsentativen Testmodus aus, wenn das Release Request-Handling, Admin, PHP, TLS, Logging, Cache, Dependency- oder Error-Handling-Code berührt:"
[[phrase]]
from = "The stable gate includes the promoted cache and observability smoke tests for the"
to = "Das Stable-Gate enthält die hochgestuften Cache- und Observability-Smoke-Tests für die"
[[phrase]]
from = "plus representative Debian and Alpine variant builds. This catches workspace, packaging, and image build context mistakes before an immutable tag is pushed."
to = "plus repräsentative Debian- und Alpine-Varianten-Builds. Das fängt Fehler im Workspace, Packaging und Image-Build-Kontext ab, bevor ein unveränderlicher Tag gepusht wird."
[[phrase]]
from = "beta changes, include the optional UDP smoke before tagging:"
to = "Beta-Änderungen schließe vor dem Tagging den optionalen UDP-Smoke ein:"
[[phrase]]
from = "with that gate for a longer local soak when UDP forwarding, rate limits, or passive health behavior changed."
to = "mit diesem Gate für einen längeren lokalen Soak, wenn UDP-Forwarding, Rate Limits oder passives Health-Verhalten geändert wurden."
[[phrase]]
from = "If a release builder cannot run Podman, do not skip this silently. Run the image gate on another builder and attach the evidence before tagging. The emergency-only bypass is:"
to = "Wenn ein Release-Builder Podman nicht ausführen kann, überspringe das nicht stillschweigend. Führe das Image-Gate auf einem anderen Builder aus und hänge die Nachweise vor dem Tagging an. Der reine Notfall-Bypass ist:"
[[phrase]]
from = "Optional gates below still cover slower or environment-specific checks such as TLS backend matrices, load testing, fuzz target compilation, and full Podman variant image smoke tests."
to = "Die optionalen Gates unten decken weiterhin langsamere oder umgebungsspezifische Checks wie TLS-Backend-Matrizen, Lasttests, Fuzz-Target-Kompilierung und vollständige Podman-Varianten-Image-Smoke-Tests ab."
[[phrase]]
from = "For release-candidate validation, run the deeper local gate. It enables the TLS backend matrix, OpenSSL FIPS-capable validation, rustls/AWS-LC FIPS-capable validation, local TLS scan, local load smoke, raw request-framing smoke, and fuzz target compile check:"
to = "Für Release-Candidate-Validierung führe das tiefere lokale Gate aus. Es aktiviert die TLS-Backend-Matrix, OpenSSL-FIPS-fähige Validierung, rustls/AWS-LC-FIPS-fähige Validierung, lokalen TLS-Scan, lokalen Last-Smoke, Raw-Request-Framing-Smoke und Fuzz-Target-Kompiliercheck:"
[[phrase]]
from = "If the local release builder can run the rest of the deep gate but is not an AWS-LC-supported rustls FIPS builder, disable only that gate and attach rustls evidence from the supported builder separately:"
to = "Wenn der lokale Release-Builder den Rest des Deep-Gates ausführen kann, aber kein von AWS-LC unterstützter rustls-FIPS-Builder ist, deaktiviere nur dieses Gate und hänge rustls-Nachweise vom unterstützten Builder separat an:"
[[phrase]]
from = "Enable optional local matrices when the release includes those deliverables:"
to = "Aktiviere optionale lokale Matrizen, wenn das Release diese Deliverables enthält:"
[[phrase]]
from = "For release builders that are expected to have a working OpenSSL FIPS provider, make absence a hard failure:"
to = "Bei Release-Buildern, die einen funktionierenden OpenSSL-FIPS-Provider haben sollen, mache dessen Fehlen zu einem harten Fehler:"
[[phrase]]
from = "Dependency and license policy:"
to = "Dependency- und Lizenzrichtlinie:"
[[phrase]]
from = "Static analysis and regression suite:"
to = "Statische Analyse und Regressionssuite:"
[[phrase]]
from = "Direct unsafe policy. Fluxheim"
to = "Richtlinie für direktes unsafe. Fluxheim"
[[phrase]]
from = "; this is enforced by the normal compile, clippy, and feature-matrix gates. Do not add direct"
to = "; dies wird durch normale Compile-, clippy- und Feature-Matrix-Gates erzwungen. Füge keine direkten"
[[phrase]]
from = "blocks or raw FFI to Fluxheim source. Prefer safe wrapper crates for platform APIs and safe task/waker primitives in tests."
to = "Blöcke oder raw FFI zu Fluxheim-Quellcode hinzu. Bevorzuge sichere Wrapper-Crates für Plattform-APIs und sichere Task-/Waker-Primitive in Tests."
[[phrase]]
from = "Panic and overflow policy. Release artifacts build with"
to = "Panic- und Overflow-Richtlinie. Release-Artefakte bauen mit"
[[phrase]]
from = "through clippy. Keep operational errors on"
to = "über clippy. Halte Betriebsfehler auf"
[[phrase]]
from = "or explicit fallback responses. Test-only assertions may continue using panicking helpers."
to = "oder expliziten Fallback-Antworten. Nur-Test-Assertions dürfen weiterhin panickende Helper verwenden."
[[phrase]]
from = "Native dependency policy. FIPS-capable profiles can intentionally pull native cryptographic modules such as OpenSSL providers or"
to = "Richtlinie für native Dependencies. FIPS-fähige Profile können absichtlich native kryptografische Module wie OpenSSL-Provider oder"
[[phrase]]
from = ". Record the provider/module certificate, compiler, platform, and Security Policy in release evidence, and run sanitizer builds where supported by that native dependency and target platform."
to = ". Erfasse Provider-/Modulzertifikat, Compiler, Plattform und Security Policy in den Release-Nachweisen und führe Sanitizer-Builds aus, wo sie von dieser nativen Dependency und Zielplattform unterstützt werden."
[[phrase]]
from = "Secret handling policy. Admin bearer tokens are read into zeroizing buffers, hashed, and compared through a vetted constant-time equality primitive. Keep new long-lived credentials in"
to = "Richtlinie für Secret-Handling. Admin-Bearer-Tokens werden in zeroizing Buffer gelesen, gehasht und über ein geprüftes Constant-Time-Equality-Primitiv verglichen. Halte neue langlebige Credentials in"
[[phrase]]
from = "for any equality check involving authentication tokens, signing secrets, or derived verifiers. Disk cache encryption keys and OpenBao tokens are long-lived credentials and must follow this policy. Do not classify normal cache object bodies as secrets unless a future module explicitly stores private user data."
to = "für jede Gleichheitsprüfung mit Authentifizierungstokens, Signing-Secrets oder abgeleiteten Verifiern. Disk-Cache-Verschlüsselungsschlüssel und OpenBao-Tokens sind langlebige Credentials und müssen dieser Richtlinie folgen. Klassifiziere normale Cache-Objektkörper nicht als Secrets, sofern ein zukünftiges Modul nicht ausdrücklich private Nutzerdaten speichert."
[[phrase]]
from = "Third-party unsafe inventory. Before a stable release, run"
to = "Third-Party-unsafe-Inventar. Führe vor einem stabilen Release"
[[phrase]]
from = "as an informational dependency review and record unexpected changes in the release notes. Do not treat every dependency-level unsafe finding as an automatic blocker: the networking, TLS, OS, and runtime stack may contain audited unsafe internals. Treat new unsafe in direct dependencies as a review trigger alongside"
to = "als informatives Dependency-Review aus und erfasse unerwartete Änderungen in den Release Notes. Behandle nicht jeden unsafe-Fund auf Dependency-Ebene automatisch als Blocker: Networking-, TLS-, OS- und Runtime-Stack können auditierte unsafe-Interna enthalten. Behandle neues unsafe in direkten Dependencies als Review-Auslöser neben"
[[phrase]]
from = "Supply-chain evidence. Stable release gates must generate SPDX and CycloneDX SBOMs with"
to = "Supply-Chain-Nachweise. Stable-Release-Gates müssen SPDX- und CycloneDX-SBOMs erzeugen mit"
[[phrase]]
from = ", record their checksums, and run a local reproducible-build check that compiles the release binary twice from separate target directories and compares the resulting executable hash. This does not prove cross-machine bit-for-bit reproducibility; it proves the published builder can reproduce its own release artifact from the tagged source and pinned lockfile. Cross-distro/container reproducibility remains a future hardening goal."
to = ", ihre Prüfsummen erfassen und einen lokalen Reproducible-Build-Check ausführen, der das Release-Binary zweimal aus getrennten Target-Verzeichnissen kompiliert und den resultierenden Executable-Hash vergleicht. Das beweist keine bitgenaue Reproduzierbarkeit über Maschinen hinweg; es beweist, dass der veröffentlichende Builder sein eigenes Release-Artefakt aus dem getaggten Source und dem gepinnten Lockfile reproduzieren kann. Cross-Distro-/Container-Reproduzierbarkeit bleibt ein zukünftiges Hardening-Ziel."
[[phrase]]
from = "Human dependency review. Track the"
to = "Menschliches Dependency-Review. Verfolge den"
[[phrase]]
from = "adoption path in"
to = "Adoptionspfad in"
[[phrase]]
from = "Rust Supply-Chain Security"
to = "Rust-Supply-Chain-Sicherheit"
[[phrase]]
from = "a blocking release gate until the initial exemption set and trusted audit imports have been reviewed."
to = "nicht zu einem blockierenden Release-Gate, bis der initiale Exemption-Satz und vertrauenswürdige Audit-Imports geprüft wurden."
[[phrase]]
from = "Request framing and smuggling regression tests. The unit suite must keep coverage for ambiguous"
to = "Request-Framing- und Smuggling-Regressionstests. Die Unit-Suite muss Coverage für mehrdeutige"
[[phrase]]
from = "values, and redirect target construction. Later stable modules must add their own malicious-input regression tests before release."
to = "Werte und Redirect-Target-Konstruktion behalten. Spätere stabile Module müssen vor dem Release eigene Regressionstests für bösartige Eingaben hinzufügen."
[[phrase]]
from = "Run the raw-socket framing smoke before tagging a stable proxy release:"
to = "Führe den Raw-Socket-Framing-Smoke aus, bevor ein stabiles Proxy-Release getaggt wird:"
[[phrase]]
from = "This smoke bypasses browser/client normalization and verifies malformed request framing is rejected on the wire."
to = "Dieser Smoke umgeht Browser-/Client-Normalisierung und verifiziert, dass fehlerhaftes Request-Framing auf der Leitung abgewiesen wird."
[[phrase]]
from = "Header scrubbing checks. The 1.0 smoke must continue proving that the default response policy does not expose version banners and strips common upstream implementation headers from proxied responses. Later stable modules must prove equivalent secret/banner scrubbing for their own outputs."
to = "Header-Scrubbing-Checks. Der 1.0-Smoke muss weiterhin nachweisen, dass die Default-Response-Policy keine Versionsbanner offenlegt und gängige Upstream-Implementierungsheader aus proxied Responses entfernt. Spätere stabile Module müssen äquivalentes Secret-/Banner-Scrubbing für ihre eigenen Ausgaben nachweisen."
[[phrase]]
from = "Local load test with a release binary and a representative 1.0 config:"
to = "Lokaler Lasttest mit einem Release-Binary und einer repräsentativen 1.0-Konfiguration:"
[[phrase]]
from = "Watch CPU, memory, open file descriptors, and logs during this test. The server should reject or shed load cleanly rather than panic."
to = "Beobachte während dieses Tests CPU, Speicher, offene Dateideskriptoren und Logs. Der Server sollte Last sauber abweisen oder abwerfen, statt zu panicken."
[[phrase]]
from = "Fluxheim also includes a local wrapper for this check:"
to = "Fluxheim enthält außerdem einen lokalen Wrapper für diesen Check:"
[[phrase]]
from = "The default duration is intentionally modest. Tune it for release validation:"
to = "Die Standarddauer ist absichtlich moderat. Passe sie für die Release-Validierung an:"
[[phrase]]
from = "TLS policy check. The current Fluxheim TLS listener configuration uses the selected Pingora TLS backend defaults and does not expose user-configurable cipher-suite or protocol-version settings yet. Release scans are therefore the enforcement gate: a stable release must not ship if the selected default TLS backend negotiates deprecated protocol versions or weak cipher suites."
to = "TLS-Policy-Check. Die aktuelle Fluxheim-TLS-Listener-Konfiguration nutzt die Defaults des ausgewählten Pingora-TLS-Backends und bietet noch keine nutzerkonfigurierbaren Cipher-Suite- oder Protokollversions-Einstellungen. Release-Scans sind daher das Enforcement-Gate: Ein stabiles Release darf nicht ausgeliefert werden, wenn das ausgewählte Default-TLS-Backend veraltete Protokollversionen oder schwache Cipher Suites aushandelt."
[[phrase]]
from = "Local TLS smoke. The localhost smoke already proves a static certificate over a TLS listener. For a deeper local scan, use a temporary copy of the latest stable"
to = "Lokaler TLS-Smoke. Der Localhost-Smoke weist bereits ein statisches Zertifikat über einen TLS-Listener nach. Für einen tieferen lokalen Scan verwende eine temporäre Kopie des neuesten stabilen"
[[phrase]]
from = "release against the release binary. Re-check the latest stable tag before each release; as of 2026-05-06, GitHub lists"
to = "Release gegen das Release-Binary. Prüfe vor jedem Release erneut den neuesten stabilen Tag; am 2026-05-06 listet GitHub"
[[phrase]]
from = "as the latest stable release:"
to = "als neuestes stabiles Release:"
[[phrase]]
from = "Fluxheim also includes a local wrapper that starts a temporary TLS listener, downloads the pinned stable scanner, and stores the report:"
to = "Fluxheim enthält außerdem einen lokalen Wrapper, der einen temporären TLS-Listener startet, den gepinnten stabilen Scanner herunterlädt und den Bericht speichert:"
[[phrase]]
from = "Do not vendor this script into the repository. Re-download it for release validation and record the commit/version it reports."
to = "Vendore dieses Skript nicht in das Repository. Lade es für die Release-Validierung erneut herunter und erfasse den Commit bzw. die Version, die es meldet."
[[phrase]]
from = "Checks that should be run by the maintainer from a deployment-like environment:"
to = "Checks, die der Maintainer aus einer deployment-ähnlichen Umgebung ausführen sollte:"
[[phrase]]
from = "Run an authenticated or allowlisted OWASP ZAP/Burp active scan against a staging deployment that has no real secrets, users, or customer content."
to = "Führe einen authentifizierten oder allowlisted OWASP-ZAP-/Burp-Aktivscan gegen ein Staging-Deployment aus, das keine echten Secrets, Nutzer oder Kundendaten enthält."
[[phrase]]
from = "or a public TLS scanner against the real public hostname after DNS, certificates, and firewall rules are final."
to = "oder einen öffentlichen TLS-Scanner gegen den echten öffentlichen Hostnamen, nachdem DNS, Zertifikate und Firewall-Regeln final sind."
[[phrase]]
from = ", or Gatling load test from a separate host. Local loopback hides network and socket pressure."
to = "oder Gatling-Lasttest von einem separaten Host aus. Lokales Loopback versteckt Netzwerk- und Socket-Druck."
[[phrase]]
from = "Run a slow-client test from a separate host to confirm header/body timeouts and connection limits are effective. If using a tool such as"
to = "Führe einen Slow-Client-Test von einem separaten Host aus, um zu bestätigen, dass Header-/Body-Timeouts und Verbindungsgrenzen wirksam sind. Wenn ein Tool wie"
[[phrase]]
from = ", point it only at infrastructure you own."
to = "verwendet wird, richte es nur auf Infrastruktur, die dir gehört."
[[phrase]]
from = "Confirm upstream handoff uses one of the supported safe deployment patterns: private network, loopback/service network, TLS upstream verification, or mTLS where the backend supports it."
to = "Bestätige, dass die Upstream-Übergabe eines der unterstützten sicheren Deployment-Muster nutzt: privates Netzwerk, Loopback-/Service-Netzwerk, TLS-Upstream-Verifikation oder mTLS, wo das Backend es unterstützt."
[[phrase]]
from = "Confirm trusted-proxy settings are not enabled for public traffic unless the actual ingress proxy IP ranges are pinned and reviewed."
to = "Bestätige, dass Trusted-Proxy-Einstellungen für öffentlichen Traffic nicht aktiviert sind, sofern die tatsächlichen Ingress-Proxy-IP-Bereiche nicht gepinnt und geprüft sind."
[[phrase]]
from = "Fuzzing gate:"
to = "Fuzzing-Gate:"
[[phrase]]
from = "Before tagging a stable release, add or run fuzz targets for custom parser and policy code rather than Pingora internals. For"
to = "Füge vor dem Tagging eines stabilen Releases Fuzz-Targets für eigene Parser und Policy-Code hinzu oder führe sie aus, statt Pingora-Interna zu fuzzing. Für"
[[phrase]]
