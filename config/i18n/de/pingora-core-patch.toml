[[phrase]]
from = "The patch keeps Pingora's existing single-certificate path unchanged. It only allows Fluxheim to pass a rustls"
to = "Der Patch laesst Pingoras bestehenden Single-Certificate-Pfad unveraendert. Er erlaubt Fluxheim nur, eine rustls-"

[[phrase]]
from = "implementation so per-vhost certificates can be selected by SNI in the default build."
to = "Implementierung zu uebergeben, damit Zertifikate pro Vhost im Standard-Build per SNI ausgewaehlt werden koennen."

[[phrase]]
from = "As of Fluxheim"
to = "Seit Fluxheim"

[[phrase]]
from = ", the resolver implementation itself lives in"
to = "liegt die Resolver-Implementierung selbst in"

[[phrase]]
from = ": Fluxheim owns wildcard/exact SNI lookup, the reloadable certificate table, PEM certificate/private-key parsing, and TLS-ALPN challenge certificate loading. The vendored Pingora patch is now only the temporary listener acceptor hook that lets the compatibility runtime pass that resolver into rustls. This keeps Pingora's"
to = ": Fluxheim besitzt Wildcard-/Exact-SNI-Lookup, die reloadbare Zertifikatstabelle, PEM-Zertifikat-/Private-Key-Parsing und TLS-ALPN-Challenge-Zertifikatsladung. Der vendorte Pingora-Patch ist jetzt nur noch der temporaere Listener-Acceptor-Hook, der die Compatibility-Runtime diesen Resolver an rustls uebergeben laesst. Das isoliert Pingoras"

[[phrase]]
from = "panic behavior isolated until the native downstream listener replaces the compatibility acceptor."
to = "Panic-Verhalten, bis der native Downstream-Listener den Compatibility-Acceptor ersetzt."

[[phrase]]
from = "also owns the native rustls downstream"
to = "besitzt auch den nativen rustls-Downstream-"

[[phrase]]
from = "builder. That builder applies Fluxheim TLS policy and returns typed errors for protocol, cipher, group, client-auth, and FIPS reporting failures. Until the native listener is wired into production profiles, the compatibility runtime still mirrors the same policy into Pingora's"
to = "Builder. Dieser Builder wendet die Fluxheim-TLS-Policy an und gibt typisierte Fehler fuer Protokoll-, Cipher-, Group-, Client-Auth- und FIPS-Reporting-Fehler zurueck. Bis der native Listener in Produktionsprofile verdrahtet ist, spiegelt die Compatibility-Runtime dieselbe Policy weiterhin in Pingoras"

[[phrase]]
from = "For OpenSSL-only builds,"
to = "Fuer OpenSSL-only-Builds besitzt"

[[phrase]]
from = "owns the native downstream"
to = "den nativen Downstream-"

[[phrase]]
from = "builder for the fallback-certificate listener path. It applies certificate/key loading, ALPN, cipher, curve, minimum protocol, and client-auth CA policy with typed errors. It also owns OpenSSL SNI certificate storage, reload, pending managed-certificate handling, and certificate application. The remaining Pingora layer is a thin"
to = "Builder fuer den Fallback-Certificate-Listener-Pfad. Er wendet Certificate-/Key-Loading, ALPN, Cipher, Curve, Minimum-Protocol und Client-Auth-CA-Policy mit typisierten Fehlern an. Er besitzt auch OpenSSL-SNI-Zertifikatsspeicher, Reload, Pending-Managed-Certificate-Handling und Zertifikatsanwendung. Die verbleibende Pingora-Schicht ist ein duenner"

[[phrase]]
from = "adapter until production listener cutover."
to = "Adapter bis zum Produktions-Listener-Cutover."

[[phrase]]
from = "has a native rustls HTTP/1 listener preview that accepts a ready"
to = "hat eine native rustls-HTTP/1-Listener-Preview, die eine fertige"

[[phrase]]
from = ", bounds the TLS handshake, and then hands the stream to the same native HTTP/1 parser/handler path used by plain listeners. OpenSSL-only builds also have a matching native HTTP/1 listener preview that accepts an"
to = "akzeptiert, den TLS-Handshake begrenzt und den Stream dann an denselben nativen HTTP/1-Parser-/Handler-Pfad uebergibt, der von Plain-Listenern genutzt wird. OpenSSL-only-Builds haben auch eine passende native HTTP/1-Listener-Preview, die einen"

[[phrase]]
from = ", bounds the handshake, and uses the same native parser/handler. These are the intended replacement paths for the compatibility listener patch once the runtime cutover wires them into official profiles."
to = "akzeptiert, den Handshake begrenzt und denselben nativen Parser/Handler nutzt. Das sind die vorgesehenen Ersatzpfade fuer den Compatibility-Listener-Patch, sobald der Runtime-Cutover sie in offizielle Profile verdrahtet."

[[phrase]]
from = "Rustls Upstream Verification Policy"
to = "Rustls-Upstream-Verifikationspolicy"

[[phrase]]
from = "Fluxheim also patches the rustls upstream connector so per-peer"
to = "Fluxheim patcht auch den rustls-Upstream-Connector, damit Pro-Peer-"

[[phrase]]
from = "policies apply even when no other setting forced Pingora to clone the rustls client config. In Pingora 0.8, the dangerous verifier path was only installed when a cloned config already existed for ALPN or upstream mTLS. Fluxheim exposes explicit upstream TLS verification controls, so the connector must clone the config and install the custom verifier whenever verification is disabled or SNI is absent."
to = "Policies auch gelten, wenn keine andere Einstellung Pingora gezwungen hat, die rustls-Client-Config zu klonen. In Pingora 0.8 wurde der gefaehrliche Verifier-Pfad nur installiert, wenn bereits eine geklonte Config fuer ALPN oder Upstream-mTLS existierte. Fluxheim stellt explizite Upstream-TLS-Verifikationscontrols bereit, daher muss der Connector die Config klonen und den Custom-Verifier installieren, wenn Verifikation deaktiviert oder SNI nicht vorhanden ist."

[[phrase]]
from = "This is a temporary compatibility patch, not a long-term fork. Keep it small, easy to audit, and limited to the rustls certificate resolver and upstream verification-policy gaps."
to = "Dies ist ein temporaerer Compatibility-Patch, kein langfristiger Fork. Halte ihn klein, leicht auditierbar und auf die Luecken bei rustls-Zertifikatresolver und Upstream-Verifikationspolicy begrenzt."

[[phrase]]
from = "Listener PROXY Protocol Receive"
to = "Listener-PROXY-Protokoll-Empfang"

[[phrase]]
from = "Fluxheim also patches Pingora listeners with an opt-in PROXY protocol receive hook that runs after the TCP accept and before downstream TLS or HTTP parsing. The patch adds:"
to = "Fluxheim patcht Pingora-Listener auch mit einem opt-in PROXY-Protokoll-Receive-Hook, der nach dem TCP-Accept und vor Downstream-TLS- oder HTTP-Parsing laeuft. Der Patch fuegt hinzu:"

[[phrase]]
from = "bounded v1 line parsing with the HAProxy 108-byte limit and bounded v2 payload parsing;"
to = "begrenztes v1-Line-Parsing mit dem HAProxy-108-Byte-Limit und begrenztes v2-Payload-Parsing;"

[[phrase]]
from = "mandatory direct-peer trust checks before parsing;"
to = "verpflichtende Direct-Peer-Trust-Pruefungen vor dem Parsing;"

[[phrase]]
from = "socket-digest peer-address replacement only after a trusted, valid v1/v2 header."
to = "Socket-Digest-Peer-Address-Replacement nur nach einem vertrauenswuerdigen, gueltigen v1-/v2-Header."

[[phrase]]
from = "This is needed because Fluxheim must restore client identity before TLS and HTTP handling when it sits behind a trusted load balancer that speaks PROXY protocol. The v2 parser currently supports TCP4/TCP6 plus LOCAL/UNSPEC frames and skips bounded TLV payloads; TLV interpretation is intentionally not included."
to = "Das ist noetig, weil Fluxheim die Client-Identitaet vor TLS- und HTTP-Handling wiederherstellen muss, wenn es hinter einem vertrauenswuerdigen Load Balancer sitzt, der PROXY-Protokoll spricht. Der v2-Parser unterstuetzt aktuell TCP4/TCP6 plus LOCAL-/UNSPEC-Frames und ueberspringt begrenzte TLV-Payloads; TLV-Interpretation ist absichtlich nicht enthalten."

[[phrase]]
from = "Removal Criteria"
to = "Entfernungskriterien"

[[phrase]]
from = "when an upstream Pingora release exposes equivalent rustls server certificate resolver support and applies per-peer rustls upstream verification policy without requiring ALPN or mTLS to clone the client config first, and exposes an equivalent pre-TLS listener PROXY protocol receive hook with trusted peer enforcement."
to = "wenn ein Upstream-Pingora-Release aequivalenten rustls-Server-Certificate-Resolver-Support bereitstellt, Pro-Peer-rustls-Upstream-Verifikationspolicy anwendet, ohne zuerst ALPN oder mTLS zum Klonen der Client-Config zu benoetigen, und einen aequivalenten Pre-TLS-Listener-PROXY-Protokoll-Receive-Hook mit Trusted-Peer-Enforcement bereitstellt."

