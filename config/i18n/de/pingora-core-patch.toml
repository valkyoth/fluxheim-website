to = "<p><code>vendor/pingora-core</code> und den <code>[patch.crates-io]</code>-Eintrag in <code>Cargo.toml</code> entfernen, wenn ein Upstream-Pingora-Release gleichwertigen rustls-Server-Certificate-Resolver-Support bereitstellt, Per-Peer-rustls-Upstream-Verifikationspolicy anwendet, ohne zuerst ALPN oder mTLS zum Klonen der Client-Config zu verlangen, und einen gleichwertigen Pre-TLS-Listener-PROXY-Protokoll-Empfangshook mit Trusted-Peer-Erzwingung bereitstellt.</p>"

