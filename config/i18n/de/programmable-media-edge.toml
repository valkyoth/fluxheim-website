[[phrase]]
from = "Any native or FFI media library must be behind a separate feature flag with license, advisory, sandbox, and fuzzing review."
to = "Jede native oder FFI-Media-Bibliothek muss hinter einem separaten Feature-Flag mit Lizenz-, Advisory-, Sandbox- und Fuzzing-Review liegen."
[[phrase]]
from = "Disabled by default at compile time and runtime."
to = "Zur Compile-Zeit und zur Laufzeit standardmaessig deaktiviert."
[[phrase]]
from = "Per-vhost/per-route media policy required."
to = "Media-Policy pro Vhost/pro Route erforderlich."
[[phrase]]
from = "Reject oversized manifests and segments."
to = "Uebergrosse Manifeste und Segmente ablehnen."
[[phrase]]
from = "Reject nested or recursive manifests beyond small limits."
to = "Verschachtelte oder rekursive Manifeste ueber kleine Limits hinaus ablehnen."
[[phrase]]
from = "Reject unexpected protocols, absolute URL escapes, and host escapes unless allow-listed."
to = "Unerwartete Protokolle, absolute URL-Ausbrueche und Host-Ausbrueche ablehnen, sofern sie nicht allow-listed sind."
[[phrase]]
from = "Do not mirror or stitch admin, metrics, ACME, PHP, CGI, or legacy routes."
to = "Admin-, Metrics-, ACME-, PHP-, CGI- oder Legacy-Routen nicht spiegeln oder stitchen."
[[phrase]]
from = "Do not log raw manifests, tokens, cookies, media keys, entitlement claims, or full personalized URLs."
to = "Rohe Manifeste, Tokens, Cookies, Media-Keys, Entitlement-Claims oder vollstaendige personalisierte URLs nicht loggen."
[[phrase]]
from = "Treat DRM keys and license flows as out of scope unless a separate threat model is written."
to = "DRM-Keys und Lizenzfluesse als ausserhalb des Scope behandeln, sofern kein separates Threat-Model geschrieben wird."
