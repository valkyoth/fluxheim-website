to = "Moeglichkeit, IP-basierte Identifikatoren zu deaktivieren und Account-/Session-Identifikatoren nur zu nutzen, wenn eine rechtmaessige Policy es erlaubt."
[[phrase]]
from = "Stage 5: Transmuxing And Packaging"
to = "Phase 5: Transmuxing und Packaging"
[[phrase]]
from = "Edge transmuxing is a research track, not an early production feature."
to = "Edge-Transmuxing ist ein Forschungstrack, kein fruehes Produktionsfeature."
