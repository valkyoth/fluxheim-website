locale_id = "de-DE"
html_lang = "de-DE"
[[phrase]]
from = "Programmable Media Edge — Fluxheim Source Docs"
to = "Programmierbarer Media-Edge - Fluxheim-Source-Dokumentation"
[[phrase]]
from = "Programmable Media Edge"
to = "Programmierbarer Media-Edge"
[[phrase]]
from = "Status: far-future optional module family."
to = "Status: optionale Modulfamilie fuer eine ferne Zukunft."
[[phrase]]
from = "Planned Cargo features:"
to = "Geplante Cargo-Features:"
[[phrase]]
from = "This track is for media-aware video delivery. It is intentionally separate from the image filter because video processing has a much larger blast radius: manifests, segments, timed metadata, encryption, ad policy, privacy, DRM boundaries, and bandwidth cost all interact."
to = "Dieser Track ist fuer medienbewusste Videoauslieferung gedacht. Er ist absichtlich vom Bildfilter getrennt, weil Videoverarbeitung einen viel groesseren Blast-Radius hat: Manifeste, Segmente, zeitgesteuerte Metadaten, Verschluesselung, Anzeigen-Policy, Datenschutz, DRM-Grenzen und Bandbreitenkosten greifen ineinander."
[[phrase]]
from = "Keep all video-aware code out of default builds."
to = "Samtlichen videobewussten Code aus Standard-Builds heraushalten."
[[phrase]]
from = "Start with HLS/DASH manifest parsing and rewriting, not bitstream manipulation."
to = "Mit HLS-/DASH-Manifest-Parsing und -Rewriting starten, nicht mit Bitstream-Manipulation."
[[phrase]]
from = "Preserve normal static/proxy behavior when no media policy is configured."
to = "Normales Static-/Proxy-Verhalten beibehalten, wenn keine Media-Policy konfiguriert ist."
[[phrase]]
from = "Treat media requests as structured state, not plain text or arbitrary binary blobs."
to = "Media-Requests als strukturierten Zustand behandeln, nicht als Klartext oder beliebige Binaerblobs."
[[phrase]]
from = "Bound manifest size, segment size, parser complexity, outbound subrequests, cache footprint, and per-vhost media concurrency."
to = "Manifestgroesse, Segmentgroesse, Parser-Komplexitaet, ausgehende Subrequests, Cache-Footprint und Media-Nebenlaeufigkeit pro Vhost begrenzen."
[[phrase]]
from = "identity-aware routing, cache, metrics, and privacy profiles only through explicit policy."
to = "identity-aware Routing, Cache, Metriken und Privacy-Profilen nur ueber explizite Policy."
[[phrase]]
from = "Stage 1: Manifest Engine"
to = "Phase 1: Manifest-Engine"
[[phrase]]
from = "The first realistic milestone is a manifest-aware engine."
to = "Der erste realistische Meilenstein ist eine manifestbewusste Engine."
[[phrase]]
from = "Planned behavior:"
to = "Geplantes Verhalten:"
[[phrase]]
from = "parse HLS playlists ("
to = "HLS-Playlists parsen ("
[[phrase]]
from = "parse DASH manifests ("
to = "DASH-Manifeste parsen ("
[[phrase]]
from = ") after XML parser review;"
to = ") nach XML-Parser-Review;"
[[phrase]]
from = "normalize and validate segment URLs;"
to = "Segment-URLs normalisieren und validieren;"
[[phrase]]
from = "reject traversal, absolute URL escapes, unexpected schemes, and manifest recursion loops;"
to = "Traversal, absolute URL-Ausbrueche, unerwartete Schemas und Manifest-Rekursionsschleifen ablehnen;"
[[phrase]]
from = "rewrite segment URLs for signed routes, cache routes, or media policy routes;"
to = "Segment-URLs fuer signierte Routen, Cache-Routen oder Media-Policy-Routen umschreiben;"
[[phrase]]
from = "inject or remove safe timed metadata only when explicitly configured;"
to = "sichere zeitgesteuerte Metadaten nur bei expliziter Konfiguration einfuegen oder entfernen;"
[[phrase]]
from = "expose manifest metrics such as variant count, segment count, target duration, and parse errors."
to = "Manifest-Metriken wie Variantenanzahl, Segmentanzahl, Ziel-Dauer und Parse-Fehler bereitstellen."
[[phrase]]
from = "This is the best first step because it avoids decoding video while still unlocking media-specific routing and cache behavior."
to = "Das ist der beste erste Schritt, weil er Video-Decoding vermeidet und trotzdem medienspezifisches Routing- und Cache-Verhalten ermoeglicht."
[[phrase]]
from = "Stage 2: Segment-Aware Cache And Routing"
to = "Phase 2: Segmentbewusster Cache und Routing"
[[phrase]]
from = "Video segments should not be treated exactly like arbitrary files."
to = "Videosegmente sollten nicht genau wie beliebige Dateien behandelt werden."
[[phrase]]
from = "identify HLS TS, fMP4, and DASH segment requests;"
to = "HLS-TS-, fMP4- und DASH-Segment-Requests erkennen;"
[[phrase]]
from = "isolate cache keys by vhost, route, asset ID, representation, byte range, media sequence, encryption key ID, and policy version;"
to = "Cache-Keys nach Vhost, Route, Asset-ID, Representation, Byte-Range, Media-Sequence, Verschluesselungs-Key-ID und Policy-Version isolieren;"
[[phrase]]
from = "support bounded range requests for segments;"
to = "begrenzte Range-Requests fuer Segmente unterstuetzen;"
[[phrase]]
from = ", segment immutability policy, and live-window TTLs;"
to = ", Segment-Immutability-Policy und Live-Window-TTLs;"
[[phrase]]
from = "support stale segment serving only when explicitly safe;"
to = "Stale-Segment-Serving nur unterstuetzen, wenn es explizit sicher ist;"
[[phrase]]
from = "expose per-vhost media cache metrics when"
to = "Media-Cache-Metriken pro Vhost bereitstellen, wenn"
[[phrase]]
from = "Security baseline:"
to = "Sicherheitsbaseline:"
[[phrase]]
from = "never cache personalized encrypted segments unless the policy explicitly marks the variant safe;"
to = "personalisierte verschluesselte Segmente nie cachen, ausser die Policy markiert die Variante explizit als sicher;"
[[phrase]]
from = "never mix users, tenants, regions, or entitlement policies in one segment cache key;"
to = "Benutzer, Tenants, Regionen oder Entitlement-Policies nie in einem Segment-Cache-Key mischen;"
[[phrase]]
from = "never cache media keys or authorization tokens."
to = "Media-Keys oder Authorization-Tokens nie cachen."
[[phrase]]
from = "Stage 3: Dynamic Manifest Stitching"
to = "Phase 3: Dynamisches Manifest-Stitching"
[[phrase]]
from = "Dynamic stitching should operate at the manifest level before any bitstream work is attempted."
to = "Dynamisches Stitching sollte auf Manifest-Ebene arbeiten, bevor Bitstream-Arbeit versucht wird."
[[phrase]]
from = "replace configured ad markers with media segment URLs selected by a trusted decision service;"
to = "konfigurierte Anzeigenmarker durch Media-Segment-URLs ersetzen, die ein vertrauenswuerdiger Decision-Service auswaehlt;"
[[phrase]]
from = "support per-vhost ad policy;"
to = "Anzeigen-Policy pro Vhost unterstuetzen;"
[[phrase]]
from = "claims for audience segments;"
to = "Claims fuer Zielgruppensegmente;"
[[phrase]]
from = "keep ad decision timeouts isolated from the primary request;"
to = "Timeouts fuer Anzeigenentscheidungen vom primaeren Request isolieren;"
[[phrase]]
from = "fail closed or fall back according to explicit policy;"
to = "gemaess expliziter Policy fail-closed arbeiten oder zurueckfallen;"
[[phrase]]
from = "log only decision IDs and policy IDs, not raw user profiles."
to = "nur Decision-IDs und Policy-IDs loggen, keine rohen Benutzerprofile."
[[phrase]]
from = "WASM policy plugins may be evaluated later, but only inside a strict sandbox with CPU, memory, wall-time, outbound-network, and host-call limits."
to = "WASM-Policy-Plugins koennen spaeter evaluiert werden, aber nur in einer strikten Sandbox mit CPU-, Speicher-, Wall-Time-, Outbound-Network- und Host-Call-Limits."
[[phrase]]
from = "Stage 4: Forensic Watermarking"
to = "Phase 4: Forensisches Watermarking"
[[phrase]]
from = "Forensic watermarking is high value but high risk. It should remain research until the media parser, cache model, and privacy model are mature."
to = "Forensisches Watermarking hat hohen Wert, aber hohes Risiko. Es sollte Forschung bleiben, bis Media-Parser, Cache-Modell und Privacy-Modell ausgereift sind."
