to = "fMP4-zu-HLS-Packaging;"
[[phrase]]
from = "HLS/DASH manifest generation from one normalized source;"
to = "HLS-/DASH-Manifestgenerierung aus einer normalisierten Quelle;"
[[phrase]]
from = "CMAF-aware segment handling;"
to = "CMAF-bewusste Segmentbehandlung;"
[[phrase]]
from = "limited container remuxing without re-encoding."
to = "begrenztes Container-Remuxing ohne Re-Encoding."
[[phrase]]
