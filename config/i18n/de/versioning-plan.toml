[[phrase]]
from = "Versioning Plan — Fluxheim Source Docs"
to = "Versionierungsplan - Fluxheim-Source-Dokumentation"
[[phrase]]
from = "Versioning Plan"
to = "Versionierungsplan"
[[phrase]]
from = "Fluxheim should use SemVer, but with a conservative interpretation: a feature is not considered stable just because it compiles. A feature becomes stable only after it has docs, config validation, tests, release checks, and a clear security boundary."
to = "Fluxheim sollte SemVer nutzen, aber mit konservativer Auslegung: Ein Feature gilt nicht als stabil, nur weil es kompiliert. Ein Feature wird erst stabil, nachdem es Dokumentation, Konfigurationsvalidierung, Tests, Release-Checks und eine klare Sicherheitsgrenze hat."
[[phrase]]
from = "The main lesson from the roadmap is to avoid shipping one giant 1.0. The"
to = "Die wichtigste Lehre aus der Roadmap ist, kein riesiges 1.0 auf einmal auszuliefern. Die"
[[phrase]]
from = "line is the basic-sites preview: static HTML, vhosts, static TLS, containers, and simple whole-vhost proxying. Version"
to = "Linie ist die Basic-Sites-Preview: statisches HTML, Vhosts, statisches TLS, Container und einfaches Whole-vhost-Proxying. Version"
[[phrase]]
from = "should be the first stable gateway release that can migrate Fluxheim's own representative multi-site configs without losing core behavior. Larger modules then graduate in later minor releases."
to = "soll das erste stabile Gateway-Release sein, das Fluxheims eigene repraesentative Multi-Site-Konfigurationen ohne Verlust von Kernverhalten migrieren kann. Groessere Module graduieren danach in spaeteren Minor-Releases."
[[phrase]]
from = "Versioning Rules"
to = "Versionierungsregeln"
[[phrase]]
from = ": incubator releases. Config shape and behavior may still change."
to = ": Inkubator-Releases. Konfigurationsform und Verhalten koennen sich noch aendern."
[[phrase]]
from = ": stable core bugfixes only."
to = ": nur stabile Core-Bugfixes."
[[phrase]]
from = ": add stable, production-supported modules without breaking existing 1.x configs."
