[[phrase]]
from = ": allowed only for breaking config/API behavior or major threat-model changes that cannot be feature-gated safely."
to = ": nur erlaubt fuer brechendes Config-/API-Verhalten oder grosse Threat-Model-Aenderungen, die nicht sicher per Feature-Gate abgegrenzt werden koennen."
[[phrase]]
from = "Security fixes should be backported to the latest stable minor when practical."
to = "Security-Fixes sollten, wenn praktikabel, auf das neueste stabile Minor-Release zurueckportiert werden."
[[phrase]]
from = "Every public release must pass the matching release security and stability gate in"
to = "Jedes oeffentliche Release muss das passende Release-Security- und Stabilitaets-Gate bestehen in"
[[phrase]]
from = "Preview releases may document known gaps, but must still pass dependency, license, static/proxy smoke, and container checks for the behavior they claim."
to = "Preview-Releases duerfen bekannte Luecken dokumentieren, muessen aber fuer das behauptete Verhalten trotzdem Dependency-, Lizenz-, Static-/Proxy-Smoke- und Container-Checks bestehen."
