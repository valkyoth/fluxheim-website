[[phrase]]
from = "<p>Do not write <code>[vhosts.proxy]</code> before the first <code>[[vhosts]]</code>. There is no current vhost yet.</p>"
to = "<p><code>[vhosts.proxy]</code> nicht vor dem ersten <code>[[vhosts]]</code> schreiben. Es gibt noch keinen aktuellen Vhost.</p>"

