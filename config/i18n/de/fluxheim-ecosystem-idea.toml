[[phrase]]
from = "This note records a long-term ecosystem direction. It is not part of the current release commitment and should not blur Fluxheim's core scope as an edge proxy, cache, and load balancer."
to = "Diese Notiz haelt eine langfristige Ecosystem-Richtung fest. Sie ist kein Teil der aktuellen Release-Zusage und soll Fluxheims Kernumfang als Edge-Proxy, Cache und Load Balancer nicht verwischen."

[[phrase]]
from = "The useful direction is a set of separate crates and projects that can integrate with Fluxheim while keeping each product boundary reviewable."
to = "Die sinnvolle Richtung ist eine Gruppe separater Crates und Projekte, die sich mit Fluxheim integrieren koennen, waehrend jede Produktgrenze reviewbar bleibt."

[[phrase]]
from = "Proposed Shape"
to = "Vorgeschlagene Form"

[[phrase]]
from = "should stay focused. The other projects should be real packages with their own README, tests, examples, security model, and release gates. They may start in a"
to = "soll fokussiert bleiben. Die anderen Projekte sollen echte Pakete mit eigener README, Tests, Beispielen, Security-Modell und Release-Gates sein. Sie koennen in einem"

[[phrase]]
from = "workspace directory for shared CI, but each boundary should be clean enough that it can move to its own repository later."
to = "Workspace-Verzeichnis fuer gemeinsame CI starten, aber jede Grenze soll sauber genug sein, um spaeter in ein eigenes Repository verschoben werden zu koennen."

[[phrase]]
from = "is the near-term ecosystem crate. It should help Rust applications cooperate with Fluxheim without turning the app into a hidden control plane."
to = "ist die kurzfristige Ecosystem-Crate. Sie soll Rust-Anwendungen helfen, mit Fluxheim zusammenzuarbeiten, ohne die App in eine versteckte Control Plane zu verwandeln."

