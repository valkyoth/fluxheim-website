[[phrase]]
from = "cannot replace upstream scrubbing for attacks that saturate the network link before packets reach the host. A realistic system complements provider-level DDoS protection, it does not remove the need for it in high-volume scenarios."
to = "kann Upstream-Scrubbing fuer Angriffe nicht ersetzen, die den Netzwerklink saettigen, bevor Pakete den Host erreichen. Ein realistisches System ergaenzt DDoS-Schutz auf Provider-Ebene, es beseitigt den Bedarf daran in Hochvolumen-Szenarien nicht."

