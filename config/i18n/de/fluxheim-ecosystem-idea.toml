[[phrase]]
from = "is the long-term edge-defense platform idea. It should not be described as an Arbor clone in product text, but the architectural category is similar: detect DDoS/anomalous traffic and orchestrate mitigations across host, router, and upstream boundaries."
to = "ist die langfristige Idee fuer eine Edge-Defense-Plattform. Sie soll im Produkttext nicht als Arbor-Klon beschrieben werden, aber die Architekturkategorie ist aehnlich: DDoS/anomalen Traffic erkennen und Gegenmassnahmen ueber Host-, Router- und Upstream-Grenzen hinweg orchestrieren."

