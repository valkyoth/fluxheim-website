[[phrase]]
from = "targets Level 1 macOS support: contributors should be able to build and run local development profiles on Apple Silicon Macs. This is not a production macOS support claim."
to = "zielt auf Level-1-macOS-Support: Contributors sollen lokale Entwicklungsprofile auf Apple-Silicon-Macs bauen und ausfuehren koennen. Das ist kein Anspruch auf Produktionssupport fuer macOS."

[[phrase]]
from = "Linux remains the production baseline for native packages, systemd units, containers, FIPS/ISO evidence, and release-gate parity. macOS support is for local development, site testing, and contributor workflows while Pingora macOS support remains experimental."
to = "Linux bleibt die Produktions-Baseline fuer native Packages, systemd-Units, Container, FIPS-/ISO-Nachweise und Release-Gate-Paritaet. macOS-Support ist fuer lokale Entwicklung, Site-Tests und Contributor-Workflows gedacht, waehrend Pingora-macOS-Support experimentell bleibt."

