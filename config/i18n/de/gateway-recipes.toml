to = "Die konfigurierte Fehlerseite ist intern fuer den Proxy-Fallback. Sie wird nicht als oeffentliche Route offengelegt, sofern nicht eine andere"
[[phrase]]
from = "route serves that same path."
to = "Route denselben Pfad bedient."
[[phrase]]
from = "Current 1.0 Boundaries"
to = "Aktuelle 1.0-Grenzen"
[[phrase]]
from = "DNS refresh is available for load-balancer builds through"
to = "DNS-Refresh ist fuer Load-Balancer-Builds ueber"
[[phrase]]
from = "and local sidecar/orchestrator discovery can use"
to = "verfuegbar, und lokale Sidecar-/Orchestrator-Discovery kann"
[[phrase]]
from = "backend per line. Rich dynamic backend metadata such as weights, aliases, backups, and drains still requires static"
to = "Backend pro Zeile verwenden. Umfangreiche dynamische Backend-Metadaten wie Gewichte, Aliase, Backups und Drains erfordern in diesem Release weiterhin statische"
[[phrase]]
from = "in this release."
to = "in diesem Release."
[[phrase]]
from = "Per-route proxy, static, redirect, upload limit, timeout, header policy, prefix stripping, and internal error-page fallback are the supported gateway building blocks."
to = "Proxy, Static, Redirect, Upload-Limit, Timeout, Header-Policy, Prefix-Stripping und interner Error-Page-Fallback pro Route sind die unterstuetzten Gateway-Bausteine."
[[phrase]]
from = "Advanced auth, rewrite engines, compression, WAF, image/video filters, and WASM policy hooks are planned as optional post-"
