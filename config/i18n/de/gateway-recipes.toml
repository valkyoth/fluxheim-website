[[phrase]]
from = "Gateway Recipes"
to = "Gateway-Rezepte"
[[phrase]]
from = "This page shows practical"
to = "Diese Seite zeigt praktische"
[[phrase]]
from = "gateway-style patterns for moving common static and proxy vhosts into Fluxheim. The examples use one split config file per site; keep shared listeners, TLS defaults, logging, and global header policy in"
to = "Gateway-artige Muster, um gaengige statische und Proxy-vhosts nach Fluxheim zu migrieren. Die Beispiele verwenden eine Split-Config-Datei pro Site; halten Sie gemeinsame Listener, TLS-Defaults, Logging und globale Header-Policy in"
[[phrase]]
from = "Shared Server Baseline"
to = "Gemeinsame Server-Baseline"
[[phrase]]
from = "only for proxies you actually control. When it is empty, Fluxheim uses the direct peer address for generated client-IP headers. When the direct peer is trusted, Fluxheim treats"
to = "nur fuer Proxies, die Sie tatsaechlich kontrollieren. Wenn es leer ist, nutzt Fluxheim die direkte Peer-Adresse fuer erzeugte Client-IP-Header. Wenn der direkte Peer vertrauenswuerdig ist, behandelt Fluxheim"
[[phrase]]
from = "like nginx"
to = "wie nginx"
[[phrase]]
from = ": trusted hops are skipped from the right and generated"
to = ": vertrauenswuerdige Hops werden von rechts uebersprungen und erzeugte"
[[phrase]]
from = "values use the restored client address."
to = "Werte verwenden die wiederhergestellte Client-Adresse."
[[phrase]]
from = "Cleartext Challenge Exception And HTTPS Redirect"
to = "Cleartext-Challenge-Ausnahme und HTTPS-Redirect"
[[phrase]]
from = "If a cleartext challenge helper must stay reachable while everything else moves to HTTPS, enable the global redirect and the vhost challenge helper:"
to = "Wenn ein Cleartext-Challenge-Helper erreichbar bleiben muss, waehrend alles andere auf HTTPS wechselt, aktivieren Sie den globalen Redirect und den vhost-Challenge-Helper:"
[[phrase]]
from = "This internally creates the standard HTTP-01 challenge route at"
to = "Dies erstellt intern die Standard-HTTP-01-Challenge-Route unter"
[[phrase]]
from = "and exempts only that path from the global redirect. Normal proxy and static routes still redirect on cleartext requests."
to = "und nimmt nur diesen Pfad vom globalen Redirect aus. Normale Proxy- und statische Routes redirecten bei Cleartext-Requests weiterhin."
[[phrase]]
from = "Canonical Host Redirect"
to = "Kanonischer Host-Redirect"
[[phrase]]
from = "Create a small vhost for the secondary host and redirect it to the canonical name:"
to = "Erstellen Sie einen kleinen vhost fuer den sekundaeren Host und leiten Sie ihn auf den kanonischen Namen um:"
[[phrase]]
from = "App Proxy With Upload Limit"
to = "App-Proxy mit Upload-Limit"
[[phrase]]
from = "on the vhost when the whole site shares one upload budget. Set it on a route only when a specific path needs a different limit."
to = "auf dem vhost, wenn die gesamte Site ein Upload-Budget teilt. Setzen Sie es nur dann auf einer Route, wenn ein bestimmter Pfad ein anderes Limit braucht."
[[phrase]]
from = "For common upstream identity headers, prefer the typed request-header fields in the shared baseline:"
to = "Fuer gaengige Upstream-Identity-Header bevorzugen Sie die typisierten Request-Header-Felder in der gemeinsamen Baseline:"
[[phrase]]
from = "Use dynamic header templates only when a backend needs an exact value that is not covered by a typed field. The supported variables are intentionally small:"
to = "Verwenden Sie dynamische Header-Templates nur, wenn ein Backend einen exakten Wert benoetigt, der nicht durch ein typisiertes Feld abgedeckt ist. Die unterstuetzten Variablen sind absichtlich klein:"
[[phrase]]
from = "TLS client-certificate variables,"
to = "TLS-Client-Zertifikatsvariablen,"
[[phrase]]
from = "and bounded regex route captures such as"
to = "und begrenzte Regex-Route-Captures wie"
[[phrase]]
from = "when the matched route uses"
to = "wenn die passende Route"
[[phrase]]
from = "Unknown variables fail config validation, and rendered values still pass HTTP header validation before they are sent upstream."
to = "Unbekannte Variablen lassen die Config-Validierung fehlschlagen, und gerenderte Werte durchlaufen weiterhin HTTP-Header-Validierung, bevor sie upstream gesendet werden."
[[phrase]]
from = "Browser Login Probe For WordPress"
to = "Browser-Login-Probe fuer WordPress"
[[phrase]]
from = "Some proxy bugs only show up in a real browser. One important example is HTTP/2 clients sending multiple"
to = "Manche Proxy-Bugs zeigen sich nur in einem echten Browser. Ein wichtiges Beispiel sind HTTP/2-Clients, die mehrere"
[[phrase]]
from = "header fields; an HTTP/2-to-HTTP/1.x gateway must forward those to classic backends as one semicolon-delimited"
to = "Header-Felder senden; ein HTTP/2-zu-HTTP/1.x-Gateway muss diese an klassische Backends als einen semikolongetrennten"
[[phrase]]
from = "header, not as a comma-delimited list."
to = "Header weiterleiten, nicht als kommagetrennte Liste."
[[phrase]]
from = "Use the browser probe when a WordPress login works with"
to = "Verwenden Sie die Browser-Probe, wenn ein WordPress-Login mit"
[[phrase]]
from = "but loops in Chrome or another browser:"
to = "funktioniert, aber in Chrome oder einem anderen Browser in einer Schleife haengt:"
[[phrase]]
from = "The script launches local Chrome or Chromium through the DevTools protocol, submits the login form, checks for the admin dashboard, and writes artifacts to"
to = "Das Skript startet lokales Chrome oder Chromium ueber das DevTools-Protokoll, sendet das Login-Formular ab, prueft auf das Admin-Dashboard und schreibt Artefakte nach"
[[phrase]]
from = "Password values are redacted from request logs, but the captured HTML and cookie names are still operational debugging artifacts; keep them local and delete them after analysis."
to = "Passwortwerte werden aus Request-Logs redigiert, aber das erfasste HTML und Cookie-Namen sind weiterhin betriebliche Debugging-Artefakte; halten Sie sie lokal und loeschen Sie sie nach der Analyse."
[[phrase]]
from = "or another supported browser name when more than one standard Chrome/Chromium binary is installed. The accepted names are"
to = "oder einen anderen unterstuetzten Browsernamen, wenn mehr als ein Standard-Chrome/Chromium-Binary installiert ist. Akzeptierte Namen sind"
[[phrase]]
from = "arbitrary executable paths are intentionally rejected. The probe is intentionally not part of the normal release gate because it targets live sites and needs credentials."
to = "beliebige ausfuehrbare Pfade werden absichtlich abgelehnt. Die Probe ist absichtlich nicht Teil des normalen Release-Gates, weil sie Live-Sites adressiert und Zugangsdaten benoetigt."
[[phrase]]
from = "Websocket Or Long-Lived Route"
to = "Websocket oder langlebige Route"
[[phrase]]
from = "Fluxheim preserves"
to = "Fluxheim erhaelt"
[[phrase]]
from = "request headers by default. Use a prefix route with longer upstream timeouts and optional prefix stripping:"
to = "Request-Header standardmaessig. Verwenden Sie eine Prefix-Route mit laengeren Upstream-Timeouts und optionalem Prefix-Stripping:"
[[phrase]]
from = "If the backend requires explicit legacy-style upgrade forwarding on that route, set it route-locally:"
to = "Wenn das Backend auf dieser Route explizites Upgrade-Forwarding im Legacy-Stil benoetigt, setzen Sie es route-lokal:"
[[phrase]]
from = "Static Alias With Directory Listing"
to = "Statischer Alias mit Verzeichnislisting"
[[phrase]]
from = "Use a route-local static action when only one path should expose a different filesystem root:"
to = "Verwenden Sie eine route-lokale statische Aktion, wenn nur ein Pfad einen anderen Dateisystem-Root freilegen soll:"
[[phrase]]
from = "Directory listings are off by default. When enabled, index files still win, dotfiles remain hidden when"
to = "Verzeichnislistings sind standardmaessig aus. Wenn aktiviert, gewinnen Indexdateien weiterhin, Dotfiles bleiben verborgen, wenn"
[[phrase]]
from = "and symlink entries are skipped. Set"
to = "und Symlink-Eintraege werden uebersprungen. Setzen Sie"
[[phrase]]
from = "when you want listing modification times shown with the server's local UTC offset instead of GMT HTTP-date timestamps."
to = "wenn Sie Aenderungszeiten im Listing mit dem lokalen UTC-Offset des Servers statt als GMT-HTTP-Date-Timestamps anzeigen moechten."
[[phrase]]
from = "Custom Upstream Error Page"
to = "Eigene Upstream-Fehlerseite"
[[phrase]]
from = "Attach static fallback pages to a proxy policy:"
to = "Haengen Sie statische Fallback-Seiten an eine Proxy-Policy:"
[[phrase]]
