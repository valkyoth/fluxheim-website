to = "Komprimierung"

[[phrase]]
from = "Cargo features:"
to = "Cargo-Features:"

[[phrase]]
from = "Compression remains opt-in. Default builds do not include compression code, and <code>privacy-mode</code> builds reject compression at compile time because response-body transforms can create side-channel and retention risks."
to = "Komprimierung bleibt opt-in. Standard-Builds enthalten keinen Komprimierungscode, und <code>privacy-mode</code>-Builds lehnen Komprimierung zur Compile-Zeit ab, weil Response-Body-Transformationen Seitenkanal- und Retention-Risiken erzeugen koennen."

