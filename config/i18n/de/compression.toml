[[phrase]]
from = "<p>Fluxheim negotiates response compression from <code>Accept-Encoding</code> when <code>compression.enabled = true</code> and the binary is built with at least one codec feature. Gzip is available through <code>compression-gzip</code>, Zstandard through <code>compression-zstd</code>, and Brotli through <code>compression-brotli</code>. <code>q=0</code> is respected for each coding. When multiple accepted codings are enabled, Fluxheim prefers <code>br</code>, then <code>zstd</code>, then <code>gzip</code>.</p>"
to = "<p>Fluxheim handelt Response-Komprimierung aus <code>Accept-Encoding</code> aus, wenn <code>compression.enabled = true</code> gesetzt ist und das Binary mit mindestens einem Codec-Feature gebaut wurde. Gzip ist ueber <code>compression-gzip</code> verfuegbar, Zstandard ueber <code>compression-zstd</code> und Brotli ueber <code>compression-brotli</code>. <code>q=0</code> wird fuer jede Codierung respektiert. Wenn mehrere akzeptierte Codierungen aktiviert sind, bevorzugt Fluxheim <code>br</code>, dann <code>zstd</code>, dann <code>gzip</code>.</p>"

[[phrase]]
from = "<li>Negotiates <code>br</code>, <code>zstd</code>, <code>gzip</code>, and identity correctly for compiled codecs.</li>"
to = "<li>Handelt <code>br</code>, <code>zstd</code>, <code>gzip</code> und Identity fuer einkompilierte Codecs korrekt aus.</li>"
