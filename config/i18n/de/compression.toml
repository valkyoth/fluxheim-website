[[phrase]]
from = "Keep gzip as a conservative compatibility baseline."
to = "gzip als konservative Kompatibilitätsbasis beibehalten."

[[phrase]]
from = "Keep Zstandard and Brotli behind explicit Cargo features because they add extra codec dependencies and operational behavior."
to = "Zstandard und Brotli hinter expliziten Cargo-Features halten, weil sie zusätzliche Codec-Abhängigkeiten und Betriebsverhalten hinzufügen."

[[phrase]]
from = "Avoid compressing already-compressed or low-value content."
to = "Bereits komprimierte oder wenig wertvolle Inhalte nicht komprimieren."

[[phrase]]
from = "Keep request workers responsive by moving expensive compression work out of the main request path."
to = "Request-Worker reaktionsfähig halten, indem teure Komprimierungsarbeit aus dem Haupt-Request-Pfad verlagert wird."

