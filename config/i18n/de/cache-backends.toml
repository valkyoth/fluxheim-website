[[phrase]]
from = "The disk tier currently stores one object per filesystem-managed cache file. This keeps the implementation portable, inspectable, and easy to recover. A future advanced backend may add slab/bin storage with pre-allocated data files to reduce filesystem overhead and fragmentation on very large, high-churn caches."
to = "Der Disk-Tier speichert derzeit ein Objekt pro vom Dateisystem verwalteter Cache-Datei. Das haelt die Implementierung portabel, inspizierbar und leicht wiederherstellbar. Ein kuenftiges erweitertes Backend kann Slab-/Bin-Storage mit vorallozierten Datendateien ergaenzen, um Dateisystem-Overhead und Fragmentierung bei sehr grossen Caches mit hoher Aenderungsrate zu reduzieren."

