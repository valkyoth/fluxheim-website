[[phrase]]
from = "Pingora cache locks collapse concurrent misses for the same cache key to prevent cache stampedes when many clients request the same uncached or expired object at once. One request receives the writer permit and fetches from the origin; matching readers wait for that writer up to the configured timeout instead of all hitting the origin together."
to = "Pingora-Cache-Locks fassen gleichzeitige Misses fuer denselben Cache-Key zusammen, um Cache-Stampedes zu verhindern, wenn viele Clients gleichzeitig dasselbe ungecachte oder abgelaufene Objekt anfordern. Ein Request erhaelt die Writer-Erlaubnis und holt vom Origin; passende Reader warten bis zum konfigurierten Timeout auf diesen Writer, statt gemeinsam den Origin zu treffen."

[[phrase]]
from = "configure whether request collapsing is enabled and how long writer age and reader wait timeouts last. Defaults preserve the original 30 second writer age timeout and 30 second waiter timeout."
to = "konfigurieren, ob Request-Collapsing aktiv ist und wie lange Writer-Age- und Reader-Warte-Timeouts dauern. Die Defaults erhalten den urspruenglichen Writer-Age-Timeout von 30 Sekunden und den Waiter-Timeout von 30 Sekunden."

[[phrase]]
from = "The predictor keeps a bounded LRU of primary keys that recently produced origin-level uncacheable outcomes, allowing Fluxheim to bypass cache lookup and cache locking early for those keys."
to = "Der Predictor haelt eine begrenzte LRU-Liste primaerer Keys, die kuerzlich originseitig nicht cachebare Ergebnisse erzeugt haben, sodass Fluxheim Cache-Lookup und Cache-Locking fuer diese Keys frueh umgehen kann."

