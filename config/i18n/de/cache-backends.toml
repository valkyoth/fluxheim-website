[[phrase]]
from = "Fluxheim's cache configuration is intentionally byte-budgeted even when a backend crate is count-based. Operators should be able to say \"use 1 GiB of RAM\" or \"use this 10 GiB disk directory\" globally or per vhost without knowing the internal cache implementation."
to = "Fluxheims Cache-Konfiguration ist absichtlich nach Byte-Budgets ausgelegt, selbst wenn eine Backend-Crate nach Anzahl arbeitet. Betreiber sollen global oder pro Vhost \"1 GiB RAM verwenden\" oder \"dieses 10-GiB-Disk-Verzeichnis verwenden\" festlegen koennen, ohne die interne Cache-Implementierung zu kennen."

