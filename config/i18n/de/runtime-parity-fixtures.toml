locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Runtime Parity Fixtures"
to = "Runtime-Paritaets-Fixtures"

[[phrase]]
from = "Pingora-exit baseline"
to = "Pingora-Exit-Baseline"

[[phrase]]
from = "line replaces the current Pingora runtime in stages. Before any cutover, Fluxheim keeps an explicit inventory of fixtures and smoke scripts that define current behavior. This is not the whole test suite; it is the minimum release-gated parity surface that must stay visible while old and new runtime paths coexist."
to = "Linie ersetzt die aktuelle Pingora-Runtime schrittweise. Vor jedem Cutover fuehrt Fluxheim ein explizites Inventar von Fixtures und Smoke-Skripten, die das aktuelle Verhalten definieren. Das ist nicht die gesamte Testsuite, sondern die minimale release-gated Paritaetsflaeche, die sichtbar bleiben muss, waehrend alte und neue Runtime-Pfade nebeneinander existieren."

[[phrase]]
from = "The machine-readable inventory is:"
to = "Das maschinenlesbare Inventar ist:"

[[phrase]]
from = "The inventory is validated by:"
to = "Das Inventar wird validiert durch:"

[[phrase]]
from = "The gate checks that every listed script, config, directory, fixture, or document still exists. Script entries must remain executable. Later"
to = "Das Gate prueft, dass jedes aufgefuehrte Skript, jede Konfiguration, jedes Verzeichnis, jedes Fixture oder jedes Dokument noch existiert. Skript-Eintraege muessen ausfuehrbar bleiben. Spaetere"

[[phrase]]
from = "cutover releases should add more entries before replacing a subsystem, not after discovering a parity gap."
to = "Cutover-Releases sollten weitere Eintraege hinzufuegen, bevor ein Subsystem ersetzt wird, nicht erst nach dem Entdecken einer Paritaetsluecke."

[[phrase]]
from = "How To Use"
to = "Verwendung"

[[phrase]]
from = "Add a fixture before changing a runtime boundary."
to = "Fuege ein Fixture hinzu, bevor eine Runtime-Grenze geaendert wird."

[[phrase]]
from = "Keep fixtures focused on observable behavior, not implementation details."
to = "Halte Fixtures auf beobachtbares Verhalten fokussiert, nicht auf Implementierungsdetails."

[[phrase]]
from = "Prefer local deterministic scripts over external services unless the feature specifically needs a containerized dependency."
to = "Bevorzuge lokale deterministische Skripte gegenueber externen Diensten, sofern das Feature nicht ausdruecklich eine containerisierte Abhaengigkeit benoetigt."

[[phrase]]
from = "Keep the inventory target column aligned with the"
to = "Halte die Target-Spalte des Inventars ausgerichtet auf das"

[[phrase]]
from = "release where the fixture matters most."
to = "Release, in dem das Fixture am wichtigsten ist."

[[phrase]]
from = "Do not delete or rename an inventory entry without updating the release notes and explaining what replaces the coverage."
to = "Loesche oder benenne keinen Inventareintrag um, ohne die Release Notes zu aktualisieren und zu erklaeren, was die Abdeckung ersetzt."

[[phrase]]
from = "Relationship To Runtime Baseline"
to = "Beziehung zur Runtime-Baseline"

[[phrase]]
from = "records build and dependency evidence. This document records behavior fixtures. Both are required: dependency removal without behavior parity is not a successful Pingora exit."
to = "zeichnet Build- und Dependency-Nachweise auf. Dieses Dokument zeichnet Behavior-Fixtures auf. Beides ist erforderlich: Dependency-Entfernung ohne Verhaltensparitaet ist kein erfolgreicher Pingora-Exit."
