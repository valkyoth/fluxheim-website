locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Advanced Features"
to = "Fortgeschrittene Funktionen"

[[phrase]]
from = "PHP-FPM, proxy operations, admin API, zero-retention privacy mode, WAF, WASM extensibility, and planned future modules."
to = "PHP-FPM, Proxy-Operationen, Admin-API, Zero-Retention-Privacy-Modus, WAF, WASM-Erweiterbarkeit und geplante zukünftige Module."

[[phrase]]
from = "PHP-FPM Bridge"
to = "PHP-FPM-Bridge"

[[phrase]]
from = "Available since v1.3.1 via the <code>php-fpm</code> Cargo feature. The PHP-FPM bridge connects Fluxheim to a running PHP-FPM pool using the FastCGI protocol. It supports WordPress-style front-controller applications with strict script resolution and bounded request/response handling."
to = "Verfügbar seit v1.3.1 über das Cargo-Feature <code>php-fpm</code>. Die PHP-FPM-Bridge verbindet Fluxheim per FastCGI-Protokoll mit einem laufenden PHP-FPM-Pool. Sie unterstützt Front-Controller-Anwendungen im WordPress-Stil mit strikter Script-Auflösung und begrenzter Request-/Response-Verarbeitung."

[[phrase]]
from = "bash — build with PHP-FPM support"
to = "bash - Build mit PHP-FPM-Unterstützung"

[[phrase]]
from = "fluxheim.toml — WordPress front-controller"
to = "fluxheim.toml - WordPress-Front-Controller"

[[phrase]]
from = "Managed PHP-FPM"
to = "Verwaltetes PHP-FPM"

[[phrase]]
from = "Included in current v1.6.28 builds and introduced in v1.3.7. Managed mode keeps the same FastCGI/php-fpm request path, but Fluxheim starts and supervises a private php-fpm master process for the vhost. External php-fpm remains the default; use managed mode when you want Fluxheim to generate the pool config and own the private socket lifecycle."
to = "In aktuellen v1.6.28-Builds enthalten und in v1.3.7 eingeführt. Managed Mode behält denselben FastCGI/php-fpm-Request-Pfad bei, aber Fluxheim startet und überwacht einen privaten php-fpm-Masterprozess für den Vhost. Externes php-fpm bleibt der Standard; nutze Managed Mode, wenn Fluxheim die Pool-Konfiguration erzeugen und den privaten Socket-Lebenszyklus besitzen soll."

[[phrase]]
from = "fluxheim.toml — managed php-fpm pool"
to = "fluxheim.toml - verwalteter php-fpm-Pool"

[[phrase]]
from = "Do not set <code>socket</code>, <code>tcp</code>, or <code>tcp_upstreams</code> in managed mode. Fluxheim creates the private Unix socket under <code>socket_dir</code>, generates the php-fpm pool files, shuts the master down on reload or gateway shutdown, and respawns it with bounded backoff if it crashes after startup."
to = "Setze im Managed Mode nicht <code>socket</code>, <code>tcp</code> oder <code>tcp_upstreams</code>. Fluxheim erstellt den privaten Unix-Socket unter <code>socket_dir</code>, generiert die php-fpm-Pool-Dateien, beendet den Master bei Reload oder Gateway-Shutdown und startet ihn mit begrenztem Backoff neu, falls er nach dem Start abstürzt."

[[phrase]]
from = "How PHP routing works"
to = "Wie PHP-Routing funktioniert"

[[phrase]]
from = "Requests for existing <code>.php</code> files are routed directly to PHP-FPM"
to = "Requests für vorhandene <code>.php</code>-Dateien werden direkt zu PHP-FPM geroutet"

[[phrase]]
from = "Requests for non-existent files fall back to the front controller (<code>index.php</code>)"
to = "Requests für nicht vorhandene Dateien fallen auf den Front Controller (<code>index.php</code>) zurück"

[[phrase]]
from = "Static assets (<code>.css</code>, <code>.js</code>, images) are served directly without touching PHP-FPM"
to = "Statische Assets (<code>.css</code>, <code>.js</code>, Bilder) werden direkt ausgeliefert, ohne PHP-FPM zu berühren"

[[phrase]]
from = "Script resolution is strict — only files within the configured PHP <code>root</code> are passed to FPM"
to = "Script-Auflösung ist strikt - nur Dateien innerhalb des konfigurierten PHP-<code>root</code> werden an FPM übergeben"

[[phrase]]
from = "fluxheim-acme Companion"
to = "fluxheim-acme-Begleitwerkzeug"

[[phrase]]
from = "Released in v1.3.2. <code>fluxheim-acme</code> is a standalone companion binary for managing ACME certificate renewal and reload operations outside of the main gateway process. It is designed for container and external service-manager deployments where the gateway does not own the renewal lifecycle."
to = "Veröffentlicht in v1.3.2. <code>fluxheim-acme</code> ist ein eigenständiges Begleit-Binary zur Verwaltung von ACME-Zertifikatserneuerung und Reload-Operationen außerhalb des Haupt-Gateway-Prozesses. Es ist für Container- und externe Service-Manager-Deployments gedacht, bei denen das Gateway den Renewal-Lebenszyklus nicht besitzt."

[[phrase]]
from = "bash — fluxheim-acme operations"
to = "bash - fluxheim-acme-Operationen"

[[phrase]]
from = "The ACME reload socket lets <code>fluxheim-acme</code> signal the running gateway to pick up freshly issued certificates without a full restart. Configure the socket path in your <code>[server]</code> block."
to = "Der ACME-Reload-Socket erlaubt <code>fluxheim-acme</code>, dem laufenden Gateway frisch ausgestellte Zertifikate ohne vollständigen Neustart zu signalisieren. Konfiguriere den Socket-Pfad in deinem <code>[server]</code>-Block."

[[phrase]]
from = "fluxheim.toml — ACME reload socket"
to = "fluxheim.toml - ACME-Reload-Socket"

[[phrase]]
from = "fluxheim-config-tester"
to = "fluxheim-config-tester"

[[phrase]]
from = "Released in v1.3.2. <code>fluxheim-config-tester</code> is a standalone binary that validates a Fluxheim config file without starting the gateway. Useful in CI pipelines and container entrypoints where config errors should be caught before being applied to a running service."
to = "Veröffentlicht in v1.3.2. <code>fluxheim-config-tester</code> ist ein eigenständiges Binary, das eine Fluxheim-Konfigurationsdatei validiert, ohne das Gateway zu starten. Nützlich in CI-Pipelines und Container-Entrypoints, wo Konfigurationsfehler vor der Anwendung auf einen laufenden Dienst erkannt werden sollen."

[[phrase]]
from = "bash — validate config before apply"
to = "bash - Konfiguration vor Anwendung validieren"

[[phrase]]
from = "Proxy Operations"
to = "Proxy-Operationen"

[[phrase]]
from = "Fluxheim v1.4.x adds migration-focused proxy operations on top of the 1.4.0 proxy parity baseline: regex routes, method routing, WebSocket upgrades, auth subrequests, safe traffic mirroring, dynamic upstream discovery, and a read-only local ops socket."
to = "Fluxheim v1.4.x ergänzt migrationsorientierte Proxy-Operationen auf Basis der 1.4.0-Proxy-Parity-Baseline: Regex-Routen, Method-Routing, WebSocket-Upgrades, Auth-Subrequests, sicheres Traffic-Mirroring, dynamische Upstream-Discovery und einen lokalen read-only Ops-Socket."

[[phrase]]
from = "fluxheim.toml — proxy operations"
to = "fluxheim.toml - Proxy-Operationen"

[[phrase]]
from = "Regex support is disabled until <code>server.regex_enabled = true</code> is set. Traffic mirroring is compiled through the <code>traffic-mirror</code> feature and mirrors safe bodyless methods only; it never changes the primary response."
to = "Regex-Unterstützung ist deaktiviert, bis <code>server.regex_enabled = true</code> gesetzt ist. Traffic-Mirroring wird über das Feature <code>traffic-mirror</code> einkompiliert und spiegelt nur sichere Methoden ohne Body; es verändert nie die primäre Response."

[[phrase]]
from = "Zero-Retention Privacy Mode"
to = "Zero-Retention-Privacy-Modus"

[[phrase]]
from = "The <code>privacy-mode</code> feature compiles Fluxheim without any caching or metrics functionality, enforcing zero log retention at the build level. This is suitable for privacy-sensitive deployments where no request data should be stored or exported."
to = "Das Feature <code>privacy-mode</code> kompiliert Fluxheim ohne Caching- oder Metriken-Funktionalität und erzwingt Zero Log Retention auf Build-Ebene. Das passt für privacy-sensitive Deployments, bei denen keine Request-Daten gespeichert oder exportiert werden sollen."

[[phrase]]
from = "bash — zero-retention privacy build"
to = "bash - Zero-Retention-Privacy-Build"

[[phrase]]
from = "What privacy-mode enforces"
to = "Was privacy-mode erzwingt"

[[phrase]]
from = "No cache module compiled — caching is impossible at the binary level"
to = "Kein Cache-Modul einkompiliert - Caching ist auf Binary-Ebene unmöglich"

[[phrase]]
from = "No metrics module compiled — no Prometheus or OTLP export"
to = "Kein Metriken-Modul einkompiliert - kein Prometheus- oder OTLP-Export"

[[phrase]]
from = "Access logs may be disabled in the config"
to = "Access Logs können in der Konfiguration deaktiviert werden"

[[phrase]]
from = "Compile-time guarantee: no data is stored, no external telemetry is exported"
to = "Compile-Time-Garantie: keine Daten werden gespeichert, keine externe Telemetrie wird exportiert"

[[phrase]]
from = "Admin API"
to = "Admin-API"

[[phrase]]
from = "The admin control-plane exposes a local HTTP API for health checks, config reload, cache purge, and status queries. It defaults to loopback-only and requires a bearer token on non-loopback listeners."
to = "Die Admin-Control-Plane stellt eine lokale HTTP-API für Health Checks, Config Reload, Cache Purge und Statusabfragen bereit. Standardmäßig ist sie loopback-only und erfordert auf Nicht-Loopback-Listenern einen Bearer Token."

[[phrase]]
from = "bash — admin API endpoints"
to = "bash - Admin-API-Endpunkte"

[[phrase]]
from = "WASM Extensibility"
to = "WASM-Erweiterbarkeit"

[[phrase]]
from = "Planned — v1.6"
to = "Geplant - v1.6"

[[phrase]]
from = "Fluxheim's WASM extensibility layer is planned for the 1.6 release. It will support nginx-Lua-style request/response hooks and VCL-like cache policy hooks through WebAssembly modules."
to = "Fluxheims WASM-Erweiterbarkeitsschicht ist für das 1.6-Release geplant. Sie soll nginx-Lua-artige Request-/Response-Hooks und VCL-ähnliche Cache-Policy-Hooks über WebAssembly-Module unterstützen."

[[phrase]]
from = "Compile-time opt-in <code>wasm</code> feature"
to = "Compile-Time-Opt-in-Feature <code>wasm</code>"

[[phrase]]
from = "Hook points: request received, upstream response, cache policy, response send"
to = "Hook-Punkte: Request empfangen, Upstream-Response, Cache-Policy, Response-Versand"

[[phrase]]
from = "Shared memory model between WASM modules and the host"
to = "Gemeinsames Memory-Modell zwischen WASM-Modulen und Host"

[[phrase]]
from = "Sandboxed execution with bounded resource limits"
to = "Sandbox-Ausführung mit begrenzten Ressourcenlimits"

[[phrase]]
from = "WAF Architecture"
to = "WAF-Architektur"

[[phrase]]
from = "Planned — future"
to = "Geplant - zukünftig"

[[phrase]]
from = "A Web Application Firewall module is documented in the architecture but not enabled in the current stable builds. It is planned as a compile-time optional module with rule-based request filtering, rate limiting per IP/path/method, and configurable block/log/challenge responses."
to = "Ein Web-Application-Firewall-Modul ist in der Architektur dokumentiert, aber in aktuellen stabilen Builds nicht aktiviert. Es ist als optionales Compile-Time-Modul mit regelbasiertem Request-Filtering, Rate-Limiting pro IP/Pfad/Methode und konfigurierbaren Block-/Log-/Challenge-Responses geplant."

[[phrase]]
from = "Load Balancer"
to = "Load Balancer"

[[phrase]]
from = "The <code>load-balancer</code> feature adds Fluxheim's load-balancer control plane and health checks to the proxy runtime. It is opt-in and available today via <code>profile-load-balancer</code> or <code>profile-load-balancer-edge</code>."
to = "Das Feature <code>load-balancer</code> ergänzt Fluxheims Load-Balancer-Control-Plane und Health Checks zur Proxy-Runtime. Es ist optional und heute über <code>profile-load-balancer</code> oder <code>profile-load-balancer-edge</code> verfügbar."

