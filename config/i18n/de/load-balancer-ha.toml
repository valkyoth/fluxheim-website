locale_id = "de-DE"
html_lang = "de-DE"

[[phrase]]
from = "Load Balancer HA Design Notes"
to = "Load-Balancer-HA-Designhinweise"

[[phrase]]
from = "ships managed affinity cookies for one process. This document records the active-active HA design boundary for later"
to = "liefert Managed-Affinity-Cookies fuer einen Prozess. Dieses Dokument haelt die active-active-HA-Designgrenze fuer spaetere"

[[phrase]]
from = "work so operators can separate shipped behavior from planned cluster behavior."
to = "Arbeiten fest, damit Operatoren ausgeliefertes Verhalten von geplantem Cluster-Verhalten trennen koennen."

[[phrase]]
from = "Current 1.5.3 Behavior"
to = "Aktuelles 1.5.3-Verhalten"

[[phrase]]
from = "emits a signed, opaque cookie on eligible 2xx/3xx backend responses."
to = "gibt bei geeigneten 2xx/3xx-Backend-Antworten ein signiertes, opakes Cookie aus."

[[phrase]]
from = "Cookie values map to the local bounded persistence table."
to = "Cookie-Werte werden auf die lokale begrenzte Persistenztabelle abgebildet."

[[phrase]]
from = "Signing keys are generated locally, rotate daily, and verify the current or previous generation."
to = "Signing Keys werden lokal erzeugt, taeglich rotiert und pruefen die aktuelle oder vorherige Generation."

[[phrase]]
from = "Persistence tables and signing keys are not shared between Fluxheim nodes."
to = "Persistenztabellen und Signing Keys werden nicht zwischen Fluxheim-Nodes geteilt."

[[phrase]]
from = "Process restart invalidates unmanaged local state and starts a new signing key lineage."
to = "Ein Prozessneustart invalidiert unverwalteten lokalen State und startet eine neue Signing-Key-Linie."

[[phrase]]
from = "Future Active-Active Shape"
to = "Zukuenftige Active-Active-Form"

[[phrase]]
from = "The planned HA track should replicate only bounded, operationally useful state:"
to = "Der geplante HA-Track soll nur begrenzten, betrieblich nuetzlichen State replizieren:"

[[phrase]]
from = "managed-cookie key-to-backend affinity table entries;"
to = "Managed-Cookie-Key-zu-Backend-Affinity-Tabelleneintraege;"

[[phrase]]
from = "application-cookie or header persistence decisions when explicitly opted in;"
to = "Application-Cookie- oder Header-Persistenzentscheidungen bei explizitem Opt-in;"

[[phrase]]
from = "administrative member overrides such as"
to = "administrative Member-Overrides wie"

[[phrase]]
from = "optionally passive-health/circuit state after split-brain and freshness rules are proven."
to = "optional Passive-Health-/Circuit-State, nachdem Split-Brain- und Freshness-Regeln belegt sind."

[[phrase]]
from = "Retry budgets, queue counters, high-cardinality telemetry, and low-value per-request counters should stay node-local unless a later design proves that replication is bounded and useful."
to = "Retry-Budgets, Queue-Counter, High-Cardinality-Telemetrie und wenig wertvolle Per-Request-Counter sollen node-lokal bleiben, ausser ein spaeteres Design belegt, dass Replikation begrenzt und nuetzlich ist."

[[phrase]]
from = "Peer Protocol Requirements"
to = "Peer-Protokollanforderungen"

[[phrase]]
from = "Any cookie-mirroring implementation must include:"
to = "Jede Cookie-Mirroring-Implementierung muss enthalten:"

[[phrase]]
from = "mutually authenticated peers;"
to = "gegenseitig authentifizierte Peers;"

[[phrase]]
from = "bounded message size and bounded table sizes;"
to = "begrenzte Nachrichtengroessen und begrenzte Tabellengroessen;"

[[phrase]]
from = "per-entry TTL and table eviction;"
to = "TTL pro Eintrag und Tabellen-Eviction;"

[[phrase]]
from = "replay protection through monotonic sequence numbers or signed timestamps;"
to = "Replay-Schutz durch monotone Sequenznummern oder signierte Zeitstempel;"

[[phrase]]
from = "explicit fail-open/fail-closed behavior when peers are unavailable;"
to = "explizites Fail-Open-/Fail-Closed-Verhalten, wenn Peers nicht verfuegbar sind;"

[[phrase]]
from = "audit events for peer joins, state import/export, and rejected updates;"
to = "Audit-Events fuer Peer-Joins, State-Import/-Export und abgelehnte Updates;"

[[phrase]]
from = "metrics for replication lag, dropped updates, rejected updates, and peer health;"
to = "Metriken fuer Replikations-Lag, verworfene Updates, abgelehnte Updates und Peer-Health;"

[[phrase]]
from = "key rotation that supports overlap across the cluster, not only one process."
to = "Key-Rotation, die Ueberlappung im Cluster unterstuetzt, nicht nur in einem Prozess."

[[phrase]]
from = "Non-Goals For 1.5.3"
to = "Nichtziele fuer 1.5.3"

[[phrase]]
from = "<code>1.5.3</code> does not implement shared signing keys, restart-persistent state, cross-node persistence-table synchronization, or active-active cookie mirroring. Those remain future HA/control-plane work after the local managed-cookie path has passed release and pentest coverage."
to = "<code>1.5.3</code> implementiert keine geteilten Signing Keys, keinen restart-persistenten State, keine Cross-Node-Persistenztabellen-Synchronisierung und kein active-active Cookie Mirroring. Diese Punkte bleiben zukuenftige HA-/Control-Plane-Arbeit, nachdem der lokale Managed-Cookie-Pfad Release- und Pentest-Coverage bestanden hat."
