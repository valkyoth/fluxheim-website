version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Verzia 1.6.37 je záverečné čistenie hraníc crate pred Wasm: ACME, observability, cache, load-balancer, PHP-FPM a interné časti native runtime sa presúvajú do menších modulov vlastnených crate, pričom správanie runtime zostáva stabilné."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Verzia 1.6.37 zvyšuje spoľahlivosť lokálneho observability smoke tým, že opakuje dočasné štarty Promethea a Jaegera s novo pridelenými portmi, keď host-network porty súťažia s inými runner procesmi."

