fluxheim_1_7_8_keeps_wasm_optional_and_adds_wasi_preview_1_for_access_decision_plugins_clock_and_randomness_need_separate_grants_filesystem_network_process_and_other_host_access_stay_unavailable_unsupported_imports_fail_closed = "Fluxheim 1.7.8 ponecháva Wasm voliteľný a pridáva WASI Preview 1 pre zásadné pluginy rozhodovania o prístupe. Hodiny a náhodnosť vyžadujú samostatné oprávnenia; prístup k súborovému systému, sieti, procesom a iným hostiteľským prístupom zostáva nedostupný. Nepodporované importy zlyhávajú uzavretím"
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Skompilované moduly sú viazané na digest pluginu, verziu ABI, súbor funkcií hookov, menný priestor volaní hostiteľa a verziu Fluxheimu, takže budúce opätovné použitie nemôže prekročiť hranice vydania, funkcií ani ABI."
proxy_wasm_preview = "Ukážka Proxy-Wasm"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Zostavte s <code>wasm-proxy-abi</code>, povoľte <code>allow_preview_abi</code> a deklarujte ABI <code>proxy-wasm-preview</code> aj menný priestor volaní hostiteľa. Nepodporované importy a volania sa bezpečne odmietnu."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Pri viacnájomných nasadeniach povoľte <code>[server.host_routing].strict = true</code>, aby chýbajúca alebo neplatná identita hostiteľa vrátila <code>400</code> a neznámi hostitelia <code>421</code> namiesto predvolenej stránky."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Konfiguračné súbory a každý existujúci nadradený adresár ponechajte v dôveryhodnom vlastníctve a bez práva zápisu pre skupinu alebo ostatných používateľov."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Pri zmene nastavení TLS, listenerov, streamov, UDP, ACME, čistenia cache, tracingu alebo spravovaného procesu PHP-FPM proces nahraďte; bežné smerovanie a pravidlá počas požiadavky môžu použiť opätovné načítanie snapshotu."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Použite trvalý zapisovateľný volume dimenzovaný podľa pravidiel cache. Každej replike storage-bin prideľte vlastný lokálny alebo RWO volume; zdieľané úložisko RWX používajte iba s overeným zamykaním medzi uzlami a vynútením jediného writera na úrovni orchestrácie."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Pre každý bežiaci proces Fluxheim použite jeden storage-bin root; vlastníctvo využíva poradný zámok súborového systému a zdieľané roots s viacerými writermi nie sú bezpečné bez overeného externého zamykania."
wasi_preview_1 = "Ukážka WASI 1"
build_with_wasm_wasi_enable_allow_preview_abi_declare_the_wasi_preview_abi_and_host_call_namespace_and_grant_only_the_required_clock_or_randomness_capability_the_preview_is_limited_to_access_decisions = "Zostavte s <code>wasm-wasi</code>, povolte <code>allow_preview_abi</code>, deklarujte <code>wasi-preview</code> ABI a názov priestoru host-call, a udeľte len požadované oprávnenie pre hodiny alebo náhodnosť. Náhľad je obmedzený len na rozhodnutia o prístupe"
