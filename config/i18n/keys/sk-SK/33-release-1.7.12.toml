r1712_released_july_15_2026 = "Vydané 15. júla 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Pridáva voliteľné štandardy vyrovnávacej pamäte, servera proxy a metaúdajov prehľadu odpovedí"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Dokazuje opätovné načítanie overenej snímky v reálnom čase, vrátenie späť, kontroly integrity a pretrvávanie reštartu"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Pridáva reprodukovateľné dôkazy FIPS-backend a široké natívne spevnenie počas prevádzky"
r1712_whats_next_summary = "pridáva metadáta štandardov, overený dôkaz o vrátení snímky, reprodukovateľný dôkaz FIPS-backend a silnejšiu vyrovnávaciu pamäť, TLS, Wasm, ukladanie do vyrovnávacej pamäte a hranice toku."
r1712_release_series_digest = "Séria vydaní Fluxheim 1.7: voliteľné štandardy založené na vyrovnávacej pamäti, proxy a metaúdajoch na spracovanie odpovedí; opätovné načítanie a vrátenie overenej aktuálnej snímky; reprodukovateľný dôkaz FIPS-backend; upgrady procesov s nulovými prestojmi; nezávisle testované príklady zásad Wasm; a silnejšia vyrovnávacia pamäť, TLS, ukladanie do vyrovnávacej pamäte, stream a hranice protokolu."
r1712_standards_based_response_metadata = "Metadáta odpovede založené na štandardoch"
r1712_response_metadata_intro = "Metadáta odpovede sú predvolene zakázané. Povoľte iba polia, ktoré potrebujete; Fluxheim ich odvodzuje zo skutočného výsledku vyrovnávacej pamäte, zlyhania servera proxy a bajtov konečnej odpovede bez odhalenia kľúčov vyrovnávacej pamäte, adries koncového servera, názvov DNS alebo nespracovaných chýb."
r1712_field = "Pole"
r1712_what_it_reports = "Čo hlási"
r1712_cache_status_description = "Výsledky vyrovnávacej pamäte RFC 9211, ako sú hit, miss, zastarané presmerovanie, opätovné overenie, uplynutie platnosti a obídenie."
r1712_proxy_status_description = "Podrobnosti o nízkej kardinalite RFC 9209 pre zlyhania generované Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 nad konečným obsahom správy HTTP po kompresii."
r1712_repr_digest_description = "SHA-256 len vtedy, keď Fluxheim obsahuje kompletnú zvolenú reprezentáciu."
r1712_live_snapshots_and_rollback = "Živé snímky a vrátenie späť"
r1712_live_snapshot_intro = "Overené snímky môžu zverejniť overeného kandidáta, nahradiť aktívny smerovač a vrátiť sa späť bez reštartovania bežných nasadení iba pre smerovanie. Každá požiadavka zostáva na jednej generácii smerovača od začiatku do konca."
r1712_snapshot_private_directory = "Uchovávajte úložisko snímok vo vyhradenom súkromnom adresári; existujúce neprivátne adresáre a korene súborového systému sú odmietnuté."
r1712_snapshot_process_upgrade = "Inováciu procesu použite, keď sú aktívne služby na vyvažovanie zaťaženia alebo zisťovanie na pozadí."
r1712_snapshot_integrity_restart = "Spustite kontroly integrity snímky po zverejnení alebo vrátení a overte, či vybratá generácia prežije reštart."
r1712_read_snapshot_contract = "Prečítajte si celú zmluvu o snímke"
r1712_authorization_cache_bypass = "Požiadavky nesúce <code>Authorization</code> alebo <code>Proxy-Authorization</code> vždy obchádzajú vyhľadávanie a ukladanie v zdieľanej vyrovnávacej pamäti."
r1712_strict_cache_control = "Chybná alebo konfliktná odpoveď Direktívy <code>Cache-Control</code> sú odmietnuté namiesto toho, aby sa vrátili späť na nakonfigurované TTL; <code>s-maxage</code> má prednosť pred <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> a <code>s-maxage</code> zakazujú opätovné použitie zastaraných po uplynutí platnosti."
r1712_encrypted_cache_upgrade_note = "Poznámka k inovácii šifrovanej vyrovnávacej pamäte"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 presúva šifrované objekty diskovej vyrovnávacej pamäte do koreňových údajov a indexových kľúčov s trvalým stavom nonce. Prvé spustenie proti staršiemu zašifrovanému koreňovému adresáru a každá rotácia lokálneho kľúča zámerne vyčistí túto vyrovnávaciu pamäť pred obsluhou prevádzky."
r1712_encrypted_cache_disposable = "Zaobchádzajte so šifrovanou vyrovnávacou pamäťou ako s jednorazovým zrýchlením, nie so zdrojom záznamu."
r1712_encrypted_cache_private_storage = "Poskytnite každému koreňovému adresáru cache trvalé súkromné úložisko a nekopírujte stav nonce medzi nezávislými koreňmi."
r1712_encrypted_cache_warmup = "Naplánujte si pôvodnú kapacitu na prvé zahriatie po aktualizácii alebo otočení kľúčov."
r1712_client_certificate_revocation = "Zrušenie klientskeho certifikátu"
r1712_client_certificate_revocation_intro = "Keď vzájomný TLS musí odmietnuť zrušené klientske certifikáty, poskytnite ohraničený balík PEM CRL. Fluxheim overí celý reťazec vydavateľov a odmietne vypršanú alebo neúplnú politiku CRL."
r1712_client_certificate_revocation_compliance = "Požadovaná autentifikácia klienta v režime zhody FIPS alebo ISO vyžaduje aj balík CRL. Bežná autentifikácia klienta zachováva zrušenie ako výslovné prihlásenie."
r1712_fips_backend_evidence = "Backendový dôkaz FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim poskytuje samostatne pripnuté prostredia CI pre profily OpenSSL-FIPS a rustls/AWS-LC-FIPS. Vytvárajú a spúšťajú presný binárny profil, vykonávajú downstream a certifikátom overené upstream TLS, odmietajú nekompatibilnú politiku a zaznamenávajú kompilátor, poskytovateľ, závislosti, binárne a obrazové identity."
r1712_fips_backend_evidence_boundary = "Toto je reprodukovateľný backendový dôkaz, nie validácia FIPS na úrovni produktu. Dôkazné kontajnery uchovávajte oddelene od bežných obrázkov vydania a skontrolujte dôkazy pre presnú zostavu, ktorú nasadíte."
r1712_read_fips_evidence_guide = "Prečítajte si sprievodcu dôkazmi FIPS"
r1712_loader_admission = "Riadenie načítania modulov"
r1712_loader_admission_description = "Verejné manifesty doplnkov musia obsahovať pevne určený odtlačok SHA-256. V celom procese sa môžu súčasne kompilovať najviac dva moduly. Predvolený limit skompilovaného výstupu je 32 MiB a nemožno prekročiť 256 MiB."
r1712_file_identity = "Identita súboru"
r1712_file_identity_description = "Fluxheim otvorí schválené súbory zásuvných modulov bez nasledujúcich odkazov, zachová si overený popisovač bežného súboru a načíta bajty modulu z tohto ovládača bez opätovného otvorenia cesty."
