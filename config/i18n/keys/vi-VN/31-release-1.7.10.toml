released_july_13_2026 = "Phát hành ngày 13 tháng 7 năm 2026"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Thêm cấu hình bảo mật phản hồi HTTP tùy chọn và CORS nhận biết yêu cầu được xác thực"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Ổn định các ví dụ về chính sách Wasm có thể chạy được và các thử nghiệm mà cổng phát hành yêu cầu"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Tăng cường các tiêu đề nhận dạng được chuyển tiếp, phân tích cú pháp tiêu đề và hướng dẫn thử lại về giới hạn dung lượng"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "ổn định các ví dụ di chuyển Wasm và thêm bảo mật phản hồi HTTP tùy chọn, CORS nhận biết yêu cầu cũng như ranh giới tiêu đề và chuyển tiếp chặt chẽ hơn."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Chuỗi bản phát hành Fluxheim 1.7: các ví dụ di chuyển được thử nghiệm độc lập, lệnh gọi lại máy chủ bị giới hạn, cấu hình bảo mật phản hồi HTTP tùy chọn, CORS nhận biết yêu cầu đã được xác thực, xử lý danh tính được chuyển tiếp chặt chẽ hơn và các ranh giới mạnh mẽ hơn cho Wasm, ACME, ảnh chụp nhanh, GeoIP, luồng, TLS, PHP-FPM và phân phát tệp tĩnh."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 giúp mọi nhóm di chuyển có thể kiểm tra độc lập, lưu giữ bản kiểm tra khói Wasm hoàn chỉnh trong cổng phát hành và xác minh rằng ID tượng trưng do khách kiểm soát bị từ chối một cách an toàn. Các cuộc gọi lại máy chủ trong quá trình vẫn bị giới hạn ở các hoạt động hữu hạn, không chặn."
wasm_host_callbacks = "Cuộc gọi lại máy chủ Wasm"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "Lệnh gọi lại được giới hạn ở việc giải mã ký hiệu hữu hạn, đọc ngữ cảnh giới hạn và trạng thái giới hạn. Họ không thể thực hiện công việc về tệp, mạng, IPC, chế độ ngủ, xử lý hoặc gọi lại của bên thứ ba."
release_testing = "Phát hành thử nghiệm"
each_migration_family_can_run_independently_while_the_release_gate_also_runs_the_complete_smoke_test_and_an_arbitrary_guest_id_decoder_property_test = "Mỗi dòng di chuyển có thể chạy độc lập, trong khi cổng phát hành cũng chạy thử nghiệm khói hoàn chỉnh và thử nghiệm thuộc tính bộ giải mã ID khách tùy ý."
http_response_security = "Bảo mật phản hồi HTTP"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "Cấu hình bảo mật phản hồi HTTP là tùy chọn. Bắt đầu với <code>baseline</code>; chỉ sử dụng cách ly nhiều nguồn gốc sau khi kiểm tra mọi tập lệnh, phông chữ, hình ảnh, luồng đăng nhập và tài nguyên được nhúng."
profile = "Hồ sơ"
what_it_does = "Nó làm gì"
keeps_the_opt_in_hardening_headers_disabled = "Giữ các tiêu đề tăng cường chọn tham gia bị vô hiệu hóa."
adds_conservative_browser_isolation_and_resource_policy_defaults_suitable_for_most_sites = "Thêm cách ly trình duyệt bảo thủ và mặc định chính sách tài nguyên phù hợp với hầu hết các trang web."
enables_strict_cross_origin_isolation_for_applications_that_have_tested_every_external_dependency = "Cho phép cách ly nhiều nguồn gốc nghiêm ngặt đối với các ứng dụng đã kiểm tra mọi phần phụ thuộc bên ngoài."
neither_profile_enables_hsts_or_csp_configure_those_separately_after_testing_them_against_the_real_site = "Cả hai cấu hình đều không bật HSTS hoặc CSP. Định cấu hình chúng một cách riêng biệt sau khi thử nghiệm chúng trên trang web thực."
cors_for_browser_apps = "CORS cho ứng dụng trình duyệt"
enable_cors_only_when_browser_applications_on_known_origins_must_call_this_route = "Chỉ bật CORS khi các ứng dụng trình duyệt có nguồn gốc đã biết phải gọi tuyến đường này."
fluxheim_answers_valid_preflight_requests_locally_rejected_preflights_return_403_without_reaching_the_application = "Fluxheim xử lý cục bộ các yêu cầu CORS preflight hợp lệ; yêu cầu preflight bị từ chối trả về <code>403</code> mà không tới ứng dụng."
do_not_combine_a_wildcard_origin_with_credentials = "Không kết hợp nguồn gốc ký tự đại diện với thông tin xác thực."
cors_is_not_authentication_authorization_or_csrf_protection = "CORS không phải là xác thực, ủy quyền hoặc bảo vệ CSRF."
stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Ổn định các ví dụ di chuyển Wasm có thể chạy được và thử nghiệm cổng phát hành; thêm các cấu hình bảo mật phản hồi HTTP tùy chọn, CORS nhận biết yêu cầu đã được xác thực, hướng dẫn thử lại có giới hạn, chuyển tiếp chặt chẽ hơn và dọn dẹp tiêu đề danh tính cũng như phân tích cú pháp và viết lại tiêu đề an toàn hơn."
