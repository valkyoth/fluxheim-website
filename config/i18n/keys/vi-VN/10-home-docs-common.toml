[home]
meta_description = "Fluxheim is a hiệu năng cao, mô-đun web server, reverse proxy and caching server xây dựng bằng Rust."
meta_description_secure = "Fluxheim is a hiệu năng cao, mô-đun web server, reverse proxy and caching server. Viết bằng Rust. An toàn theo mặc định."
meta_description_short = "A an toàn bộ nhớ máy chủ biên and reverse proxy xây dựng bằng Rust."
hero_memory_safe = "An toàn bộ nhớ"
hero_edge_server = "Máy chủ biên"
hero_built_in_rust = "Xây dựng bằng Rust"
hero_line_one = "Modular reverse proxy, cache, cân bằng tải, and static host written"
hero_line_two = "in Rust. An toàn theo mặc định with TLS, ACME, compression, edge policy,"
hero_line_three = "dynamic upstream discovery, and an toàn lưu lượng mirroring built in."
tag_fluxheim_core = "Bản dịch: Fluxheim Core"
tag_macos_dev = "Bản dịch: macOS Dev"
tag_rootless_containers = "Bản dịch: Rootless Containers"
features_heading = "Mọi thứ cần thiết ở lớp biên"
features_intro = "Fluxheim ships as focused, mô-đun builds — use only what your deployment needs."
memory_safe_by_design = "An toàn bộ nhớ ngay từ thiết kế"
memory_safe_by_design_text = "Viết bằng Rust with a pinned stable toolchain. No buffer overflows, no use-after-free, no data races by construction."
fluxheim_http_core = "Lõi HTTP của Fluxheim"
fluxheim_http_core_text = "A Rust-native edge runtime with connection pooling, upstream retries, active kiểm tra sức khỏe, HTTP/2, WebSocket upgrades, and gRPC pass-through."
load_balancer_control_plane = "Mặt phẳng điều khiển cân bằng tải"
load_balancer_control_plane_text = "Bản dịch: Focused 1.5 load-balancer binary and image with advanced selection, local persistence, health/ejection policy, bounded queueing, and runtime member controls."
modular_build_profiles = "Hồ sơ dựng mô-đun"
modular_build_profiles_text = "Compile only what you need. Focused profiles for static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, lưu lượng mirroring, and compression-enabled production bundles."
tls_managed_acme = "TLS và ACME được quản lý"
tls_managed_acme_text = "Bản dịch: rustls-first with supported OpenSSL and FIPS/ISO proof build paths, client certificate auth, upstream mTLS, automatic ACME issuance, and multi-cert SNI."
advanced_cache_system = "Hệ thống cache nâng cao"
advanced_cache_system_text = "Memory, disk, tiered, and encrypted cache backend with cache-an toàn gzip, Zstandard, and Brotli compression plus range caching for large objects."
container_native = "Hỗ trợ container gốc"
container_native_text = "Bản dịch: Rootless Podman images for Wolfi, Alpine, SUSE Micro, and Debian. Systemd/RPM for native deployments. Zero external assets on startup."
prometheus_opentelemetry = "Prometheus và OpenTelemetry"
prometheus_opentelemetry_text = "Opt-in Prometheus metric listener, OTLP metric export, trace context propagation, and OTLP trace export for full quan sát hệ thống."
geo_context_text = "Tra cứu MMDB cục bộ tùy chọn cho chính sách quốc gia và ASN bằng MaxMind GeoIP2/GeoLite2 hoặc bộ dữ liệu CIRCL Geo Open. Không có tra cứu từ xa hoặc trình tải xuống trong đường xử lý yêu cầu."
tcp_stream_proxy = "Proxy luồng TCP"
tcp_stream_proxy_text = "Bản dịch: Raw L4 TCP services with dedicated stream routes, true idle/lifetime/byte caps, upstream TLS/mTLS controls, weighted/drain/backup policy, and route-local PROXY protocol."
php_fpm_support = "Hỗ trợ PHP-FPM"
php_fpm_support_text = "Opt-in PHP-FPM FastCGI bridge for WordPress-style front-controller applications. Strict script resolution and bounded yêu cầu handling."
edge_policy_controls = "Điều khiển chính sách biên"
edge_policy_controls_text = "Trusted-proxy-aware ACLs, rate limits, auth subyêu cầu, lưu lượng mirroring, regex rewrites, bounded queues, strict config validation, and hardened yêu cầu handling."
