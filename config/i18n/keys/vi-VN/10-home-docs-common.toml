no_analytics_cookies_text = "Bản dịch: The Fluxheim website does not use analytics cookies, advertising cookies, fingerprinting, local storage identifiers, or third-party analytics scripts."
language_selector_cookie_text = "Bản dịch: The language selector uses normal links and does not need a cookie. If a future deployment adds a strictly necessary cookie, this notice must be updated before that change is enabled."
aggregate_observability = "Aggregate quan sát hệ thống"
aggregate_observability_text = "We collect first-party aggregate quan sát hệ thống events to count visits, language usage, page sections, tải xuốngs, GitHub redirects, yêu cầu latency, and approximate visible time on a page."
events_no_sensitive_text = "These events do not contain raw IP addresses, user identifiers, cookie values, browser fingerprints, yêu cầu bodies, authorization headers, or full query strings."
what_we_collect = "Bản dịch: What we collect"
privacy_collect_text = "The website records aggregate operational metric: yêu cầu counts, page views, selected language, normalized page route, section, HTTP status class, yêu cầu duration, tải xuống clicks, GitHub redirect clicks, and approximate page visible time."
country_aggregation_text = "Người vận hành có thể bật tổng hợp theo quốc gia. Khi bật, máy chủ suy ra mã quốc gia trong bộ nhớ và chỉ xuất mã quốc gia hoặc unknown."
what_we_do_not_collect = "Bản dịch: What we do not collect"
privacy_do_not_collect_text = "We do not export raw IP addresses, per-user identifiers, analytics cookies, browser fingerprints, complete user agents, referrer URLs, yêu cầu bodies, authorization headers, cookie headers, or full query strings."
telemetry_use_text = "Telemetry is used to operate the website, understand aggregate tài liệu and tải xuống usage, and detect reliability problems. It is not used to build profiles about individual visitors."
retention = "Bản dịch: Retention"
retention_text = "Bản dịch: Retention is controlled by the local Prometheus and Grafana deployment operated for the website. The website application does not write a separate analytics database."
purpose_and_lawful_basis = "Mục đích and lawful basis"
gdpr_basis_text = "The purpose of the website telemetry is bảo mật, reliability, capacity planning, and aggregate tài liệu improvement. The intended lawful basis is legitimate interest in operating and securing the website with privacy-minimised telemetry."
data_minimisation = "Bản dịch: Data minimisation"
gdpr_minimisation_text = "Metrics use bounded labels such as locale, normalized route, section, status class, tải xuống artifact, GitHub target, and optional country code. The implementation is designed not to store or export raw IP addresses or user-level tracking identifiers."
github_redirect_privacy_text = "GitHub outbound clicks are counted in aggregate before redirecting the browser to GitHub. GitHub then processes the yêu cầu under GitHub's own terms and privacy policy."
your_rights = "Bản dịch: Your rights"
gdpr_rights_text = "Because the website avoids user identifiers and stores only aggregate telemetry, we normally cannot identify a specific visitor inside the metric. Privacy or GDPR questions can be opened through the Fluxheim GitHub project."
translation_notice = "Thông báo dịch thuật"
translation_notice_text = "Bản dịch: Website translations are AI-assisted and maintained on a best-effort basis. Corrections and improved translations are welcome in the <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">Fluxheim website i18n keys</a>."
