fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 vẫn giữ Wasm là tùy chọn và thêm các native HTTP/1 route-decision hook có giới hạn bên cạnh access-decision và header hook. Plugin có thể tiếp tục, từ chối hoặc chọn các nhánh route canary và mirror đã cấu hình, nhưng vẫn không thể tự tạo upstream, bỏ qua route matching, ghi đè chính sách truy cập Fluxheim hoặc nhận raw header, body, quyền truy cập filesystem, mạng, private key hay admin API."
