fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 vẫn giữ Wasm là tùy chọn và thêm các native HTTP/1 route-decision hook có giới hạn bên cạnh access-decision và header hook. Plugin có thể tiếp tục, từ chối hoặc chọn các nhánh route canary và mirror đã cấu hình, nhưng vẫn không thể tự tạo upstream, bỏ qua route matching, ghi đè chính sách truy cập Fluxheim hoặc nhận raw header, body, quyền truy cập filesystem, mạng, private key hay admin API."
route_decisions = "Quyết định định tuyến"
route_decision_hooks_can_continue_deny_or_select_only_configured_matching_canary_and_mirror_route_branches = "<code>route-decision</code> hook chỉ có thể tiếp tục, từ chối hoặc chọn các nhánh route <code>canary</code> và <code>mirror</code> đã cấu hình và khớp."
selected_route_policy = "Chính sách của tuyến đã chọn"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "ACL, rate limit, concurrency limit, body limit, redirect và header-policy của route được chọn vẫn chạy sau một quyết định route Wasm."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 tiếp tục giữ Wasm là tùy chọn và thêm native HTTP/1 cache-policy hook có giới hạn bên cạnh access-decision, header và route-decision hook. Plugin có thể tiếp tục hành vi cache bình thường, chuyển tiếp tới origin, bỏ qua cache, bỏ qua lưu trữ hoặc từ chối, nhưng không thể sửa raw cache keys, TTLs, tags, response headers hay stored metadata, cũng không nhận raw headers, bodies, filesystem access, network access, private keys hoặc admin APIs."
cache_decisions = "Quyết định cache"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hook có thể continue, pass, bypass hoặc deny. <code>cache-store</code> hook có thể continue, skip storage hoặc deny trước khi ghi vào memory/disk cache."
cache_policy_limits = "Giới hạn cache-policy"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hook dùng một trần admission riêng ở cấp process để route cache-policy có traffic cao không làm cạn năng lực thực thi của access, route hoặc header hook."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 tiếp tục giữ Wasm là tùy chọn và mở rộng native HTTP/1 cache-policy hook có giới hạn bên cạnh access-decision, header và route-decision hook. Plugin có thể tiếp tục hành vi cache bình thường, chuyển tiếp tới origin, bỏ qua cache, bỏ qua lưu trữ, từ chối, chọn fixed mobile/desktop cache-key variant và gắn fixed cache-store TTL, tag, stored-header metadata; nhưng vẫn không thể phát arbitrary cache-key byte, arbitrary TTL, arbitrary tag, raw response-header, body, filesystem access, network access, private key hoặc admin API."
cache_metadata = "Siêu dữ liệu cache"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hook có thể thêm fixed mobile/desktop cache-key variant. <code>cache-store</code> hook có thể đặt fixed TTL, tag và stored-header metadata."
module_identity = "Định danh mô-đun"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Các ngưỡng thực thi process-wide, cache-global, cache-vhost, per-plugin và per-attachment ngăn plugin work tăng không giới hạn."
fluxheim_1_7_8_keeps_wasm_optional_and_adds_wasi_preview_1_for_access_decision_plugins_clock_and_randomness_need_separate_grants_filesystem_network_process_and_other_host_access_stay_unavailable_unsupported_imports_fail_closed = "Fluxheim 1.7.8 giữ Wasm là tùy chọn và thêm WASI Preview 1 để plugin ra quyết định truy cập. Đồng hồ và ngẫu nhiên cần quyền truy cập riêng biệt; hệ thống tệp, mạng, quy trình và các quyền truy cập host khác vẫn không khả dụng. Các hàm nhập không hỗ trợ sẽ bị từ chối."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Module đã biên dịch được ràng buộc với plugin digest, ABI version, hook feature surface, host-call namespace và Fluxheim version, nên việc tái sử dụng sau này không thể vượt qua ranh giới release, feature hoặc ABI."
proxy_wasm_preview = "Bản xem trước Proxy-Wasm"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Build với <code>wasm-proxy-abi</code>, bật <code>allow_preview_abi</code>, rồi khai báo cả <code>proxy-wasm-preview</code> ABI và host-call namespace. Import và call không được hỗ trợ sẽ fail-closed."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Với deployment multi-tenant, hãy bật <code>[server.host_routing].strict = true</code>. Host identity thiếu hoặc không hợp lệ sẽ trả về <code>400</code>; host không xác định sẽ trả về <code>421</code> thay vì đi tới default site."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Đặt config file và mọi parent directory hiện có dưới ownership đáng tin cậy, đồng thời không cho group hoặc user khác quyền ghi."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Thay thế process khi thay đổi TLS, listener, stream, UDP, ACME, cache purging, tracing hoặc managed PHP-FPM process setting; routing thông thường và request-time policy có thể dùng snapshot reload."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Dùng persistent writable volume có dung lượng phù hợp với cache policy. Cấp cho mỗi storage-bin replica một local hoặc RWO volume riêng; chỉ dùng shared RWX storage khi cross-node locking đã được kiểm chứng và single-writer được cưỡng chế ở tầng orchestration."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Dùng một storage-bin root cho mỗi Fluxheim process đang chạy; ownership dùng advisory filesystem lock, vì vậy shared multi-writer root không an toàn nếu chưa có external locking đã được kiểm chứng."
wasi_preview_1 = "Bản xem trước WASI 1"
build_with_wasm_wasi_enable_allow_preview_abi_declare_the_wasi_preview_abi_and_host_call_namespace_and_grant_only_the_required_clock_or_randomness_capability_the_preview_is_limited_to_access_decisions = "Xây dựng với <code>wasm-wasi</code>, bật <code>allow_preview_abi</code>, khai báo ABI và không gian tên host-call <code>wasi-preview</code>, và cấp quyền truy cập đồng hồ hoặc ngẫu nhiên cần thiết. Bản xem trước chỉ giới hạn cho các quyết định truy cập."
