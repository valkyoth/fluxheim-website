version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Phiên bản 1.6.37 là lần dọn dẹp ranh giới crate cuối cùng trước Wasm: ACME, observability, cache, load-balancer, PHP-FPM và nội bộ native runtime chuyển sang các module nhỏ hơn do crate sở hữu, trong khi hành vi runtime vẫn ổn định."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Phiên bản 1.6.37 làm local observability smoke đáng tin cậy hơn bằng cách thử lại các lần khởi động Prometheus và Jaeger tạm thời với cổng mới khi cổng host-network cạnh tranh với process runner khác."

