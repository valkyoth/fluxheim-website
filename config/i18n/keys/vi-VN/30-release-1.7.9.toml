webassembly_line_optional_bounded_policy_hooks_isolated_modules_disabled_by_default_proxy_wasm_and_wasi_previews_explicit_wasi_grants_validated_migration_examples_and_stronger_acme_snapshot_geoip_stream_tls_php_fpm_static_serving_and_wasm_boundaries = "Dòng WebAssembly: các móc chính sách giới hạn tùy chọn, các mô-đun biệt lập, các bản xem trước Proxy-Wasm và WASI bị tắt theo mặc định, các cấp phép WASI rõ ràng, các ví dụ di chuyển đã được xác thực và các ranh giới ACME, ảnh chụp nhanh, GeoIP, luồng, TLS, PHP-FPM, phân phát tĩnh và Wasm mạnh hơn."
