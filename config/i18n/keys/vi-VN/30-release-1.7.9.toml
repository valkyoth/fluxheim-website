fluxheim_1_7_9_adds_runnable_migration_examples_for_irules_style_access_policy_openresty_style_header_policy_haproxy_spoe_style_routing_and_vcl_style_cache_policy_these_map_common_policy_jobs_to_fluxheim_s_typed_abi_they_do_not_run_source_code_from_those_products = "Fluxheim 1.7.9 bổ sung các ví dụ di chuyển sẵn sàng chạy cho chính sách truy cập kiểu iRules, chính sách tiêu đề kiểu OpenResty, định tuyến kiểu HAProxy/SPOE và chính sách bộ đệm kiểu VCL. Các ví dụ này ánh xạ các tác vụ chính sách chung tới ABI được định kiểu của Fluxheim và không thực thi mã nguồn từ các sản phẩm đó."
