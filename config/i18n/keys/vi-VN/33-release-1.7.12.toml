r1712_released_july_15_2026 = "Phát hành ngày 15 tháng 7 năm 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Thêm siêu dữ liệu bộ đệm, proxy và thông báo phản hồi dựa trên tiêu chuẩn chọn tham gia"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Chứng minh khả năng tải lại ảnh chụp nhanh trực tiếp đã được xác thực, khôi phục, kiểm tra tính toàn vẹn và khởi động lại liên tục"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Thêm bằng chứng FIPS-backend có thể tái tạo và tăng cường độ cứng thời gian chạy gốc trên diện rộng"
r1712_whats_next_summary = "thêm siêu dữ liệu tiêu chuẩn chọn tham gia, bằng chứng khôi phục ảnh chụp nhanh đã xác thực, bằng chứng FIPS-backend có thể tái tạo và bộ nhớ đệm mạnh hơn, TLS, Wasm, bộ đệm và ranh giới luồng."
r1712_release_series_digest = "Chuỗi phát hành Fluxheim 1.7: bộ nhớ đệm, proxy và siêu dữ liệu phản hồi dựa trên tiêu chuẩn chọn tham gia; tải lại và khôi phục ảnh chụp nhanh trực tiếp đã được xác thực; bằng chứng FIPS-backend có thể tái tạo; nâng cấp quy trình không có thời gian ngừng hoạt động; các ví dụ về chính sách Wasm được kiểm tra độc lập; và bộ đệm mạnh hơn, TLS, ranh giới bộ đệm, luồng và giao thức."
r1712_standards_based_response_metadata = "Siêu dữ liệu phản hồi dựa trên tiêu chuẩn"
r1712_response_metadata_intro = "Siêu dữ liệu phản hồi bị tắt theo mặc định. Chỉ kích hoạt các trường bạn cần; Fluxheim lấy chúng từ kết quả bộ đệm thực tế, lỗi proxy và byte phản hồi cuối cùng mà không để lộ khóa bộ đệm, địa chỉ phụ trợ, tên DNS hoặc lỗi thô."
r1712_field = "trường"
r1712_what_it_reports = "Nó báo cáo cái gì"
r1712_cache_status_description = "Các kết quả của bộ đệm RFC 9211 như truy cập, bỏ lỡ, chuyển tiếp cũ, xác nhận lại, hết hạn và bỏ qua."
r1712_proxy_status_description = "Chi tiết về lượng số thấp của RFC 9209 cho các lỗi do Fluxheim tạo ra."
r1712_content_digest_description = "RFC 9530 SHA-256 qua nội dung tin nhắn HTTP cuối cùng sau khi nén."
r1712_repr_digest_description = "SHA-256 chỉ khi Fluxheim giữ biểu diễn đã chọn hoàn chỉnh."
r1712_live_snapshots_and_rollback = "Ảnh chụp nhanh trực tiếp và khôi phục"
r1712_live_snapshot_intro = "Ảnh chụp nhanh đã xác thực có thể xuất bản một ứng cử viên đã được xác thực, thay thế bộ định tuyến trực tiếp và quay lại mà không cần khởi động lại quá trình triển khai chỉ định tuyến thông thường. Mỗi yêu cầu nằm trên một thế hệ bộ định tuyến từ đầu đến cuối."
r1712_snapshot_private_directory = "Giữ cửa hàng ảnh chụp nhanh trong một thư mục riêng tư chuyên dụng; các thư mục không riêng tư và gốc hệ thống tập tin hiện có đều bị từ chối."
r1712_snapshot_process_upgrade = "Sử dụng nâng cấp quy trình khi các dịch vụ khám phá hoặc tình trạng cân bằng tải nền đang hoạt động."
r1712_snapshot_integrity_restart = "Chạy kiểm tra tính toàn vẹn của ảnh chụp nhanh sau khi xuất bản hoặc khôi phục và xác minh thế hệ đã chọn vẫn tồn tại khi khởi động lại."
r1712_read_snapshot_contract = "Đọc đầy đủ quy tắc vận hành snapshot"
r1712_authorization_cache_bypass = "Các yêu cầu mang <code>Authorization</code> hoặc <code>Proxy-Authorization</code> luôn bỏ qua việc tra cứu và lưu trữ bộ nhớ đệm dùng chung."
r1712_strict_cache_control = "Phản hồi không đúng hoặc xung đột Các lệnh <code>Cache-Control</code> bị từ chối thay vì quay trở lại các TTL đã định cấu hình; <code>s-maxage</code> được ưu tiên hơn <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> và <code>s-maxage</code> cấm sử dụng lại sau khi hết hạn sử dụng."
r1712_encrypted_cache_upgrade_note = "Ghi chú nâng cấp bộ đệm được mã hóa"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 di chuyển các đối tượng bộ nhớ đệm trên đĩa được mã hóa sang dữ liệu liên kết gốc và các khóa chỉ mục với trạng thái nonce bền vững. Lần khởi động đầu tiên chống lại root được mã hóa cũ hơn và mỗi lần xoay khóa cục bộ, có chủ ý xóa nguội bộ đệm đó trước khi phân phối lưu lượng truy cập."
r1712_encrypted_cache_disposable = "Hãy coi bộ đệm được mã hóa là dữ liệu tăng tốc có thể loại bỏ, không phải nguồn dữ liệu chuẩn."
r1712_encrypted_cache_private_storage = "Cung cấp cho mỗi bộ đệm gốc bộ lưu trữ riêng tư liên tục và không sao chép trạng thái nonce giữa các gốc độc lập."
r1712_encrypted_cache_warmup = "Dự trù đủ công suất máy chủ nguồn cho lần làm nóng bộ đệm đầu tiên sau khi nâng cấp hoặc xoay vòng khóa."
r1712_client_certificate_revocation = "Thu hồi chứng chỉ ứng dụng khách"
r1712_client_certificate_revocation_intro = "Khi TLS lẫn nhau phải từ chối các chứng chỉ ứng dụng khách đã bị thu hồi, hãy cung cấp gói PEM CRL có giới hạn. Fluxheim xác thực chuỗi nhà phát hành hoàn chỉnh và từ chối chính sách CRL đã hết hạn hoặc chưa đầy đủ."
r1712_client_certificate_revocation_compliance = "Xác thực ứng dụng khách bắt buộc trong chế độ tuân thủ bắt buộc FIPS hoặc ISO cũng yêu cầu gói CRL. Xác thực ứng dụng khách thông thường giữ việc thu hồi dưới dạng chọn tham gia rõ ràng."
r1712_fips_backend_evidence = "Bằng chứng phụ trợ FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim cung cấp các môi trường kiểm chứng CI được ghim riêng cho cấu hình OpenSSL-FIPS và rustls/AWS-LC-FIPS. Các môi trường này xây dựng và chạy đúng tệp nhị phân của cấu hình, kiểm thử TLS phía máy khách và TLS tới máy chủ nguồn có xác minh chứng chỉ, từ chối chính sách không tương thích, đồng thời ghi lại danh tính của trình biên dịch, nhà cung cấp mật mã, phần phụ thuộc, tệp nhị phân và ảnh container."
r1712_fips_backend_evidence_boundary = "Đây là bằng chứng kiểm chứng backend có thể tái tạo, không phải chứng nhận FIPS cho toàn bộ sản phẩm. Hãy tách container kiểm chứng khỏi ảnh phát hành thông thường và xác nhận bằng chứng khớp chính xác với bản dựng được triển khai."
r1712_read_fips_evidence_guide = "Đọc hướng dẫn bằng chứng FIPS"
r1712_loader_admission = "Kiểm soát tiếp nhận khi tải"
r1712_loader_admission_description = "Manifest công khai phải ghim giá trị SHA-256. Toàn bộ tiến trình chỉ biên dịch đồng thời tối đa hai tác vụ; sản phẩm biên dịch có giới hạn mặc định 32 MiB và giới hạn tuyệt đối 256 MiB."
r1712_file_identity = "Tính đồng nhất của tệp"
r1712_file_identity_description = "Fluxheim mở tệp plugin đã được phê duyệt mà không đi theo liên kết, giữ nguyên handle của tệp thường đã được xác minh và đọc byte mô-đun từ handle đó mà không mở lại đường dẫn."
