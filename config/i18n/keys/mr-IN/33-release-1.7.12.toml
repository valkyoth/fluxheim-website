r1712_encrypted_cache_upgrade_note = "एनक्रिप्टेड-कॅशे अपग्रेड नोट"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 एनक्रिप्टेड डिस्क कॅशे ऑब्जेक्ट्स रूट-बाउंड डेटा आणि इंडेक्स की ला टिकाऊ नॉन्स स्टेटसह हलवते. जुन्या एनक्रिप्टेड रूटच्या विरूद्ध प्रथम स्टार्टअप, आणि प्रत्येक स्थानिक-की रोटेशन, ट्रॅफिक सर्व्ह करण्यापूर्वी कॅशे हेतुपुरस्सर कोल्ड-पर्ज करते."
r1712_encrypted_cache_disposable = "एन्क्रिप्टेड कॅशेला डिस्पोजेबल प्रवेग म्हणून हाताळा, रेकॉर्डचा स्रोत नाही."
r1712_encrypted_cache_private_storage = "प्रत्येक कॅशे रूटला पर्सिस्टंट प्रायव्हेट स्टोरेज द्या आणि स्वतंत्र रूट्समध्ये नॉन्स स्टेट कॉपी करू नका."
r1712_encrypted_cache_warmup = "की श्रेणीसुधारित केल्यानंतर किंवा फिरवल्यानंतर पहिल्या वॉर्म-अपसाठी मूळ क्षमतेची योजना करा."
r1712_client_certificate_revocation = "क्लायंट प्रमाणपत्र निरस्तीकरण"
r1712_client_certificate_revocation_intro = "जेव्हा म्युच्युअल TLS ने रद्द केलेले क्लायंट प्रमाणपत्र नाकारले पाहिजे, तेव्हा एक बाउंड PEM CRL बंडल प्रदान करा. Fluxheim संपूर्ण जारीकर्ता साखळी सत्यापित करते आणि कालबाह्य किंवा अपूर्ण CRL धोरण नाकारते."
r1712_client_certificate_revocation_compliance = "FIPS किंवा ISO-आवश्यक अनुपालन मोडमध्ये आवश्यक क्लायंट प्रमाणीकरणासाठी देखील CRL बंडल आवश्यक आहे. सामान्य क्लायंट प्रमाणीकरण एक स्पष्ट निवड म्हणून निरस्तीकरण ठेवते."
r1712_fips_backend_evidence = "FIPS बॅकएंड पुरावा"
r1712_fips_backend_evidence_intro = "Fluxheim OpenSSL-FIPS आणि rustls/AWS-LC-FIPS प्रोफाइलसाठी स्वतंत्रपणे पिन केलेले CI प्रूफ वातावरण प्रदान करते. ते अचूक प्रोफाइल बायनरी बनवतात आणि चालवतात, डाउनस्ट्रीम आणि प्रमाणपत्र-सत्यापित अपस्ट्रीम TLS, विसंगत धोरण नाकारतात आणि कंपाइलर, प्रदाता, अवलंबित्व, बायनरी आणि प्रतिमा ओळख रेकॉर्ड करतात."
r1712_fips_backend_evidence_boundary = "हा पुनरुत्पादक बॅकएंड पुरावा आहे, उत्पादन-स्तरीय FIPS प्रमाणीकरण नाही. प्रूफ कंटेनर्स सामान्य रिलीझ प्रतिमांपासून वेगळे ठेवा आणि तुम्ही तैनात केलेल्या अचूक बिल्डच्या पुराव्याचे पुनरावलोकन करा."
r1712_read_fips_evidence_guide = "FIPS पुरावा मार्गदर्शक वाचा"
r1712_loader_admission = "मॉड्यूल लोडिंग नियंत्रण"
r1712_loader_admission_description = "सार्वजनिक प्लगइन मॅनिफेस्टमध्ये निश्चित SHA-256 डायजेस्ट असणे आवश्यक आहे. संपूर्ण प्रक्रियेत एकावेळी जास्तीत जास्त दोन मॉड्यूल संकलित होतात. संकलित आउटपुटची डीफॉल्ट मर्यादा 32 MiB आहे आणि ती 256 MiB पेक्षा जास्त असू शकत नाही."
r1712_file_identity = "फाइल ओळख"
r1712_file_identity_description = "Fluxheim अनुमोदित प्लगइन फायली लिंक फॉलो न करता उघडते, प्रमाणित रेग्युलर-फाइल हँडल राखून ठेवते आणि पथ पुन्हा न उघडता त्या हँडलवरून मॉड्यूल बाइट्स वाचते."
