r1712_read_snapshot_contract = "संपूर्ण स्नॅपशॉट करार वाचा"
r1712_authorization_cache_bypass = "<code>Authorization</code> किंवा <code>Proxy-Authorization</code> घेऊन जाणाऱ्या विनंत्या नेहमी शेअर केलेले-कॅशे लुकअप आणि स्टोरेज बायपास करतात."
r1712_strict_cache_control = "विकृत किंवा विरोधाभासी प्रतिसाद <code>Cache-Control</code> निर्देश कॉन्फिगर केलेल्या TTL वर परत येण्याऐवजी नाकारले जातात; <code>s-maxage</code> <code>max-age</code> पेक्षा प्राधान्य घेते."
