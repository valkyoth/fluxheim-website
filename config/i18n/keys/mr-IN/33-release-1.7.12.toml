r1712_live_snapshots_and_rollback = "थेट स्नॅपशॉट आणि रोलबॅक"
r1712_live_snapshot_intro = "प्रमाणीकृत स्नॅपशॉट्स प्रमाणित उमेदवार प्रकाशित करू शकतात, थेट राउटर पुनर्स्थित करू शकतात आणि सामान्य राउटिंग-केवळ तैनाती रीस्टार्ट न करता परत येऊ शकतात. प्रत्येक विनंती एका राउटर जनरेशनवर सुरुवातीपासून शेवटपर्यंत राहते."
