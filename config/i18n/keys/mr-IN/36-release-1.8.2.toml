r182_windows_unsigned = "ही स्वाक्षरी नसलेली पोर्टेबल पूर्वावलोकन आवृत्ती आहे. SmartScreen आणि PowerShell सुरक्षा सुरू ठेवा; Authenticode स्वाक्षरी आणि Windows सेवा इंस्टॉलर अद्याप उपलब्ध नाहीत."
r182_macos_unsigned = "ही स्वाक्षरी नसलेली कमांड-लाइन पूर्वावलोकन आवृत्ती आहे. Gatekeeper सुरू ठेवा; Developer ID स्वाक्षरी, नोटरायझेशन आणि launchd एकत्रीकरण अद्याप उपलब्ध नाही."
