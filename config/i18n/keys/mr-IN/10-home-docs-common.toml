prometheus_opentelemetry_text = "अनुवाद: Opt-in Prometheus metrics listener, OTLP metrics export, trace context propagation, and OTLP trace export for full observability."
geo_context_text = "तांत्रिक शब्द: Optional local MMDB lookups for country and ASN policy using MaxMind GeoIP2/GeoLite2 or CIRCL Geo Open datasets. No remote lookup or downloader in the request path."
tcp_stream_proxy = "तांत्रिक शब्द: TCP Stream Proxy"
tcp_stream_proxy_text = "अनुवाद: Raw L4 TCP services with dedicated stream routes, true idle/lifetime/byte caps, upstream TLS/mTLS controls, weighted/drain/backup policy, and route-local PROXY protocol."
