modular_build_profiles_text = "अनुवाद: Compile only what you need. Focused profiles for static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring, and compression-enabled production bundles."
tls_managed_acme = "तांत्रिक शब्द: TLS & Managed ACME"
tls_managed_acme_text = "अनुवाद: rustls-first with supported OpenSSL and FIPS/ISO proof build paths, client certificate auth, upstream mTLS, automatic ACME issuance, and multi-cert SNI."
advanced_cache_system = "तांत्रिक शब्द: Advanced Cache System"
advanced_cache_system_text = "Memory, disk, tiered, and encrypted cache backends with cache-सुरक्षित gzip, Zstandard, and Brotli compression plus range caching for large objects."
