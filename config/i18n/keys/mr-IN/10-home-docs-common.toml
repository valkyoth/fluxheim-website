fluxheim_http_core_text = "अनुवाद: A Rust-native edge runtime with connection pooling, upstream retries, active health checks, HTTP/2, WebSocket upgrades, and gRPC pass-through."
load_balancer_control_plane = "तांत्रिक शब्द: Load Balancer Control Plane"
load_balancer_control_plane_text = "अनुवाद: Focused 1.5 load-balancer binary and image with advanced selection, local persistence, health/ejection policy, bounded queueing, and runtime member controls."
