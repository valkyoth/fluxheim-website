r1712_released_july_15_2026 = "Publicat el 15 de juliol de 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Afegeix metadades de memòria cau, proxy i resum de respostes basades en estàndards"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Demostra la recàrrega d'instantànies en directe autenticada, la recuperació, les comprovacions d'integritat i la persistència de reinici"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Afegeix proves reproductibles de FIPS-backend i un ampli enduriment del temps d'execució natiu"
r1712_whats_next_summary = "afegeix metadades d'estàndards d'activació, prova de retrocés d'instantànies autenticades, proves FIPS-backend reproduïbles i memòria cau més forta, TLS, Wasm, memòria intermèdia i límits de flux."
r1712_release_series_digest = "Sèrie de llançaments Fluxheim 1.7: metadades de memòria cau, proxy i resum de respostes basades en estàndards d'activació; recàrrega i retrocessió d'instantànies en directe autenticades; evidència FIPS-backend reproduïble; actualitzacions de processos sense temps d'inactivitat; exemples de polítiques Wasm provades de manera independent; i una memòria cau més forta, TLS, memòria intermèdia, flux i límits de protocol."
r1712_standards_based_response_metadata = "Metadades de resposta basades en estàndards"
r1712_response_metadata_intro = "Les metadades de resposta estan desactivades de manera predeterminada. Habiliteu només els camps que necessiteu; Fluxheim els deriva del resultat real de la memòria cau, l'error del servidor intermediari i els bytes de resposta final sense exposar les claus de la memòria cau, les adreces de fons, els noms DNS o els errors en brut."
r1712_field = "Camp"
r1712_what_it_reports = "El que informa"
r1712_cache_status_description = "RFC 9211 resultats de la memòria cau, com ara encert, error, reenviament obsolet, revalidació, caducitat i bypass."
r1712_proxy_status_description = "Detalls de cardinalitat baixa de RFC 9209 per a errors generats per Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 sobre el contingut final del missatge HTTP després de la compressió."
r1712_repr_digest_description = "SHA-256 només quan Fluxheim conté la representació seleccionada completa."
r1712_live_snapshots_and_rollback = "Instantània en directe i retrocés"
r1712_live_snapshot_intro = "Les instantànies autenticades poden publicar un candidat validat, substituir l'encaminador en directe i retrocedir sense reiniciar els desplegaments normals només d'encaminament. Cada sol·licitud es manté en una generació d'encaminador des del principi fins al final."
r1712_snapshot_private_directory = "Mantingueu la botiga d'instantànies en un directori privat dedicat; es rebutgen els directoris no privats existents i les arrels del sistema de fitxers."
r1712_snapshot_process_upgrade = "Utilitzeu una actualització de procés quan els serveis de descobriment o la salut de l'equilibrador de càrrega en segon pla estiguin actius."
r1712_snapshot_integrity_restart = "Executeu comprovacions d'integritat de les instantànies després de la publicació o de la retroalimentació i comproveu que la generació seleccionada sobreviu al reinici."
r1712_read_snapshot_contract = "Llegiu el contracte de la instantània completa"
r1712_authorization_cache_bypass = "Les sol·licituds que porten <code>Authorization</code> o <code>Proxy-Authorization</code> sempre obvien la cerca i l'emmagatzematge de la memòria cau compartida."
r1712_strict_cache_control = "Resposta incorrecta o conflictiva Les directives <code>Cache-Control</code> es rebutgen en lloc de tornar a les TTL configurades; <code>s-maxage</code> té prioritat sobre <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> i <code>s-maxage</code> prohibeixen la reutilització obsoleta un cop caduca la frescor."
r1712_encrypted_cache_upgrade_note = "Nota d'actualització de la memòria cau xifrada"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 mou els objectes de memòria cau de disc xifrats a dades vinculades arrel i claus d'índex amb un estat nonce durador. La primera posada en marxa amb una arrel xifrada més antiga, i cada rotació de clau local, purga intencionadament en fred aquesta memòria cau abans de servir el trànsit."
r1712_encrypted_cache_disposable = "Tracteu la memòria cau xifrada com a acceleració d'un sol ús, no com a font de registre."
r1712_encrypted_cache_private_storage = "Doneu a cada arrel de memòria cau un emmagatzematge privat persistent i no copieu l'estat nonce entre arrels independents."
r1712_encrypted_cache_warmup = "Planifiqueu la capacitat d'origen per al primer escalfament després d'actualitzar o girar les tecles."
r1712_client_certificate_revocation = "Revocació del certificat del client"
r1712_client_certificate_revocation_intro = "Quan TLS mútua ha de rebutjar certificats de client revocats, proporcioneu un paquet PEM CRL limitat. Fluxheim valida la cadena completa de l'emissor i rebutja la política CRL caducada o incompleta."
r1712_client_certificate_revocation_compliance = "L'autenticació de client necessària en un mode de compliment requerit per FIPS o ISO també requereix un paquet CRL. L'autenticació normal del client manté la revocació com a activació explícita."
r1712_fips_backend_evidence = "FIPS proves del backend"
r1712_fips_backend_evidence_intro = "Fluxheim proporciona entorns de prova CI fixats per separat per als perfils OpenSSL-FIPS i rustls/AWS-LC-FIPS. Creen i executen el perfil binari exacte, exerceixen aigües avall i verificades per certificat TLS, rebutgen polítiques incompatibles i registren les identitats del compilador, del proveïdor, de la dependència, del binària i de la imatge."
r1712_fips_backend_evidence_boundary = "Aquesta és una evidència de backend reproduïble, no una validació FIPS a nivell de producte. Mantingueu els contenidors de prova separats de les imatges de llançament normals i reviseu les proves de la compilació exacta que implementeu."
r1712_read_fips_evidence_guide = "Llegiu la guia d'evidència FIPS"
r1712_loader_admission = "Controls de càrrega de mòduls"
r1712_loader_admission_description = "Els manifests públics dels connectors han d'incloure un resum SHA-256 fix. Com a màxim es compilen dos mòduls alhora en tot el procés. La sortida compilada té un límit predeterminat de 32 MiB i no pot superar els 256 MiB."
r1712_file_identity = "Identitat del fitxer"
r1712_file_identity_description = "Fluxheim obre fitxers de connectors aprovats sense seguir els enllaços, conserva l'identificador de fitxer normal validat i llegeix els bytes del mòdul d'aquest identificador sense tornar a obrir el camí."
