fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Sèrie de llançament de Fluxheim 1.7: exemples de migració provats de manera independent, devolucions de trucada de l'amfitrió limitat, perfils de seguretat de resposta HTTP opcionals, CORS validat per a sol·licituds, un maneig d'identitats reenviades més estricte i límits més forts per a Wasm, ACME, instantànies, GeoIP, fluxos, TLS, PHP-FPM i servei de fitxers estàtics."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 fa que totes les famílies de migració es puguin provar de manera independent, manté la prova de fum Wasm completa a la porta d'alliberament i verifica que els identificadors simbòlics controlats pels convidats es rebutgen de manera segura. Les devolucions de trucada de l'amfitrió en procés es mantenen limitades a operacions finites i sense bloqueig."
