cookie_notice = "Avís de cookies"
gdpr_information = "Informació RGPD"
last_updated_june_23_2026 = "Darrera actualització: 23 de juny de 2026"
no_analytics_cookies = "Sense cookies d'analytics"
no_analytics_cookies_text = "El lloc web de Fluxheim no usa cookies d'analytics, cookies publicitàries, fingerprinting, identificadors de local storage ni scripts d'analytics de tercers."
language_selector_cookie_text = "El selector d'idioma usa enllaços normals i no necessita cap cookie. Si un desplegament futur afegeix una cookie estrictament necessària, aquest avís s'ha d'actualitzar abans d'activar aquest canvi."
aggregate_observability = "Observabilitat agregada"
aggregate_observability_text = "Recollim events first-party agregats d'observability per comptar visites, ús d'idiomes, seccions de pàgina, baixades, redirects a GitHub, latència de request i temps visible aproximat a la pàgina."
events_no_sensitive_text = "Aquests events no contenen IPs raw, identificadors d'usuari, valors de cookies, fingerprints de navegador, request bodies, authorization headers ni query strings completes."
what_we_collect = "Què recollim"
privacy_collect_text = "El lloc registra mètriques operatives agregades: request counts, page views, idioma seleccionat, ruta normalitzada, secció, classe d'estat HTTP, durada de request, clicks de baixada, clicks de redirect a GitHub i temps visible aproximat."
country_aggregation_text = "L'operador pot activar agregació opcional per país. Quan és activa, el servidor deriva un codi de país en memòria i només exporta el codi de país o unknown."
what_we_do_not_collect = "Què no recollim"
privacy_do_not_collect_text = "No exportem IPs raw, identificadors per usuari, analytics cookies, fingerprints de navegador, user agents complets, referrer URLs, request bodies, authorization headers, cookie headers ni query strings completes."
telemetry_use_text = "La telemetry s'usa per operar el lloc, entendre l'ús agregat de documentació i baixades i detectar problemes de fiabilitat. No s'usa per crear perfils de visitants individuals."
retention = "Retenció"
retention_text = "La retenció la controla el desplegament local de Prometheus i Grafana operat per al lloc. L'aplicació web no escriu una base de dades d'analytics separada."
purpose_and_lawful_basis = "Finalitat i base jurídica"
gdpr_basis_text = "La finalitat de la telemetry del lloc és seguretat, fiabilitat, planificació de capacitat i millora agregada de la documentació. La base jurídica prevista és l'interès legítim a operar i protegir el lloc amb telemetry minimitzada per privadesa."
data_minimisation = "Minimització de dades"
gdpr_minimisation_text = "Les mètriques usen labels acotats com locale, ruta normalitzada, secció, classe d'estat, artifact de baixada, target de GitHub i codi de país opcional. La implementació està dissenyada per no emmagatzemar ni exportar IPs raw ni identificadors de tracking a nivell d'usuari."
github_redirect_privacy_text = "Els clicks sortints a GitHub es compten de forma agregada abans de redirigir el navegador a GitHub. Després GitHub processa el request segons els seus termes i política de privadesa."
your_rights = "Els teus drets"
gdpr_rights_text = "Com que el lloc evita identificadors d'usuari i només emmagatzema telemetry agregada, normalment no podem identificar un visitant concret dins les mètriques. Les preguntes de privadesa o RGPD es poden obrir mitjançant el projecte Fluxheim a GitHub."
translation_notice = "Avís sobre traduccions"
translation_notice_text = "Les traduccions del lloc web estan assistides per IA i es mantenen amb el millor esforç possible. Les correccions i traduccions millorades són benvingudes a les <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">claus i18n del lloc web de Fluxheim</a>."
