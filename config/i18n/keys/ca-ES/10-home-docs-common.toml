[home]
meta_description = "Fluxheim és un servidor web modular d'alt rendiment, reverse proxy i servidor de memòria cau construït en Rust."
meta_description_secure = "Fluxheim és un servidor web modular d'alt rendiment, reverse proxy i servidor de memòria cau. Escrit en Rust. Segur per defecte."
meta_description_short = "Un servidor edge i reverse proxy segur per a la memòria construït en Rust."
hero_memory_safe = "Segur per a la memòria"
hero_edge_server = "Servidor edge"
hero_built_in_rust = "Construït en Rust"
hero_line_one = "Reverse proxy modular, memòria cau, balancejador de càrrega i host estàtic"
hero_line_two = "escrit en Rust. Segur per defecte amb TLS, ACME, compressió,"
hero_line_three = "política edge, dynamic upstream discovery i traffic mirroring segur integrats."
tag_fluxheim_core = "Nucli de Fluxheim"
tag_macos_dev = "Desenvolupament macOS"
tag_rootless_containers = "Contenidors rootless"
features_heading = "Tot el que necessites a l'edge"
features_intro = "Fluxheim es distribueix com a builds enfocades i modulars: usa només el que necessita el teu desplegament."
memory_safe_by_design = "Segur per a la memòria per disseny"
memory_safe_by_design_text = "Escrit en Rust amb una toolchain estable fixada. Sense buffer overflows, sense use-after-free i sense data races per construcció."
fluxheim_http_core = "Nucli HTTP de Fluxheim"
fluxheim_http_core_text = "Un runtime edge natiu en Rust amb connection pooling, upstream retries, active health checks, HTTP/2, WebSocket upgrades i gRPC pass-through."
load_balancer_control_plane = "Pla de control del balancejador"
load_balancer_control_plane_text = "Binari i imatge load-balancer 1.5 enfocats amb selecció avançada, persistència local, política health/ejection, cues acotades i controls de membres en runtime."
modular_build_profiles = "Perfils de build modulars"
modular_build_profiles_text = "Compila només el que necessites. Perfils enfocats per a static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring i paquets de producció amb compressió."
tls_managed_acme = "TLS i ACME gestionat"
tls_managed_acme_text = "Enfocament rustls-first amb rutes de build OpenSSL i FIPS/ISO compatibles, client certificate auth, upstream mTLS, emissió ACME automàtica i SNI multi-cert."
advanced_cache_system = "Sistema avançat de memòria cau"
advanced_cache_system_text = "Backends de memòria cau en memòria, disc, tiered i xifrats amb compressió gzip, Zstandard i Brotli segura per a memòria cau, a més de range caching per a objectes grans."
container_native = "Natiu per a contenidors"
container_native_text = "Imatges Podman rootless per a Wolfi, Alpine, SUSE Micro i Debian. Systemd/RPM per a desplegaments natius. Cap asset extern en arrencar."
prometheus_opentelemetry = "Prometheus i OpenTelemetry"
prometheus_opentelemetry_text = "Listener opcional de mètriques Prometheus, exportació OTLP de mètriques, propagació de trace context i exportació OTLP de traces per a una observability completa."
geo_context_text = "Consultes MMDB locals opcionals per a polítiques de país i ASN amb datasets MaxMind GeoIP2/GeoLite2 o CIRCL Geo Open. Sense consulta remota ni downloader al request path."
tcp_stream_proxy = "TCP stream proxy"
tcp_stream_proxy_text = "Serveis TCP L4 raw amb stream routes dedicades, límits reals idle/lifetime/byte, controls upstream TLS/mTLS, política weighted/drain/backup i PROXY protocol local a la ruta."
php_fpm_support = "Suport PHP-FPM"
php_fpm_support_text = "Pont PHP-FPM FastCGI opcional per a aplicacions front-controller estil WordPress. Resolució estricta de scripts i gestió acotada de requests."
edge_policy_controls = "Controls de política edge"
edge_policy_controls_text = "ACLs aware de trusted proxy, rate limits, auth subrequests, traffic mirroring, regex rewrites, cues acotades, validació estricta de config i request handling endurit."
