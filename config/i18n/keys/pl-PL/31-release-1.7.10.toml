http_response_security = "Bezpieczeństwo odpowiedzi HTTP"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "Profile zabezpieczeń odpowiedzi HTTP są opcjonalne. Zacznij od <code>baseline</code>; używaj izolacji między źródłami dopiero po przetestowaniu każdego skryptu, czcionki, obrazu, przepływu logowania i zasobu osadzonego."
