released_july_13_2026 = "Wydany 13 lipca 2026 r"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Dodaje opcjonalne profile zabezpieczeń odpowiedzi HTTP i zweryfikowany mechanizm CORS obsługujący żądania"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Stabilizuje możliwe do uruchomienia przykłady zasad Wasm i testy wymagane przez bramkę wydania"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Wzmacnia przekazywane nagłówki tożsamości, analizowanie nagłówków i wskazówki dotyczące ponownych prób w zakresie limitów pojemności"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "stabilizuje przykłady migracji Wasm i dodaje opcjonalne zabezpieczenia odpowiedzi HTTP, CORS obsługujący żądania oraz bardziej rygorystyczne granice przekazywania i nagłówków."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Seria wydań Fluxheim 1.7: niezależnie przetestowane przykłady migracji, ograniczone wywołania zwrotne hosta, opcjonalne profile bezpieczeństwa odpowiedzi HTTP, zweryfikowany mechanizm CORS obsługujący żądania, bardziej rygorystyczna obsługa przekazywanych tożsamości i silniejsze granice dla Wasm, ACME, migawek, GeoIP, strumieni, TLS, PHP-FPM i udostępniania plików statycznych."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 umożliwia niezależne testowanie każdej rodziny migracji, przechowuje pełny test dymu Wasm w bramce wydawniczej i weryfikuje, czy kontrolowane przez gościa symboliczne identyfikatory są bezpiecznie odrzucane. Wywołania zwrotne hosta w procesie pozostają ograniczone do skończonych, nieblokujących operacji."
wasm_host_callbacks = "Oddzwanianie hosta Wasm"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "Wywołania zwrotne są ograniczone do skończonego dekodowania symbolicznego, ograniczonych odczytów kontekstu i stanu ograniczonego. Nie mogą wykonywać zadań związanych z plikami, siecią, IPC, uśpieniem, procesami ani wywołaniami zwrotnymi innych firm."
release_testing = "Testowanie wydania"
