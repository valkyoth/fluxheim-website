stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabilizuje możliwe do uruchomienia przykłady migracji Wasm i testy przed wydaniem; dodaje opcjonalne profile bezpieczeństwa odpowiedzi HTTP, zweryfikowany mechanizm CORS obsługujący żądania, ograniczone wskazówki dotyczące ponownych prób, bardziej rygorystyczne przekazywanie i oczyszczanie nagłówków tożsamości oraz bezpieczniejsze analizowanie i przepisywanie nagłówków."
