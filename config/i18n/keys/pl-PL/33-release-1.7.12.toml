r1712_released_july_15_2026 = "Wydany 15 lipca 2026 r"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Dodaje metadane oparte na standardach pamięci podręcznej, proxy i podsumowania odpowiedzi"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Potwierdza uwierzytelnione ponowne ładowanie migawek na żywo, przywracanie, sprawdzanie integralności i trwałość ponownego uruchamiania"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Dodaje powtarzalne dowody FIPS-backend i szerokie natywne wzmocnienie środowiska wykonawczego"
r1712_whats_next_summary = "dodaje metadane standardów opt-in, dowód cofania uwierzytelnionych migawek, powtarzalne dowody FIPS-backend i silniejszą pamięć podręczną, TLS, Wasm, buforowanie i granice strumieni."
r1712_release_series_digest = "Seria wydań Fluxheim 1.7: opcjonalna, oparta na standardach metadane pamięci podręcznej, proxy i metadanych podsumowujących odpowiedzi; uwierzytelnione ponowne ładowanie i przywracanie migawek na żywo; powtarzalne dowody FIPS-backend; aktualizacje procesów bez przestojów; niezależnie przetestowane przykłady zasad Wasm; i silniejsza pamięć podręczna, TLS, buforowanie, strumienie i granice protokołów."
r1712_standards_based_response_metadata = "Metadane odpowiedzi oparte na standardach"
r1712_response_metadata_intro = "Metadane odpowiedzi są domyślnie wyłączone. Włącz tylko te pola, których potrzebujesz; Fluxheim wyprowadza je z rzeczywistego wyniku pamięci podręcznej, awarii serwera proxy i końcowych bajtów odpowiedzi bez ujawniania kluczy pamięci podręcznej, adresów zaplecza, nazw DNS ani nieprzetworzonych błędów."
r1712_field = "Pole"
r1712_what_it_reports = "Co raportuje"
r1712_cache_status_description = "Wyniki pamięci podręcznej RFC 9211, takie jak trafienie, chybienie, nieaktualne przekazywanie, ponowna weryfikacja, wygaśnięcie i obejście."
r1712_proxy_status_description = "RFC 9209 Szczegóły niskiej kardynalności dla błędów generowanych przez Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 nad końcową treścią komunikatu HTTP po kompresji."
r1712_repr_digest_description = "SHA-256 tylko wtedy, gdy Fluxheim zawiera pełną wybraną reprezentację."
r1712_live_snapshots_and_rollback = "Migawki na żywo i przywracanie"
r1712_live_snapshot_intro = "Uwierzytelnione migawki mogą opublikować zweryfikowanego kandydata, zastąpić działający router i przywrócić działanie bez ponownego uruchamiania normalnych wdrożeń obejmujących wyłącznie routing. Każde żądanie pozostaje na jednej generacji routera od początku do końca."
r1712_snapshot_private_directory = "Przechowuj magazyn migawek w dedykowanym katalogu prywatnym; istniejące nieprywatne katalogi i katalogi główne systemu plików są odrzucane."
r1712_snapshot_process_upgrade = "Użyj uaktualnienia procesu, gdy usługi kondycji lub wykrywania modułu równoważenia obciążenia w tle są aktywne."
r1712_snapshot_integrity_restart = "Uruchom sprawdzanie integralności migawki po publikacji lub wycofaniu i sprawdź, czy wybrana generacja przetrwała ponowne uruchomienie."
r1712_read_snapshot_contract = "Przeczytaj całą umowę dotyczącą migawek"
r1712_authorization_cache_bypass = "Żądania przenoszące <code>Authorization</code> lub <code>Proxy-Authorization</code> zawsze omijają wyszukiwanie i przechowywanie we współdzielonej pamięci podręcznej."
r1712_strict_cache_control = "Źle sformułowana lub sprzeczna odpowiedź. Dyrektywy <code>Cache-Control</code> są odrzucane zamiast wracać do skonfigurowanych wartości TTL; <code>s-maxage</code> ma pierwszeństwo przed <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> i <code>s-maxage</code> zabraniają ponownego użycia nieaktualnych plików po wygaśnięciu świeżości."
r1712_encrypted_cache_upgrade_note = "Uwaga dotycząca aktualizacji zaszyfrowanej pamięci podręcznej"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 przenosi zaszyfrowane obiekty pamięci podręcznej dysku do danych powiązanych z rootem i kluczy indeksu z trwałym stanem jednorazowym. Pierwsze uruchomienie w przypadku starszego zaszyfrowanego katalogu głównego i każda rotacja klucza lokalnego celowo czyści pamięć podręczną na zimno przed obsłużeniem ruchu."
r1712_encrypted_cache_disposable = "Traktuj zaszyfrowaną pamięć podręczną jako jednorazowe przyspieszenie, a nie źródło zapisu."
r1712_encrypted_cache_private_storage = "Zapewnij każdemu katalogowi głównemu pamięci podręcznej trwałą prywatną pamięć i nie kopiuj stanu jednorazowego między niezależnymi katalogami głównymi."
r1712_encrypted_cache_warmup = "Zaplanuj pojemność pierwotną na pierwszą rozgrzewkę po aktualizacji lub rotacji kluczy."
r1712_client_certificate_revocation = "Cofnięcie certyfikatu klienta"
r1712_client_certificate_revocation_intro = "Gdy wzajemne TLS musi odrzucić unieważnione certyfikaty klienta, zapewnij ograniczony pakiet PEM CRL. Fluxheim sprawdza cały łańcuch wystawców i odrzuca wygasłą lub niekompletną polisę CRL."
r1712_client_certificate_revocation_compliance = "Wymagane uwierzytelnianie klienta w trybie zgodności wymaganym przez FIPS lub ISO wymaga również pakietu CRL. Zwykłe uwierzytelnianie klienta zachowuje odwołanie jako wyraźną zgodę."
r1712_fips_backend_evidence = "Dowody zaplecza FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim zapewnia oddzielnie przypięte środowiska testowe CI dla profili OpenSSL-FIPS i rustls/AWS-LC-FIPS. Budują i uruchamiają dokładny profil binarny, wykonują dalsze czynności i weryfikują certyfikaty poprzedzające TLS, odrzucają niezgodne zasady i rejestrują tożsamość kompilatora, dostawcy, zależności, pliku binarnego i obrazu."
r1712_fips_backend_evidence_boundary = "Są to powtarzalne dowody wewnętrzne, a nie walidacja FIPS na poziomie produktu. Trzymaj kontenery próbne oddzielnie od normalnych obrazów wersji i przejrzyj dowody dotyczące dokładnie wdrażanej kompilacji."
r1712_read_fips_evidence_guide = "Przeczytaj przewodnik dotyczący dowodów FIPS"
r1712_loader_admission = "Kontrola ładowania modułów"
r1712_loader_admission_description = "Publiczne manifesty wtyczek muszą zawierać stały skrót SHA-256. W całym procesie jednocześnie kompilowane są najwyżej dwa moduły. Skompilowane dane mają domyślny limit 32 MiB i nie mogą przekroczyć 256 MiB."
r1712_file_identity = "Tożsamość pliku"
r1712_file_identity_description = "Fluxheim otwiera zatwierdzone pliki wtyczek bez podążania za łączami, zachowuje sprawdzony uchwyt zwykłego pliku i odczytuje bajty modułu z tego uchwytu bez ponownego otwierania ścieżki."
