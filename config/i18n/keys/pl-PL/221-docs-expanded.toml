version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Wersja 1.6.37 to finalne czyszczenie granic crate przed Wasm: ACME, observability, cache, load-balancer, PHP-FPM i wnętrza native runtime przechodzą do mniejszych modułów należących do crate, przy stabilnym zachowaniu runtime."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Wersja 1.6.37 zwiększa niezawodność lokalnego observability smoke, ponawiając tymczasowe starty Prometheusa i Jaegera z nowo przydzielonymi portami, gdy porty host-network rywalizują z innymi procesami runner."

