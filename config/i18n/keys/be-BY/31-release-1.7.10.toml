adds_conservative_browser_isolation_and_resource_policy_defaults_suitable_for_most_sites = "Дадае асцярожную ізаляцыю браўзера і налады па змаўчанні палітыкі рэсурсаў, прыдатныя для большасці сайтаў."
enables_strict_cross_origin_isolation_for_applications_that_have_tested_every_external_dependency = "Уключае строгую ізаляцыю паміж крыніцамі для прыкладанняў, якія пратэставалі ўсе знешнія залежнасці."
