fluxheim_answers_valid_preflight_requests_locally_rejected_preflights_return_403_without_reaching_the_application = "Fluxheim адказвае на сапраўдныя перадпалётныя запыты на мясцовым узроўні; адхіленыя перадпалётныя праверкі вяртаюць <code>403</code> без дасягнення прыкладання."
