stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Стабілізуе выканальныя прыклады міграцыі Wasm і тэставанне выпуску; дадае дадатковыя профілі бяспекі адказаў HTTP, правераны CORS з улікам запытаў, інструкцыі па абмежаваным паўторным спробам, больш строгую перанакіраванне і ачыстку загалоўкаў ідэнтыфікатараў, а таксама больш бяспечны разбор і перапісванне загалоўкаў."
