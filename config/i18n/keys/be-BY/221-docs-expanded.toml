fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 пакідае Wasm дадатковым і дадае першую абмежаваную native HTTP/1 сям’ю hooks для request-header і response-header. Плагіны могуць рабіць зацверджаныя сінтэтычныя змены policy, але ўсё яшчэ не атрымліваюць сырыя headers, bodies, доступ да файлавай сістэмы, сеткі, прыватных ключоў або admin API."
