version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Версія 1.6.37 — фінальная ачыстка межаў crate перад Wasm: ACME, observability, cache, load-balancer, PHP-FPM і ўнутраныя часткі native runtime пераносяцца ў меншыя модулі, якімі валодаюць crate, пры стабільных паводзінах runtime."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Версія 1.6.37 робіць лакальны observability smoke надзейнейшым, паўтараючы часовы запуск Prometheus і Jaeger з нова прызначанымі партамі, калі host-network парты канкуруюць з іншымі runner-працэсамі."

