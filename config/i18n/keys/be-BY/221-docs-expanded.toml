version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Абнаўляе структуру 1.6.36: чыстка native proxy, API ва ўласных crate, выдаленне спадчыны Pingora, дэтэрмінаваныя observability-вобразы і рэгрэсійныя тэсты HTTP/1 chunked."
