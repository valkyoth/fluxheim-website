r1712_released_july_15_2026 = "Вызвалены 15 ліпеня 2026 г"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Дадае метаданыя кэша, проксі-сервера і дайджэста адказаў на аснове выбару"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Пацвярджае сапраўднасць перазагрузкі жывых здымкаў, адкату, праверкі цэласнасці і захавання перазапуску"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Дадае ўзнаўляльныя доказы FIPS-backend і шырокае ўласнае ўмацаванне падчас выканання"
r1712_whats_next_summary = "дадае метададзеныя стандартаў выбару, аўтэнтыфікаваны доказ адкату здымка, узнаўляльныя доказы FIPS-backend і больш моцны кэш, TLS, Wasm, буферызацыю і межы патокаў."
r1712_release_series_digest = "Серыя выпускаў Fluxheim 1.7: кэш, проксі і метаданыя дайджэсту адказаў, заснаваныя на выбары; перазагрузка і адкат аўтэнтыфікаванага жывога здымка; узнаўляльныя доказы FIPS-backend; мадэрнізацыя працэсаў без прастояў; незалежна пратэставаныя прыклады палітыкі Wasm; і мацнейшы кэш, TLS, буферызацыя, паток і межы пратаколу."
r1712_standards_based_response_metadata = "Метададзеныя адказу на аснове стандартаў"
r1712_response_metadata_intro = "Метададзеныя адказу адключаны па змаўчанні. Уключыце толькі тыя палі, якія вам патрэбныя; Fluxheim атрымлівае іх з фактычнага выніку кэша, збою проксі і канчатковых байтаў адказу без раскрыцця ключоў кэша, бэкэнд-адрасоў, імёнаў DNS або неапрацаваных памылак."
r1712_field = "Палявы"
r1712_what_it_reports = "Пра што паведамляе"
r1712_cache_status_description = "Вынікі кэшавання RFC 9211, такія як трапленне, промах, састарэлая пераадрасацыя, паўторная праверка, заканчэнне тэрміну дзеяння і абыход."
r1712_proxy_status_description = "RFC 9209 дэталі з нізкай магутнасцю для збояў, створаных Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 над канчатковым зместам паведамлення HTTP пасля сціску."
r1712_repr_digest_description = "SHA-256 толькі тады, калі Fluxheim змяшчае поўнае выбранае прадстаўленне."
r1712_live_snapshots_and_rollback = "Жывыя здымкі і адкат"
r1712_live_snapshot_intro = "Аўтэнтыфікаваныя здымкі могуць апублікаваць пацверджанага кандыдата, замяніць актыўны маршрутызатар і зрабіць адкат без перазапуску звычайных разгортванняў толькі з маршрутызацыяй. Кожны запыт застаецца на адным пакаленні маршрутызатара ад пачатку да канца."
r1712_snapshot_private_directory = "Захоўвайце сховішча здымкаў у спецыяльным прыватным каталогу; існуючыя непрыватныя каталогі і карані файлавай сістэмы адхіляюцца."
r1712_snapshot_process_upgrade = "Выкарыстоўвайце абнаўленне працэсу, калі фонавая служба балансіроўкі нагрузкі спраўнасці або выяўлення актыўныя."
r1712_snapshot_integrity_restart = "Запусціце праверку цэласнасці здымка пасля публікацыі або адкату і пераканайцеся, што абранае пакаленне вытрымае перазапуск."
r1712_read_snapshot_contract = "Прачытайце поўны кантракт на здымак"
r1712_authorization_cache_bypass = "Запыты, якія нясуць <code>Authorization</code> або <code>Proxy-Authorization</code>, заўсёды абыходзяць пошук і захоўванне ў агульным кэшы."
r1712_strict_cache_control = "Няправільны або супярэчлівы адказ Дырэктывы <code>Cache-Control</code> адхіляюцца замест вяртання да сканфігураваных TTL; <code>s-maxage</code> мае прыярытэт над <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> і <code>s-maxage</code> забараняюць паўторнае выкарыстанне састарэлых пасля заканчэння тэрміну прыдатнасці."
r1712_encrypted_cache_upgrade_note = "Заўвага аб абнаўленні зашыфраванага кэша"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 перамяшчае зашыфраваныя аб'екты кэша дыска ў каранёвыя даныя і індэксныя ключы з трывалым неразрадным станам. Першы запуск на старым зашыфраваным корані і кожная ратацыя лакальнага ключа наўмысна халодна ачышчае кэш перад абслугоўваннем трафіку."
r1712_encrypted_cache_disposable = "Ставіцеся да зашыфраванага кэша як да аднаразовага паскарэння, а не як да крыніцы запісу."
r1712_encrypted_cache_private_storage = "Дайце кожнаму караню кэша пастаяннае прыватнае сховішча і не капіруйце стан nonce паміж незалежнымі каранямі."
r1712_encrypted_cache_warmup = "Заплануйце першапачатковую ёмістасць для першага разагрэву пасля абнаўлення або павароту ключоў."
r1712_client_certificate_revocation = "Адкліканне сертыфіката кліента"
r1712_client_certificate_revocation_intro = "Калі ўзаемны TLS павінен адхіліць адкліканыя кліенцкія сертыфікаты, забяспечце абмежаваны пакет PEM CRL. Fluxheim правярае поўную ланцужок эмітэнта і адхіляе палітыку CRL, тэрмін дзеяння якой скончыўся, або няпоўную."
r1712_client_certificate_revocation_compliance = "Неабходная аўтэнтыфікацыя кліента ў патрабаваным рэжыме адпаведнасці FIPS або ISO таксама патрабуе пакета CRL. Звычайная аўтэнтыфікацыя кліента захоўвае адкліканне як відавочнае ўключэнне."
r1712_fips_backend_evidence = "Бэкэнд-сведчанне FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim забяспечвае асобна замацаваныя асяроддзя доказу CI для профіляў OpenSSL-FIPS і rustls/AWS-LC-FIPS. Яны ствараюць і запускаюць дакладны двайковы файл профілю, выконваюць унізе і правераныя сертыфікатамі ўверх TLS, адхіляюць несумяшчальную палітыку і запісваюць ідэнтыфікатары кампілятара, пастаўшчыка, залежнасці, двайковы файл і малюнак."
r1712_fips_backend_evidence_boundary = "Гэта ўзнаўляемы бэкэнд-сведчанне, а не праверка FIPS на ўзроўні прадукту. Захоўвайце кантэйнеры доказаў асобна ад звычайных вобразаў выпуску і праглядайце доказы той зборкі, якую вы разгортваеце."
r1712_read_fips_evidence_guide = "Прачытайце кіраўніцтва па доказах FIPS"
r1712_loader_admission = "Кантроль загрузкі модуляў"
r1712_loader_admission_description = "Публічныя маніфесты плагінаў павінны змяшчаць фіксаваны дайджэст SHA-256. Ва ўсім працэсе адначасова кампілююцца не больш за два модулі. Памер выніку кампіляцыі па змаўчанні абмежаваны 32 MiB і не можа перавышаць 256 MiB."
r1712_file_identity = "Ідэнтыфікацыя файла"
r1712_file_identity_description = "Fluxheim адкрывае зацверджаныя файлы плагінаў без пераходу па спасылках, захоўвае правераны дэскрыптар звычайнага файла і счытвае байты модуля з гэтага дэскрыптара без паўторнага адкрыцця шляху."
