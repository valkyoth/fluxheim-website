r1712_released_july_15_2026 = "Maħruġ fil-15 ta' Lulju 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Iżżid metadata ta' cache, prokura u respons-digest ibbażati fuq standards opt-in"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Jipprova tagħbija mill-ġdid ta' snapshot live awtentikata, rollback, kontrolli tal-integrità, u persistenza tal-bidu mill-ġdid"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Iżżid evidenza riproduċibbli FIPS-backend u ebusija ta' runtime nattiva wiesgħa"
r1712_whats_next_summary = "iżid metadata ta 'standards opt-in, prova ta' rollback ta 'snapshot awtentikata, evidenza riproduċibbli FIPS-backend, u cache aktar b'saħħitha, TLS, Wasm, buffering, u konfini tan-nixxiegħa."
r1712_release_series_digest = "Serje ta' rilaxx Fluxheim 1.7: metadata ta' cache, prokura u respons-digest ibbażati fuq standards opt-in; reload u rollback awtentikati ta' snapshot live; evidenza riproduċibbli FIPS-backend; aġġornamenti tal-proċess mingħajr waqfien; Eżempji ta 'politika Wasm ittestjati b'mod indipendenti; u cache aktar b'saħħitha, TLS, buffering, stream, u konfini tal-protokoll."
r1712_standards_based_response_metadata = "Metadata tar-rispons ibbażata fuq standards"
r1712_response_metadata_intro = "Il-metadejta tar-rispons hija diżattivata b'mod awtomatiku. Ippermetti biss l-oqsma li għandek bżonn; Fluxheim joħroġhom mir-riżultat attwali tal-cache, falliment tal-prokura, u bytes tar-rispons finali mingħajr ma jesponi ċwievet tal-cache, indirizzi backend, ismijiet DNS, jew żbalji mhux ipproċessati."
r1712_field = "Qasam"
r1712_what_it_reports = "Dak li tirrapporta"
r1712_cache_status_description = "RFC 9211 eżiti tal-cache bħal hit, miss, twassil obsolet, validazzjoni mill-ġdid, skadenza, u bypass."
r1712_proxy_status_description = "RFC 9209 dettalji ta 'kardinalità baxxa għal fallimenti ġġenerati minn Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 fuq il-kontenut finali tal-messaġġ HTTP wara kompressjoni."
r1712_repr_digest_description = "SHA-256 biss meta Fluxheim iżomm ir-rappreżentazzjoni magħżula sħiħa."
r1712_live_snapshots_and_rollback = "Snapshots ħajjin u rollback"
r1712_live_snapshot_intro = "Snapshots awtentikati jistgħu jippubblikaw kandidat validat, jissostitwixxu r-router live, u jreġġgħu lura mingħajr ma jerġgħu jibdew skjeramenti normali ta' routing biss. Kull talba tibqa' fuq ġenerazzjoni waħda ta' router mill-bidu sat-tmiem."
r1712_snapshot_private_directory = "Żomm il-maħżen tal-istampa f'direttorju privat iddedikat; direttorji eżistenti mhux privati u għeruq tas-sistema tal-fajls huma miċħuda."
r1712_snapshot_process_upgrade = "Uża aġġornament tal-proċess meta s-servizzi tas-saħħa jew ta' l-iskoperta ta' load-balancer fl-isfond ikunu attivi."
r1712_snapshot_integrity_restart = "Mexxi kontrolli ta 'integrità ta' snapshot wara l-pubblikazzjoni jew it-tkeċċija u vverifika li l-ġenerazzjoni magħżula tibqa 'ħajja mill-ġdid."
r1712_read_snapshot_contract = "Aqra l-kuntratt snapshot sħiħ"
r1712_authorization_cache_bypass = "Talbiet li jġorru <code>Authorization</code> jew <code>Proxy-Authorization</code> dejjem jaqbdu t-tiftix u l-ħażna tal-cache maqsuma."
r1712_strict_cache_control = "Reazzjoni ħażina jew konfliġġenti Id-direttivi <code>Cache-Control</code> huma miċħuda minflok ma jaqgħu lura għal TTLs konfigurati; <code>s-maxage</code> jieħu prijorità fuq <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code>, u <code>s-maxage</code> jipprojbixxu l-użu mill-ġdid frisk wara li tiskadi l-freskezza."
r1712_encrypted_cache_upgrade_note = "Nota ta' aġġornament tal-cache encrypted"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 iċċaqlaq oġġetti tal-cache tad-disk encrypted għal dejta marbuta mal-għeruq u ċwievet indiċi bi stat nonce durabbli. L-ewwel startup kontra għerq kriptat antik, u kull rotazzjoni taċ-ċavetta lokali, intenzjonalment tnaddaf dik il-cache qabel ma sservi t-traffiku."
r1712_encrypted_cache_disposable = "Ittratta l-cache encrypted bħala aċċelerazzjoni li tintrema, mhux is-sors tar-rekord."
r1712_encrypted_cache_private_storage = "Agħti kull għerq tal-cache ħażna privata persistenti u tikkopja l-istat nonce bejn għeruq indipendenti."
r1712_encrypted_cache_warmup = "Ippjana l-kapaċità tal-oriġini għall-ewwel tisħin wara li ttejjeb jew iddawwar iċ-ċwievet."
r1712_client_certificate_revocation = "Revoka taċ-ċertifikat tal-klijent"
r1712_client_certificate_revocation_intro = "Meta TLS reċiproka trid tirrifjuta ċertifikati tal-klijenti revokati, ipprovdi bundle PEM CRL ilimitat. Fluxheim jivvalida l-katina sħiħa tal-emittent u jirrifjuta l-politika CRL skaduta jew mhux kompluta."
r1712_client_certificate_revocation_compliance = "L-awtentikazzjoni tal-klijent meħtieġa f'mod ta' konformità FIPS jew ISO teħtieġ ukoll pakkett CRL. L-awtentikazzjoni ordinarja tal-klijent iżżomm ir-revoka bħala opt-in espliċita."
r1712_fips_backend_evidence = "FIPS evidenza backend"
r1712_fips_backend_evidence_intro = "Fluxheim jipprovdi ambjenti ta 'prova CI ippinnjati separatament għall-profili OpenSSL-FIPS u rustls/AWS-LC-FIPS. Jibnu u jmexxu l-profil eżatt binarju, jeżerċitaw downstream u verifikati biċ-ċertifikat upstream TLS, jirrifjutaw politika inkompatibbli, u jirreġistraw identitajiet tal-kompilatur, tal-fornitur, tad-dipendenza, tal-binarju u tal-immaġni."
r1712_fips_backend_evidence_boundary = "Din hija evidenza backend riproduċibbli, mhux validazzjoni FIPS fil-livell tal-prodott. Żomm il-kontenituri tal-prova separati mill-immaġini tar-rilaxx normali u irrevedi l-evidenza għall-bini eżatt li tuża."
r1712_read_fips_evidence_guide = "Aqra l-gwida tal-evidenza FIPS"
r1712_loader_admission = "Kontrolli tat-tagħbija tal-moduli"
r1712_loader_admission_description = "Il-manifesti pubbliċi tal-plugins irid ikollhom digest SHA-256 fiss. Fil-proċess kollu jiġu kkumpilati mhux aktar minn żewġ moduli fl-istess ħin. L-output ikkumpilat għandu limitu predefinit ta' 32 MiB u ma jistax jaqbeż 256 MiB."
r1712_file_identity = "Identità tal-fajl"
r1712_file_identity_description = "Fluxheim jiftaħ fajls plugin approvati mingħajr ma jsegwu links, iżomm il-manku tal-fajl regolari validat, u jaqra bytes tal-modulu minn dak il-manku mingħajr ma jerġa' jiftaħ il-mogħdija."
