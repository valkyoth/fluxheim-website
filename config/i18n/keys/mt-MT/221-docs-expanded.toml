fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Malti: Fluxheim 1.7.5 keeps Wasm optional and extends bounded native HTTP/1 cache-policy hooks alongside access-decision, header, and route-decision hooks. Malti: plugins can continue normal cache behavior, pass through origin, bypass cache, skip storage, deny, select fixed mobile/desktop cache-key variants, and attach fixed cache-store TTL, tag, and stored-header metadata, Malti: but cannot emit arbitrary cache-key bytes, arbitrary TTLs, arbitrary tags, raw response headers, bodies, filesystem access, network access, private keys, or admin APIs."
