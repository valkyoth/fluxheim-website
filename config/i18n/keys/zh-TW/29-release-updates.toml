webassembly_extensibility_and_hardening_line_optional_fluxheim_wasm_disabled_by_default_wasm_feature_gates_strict_approved_root_plugin_loading_typed_manifest_validation_bounded_wasmtime_execution_live_native_http_1_access_header_route_cache_hooks_symbolic_mobile_desktop_cache_key_variants_fixed_cache_store_ttl_tag_header_metadata_explicit_compiled_module_identities_per_vhost_cache_hook_admission_budgets_bounded_hook_metrics_and_admin_budget_visibility = "WebAssembly 擴充與強化線：fluxheim-wasm 為選用功能，Wasm feature gate 預設關閉，plugin 僅能從核准的 root 嚴格載入，manifest 會做型別化驗證。受限 Wasmtime 執行、live native HTTP/1 access/header/route/cache hook、symbolic mobile/desktop cache-key variant、固定 cache-store TTL/tag/header metadata、明確 compiled-module identity、每個 vhost 的 cache-hook admission budget、受限 hook metrics 與 admin budget visibility 都納入此線。"
