fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 繼續將 Wasm 保持為選用功能，並在 access-decision、header 與 route-decision hook 旁新增受限的 native HTTP/1 cache-policy hook。外掛可以延續正常 cache 行為、傳遞到 origin、繞過 cache、跳過儲存或拒絕，但不能修改原始 cache key、TTL、tag、response header、已儲存 metadata，也不能接收原始 header、body、檔案系統存取、網路存取、私鑰或 admin API。"
