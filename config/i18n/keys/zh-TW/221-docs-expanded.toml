cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hook 可以加入固定的 mobile/desktop cache-key variant。<code>cache-store</code> hook 可以設定固定 TTL、tag 與 stored-header metadata。"
module_identity = "模組身分"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "process-wide、cache-global、cache-vhost、per-plugin 與 per-attachment 執行上限會防止 plugin work 無限制增加。"
fluxheim_1_7_8_keeps_wasm_optional_and_adds_wasi_preview_1_for_access_decision_plugins_clock_and_randomness_need_separate_grants_filesystem_network_process_and_other_host_access_stay_unavailable_unsupported_imports_fail_closed = "Fluxheim 1.7.8 保持 Wasm 的可選性，並新增 WASI Preview 1 以支援存取決策外掛程式。時鐘與隨機數需單獨授予權限；檔案系統、網路、行程及其他主機存取仍不可用。不支援的匯入會以 fail-closed 方式拒絕。"
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "編譯後的 module 會綁定 plugin digest、ABI version、hook feature surface、host-call namespace 與 Fluxheim version，因此日後重用時無法跨越 release、feature 或 ABI 邊界。"
proxy_wasm_preview = "Proxy-Wasm 預覽"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "使用 <code>wasm-proxy-abi</code> 進行 build，啟用 <code>allow_preview_abi</code>，並同時宣告 <code>proxy-wasm-preview</code> ABI 與 host-call namespace。不支援的 import 與 call 將以 fail-closed 方式處理。"
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "對於 multi-tenant 部署，請啟用 <code>[server.host_routing].strict = true</code>。缺少或無效的 host identity 會回傳 <code>400</code>，未知 host 則回傳 <code>421</code>，而不會進入 default site。"
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "config file 及其每一層既有的父 directory 都應由可信任的主體擁有，且不得開放 group 或其他 user 寫入。"
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "TLS、listener、stream、UDP、ACME、cache purge、tracing 或 managed PHP-FPM process 設定變更時，請替換 process；一般 routing 與 request-time policy 可以使用 snapshot reload。"
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "使用容量符合 cache policy 的持久 writable volume。每個 storage-bin replica 應配置自己的 local 或 RWO volume；只有在跨 node locking 已驗證，且 orchestration 層強制 single-writer 時，才使用共享 RWX storage。"
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "每個執行中的 Fluxheim process 使用一個獨立的 storage-bin root；所有權依賴 advisory filesystem lock，因此沒有經過驗證的外部 locking 時，共享 multi-writer root 並不安全。"
wasi_preview_1 = "WASI 預覽版 1"
build_with_wasm_wasi_enable_allow_preview_abi_declare_the_wasi_preview_abi_and_host_call_namespace_and_grant_only_the_required_clock_or_randomness_capability_the_preview_is_limited_to_access_decisions = "使用 <code>wasm-wasi</code> 編譯，啟用 <code>allow_preview_abi</code>，宣告 <code>wasi-preview</code> ABI 與 host-call 命名空間，僅授予所需的時鐘或隨機數能力。此預覽版本僅限於存取決策使用。"
