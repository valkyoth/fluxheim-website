r1712_released_july_15_2026 = "發布日期：2026 年 7 月 15 日"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "新增可選啟用且符合標準的快取、代理與回應摘要中繼資料"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "驗證經身分認證的線上快照重新載入與回復、完整性檢查，以及重新啟動後的持久性"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "新增可重現的 FIPS 後端證據，並全面強化原生執行環境"
r1712_whats_next_summary = "新增可選啟用的標準中繼資料、經驗證的認證快照回復、可重現的 FIPS 後端證據，並強化快取、TLS、Wasm、緩衝與資料流邊界。"
r1712_release_series_digest = "Fluxheim 1.7 系列：可選啟用且符合標準的快取、代理與回應摘要中繼資料；經身分認證的線上快照重新載入與回復；可重現的 FIPS 後端證據；零停機程序升級；獨立測試的 Wasm 政策範例；以及更嚴格的快取、TLS、緩衝、資料流與通訊協定邊界。"
r1712_standards_based_response_metadata = "基於標準的響應元數據"
r1712_response_metadata_intro = "預設情況下會停用響應元資料。僅啟用您需要的欄位； Fluxheim 從實際快取結果、代理失敗和最終回應位元組中派生它們，而不會暴露快取金鑰、後端位址、DNS 名稱或原始錯誤。"
r1712_field = "欄位"
r1712_what_it_reports = "報告內容"
r1712_cache_status_description = "RFC 9211 快取結果，例如命中、未命中、過時轉送、重新驗證、過期和旁路。"
r1712_proxy_status_description = "RFC 9209 Fluxheim 產生的故障的低基數詳細資料。"
r1712_content_digest_description = "RFC 9530 SHA-256 壓縮後最終的HTTP 訊息內容。"
r1712_repr_digest_description = "SHA-256 僅當 Fluxheim 持有完整的選定表示時。"
r1712_live_snapshots_and_rollback = "即時快照和回滾"
r1712_live_snapshot_intro = "經身分認證的快照可以發布已驗證的候選設定、取代目前的路由器並執行回復，而不必重新啟動一般的純路由部署。每個請求從開始到結束都使用同一代路由器。"
r1712_snapshot_private_directory = "將快照儲存保存在專用的私有目錄中；現有的非私有目錄和檔案系統根被拒絕。"
r1712_snapshot_process_upgrade = "當後台負載平衡器運作狀況或發現服務處於活動狀態時，使用進程升級。"
r1712_snapshot_integrity_restart = "發布或回復後執行快照完整性檢查，並確認所選版本在重新啟動後仍然有效。"
r1712_read_snapshot_contract = "閱讀完整的快照運作規範"
r1712_authorization_cache_bypass = "攜帶 <code>Authorization</code> 或 <code>Proxy-Authorization</code> 的請求始終繞過共享快取查找和儲存。"
r1712_strict_cache_control = "格式錯誤或衝突的回應 <code>Cache-Control</code> 指令將被拒絕，而不是回退到配置的 TTL；<code>s-maxage</code> 優先於 <code>max-age</code>。"
r1712_mandatory_revalidation = "<code>must-revalidate</code>、<code>proxy-revalidate</code>、<code>s-maxage</code> 禁止保鮮期滿後重複使用。"
r1712_encrypted_cache_upgrade_note = "加密快取升級說明"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 對加密磁碟快取物件使用綁定快取根目錄的資料金鑰與索引金鑰，並持久保存 nonce 狀態。首次以舊版加密快取根目錄啟動或輪替本機金鑰時，會在接收流量前主動清空該快取。"
r1712_encrypted_cache_disposable = "將加密快取視為可丟棄的加速資料，而不是權威資料來源。"
r1712_encrypted_cache_private_storage = "為每個快取根提供持久性私有存儲，並且不在獨立根之間複製隨機數狀態。"
r1712_encrypted_cache_warmup = "為升級或輪換金鑰後的首次快取預熱預留足夠的來源站容量。"
r1712_client_certificate_revocation = "用戶端憑證吊銷"
r1712_client_certificate_revocation_intro = "如果雙向 TLS 必須拒絕已撤銷的用戶端憑證，請提供大小受限的 PEM CRL 套件。Fluxheim 會驗證完整的簽發者鏈，並拒絕已過期或不完整的 CRL 政策。"
r1712_client_certificate_revocation_compliance = "在要求 FIPS 或 ISO 合規的模式下，強制用戶端驗證還必須設定 CRL 套件。一般用戶端驗證則需明確啟用撤銷檢查。"
r1712_fips_backend_evidence = "FIPS 後端驗證證據"
r1712_fips_backend_evidence_intro = "Fluxheim 為 OpenSSL-FIPS 與 rustls/AWS-LC-FIPS 設定分別提供依賴項固定的 CI 驗證環境。環境會建置並執行對應設定的二進位檔，測試下游 TLS 與經憑證驗證的上游 TLS，拒絕不相容政策，並記錄編譯器、加密提供者、依賴項、二進位檔與映像的識別資訊。"
r1712_fips_backend_evidence_boundary = "這是可重現的後端驗證證據，並不代表產品整體取得 FIPS 認證。請將驗證容器與一般發行映像分開，並確認證據與實際部署的建置完全一致。"
r1712_read_fips_evidence_guide = "閱讀 FIPS 證據指南"
r1712_loader_admission = "模組載入控制"
r1712_loader_admission_description = "公開資訊清單必須固定 SHA-256 摘要。整個程序最多同時執行兩個編譯工作；編譯產物預設上限為 32 MiB，絕對上限為 256 MiB。"
r1712_file_identity = "外掛程式檔案身分"
r1712_file_identity_description = "Fluxheim 在不跟隨連結的情況下開啟獲准的外掛程式檔案，保留已驗證的一般檔案控制代碼，並直接從該控制代碼讀取模組位元組，不會重新開啟路徑。"
