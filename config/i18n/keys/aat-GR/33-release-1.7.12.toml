r1712_released_july_15_2026 = "U botua më 15 korrik 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Shton metadata me zgjedhje për cache-in, proxy-n edhe digest-in e përgjigjes, sipas standardeve"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Provon ringarkimin e snapshot-it të autentikuar, kthimin prapa, kontrollet e integritetit edhe ruajtjen pas rinisjes"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Shton prova të riprodhueshme për backend-in FIPS edhe forcim të gjerë të runtime-it vendas"
r1712_whats_next_summary = "shton metadata standarde me zgjedhje, prova për kthimin prapa të snapshot-it të autentikuar, prova të riprodhueshme për backend-in FIPS edhe kufij më të fortë për cache-in, TLS, Wasm, buffering-un edhe stream-et."
r1712_release_series_digest = "Seria Fluxheim 1.7: metadata me zgjedhje sipas standardeve për cache, proxy edhe digest të përgjigjes; ringarkim edhe kthim prapa të snapshot-it të autentikuar; prova të riprodhueshme për backend-in FIPS; ndërrime procesi pa ndërprerje; shembuj politike Wasm të provuar veçmas; edhe kufij më të fortë për cache, TLS, buffering, stream edhe protokoll."
r1712_standards_based_response_metadata = "Metadata përgjigjeje sipas standardeve"
r1712_response_metadata_intro = "Metadata e përgjigjes është e fikur si parazgjedhje. Ndez vetëm fushat çë të duhen; Fluxheim i nxjerr nga rezultati i vërtetë i cache-it, dështimi i proxy-t edhe bajtet përfundimtare të përgjigjes, pa zbuluar çelësa cache-i, adresa backend-i, emra DNS ose gabime të papërpunuara."
r1712_field = "Fusha"
r1712_what_it_reports = "Çë raporton"
r1712_cache_status_description = "Rezultate cache-i RFC 9211 si hit, miss, dërgim i vjetruar, rivalidim, skadim edhe bypass."
r1712_proxy_status_description = "Hollësi me kardinalitet të ulët sipas RFC 9209 për dështimet çë krijon Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 mbi përmbajtjen përfundimtare të mesazhit HTTP pas kompresimit."
r1712_repr_digest_description = "SHA-256 vetëm kur Fluxheim mban përfaqësimin e plotë të zgjedhur."
r1712_live_snapshots_and_rollback = "Snapshot-e të drejtpërdrejta edhe kthim prapa"
r1712_live_snapshot_intro = "Snapshot-et e autentikuara mund të botojnë një kandidat të validuar, të ndërrojnë router-in aktiv edhe të kthehen prapa pa rinisur vendosjet normale vetëm për routing. Çdo kërkesë rri në një brez të vetëm router-i nga fillimi gjer në fund."
r1712_snapshot_private_directory = "Mbaje magazinën e snapshot-eve në një direktori private të veçantë; direktoritë ekzistuese jo private edhe rrënjët e filesystem-it refuzohen."
r1712_snapshot_process_upgrade = "Përdor ndërrim procesi kur shërbimet e shëndetit ose zbulimit të load balancer-it në prapaskenë janë aktive."
r1712_snapshot_integrity_restart = "Bëj kontrolle integriteti pas botimit ose kthimit prapa edhe provo se brezi i zgjedhur mbetet pas rinisjes."
r1712_read_snapshot_contract = "Lexo tërë rregullat e snapshot-it"
r1712_authorization_cache_bypass = "Kërkesat me <code>Authorization</code> ose <code>Proxy-Authorization</code> e anashkalojnë gjithmonë kërkimin edhe ruajtjen në cache-in e përbashkët."
r1712_strict_cache_control = "Direktivat e përgjigjes <code>Cache-Control</code> çë janë të gabuara ose në kundërshtim refuzohen, pa rënë te TTL-të e konfiguruara; <code>s-maxage</code> ka përparësi mbi <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> edhe <code>s-maxage</code> ndalojnë përdorimin e të dhënave të vjetruara pasi mbaron freskia."
r1712_encrypted_cache_upgrade_note = "Shënim për ndërrimin e cache-it të kriptuar"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 i kalon objektet e cache-it të kriptuar në disk te çelësa të të dhënave edhe indeksit të lidhur me rrënjën, me gjendje nonce të qëndrueshme. Nisja e parë mbi një rrënjë të vjetër të kriptuar edhe çdo rrotullim i çelësit vendor e pastron me qëllim cache-in para se të shërbejë trafik."
r1712_encrypted_cache_disposable = "Trajtoje cache-in e kriptuar si përshpejtim çë mund të hidhet, jo si burim të dhënash zyrtare."
r1712_encrypted_cache_private_storage = "Jepi çdo rrënje cache-i ruajtje private të qëndrueshme edhe mos kopjo gjendjen nonce ndërmjet rrënjëve të pavarura."
r1712_encrypted_cache_warmup = "Planifiko kapacitetin e origin-it për ngrohjen e parë pas ndërrimit ose rrotullimit të çelësave."
r1712_client_certificate_revocation = "Shfuqizimi i certifikatës së klientit"
r1712_client_certificate_revocation_intro = "Kur TLS i ndërsjellë duhet të refuzojë certifikata klienti të shfuqizuara, jep një bundle PEM CRL me kufi. Fluxheim validon tërë zinxhirin e lëshuesit edhe refuzon politika CRL të skaduara ose të paplota."
r1712_client_certificate_revocation_compliance = "Autentikimi i detyrueshëm i klientit në mënyrë pajtueshmërie FIPS ose ISO kërkon edhe një bundle CRL. Autentikimi i zakonshëm i klientit e mban shfuqizimin si zgjedhje të qartë."
r1712_fips_backend_evidence = "Prova për backend-in FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim jep mjedise prove CI të fiksuara veçmas për profilet OpenSSL-FIPS edhe rustls/AWS-LC-FIPS. Ato ndërtojnë edhe ekzekutojnë binarin e saktë të profilit, provojnë TLS poshtë edhe TLS lart me certifikatë të verifikuar, refuzojnë politika të papajtueshme edhe regjistrojnë identitetet e compiler-it, provider-it, varësive, binarit edhe imazhit."
r1712_fips_backend_evidence_boundary = "Kjo është provë backend-i e riprodhueshme, jo validim FIPS i produktit. Mbaji kontejnerët e provës ndarë nga imazhet normale të release-it edhe kontrollo provat për build-in e saktë çë vendos."
r1712_read_fips_evidence_guide = "Lexo udhëzuesin e provave FIPS"
r1712_loader_admission = "Kontrollet e ngarkimit të moduleve"
r1712_loader_admission_description = "Manifestet publike të plugin-eve duan një digest SHA-256 të fiksuar. Në tërë procesin kompilohen njëherësh jo më shumë se dy module. Dalja e kompiluar ka kufi të parazgjedhur 32 MiB edhe nuk mund të kalojë 256 MiB."
r1712_file_identity = "Identiteti i file-it të plugin-it"
r1712_file_identity_description = "Fluxheim i hap file-t plugin të miratuar pa ndjekur link-e, e mban handle-in e validuar të file-it të rregullt edhe i lexon bajtet e modulit nga ai handle pa e hapur prapë shtegun."
