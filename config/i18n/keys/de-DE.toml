focused_builds_can_enable_it_directly = ". Fokussierte Builds koennen es direkt aktivieren:"
privacy_mode_and_geoip_are_mutually_exclusive_privacy = "<code>privacy-mode</code> und <code>geoip</code> schliessen sich gegenseitig aus. Privacy-Builds lehnen GeoIP-Lookups und Geo-Context-Metadaten vollstaendig ab."
are_mutually_exclusive_privacy_builds_reject_geoip_lookup = "schliessen sich gegenseitig aus. Privacy-Builds lehnen GeoIP-Lookups und Geo-Context-Metadaten vollstaendig ab."
local_databases = "Lokale Datenbanken"
fluxheim_reads_local_mmdb_files_through_a_provider = "Fluxheim liest lokale MMDB-Dateien ueber eine provider-agnostische Schicht. Die ersten Provider sind Labels fuer kompatible MMDB-Datasets:"
maxmind_geoip2_or_geolite2_mmdb_files = ": MaxMind-GeoIP2- oder GeoLite2-MMDB-Dateien."
european_circl_geo_open_mmdb_compatible_datasets = ": europaeische CIRCL-Geo-Open-MMDB-kompatible Datasets."
fluxheim_does_not_download_or_update_databases_in = "Fluxheim laedt oder aktualisiert Datenbanken nicht im Prozess. Nutze einen externen systemd-Timer, Package-Job oder Sidecar, um Datenbankdateien abzurufen und zu verifizieren, und lade Fluxheim danach neu. Datenbankdateien werden als regulaere Dateien geoeffnet, und Symlink-Blattpfade werden abgelehnt."
each_mmdb_file_is_capped_at_512_mib = "Jede MMDB-Datei ist sowohl bei Metadaten als auch beim Lesen auf 512 MiB begrenzt. Eine einzelne geladene GeoIP-Runtime ist auf 1 GiB MMDB-Daten begrenzt; halte das geordnete Fallback-Set daher klein. Waehrend eines Hot Reloads koennen alte und neue Runtimes kurzzeitig parallel bestehen, waehrend laufende Requests fertig werden; dimensioniere Host-/Container-Speicher fuer diese temporaere Ueberlappung."
databases_are_evaluated_in_order_when = "Datenbanken werden der Reihe nach ausgewertet. Wenn"
when_fallback_enabled_true_fluxheim_fills_missing_country = "Wenn <code>fallback_enabled = true</code> ist, fuellt Fluxheim fehlende Land- oder ASN-Felder nach Moeglichkeit aus spaeteren Datenbanken. Wenn der Wert false ist, konsultiert Fluxheim nur die erste konfigurierte Datenbank."
when_country_or_asn_access_rules_are_configured = "Wenn Country- oder ASN-Zugriffsregeln konfiguriert sind, prueft Fluxheim die Type-Strings der geladenen MMDB-Datenbanken und gibt eine Sicherheitswarnung aus, wenn keine geladene Datenbank die erforderliche Record-Familie bereitzustellen scheint. Das ist eine Diagnoseabsicherung, kein Ersatz fuer Tests des Policy-Verhaltens mit bekannten Source-IPs."
access_policy = "Zugriffspolitik"
geo_rules_live_on_the_existing_vhost_and = "Geo-Regeln liegen auf der bestehenden vhost- und Route-Zugriffspolitik. Laendercodes sind ISO-Alpha-2-Werte in Grossbuchstaben. ASN-Werte sind numerisch und muessen groesser als null sein."
vhost_policy_runs_before_route_policy_geo_allow = "Vhost-Policy laeuft vor Route-Policy. Geo-Allow-Listen fail-closed, wenn fuer die Client-IP kein Geo-Context verfuegbar ist. Geo-Deny-Listen verweigern nur, wenn das aufgeloeste Land oder ASN passt."
when_geoip_is_compiled_and_a_lookup_succeeds = "Wenn <code>geoip</code> einkompiliert ist und ein Lookup erfolgreich ist, enthalten strukturierte Access-Logs:"
is_compiled_and_a_lookup_succeeds_structured_access = "einkompiliert ist und ein Lookup erfolgreich ist, enthalten strukturierte Access-Logs:"
geoip_metrics_and_trace_attributes_remain_bounded_follow = "GeoIP-Metriken und Trace-Attribute bleiben begrenzte Folgearbeit; fuege keine High-Cardinality-Labels aus Stadt, Breiten-/Laengengrad oder rohen Datenbankfeldern hinzu."

