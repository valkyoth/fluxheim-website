[geoip]
adds_a_bounded_optional = "fuegt ein begrenztes optionales"
feature_it_is_a_local_geo_context_foundation = "Feature hinzu. Es ist eine lokale Geo-Context-Grundlage fuer Zugriffspolitik, kein dynamischer Downloader und keine programmierbare Geo-Engine."
