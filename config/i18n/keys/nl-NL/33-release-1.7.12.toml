r1712_released_july_15_2026 = "Uitgebracht op 15 juli 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Voegt op opt-in standaarden gebaseerde cache-, proxy- en respons-digest-metagegevens toe"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Bewijst geauthenticeerde live snapshot herladen, terugdraaien, integriteitscontroles en herstartpersistentie"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Voegt reproduceerbaar FIPS-backend-bewijs en brede native runtime-verharding toe"
r1712_whats_next_summary = "voegt metagegevens van opt-in-standaarden toe, geverifieerde snapshot-rollback-proof, reproduceerbaar FIPS-backend-bewijs en sterkere cache, TLS, Wasm, buffering en streamgrenzen."
r1712_release_series_digest = "Fluxheim 1.7 releaseserie: op opt-in standaarden gebaseerde cache-, proxy- en respons-digest-metagegevens; geverifieerde live snapshot herladen en terugdraaien; reproduceerbaar FIPS-backend bewijsmateriaal; procesupgrades zonder downtime; onafhankelijk geteste Wasm beleidsvoorbeelden; en sterkere cache, TLS, buffering, stream- en protocolgrenzen."
r1712_standards_based_response_metadata = "Op standaarden gebaseerde antwoordmetadata"
r1712_response_metadata_intro = "Metagegevens van antwoorden zijn standaard uitgeschakeld. Schakel alleen de velden in die u nodig heeft; Fluxheim leidt ze af van het daadwerkelijke cacheresultaat, de proxyfout en de definitieve responsbytes zonder cachesleutels, backend-adressen, DNS-namen of onbewerkte fouten bloot te leggen."
r1712_field = "Veld"
r1712_what_it_reports = "Wat het rapporteert"
r1712_cache_status_description = "RFC 9211 cacheresultaten zoals treffer, misser, verouderde doorsturing, hervalidatie, vervaldatum en bypass."
r1712_proxy_status_description = "RFC 9209 details met lage kardinaliteit voor fouten gegenereerd door Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 over de uiteindelijke HTTP-berichtinhoud na compressie."
r1712_repr_digest_description = "SHA-256 alleen als Fluxheim de volledige geselecteerde representatie bevat."
r1712_live_snapshots_and_rollback = "Live snapshots en terugdraaien"
r1712_live_snapshot_intro = "Geauthenticeerde snapshots kunnen een gevalideerde kandidaat publiceren, de live-router vervangen en terugdraaien zonder de normale routing-only-implementaties opnieuw te starten. Elk verzoek blijft van begin tot eind op één routergeneratie staan."
r1712_snapshot_private_directory = "Bewaar de snapshotopslag in een speciale privémap; bestaande niet-privémappen en bestandssysteemroots worden afgewezen."
r1712_snapshot_process_upgrade = "Gebruik een procesupgrade wanneer de status van de load balancer op de achtergrond of detectieservices actief zijn."
r1712_snapshot_integrity_restart = "Voer snapshot-integriteitscontroles uit na publicatie of terugdraaien en controleer of de geselecteerde generatie het opnieuw opstarten overleeft."
r1712_read_snapshot_contract = "Lees het volledige snapshotcontract"
r1712_authorization_cache_bypass = "Verzoeken met <code>Authorization</code> of <code>Proxy-Authorization</code> omzeilen altijd het opzoeken en opslaan in de gedeelde cache."
r1712_strict_cache_control = "Verkeerd opgemaakte of conflicterende reactie <code>Cache-Control</code>-richtlijnen worden afgewezen in plaats van terug te vallen op geconfigureerde TTL's; <code>s-maxage</code> heeft voorrang op <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> en <code>s-maxage</code> verbieden oud hergebruik nadat de versheid is verlopen."
r1712_encrypted_cache_upgrade_note = "Opmerking over het upgraden van gecodeerde cache"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 verplaatst gecodeerde schijfcacheobjecten naar root-gebonden gegevens en indexsleutels met een duurzame nonce-status. De eerste keer dat een oudere gecodeerde root wordt opgestart en elke lokale sleutelrotatie, wordt de cache opzettelijk koud gewist voordat er verkeer wordt aangeboden."
r1712_encrypted_cache_disposable = "Behandel de gecodeerde cache als wegwerpbare versnelling, niet als de bron van het record."
r1712_encrypted_cache_private_storage = "Geef elke cacheroot permanente privéopslag en kopieer de nonce-status niet tussen onafhankelijke rooten."
r1712_encrypted_cache_warmup = "Plan de oorsprongscapaciteit voor de eerste opwarming na het upgraden of draaien van toetsen."
r1712_client_certificate_revocation = "Intrekking van clientcertificaten"
r1712_client_certificate_revocation_intro = "Wanneer wederzijdse TLS ingetrokken clientcertificaten moet afwijzen, moet u een begrensde PEM CRL-bundel opgeven. Fluxheim valideert de volledige keten van uitgevers en wijst verlopen of onvolledig CRL-beleid af."
r1712_client_certificate_revocation_compliance = "Vereiste clientauthenticatie in een FIPS of ISO-vereiste nalevingsmodus vereist ook een CRL-bundel. Bij gewone clientauthenticatie blijft intrekking een expliciete opt-in."
r1712_fips_backend_evidence = "FIPS backend-bewijs"
r1712_fips_backend_evidence_intro = "Fluxheim biedt afzonderlijk vastgezette CI-proofomgevingen voor de profielen OpenSSL-FIPS en rustls/AWS-LC-FIPS. Ze bouwen en voeren het exacte binaire profiel uit, oefenen downstream en certificaat-geverifieerde upstream TLS uit, verwerpen incompatibel beleid en registreren compiler-, provider-, afhankelijkheids-, binaire en afbeeldingsidentiteiten."
r1712_fips_backend_evidence_boundary = "Dit is reproduceerbaar backend-bewijs, geen FIPS-validatie op productniveau. Houd de proefcontainers gescheiden van de normale release-images en bekijk het bewijsmateriaal voor de exacte build die u implementeert."
r1712_read_fips_evidence_guide = "Lees de FIPS-bewijsgids"
r1712_loader_admission = "Besturing voor het laden van modules"
r1712_loader_admission_description = "Openbare pluginmanifesten moeten een vaste SHA-256-samenvatting bevatten. In het hele proces worden maximaal twee modules tegelijk gecompileerd. Gecompileerde uitvoer heeft standaard een limiet van 32 MiB en mag niet groter zijn dan 256 MiB."
r1712_file_identity = "Bestandsidentiteit"
r1712_file_identity_description = "Fluxheim opent goedgekeurde plug-inbestanden zonder links te volgen, behoudt de gevalideerde reguliere bestandsingang en leest modulebytes uit die ingang zonder het pad opnieuw te openen."
