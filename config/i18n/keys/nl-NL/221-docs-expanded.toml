fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 houdt Wasm optioneel en breidt begrensde native HTTP/1 cache-policy-hooks uit naast access-decision-, header- en route-decision-hooks. Plugins kunnen normaal cachegedrag voortzetten, naar de origin doorgeven, de cache omzeilen, opslag overslaan, weigeren, vaste mobiele/desktop cache-key-varianten kiezen en vaste cache-store-metadata voor TTL, tag en stored-header toevoegen. Ze kunnen nog steeds geen willekeurige cache-key-bytes, willekeurige TTLs, willekeurige tags, ruwe response-headers, bodies, bestandssysteemtoegang, netwerktoegang, private keys of admin-APIs krijgen."
cache_metadata = "Cachemetadata"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code>-hooks kunnen vaste mobiele/desktop cache-key-varianten toevoegen. <code>cache-store</code>-hooks kunnen vaste TTL-, tag- en stored-header-metadata zetten."
module_identity = "Module-identiteit"
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 houdt Wasm optioneel en voegt de eerste optionele compatibiliteitspreview voor de Proxy-Wasm-ABI toe. Deze maakt een afzonderlijke, door een feature afgeschermde naamruimte voor hostaanroepen met strikte manifestvalidatie en deterministische fail-closed-afhandeling van niet-ondersteunde aanroepen; er wordt niet beweerd dat willekeurige bestaande Proxy-Wasm-plug-ins ongewijzigd werken."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Gecompileerde modules zijn gekoppeld aan de digest van de plug-in, de ABI-versie, het functieoppervlak van hooks, de naamruimte voor hostaanroepen en de Fluxheim-versie, zodat toekomstig hergebruik geen release-, feature- of ABI-grenzen kan overschrijden."
proxy_wasm_preview = "Proxy-Wasm-preview"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Bouw met <code>wasm-proxy-abi</code>, schakel <code>allow_preview_abi</code> in en declareer zowel de ABI <code>proxy-wasm-preview</code> als de naamruimte voor hostaanroepen. Niet-ondersteunde imports en aanroepen falen gesloten."
