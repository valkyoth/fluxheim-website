fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 houdt Wasm optioneel en voegt de eerste begrensde native HTTP/1-hookfamilie voor request-headers en response-headers toe. Plugins kunnen goedgekeurde synthetische beleidswijzigingen uitvoeren, maar krijgen nog steeds geen ruwe headers, bodies, bestandssysteemtoegang, netwerktoegang, privésleutels of admin-API’s."
