version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Versie 1.6.37 is de finale crate-boundary-opruiming vóór Wasm: ACME, observability, cache, load-balancer, PHP-FPM en native-runtime-interne delen verhuizen naar kleinere crate-eigen modules terwijl het runtimegedrag stabiel blijft."

