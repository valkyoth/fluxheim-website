version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Verze 1.6.37 je závěrečný úklid hranic crate před Wasm: ACME, observability, cache, load-balancer, PHP-FPM a interní části native runtime se přesouvají do menších modulů vlastněných crate, zatímco chování runtime zůstává stabilní."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Verze 1.6.37 zvyšuje spolehlivost lokálního observability smoke tím, že opakuje dočasné starty Promethea a Jaegeru s nově přidělenými porty, když host-network porty soupeří s jinými runner procesy."

