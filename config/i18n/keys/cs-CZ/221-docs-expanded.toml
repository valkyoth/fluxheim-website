fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 ponechává Wasm volitelný a přidává omezené native HTTP/1 cache-policy hooks spolu s access-decision, header a route-decision hooks. Plugins mohou pokračovat v běžném chování cache, projít na origin, obejít cache, přeskočit uložení nebo odmítnout, ale stále nemohou měnit raw cache keys, TTLs, tags, response headers ani uložená metadata, ani přijímat raw headers, bodies, přístup k filesystemu, přístup k síti, private keys nebo admin APIs."
