fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 ponechává Wasm volitelný a rozšiřuje omezené native HTTP/1 cache-policy hooks spolu s access-decision, header a route-decision hooks. Plugins mohou pokračovat v běžném chování cache, projít na origin, obejít cache, přeskočit uložení, odmítnout, vybrat pevné mobile/desktop varianty cache-key a připojit pevné cache-store TTL, tag a stored-header metadata, ale nemohou emitovat libovolné cache-key bytes, libovolné TTLs, libovolné tags, raw response headers, bodies, přístup k filesystem, přístup k síti, private keys ani admin APIs."
