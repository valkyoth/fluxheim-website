fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 ponechává Wasm volitelný a přidává omezené nativní HTTP/1 route-decision hooky vedle access-decision a header hooků. Pluginy mohou pokračovat, odmítnout nebo vybrat nakonfigurované canary a mirror větve tras, ale stále nemohou vymýšlet upstreamy, obcházet matchování tras, přepisovat přístupovou politiku Fluxheimu ani přijímat raw headery, bodies, přístup k filesystemu, síti, privátním klíčům nebo admin API."
