process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Limity spouštění na úrovni procesu, globální cache, cache vhostu, pluginu a attachmentu brání neomezené práci pluginů."
fluxheim_1_7_8_keeps_wasm_optional_and_adds_wasi_preview_1_for_access_decision_plugins_clock_and_randomness_need_separate_grants_filesystem_network_process_and_other_host_access_stay_unavailable_unsupported_imports_fail_closed = "Fluxheim 1.7.8 ponechává Wasm volitelný a přidává WASI Preview 1 pro pluginy rozhodující o přístupu. Hodiny a náhodnost vyžadují samostatná oprávnění; souborový systém, síť, procesy a další přístup k hostiteli zůstávají nedostupné. Nepodporované importy jsou bezpečně odmítnuty."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Zkompilované moduly jsou svázány s digestem pluginu, verzí ABI, sadou funkcí hooků, jmenným prostorem volání hostitele a verzí Fluxheimu, takže budoucí opětovné použití nemůže překročit hranice vydání, funkcí ani ABI."
proxy_wasm_preview = "Náhled Proxy-Wasm"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Sestavte s <code>wasm-proxy-abi</code>, povolte <code>allow_preview_abi</code> a deklarujte ABI <code>proxy-wasm-preview</code> i jmenný prostor volání hostitele. Nepodporované importy a volání jsou bezpečně odmítnuty."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "U vícenájemních nasazení povolte <code>[server.host_routing].strict = true</code>, aby chybějící nebo neplatná identita hostitele vracela <code>400</code> a neznámí hostitelé <code>421</code> namísto výchozího webu."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Konfigurační soubory a všechny existující nadřazené adresáře ponechte v důvěryhodném vlastnictví a bez práva zápisu pro skupinu či ostatní uživatele."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Při změně nastavení TLS, listenerů, streamů, UDP, ACME, čištění cache, tracingu nebo spravovaného procesu PHP-FPM proces nahraďte; běžné směrování a pravidla při zpracování požadavku mohou použít opětovné načtení snapshotu."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Použijte trvalý zapisovatelný volume dimenzovaný podle pravidel cache. Každé replice storage-bin přidělte vlastní místní nebo RWO volume; sdílené úložiště RWX používejte jen s ověřeným zamykáním mezi uzly a vynucením jediného writeru na úrovni orchestrace."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Pro každý běžící proces Fluxheim použijte jeden storage-bin root; vlastnictví využívá poradní zámek souborového systému a sdílené rooty s více writery nejsou bez ověřeného externího zamykání bezpečné."
wasi_preview_1 = "Náhled WASI 1"
build_with_wasm_wasi_enable_allow_preview_abi_declare_the_wasi_preview_abi_and_host_call_namespace_and_grant_only_the_required_clock_or_randomness_capability_the_preview_is_limited_to_access_decisions = "Sestavit s <code>wasm-wasi</code>, povolit <code>allow_preview_abi</code>, deklarovat ABI a jmenný prostor host-call <code>wasi-preview</code> a udělit pouze požadované schopnosti hodin a náhodnosti. Náhled je omezen na rozhodování o přístupu"
