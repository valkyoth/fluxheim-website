r1712_released_july_15_2026 = "Vydáno 15. července 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Přidává mezipaměť, proxy a metadata pro zpracování odpovědí založená na standardech"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Prokazuje znovu načtení ověřeného živého snímku, vrácení zpět, kontroly integrity a vytrvalost restartu"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Přidává reprodukovatelný důkaz FIPS-backend a široké nativní zpevnění za běhu"
r1712_whats_next_summary = "přidává metadata volitelných standardů, ověřenou ochranu proti vrácení snímků, reprodukovatelné důkazy FIPS-backend a silnější mezipaměť, TLS, Wasm, ukládání do vyrovnávací paměti a hranice toku."
r1712_release_series_digest = "Fluxheim Řada vydání 1.7: mezipaměť, proxy a metadata pro zpracování odpovědí založená na standardech pro přihlášení; opětovné načtení a vrácení ověřeného živého snímku; reprodukovatelný důkaz FIPS-backend; upgrady procesů s nulovými prostoji; nezávisle testované příklady zásad Wasm; a silnější mezipaměť, TLS, ukládání do vyrovnávací paměti, stream a hranice protokolu."
r1712_standards_based_response_metadata = "Metadata odpovědí založená na standardech"
r1712_response_metadata_intro = "Metadata odpovědi jsou ve výchozím nastavení zakázána. Povolte pouze pole, která potřebujete; Fluxheim je odvozuje ze skutečného výsledku mezipaměti, selhání proxy a konečných bajtů odpovědi, aniž by odhalil klíče mezipaměti, adresy back-endu, názvy DNS nebo nezpracované chyby."
r1712_field = "pole"
r1712_what_it_reports = "Co hlásí"
r1712_cache_status_description = "Výsledky mezipaměti RFC 9211, jako je hit, miss, zastaralé předávání, revalidace, expirace a bypass."
r1712_proxy_status_description = "Podrobnosti o nízké kardinalitě RFC 9209 pro selhání generované Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 přes konečný obsah zprávy HTTP po kompresi."
r1712_repr_digest_description = "SHA-256 pouze tehdy, když Fluxheim obsahuje kompletní vybranou reprezentaci."
r1712_live_snapshots_and_rollback = "Živé snímky a rollback"
r1712_live_snapshot_intro = "Ověřené snímky mohou publikovat ověřeného kandidáta, nahradit aktivní směrovač a vrátit se zpět bez restartování normálních nasazení pouze pro směrování. Každý požadavek zůstává na jedné generaci routeru od začátku do konce."
r1712_snapshot_private_directory = "Udržujte úložiště snímků ve vyhrazeném soukromém adresáři; existující nesoukromé adresáře a kořeny souborového systému jsou odmítnuty."
r1712_snapshot_process_upgrade = "Upgrade procesu použijte, když jsou aktivní služby pro vyrovnávání zatížení na pozadí nebo služby zjišťování."
r1712_snapshot_integrity_restart = "Spusťte kontroly integrity snímku po publikování nebo vrácení zpět a ověřte, že vybraná generace přežije restart."
r1712_read_snapshot_contract = "Přečtěte si kompletní snapshot smlouvu"
r1712_authorization_cache_bypass = "Požadavky nesoucí <code>Authorization</code> nebo <code>Proxy-Authorization</code> vždy obcházejí vyhledávání a úložiště sdílené mezipaměti."
r1712_strict_cache_control = "Chybná nebo konfliktní odezva Direktivy <code>Cache-Control</code> jsou odmítnuty místo toho, aby se vrátily ke konfigurovaným TTL; <code>s-maxage</code> má přednost před <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> a <code>s-maxage</code> zakazují opětovné použití zastaralých položek po uplynutí platnosti."
r1712_encrypted_cache_upgrade_note = "Poznámka k upgradu šifrované mezipaměti"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 přesouvá šifrované objekty diskové mezipaměti na data vázaná na kořen a indexové klíče s trvalým stavem nonce. První spuštění proti staršímu zašifrovanému kořenovému adresáři a každé otočení lokálního klíče záměrně vyčistí tuto mezipaměť před obsluhováním provozu."
r1712_encrypted_cache_disposable = "Zacházejte se šifrovanou mezipamětí jako s jednorázovým zrychlením, nikoli se zdrojem záznamu."
r1712_encrypted_cache_private_storage = "Poskytněte každému kořenu mezipaměti trvalé soukromé úložiště a nekopírujte stav nonce mezi nezávislými kořeny."
r1712_encrypted_cache_warmup = "Naplánujte původní kapacitu pro první zahřátí po upgradu nebo otočení klíčů."
r1712_client_certificate_revocation = "Zneplatnění klientského certifikátu"
r1712_client_certificate_revocation_intro = "Když musí vzájemný TLS odmítnout odvolané klientské certifikáty, poskytněte ohraničený balíček PEM CRL. Fluxheim ověřuje celý řetězec vydavatelů a odmítá vypršenou nebo neúplnou zásadu CRL."
r1712_client_certificate_revocation_compliance = "Požadované ověření klienta v režimu shody požadované FIPS nebo ISO také vyžaduje balíček CRL. Obyčejné ověřování klienta zachovává odvolání jako výslovné přihlášení."
r1712_fips_backend_evidence = "Backendový důkaz FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim poskytuje samostatně připojená prostředí CI pro profily OpenSSL-FIPS a rustls/AWS-LC-FIPS. Vytvářejí a spouštějí přesný binární profil, uplatňují downstream a certifikátem ověřený upstream TLS, odmítají nekompatibilní zásady a zaznamenávají kompilátor, poskytovatel, závislost, binární a image identity."
r1712_fips_backend_evidence_boundary = "Toto je reprodukovatelný backendový důkaz, nikoli ověření FIPS na úrovni produktu. Uchovávejte zkušební kontejnery odděleně od běžných obrázků vydání a zkontrolujte důkazy pro přesné sestavení, které nasazujete."
r1712_read_fips_evidence_guide = "Přečtěte si průvodce důkazy FIPS"
r1712_loader_admission = "Řízení načítání modulů"
r1712_loader_admission_description = "Veřejné manifesty pluginů musí obsahovat pevně daný otisk SHA-256. V celém procesu lze současně kompilovat nejvýše dva moduly. Výchozí limit kompilovaného výstupu je 32 MiB a nelze překročit 256 MiB."
r1712_file_identity = "Identita souboru"
r1712_file_identity_description = "Fluxheim otevře schválené soubory zásuvných modulů bez následujících odkazů, zachová ověřený popisovač normálního souboru a načte bajty modulu z tohoto popisovače bez opětovného otevření cesty."
