r1712_released_july_15_2026 = "Pubblicato 'o 15 'e luglio 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Aggiogne metadate facoltative, basate ncopp''e standard, pe cache, proxy e digest d''a risposta"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Dimostra 'o ricaricamento e 'o rollback d''e snapshot live autenticate, 'e cuntrolle d''integrità e 'a persistenza doppo 'o riavvio"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Aggiogne prove riproducibile pe backend FIPS e nu rinforzo ampio d''o runtime nativo"
r1712_whats_next_summary = "aggiogne metadate standard facoltative, prova d''o rollback d''e snapshot autenticate, prove riproducibile pe backend FIPS e cunfine cchiù forte pe cache, TLS, Wasm, buffering e stream."
r1712_release_series_digest = "Serie Fluxheim 1.7: metadate facoltative basate ncopp''e standard pe cache, proxy e digest d''a risposta; ricaricamento e rollback d''e snapshot live autenticate; prove riproducibile pe backend FIPS; aggiornamente d''e processo senza fermata; esempie 'e policy Wasm pruvate separatamente; e cunfine cchiù forte pe cache, TLS, buffering, stream e protocolle."
r1712_standards_based_response_metadata = "Metadate d''a risposta basate ncopp''e standard"
r1712_response_metadata_intro = "'E metadate d''a risposta songo disattivate pe default. Attiva sulamente 'e campe ca te servono; Fluxheim 'e ricava d''o risultato vero d''a cache, d''o guasto d''o proxy e d''e byte finale d''a risposta, senza fa vedé chiave d''a cache, indirizze d''o backend, nomme DNS o errore grezze."
r1712_field = "Campo"
r1712_what_it_reports = "Che segnala"
r1712_cache_status_description = "Risultate d''a cache RFC 9211 comme hit, miss, inoltro stantio, rivalidazione, scadenza e bypass."
r1712_proxy_status_description = "Dettaglie a bassa cardinalità RFC 9209 pe guaste generate da Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 ncopp''o contenuto finale d''o messaggio HTTP doppo 'a compressione."
r1712_repr_digest_description = "SHA-256 sulamente quanno Fluxheim tene 'a rappresentazione scelta completa."
r1712_live_snapshots_and_rollback = "Snapshot live e rollback"
r1712_live_snapshot_intro = "'E snapshot autenticate ponno pubblicà nu candidato validato, cagnà 'o router attivo e fa rollback senza riavvià 'e normali installazione sulamente 'e routing. Ogne richiesta resta ncopp''a stessa generazione d''o router d''o principio â fine."
r1712_snapshot_private_directory = "Tene 'o deposito d''e snapshot dint''a na cartella privata dedicata; 'e cartelle esistente nun private e 'e radice d''o filesystem veneno rifiutate."
r1712_snapshot_process_upgrade = "Usa n'aggiornamento d''o processo quanno songo attive 'e servizie 'n sottofondo pe 'a salute o 'a scoperta d''o load balancer."
r1712_snapshot_integrity_restart = "Fa 'e cuntrolle d''integrità d''e snapshot doppo 'a pubblicazione o 'o rollback e verifica ca 'a generazione scelta resta doppo 'o riavvio."
r1712_read_snapshot_contract = "Liegge 'o cuntratto cumpleto d''e snapshot"
r1712_authorization_cache_bypass = "'E richieste cu <code>Authorization</code> o <code>Proxy-Authorization</code> saltano sempe 'a ricerca e 'o salvataggio dint''a cache condivisa."
r1712_strict_cache_control = "'E direttive 'e risposta <code>Cache-Control</code> malformate o 'n cunflitto veneno rifiutate invece 'e turnà ê TTL configurate; <code>s-maxage</code> tene priorità ncopp''a <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> e <code>s-maxage</code> vietano 'e riusà dati stantie doppo ca fernesce 'a freschezza."
r1712_encrypted_cache_upgrade_note = "Nota pe ll'aggiornamento d''a cache cifrata"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 sposta ll'oggette d''a cache cifrata ncopp''o disco a chiave 'e date e indice legate â radice, cu nu stato nonce durevole. 'O primmo avvio ncopp''a na radice cifrata cchiù vecchia e ogne rotazione d''a chiave locale fanno apposta na pulizia a friddo d''a cache primma 'e servì 'o traffico."
r1712_encrypted_cache_disposable = "Tratta 'a cache cifrata comme accelerazione ca se pò jettà, no comme fonte ufficiale d''e date."
r1712_encrypted_cache_private_storage = "Dà a ogne radice d''a cache nu spazio privato persistente e nun cupià 'o stato nonce fra radice indipendente."
r1712_encrypted_cache_warmup = "Pianifica 'a capacità d''o server d''origine pe 'o primmo riscaldamento doppo ll'aggiornamento o 'a rotazione d''e chiave."
r1712_client_certificate_revocation = "Revoca d''o certificato d''o cliente"
r1712_client_certificate_revocation_intro = "Quanno TLS reciproco adda rifiutà certificati cliente revocate, furnisce nu bundle PEM CRL limitato. Fluxheim valida tutta 'a catena d''o certificatore e rifiuta policy CRL scadute o incomplete."
r1712_client_certificate_revocation_compliance = "Ll'autenticazione cliente obbligatoria dint''a na modalità 'e conformità FIPS o ISO richiede pure nu bundle CRL. Ll'autenticazione cliente normale tene 'a revoca comme scelta esplicita."
r1712_fips_backend_evidence = "Prove pe backend FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim furnisce ambiente 'e prova CI fissate e separate pe profile OpenSSL-FIPS e rustls/AWS-LC-FIPS. Custruiscono e avviano 'o binario esatto d''o profilo, provano TLS a valle e TLS a monte verificato cu certificato, rifiutano policy incompatibile e registrano ll'identità d''o compilatore, d''o provider, d''e dipendenze, d''o binario e d''a immagine."
r1712_fips_backend_evidence_boundary = "Chest'è na prova riproducibile d''o backend, no na validazione FIPS d''o prodotto. Tene 'e container 'e prova separate d''e normale immagine 'e release e controlla 'e prove pe 'o build preciso ca distribuisce."
r1712_read_fips_evidence_guide = "Liegge 'a guida d''e prove FIPS"
r1712_loader_admission = "Cuntrolle pe caricà 'e moduli"
r1712_loader_admission_description = "'E manifeste pubbliche d''e plugin hanno da tené nu digest SHA-256 fisso. Dint''a tutto 'o processo se compilano massimo dduje moduli â vota. Ll'output compilato tene pe default nu limite 'e 32 MiB e nun pò superà 256 MiB."
r1712_file_identity = "Identità d''o file plugin"
r1712_file_identity_description = "Fluxheim apre 'e file plugin appruvate senza seguì 'e link, tene aperto 'o handle validato d''o file normale e legge 'e byte d''o modulo da chill'handle senza arapì n'ata vota 'o percorso."
