stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabiliseerib käitatavaid Wasmi migratsiooninäiteid ja vabastusvärava testimist; lisab valikulised HTTP-vastuse turvaprofiilid, valideeritud päringutest teadlikud CORS-id, piiratud uuesti proovimise juhised, rangema edastamise ja identiteedipäise puhastamise ning turvalisema päise sõelumise ja ümberkirjutamise."
