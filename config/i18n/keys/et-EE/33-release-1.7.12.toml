r1712_released_july_15_2026 = "Välja antud 15. juulil 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Lisab standardipõhised vahemälu, puhverserveri ja vastuse kokkuvõtte metaandmed"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Tõendab autentitud reaalajas hetktõmmise uuesti laadimist, tagasipööramist, terviklikkuse kontrollimist ja taaskäivitamise püsivust"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Lisab reprodutseeritavad FIPS-backend tõendid ja laia natiivse käitusaja kõvenemise"
r1712_whats_next_summary = "lisab opt-in standardite metaandmed, autentitud hetktõmmise tagasipööramise tõendi, reprodutseeritavad FIPS-backend tõendid ja tugevama vahemälu, TLS, Wasm, puhverdamise ja voo piirid."
r1712_release_series_digest = "Fluxheim 1.7 väljalasete seeria: valikul põhinevad standardid vahemälu, puhverserveri ja vastuse kokkuvõtte metaandmed; autentitud reaalajas hetktõmmise uuesti laadimine ja tagasipööramine; reprodutseeritavad FIPS-backend tõendid; null seisakuaega protsessi uuendamine; sõltumatult testitud Wasm poliitika näited; ja tugevam vahemälu, TLS, puhverdus-, voo- ja protokollipiirid."
r1712_standards_based_response_metadata = "Standardipõhised vastuse metaandmed"
r1712_response_metadata_intro = "Vastuste metaandmed on vaikimisi keelatud. Lubage ainult vajalikud väljad; Fluxheim tuletab need tegelikust vahemälu tulemusest, puhverserveri tõrgetest ja lõplikest vastusebaitidest, paljastamata vahemälu võtmeid, taustaaadresse, DNS-i nimesid või töötlemata vigu."
r1712_field = "Väli"
r1712_what_it_reports = "Mida see teatab"
r1712_cache_status_description = "RFC 9211 vahemälu tulemused, nagu tabamus, möödalaskmine, aegunud edastamine, taaskehtimine, aegumine ja möödasõit."
r1712_proxy_status_description = "RFC 9209 madala kardinaalsusega üksikasjad Fluxheim tekitatud rikete kohta."
r1712_content_digest_description = "RFC 9530 SHA-256 üle lõpliku HTTP sõnumi sisu pärast tihendamist."
r1712_repr_digest_description = "SHA-256 ainult siis, kui Fluxheim sisaldab kogu valitud esitust."
r1712_live_snapshots_and_rollback = "Reaalajas hetktõmmised ja tagasipööramine"
r1712_live_snapshot_intro = "Autentitud hetktõmmised võivad avaldada kinnitatud kandidaadi, asendada reaalajas ruuteri ja tagasi pöörduda ilma tavalisi ainult marsruutimisega seotud juurutusi taaskäivitamata. Iga päring jääb algusest lõpuni ühele ruuteri põlvkonnale."
r1712_snapshot_private_directory = "Hoidke hetktõmmiste pood spetsiaalses privaatses kataloogis; olemasolevad mitteprivaatsed kataloogid ja failisüsteemi juured lükatakse tagasi."
r1712_snapshot_process_upgrade = "Kasutage protsessi uuendamist, kui taustakoormuse tasakaalustaja tervise- või avastamisteenused on aktiivsed."
r1712_snapshot_integrity_restart = "Käivitage hetktõmmise terviklikkuse kontroll pärast avaldamist või tagasipööramist ja veenduge, et valitud põlvkond püsib taaskäivitamisel."
r1712_read_snapshot_contract = "Lugege täielikku hetktõmmise lepingut"
r1712_authorization_cache_bypass = "<code>Authorization</code> või <code>Proxy-Authorization</code> kandvad taotlused mööduvad alati jagatud vahemälu otsingust ja salvestusest."
r1712_strict_cache_control = "Valesti vormindatud või vastuoluline vastus <code>Cache-Control</code> direktiivid lükatakse tagasi, selle asemel et konfigureeritud TTL-idele tagasi pöörduda; <code>s-maxage</code> eelistab <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> ja <code>s-maxage</code> keelavad aegunud taaskasutamise pärast värskuse aegumist."
r1712_encrypted_cache_upgrade_note = "Krüpteeritud vahemälu uuendamise märkus"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 teisaldab krüptitud ketta vahemäluobjektid juur-sidestatud andmetele ja indeksivõtmetele, millel on püsiv mitteühe olek. Esimene käivitamine vanema krüptitud juurfaili vastu ja iga kohaliku võtme pööramine puhastab enne liikluse teenindamist tahtlikult vahemälu."
r1712_encrypted_cache_disposable = "Käsitlege krüptitud vahemälu ühekordselt kasutatava kiirendusena, mitte salvestusallikana."
r1712_encrypted_cache_private_storage = "Andke igale vahemälu juurtele püsiv privaatmälu ja ärge kopeerige sõltumatute juurte vahel nonce-olekut."
r1712_encrypted_cache_warmup = "Planeerige algvõimsus esimeseks soojenduseks pärast uuendamist või võtmete pööramist."
r1712_client_certificate_revocation = "Kliendisertifikaadi tühistamine"
r1712_client_certificate_revocation_intro = "Kui vastastikune TLS peab tühistatud kliendisertifikaadid tagasi lükkama, esitage piiratud PEM CRL pakett. Fluxheim kinnitab kogu väljaandja ahela ja lükkab tagasi aegunud või mittetäieliku CRL poliitika."
r1712_client_certificate_revocation_compliance = "Nõutav kliendi autentimine FIPS või ISO nõutavas vastavusrežiimis nõuab ka CRL komplekti. Tavaline kliendi autentimine säilitab tühistamise kui selgesõnalise lubamise."
r1712_fips_backend_evidence = "FIPS taustatõendid"
r1712_fips_backend_evidence_intro = "Fluxheim pakub profiilide OpenSSL-FIPS ja rustls/AWS-LC-FIPS jaoks eraldi kinnitatud CI-kindlaid keskkondi. Nad loovad ja käitavad täpset kahendprofiili, kasutavad allavoolu ja sertifikaadiga kinnitatud ülesvoolu TLS, lükkavad tagasi ühildumatu poliitika ning salvestavad kompilaatori, pakkuja, sõltuvuse, binaarse ja kujutise identiteedid."
r1712_fips_backend_evidence_boundary = "See on reprodutseeritav taustatõend, mitte tootetaseme FIPS valideerimine. Hoidke tõendusmahutid tavalistest väljalaskepiltidest eraldi ja vaadake tõendusmaterjal üle täpselt teie juurutatud versiooni kohta."
r1712_read_fips_evidence_guide = "Lugege FIPS tõendite juhendit"
r1712_loader_admission = "Moodulite laadimise kontroll"
r1712_loader_admission_description = "Avalikud pluginamanifestid peavad sisaldama fikseeritud SHA-256 räsi. Kogu protsessis kompileeritakse korraga kõige rohkem kaks moodulit. Kompileeritud väljundi vaikepiir on 32 MiB ja see ei tohi ületada 256 MiB."
r1712_file_identity = "Faili identiteet"
r1712_file_identity_description = "Fluxheim avab heakskiidetud pistikprogrammide failid ilma linke järgimata, säilitab valideeritud tavafailipideme ja loeb sellest käepidemest moodulibaite ilma teed uuesti avamata."
