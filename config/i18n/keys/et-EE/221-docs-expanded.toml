version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Versioon 1.6.37 on viimane Wasm-eelne crate’i piiride puhastus: ACME, observability, cache, load-balancer, PHP-FPM ja native runtime sisemused liiguvad väiksematesse crate’i omandis moodulitesse, runtime’i käitumine jääb stabiilseks."

