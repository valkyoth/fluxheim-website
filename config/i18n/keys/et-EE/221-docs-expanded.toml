cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hooks lisavad fikseeritud mobile/desktop cache-key variandid. <code>cache-store</code> hooks määravad fikseeritud TTL, tag ja stored-header metadata."
module_identity = "Mooduli identiteet"
fluxheim_1_7_8_keeps_wasm_optional_and_adds_wasi_preview_1_for_access_decision_plugins_clock_and_randomness_need_separate_grants_filesystem_network_process_and_other_host_access_stay_unavailable_unsupported_imports_fail_closed = "Fluxheim 1.7.8 hoiab Wasm-i valikuliseks ja lisab WASI Preview 1 ligipääsude otsuse pluginate jaoks. Kella- ja juhuslikkuse õigused vajavad eraldi lubasid; failisüsteem, võrk, protsess ja muud hosti ligipääs jäävad saamata. Toetamata importimised nurjavad suurendatud turvalisusega"
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Kompileeritud moodulid seotakse plugina räsi, ABI versiooni, hook'ide funktsioonipinna, hostikutsete nimeruumi ja Fluxheimi versiooniga, et hilisem taaskasutus ei saaks ületada väljalaske-, funktsiooni- ega ABI piire."
proxy_wasm_preview = "Proxy-Wasm eelvaade"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Kompileerige funktsiooniga <code>wasm-proxy-abi</code>, lubage <code>allow_preview_abi</code> ning deklareerige nii <code>proxy-wasm-preview</code> ABI kui ka hostikutsete nimeruum. Toetamata impordid ja kutsed tõrguvad suletult."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Mitme rentnikuga juurutustes lubage <code>[server.host_routing].strict = true</code>, et puuduv või vigane hosti identiteet tagastaks <code>400</code> ja tundmatu host <code>421</code>, selle asemel et jõuda vaikesaidile."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Hoidke konfiguratsioonifailid ja kõik olemasolevad ülemkataloogid usaldusväärse omaniku all ning ärge lubage rühmal ega teistel kasutajatel neisse kirjutada."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Asendage protsess, kui muutuvad TLS-i, kuulajate, voogude, UDP, ACME, vahemälu tühjendamise, jälgimise või hallatud PHP-FPM-protsesside sätted; tavapärase marsruutimise ja päringuaegse poliitika puhul saab kasutada hetktõmmise taaslaadimist."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Püsiv kirjutatav andmeköide, mis on mõõdistatud vahemälupoliitika järgi. Andke igale storage-bin-replikale oma kohalik või RWO-köide; kasutage jagatud RWX-salvestusruumi ainult siis, kui sõlmedeülene lukustus on kontrollitud ja orkestreerimine jõustab ühe kirjutaja reegli."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Kasutage iga töötava Fluxheimi protsessi kohta üht storage-bin-juurkataloogi; omandiõigus kasutab nõuandvat failisüsteemilukku ning jagatud mitme kirjutajaga juurkataloogid on ilma kontrollitud välise lukustuseta ohtlikud."
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Kogu protsessi, globaalse vahemälu, iga vhosti vahemälu, iga plugina ja iga seose täitmispiirangud takistavad pluginate piiramatut tööd."
wasi_preview_1 = "WASI eelvaade 1"
build_with_wasm_wasi_enable_allow_preview_abi_declare_the_wasi_preview_abi_and_host_call_namespace_and_grant_only_the_required_clock_or_randomness_capability_the_preview_is_limited_to_access_decisions = "Ehita kasutades <code>wasm-wasi</code>, lülita sisse <code>allow_preview_abi</code>, deklareeri <code>wasi-preview</code> ABI ja host-call nimeruum ning anna ainult vajalik kella või juhuslikkuse võimalus. Eelvaade on piiratud ligipääsude otsustamisele"
