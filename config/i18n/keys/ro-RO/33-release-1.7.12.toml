r1712_released_july_15_2026 = "Lansat pe 15 iulie 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Adaugă metadate opționale și conforme cu standardele pentru cache, proxy și rezumatele răspunsurilor"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Demonstrează reîncărcarea și revenirea instantaneelor active autentificate, verificările de integritate și persistența după repornire"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Adaugă dovezi reproductibile pentru backend-urile FIPS și întărirea extinsă a mediului de execuție nativ"
r1712_whats_next_summary = "adaugă metadate standard opționale, revenirea verificată a instantaneelor autentificate, dovezi reproductibile pentru backend-urile FIPS și limite mai stricte pentru cache, TLS, Wasm, bufferizare și fluxuri."
r1712_release_series_digest = "Seria Fluxheim 1.7: metadate opționale și conforme cu standardele pentru cache, proxy și rezumatele răspunsurilor; reîncărcarea și revenirea instantaneelor active autentificate; dovezi reproductibile pentru backend-urile FIPS; actualizări de proces fără întrerupere; exemple de politici Wasm testate independent; și limite mai stricte pentru cache, TLS, bufferizare, fluxuri și protocoale."
r1712_standards_based_response_metadata = "Metadate de răspuns bazate pe standarde"
r1712_response_metadata_intro = "Metadatele răspunsului sunt dezactivate implicit. Activați numai câmpurile de care aveți nevoie; Fluxheim le derivă din rezultatul real al memoriei cache, eșecul proxy-ului și octeții de răspuns final, fără a expune cheile cache, adresele backend, numele DNS sau erorile brute."
r1712_field = "Câmp"
r1712_what_it_reports = "Ce raportează"
r1712_cache_status_description = "RFC 9211 rezultate ale memoriei cache, cum ar fi lovitura, ratarea, redirecționarea obținută, revalidarea, expirarea și ocolirea."
r1712_proxy_status_description = "RFC 9209 detalii cu cardinalitate scăzută pentru eșecurile generate de Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 peste conținutul final al mesajului HTTP după comprimare."
r1712_repr_digest_description = "SHA-256 numai atunci când Fluxheim deține reprezentarea completă selectată."
r1712_live_snapshots_and_rollback = "Instantanee live și rollback"
r1712_live_snapshot_intro = "Instantaneele autentificate pot publica un candidat validat, pot înlocui routerul live și pot rula înapoi fără a reporni implementările normale de rutare. Fiecare cerere rămâne pe o generație de router de la început până la sfârșit."
r1712_snapshot_private_directory = "Păstrați magazinul de instantanee într-un director privat dedicat; directoarele non-private existente și rădăcinile sistemului de fișiere sunt respinse."
r1712_snapshot_process_upgrade = "Utilizați o actualizare a procesului atunci când serviciile de descoperire sau starea de echilibrare a încărcării în fundal sunt active."
r1712_snapshot_integrity_restart = "Rulați verificări de integritate a instantaneelor după publicare sau derulare înapoi și verificați că generația selectată supraviețuiește repornirii."
r1712_read_snapshot_contract = "Citiți întregul contract instantaneu"
r1712_authorization_cache_bypass = "Solicitările care transportă <code>Authorization</code> sau <code>Proxy-Authorization</code> ocolesc întotdeauna căutarea și stocarea în cache partajată."
r1712_strict_cache_control = "Directivele <code>Cache-Control</code> de răspuns incorecte sau conflictuale sunt respinse în loc să se întoarcă la TTL-urile configurate; <code>s-maxage</code> are prioritate față de <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> și <code>s-maxage</code> interzic reutilizarea învechită după expirarea prospețimii."
r1712_encrypted_cache_upgrade_note = "Notă de actualizare a memoriei cache criptată"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 mută obiectele cache-ului de disc criptate la date legate de rădăcină și chei de index cu stare durabilă nonce. Prima pornire împotriva unei rădăcini criptate mai veche și fiecare rotație a cheilor locale, purifică intenționat la rece cache-ul înainte de a servi traficul."
r1712_encrypted_cache_disposable = "Datele din cache-ul criptat sunt dispensabile și nu trebuie tratate ca sursă de date autoritară."
r1712_encrypted_cache_private_storage = "Oferiți fiecărei rădăcini cache stocare privată persistentă și nu copiați starea nonce între rădăcini independente."
r1712_encrypted_cache_warmup = "Asigurați-vă că serverul de origine poate gestiona prima încălzire a cache-ului după o actualizare sau o rotație a cheii."
r1712_client_certificate_revocation = "Revocarea certificatului clientului"
r1712_client_certificate_revocation_intro = "Când TLS trebuie să respingă certificatele client revocate, furnizați un pachet PEM CRL limitat. Fluxheim validează lanțul complet de emitenți și respinge politica CRL expirată sau incompletă."
r1712_client_certificate_revocation_compliance = "Autentificarea client necesară într-un mod de conformitate FIPS sau ISO necesită, de asemenea, un pachet CRL. Autentificarea obișnuită a clientului păstrează revocarea ca o înscriere explicită."
r1712_fips_backend_evidence = "Dovezi pentru backend-urile FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim oferă medii CI separate și cu versiuni fixate pentru profilele OpenSSL-FIPS și rustls/AWS-LC-FIPS. Acestea construiesc și rulează binarul exact al profilului, testează TLS descendent și TLS ascendent cu certificat verificat, resping politicile incompatibile și înregistrează identitatea compilatorului, furnizorului, dependențelor, binarului și imaginii."
r1712_fips_backend_evidence_boundary = "Aceasta este o dovadă backend reproductibilă, nu o validare FIPS la nivel de produs. Păstrați containerele cu dovezi separate de imaginile de lansare normale și examinați dovezile pentru versiunea exactă pe care o implementați."
r1712_read_fips_evidence_guide = "Citiți ghidul de dovezi FIPS"
r1712_loader_admission = "Controale pentru încărcarea modulelor"
r1712_loader_admission_description = "Manifestele publice ale pluginurilor trebuie să includă un rezumat SHA-256 fix. În întregul proces se compilează simultan cel mult două module. Ieșirea compilată are implicit o limită de 32 MiB și nu poate depăși 256 MiB."
r1712_file_identity = "Identitatea fișierului"
r1712_file_identity_description = "Fluxheim deschide fișierele plugin aprobate fără a urma link-urile, păstrează identificatorul validat al fișierului obișnuit și citește octeții de modul din acel handle fără a redeschide calea."
