version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Versiunea 1.6.36 elimină mai mult cod temporar de compatibilitate: limita proxy-ului nativ folosește acum direct API-urile deținute de crate-uri, iar adaptoarele root inactive din era Pingora au dispărut din căile obișnuite ale codului sursă."
