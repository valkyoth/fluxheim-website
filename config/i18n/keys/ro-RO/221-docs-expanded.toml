selected_route_policy = "Politica rutei selectate"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "ACL-urile, rate limitele, limitele de concurență, body limitele, redirecturile și politicile de header ale rutei selectate rulează în continuare după o decizie de rută Wasm."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 păstrează Wasm opțional și adaugă hook-uri cache-policy HTTP/1 native delimitate lângă hook-urile access-decision, header și route-decision. Pluginurile pot continua comportamentul normal al cache-ului, pot trece către origin, pot ocoli cache-ul, pot sări peste stocare sau pot refuza, dar încă nu pot modifica chei cache brute, TTL-uri, taguri, headere de răspuns sau metadate stocate și nu primesc headere brute, bodies, acces la filesystem, acces de rețea, chei private sau API-uri admin."
cache_decisions = "Decizii cache"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "Hook-urile <code>cache-lookup</code> pot continua, trece către origin, ocoli cache-ul sau refuza. Hook-urile <code>cache-store</code> pot continua, sări peste stocare sau refuza înainte de scrierile în cache-ul de memorie/disc."
cache_policy_limits = "Limite cache-policy"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Hook-urile cache folosesc un plafon de admitere separat la nivel de proces, astfel încât rutele cache-policy fierbinți să nu consume capacitatea hook-urilor access, route sau header."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 păstrează Wasm opțional și extinde hookurile cache-policy HTTP/1 native delimitate alături de hookurile access-decision, header și route-decision. Pluginurile pot continua comportamentul normal al cacheului, trece prin origin, ocoli cacheul, sări stocarea, refuza, selecta variante fixe mobile/desktop ale cache key și atașa TTL, tag și metadate de header stocate fixe pentru cache-store, dar tot nu pot emite octeți cache key arbitrari, TTL arbitrare, taguri arbitrare, response headers brute, bodies, acces la filesystem, acces la rețea, chei private sau admin APIs."
cache_metadata = "Metadate cache"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "Hookurile <code>cache-lookup</code> adaugă variante fixe mobile/desktop ale cache key. Hookurile <code>cache-store</code> setează TTL, tag și metadate de header stocate fixe."
module_identity = "Identitatea modulului"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Limitele de execuție la nivel de proces, cache global, cache de vhost, plugin și attachment împiedică activitatea nelimitată a pluginurilor."
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 păstrează Wasm opțional și adaugă prima previzualizare opțională a compatibilității ABI Proxy-Wasm. Aceasta stabilește un spațiu de nume separat pentru apelurile către gazdă, protejat de un feature gate, cu validarea strictă a manifestului și tratarea deterministă fail-closed a apelurilor nesuportate; nu susține că orice plugin Proxy-Wasm existent rulează neschimbat."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Modulele compilate sunt legate de digestul pluginului, versiunea ABI, setul de funcționalități hook, spațiul de nume al apelurilor către gazdă și versiunea Fluxheim, astfel încât reutilizarea viitoare să nu poată depăși limitele de versiune, funcționalitate sau ABI."
proxy_wasm_preview = "Previzualizare Proxy-Wasm"
