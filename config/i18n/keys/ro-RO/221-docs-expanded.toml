version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Versiunea 1.6.37 este curățarea finală a granițelor de crate înainte de Wasm: ACME, observability, cache, load-balancer, PHP-FPM și componentele native runtime trec în module mai mici deținute de crate, iar comportamentul runtime rămâne stabil."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Versiunea 1.6.37 face smoke-ul local de observability mai fiabil prin reîncercarea pornirilor temporare Prometheus și Jaeger cu porturi nou alocate când porturile host-network concurează cu alte procese runner."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "Din versiunea 1.7.0, Fluxheim adaugă o bază sandbox Wasm opțională. Este dezactivată implicit, incompatibilă cu privacy-mode și dovedește încărcarea sigură a pluginurilor plus execuția limitată înainte de expunerea hookurilor de politică request/response."
