r1712_released_july_15_2026 = "Издаден на 15 юли 2026 г"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Добавя базирани на стандарти за включване кеш, прокси и метаданни за извлечение на отговор"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Доказва удостоверено презареждане на моментна снимка на живо, връщане назад, проверки на целостта и устойчивост на рестартиране"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Добавя възпроизводими FIPS-backend доказателства и широко естествено втвърдяване по време на изпълнение"
r1712_whats_next_summary = "добавя метаданни за стандарти за включване, доказателство за връщане назад на моментна снимка, възпроизводими FIPS-backend доказателства и по-силен кеш, TLS, Wasm, буфериране и граници на потока."
r1712_release_series_digest = "Fluxheim 1.7 серия от издания: базирани на стандарти за включване кеш, прокси и метаданни за извлечение на отговор; презареждане и връщане назад на автентифицирана моментна снимка на живо; възпроизводими FIPS-backend доказателства; надстройки на процесите без прекъсване; независимо тествани Wasm примери за политики; и по-силен кеш, TLS, буфериране, поток и граници на протокола."
r1712_standards_based_response_metadata = "Базирани на стандарти метаданни за отговор"
r1712_response_metadata_intro = "Метаданните за отговор са деактивирани по подразбиране. Активирайте само полетата, от които се нуждаете; Fluxheim ги извлича от действителния резултат от кеша, отказ на прокси сървъра и крайни байтове за отговор, без да разкрива кеш ключове, бекенд адреси, DNS имена или необработени грешки."
r1712_field = "Поле"
r1712_what_it_reports = "Какво съобщава"
r1712_cache_status_description = "Резултати от кеша на RFC 9211 като попадение, пропуск, остаряло пренасочване, презаверяване, изтичане и байпас."
r1712_proxy_status_description = "RFC 9209 подробности с ниска кардиналност за повреди, генерирани от Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 върху окончателното HTTP съдържание на съобщение след компресиране."
r1712_repr_digest_description = "SHA-256 само когато Fluxheim съдържа пълното избрано представяне."
r1712_live_snapshots_and_rollback = "Моментни снимки на живо и връщане назад"
r1712_live_snapshot_intro = "Удостоверените моментни снимки могат да публикуват валидиран кандидат, да заменят активния рутер и да се върнат назад, без да рестартират нормални внедрявания само за маршрутизиране. Всяка заявка остава на едно генериране на рутер от началото до края."
r1712_snapshot_private_directory = "Съхранявайте хранилището за моментни снимки в специална частна директория; съществуващите нечастни директории и корени на файловата система се отхвърлят."
r1712_snapshot_process_upgrade = "Използвайте надграждане на процеса, когато са активни услугите за изправност или откриване на фоново балансиране на натоварването."
r1712_snapshot_integrity_restart = "Изпълнете проверки за цялост на моментна снимка след публикуване или връщане назад и проверете дали избраното поколение оцелява при рестартиране."
r1712_read_snapshot_contract = "Прочетете пълния договор за моментна снимка"
r1712_authorization_cache_bypass = "Заявките, носещи <code>Authorization</code> или <code>Proxy-Authorization</code> винаги заобикалят търсенето и съхранението в споделен кеш."
r1712_strict_cache_control = "Директивите за неправилен или конфликтен отговор <code>Cache-Control</code> се отхвърлят, вместо да се върнат към конфигурирани TTL; <code>s-maxage</code> има приоритет пред <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> и <code>s-maxage</code> забраняват остарялата повторна употреба след изтичане на свежестта."
r1712_encrypted_cache_upgrade_note = "Бележка за надстройка на шифрован кеш"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 премества шифровани дискови кеш обекти към свързани с root данни и индексни ключове с трайно състояние nonce. Първото стартиране срещу по-стар криптиран корен и всяка ротация на локален ключ умишлено изчиства студено този кеш, преди да обслужи трафик."
r1712_encrypted_cache_disposable = "Третирайте шифрования кеш като ускоряване за еднократна употреба, а не като източник на запис."
r1712_encrypted_cache_private_storage = "Дайте на всеки корен на кеша постоянно частно хранилище и не копирайте състояние nonce между независими корени."
r1712_encrypted_cache_warmup = "Планирайте първоначалния капацитет за първото загряване след надграждане или завъртане на ключове."
r1712_client_certificate_revocation = "Анулиране на клиентски сертификат"
r1712_client_certificate_revocation_intro = "Когато взаимният TLS трябва да отхвърли анулирани клиентски сертификати, осигурете ограничен пакет PEM CRL. Fluxheim валидира пълната верига на издателя и отхвърля изтеклата или непълна CRL политика."
r1712_client_certificate_revocation_compliance = "Изискваното удостоверяване на клиента в режим на съответствие, изискван от FIPS или ISO, също изисква пакет CRL. Обикновеното удостоверяване на клиента запазва отмяната като изрично включване."
r1712_fips_backend_evidence = "FIPS бекенд доказателства"
r1712_fips_backend_evidence_intro = "Fluxheim предоставя отделно фиксирани CI среди за доказателство за профилите OpenSSL-FIPS и rustls/AWS-LC-FIPS. Те изграждат и изпълняват точния двоичен файл на профила, упражняват надолу по веригата и проверени със сертификат нагоре TLS, отхвърлят несъвместима политика и записват идентичности на компилатор, доставчик, зависимости, двоични файлове и изображения."
r1712_fips_backend_evidence_boundary = "Това е възпроизводимо бекенд доказателство, а не FIPS валидиране на ниво продукт. Съхранявайте доказателствените контейнери отделно от изображенията на нормалното издание и прегледайте доказателствата за точната компилация, която внедрявате."
r1712_read_fips_evidence_guide = "Прочетете ръководството за доказателства FIPS"
r1712_loader_admission = "Контроли за зареждане на модули"
r1712_loader_admission_description = "Публичните манифести на добавки трябва да съдържат фиксиран SHA-256 дайджест. В целия процес могат да се компилират едновременно най-много два модула. Компилираният резултат е ограничен по подразбиране до 32 MiB и не може да надвишава 256 MiB."
r1712_file_identity = "Идентичност на файла"
r1712_file_identity_description = "Fluxheim отваря одобрени файлове на добавки, без да следва връзки, запазва валидирания манипулатор на обикновен файл и чете модулни байтове от този манипулатор, без да отваря повторно пътя."
