fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Серия издания на Fluxheim 1.7: независимо тествани примери за миграция, обвързани обратни извиквания на хост, незадължителни профили за защита на HTTP отговор, валидирани CORS, които са запознати с заявки, по-стриктно обработване на препратени самоличности и по-строги граници за Wasm, ACME, моментни снимки, GeoIP, потоци, TLS, PHP-FPM и обслужване на статични файлове."
