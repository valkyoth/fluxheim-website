version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Версия 1.6.37 е финалното почистване на crate границите преди Wasm: ACME, observability, cache, load-balancer, PHP-FPM и native runtime вътрешности се местят в по-малки crate-owned модули, докато runtime поведението остава стабилно."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Версия 1.6.37 прави локалния observability smoke по-надежден, като повтаря стартиранията на временни Prometheus и Jaeger с нови портове, когато host-network портове се конкурират с други runner процеси."
