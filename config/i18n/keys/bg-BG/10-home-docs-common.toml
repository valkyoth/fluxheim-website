load_balancer_control_plane_text = "Фокусиран 1.5 binary и image за балансировчик с разширен избор, локална устойчивост, политика за health/ejection, ограничени опашки и контрол на членовете по време на изпълнение."
modular_build_profiles = "Модулни build профили"
