fluxheim_http_core = "HTTP ядро на Fluxheim"
fluxheim_http_core_text = "Родна за Rust edge среда за изпълнение с pool от връзки, повторни опити към upstream, активни health checks, HTTP/2, WebSocket upgrade и gRPC pass-through."
