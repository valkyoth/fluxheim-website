r1712_released_july_15_2026 = "Izdano 15. julija 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Dodaja predpomnilnik, proxy in metapodatke izvlečka odziva, ki temeljijo na standardih izbire"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Dokazuje pristnost ponovnega nalaganja posnetka v živo, povrnitve nazaj, preverjanja celovitosti in obstojnosti ponovnega zagona"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Doda ponovljive dokaze FIPS-backend in široko utrjevanje izvornega časa delovanja"
r1712_whats_next_summary = "dodaja opt-in standardne metapodatke, overjen dokaz o povrnitvi posnetka, ponovljive dokaze FIPS-backend in močnejši predpomnilnik, TLS, Wasm, medpomnjenje in meje toka."
r1712_release_series_digest = "Serija izdaj Fluxheim 1.7: predpomnilnik, proxy in metapodatki izvlečka odziva, ki temeljijo na izbirnih standardih; ponovno nalaganje posnetka v živo in povrnitev nazaj; ponovljivi FIPS-backend dokazi; nadgradnje procesov brez izpadov; neodvisno testirani primeri politike Wasm; in močnejši predpomnilnik, TLS, medpomnjenje, tok in meje protokola."
r1712_standards_based_response_metadata = "Metapodatki o odzivu na podlagi standardov"
r1712_response_metadata_intro = "Metapodatki o odzivu so privzeto onemogočeni. Omogočite samo polja, ki jih potrebujete; Fluxheim jih izpelje iz dejanskega rezultata predpomnilnika, napake proxyja in končnih odzivnih bajtov, ne da bi razkril ključe predpomnilnika, zaledne naslove, imena DNS ali neobdelane napake."
r1712_field = "Polje"
r1712_what_it_reports = "Kaj poroča"
r1712_cache_status_description = "Rezultati predpomnilnika RFC 9211, kot so zadetek, zgrešen, zastarelo posredovanje, ponovno preverjanje, potek in obhod."
r1712_proxy_status_description = "RFC 9209 podrobnosti nizke kardinalnosti za napake, ki jih ustvari Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 čez končno vsebino sporočila HTTP po stiskanju."
r1712_repr_digest_description = "SHA-256 samo, če Fluxheim vsebuje celotno izbrano predstavitev."
r1712_live_snapshots_and_rollback = "Posnetki v živo in povrnitev nazaj"
r1712_live_snapshot_intro = "Preverjeni posnetki lahko objavijo potrjenega kandidata, zamenjajo usmerjevalnik v živo in se vrnejo nazaj brez ponovnega zagona običajnih razmestitev samo za usmerjanje. Vsaka zahteva ostane na eni generaciji usmerjevalnika od začetka do konca."
r1712_snapshot_private_directory = "Hranite shrambo posnetkov v namenskem zasebnem imeniku; obstoječi nezasebni imeniki in koreni datotečnega sistema so zavrnjeni."
r1712_snapshot_process_upgrade = "Uporabite nadgradnjo procesa, ko so aktivne storitve uravnoteženja obremenitve v ozadju ali storitve odkrivanja."
r1712_snapshot_integrity_restart = "Zaženite preverjanje celovitosti posnetkov po objavi ali povrnitvi in preverite, ali izbrana generacija preživi ponovni zagon."
r1712_read_snapshot_contract = "Preberite celotno pogodbo o posnetku"
r1712_authorization_cache_bypass = "Zahteve, ki nosijo <code>Authorization</code> ali <code>Proxy-Authorization</code>, vedno obidejo iskanje in shranjevanje v predpomnilniku v skupni rabi."
r1712_strict_cache_control = "Napačno oblikovan ali nasprotujoč si odgovor <code>Cache-Control</code> direktive so zavrnjene namesto vrnitve na konfigurirane TTL-je; <code>s-maxage</code> ima prednost pred <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> in <code>s-maxage</code> prepovedujejo zastarelo ponovno uporabo po poteku svežine."
r1712_encrypted_cache_upgrade_note = "Opomba o nadgradnji šifriranega predpomnilnika"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 premakne šifrirane objekte diskovnega predpomnilnika v korensko vezane podatke in indeksne ključe s trajnim nonce stanjem. Prvi zagon s starejšim šifriranim korenom in vsaka rotacija lokalnega ključa namerno hladno očisti ta predpomnilnik, preden služi prometu."
r1712_encrypted_cache_disposable = "Šifrirani predpomnilnik obravnavajte kot pospešek za enkratno uporabo, ne kot vir zapisa."
r1712_encrypted_cache_private_storage = "Dajte vsakemu korenu predpomnilnika trajno zasebno shrambo in ne kopirajte stanja nonce med neodvisnimi koreni."
r1712_encrypted_cache_warmup = "Načrtujte izvorno zmogljivost za prvo ogrevanje po nadgradnji ali vrtenju ključev."
r1712_client_certificate_revocation = "Preklic potrdila stranke"
r1712_client_certificate_revocation_intro = "Ko mora medsebojno TLS zavrniti preklicana potrdila odjemalca, zagotovite omejen sveženj PEM CRL. Fluxheim potrdi celotno verigo izdajatelja in zavrne potekel ali nepopoln pravilnik CRL."
r1712_client_certificate_revocation_compliance = "Zahtevano preverjanje pristnosti odjemalca v načinu skladnosti, ki ga zahteva FIPS ali ISO, zahteva tudi sveženj CRL. Običajna avtentikacija odjemalca ohranja preklic kot izrecno privolitev."
r1712_fips_backend_evidence = "FIPS dokazi o ozadju"
r1712_fips_backend_evidence_intro = "Fluxheim zagotavlja ločeno pripeta dokazna okolja CI za profila OpenSSL-FIPS in rustls/AWS-LC-FIPS. Gradijo in izvajajo natančen binarni profil profila, izvajajo navzgor in s potrdilom preverjen navzgor TLS, zavračajo nezdružljivo politiko in beležijo identitete prevajalnika, ponudnika, odvisnosti, binarne in slikovne identitete."
r1712_fips_backend_evidence_boundary = "To je ponovljiv zaledni dokaz, ne validacija FIPS na ravni izdelka. Vsebnike za dokaze hranite ločeno od običajnih slik za izdajo in preglejte dokaze za točno gradnjo, ki jo uvedete."
r1712_read_fips_evidence_guide = "Preberite vodnik z dokazi FIPS"
r1712_loader_admission = "Nadzor nalaganja modulov"
r1712_loader_admission_description = "Javni manifesti vtičnikov morajo vsebovati fiksni povzetek SHA-256. V celotnem procesu se lahko hkrati prevajata največ dva modula. Prevedeni izhod ima privzeto omejitev 32 MiB in ne sme preseči 256 MiB."
r1712_file_identity = "Identiteta datoteke"
r1712_file_identity_description = "Fluxheim odpre odobrene datoteke vtičnikov, ne da bi sledil povezavam, obdrži potrjeno ročico običajne datoteke in prebere bajte modula iz te ročice, ne da bi znova odprl pot."
