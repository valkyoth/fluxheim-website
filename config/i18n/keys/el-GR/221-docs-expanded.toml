version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Η έκδοση 1.6.37 είναι ο τελικός καθαρισμός ορίων crates πριν από το Wasm: ACME, observability, cache, load-balancer, PHP-FPM και native runtime internals μετακινούνται σε μικρότερα crate-owned modules, ενώ η συμπεριφορά runtime μένει σταθερή."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Η έκδοση 1.6.37 κάνει το τοπικό observability smoke πιο αξιόπιστο επαναδοκιμάζοντας προσωρινές εκκινήσεις Prometheus και Jaeger με νέες θύρες όταν οι host-network θύρες ανταγωνίζονται άλλα runner processes."

