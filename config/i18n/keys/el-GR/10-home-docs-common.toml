telemetry_use_text = "Η telemetry χρησιμοποιείται για τη λειτουργία του ιστότοπου, την κατανόηση aggregate documentation και download usage και την ανίχνευση reliability problems. Δεν χρησιμοποιείται για profiles μεμονωμένων επισκεπτών."
retention = "Διατήρηση"
retention_text = "Η διατήρηση ελέγχεται από το τοπικό Prometheus και Grafana deployment που λειτουργεί για τον ιστότοπο. Η εφαρμογή website δεν γράφει ξεχωριστή analytics database."
purpose_and_lawful_basis = "Σκοπός και νομική βάση"
gdpr_basis_text = "Ο σκοπός της website telemetry είναι security, reliability, capacity planning και aggregate documentation improvement. Η προβλεπόμενη lawful basis είναι legitimate interest για λειτουργία και προστασία του ιστότοπου με privacy-minimised telemetry."
data_minimisation = "Ελαχιστοποίηση δεδομένων"
gdpr_minimisation_text = "Τα metrics χρησιμοποιούν bounded labels όπως locale, normalized route, section, status class, download artifact, GitHub target και optional country code. Η υλοποίηση σχεδιάστηκε ώστε να μη αποθηκεύει ή εξάγει raw IP addresses ή user-level tracking identifiers."
github_redirect_privacy_text = "Τα GitHub outbound clicks μετρώνται συγκεντρωτικά πριν ο browser ανακατευθυνθεί στο GitHub. Το GitHub μετά επεξεργάζεται το request με τους δικούς του όρους και πολιτική απορρήτου."
your_rights = "Τα δικαιώματά σου"
gdpr_rights_text = "Επειδή ο ιστότοπος αποφεύγει user identifiers και αποθηκεύει μόνο aggregate telemetry, συνήθως δεν μπορούμε να αναγνωρίσουμε συγκεκριμένο επισκέπτη μέσα στα metrics. Ερωτήσεις privacy ή GDPR μπορούν να ανοιχτούν μέσω του Fluxheim GitHub project."
translation_notice = "Σημείωση για τις μεταφράσεις"
