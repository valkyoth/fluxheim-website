no_analytics_cookies = "Δεν υπάρχουν analytics cookies"
no_analytics_cookies_text = "Ο ιστότοπος Fluxheim δεν χρησιμοποιεί analytics cookies, advertising cookies, fingerprinting, local storage identifiers ή third-party analytics scripts."
