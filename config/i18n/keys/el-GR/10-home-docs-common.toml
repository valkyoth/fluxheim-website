[home]
meta_description = "Το Fluxheim είναι ένας υψηλής απόδοσης, αρθρωτός διακομιστής ιστού, αντίστροφος διαμεσολαβητής και διακομιστής κρυφής μνήμης, γραμμένος σε Rust."
meta_description_secure = "Το Fluxheim είναι ένας υψηλής απόδοσης, αρθρωτός διακομιστής ιστού, αντίστροφος διαμεσολαβητής και διακομιστής κρυφής μνήμης. Γραμμένο σε Rust. Ασφαλές από προεπιλογή."
meta_description_short = "Ένας διακομιστής άκρου με ασφάλεια μνήμης και αντίστροφος διαμεσολαβητής, γραμμένος σε Rust."
hero_memory_safe = "Ασφαλές στη μνήμη"
hero_edge_server = "Διακομιστής άκρου"
hero_built_in_rust = "Χτισμένο σε Rust"
hero_line_one = "Αρθρωτός αντίστροφος διαμεσολαβητής, κρυφή μνήμη, εξισορροπητής φόρτου και στατικός host"
hero_line_two = "γραμμένο σε Rust. Ασφαλές από προεπιλογή με TLS, ACME,"
hero_line_three = "συμπίεση, πολιτική άκρου, δυναμική ανακάλυψη upstream και ασφαλή κατοπτρισμό κίνησης."
tag_fluxheim_core = "Πυρήνας Fluxheim"
tag_macos_dev = "macOS για ανάπτυξη"
tag_rootless_containers = "Rootless containers"
features_heading = "Όλα όσα χρειάζεσαι στο edge"
features_intro = "Το Fluxheim παρέχεται ως στοχευμένες, αρθρωτές εκδόσεις - χρησιμοποίησε μόνο ό,τι χρειάζεται η εγκατάστασή σου."
memory_safe_by_design = "Ασφάλεια μνήμης από σχεδίαση"
memory_safe_by_design_text = "Γραμμένο σε Rust με κλειδωμένη σταθερή εργαλειοθήκη. Χωρίς υπερχειλίσεις buffer, use-after-free ή κούρσες δεδομένων από κατασκευή."
fluxheim_http_core = "HTTP πυρήνας Fluxheim"
fluxheim_http_core_text = "Εγγενές Rust περιβάλλον άκρου με δεξαμενή συνδέσεων, επαναλήψεις upstream, ενεργούς ελέγχους υγείας, HTTP/2, αναβαθμίσεις WebSocket και διέλευση gRPC."
load_balancer_control_plane = "Επίπεδο ελέγχου εξισορροπητή φόρτου"
load_balancer_control_plane_text = "Στοχευμένο 1.5 δυαδικό και image εξισορροπητή φόρτου με προηγμένη επιλογή, τοπική επιμονή, πολιτική υγείας/αποβολής, περιορισμένη ουρά και ελέγχους μελών κατά την εκτέλεση."
modular_build_profiles = "Αρθρωτά προφίλ build"
modular_build_profiles_text = "Κάνε compile μόνο ό,τι χρειάζεσαι. Στοχευμένα προφίλ για στατικό site, edge cache, αντίστροφο διαμεσολαβητή, εξισορρόπηση φόρτου, TCP stream proxy, PHP-FPM, GeoIP, κατοπτρισμό κίνησης και production πακέτα με συμπίεση."
tls_managed_acme = "TLS και διαχειριζόμενο ACME"
tls_managed_acme_text = "Προσέγγιση rustls-first με υποστηριζόμενες διαδρομές build για OpenSSL και FIPS/ISO, έλεγχο ταυτότητας με πιστοποιητικό πελάτη, upstream mTLS, αυτόματη έκδοση ACME και SNI πολλών πιστοποιητικών."
advanced_cache_system = "Προηγμένο σύστημα κρυφής μνήμης"
advanced_cache_system_text = "Backends κρυφής μνήμης σε μνήμη, δίσκο, επίπεδα και κρυπτογραφημένα, με cache-safe gzip, Zstandard και Brotli συμπίεση, μαζί με caching ανά εύρος για μεγάλα αντικείμενα."
container_native = "Εγγενές για containers"
container_native_text = "Rootless Podman images για Wolfi, Alpine, SUSE Micro και Debian. Systemd/RPM για εγγενείς εγκαταστάσεις. Κανένα εξωτερικό asset κατά την εκκίνηση."
prometheus_opentelemetry = "Prometheus και OpenTelemetry"
prometheus_opentelemetry_text = "Προαιρετικός listener μετρικών Prometheus, εξαγωγή μετρικών OTLP, διάδοση trace context και εξαγωγή OTLP traces για πλήρη παρατηρησιμότητα."
geo_context_text = "Προαιρετικά τοπικά MMDB lookups για πολιτικές χώρας και ASN με MaxMind GeoIP2/GeoLite2 ή CIRCL Geo Open datasets. Δεν υπάρχει απομακρυσμένο lookup ή downloader στη διαδρομή αιτήματος."
tcp_stream_proxy = "TCP stream proxy"
tcp_stream_proxy_text = "Ακατέργαστες υπηρεσίες L4 TCP με αποκλειστικές διαδρομές stream, πραγματικά όρια idle/lifetime/byte, ελέγχους upstream TLS/mTLS, πολιτική weighted/drain/backup και route-local PROXY protocol."
php_fpm_support = "Υποστήριξη PHP-FPM"
php_fpm_support_text = "Προαιρετική γέφυρα PHP-FPM FastCGI για εφαρμογές front-controller τύπου WordPress. Αυστηρή επίλυση script και περιορισμένη διαχείριση αιτημάτων."
edge_policy_controls = "Έλεγχοι πολιτικής άκρου"
edge_policy_controls_text = "ACL με επίγνωση trusted proxy, όρια ρυθμού, auth subrequests, κατοπτρισμός κίνησης, regex rewrites, περιορισμένες ουρές, αυστηρή επικύρωση config και ενισχυμένη διαχείριση αιτημάτων."
