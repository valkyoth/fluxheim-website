country_aggregation_text = "Προαιρετική συγκέντρωση ανά χώρα μπορεί να ενεργοποιηθεί από τον operator. Όταν είναι ενεργή, ο server παράγει country code στη μνήμη και εξάγει μόνο το country code ή unknown."
what_we_do_not_collect = "Τι δεν συλλέγουμε"
privacy_do_not_collect_text = "Δεν εξάγουμε raw IP addresses, per-user identifiers, analytics cookies, browser fingerprints, πλήρη user agents, referrer URLs, request bodies, authorization headers, cookie headers ή πλήρη query strings."
telemetry_use_text = "Η τηλεμετρία χρησιμοποιείται για τη λειτουργία του ιστότοπου, την κατανόηση συγκεντρωτικής χρήσης τεκμηρίωσης και λήψεων και την ανίχνευση προβλημάτων αξιοπιστίας. Δεν χρησιμοποιείται για προφίλ μεμονωμένων επισκεπτών."
retention = "Διατήρηση"
retention_text = "Η διατήρηση ελέγχεται από το τοπικό Prometheus και Grafana deployment που λειτουργεί για τον ιστότοπο. Η εφαρμογή website δεν γράφει ξεχωριστή βάση analytics."
purpose_and_lawful_basis = "Σκοπός και νομική βάση"
gdpr_basis_text = "Ο σκοπός της τηλεμετρίας του ιστότοπου είναι η ασφάλεια, η αξιοπιστία, ο σχεδιασμός χωρητικότητας και η συγκεντρωτική βελτίωση της τεκμηρίωσης. Η προβλεπόμενη νομική βάση είναι το έννομο συμφέρον για λειτουργία και προστασία του ιστότοπου με τηλεμετρία ελαχιστοποιημένη ως προς το απόρρητο."
data_minimisation = "Ελαχιστοποίηση δεδομένων"
gdpr_minimisation_text = "Οι μετρικές χρησιμοποιούν περιορισμένες ετικέτες όπως locale, normalized route, section, status class, download artifact, GitHub target και optional country code. Η υλοποίηση σχεδιάστηκε ώστε να μη αποθηκεύει ή εξάγει raw IP addresses ή user-level tracking identifiers."
github_redirect_privacy_text = "Τα εξερχόμενα clicks προς GitHub μετρώνται συγκεντρωτικά πριν ο browser ανακατευθυνθεί στο GitHub. Το GitHub μετά επεξεργάζεται το αίτημα με τους δικούς του όρους και πολιτική απορρήτου."
your_rights = "Τα δικαιώματά σου"
gdpr_rights_text = "Επειδή ο ιστότοπος αποφεύγει user identifiers και αποθηκεύει μόνο συγκεντρωτική τηλεμετρία, συνήθως δεν μπορούμε να αναγνωρίσουμε συγκεκριμένο επισκέπτη μέσα στις μετρικές. Ερωτήσεις απορρήτου ή GDPR μπορούν να ανοιχτούν μέσω του GitHub project του Fluxheim."
translation_notice = "Σημείωση για τις μεταφράσεις"
translation_notice_text = "Οι μεταφράσεις του ιστότοπου υποστηρίζονται από AI και συντηρούνται με προσπάθεια best-effort. Διορθώσεις και βελτιωμένες μεταφράσεις είναι ευπρόσδεκτες στα <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">i18n keys του ιστότοπου Fluxheim</a>."
