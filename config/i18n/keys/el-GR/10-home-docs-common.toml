events_no_sensitive_text = "Αυτά τα events δεν περιέχουν raw IP addresses, user identifiers, cookie values, browser fingerprints, request bodies, authorization headers ή πλήρη query strings."
what_we_collect = "Τι συλλέγουμε"
privacy_collect_text = "Ο ιστότοπος καταγράφει aggregate operational metrics: request counts, page views, selected language, normalized page route, section, HTTP status class, request duration, download clicks, GitHub redirect clicks και περίπου page visible time."
country_aggregation_text = "Προαιρετικό country aggregation μπορεί να ενεργοποιηθεί από τον operator. Όταν ενεργό, ο server παράγει country code στη μνήμη και εξάγει μόνο το country code ή unknown."
what_we_do_not_collect = "Τι δεν συλλέγουμε"
