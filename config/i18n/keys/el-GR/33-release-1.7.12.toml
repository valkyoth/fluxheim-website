r1712_released_july_15_2026 = "Κυκλοφόρησε στις 15 Ιουλίου 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Προσθέτει μεταδεδομένα κρυφής μνήμης, διακομιστή μεσολάβησης και σύνοψης απόκρισης βάσει προτύπων συμμετοχής"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Αποδεικνύει επανάληψη φόρτωσης, επαναφοράς, ελέγχους ακεραιότητας και επανεκκίνησης επαλήθευσης ταυτότητας ζωντανού στιγμιότυπου"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Προσθέτει αναπαραγώγιμα στοιχεία FIPS-backend και ευρεία εγγενή σκλήρυνση χρόνου εκτέλεσης"
r1712_whats_next_summary = "προσθέτει μεταδεδομένα προτύπων συμμετοχής, επαληθευμένα στιγμιότυπα με δυνατότητα επαναφοράς, αναπαραγώγιμα στοιχεία FIPS-backend και ισχυρότερη κρυφή μνήμη, TLS, Wasm, προσωρινή αποθήκευση και όρια ροής."
r1712_release_series_digest = "Fluxheim Σειρά εκδόσεων 1.7: μεταδεδομένα κρυφής μνήμης, διακομιστής μεσολάβησης και σύνοψης απαντήσεων βάσει προτύπων. Επαναφόρτωση και επαναφορά του ζωντανού στιγμιότυπου με έλεγχο ταυτότητας. αναπαραγώγιμα στοιχεία FIPS-backend. αναβαθμίσεις διαδικασίας μηδενικής διακοπής λειτουργίας. ανεξάρτητα δοκιμασμένα παραδείγματα πολιτικής Wasm. και ισχυρότερη κρυφή μνήμη, TLS, buffering, ροή και όρια πρωτοκόλλου."
r1712_standards_based_response_metadata = "Μεταδεδομένα απόκρισης που βασίζονται σε πρότυπα"
r1712_response_metadata_intro = "Τα μεταδεδομένα απόκρισης είναι απενεργοποιημένα από προεπιλογή. Ενεργοποιήστε μόνο τα πεδία που χρειάζεστε. Το Fluxheim τα αντλεί από το πραγματικό αποτέλεσμα της κρυφής μνήμης, την αποτυχία διακομιστή μεσολάβησης και τα byte τελικής απόκρισης χωρίς να εκτίθενται κλειδιά κρυφής μνήμης, διευθύνσεις υποστήριξης, ονόματα DNS ή πρωτογενή σφάλματα."
r1712_field = "Πεδίο"
r1712_what_it_reports = "Τι αναφέρει"
r1712_cache_status_description = "Αποτελέσματα κρυφής μνήμης RFC 9211, όπως επιτυχία, αστοχία, μπαγιάτικη προώθηση, επανεπικύρωση, λήξη και παράκαμψη."
r1712_proxy_status_description = "RFC 9209 λεπτομέρειες χαμηλής καρδινικότητας για αστοχίες που δημιουργούνται από το Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 πάνω από το τελικό περιεχόμενο μηνύματος HTTP μετά τη συμπίεση."
r1712_repr_digest_description = "SHA-256 μόνο όταν το Fluxheim διατηρεί την πλήρη επιλεγμένη αναπαράσταση."
r1712_live_snapshots_and_rollback = "Ζωντανά στιγμιότυπα και επαναφορά"
r1712_live_snapshot_intro = "Τα επαληθευμένα στιγμιότυπα μπορούν να δημοσιεύσουν έναν επικυρωμένο υποψήφιο, να αντικαταστήσουν τον ζωντανό δρομολογητή και να επιστρέψουν χωρίς επανεκκίνηση των κανονικών αναπτύξεων μόνο για δρομολόγηση. Κάθε αίτημα παραμένει σε μια γενιά δρομολογητή από την αρχή μέχρι το τέλος."
r1712_snapshot_private_directory = "Διατηρήστε το κατάστημα στιγμιότυπων σε έναν αποκλειστικό ιδιωτικό κατάλογο. Οι υπάρχοντες μη ιδιωτικοί κατάλογοι και οι ρίζες του συστήματος αρχείων απορρίπτονται."
r1712_snapshot_process_upgrade = "Χρησιμοποιήστε μια αναβάθμιση διεργασίας όταν είναι ενεργές οι υπηρεσίες υγείας ή ανακάλυψης της εξισορρόπησης φορτίου στο παρασκήνιο."
r1712_snapshot_integrity_restart = "Εκτελέστε ελέγχους ακεραιότητας στιγμιότυπου μετά τη δημοσίευση ή την επαναφορά και βεβαιωθείτε ότι η επιλεγμένη γενιά επιβιώνει επανεκκίνηση."
r1712_read_snapshot_contract = "Διαβάστε το πλήρες στιγμιότυπο σύμβασης"
r1712_authorization_cache_bypass = "Τα αιτήματα που φέρουν <code>Authorization</code> ή <code>Proxy-Authorization</code> παρακάμπτουν πάντα την αναζήτηση και την αποθήκευση της κοινόχρηστης προσωρινής μνήμης."
r1712_strict_cache_control = "Εσφαλμένη ή αντικρουόμενη απόκριση Οι οδηγίες <code>Cache-Control</code> απορρίπτονται αντί να επιστρέφουν στα διαμορφωμένα TTL. Το <code>s-maxage</code> έχει προτεραιότητα έναντι του <code>max-age</code>."
r1712_mandatory_revalidation = "Τα <code>must-revalidate</code>, <code>proxy-revalidate</code> και <code>s-maxage</code> απαγορεύουν την επαναχρησιμοποίηση μετά τη λήξη της φρεσκάδας."
r1712_encrypted_cache_upgrade_note = "Σημείωση αναβάθμισης κρυπτογραφημένης κρυφής μνήμης"
r1712_encrypted_cache_upgrade_intro = "Fluxheim Το 1.7.12 μετακινεί αντικείμενα κρυπτογραφημένης κρυφής μνήμης δίσκου σε δεδομένα συνδεδεμένα με ρίζα και κλειδιά ευρετηρίου με ανθεκτική κατάσταση nonce. Η πρώτη εκκίνηση έναντι μιας παλαιότερης κρυπτογραφημένης ρίζας, και κάθε εναλλαγή τοπικού κλειδιού, εκκαθαρίζει σκόπιμα την εν ψυχρώ αυτή την προσωρινή μνήμη πριν από την προβολή της κυκλοφορίας."
r1712_encrypted_cache_disposable = "Αντιμετωπίστε την κρυπτογραφημένη κρυφή μνήμη ως επιτάχυνση μιας χρήσης, όχι ως πηγή εγγραφής."
r1712_encrypted_cache_private_storage = "Δώστε σε κάθε ρίζα κρυφής μνήμης μόνιμο ιδιωτικό χώρο αποθήκευσης και μην αντιγράψετε κατάσταση nonce μεταξύ ανεξάρτητων ριζών."
r1712_encrypted_cache_warmup = "Σχεδιάστε την αρχική χωρητικότητα για την πρώτη προθέρμανση μετά την αναβάθμιση ή την περιστροφή των πλήκτρων."
r1712_client_certificate_revocation = "Ανάκληση πιστοποιητικού πελάτη"
r1712_client_certificate_revocation_intro = "Όταν το αμοιβαίο TLS πρέπει να απορρίψει τα ανακληθέντα πιστοποιητικά πελάτη, παρέχετε μια δεσμευμένη δέσμη PEM CRL. Το Fluxheim επικυρώνει την πλήρη αλυσίδα εκδοτών και απορρίπτει την πολιτική CRL που έχει λήξει ή δεν είναι ολοκληρωμένη."
r1712_client_certificate_revocation_compliance = "Ο απαιτούμενος έλεγχος ταυτότητας πελάτη σε λειτουργία συμμόρφωσης FIPS ή ISO απαιτεί επίσης μια δέσμη CRL. Ο συνήθης έλεγχος ταυτότητας πελάτη διατηρεί την ανάκληση ως ρητή επιλογή συμμετοχής."
r1712_fips_backend_evidence = "Αποδεικτικά στοιχεία υποστήριξης FIPS"
r1712_fips_backend_evidence_intro = "Το Fluxheim παρέχει χωριστά καρφιτσωμένα περιβάλλοντα προστασίας CI για τα προφίλ OpenSSL-FIPS και rustls/AWS-LC-FIPS. Δημιουργούν και εκτελούν το ακριβές δυαδικό προφίλ, ασκούν μεταγενέστερα και επαληθευμένα πιστοποιητικά ανάντη TLS, απορρίπτουν ασυμβίβαστες πολιτικές και καταγράφουν ταυτότητες μεταγλωττιστή, παρόχου, εξαρτήσεων, δυαδικών και εικόνων."
r1712_fips_backend_evidence_boundary = "Πρόκειται για αναπαραγώγιμη απόδειξη υποστήριξης, όχι επικύρωση FIPS σε επίπεδο προϊόντος. Κρατήστε τα δοχεία δοκιμών χωριστά από τις κανονικές εικόνες κυκλοφορίας και ελέγξτε τα στοιχεία για την ακριβή κατασκευή που αναπτύσσετε."
r1712_read_fips_evidence_guide = "Διαβάστε τον οδηγό αποδεικτικών στοιχείων FIPS"
r1712_loader_admission = "Έλεγχοι φόρτωσης μονάδων"
r1712_loader_admission_description = "Τα δημόσια manifest προσθέτων πρέπει να περιλαμβάνουν σταθερό αποτύπωμα SHA-256. Σε ολόκληρη τη διεργασία μεταγλωττίζονται ταυτόχρονα το πολύ δύο μονάδες. Η μεταγλωττισμένη έξοδος έχει προεπιλεγμένο όριο 32 MiB και δεν μπορεί να υπερβεί τα 256 MiB."
r1712_file_identity = "Ταυτότητα αρχείου"
r1712_file_identity_description = "Το Fluxheim ανοίγει εγκεκριμένα αρχεία προσθηκών χωρίς να ακολουθεί συνδέσμους, διατηρεί την επικυρωμένη λαβή κανονικού αρχείου και διαβάζει byte μονάδας από αυτήν τη λαβή χωρίς να ανοίξει ξανά τη διαδρομή."
