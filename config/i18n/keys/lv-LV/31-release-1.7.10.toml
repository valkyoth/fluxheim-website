released_july_13_2026 = "Publicēts 2026. gada 13. jūlijā"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Pievieno izvēles HTTP atbildes drošības profilus un apstiprinātus pieprasījumu apzinošus CORS"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Stabilizē izpildāmos Wasm politikas piemērus un pārbaudes, kas nepieciešamas atbrīvošanas vārtiem"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Nostiprina pārsūtītās identitātes galvenes, galveņu parsēšanu un norādījumus par atkārtotu mēģinājumu attiecībā uz jaudas ierobežojumiem"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "stabilizē Wasm migrācijas piemērus un pievieno papildu HTTP atbildes drošību, pieprasījumu apzinošu CORS un stingrākas pārsūtīšanas un galvenes robežas."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Fluxheim 1.7 laidienu sērija: neatkarīgi pārbaudīti migrācijas piemēri, ierobežoti resursdatora atzvani, izvēles HTTP atbildes drošības profili, apstiprināts pieprasījumu apzinošs CORS, stingrāka pārsūtītās identitātes apstrāde un stingrākas robežas Wasm, ACME, momentuzņēmumiem, GeoIP, straumēm, TLS, PHP-FPM un statiskam failu apkalpošanai."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 padara katru migrācijas saimi neatkarīgi pārbaudāmu, nodrošina pilnīgu Wasm dūmu testu atbrīvošanas vārtos un pārbauda, ​​vai viesu kontrolētie simboliskie ID tiek droši noraidīti. Procesa laikā veiktās saimniekdatora atzvanīšanas ir ierobežotas ar ierobežotām, nebloķējošām darbībām."
wasm_host_callbacks = "Wasm saimniekdatora atzvani"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "Atzvani ir ierobežoti ar ierobežotu simbolisku dekodēšanu, ierobežotu konteksta lasīšanu un ierobežotu stāvokli. Viņi nevar veikt failu, tīkla, IPC, miega, apstrādes vai trešās puses atzvanīšanas darbus."
release_testing = "Izlaiduma pārbaude"
each_migration_family_can_run_independently_while_the_release_gate_also_runs_the_complete_smoke_test_and_an_arbitrary_guest_id_decoder_property_test = "Katra migrācijas saime var darboties neatkarīgi, savukārt atbrīvošanas vārti veic arī pilnīgu dūmu testu un patvaļīgu viesu ID dekodētāja īpašuma pārbaudi."
http_response_security = "HTTP atbildes drošība"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "HTTP atbildes drošības profili nav obligāti. Sāciet ar <code>baseline</code>; izmantojiet vairāku avotu izolāciju tikai pēc katra skripta, fonta, attēla, pierakstīšanās plūsmas un iegultā resursa pārbaudes."
profile = "Profils"
what_it_does = "Ko tas dara"
keeps_the_opt_in_hardening_headers_disabled = "Atspējo izvēles nostiprināšanas galvenes."
adds_conservative_browser_isolation_and_resource_policy_defaults_suitable_for_most_sites = "Pievieno konservatīvu pārlūkprogrammas izolāciju un resursu politikas noklusējuma iestatījumus, kas piemēroti lielākajai daļai vietņu."
enables_strict_cross_origin_isolation_for_applications_that_have_tested_every_external_dependency = "Iespējo stingru starpizcelsmes izolāciju lietojumprogrammām, kuras ir pārbaudījušas visas ārējās atkarības."
neither_profile_enables_hsts_or_csp_configure_those_separately_after_testing_them_against_the_real_site = "Neviens profils neiespējo HSTS vai CSP. Konfigurējiet tos atsevišķi pēc to testēšanas, salīdzinot ar reālo vietni."
cors_for_browser_apps = "CORS pārlūkprogrammas lietotnēm"
enable_cors_only_when_browser_applications_on_known_origins_must_call_this_route = "Iespējot CORS tikai tad, ja zināmas izcelsmes pārlūkprogrammas lietojumprogrammām ir jāizsauc šis maršruts."
fluxheim_answers_valid_preflight_requests_locally_rejected_preflights_return_403_without_reaching_the_application = "Fluxheim lokāli atbild uz derīgiem CORS preflight pieprasījumiem; noraidītie preflight pieprasījumi atgriež <code>403</code>, nesasniedzot lietojumprogrammu."
do_not_combine_a_wildcard_origin_with_credentials = "Neapvienojiet aizstājējzīmes izcelsmi ar akreditācijas datiem."
cors_is_not_authentication_authorization_or_csrf_protection = "CORS nav autentifikācija, autorizācija vai CSRF aizsardzība."
stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabilizē darbināmus Wasm migrācijas piemērus un atbrīvošanas vārtu testēšanu; pievieno izvēles HTTP atbildes drošības profilus, apstiprinātus pieprasījumus apzinošus CORS, ierobežotus atkārtošanas norādījumus, stingrāku pārsūtīšanu un identitātes galvenes sanitāri, kā arī drošāku galveņu parsēšanu un pārrakstīšanu."
