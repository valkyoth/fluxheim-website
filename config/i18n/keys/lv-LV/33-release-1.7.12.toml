r1712_released_july_15_2026 = "Publicēts 2026. gada 15. jūlijā"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Pievieno uz izvēles standartiem balstītus kešatmiņu, starpniekserveri un atbildes īssavilkuma metadatus"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Pierāda autentificētu tiešraides momentuzņēmuma atkārtotu ielādi, atcelšanu, integritātes pārbaudes un restartēšanas noturību"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Pievieno reproducējamus FIPS-backend pierādījumus un plašu vietējo izpildlaika sacietēšanu"
r1712_whats_next_summary = "pievieno izvēles standartu metadatus, autentificētu momentuzņēmumu atcelšanas pārbaudi, reproducējamus FIPS-backend pierādījumus un spēcīgāku kešatmiņu, TLS, Wasm, buferizāciju un straumes robežas."
r1712_release_series_digest = "Fluxheim 1.7 laidienu sērija: izvēles standarti balstīta kešatmiņa, starpniekserveri un atbildes apkopojuma metadati; autentificēta tiešā momentuzņēmuma atkārtota ielāde un atcelšana; reproducējami FIPS-backend pierādījumi; nulles dīkstāves procesa jauninājumi; neatkarīgi pārbaudīti Wasm politikas piemēri; un spēcīgāka kešatmiņa, TLS, buferizācijas, straumēšanas un protokola robežas."
r1712_standards_based_response_metadata = "Uz standartiem balstīti atbilžu metadati"
r1712_response_metadata_intro = "Atbilžu metadati pēc noklusējuma ir atspējoti. Iespējojiet tikai nepieciešamos laukus; Fluxheim tos iegūst no faktiskā kešatmiņas rezultāta, starpniekservera kļūmes un galīgās atbildes baitiem, neatklājot kešatmiņas atslēgas, aizmugursistēmas adreses, DNS nosaukumus vai neapstrādātas kļūdas."
r1712_field = "Lauks"
r1712_what_it_reports = "Par ko tā ziņo"
r1712_cache_status_description = "RFC 9211 kešatmiņas rezultāti, piemēram, trāpījums, garām, novecojis pārsūtīšana, atkārtota apstiprināšana, derīguma termiņš un apiešana."
r1712_proxy_status_description = "RFC 9209 zemas kardinalitātes informācija par kļūmēm, ko rada Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 pār pēdējā HTTP ziņojuma saturu pēc saspiešanas."
r1712_repr_digest_description = "SHA-256 tikai tad, ja Fluxheim satur visu atlasīto attēlojumu."
r1712_live_snapshots_and_rollback = "Tiešraides momentuzņēmumi un atcelšana"
r1712_live_snapshot_intro = "Autentificēti momentuzņēmumi var publicēt apstiprinātu kandidātu, nomainīt reāllaika maršrutētāju un atsākt, nerestartējot parastās tikai maršrutēšanas izvietošanas. Katrs pieprasījums paliek vienā maršrutētāja paaudzē no sākuma līdz beigām."
r1712_snapshot_private_directory = "Saglabājiet momentuzņēmumu veikalu īpašā privātajā direktorijā; esošie neprivātie direktoriji un failu sistēmu saknes tiek noraidīti."
r1712_snapshot_process_upgrade = "Izmantojiet procesa jaunināšanu, kad ir aktīvi fona slodzes līdzsvarotāja veselības vai atklāšanas pakalpojumi."
r1712_snapshot_integrity_restart = "Palaidiet momentuzņēmuma integritātes pārbaudes pēc publicēšanas vai atcelšanas un pārbaudiet, vai atlasītā paaudze izdzīvo restartēšanu."
r1712_read_snapshot_contract = "Izlasiet visu momentuzņēmuma līgumu"
r1712_authorization_cache_bypass = "Pieprasījumi, kas satur <code>Authorization</code> vai <code>Proxy-Authorization</code>, vienmēr apiet koplietotās kešatmiņas meklēšanu un krātuvi."
r1712_strict_cache_control = "Nepareizi veidota vai pretrunīga atbilde <code>Cache-Control</code> direktīvas tiek noraidītas, nevis atgriežas pie konfigurētiem TTL; <code>s-maxage</code> ir prioritāte pār <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> un <code>s-maxage</code> aizliedz novecojušu atkārtotu izmantošanu pēc svaiguma derīguma termiņa beigām."
r1712_encrypted_cache_upgrade_note = "Šifrētas kešatmiņas jaunināšanas piezīme"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 pārvieto šifrētus diska kešatmiņas objektus uz saknes datiem un indeksa atslēgām ar ilgstošu nonce stāvokli. Pirmā palaišana, izmantojot vecāku šifrētu sakni, un katra vietējās atslēgas rotācija, pirms trafika apkalpošanas apzināti auksti iztīra kešatmiņu."
r1712_encrypted_cache_disposable = "Uztveriet šifrēto kešatmiņu kā vienreiz lietojamu paātrinājumu, nevis ieraksta avotu."
r1712_encrypted_cache_private_storage = "Katrai kešatmiņas saknei piešķiriet pastāvīgu privāto krātuvi un nekopējiet stāvokli starp neatkarīgām saknēm."
r1712_encrypted_cache_warmup = "Plānojiet sākotnējo jaudu pirmajai iesildīšanai pēc jaunināšanas vai atslēgu pagriešanas."
r1712_client_certificate_revocation = "Klienta sertifikāta atsaukšana"
r1712_client_certificate_revocation_intro = "Ja savstarpējai TLS ir jānoraida atsauktie klientu sertifikāti, nodrošiniet ierobežotu PEM CRL komplektu. Fluxheim apstiprina visu izdevēja ķēdi un noraida CRL politiku, kuras derīguma termiņš ir beidzies vai nepabeigta."
r1712_client_certificate_revocation_compliance = "Nepieciešamajai klienta autentifikācijai FIPS vai ISO nepieciešamajā atbilstības režīmā ir nepieciešams arī komplekts CRL. Parasta klienta autentifikācija saglabā atsaukšanu kā nepārprotamu pieteikšanos."
r1712_fips_backend_evidence = "FIPS aizmugures pierādījumi"
r1712_fips_backend_evidence_intro = "Fluxheim nodrošina atsevišķi piestiprinātas CI drošas vides profiliem OpenSSL-FIPS un rustls/AWS-LC-FIPS. Viņi veido un palaiž precīzu profila bināro versiju, izmanto pakārtoto un sertifikātu verificēto augšējo TLS, noraida nesaderīgu politiku un ieraksta kompilatoru, nodrošinātāju, atkarības, bināro un attēlu identitātes."
r1712_fips_backend_evidence_boundary = "Tas ir reproducējams aizmugures pierādījums, nevis produkta līmeņa FIPS validācija. Glabājiet pārbaudes konteinerus atsevišķi no parastajiem izlaiduma attēliem un pārskatiet pierādījumus par precīzo jūsu izvietoto versiju."
r1712_read_fips_evidence_guide = "Izlasiet FIPS pierādījumu rokasgrāmatu"
r1712_loader_admission = "Moduļu ielādes kontrole"
r1712_loader_admission_description = "Publiskajos spraudņu manifestos jābūt fiksētam SHA-256 kopsavilkumam. Visā procesā vienlaikus drīkst kompilēt ne vairāk kā divus moduļus. Kompilētās izvades noklusējuma ierobežojums ir 32 MiB, un tā nedrīkst pārsniegt 256 MiB."
r1712_file_identity = "Faila identitāte"
r1712_file_identity_description = "Fluxheim atver apstiprinātos spraudņu failus, nesekojot saitēm, saglabā apstiprināto parastā faila turi un nolasa moduļa baitus no šī roktura, atkārtoti neatverot ceļu."
