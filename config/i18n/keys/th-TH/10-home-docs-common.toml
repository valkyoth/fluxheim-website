[home]
meta_description = "Fluxheim is a ประสิทธิภาพสูง, แบบโมดูลาร์ web server, รีเวิร์สพร็อกซี and caching server สร้างด้วย Rust."
meta_description_secure = "Fluxheim is a ประสิทธิภาพสูง, แบบโมดูลาร์ web server, รีเวิร์สพร็อกซี and caching server. เขียนด้วย Rust. ปลอดภัยโดยค่าเริ่มต้น."
meta_description_short = "A ปลอดภัยต่อหน่วยความจำ เอดจ์เซิร์ฟเวอร์ and รีเวิร์สพร็อกซี สร้างด้วย Rust."
hero_memory_safe = "ปลอดภัยต่อหน่วยความจำ"
hero_edge_server = "เอดจ์เซิร์ฟเวอร์"
hero_built_in_rust = "สร้างด้วย Rust"
hero_line_one = "Modular รีเวิร์สพร็อกซี, แคช, ตัวกระจายโหลด, and static host written"
hero_line_two = "in Rust. ปลอดภัยโดยค่าเริ่มต้น with TLS, ACME, compression, edge policy,"
hero_line_three = "dynamic อัปสตรีม discovery, and ปลอดภัย ทราฟฟิก mirroring built in."
tag_fluxheim_core = "ฟลักซ์ไฮม์ คอร์"
tag_macos_dev = "การพัฒนา macOS"
tag_rootless_containers = "ภาชนะไร้รูท"
features_heading = "ทุกอย่างที่ต้องใช้ที่ขอบเครือข่าย"
features_intro = "Fluxheim ships as focused, แบบโมดูลาร์ builds — use only what your deployment needs."
memory_safe_by_design = "ออกแบบให้ปลอดภัยต่อหน่วยความจำ"
memory_safe_by_design_text = "เขียนด้วย Rust with a pinned stable toolchain. No buffer overflows, no use-after-free, no data races by construction."
fluxheim_http_core = "แกน HTTP ของ Fluxheim"
fluxheim_http_core_text = "A Rust-native edge runtime with connection pooling, อัปสตรีม retries, active การตรวจสุขภาพ, HTTP/2, WebSocket upgrades, and gRPC pass-through."
load_balancer_control_plane = "คอนโทรลเพลนของตัวกระจายโหลด"
load_balancer_control_plane_text = "ไบนารีและอิมเมจโหลดบาลานเซอร์ที่เน้น 1.5 พร้อมการเลือกขั้นสูง การคงอยู่เฉพาะที่ นโยบายความสมบูรณ์/การดีดออก การจัดคิวแบบมีขอบเขต และการควบคุมสมาชิกรันไทม์"
modular_build_profiles = "โปรไฟล์บิลด์แบบโมดูลาร์"
modular_build_profiles_text = "Compile only what you need. Focused profiles for static site, แคช edge, รีเวิร์สพร็อกซี, load balancing, TCP stream proxying, PHP-FPM, GeoIP, ทราฟฟิก mirroring, and compression-enabled production bundles."
tls_managed_acme = "TLS และ ACME ที่จัดการให้"
tls_managed_acme_text = "rustls-first with supported OpenSSL and FIPS/ISO proof build paths, client certificate auth, อัปสตรีม mTLS, automatic ACME issuance, and multi-cert SNI."
advanced_cache_system = "ระบบแคชขั้นสูง"
advanced_cache_system_text = "Memory, disk, tiered, and encrypted แคช แบ็กเอนด์s with แคช-ปลอดภัย gzip, Zstandard, and Brotli compression plus range caching for large objects."
container_native = "รองรับคอนเทนเนอร์โดยตรง"
container_native_text = "อิมเมจ Podman ที่ไม่มีรูทสำหรับ Wolfi, Alpine, SUSE Micro และ Debian Systemd/RPM สำหรับการปรับใช้แบบเนทิฟ สินทรัพย์ภายนอกเป็นศูนย์เมื่อเริ่มต้น"
prometheus_opentelemetry = "Prometheus และ OpenTelemetry"
prometheus_opentelemetry_text = "Opt-in Prometheus เมตริก listener, OTLP เมตริก export, trace context propagation, and OTLP trace export for full การสังเกตการณ์ระบบ."
geo_context_text = "ค้นหา MMDB ในเครื่องแบบเลือกเปิดได้สำหรับนโยบายประเทศและ ASN โดยใช้ MaxMind GeoIP2/GeoLite2 หรือชุดข้อมูล CIRCL Geo Open ไม่มีการค้นหาระยะไกลหรือตัวดาวน์โหลดในเส้นทางคำขอ"
tcp_stream_proxy = "พร็อกซีสตรีม TCP"
tcp_stream_proxy_text = "Raw L4 TCP services with dedicated stream routes, true idle/lifetime/byte caps, อัปสตรีม TLS/mTLS controls, weighted/drain/backup policy, and route-local PROXY protocol."
php_fpm_support = "การรองรับ PHP-FPM"
php_fpm_support_text = "Opt-in PHP-FPM FastCGI bridge for WordPress-style front-controller applications. Strict script resolution and bounded คำขอ handling."
edge_policy_controls = "การควบคุมนโยบายที่ edge"
edge_policy_controls_text = "Trusted-proxy-aware ACLs, rate limits, auth subคำขอ, ทราฟฟิก mirroring, regex rewrites, bounded queues, strict config validation, and hardened คำขอ handling."
quick_start_heading = "เริ่มใช้งานได้ในไม่กี่นาที"
from_source = "จากซอร์ส"
full_installation_guide = "คู่มือติดตั้งฉบับเต็ม →"
