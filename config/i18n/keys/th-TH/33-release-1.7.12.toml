r1712_released_july_15_2026 = "เผยแพร่เมื่อวันที่ 15 กรกฎาคม พ.ศ. 2569"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "เพิ่มแคชตามมาตรฐานที่เลือกใช้ พร็อกซี และข้อมูลเมตาสรุปการตอบกลับ"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "พิสูจน์การโหลด Live Snapshot ซ้ำ ย้อนกลับ การตรวจสอบความสมบูรณ์ และการรีสตาร์ทอย่างต่อเนื่อง"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "เพิ่มหลักฐาน FIPS-backend ที่ทำซ้ำได้และการปรับปรุงรันไทม์ดั้งเดิมในวงกว้าง"
r1712_whats_next_summary = "เพิ่มข้อมูลเมตามาตรฐานที่เลือกใช้, การพิสูจน์การย้อนกลับสแน็ปช็อตที่ได้รับการรับรองความถูกต้อง, หลักฐาน FIPS-backend ที่ทำซ้ำได้ และแคชที่แข็งแกร่งยิ่งขึ้น, TLS, Wasm, การบัฟเฟอร์ และขอบเขตสตรีม"
r1712_release_series_digest = "Fluxheim 1.7 release series: เลือกใช้แคชตามมาตรฐาน พร็อกซี และเมตาดาต้าสรุปการตอบกลับ การโหลดและย้อนกลับสแน็ปช็อตสดที่ผ่านการรับรองความถูกต้องแล้ว หลักฐาน FIPS-backend ที่ทำซ้ำได้; การอัพเกรดกระบวนการหยุดทำงานเป็นศูนย์; ตัวอย่างนโยบาย Wasm ที่ทดสอบโดยอิสระ และแคชที่แข็งแกร่งกว่า TLS การบัฟเฟอร์ สตรีม และขอบเขตโปรโตคอล"
r1712_standards_based_response_metadata = "ข้อมูลเมตาการตอบสนองตามมาตรฐาน"
r1712_response_metadata_intro = "ข้อมูลเมตาการตอบกลับถูกปิดใช้งานตามค่าเริ่มต้น เปิดใช้งานเฉพาะฟิลด์ที่คุณต้องการ Fluxheim ได้มาจากผลลัพธ์แคชจริง ความล้มเหลวของพร็อกซี และไบต์ตอบสนองสุดท้ายโดยไม่เปิดเผยคีย์แคช ที่อยู่แบ็กเอนด์ ชื่อ DNS หรือข้อผิดพลาดดิบ"
r1712_field = "ฟิลด์"
r1712_what_it_reports = "ข้อมูลที่รายงาน"
r1712_cache_status_description = "ผลลัพธ์แคช RFC 9211 เช่น Hit, miss, การส่งต่อเก่า, การตรวจสอบความถูกต้องอีกครั้ง, การหมดอายุ และบายพาส"
r1712_proxy_status_description = "รายละเอียด RFC 9209 คาร์ดินัลลิตี้ต่ำสำหรับความล้มเหลวที่สร้างโดย Fluxheim"
r1712_content_digest_description = "RFC 9530 SHA-256 บนเนื้อหาข้อความ HTTP สุดท้ายหลังจากการบีบอัด"
r1712_repr_digest_description = "SHA-256 เฉพาะเมื่อ Fluxheim เก็บการแสดงที่เลือกไว้ทั้งหมดเท่านั้น"
r1712_live_snapshots_and_rollback = "สแนปช็อตที่ใช้งานจริงและการย้อนกลับ"
r1712_live_snapshot_intro = "สแน็ปช็อตที่ผ่านการรับรองความถูกต้องสามารถเผยแพร่ตัวเลือกที่ผ่านการตรวจสอบแล้ว แทนที่เราเตอร์ที่ใช้งานจริง และย้อนกลับโดยไม่ต้องรีสตาร์ทการปรับใช้เฉพาะการกำหนดเส้นทางตามปกติ แต่ละคำขอยังคงอยู่ในรุ่นเราเตอร์หนึ่งรุ่นตั้งแต่ต้นจนจบ"
r1712_snapshot_private_directory = "เก็บสแน็ปช็อตไว้ในไดเร็กทอรีส่วนตัวเฉพาะ ไดเร็กทอรีที่ไม่ใช่ส่วนตัวและรูทระบบไฟล์ที่มีอยู่จะถูกปฏิเสธ"
r1712_snapshot_process_upgrade = "ใช้การอัปเกรดกระบวนการเมื่อความสมบูรณ์ของตัวโหลดบาลานซ์ในเบื้องหลังหรือบริการการค้นพบทำงานอยู่"
r1712_snapshot_integrity_restart = "เรียกใช้การตรวจสอบความสมบูรณ์ของสแนปชอตหลังจากการเผยแพร่หรือย้อนกลับ และตรวจสอบว่ารุ่นที่เลือกรอดจากการรีสตาร์ท"
r1712_read_snapshot_contract = "อ่านข้อกำหนดสแนปช็อตฉบับสมบูรณ์"
r1712_authorization_cache_bypass = "คำร้องขอที่มี <code>Authorization</code> หรือ <code>Proxy-Authorization</code> จะข้ามการค้นหาและการจัดเก็บแคชที่แชร์เสมอ"
r1712_strict_cache_control = "การตอบสนองที่มีรูปแบบไม่ถูกต้องหรือขัดแย้งกัน คำสั่ง <code>Cache-Control</code> ถูกปฏิเสธแทนที่จะถอยกลับไปเป็น TTL ที่กำหนดค่าไว้ <code>s-maxage</code> มีลำดับความสำคัญมากกว่า <code>max-age</code>"
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> และ <code>s-maxage</code> ห้ามมิให้นำกลับมาใช้ใหม่หลังจากที่ความสดหมดอายุ"
r1712_encrypted_cache_upgrade_note = "บันทึกการอัพเกรดแคชที่เข้ารหัส"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 ย้ายออบเจ็กต์แคชของดิสก์ที่เข้ารหัสไปยังข้อมูลที่ผูกกับรูทและคีย์ดัชนีด้วยสถานะ nonce ที่คงทน การเริ่มต้นครั้งแรกกับรูทที่เข้ารหัสเก่า และการหมุนคีย์ในเครื่องทุกครั้ง ตั้งใจจะล้างแคชนั้นก่อนให้บริการการรับส่งข้อมูล"
r1712_encrypted_cache_disposable = "ให้ถือว่าแคชที่เข้ารหัสเป็นข้อมูลเร่งความเร็วที่ลบทิ้งได้ ไม่ใช่แหล่งข้อมูลหลัก"
r1712_encrypted_cache_private_storage = "ให้พื้นที่เก็บข้อมูลส่วนตัวถาวรของแคชรูททุกตัว และอย่าคัดลอกสถานะ nonce ระหว่างรูทที่เป็นอิสระ"
r1712_encrypted_cache_warmup = "เตรียมความจุของเซิร์ฟเวอร์ต้นทางให้เพียงพอสำหรับการอุ่นแคชครั้งแรกหลังอัปเกรดหรือหมุนเวียนคีย์"
r1712_client_certificate_revocation = "การเพิกถอนใบรับรองไคลเอ็นต์"
r1712_client_certificate_revocation_intro = "เมื่อ TLS ร่วมกันต้องปฏิเสธใบรับรองไคลเอ็นต์ที่ถูกเพิกถอน ให้จัดเตรียมบันเดิล PEM CRL ที่มีขอบเขต Fluxheim ตรวจสอบความถูกต้องของห่วงโซ่ผู้ออกที่สมบูรณ์ และปฏิเสธนโยบาย CRL ที่หมดอายุหรือไม่สมบูรณ์"
r1712_client_certificate_revocation_compliance = "การรับรองความถูกต้องไคลเอ็นต์ที่จำเป็นในโหมดการปฏิบัติตามข้อกำหนดที่กำหนด FIPS หรือ ISO จำเป็นต้องมีบันเดิล CRL ด้วย การตรวจสอบสิทธิ์ไคลเอ็นต์ทั่วไปจะเก็บการเพิกถอนไว้เป็นการเลือกใช้อย่างชัดเจน"
r1712_fips_backend_evidence = "หลักฐานแบ็กเอนด์ FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim มีสภาพแวดล้อมตรวจสอบ CI ที่ตรึงเวอร์ชันแยกกันสำหรับโปรไฟล์ OpenSSL-FIPS และ rustls/AWS-LC-FIPS สภาพแวดล้อมเหล่านี้จะสร้างและเรียกใช้ไบนารีของโปรไฟล์จริง ทดสอบ TLS ฝั่งขาเข้าและ TLS ฝั่งต้นทางที่ตรวจสอบใบรับรอง ปฏิเสธนโยบายที่เข้ากันไม่ได้ และบันทึกข้อมูลระบุตัวตนของคอมไพเลอร์ ผู้ให้บริการ การขึ้นต่อกัน ไบนารี และอิมเมจ"
r1712_fips_backend_evidence_boundary = "นี่เป็นหลักฐานแบ็กเอนด์ที่สามารถทำซ้ำได้ ไม่ใช่การตรวจสอบ FIPS ระดับผลิตภัณฑ์ เก็บคอนเทนเนอร์หลักฐานแยกจากอิมเมจที่เผยแพร่ตามปกติ และตรวจสอบหลักฐานสำหรับรุ่นที่คุณปรับใช้"
r1712_read_fips_evidence_guide = "อ่านคู่มือหลักฐาน FIPS"
r1712_loader_admission = "การควบคุมการรับเข้าเมื่อโหลด"
r1712_loader_admission_description = "ไฟล์ manifest สาธารณะต้องระบุค่า SHA-256 ที่ตรึงไว้ การคอมไพล์พร้อมกันทั้งโปรเซสทำได้สูงสุดสองงาน และผลลัพธ์ที่คอมไพล์มีขีดจำกัดเริ่มต้น 32 MiB กับขีดจำกัดสูงสุด 256 MiB"
r1712_file_identity = "ความเป็นไฟล์เดียวกัน"
r1712_file_identity_description = "Fluxheim เปิดไฟล์ปลั๊กอินที่ได้รับอนุมัติโดยไม่ต้องติดตามลิงก์ คงตัวจัดการไฟล์ปกติที่ได้รับการตรวจสอบ และอ่านไบต์ของโมดูลจากตัวจัดการนั้นโดยไม่ต้องเปิดเส้นทางอีกครั้ง"
