r182_summary = "เพิ่มไฟล์ ZIP แบบเนทีฟที่ยังไม่ได้ลงลายมือชื่อสำหรับ Windows x86_64 ให้ครบทั้งเจ็ดโปรไฟล์สาธารณะ คงการป้องกันระบบไฟล์และข้อมูลรับรองของ Windows และแทนที่อิมเมจ PHP SUSE Micro ด้วยรันไทม์ php-suse-bci ที่ทำงานได้ด้วยตนเอง"
