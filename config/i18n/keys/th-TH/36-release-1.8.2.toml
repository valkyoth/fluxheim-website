r182_windows_unsigned = "นี่คือรุ่นตัวอย่างแบบพกพาที่ยังไม่ได้ลงลายมือชื่อ โปรดเปิดใช้การรักษาความปลอดภัยของ SmartScreen และ PowerShell ไว้ โดยยังไม่มีการลงลายมือชื่อ Authenticode และตัวติดตั้งบริการ Windows"
r182_macos_unsigned = "นี่คือรุ่นตัวอย่างแบบบรรทัดคำสั่งที่ยังไม่ได้ลงลายมือชื่อ โปรดเปิดใช้ Gatekeeper ไว้ โดยยังไม่มีการลงลายมือชื่อ Developer ID การรับรองเอกสาร และการผสานรวมกับ launchd"
