fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "ซีรีส์การเปิดตัว Fluxheim 1.7: ตัวอย่างการย้ายที่ทดสอบโดยอิสระ, การเรียกกลับของโฮสต์ที่ถูกผูกไว้, โปรไฟล์ความปลอดภัยการตอบสนอง HTTP ที่เป็นตัวเลือก, CORS ที่รับรู้คำขอที่ได้รับการตรวจสอบแล้ว, การจัดการข้อมูลระบุตัวตนที่ส่งต่อที่เข้มงวดยิ่งขึ้น และขอบเขตที่แข็งแกร่งยิ่งขึ้นสำหรับ Wasm, ACME, สแน็ปช็อต, GeoIP, สตรีม, TLS, PHP-FPM และการให้บริการไฟล์แบบคงที่"
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 ทำให้ตัวอย่างการย้ายแต่ละกลุ่มทดสอบแยกกันได้ รัน Wasm smoke test แบบครบชุดในเกณฑ์การเผยแพร่ และตรวจสอบว่า ID เชิงสัญลักษณ์ที่ guest กำหนดถูกปฏิเสธอย่างปลอดภัย การเรียกกลับของโฮสต์ภายในโปรเซสยังคงจำกัดไว้เฉพาะงานที่มีขอบเขตและไม่บล็อก"
wasm_host_callbacks = "การเรียกกลับโฮสต์ Wasm"
