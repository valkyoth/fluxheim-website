stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabilizza gli esempi di migrazione Wasm eseguibili e i test del gate di rilascio; aggiunge profili di sicurezza della risposta HTTP facoltativi, CORS in grado di riconoscere le richieste convalidate, indicazioni sui tentativi limitati, inoltro più rigoroso e sanificazione dell'intestazione di identità, nonché analisi e riscrittura delle intestazioni più sicure."
