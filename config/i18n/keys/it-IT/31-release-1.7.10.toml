released_july_13_2026 = "Rilasciato il 13 luglio 2026"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Aggiunge profili di sicurezza della risposta HTTP facoltativi e CORS in grado di riconoscere le richieste convalidati"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Stabilizza gli esempi di policy Wasm eseguibili e i test richiesti dal gate di rilascio"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Rafforza le intestazioni di identità inoltrate, l'analisi delle intestazioni e le indicazioni sui tentativi per i limiti di capacità"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "stabilizza gli esempi di migrazione Wasm e aggiunge sicurezza facoltativa della risposta HTTP, CORS sensibile alle richieste e limiti di inoltro e intestazione più rigorosi."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Serie di versioni Fluxheim 1.7: esempi di migrazione testati in modo indipendente, callback host limitati, profili di sicurezza della risposta HTTP opzionali, CORS convalidati in base alle richieste, gestione delle identità inoltrate più rigorosa e limiti più forti per Wasm, ACME, snapshot, GeoIP, flussi, TLS, PHP-FPM e servizio di file statici."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 rende ogni famiglia di migrazione testabile in modo indipendente, mantiene il test completo del fumo Wasm nel gate di rilascio e verifica che gli ID simbolici controllati dagli ospiti vengano rifiutati in modo sicuro. Le richiamate host in-process rimangono limitate a operazioni finite e non bloccanti."
wasm_host_callbacks = "Callback dell'host Wasm"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "I callback sono limitati alla decodifica simbolica finita, alle letture di contesto limitate e allo stato limitato. Non possono eseguire operazioni su file, rete, IPC, sospensione, elaborazione o callback di terze parti."
release_testing = "Test di rilascio"
each_migration_family_can_run_independently_while_the_release_gate_also_runs_the_complete_smoke_test_and_an_arbitrary_guest_id_decoder_property_test = "Ciascuna famiglia di migrazione può essere eseguita in modo indipendente, mentre il gate di rilascio esegue anche il test del fumo completo e un test arbitrario delle proprietà del decodificatore ID ospite."
http_response_security = "Sicurezza della risposta HTTP"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "I profili di sicurezza della risposta HTTP sono facoltativi. Inizia con <code>baseline</code>; utilizzare l'isolamento multiorigine solo dopo aver testato ogni script, carattere, immagine, flusso di accesso e risorsa incorporata."
profile = "Profilo"
what_it_does = "Cosa fa"
