r1712_released_july_15_2026 = "Rilasciato il 15 luglio 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Aggiunge metadati di cache, proxy e digest di risposta basati su standard opt-in"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Dimostra il ricaricamento, il rollback, i controlli di integrità e la persistenza del riavvio di snapshot live autenticati"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Aggiunge prove FIPS-backend riproducibili e un ampio rafforzamento del runtime nativo"
r1712_whats_next_summary = "aggiunge metadati degli standard opt-in, prova di rollback degli snapshot autenticati, prove FIPS-backend riproducibili e cache più potente, TLS, Wasm, buffering e limiti di flusso."
r1712_release_series_digest = "Serie di versioni Fluxheim 1.7: cache, proxy e metadati digest di risposta basati su standard opt-in; ricarica e rollback di snapshot live autenticati; prove FIPS-backend riproducibili; aggiornamenti dei processi senza tempi di inattività; esempi di policy Wasm testati in modo indipendente; e cache più potente, TLS, buffering, flusso e limiti di protocollo."
r1712_standards_based_response_metadata = "Metadati di risposta basati su standard"
r1712_response_metadata_intro = "I metadati della risposta sono disabilitati per impostazione predefinita. Abilita solo i campi che ti servono; Fluxheim li deriva dal risultato effettivo della cache, dall'errore del proxy e dai byte di risposta finale senza esporre chiavi di cache, indirizzi di backend, nomi DNS o errori non elaborati."
r1712_field = "Campo"
r1712_what_it_reports = "Cosa riporta"
r1712_cache_status_description = "RFC 9211 risultati della cache come hit, miss, inoltro non aggiornato, riconvalida, scadenza e bypass."
r1712_proxy_status_description = "RFC 9209 dettagli a bassa cardinalità per gli errori generati da Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 sul contenuto del messaggio HTTP finale dopo la compressione."
r1712_repr_digest_description = "SHA-256 solo quando Fluxheim contiene la rappresentazione selezionata completa."
r1712_live_snapshots_and_rollback = "Istantanee live e rollback"
r1712_live_snapshot_intro = "Gli snapshot autenticati possono pubblicare un candidato convalidato, sostituire il router attivo ed eseguire il rollback senza riavviare le normali distribuzioni di solo routing. Ogni richiesta rimane su una generazione di router dall'inizio alla fine."
r1712_snapshot_private_directory = "Conservare l'archivio snapshot in una directory privata dedicata; le directory non private esistenti e le radici del filesystem vengono rifiutate."
r1712_snapshot_process_upgrade = "Utilizzare un aggiornamento del processo quando l'integrità del sistema di bilanciamento del carico in background o i servizi di individuazione sono attivi."
r1712_snapshot_integrity_restart = "Esegui controlli di integrità dello snapshot dopo la pubblicazione o il rollback e verifica che la generazione selezionata sopravviva al riavvio."
r1712_read_snapshot_contract = "Leggi il contratto snapshot completo"
r1712_authorization_cache_bypass = "Le richieste che trasportano <code>Authorization</code> o <code>Proxy-Authorization</code> ignorano sempre la ricerca e l'archiviazione della cache condivisa."
r1712_strict_cache_control = "Le direttive <code>Cache-Control</code> di risposta non valide o in conflitto vengono rifiutate invece di ricorrere ai TTL configurati; <code>s-maxage</code> ha la priorità su <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> e <code>s-maxage</code> vietano il riutilizzo dei prodotti obsoleti dopo la scadenza dell'aggiornamento."
r1712_encrypted_cache_upgrade_note = "Nota sull'aggiornamento della cache crittografata"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 sposta gli oggetti della cache del disco crittografati su dati associati alla radice e chiavi di indice con stato nonce durevole. Il primo avvio contro una radice crittografata precedente e ogni rotazione della chiave locale eliminano intenzionalmente a freddo la cache prima di servire il traffico."
r1712_encrypted_cache_disposable = "Tratta la cache crittografata come un'accelerazione usa e getta, non come l'origine del record."
r1712_encrypted_cache_private_storage = "Fornisci a ogni root della cache un archivio privato persistente e non copiare lo stato nonce tra root indipendenti."
r1712_encrypted_cache_warmup = "Pianificare la capacità di origine per il primo riscaldamento dopo l'aggiornamento o la rotazione delle chiavi."
r1712_client_certificate_revocation = "Revoca del certificato client"
r1712_client_certificate_revocation_intro = "Quando il TLS reciproco deve rifiutare i certificati client revocati, fornire un bundle PEM CRL delimitato. Fluxheim convalida l'intera catena dell'emittente e rifiuta la policy CRL scaduta o incompleta."
r1712_client_certificate_revocation_compliance = "L'autenticazione client richiesta in una modalità di conformità richiesta per FIPS o ISO richiede anche un bundle CRL. L'autenticazione client ordinaria mantiene la revoca come esplicito consenso esplicito."
r1712_fips_backend_evidence = "FIPS prove di backend"
r1712_fips_backend_evidence_intro = "Fluxheim fornisce ambienti di prova CI bloccati separatamente per i profili OpenSSL-FIPS e rustls/AWS-LC-FIPS. Costruiscono ed eseguono il binario del profilo esatto, esercitano downstream e upstream verificato con certificato TLS, rifiutano policy incompatibili e registrano compilatore, provider, dipendenza, binario e identità di immagine."
r1712_fips_backend_evidence_boundary = "Si tratta di prove di backend riproducibili, non di convalida FIPS a livello di prodotto. Mantieni i contenitori di prova separati dalle normali immagini di rilascio ed esamina le prove per l'esatta build che distribuisci."
r1712_read_fips_evidence_guide = "Leggi la guida alle prove FIPS"
r1712_loader_admission = "Controlli di caricamento dei moduli"
r1712_loader_admission_description = "I manifest pubblici dei plugin devono includere un digest SHA-256 fisso. Nell'intero processo vengono compilati al massimo due moduli alla volta. L'output compilato ha un limite predefinito di 32 MiB e non può superare 256 MiB."
r1712_file_identity = "Identità del file"
r1712_file_identity_description = "Fluxheim apre i file plug-in approvati senza seguire i collegamenti, mantiene l'handle del file normale convalidato e legge i byte del modulo da quell'handle senza riaprire il percorso."
