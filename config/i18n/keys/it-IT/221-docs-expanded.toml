header_hooks = "Hook per header"
admission_limits = "Limiti di ammissione"
php_fpm_fallback = "Fallback PHP-FPM"
live_native_http_1_access_decision_hooks_use_priority_ordering_first_deny_wins_composition_and_fail_closed_behaviour = "Gli hook access-decision HTTP/1 nativi live usano ordine di priorità, composizione first-deny-wins e comportamento fail-closed."
request_headers_and_response_headers_hooks_can_set_or_remove_only_allow_listed_synthetic_headers_such_as_the_policy_tier_example = "Gli hook <code>request-headers</code> e <code>response-headers</code> possono impostare o rimuovere solo header sintetici consentiti, come nell’esempio policy-tier."
process_wide_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "I limiti di esecuzione per processo, plugin e attachment impediscono lavoro plugin non limitato."
