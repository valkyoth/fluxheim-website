unsupported_native_runtime_shapes_still_fail_closed_with_explicit_blockers_instead_of_falling_back_to_legacy_adapters = "Le forme runtime native non supportate continuano a non riuscire a chiudersi con blocchi espliciti invece di ricorrere ai adapter legacy."
for_non_loopback_plaintext_peer_fill_urls_configure_cache_peer_fill_shared_secret_file_so_peer_responses_are_signed_before_they_can_be_stored = "Per il testo in chiaro non-loopback peer-fill URLs, configurare <code>cache.peer_fill.shared_secret_file</code> in modo che le risposte del peer vengano firmate prima di poter essere archiviate."
version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Aggiorna la struttura 1.6.36 con pulizia del proxy nativo, API di proprietà delle crate, rimozione del retaggio Pingora, immagini observability deterministiche e test di regressione HTTP/1 chunked."
version_1_6_36_pins_the_prometheus_and_jaeger_smoke_test_images_to_stable_tags_so_local_and_ci_observability_checks_pull_deterministic_containers = "Aggiorna la struttura 1.6.36 con pulizia del proxy nativo, API di proprietà delle crate, rimozione del retaggio Pingora, immagini observability deterministiche e test di regressione HTTP/1 chunked."
fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 mantiene Wasm opzionale e aggiunge la prima famiglia limitata di hook HTTP/1 nativi per header di richiesta e risposta. I plugin possono fare modifiche sintetiche di policy approvate, ma non ricevono ancora header grezzi, body, accesso al filesystem, accesso di rete, chiavi private o API di amministrazione."
