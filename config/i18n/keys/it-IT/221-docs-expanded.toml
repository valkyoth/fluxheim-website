version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "La versione 1.6.37 è la pulizia finale dei confini dei crate prima di Wasm: ACME, observability, cache, load-balancer, PHP-FPM e interni del runtime nativo passano in moduli più piccoli di proprietà dei crate, mantenendo stabile il comportamento del runtime."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "La versione 1.6.37 rende più affidabile lo smoke locale di observability ritentando avvii usa-e-getta di Prometheus e Jaeger con porte appena allocate quando le porte host-network competono con altri processi runner."

