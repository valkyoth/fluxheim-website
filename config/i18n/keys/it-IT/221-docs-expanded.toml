fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 mantiene Wasm opzionale e aggiunge hook route-decision HTTP/1 nativi vincolati accanto agli hook access-decision e header. I plugin possono continuare, negare o selezionare rami di rotta canary e mirror configurati, ma non possono ancora inventare upstream, aggirare il matching delle rotte, sovrascrivere la policy di accesso di Fluxheim o ricevere header grezzi, body, accesso al filesystem, rete, chiavi private o API admin."
route_decisions = "Decisioni di rotta"
route_decision_hooks_can_continue_deny_or_select_only_configured_matching_canary_and_mirror_route_branches = "Gli hook <code>route-decision</code> possono solo continuare, negare o selezionare rami di rotta <code>canary</code> e <code>mirror</code> configurati e corrispondenti."
selected_route_policy = "Policy della rotta selezionata"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "ACL, rate limit, limiti di concorrenza, body limit, redirect e header policy della rotta selezionata continuano a essere eseguiti dopo una decisione di rotta Wasm."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 mantiene Wasm opzionale e aggiunge hook cache-policy HTTP/1 nativi delimitati accanto agli hook access-decision, header e route-decision. I plugin possono continuare il normale comportamento della cache, passare all origin, bypassare la cache, saltare lo storage o negare, ma non possono ancora modificare cache key grezze, TTL, tag, header di risposta o metadati archiviati, né ricevere header grezzi, body, accesso al filesystem, accesso di rete, chiavi private o API admin."
cache_decisions = "Decisioni cache"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "Gli hook <code>cache-lookup</code> possono continuare, passare all origin, bypassare o negare. Gli hook <code>cache-store</code> possono continuare, saltare lo storage o negare prima delle scritture nella cache memoria/disco."
cache_policy_limits = "Limiti cache-policy"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Gli hook cache usano un limite di ammissione separato a livello di processo, così le route cache-policy molto attive non possono sottrarre capacità agli hook access, route o header."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 mantiene Wasm opzionale ed estende gli hook cache-policy HTTP/1 nativi delimitati insieme agli hook access-decision, header e route-decision. I plugin possono continuare il normale comportamento della cache, passare all origin, bypassare la cache, saltare lo storage, negare, selezionare varianti fisse mobile/desktop della cache key e allegare TTL, tag e metadati degli header archiviati fissi per cache-store, ma non possono emettere byte arbitrari di cache key, TTL arbitrari, tag arbitrari, header di risposta grezzi, body, accesso al filesystem, accesso di rete, chiavi private o admin APIs."
cache_metadata = "Metadati della cache"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "Gli hook <code>cache-lookup</code> aggiungono varianti fisse mobile/desktop della cache key. Gli hook <code>cache-store</code> impostano TTL, tag e metadati degli header archiviati fissi."
module_identity = "Identità del modulo"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "I limiti di esecuzione process-wide, cache-global, cache-vhost, per-plugin e per-attachment impediscono lavoro non delimitato dei plugin."
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 mantiene Wasm opzionale e aggiunge la prima anteprima facoltativa della compatibilità ABI Proxy-Wasm. Introduce uno spazio dei nomi separato per le chiamate host, protetto da feature gate, con convalida rigorosa del manifest e gestione deterministica fail-closed delle chiamate non supportate; non afferma che qualsiasi plugin Proxy-Wasm esistente funzioni senza modifiche."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "I moduli compilati sono legati al digest del plugin, alla versione ABI, alla superficie funzionale degli hook, allo spazio dei nomi delle chiamate host e alla versione Fluxheim, così il riuso futuro non può superare i confini di release, funzionalità o ABI."
proxy_wasm_preview = "Anteprima Proxy-Wasm"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Compila con <code>wasm-proxy-abi</code>, abilita <code>allow_preview_abi</code> e dichiara sia l'ABI <code>proxy-wasm-preview</code> sia lo spazio dei nomi delle chiamate host. Le importazioni e le chiamate non supportate vengono rifiutate in modalità fail-closed."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Per i deployment multi-tenant, abilita <code>[server.host_routing].strict = true</code>, così un'identità host mancante o non valida restituisce <code>400</code> e gli host sconosciuti restituiscono <code>421</code> anziché raggiungere il sito predefinito."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Mantieni i file di configurazione e ogni directory padre esistente sotto una proprietà attendibile e non scrivibili dal gruppo o da altri utenti."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Sostituisci il processo quando cambiano TLS, listener, stream, UDP, ACME, eliminazione della cache, tracing o impostazioni del processo PHP-FPM gestito; il normale routing e le policy applicate durante la richiesta possono usare il ricaricamento di uno snapshot."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Usa un volume persistente scrivibile dimensionato per la policy della cache. Assegna a ogni replica storage-bin un volume locale o RWO dedicato; usa storage RWX condiviso solo con blocco tra nodi verificato e applicazione del singolo writer a livello di orchestrazione."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Usa una root storage-bin per ogni processo Fluxheim in esecuzione; la proprietà usa un blocco consultivo del filesystem e le root condivise con più writer non sono sicure senza un blocco esterno verificato."
