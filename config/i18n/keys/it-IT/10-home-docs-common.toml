events_no_sensitive_text = "Questi eventi non contengono IP raw, identificatori utente, valori cookie, fingerprint browser, request body, header authorization o query string complete."
what_we_collect = "Cosa raccogliamo"
privacy_collect_text = "Il sito registra metriche operative aggregate: conteggi request, page view, lingua selezionata, route pagina normalizzata, sezione, classe status HTTP, durata request, click download, click redirect GitHub e tempo visibile approssimativo."
country_aggregation_text = "L'operatore può abilitare opzionalmente l'aggregazione per paese. Quando abilitata, il server deriva un codice paese in memoria ed esporta solo il codice paese o unknown."
what_we_do_not_collect = "Cosa non raccogliamo"
