data_minimisation = "Minimizzazione dei dati"
gdpr_minimisation_text = "Le metriche usano label bounded come locale, route normalizzata, sezione, classe status, download artifact, target GitHub e codice paese opzionale. L'implementazione è progettata per non memorizzare o esportare IP raw o identificatori tracking a livello utente."
github_redirect_privacy_text = "I click outbound verso GitHub vengono contati in forma aggregata prima del redirect del browser a GitHub. GitHub poi elabora la request secondo i propri termini e la propria privacy policy."
your_rights = "I tuoi diritti"
