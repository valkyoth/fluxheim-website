privacy_mode_and_geoip_are_mutually_exclusive_privacy = "<code>privacy-mode</code> and <code>geoip</code> are mutually exclusive. Privacy builds reject GeoIP lookup and Geo-Context metadata entirely."
are_mutually_exclusive_privacy_builds_reject_geoip_lookup = "are mutually exclusive. Privacy builds reject GeoIP lookup and Geo-Context metadata entirely."
local_databases = "Local Databases"
fluxheim_reads_local_mmdb_files_through_a_provider = "Fluxheim reads local MMDB files through a provider-agnostic layer. The initial providers are labels for compatible MMDB datasets:"
