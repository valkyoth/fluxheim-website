european_circl_geo_open_mmdb_compatible_datasets = ": European CIRCL Geo Open MMDB-compatible datasets."
fluxheim_does_not_download_or_update_databases_in = "Fluxheim does not download or update databases in-process. Use an external systemd timer, package job, or sidecar to fetch and verify database files, then reload Fluxheim. Database files are opened as regular files and symlink leaf paths are rejected."
each_mmdb_file_is_capped_at_512_mib = "Each MMDB file is capped at 512 MiB at both metadata and read time. A single loaded GeoIP runtime is capped at 1 GiB of MMDB data, so keep the ordered fallback set small. During hot reload, the old and new runtimes can briefly coexist while in-flight requests finish, so size host/container memory for that temporary overlap."
databases_are_evaluated_in_order_when = "Databases are evaluated in order. When"
when_fallback_enabled_true_fluxheim_fills_missing_country = "When <code>fallback_enabled = true</code>, Fluxheim fills missing country or ASN fields from later databases when possible. When it is false, Fluxheim consults only the first configured database."
when_country_or_asn_access_rules_are_configured = "When country or ASN access rules are configured, Fluxheim checks the loaded MMDB database type strings and emits a security warning if no loaded database appears to provide the required record family. This is a diagnostic guard, not a substitute for testing policy behavior with known source IPs."
access_policy = "Access Policy"
geo_rules_live_on_the_existing_vhost_and = "Geo rules live on the existing vhost and route access policy. Country codes are ISO alpha-2 uppercase values. ASN values are numeric and must be greater than zero."
vhost_policy_runs_before_route_policy_geo_allow = "Vhost policy runs before route policy. Geo allow lists fail closed when no Geo-Context is available for the client IP. Geo deny lists only deny when the resolved country or ASN matches."
when_geoip_is_compiled_and_a_lookup_succeeds = "When <code>geoip</code> is compiled and a lookup succeeds, structured access logs include:"
is_compiled_and_a_lookup_succeeds_structured_access = "is compiled and a lookup succeeds, structured access logs include:"
geoip_metrics_and_trace_attributes_remain_bounded_follow = "GeoIP metrics and trace attributes remain bounded follow-up work; do not add high-cardinality labels from city, latitude/longitude, or raw database fields."

