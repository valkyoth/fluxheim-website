r1712_released_july_15_2026 = "Released July 15, 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Adds opt-in standards-based cache, proxy, and response-digest metadata"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Proves authenticated live snapshot reload, rollback, integrity checks, and restart persistence"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Adds reproducible FIPS-backend evidence and broad native runtime hardening"
r1712_whats_next_summary = "adds opt-in standards metadata, authenticated snapshot rollback proof, reproducible FIPS-backend evidence, and stronger cache, TLS, Wasm, buffering, and stream boundaries."
r1712_release_series_digest = "Fluxheim 1.7 release series: opt-in standards-based cache, proxy, and response-digest metadata; authenticated live snapshot reload and rollback; reproducible FIPS-backend evidence; zero-downtime process upgrades; independently tested Wasm policy examples; and stronger cache, TLS, buffering, stream, and protocol boundaries."
r1712_standards_based_response_metadata = "Standards-based response metadata"
r1712_response_metadata_intro = "Response metadata is disabled by default. Enable only the fields you need; Fluxheim derives them from the actual cache result, proxy failure, and final response bytes without exposing cache keys, backend addresses, DNS names, or raw errors."
r1712_field = "Response field"
r1712_what_it_reports = "Reported information"
r1712_cache_status_description = "RFC 9211 cache outcomes such as hit, miss, stale forwarding, revalidation, expiry, and bypass."
r1712_proxy_status_description = "RFC 9209 low-cardinality details for failures generated by Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 over the final HTTP message content after compression."
r1712_repr_digest_description = "SHA-256 only when Fluxheim holds the complete selected representation."
r1712_live_snapshots_and_rollback = "Live snapshots and rollback"
r1712_live_snapshot_intro = "Authenticated snapshots can publish a validated candidate, replace the live router, and roll back without restarting normal routing-only deployments. Each request stays on one router generation from start to finish."
r1712_snapshot_private_directory = "Keep the snapshot store in a dedicated private directory; existing non-private directories and filesystem roots are rejected."
r1712_snapshot_process_upgrade = "Use a process upgrade when background load-balancer health or discovery services are active."
r1712_snapshot_integrity_restart = "Run snapshot integrity checks after publication or rollback and verify the selected generation survives restart."
r1712_read_snapshot_contract = "Read the complete snapshot contract"
r1712_authorization_cache_bypass = "Requests carrying <code>Authorization</code> or <code>Proxy-Authorization</code> always bypass shared-cache lookup and storage."
r1712_strict_cache_control = "Malformed or conflicting response <code>Cache-Control</code> directives are rejected instead of falling back to configured TTLs; <code>s-maxage</code> takes priority over <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code>, and <code>s-maxage</code> prohibit stale reuse after freshness expires."
r1712_encrypted_cache_upgrade_note = "Encrypted-cache upgrade note"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 moves encrypted disk cache objects to root-bound data and index keys with durable nonce state. The first startup against an older encrypted root, and every local-key rotation, intentionally cold-purges that cache before serving traffic."
r1712_encrypted_cache_disposable = "Encrypted cache data is disposable and must not be treated as authoritative data."
r1712_encrypted_cache_private_storage = "Give every cache root persistent private storage and do not copy nonce state between independent roots."
r1712_encrypted_cache_warmup = "Make sure the origin server can handle the first cache warm-up after an upgrade or key rotation."
r1712_client_certificate_revocation = "Client certificate revocation"
r1712_client_certificate_revocation_intro = "When mutual TLS must reject revoked client certificates, provide a bounded PEM CRL bundle. Fluxheim validates the complete issuer chain and rejects expired or incomplete CRL policy."
r1712_client_certificate_revocation_compliance = "Required client authentication in a FIPS or ISO-required compliance mode also requires a CRL bundle. Ordinary client authentication keeps revocation as an explicit opt-in."
r1712_fips_backend_evidence = "FIPS backend evidence"
r1712_fips_backend_evidence_intro = "Fluxheim provides separately pinned CI proof environments for the OpenSSL-FIPS and rustls/AWS-LC-FIPS profiles. They build and run the exact profile binary, exercise downstream and certificate-verified upstream TLS, reject incompatible policy, and record compiler, provider, dependency, binary, and image identities."
r1712_fips_backend_evidence_boundary = "This is reproducible backend evidence, not product-level FIPS validation. Keep the proof containers separate from normal release images and review the evidence for the exact build you deploy."
r1712_read_fips_evidence_guide = "Read the FIPS evidence guide"
r1712_loader_admission = "Module loading controls"
r1712_loader_admission_description = "Public plugin manifests must include a fixed SHA-256 digest. At most two modules compile at once across the process. Compiled output defaults to a 32 MiB limit and cannot exceed 256 MiB."
r1712_file_identity = "Plugin file identity"
r1712_file_identity_description = "Fluxheim opens approved plugin files without following links, retains the validated regular-file handle, and reads module bytes from that handle without reopening the path."
