acme_issuers_that_require_external_account_binding_such_as_actalis_and_google_trust_services_need_a = "<p>ACME issuers that require External Account Binding, such as Actalis and Google Trust Services, need a key identifier and HMAC key. Fluxheim supports environment variables and files for these values, but production deployments should prefer file-backed secrets:</p>"
