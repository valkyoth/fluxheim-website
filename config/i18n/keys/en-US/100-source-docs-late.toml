account_credentials = "<h2 id=\"account-credentials\">Account Credentials</h2>"
acme_account_credentials_contain_account_identity_and_private_key_material_they_are_not_kept_in_the = "<p>ACME account credentials contain account identity and private key material. They are not kept in the TOML config. Fluxheim derives their storage path from the issuer name and writes them below <code>tls.acme.storage</code>:</p>"
the_credential_file_is_bounded_parsed_as_json_written_through_a_temporary_file_installed_with_owner = "<p>The credential file is bounded, parsed as JSON, written through a temporary file, installed with owner-only permissions on Unix, and opened without following the final symlink on Linux. The exact path segment is generated by Fluxheim, so issuer names cannot create path traversal or hidden filesystem locations.</p>"
when_fluxheim_is_built_with_acme_client_it_can_load_existing_credentials_from_that_path_or_create_a = "<p>When Fluxheim is built with <code>acme-client</code>, it can load existing credentials from that path or create a new issuer account through <code>instant-acme</code> and immediately persist the returned credentials. EAB HMAC keys are treated as base64/base64url encoded ACME MAC keys before they are passed to the issuer client. The same feature also contains the live HTTP-01 and rustls TLS-ALPN-01 order paths: create order, publish challenge material, mark challenges ready, finalize the generated CSR, retrieve the certificate chain, install it atomically, and clean up challenge files.</p>"
production_packages_and_container_images_ship_the_fluxheim_acme_companion_as_the_preferred_external = "<p>Production packages and container images ship the <code>fluxheim-acme</code> companion as the preferred external renewal command. It uses the same ACME engine, storage layout, issuer credentials, and vhost target planner as the integrated gateway, but keeps renewal scheduling outside the traffic-serving process:</p>"
by_default_renew_observes_the_managed_certificate_files_and_attempts_only_missing_or_due_certificate = "<p>By default <code>renew</code> observes the managed certificate files and attempts only missing or due certificates. If nothing needs renewal, it exits successfully with <code>acme attempted: 0</code> and a status message saying no certificates are due. First issuance normally does not need <code>--force-renew</code>: missing certificate files are due targets. The command prints every target with <code>status=due</code>, <code>status=skipped</code>, or <code>status=forced</code>, then reports per-target <code>renewed:</code> and <code>failed:</code> lines. For HTTP-01 failures after challenge files are published, the failure includes <code>published_http_01=</code> URLs so operators can test the exact public challenge paths that the issuer should have reached. It exits non-zero if any target failed, while still reporting successful renewals from the same run.</p>"
fluxheim_acme_renew_also_asks_the_running_gateway_to_reload_its_certificate_handles_after_a_successf = "<p><code>fluxheim-acme renew</code> also asks the running gateway to reload its certificate handles after a successful renewal when <code>server.process.certificate_reload_sock</code> is reachable. Use <code>reload</code> explicitly after manually installing managed files:</p>"
the_legacy_integrated_command_is_kept_for_manual_compatibility_but_new_automation_should_use_fluxhei = "<p>The legacy integrated command is kept for manual compatibility, but new automation should use <code>fluxheim-acme</code>:</p>"
use_force_renew_only_for_deliberate_emergency_rotation_or_testing_when_you_really_need_to_reissue_ce = "<p>Use <code>--force-renew</code> only for deliberate emergency rotation or testing when you really need to reissue certificates that are still valid; repeated forced renewals can hit issuer rate limits:</p>"
all_is_accepted_as_a_backward_compatible_alias_for_force_renew_but_it_prints_a_deprecation_warning_a = "<p><code>--all</code> is accepted as a backward-compatible alias for <code>--force-renew</code>, but it prints a deprecation warning and should not be used in new automation.</p>"
official_rpm_and_container_release_assets_include_acme_client_by_default_if_you_compile_from_source = "<p>Official RPM and container release assets include <code>acme-client</code> by default. If you compile from source with a custom feature list, include it explicitly:</p>"
