keep_the_previous_certificate_available_until_the_new_one_is_active = "<li>Keep the previous certificate available until the new one is active.</li>"
the_current_install_helper_implements_the_filesystem_side_of_that_contract_it_validates_basic_pem_sh = "<p>The current install helper implements the filesystem side of that contract. It validates basic PEM shape and size, writes temporary files next to the managed destination, rejects symlinked directories or destination files, keeps backups of existing files while staging, and cleans temporary files on failure. Full certificate/key matching and domain coverage validation belongs in the ACME client step before this helper is called. Failed issuer calls and failed certificate installs do not remove the previous active certificate.</p>"
no_downtime_reload = "<h2 id=\"no-downtime-reload\">No-Downtime Reload</h2>"
runtime_state_should_be_immutable_snapshots_behind_an_atomic_pointer_existing_requests_keep_their_cu = "<p>Runtime state should be immutable snapshots behind an atomic pointer. Existing requests keep their current snapshot. New requests use the latest snapshot after reload. Fluxheim&#x27;s proxy routing state already uses this model for vhost, upstream, cache, and static web policy snapshots. This model applies to:</p>"
vhost_routing = "<li>vhost routing</li>"
