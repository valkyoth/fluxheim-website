certificate_lookup_maps = "<li>certificate lookup maps</li>"
listener_changes_are_process_level_changes_and_should_use_pingoras_zero_downtime_upgrade_path_rather = "<p>Listener changes are process-level changes and should use Pingora&#x27;s zero-downtime upgrade path rather than in-place mutation.</p>"
reload_classification = "<h2 id=\"reload-classification\">Reload Classification</h2>"
fluxheim_classifies_a_config_change_before_applying_it = "<p>Fluxheim classifies a config change before applying it:</p>"
noop_old_and_new_config_are_identical = "<li><code>Noop</code>: old and new config are identical.</li>"
snapshot_safe_for_in_place_snapshot_swap = "<li><code>Snapshot</code>: safe for in-place snapshot swap.</li>"
processupgrade_requires_pingoras_process_level_zero_downtime_upgrade_path = "<li><code>ProcessUpgrade</code>: requires Pingora&#x27;s process-level zero-downtime upgrade path.</li>"
operators_can_check_the_impact_of_a_planned_config_change = "<p>Operators can check the impact of a planned config change:</p>"
durable_config_history_and_rollback_commands_are_documented_in_config_snapshots_and_rollback = "<p>Durable config history and rollback commands are documented in <a href=\"config-snapshots.html\" class=\"text-cyan-400 hover:text-cyan-300\">Config Snapshots And Rollback</a>.</p>"
snapshot_reload_is_intended_for_routing_cache_policy_static_web_policy_and_certificate_lookup_change = "<p>Snapshot reload is intended for routing, cache policy, static web policy, and certificate lookup changes that do not alter listeners or startup-owned background services.</p>"
