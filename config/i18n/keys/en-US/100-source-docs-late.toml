container_renewal = "<h2 id=\"container-renewal\">Container Renewal</h2>"
runtime_images_include_both_usr_local_bin_fluxheim_and_usr_local_bin_fluxheim_acme_the_companion_can = "<p>Runtime images include both <code>/usr/local/bin/fluxheim</code> and <code>/usr/local/bin/fluxheim-acme</code>. The companion can run inside the already running gateway container with <code>podman exec</code>, or as a separate one-shot container. In both cases it must see the same config, ACME storage, secrets, and <code>/run/fluxheim</code> directory as the gateway.</p>"
the_gateway_and_companion_must_share_server_process_certificate_reload_sock_the_packaged_container_c = "<p>The gateway and companion must share <code>server.process.certificate_reload_sock</code>. The packaged container configs use:</p>"
keep_the_host_side_run_directory_private_to_the_container_runtime_user_and_mount_it_read_write_into = "<p>Keep the host-side run directory private to the container runtime user and mount it read-write into both containers:</p>"
if_the_gateway_container_is_already_running_the_simplest_operational_commands_are = "<p>If the gateway container is already running, the simplest operational commands are:</p>"
podman_exec_naturally_shares_the_gateway_container_filesystem_secrets_and_reload_socket_it_is_useful = "<p><code>podman exec</code> naturally shares the gateway container filesystem, secrets, and reload socket. It is useful for manual checks, but scheduled renewals are often cleaner as a one-shot companion container:</p>"
use_status_before_renew_when_testing_a_new_mount_layout = "<p>Use <code>status</code> before <code>renew</code> when testing a new mount layout:</p>"
for_compose_keep_fluxheim_and_fluxheim_acme_on_the_same_network_and_use_the_same_bind_mounts_the_com = "<p>For Compose, keep <code>fluxheim</code> and <code>fluxheim-acme</code> on the same network and use the same bind mounts. The companion service should override only the entrypoint and command:</p>"
run_it_on_demand_with = "<p>Run it on demand with:</p>"
