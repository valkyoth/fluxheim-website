fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 keeps Wasm optional and adds constrained native HTTP/1 route-decision hooks alongside access-decision and header hooks. Plugins can continue, deny, or select configured canary and mirror route branches, but they still cannot invent upstreams, bypass route matching, override Fluxheim access policy, or receive raw headers, bodies, filesystem access, network access, private keys, or admin APIs."
