fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 keeps Wasm optional and adds bounded native HTTP/1 cache-policy hooks alongside access-decision, header, and route-decision hooks. Plugins can continue normal cache behavior, pass through origin, bypass cache, skip storage, or deny, but they still cannot mutate raw cache keys, TTLs, tags, response headers, stored metadata, or receive raw headers, bodies, filesystem access, network access, private keys, or admin APIs."
cache_decisions = "Cache decisions"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hooks can continue, pass, bypass, or deny. <code>cache-store</code> hooks can continue, skip storage, or deny before memory/disk cache writes."
cache_policy_limits = "Cache-policy limits"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hooks use a separate process-wide admission ceiling so hot cache-policy routes cannot starve access, route, or header hooks."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 keeps Wasm optional and extends bounded native HTTP/1 cache-policy hooks alongside access-decision, header, and route-decision hooks. Plugins can continue normal cache behavior, pass through origin, bypass cache, skip storage, deny, select fixed mobile/desktop cache-key variants, and attach fixed cache-store TTL, tag, and stored-header metadata, but they still cannot emit arbitrary cache-key bytes, arbitrary TTLs, arbitrary tags, raw response headers, bodies, filesystem access, network access, private keys, or admin APIs."
cache_metadata = "Cache metadata"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hooks can add fixed mobile/desktop cache-key variants. <code>cache-store</code> hooks can set fixed TTL, tag, and stored-header metadata."
module_identity = "Module identity"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Process-wide, cache-global, cache-vhost, per-plugin, and per-attachment execution ceilings prevent unbounded plugin work."
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 keeps Wasm optional and adds the first opt-in Proxy-Wasm ABI compatibility preview. It establishes a separate, feature-gated host-call namespace with strict manifest validation and deterministic fail-closed handling for unsupported calls; it does not claim that arbitrary existing Proxy-Wasm plugins run unchanged."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Compiled modules are tied to plugin digest, ABI version, hook feature surface, host-call namespace, and Fluxheim version so future reuse cannot cross release, feature, or ABI boundaries."
proxy_wasm_preview = "Proxy-Wasm preview"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Build with <code>wasm-proxy-abi</code>, enable <code>allow_preview_abi</code>, and declare both the <code>proxy-wasm-preview</code> ABI and host-call namespace. Unsupported imports and calls fail closed."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "For multi-tenant deployments, enable <code>[server.host_routing].strict = true</code> so missing or invalid host identity returns <code>400</code> and unknown hosts return <code>421</code> instead of reaching the default site."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Keep config files and every existing parent directory under trusted ownership and not writable by group or other users."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Replace the process when TLS, listeners, streams, UDP, ACME, cache purging, tracing, or managed PHP-FPM process settings change; ordinary routing and request-time policy can use a snapshot reload."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Persistent writable volume sized for the cache policy. Give each storage-bin replica its own local or RWO volume; use shared RWX storage only with verified cross-node locking and orchestration-level single-writer enforcement."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Use one storage-bin root per running Fluxheim process; ownership uses an advisory filesystem lock and shared multi-writer roots are unsafe without verified external locking."
