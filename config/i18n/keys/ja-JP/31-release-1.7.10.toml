http_response_security = "HTTPレスポンスセキュリティ"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "HTTPレスポンスセキュリティプロファイルは任意です。まず<code>baseline</code>を使用してください。クロスオリジン分離は、すべてのスクリプト、フォント、画像、サインイン処理、埋め込みリソースをテストしてから使用してください。"
profile = "プロファイル"
