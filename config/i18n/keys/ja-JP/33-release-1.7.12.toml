r1712_released_july_15_2026 = "2026年7月15日リリース"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "任意で有効化できる、標準仕様に準拠したキャッシュ・プロキシ・応答ダイジェストのメタデータを追加"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "認証付きスナップショットの反映、ロールバック、整合性検査、再起動後の状態保持を実動作で検証"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "再現可能なFIPSバックエンドの検証証跡を追加し、ネイティブ実行基盤を幅広く堅牢化"
r1712_whats_next_summary = "任意で有効化できる標準メタデータ、認証付きスナップショットのロールバック検証、再現可能なFIPSバックエンドの証跡に加え、キャッシュ、TLS、Wasm、バッファリング、ストリームの境界を強化します。"
r1712_release_series_digest = "Fluxheim 1.7系列：任意で有効化できる標準準拠のキャッシュ・プロキシ・応答ダイジェストメタデータ、認証付きスナップショットの即時反映とロールバック、再現可能なFIPSバックエンドの検証証跡、無停止プロセス更新、個別に検証済みのWasmポリシー例、キャッシュ・TLS・バッファリング・ストリーム・プロトコル境界の強化。"
r1712_standards_based_response_metadata = "標準仕様に準拠した応答メタデータ"
r1712_response_metadata_intro = "応答メタデータは既定で無効です。必要な項目だけを有効にしてください。Fluxheimは、キャッシュキー、バックエンドアドレス、DNS名、生のエラー内容を公開せず、実際のキャッシュ結果、プロキシ障害、最終的な応答バイト列から値を生成します。"
r1712_field = "項目"
r1712_what_it_reports = "通知する内容"
r1712_cache_status_description = "RFC 9211に基づき、ヒット、ミス、期限切れ応答の転送、再検証、失効、バイパスなどのキャッシュ結果を示します。"
r1712_proxy_status_description = "Fluxheimが生成した障害について、RFC 9209に基づく種類の限られた情報を示します。"
r1712_content_digest_description = "圧縮後の最終的なHTTPメッセージ本文に対するRFC 9530 SHA-256値です。"
r1712_repr_digest_description = "Fluxheimが選択された表現全体を保持している場合に限り、SHA-256値を付与します。"
r1712_live_snapshots_and_rollback = "スナップショットの即時反映とロールバック"
r1712_live_snapshot_intro = "認証付きスナップショットでは、検証済みの設定候補を公開して稼働中のルーターを差し替え、通常のルーティング専用構成を再起動せずに元へ戻せます。各リクエストは処理の開始から終了まで同じルーター世代を使います。"
r1712_snapshot_private_directory = "スナップショット保存先には専用の非公開ディレクトリを使用してください。既存の公開範囲が広いディレクトリやファイルシステムのルートは拒否されます。"
r1712_snapshot_process_upgrade = "バックグラウンドでロードバランサーのヘルスチェックまたは検出サービスが動作している場合は、プロセス更新を使用してください。"
r1712_snapshot_integrity_restart = "公開またはロールバック後にスナップショットの整合性を検査し、選択した世代が再起動後も維持されることを確認してください。"
r1712_read_snapshot_contract = "スナップショットの完全な仕様を読む"
r1712_authorization_cache_bypass = "<code>Authorization</code>または<code>Proxy-Authorization</code>を含むリクエストは、共有キャッシュの参照と保存を常に回避します。"
r1712_strict_cache_control = "形式が不正または内容が競合する応答の<code>Cache-Control</code>ディレクティブは、設定済みTTLへフォールバックせず拒否されます。<code>s-maxage</code>は<code>max-age</code>より優先されます。"
r1712_mandatory_revalidation = "<code>must-revalidate</code>、<code>proxy-revalidate</code>、<code>s-maxage</code>が指定されている場合、鮮度の期限を過ぎた応答は再利用できません。"
r1712_encrypted_cache_upgrade_note = "暗号化キャッシュ更新時の注意"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12では、暗号化ディスクキャッシュのデータキーと索引キーをキャッシュルートごとに分離し、nonceの状態を永続化します。旧形式の暗号化キャッシュルートを初めて起動するときと、ローカルキーを更新するときは、トラフィックを受け付ける前に対象キャッシュを意図的に全消去します。"
r1712_encrypted_cache_disposable = "暗号化キャッシュは性能向上のための破棄可能なデータとして扱い、正本にはしないでください。"
r1712_encrypted_cache_private_storage = "各キャッシュルートには永続的な非公開ストレージを割り当て、独立したルート間でnonce状態を複製しないでください。"
r1712_encrypted_cache_warmup = "更新またはキー切り替え後の初回キャッシュ再構築に備え、オリジンサーバーの処理容量を確保してください。"
r1712_client_certificate_revocation = "クライアント証明書の失効確認"
r1712_client_certificate_revocation_intro = "相互TLSで失効済みクライアント証明書を拒否する場合は、サイズを制限したPEM形式のCRL一式を指定します。Fluxheimは発行者チェーン全体を検証し、期限切れまたは不足のあるCRL設定を拒否します。"
r1712_client_certificate_revocation_compliance = "FIPSまたはISO準拠を必須とするモードでクライアント認証を要求する場合は、CRL一式も必須です。通常のクライアント認証では、失効確認は明示的に有効化する機能です。"
r1712_fips_backend_evidence = "FIPSバックエンドの検証証跡"
r1712_fips_backend_evidence_intro = "Fluxheimは、OpenSSL-FIPSとrustls/AWS-LC-FIPSの各プロファイル向けに、依存関係を固定した個別のCI検証環境を提供します。対象プロファイルのバイナリを実際にビルドして実行し、下流TLSと証明書検証付き上流TLSを試験し、非互換な設定を拒否したうえで、コンパイラ、暗号プロバイダー、依存関係、バイナリ、イメージの識別情報を記録します。"
r1712_fips_backend_evidence_boundary = "これは再現可能なバックエンド検証の証跡であり、製品全体のFIPS認証を意味しません。検証用コンテナは通常のリリースイメージと分離し、実際に配備するビルドと一致する証跡を確認してください。"
r1712_read_fips_evidence_guide = "FIPS検証証跡のガイドを読む"
r1712_loader_admission = "読み込み時の受け入れ制御"
r1712_loader_admission_description = "公開マニフェストにはSHA-256固定値が必要です。コンパイルはプロセス全体で同時に最大2件までで、生成物の上限は既定で32 MiB、絶対上限は256 MiBです。"
r1712_file_identity = "ファイルの同一性"
r1712_file_identity_description = "Fluxheimはシンボリックリンクをたどらずに許可済みプラグインファイルを開き、検証した通常ファイルのハンドルを保持します。パスを開き直さず、そのハンドルからモジュールのバイト列を読み込みます。"
