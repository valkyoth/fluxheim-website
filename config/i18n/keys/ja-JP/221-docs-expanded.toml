selected_route_policy = "選択されたルートのポリシー"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "選択されたルートの ACL、rate limit、concurrency limit、body limit、redirect、header policy は、Wasm ルート判定の後も実行されます。"

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 では Wasm は引き続き任意機能で、access-decision、header、route-decision hooks に加えて、制限付き native HTTP/1 cache-policy hooks を追加します。Plugins は通常の cache 動作の継続、origin への pass-through、cache bypass、storage skip、deny を選べますが、raw cache keys、TTLs、tags、response headers、stored metadata を変更したり、raw headers、bodies、filesystem access、network access、private keys、admin APIs を受け取ったりすることはできません。"
cache_decisions = "Cache 判断"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hooks は continue、pass、bypass、deny を選べます。<code>cache-store</code> hooks は memory/disk cache writes の前に continue、skip storage、deny を選べます。"
cache_policy_limits = "Cache-policy の制限"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hook は独立した process-wide admission 上限を使うため、高負荷の cache-policy route が access、route、header hook の実行枠を使い尽くすことはありません。"
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 では Wasm は引き続き任意機能で、access-decision、header、route-decision hook に加えて、制限付き native HTTP/1 cache-policy hook を拡張します。Plugin は通常の cache 動作の継続、origin への受け渡し、cache bypass、storage skip、deny、固定 mobile/desktop cache-key variant の選択、固定 cache-store TTL、tag、stored-header metadata の付与を行えます。ただし、任意の cache-key byte、任意の TTL、任意の tag、生の response-header、body、filesystem access、network access、private key、admin API は扱えません。"
cache_metadata = "Cache メタデータ"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hook は固定の mobile/desktop cache-key variant を追加できます。<code>cache-store</code> hook は固定の TTL、tag、stored-header metadata を設定できます。"
module_identity = "モジュール識別情報"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "process-wide、cache-global、cache-vhost、per-plugin、per-attachment の実行上限により、plugin work が無制限に増えることを防ぎます。"
fluxheim_1_7_8_keeps_wasm_optional_and_adds_wasi_preview_1_for_access_decision_plugins_clock_and_randomness_need_separate_grants_filesystem_network_process_and_other_host_access_stay_unavailable_unsupported_imports_fail_closed = "Fluxheim 1.7.8 でも Wasm は任意機能です。アクセス判定プラグイン向けに WASI Preview 1 を追加しました。時計と乱数は個別に許可する必要があり、ファイルシステム、ネットワーク、プロセスなど、その他のホスト機能にはアクセスできません。未対応のインポートは fail-closed で拒否されます。"
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "コンパイル済み module は plugin digest、ABI version、hook feature surface、host-call namespace、Fluxheim version に紐づくため、将来の再利用が release、feature、ABI の境界を越えることはありません。"
proxy_wasm_preview = "Proxy-Wasm プレビュー"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "<code>wasm-proxy-abi</code> を指定して build し、<code>allow_preview_abi</code> を有効にして、<code>proxy-wasm-preview</code> ABI と host-call namespace の両方を宣言します。未対応の import と call は fail-closed になります。"
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "multi-tenant 環境では <code>[server.host_routing].strict = true</code> を有効にしてください。host identity がない、または不正な場合は <code>400</code>、未知の host は default site に到達せず <code>421</code> を返します。"
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "config file と、既に存在するすべての親 directory は信頼できる所有者の管理下に置き、group や他の user が書き込めないようにしてください。"
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "TLS、listener、stream、UDP、ACME、cache purge、tracing、managed PHP-FPM の process 設定を変更した場合は process を置き換えてください。通常の routing と request-time policy は snapshot reload で更新できます。"
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "cache policy に見合う容量の永続 writable volume を用意してください。storage-bin の各 replica には専用の local volume または RWO volume を割り当て、共有 RWX storage は node 間 locking が検証済みで orchestration 側でも single-writer が強制される場合に限って使用します。"
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "実行中の Fluxheim process ごとに storage-bin root を 1 つ使用してください。所有権の管理には advisory filesystem lock を使用するため、外部 locking を検証していない共有 multi-writer root は安全ではありません。"
wasi_preview_1 = "WASI プレビュー 1"
build_with_wasm_wasi_enable_allow_preview_abi_declare_the_wasi_preview_abi_and_host_call_namespace_and_grant_only_the_required_clock_or_randomness_capability_the_preview_is_limited_to_access_decisions = "<code>wasm-wasi</code> でビルドし、<code>allow_preview_abi</code> を有効にします。ABI と host-call 名前空間に <code>wasi-preview</code> を指定し、必要な時計または乱数機能だけを許可してください。このプレビューはアクセス判定専用です。"
