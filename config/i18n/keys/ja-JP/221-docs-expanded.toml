fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 では Wasm は引き続き任意機能のまま、native HTTP/1 の request-header / response-header 向けに最初の bounded hook ファミリーを追加します。プラグインは承認済みの合成的な policy 変更を行えますが、raw header、body、ファイルシステム、ネットワーク、秘密鍵、admin API には引き続きアクセスできません。"
