version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "バージョン 1.6.37 は、Wasm 前最後の crate 境界整理です。ACME、observability、cache、load-balancer、PHP-FPM、native runtime の内部処理を、それぞれの crate が持つ小さなモジュールへ移し、runtime の挙動は安定したままにしています。"

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "バージョン 1.6.37 では、host-network のポートが他の runner プロセスと競合した場合に、Prometheus と Jaeger の一時起動を新しいポートで再試行します。これにより、ローカルの observability smoke がより安定します。"

