fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 では Wasm は引き続き任意機能で、access-decision と header hook に加えて、制限付きの native HTTP/1 route-decision hook を追加しました。プラグインは続行、拒否、または設定済みの canary / mirror ルート分岐の選択だけを行えます。upstream を新規に作る、ルートマッチングを迂回する、Fluxheim のアクセス制御を上書きする、生の header や body、ファイルシステム、ネットワーク、秘密鍵、admin API に触れることはできません。"
