version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "バージョン1.6.36では一時的な互換コードをさらに削除しました。native proxy境界はクレートが直接所有するAPIを使い、不要になったPingora時代のルートアダプターは通常のソース経路から除かれています。"
