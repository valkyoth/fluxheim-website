released_july_12_2026 = "2026 年 7 月 12 日にリリース"
adds_runnable_migration_examples_for_irules_openresty_haproxy_spoe_and_vcl_style_policy_jobs = "iRules、OpenResty、HAProxy/SPOE、および VCL スタイルのポリシー ジョブの実行可能な移行サンプルを追加します"
adds_bounded_acme_transport_ari_scheduling_lifecycle_diagnostics_and_explicit_terms_acceptance = "制限付き ACME トランスポート、ARI スケジューリング、ライフサイクル診断、および明示的な条件の承諾を追加します。"
hardens_recoverable_acme_account_and_certificate_transactions_storage_boundaries_and_snapshot_publication = "回復可能な ACME アカウントと証明書のトランザクション、ストレージ境界、およびスナップショットの公開を強化します。"
fluxheim_1_7_9_adds_runnable_migration_policy_examples_and_a_bounded_recoverable_acme_lifecycle_with_ari_scheduling_explicit_terms_acceptance_diagnostics_deactivation_and_revocation_controls = "実行可能な移行ポリシーの例と、ARI スケジューリング、明示的な条件の受け入れ、診断、非アクティブ化、および失効の制御を備えた、制限された回復可能な ACME ライフサイクルを追加します。"
acme_safety_and_lifecycle = "ACME の安全性とライフサイクル"
fluxheim_1_7_9_validates_issuer_directories_and_requires_explicit_agreement_to_the_exact_advertised_terms_before_creating_an_account_account_bootstrap_certificate_publication_deactivation_and_revocation_use_recoverable_transactions = "Fluxheim 1.7.9 は ACME 認証局のディレクトリを検証し、アカウント作成前に認証局が提示する利用規約への明示的な同意を求めます。アカウントの初期設定、証明書の発行、無効化、失効処理は、障害から復旧可能なトランザクションとして実行されます。"
confirm_the_current_url_from_the_issuer_before_deployment_a_changed_or_mismatched_agreement_must_be_rejected = "導入前に発行者から現在の URL を確認してください。変更された契約または不一致の契約は拒否する必要があります。"
check_and_maintain_acme = "ACME のチェックと保守"
online_checks_run_from_this_server_and_do_not_replace_external_monitoring_revocation_quarantines_the_managed_certificate_pair_and_requests_a_reload_install_a_replacement_before_continuing_normal_service = "オンライン チェックはこのサーバーから実行され、外部監視に代わるものではありません。失効では、管理されている証明書ペアが隔離され、リロードが要求されます。通常のサービスを続行する前に、交換品を取り付けてください。"
fluxheim_1_7_9_adds_runnable_migration_examples_for_irules_style_access_policy_openresty_style_header_policy_haproxy_spoe_style_routing_and_vcl_style_cache_policy_these_map_common_policy_jobs_to_fluxheim_s_typed_abi_they_do_not_run_source_code_from_those_products = "Fluxheim 1.7.9 では、iRules 形式のアクセス制御、OpenResty 形式のヘッダー制御、HAProxy/SPOE 形式のルーティング、VCL 形式のキャッシュ制御について、すぐに試せる移行例を追加しました。これらは一般的なポリシー処理を Fluxheim の型付き ABI に対応付けるもので、各製品のソースコードを実行するものではありません。"
migration_examples = "移行例"
build_the_checked_in_examples_into_digest_pinned_wasm_modules_every_example_uses_configured_symbolic_ids_and_remains_unable_to_access_arbitrary_files_networks_secrets_request_bodies_or_cache_objects = "リポジトリに含まれる例を、特定の暗号学的ダイジェストに固定した Wasm モジュールとしてビルドします。各例は設定済みのシンボリック ID を使用し、任意のファイル、ネットワーク、機密情報、HTTP リクエスト本文、キャッシュオブジェクトにはアクセスできません。"
webassembly_line_optional_bounded_policy_hooks_isolated_modules_disabled_by_default_proxy_wasm_and_wasi_previews_explicit_wasi_grants_validated_migration_examples_and_stronger_acme_snapshot_geoip_stream_tls_php_fpm_static_serving_and_wasm_boundaries = "WebAssembly 行: オプションの境界付きポリシー フック、分離モジュール、デフォルトで無効になっている Proxy-Wasm および WASI プレビュー、明示的な WASI 許可、検証済みの移行サンプル、およびより強力な ACME、スナップショット、GeoIP、ストリーム、TLS、PHP-FPM、静的サービング、および Wasm 境界。"
