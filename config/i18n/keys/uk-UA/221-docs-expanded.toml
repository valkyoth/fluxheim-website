version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Версія 1.6.37 є фінальним очищенням меж crates перед Wasm: ACME, observability, cache, load-balancer, PHP-FPM і внутрішні частини native runtime переходять у менші crate-owned модулі, а поведінка runtime лишається стабільною."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Версія 1.6.37 робить локальний observability smoke надійнішим, повторюючи запуск одноразових Prometheus і Jaeger з новими портами, коли host-network порти конкурують з іншими runner-процесами."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "Починаючи з 1.7.0 Fluxheim додає необов’язкову основу пісочниці Wasm. Вона типово вимкнена, несумісна з privacy-mode і зараз підтверджує безпечне завантаження плагінів та обмежене виконання до появи request/response policy hooks."
starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation = "Починаючи з 1.7.0 Fluxheim додає необов’язкову основу пісочниці Wasm."
