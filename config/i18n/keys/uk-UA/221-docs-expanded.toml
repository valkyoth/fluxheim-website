module_identity = "Ідентичність модуля"
fluxheim_1_7_6_keeps_wasm_optional_and_hardens_the_mature_native_http_1_hook_runtime_compiled_modules_now_carry_identities_scoped_by_plugin_sha_256_digest_abi_version_native_hook_feature_surface_and_fluxheim_version_cache_hooks_also_get_per_vhost_admission_budgets_under_the_process_wide_cache_hook_ceiling_so_one_vhost_cannot_starve_another = "uk-UA: Fluxheim 1.7.6 keeps Wasm optional and hardens the mature native HTTP/1 hook runtime. Compiled modules now carry identities scoped by plugin SHA-256 digest, ABI version, native hook feature surface, and Fluxheim version; cache hooks also get per-vhost admission budgets under the process-wide cache-hook ceiling so one vhost cannot starve another."
