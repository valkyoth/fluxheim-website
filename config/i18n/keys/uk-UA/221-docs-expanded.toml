unsupported_native_runtime_shapes_still_fail_closed_with_explicit_blockers_instead_of_falling_back_to_legacy_adapters = "Непідтримувані рідні форми runtime все ще не закриваються за допомогою явних блокувальників замість повернення до застарілих adapter."
