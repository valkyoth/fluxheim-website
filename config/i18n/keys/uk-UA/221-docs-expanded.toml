request_headers_and_response_headers_hooks_can_set_or_remove_only_allow_listed_synthetic_headers_such_as_the_policy_tier_example = "Hooks <code>request-headers</code> і <code>response-headers</code> можуть встановлювати або вилучати лише дозволені синтетичні headers, як у прикладі policy-tier."
