cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hooks можуть continue, pass, bypass або deny. <code>cache-store</code> hooks можуть continue, skip storage або deny перед записами memory/disk cache."
cache_policy_limits = "Обмеження cache-policy"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hooks використовують окрему стелю допуску на рівні процесу, щоб гарячі cache-policy routes не забирали ресурси в access, route або header hooks."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 залишає Wasm опційним і розширює обмежені native HTTP/1 cache-policy hooks поряд з access-decision, header і route-decision hooks. Plugin-и можуть продовжувати звичайну поведінку cache, пропускати до origin, обходити cache, пропускати збереження, відхиляти, вибирати фіксовані mobile/desktop cache-key variants і додавати фіксовані cache-store TTL, tag і stored-header metadata. Вони й надалі не можуть видавати довільні cache-key bytes, довільні TTL, довільні tags, сирі response headers, тіла, доступ до файлової системи, мережі, приватних ключів або admin APIs."
cache_metadata = "Метадані cache"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hooks додають фіксовані mobile/desktop cache-key variants. <code>cache-store</code> hooks задають фіксовані TTL, tag і stored-header metadata."
module_identity = "Ідентичність модуля"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Process-wide, cache-global, cache-vhost, per-plugin і per-attachment execution ceilings запобігають необмеженій роботі plugin-ів."
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 залишає Wasm опційним і додає перший опційний Proxy-Wasm ABI compatibility preview. Він створює окремий host-call namespace під feature gate зі строгою перевіркою manifest і детермінованою fail-closed обробкою непідтримуваних calls; це не означає, що будь-які наявні Proxy-Wasm plugins працюватимуть без змін."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Скомпільовані модулі прив’язані до plugin digest, ABI version, hook feature surface, host-call namespace і Fluxheim version, щоб майбутнє повторне використання не перетинало межі release, feature або ABI."
proxy_wasm_preview = "Попередній перегляд Proxy-Wasm"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Зберіть із <code>wasm-proxy-abi</code>, увімкніть <code>allow_preview_abi</code> та оголосіть і <code>proxy-wasm-preview</code> ABI, і host-call namespace. Непідтримувані imports і calls обробляються за принципом fail-closed."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Для multi-tenant deployments увімкніть <code>[server.host_routing].strict = true</code>: відсутня або недійсна host identity повертатиме <code>400</code>, а невідомі hosts — <code>421</code> замість переходу до default site."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Зберігайте config files і всі наявні parent directories під довіреною ownership та без права запису для group або інших users."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Замінюйте process після змін TLS, listeners, streams, UDP, ACME, cache purging, tracing або managed PHP-FPM process settings; для звичайного routing і request-time policy можна використовувати snapshot reload."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Використовуйте persistent writable volume, розмір якого відповідає cache policy. Надайте кожній storage-bin replica власний local або RWO volume; shared RWX storage використовуйте лише з перевіреним cross-node locking і примусовим single-writer на рівні orchestration."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Використовуйте один storage-bin root на кожен запущений Fluxheim process; ownership спирається на advisory filesystem lock, тому shared multi-writer roots небезпечні без перевіреного external locking."
