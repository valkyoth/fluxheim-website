fluxheim_1_7_0_starts_the_optional_wasm_sandbox_foundation_it_proves_approved_root_plugin_loading_manifest_validation_and_bounded_wasmtime_execution_request_response_hooks_are_still_staged_for_later_1_7_x_releases = "Починаючи з 1.7.0 Fluxheim додає необов’язкову основу пісочниці Wasm. Вона типово вимкнена, несумісна з privacy-mode і зараз підтверджує безпечне завантаження плагінів та обмежене виконання до появи request/response policy hooks."
