selected_route_policy = "Політика вибраного маршруту"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "ACL, rate limits, concurrency limits, body limits, redirects і header-policy вибраного маршруту продовжують виконуватися після Wasm-рішення маршруту."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 залишає Wasm опційним і додає обмежені native HTTP/1 cache-policy hooks поряд з access-decision, header і route-decision hooks. Plugin-и можуть продовжити звичайну поведінку cache, пропустити до origin, обійти cache, пропустити збереження або відхилити, але не можуть змінювати сирі cache keys, TTL, tags, response headers чи збережені metadata, а також отримувати сирі заголовки, тіла, доступ до файлової системи, мережі, приватних ключів або admin APIs."
