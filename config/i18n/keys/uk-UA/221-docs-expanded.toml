version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Оновлює структуру 1.6.36: очищення native proxy, API у відповідних crate, вилучення спадщини Pingora, детерміновані observability-образи та регресійні тести HTTP/1 chunked."
version_1_6_36_pins_the_prometheus_and_jaeger_smoke_test_images_to_stable_tags_so_local_and_ci_observability_checks_pull_deterministic_containers = "Оновлює структуру 1.6.36: очищення native proxy, API у відповідних crate, вилучення спадщини Pingora, детерміновані observability-образи та регресійні тести HTTP/1 chunked."
fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 залишає Wasm опційним і додає першу обмежену native HTTP/1 родину hooks для request-header і response-header. Плагіни можуть виконувати схвалені синтетичні зміни policy, але й надалі не отримують сирі headers, bodies, доступ до файлової системи, мережі, приватних ключів або admin API."
