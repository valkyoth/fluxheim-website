r1712_released_july_15_2026 = "Випущено 15 липня 2026 р"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Додає стандартні метадані кешу, проксі та дайджесту відповіді"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Підтверджує автентифіковане перезавантаження знімка в реальному часі, відкат, перевірку цілісності та постійність перезапуску"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Додає відтворювані докази FIPS-backend і широку власну захист під час виконання"
r1712_whats_next_summary = "додає стандартні метадані за бажанням, перевірку автентифікованого відкату знімка, відтворювані докази FIPS-backend і надійніший кеш, TLS, Wasm, буферизацію та межі потоку."
r1712_release_series_digest = "Серія випусків Fluxheim 1.7: доступ до кешу на основі стандартів, проксі та метаданих дайджесту відповіді; перезавантаження та відкат автентифікованого знімка; відтворювані докази FIPS-backend; оновлення процесів без простоїв; незалежно протестовані приклади політики Wasm; і потужніший кеш, TLS, буферизація, потік і межі протоколу."
r1712_standards_based_response_metadata = "Метадані відповіді на основі стандартів"
r1712_response_metadata_intro = "Метадані відповіді вимкнено за замовчуванням. Увімкніть лише ті поля, які вам потрібні; Fluxheim отримує їх із фактичного результату кешу, збою проксі та байтів остаточної відповіді, не розкриваючи ключі кешу, серверні адреси, імена DNS або необроблені помилки."
r1712_field = "Поле"
r1712_what_it_reports = "Про що повідомляє"
r1712_cache_status_description = "Результати кешу RFC 9211, такі як збіг, промах, застаріле пересилання, повторна перевірка, закінчення терміну дії та обхід."
r1712_proxy_status_description = "RFC 9209 деталі низької потужності для збоїв, створених Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 над остаточним вмістом повідомлення HTTP після стиснення."
r1712_repr_digest_description = "SHA-256 лише тоді, коли Fluxheim містить повне вибране представлення."
r1712_live_snapshots_and_rollback = "Живі знімки та відкат"
r1712_live_snapshot_intro = "Автентифіковані знімки можуть опублікувати підтвердженого кандидата, замінити поточний маршрутизатор і виконати відкат без перезапуску звичайних розгортань лише з маршрутизацією. Кожен запит залишається на одній генерації маршрутизатора від початку до кінця."
r1712_snapshot_private_directory = "Зберігайте сховище знімків у спеціальному приватному каталозі; існуючі неприватні каталоги та корені файлової системи відхиляються."
r1712_snapshot_process_upgrade = "Використовуйте оновлення процесу, коли фонові служби балансування навантаження справності або виявлення активні."
r1712_snapshot_integrity_restart = "Запустіть перевірку цілісності знімка після публікації або відкоту та переконайтеся, що вибране покоління переживе перезапуск."
r1712_read_snapshot_contract = "Прочитайте повний знімок контракту"
r1712_authorization_cache_bypass = "Запити, що містять <code>Authorization</code> або <code>Proxy-Authorization</code>, завжди обходять пошук і зберігання в спільному кеші."
r1712_strict_cache_control = "Неправильна або конфліктна відповідь Директиви <code>Cache-Control</code> відхиляються замість повернення до налаштованих TTL; <code>s-maxage</code> має пріоритет над <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> і <code>s-maxage</code> забороняють повторне використання застарілих після закінчення терміну свіжості."
r1712_encrypted_cache_upgrade_note = "Примітка щодо оновлення зашифрованого кешу"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 переміщує зашифровані об’єкти кешу диска до кореневих даних і ключів індексу з довготривалим станом nonce. Перший запуск зі старішого зашифрованого кореня та кожна ротація локального ключа навмисно холодно очищає цей кеш перед обслуговуванням трафіку."
r1712_encrypted_cache_disposable = "Розглядайте зашифрований кеш як одноразове прискорення, а не як джерело запису."
r1712_encrypted_cache_private_storage = "Надайте кожному кореневому кешу постійне приватне сховище та не копіюйте стан nonce між незалежними коренями."
r1712_encrypted_cache_warmup = "Заплануйте початкову потужність для першого розігріву після оновлення або заміни ключів."
r1712_client_certificate_revocation = "Відкликання сертифіката клієнта"
r1712_client_certificate_revocation_intro = "Якщо спільний TLS має відхилити відкликані клієнтські сертифікати, надайте обмежений пакет PEM CRL. Fluxheim перевіряє повний ланцюжок емітента та відхиляє прострочену або неповну політику CRL."
r1712_client_certificate_revocation_compliance = "Обов’язкова автентифікація клієнта в режимі сумісності, необхідному для FIPS або ISO, також вимагає комплекту CRL. Звичайна автентифікація клієнта зберігає відкликання як явну згоду."
r1712_fips_backend_evidence = "FIPS бекенд докази"
r1712_fips_backend_evidence_intro = "Fluxheim надає окремо закріплені середовища перевірки CI для профілів OpenSSL-FIPS і rustls/AWS-LC-FIPS. Вони створюють і запускають точний двійковий файл профілю, здійснюють низхідний і перевірений сертифікатом вихідний TLS, відхиляють несумісну політику та записують ідентифікатори компілятора, постачальника, залежності, двійкові файли та зображення."
r1712_fips_backend_evidence_boundary = "Це відтворюване бекенд-свідчення, а не перевірка FIPS на рівні продукту. Зберігайте контейнери доказів окремо від образів звичайного випуску та переглядайте докази для конкретної збірки, яку ви розгортаєте."
r1712_read_fips_evidence_guide = "Прочитайте посібник із доказів FIPS"
r1712_loader_admission = "Контроль завантаження модулів"
r1712_loader_admission_description = "Публічні маніфести плагінів мають містити фіксований дайджест SHA-256. У всьому процесі одночасно компілюються не більше двох модулів. Розмір скомпільованого результату за замовчуванням обмежено 32 MiB і він не може перевищувати 256 MiB."
r1712_file_identity = "Ідентичність файлу"
r1712_file_identity_description = "Fluxheim відкриває схвалені файли плагінів без переходу за посиланнями, зберігає перевірений дескриптор звичайного файлу та читає байти модуля з цього дескриптора без повторного відкриття шляху."
