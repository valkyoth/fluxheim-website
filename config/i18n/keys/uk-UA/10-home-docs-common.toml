meta_description_secure = "Fluxheim — це високопродуктивний модульний вебсервер, reverse proxy і кешувальний сервер. Написаний на Rust. Безпечний за замовчуванням."
meta_description_short = "Edge-сервер і reverse proxy з безпекою пам’яті, створений на Rust."
hero_memory_safe = "Безпечний для пам’яті"
hero_edge_server = "Edge-сервер"
hero_built_in_rust = "Створено на Rust"
hero_line_one = "Модульний reverse proxy, кеш, балансувальник навантаження і статичний хост, написаний"
hero_line_two = "на Rust. Безпечний за замовчуванням з TLS, ACME, стисканням, edge-політиками,"
hero_line_three = "динамічним виявленням upstream і безпечним traffic mirroring."
tag_fluxheim_core = "Ядро Fluxheim"
tag_rootless_containers = "Контейнери без root"
features_heading = "Усе потрібне на edge-рівні"
features_intro = "Fluxheim постачається як сфокусовані модульні збірки — використовуйте лише те, що потрібно вашому розгортанню."
memory_safe_by_design = "Безпечний для пам’яті за задумом"
memory_safe_by_design_text = "Написано на Rust із зафіксованим стабільним toolchain. Без buffer overflow, use-after-free і data race за конструкцією."
fluxheim_http_core = "HTTP-ядро Fluxheim"
fluxheim_http_core_text = "Rust-native edge runtime з connection pooling, upstream retries, активними health checks, HTTP/2, WebSocket upgrades і gRPC pass-through."
load_balancer_control_plane = "Площина керування балансувальником навантаження"
load_balancer_control_plane_text = "Сфокусований бінарний файл і образ load balancer 1.5 з розширеним вибором, локальною сталістю, політикою health/ejection, обмеженим queueing і runtime-керуванням учасниками."
modular_build_profiles = "Модульні профілі збірки"
modular_build_profiles_text = "Компілюйте лише те, що потрібно. Сфокусовані профілі для static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring і production bundles зі стисканням."
tls_managed_acme = "TLS і керований ACME"
tls_managed_acme_text = "rustls-first з підтримуваними шляхами OpenSSL і FIPS/ISO proof build, client certificate auth, upstream mTLS, автоматичним випуском ACME і multi-cert SNI."
advanced_cache_system = "Розширена система кешу"
advanced_cache_system_text = "Кеш-бекенди в пам’яті, на диску, багаторівневі й зашифровані з cache-safe gzip, Zstandard і Brotli, плюс range caching для великих об’єктів."
container_native = "Нативний для контейнерів"
container_native_text = "Rootless Podman images для Wolfi, Alpine, SUSE Micro і Debian. Systemd/RPM для нативних розгортань. Без зовнішніх assets під час старту."
prometheus_opentelemetry = "Prometheus і OpenTelemetry"
prometheus_opentelemetry_text = "Opt-in listener метрик Prometheus, експорт метрик OTLP, propagation trace context і експорт trace OTLP для повної спостережуваності."
geo_context_text = "Опційні локальні MMDB lookup для country і ASN policy з MaxMind GeoIP2/GeoLite2 або CIRCL Geo Open. Без remote lookup чи downloader у шляху запиту."
tcp_stream_proxy = "Проксі TCP-потоків"
tcp_stream_proxy_text = "Raw L4 TCP services з dedicated stream routes, справжніми idle/lifetime/byte caps, upstream TLS/mTLS controls, weighted/drain/backup policy і route-local PROXY protocol."
php_fpm_support = "Підтримка PHP-FPM"
php_fpm_support_text = "Opt-in PHP-FPM FastCGI bridge для застосунків front-controller на кшталт WordPress. Строге resolution script і обмежене handling запитів."
edge_policy_controls = "Керування edge-політиками"
edge_policy_controls_text = "Trusted-proxy-aware ACLs, rate limits, auth subrequests, traffic mirroring, regex rewrites, bounded queues, строга config validation і hardened request handling."
