stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Стабілізує виконувані приклади міграції Wasm і тестування випуску; додає додаткові профілі безпеки HTTP-відповідей, перевірений CORS із підтримкою запитів, інструкції щодо обмежених повторних спроб, суворіше пересилання та очищення заголовків ідентифікаційних даних, а також безпечніший аналіз і перезапис заголовків."
