version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Version 1.6.37 er den finale crate-grænseoprydning før Wasm: ACME, observability, cache, load-balancer, PHP-FPM og native-runtime-interne dele flyttes til mindre crate-ejede moduler, mens runtime-adfærden forbliver stabil."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Version 1.6.37 gør den lokale observability-smoke mere pålidelig ved at prøve midlertidige Prometheus- og Jaeger-starter igen med nyallokerede porte, når host-network-porte konkurrerer med andre runner-processer."

