data_minimisation = "Dataminimering"
gdpr_minimisation_text = "Metrics bruger bounded labels som locale, normaliseret route, section, status class, download artifact, GitHub target og valgfri landekode. Implementeringen er designet til ikke at gemme eller eksportere rå IP-adresser eller user-level tracking identifiers."
