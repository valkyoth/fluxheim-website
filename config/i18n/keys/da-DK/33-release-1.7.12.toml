r1712_released_july_15_2026 = "Udgivet 15. juli 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Tilføjer opt-in standardbaseret cache, proxy og respons-digest metadata"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Beviser autentificeret live snapshot genindlæsning, rollback, integritetstjek og genstart persistens"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Tilføjer reproducerbar FIPS-backend bevis og bred indbygget runtime hærdning"
r1712_whats_next_summary = "tilføjer opt-in standard metadata, autentificeret snapshot rollback proof, reproducerbare FIPS-backend beviser og stærkere cache, TLS, Wasm, buffering og stream grænser."
r1712_release_series_digest = "Fluxheim 1.7 udgivelsesserie: opt-in standardbaseret cache, proxy og respons-digest metadata; autentificeret live snapshot genindlæsning og rollback; reproducerbare FIPS-backend beviser; procesopgraderinger uden nedetid; uafhængigt testede Wasm politikeksempler; og stærkere cache, TLS, buffering, streaming og protokolgrænser."
r1712_standards_based_response_metadata = "Standardbaserede svarmetadata"
r1712_response_metadata_intro = "Svarmetadata er som standard deaktiveret. Aktiver kun de felter, du har brug for; Fluxheim udleder dem fra det faktiske cacheresultat, proxyfejl og endelige svarbytes uden at afsløre cachenøgler, backend-adresser, DNS-navne eller råfejl."
r1712_field = "Felt"
r1712_what_it_reports = "Hvad den rapporterer"
r1712_cache_status_description = "RFC 9211 cache-resultater såsom hit, miss, gammel videresendelse, revalidering, udløb og bypass."
r1712_proxy_status_description = "RFC 9209 detaljer med lav kardinalitet for fejl genereret af Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 over det endelige HTTP-meddelelsesindhold efter komprimering."
r1712_repr_digest_description = "SHA-256 kun når Fluxheim indeholder den komplette valgte repræsentation."
r1712_live_snapshots_and_rollback = "Live snapshots og rollback"
r1712_live_snapshot_intro = "Autentificerede snapshots kan udgive en valideret kandidat, erstatte live-routeren og rulle tilbage uden at genstarte normale routing-only-implementeringer. Hver anmodning forbliver på én routergeneration fra start til slut."
r1712_snapshot_private_directory = "Opbevar snapshot-butikken i en dedikeret privat mappe; eksisterende ikke-private mapper og filsystemrødder afvises."
r1712_snapshot_process_upgrade = "Brug en procesopgradering, når baggrundsload-balancer-sundheds- eller opdagelsestjenester er aktive."
r1712_snapshot_integrity_restart = "Kør integritetstjek af øjebliksbilleder efter offentliggørelse eller tilbagerulning, og bekræft, at den valgte generation overlever genstart."
r1712_read_snapshot_contract = "Læs hele snapshot-kontrakten"
r1712_authorization_cache_bypass = "Anmodninger, der bærer <code>Authorization</code> eller <code>Proxy-Authorization</code>, omgår altid delt cacheopslag og -lagring."
r1712_strict_cache_control = "Forkert eller modstridende svar <code>Cache-Control</code>-direktiver afvises i stedet for at falde tilbage til konfigurerede TTL'er; <code>s-maxage</code> har prioritet over <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> og <code>s-maxage</code> forbyder gammel genbrug, efter at friskheden udløber."
r1712_encrypted_cache_upgrade_note = "Notat om opgradering af krypteret cache"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 flytter krypterede diskcacheobjekter til rodbundne data og indeksnøgler med holdbar nonce-tilstand. Den første opstart mod en ældre krypteret rod, og hver lokal-nøgle-rotation, koldt-renser med vilje denne cache, før den betjener trafik."
r1712_encrypted_cache_disposable = "Behandl den krypterede cache som engangsacceleration, ikke kilden til registrering."
r1712_encrypted_cache_private_storage = "Giv hver cache-rod vedvarende privat lagring og kopier ikke nonce-tilstand mellem uafhængige rødder."
r1712_encrypted_cache_warmup = "Planlæg startkapacitet for den første opvarmning efter opgradering eller drejning af tasterne."
r1712_client_certificate_revocation = "Tilbagekaldelse af klientcertifikat"
r1712_client_certificate_revocation_intro = "Når fælles TLS skal afvise tilbagekaldte klientcertifikater, skal du angive en afgrænset PEM CRL-pakke. Fluxheim validerer hele udstederkæden og afviser udløbet eller ufuldstændig CRL-politik."
r1712_client_certificate_revocation_compliance = "Påkrævet klientgodkendelse i en FIPS eller ISO-krævet overholdelsestilstand kræver også en CRL-pakke. Almindelig klientgodkendelse beholder tilbagekaldelse som en eksplicit opt-in."
r1712_fips_backend_evidence = "FIPS backend-bevis"
r1712_fips_backend_evidence_intro = "Fluxheim leverer separat fastgjorte CI-sikre miljøer til OpenSSL-FIPS- og rustls/AWS-LC-FIPS-profilerne. De bygger og kører den nøjagtige profil binær, udøver downstream og certifikatverificeret upstream TLS, afviser inkompatibel politik og registrerer compiler, udbyder, afhængighed, binære og billedidentiteter."
r1712_fips_backend_evidence_boundary = "Dette er reproducerbar backend-bevis, ikke FIPS-validering på produktniveau. Hold prøvebeholderne adskilt fra normale udgivelsesbilleder, og gennemgå beviserne for den nøjagtige build, du implementerer."
r1712_read_fips_evidence_guide = "Læs FIPS bevisvejledning"
r1712_loader_admission = "Styring af modulindlæsning"
r1712_loader_admission_description = "Offentlige pluginmanifester skal indeholde en fast SHA-256-kontrolsum. Højst to moduler kompileres samtidigt i hele processen. Kompileret output har som standard en grænse på 32 MiB og kan ikke overstige 256 MiB."
r1712_file_identity = "Fil identitet"
r1712_file_identity_description = "Fluxheim åbner godkendte plugin-filer uden at følge links, bevarer det validerede regulære fil-håndtag og læser modulbytes fra dette håndtag uden at genåbne stien."
