r1712_released_july_15_2026 = "Veröffentlicht am 15. Juli 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Fügt optional aktivierbare, standardkonforme Metadaten für Cache, Proxy und Antwort-Digests hinzu"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Belegt das authentifizierte Neuladen und Zurücksetzen von Live-Snapshots, Integritätsprüfungen sowie die Beibehaltung nach einem Neustart"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Fügt reproduzierbare Nachweise für FIPS-Backends und umfassende Härtungen der nativen Laufzeit hinzu"
r1712_whats_next_summary = "ergänzt optional aktivierbare Standardmetadaten, nachgewiesene authentifizierte Snapshot-Rollbacks, reproduzierbare Nachweise für FIPS-Backends sowie stärkere Grenzen für Cache, TLS, Wasm, Pufferung und Streams."
r1712_release_series_digest = "Fluxheim-1.7-Reihe: optional aktivierbare, standardkonforme Metadaten für Cache, Proxy und Antwort-Digests; authentifiziertes Neuladen und Zurücksetzen von Live-Snapshots; reproduzierbare Nachweise für FIPS-Backends; Prozess-Upgrades ohne Ausfallzeit; unabhängig getestete Wasm-Richtlinienbeispiele; und stärkere Grenzen für Cache, TLS, Pufferung, Streams und Protokolle."
r1712_standards_based_response_metadata = "Standardbasierte Antwortmetadaten"
r1712_response_metadata_intro = "Antwortmetadaten sind standardmäßig deaktiviert. Aktivieren Sie nur die Felder, die Sie benötigen. Fluxheim leitet sie aus dem tatsächlichen Cache-Ergebnis, dem Proxy-Fehler und den endgültigen Antwortbytes ab, ohne Cache-Schlüssel, Backend-Adressen, DNS-Namen oder Rohfehler offenzulegen."
r1712_field = "Antwortfeld"
r1712_what_it_reports = "Gemeldete Information"
r1712_cache_status_description = "RFC 9211 Cache-Ergebnisse wie Hit, Miss, Stale Forwarding, Revalidierung, Ablauf und Bypass."
r1712_proxy_status_description = "RFC 9209 Details mit niedriger Kardinalität für Fehler, die von Fluxheim generiert wurden."
r1712_content_digest_description = "SHA-256 gemäss RFC 9530 über den endgültigen HTTP-Nachrichteninhalt nach der Komprimierung."
r1712_repr_digest_description = "SHA-256 nur, wenn Fluxheim die vollständige ausgewählte Darstellung vorhält."
r1712_live_snapshots_and_rollback = "Live-Schnappschüsse und Rollback"
r1712_live_snapshot_intro = "Authentifizierte Snapshots können einen validierten Kandidaten veröffentlichen, den aktiven Router ersetzen und zurückgesetzt werden, ohne normale reine Routing-Bereitstellungen neu zu starten. Jede Anfrage bleibt von Anfang bis Ende auf derselben Routergeneration."
r1712_snapshot_private_directory = "Bewahren Sie den Snapshot-Speicher in einem eigenen privaten Verzeichnis auf; vorhandene nicht private Verzeichnisse und Dateisystemwurzeln werden abgelehnt."
r1712_snapshot_process_upgrade = "Verwenden Sie ein Prozess-Upgrade, wenn im Hintergrund Zustandsprüfungen des Load-Balancers oder Erkennungsdienste aktiv sind."
r1712_snapshot_integrity_restart = "Führen Sie nach der Veröffentlichung oder dem Rollback Snapshot-Integritätsprüfungen durch und stellen Sie sicher, dass die ausgewählte Generation den Neustart übersteht."
r1712_read_snapshot_contract = "Lesen Sie den vollständigen Snapshot-Vertrag"
r1712_authorization_cache_bypass = "Anfragen mit <code>Authorization</code> oder <code>Proxy-Authorization</code> umgehen immer die Suche und Speicherung im gemeinsam genutzten Cache."
r1712_strict_cache_control = "Fehlerhafte oder widersprüchliche Antwortanweisungen <code>Cache-Control</code> werden abgelehnt, anstatt auf konfigurierte TTLs zurückzugreifen. <code>s-maxage</code> hat Vorrang vor <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> und <code>s-maxage</code> verhindern die Wiederverwendung veralteter Antworten nach Ablauf ihrer Frischezeit."
r1712_encrypted_cache_upgrade_note = "Hinweis zum Upgrade des verschlüsselten Caches"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 stellt verschlüsselte Festplatten-Cache-Objekte auf an die Cache-Wurzel gebundene Daten- und Indexschlüssel mit dauerhaft gespeichertem Nonce-Zustand um. Beim ersten Start mit einer älteren verschlüsselten Cache-Wurzel und bei jeder lokalen Schlüsselrotation wird dieser Cache vor der Annahme von Datenverkehr absichtlich vollständig geleert."
r1712_encrypted_cache_disposable = "Verschlüsselte Cache-Daten sind entbehrlich und dürfen nicht als massgebliche Datenquelle behandelt werden."
r1712_encrypted_cache_private_storage = "Geben Sie jedem Cache-Root dauerhaften privaten Speicher und kopieren Sie den Nonce-Status nicht zwischen unabhängigen Roots."
r1712_encrypted_cache_warmup = "Stellen Sie sicher, dass der Ursprungsserver das erste Aufwärmen des Caches nach einem Upgrade oder Schlüsselwechsel bewältigen kann."
r1712_client_certificate_revocation = "Widerruf des Client-Zertifikats"
r1712_client_certificate_revocation_intro = "Wenn gegenseitige TLS-Authentifizierung widerrufene Client-Zertifikate ablehnen muss, stellen Sie ein grössenbegrenztes PEM-CRL-Paket bereit. Fluxheim validiert die vollständige Ausstellerkette und lehnt abgelaufene oder unvollständige CRL-Richtlinien ab."
r1712_client_certificate_revocation_compliance = "Vorgeschriebene Clientauthentifizierung in einem FIPS- oder ISO-pflichtigen Konformitätsmodus erfordert ebenfalls ein CRL-Paket. Bei normaler Clientauthentifizierung bleibt die Sperrprüfung ausdrücklich optional."
r1712_fips_backend_evidence = "Nachweise für FIPS-Backends"
r1712_fips_backend_evidence_intro = "Fluxheim stellt getrennt festgeschriebene CI-Nachweisumgebungen für die Profile OpenSSL-FIPS und rustls/AWS-LC-FIPS bereit. Sie bauen und starten exakt die jeweilige Profilbinärdatei, prüfen nachgelagertes und zertifikatsgeprüftes vorgelagertes TLS, lehnen unvereinbare Richtlinien ab und erfassen die Identitäten von Compiler, Anbieter, Abhängigkeiten, Binärdatei und Image."
r1712_fips_backend_evidence_boundary = "Dies sind reproduzierbare Backend-Nachweise, keine FIPS-Validierung des Gesamtprodukts. Halten Sie die Nachweiscontainer von normalen Release-Images getrennt und prüfen Sie die Nachweise für genau den eingesetzten Build."
r1712_read_fips_evidence_guide = "Leitfaden zu FIPS-Nachweisen lesen"
r1712_loader_admission = "Kontrollen für das Laden von Modulen"
r1712_loader_admission_description = "Öffentliche Plugin-Manifeste müssen einen festen SHA-256-Prüfwert enthalten. Prozessweit werden höchstens zwei Module gleichzeitig kompiliert. Kompilierte Ausgaben sind standardmässig auf 32 MiB begrenzt und dürfen 256 MiB nicht überschreiten."
r1712_file_identity = "Identität der Plugin-Datei"
r1712_file_identity_description = "Fluxheim öffnet zugelassene Plugin-Dateien, ohne Verknüpfungen zu folgen, behält den validierten Handle der regulären Datei und liest die Modulbytes daraus, ohne den Pfad erneut zu öffnen."
