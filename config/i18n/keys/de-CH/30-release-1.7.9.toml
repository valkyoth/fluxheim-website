fluxheim_1_7_9_adds_runnable_migration_policy_examples_and_a_bounded_recoverable_acme_lifecycle_with_ari_scheduling_explicit_terms_acceptance_diagnostics_deactivation_and_revocation_controls = "Fügt ausführbare Beispiele für Migrationsrichtlinien und einen begrenzten, wiederherstellbaren ACME-Lebenszyklus mit ARI-Planung, expliziter Annahme von Bedingungen, Diagnose, Deaktivierung und Widerrufskontrollen hinzu."
acme_safety_and_lifecycle = "ACME-Sicherheit und Lebenszyklus"
fluxheim_1_7_9_validates_issuer_directories_and_requires_explicit_agreement_to_the_exact_advertised_terms_before_creating_an_account_account_bootstrap_certificate_publication_deactivation_and_revocation_use_recoverable_transactions = "Fluxheim 1.7.9 validiert Emittentenverzeichnisse und erfordert vor der Erstellung eines Kontos eine ausdrückliche Zustimmung zu den genauen beworbenen Bedingungen. Beim Konto-Bootstrap, bei der Veröffentlichung, Deaktivierung und Sperrung von Zertifikaten werden wiederherstellbare Transaktionen verwendet."
confirm_the_current_url_from_the_issuer_before_deployment_a_changed_or_mismatched_agreement_must_be_rejected = "Bestätigen Sie vor der Bereitstellung die aktuelle URL des Ausstellers. Eine geänderte oder nicht übereinstimmende Vereinbarung muss abgelehnt werden."
check_and_maintain_acme = "ACME prüfen und warten"
online_checks_run_from_this_server_and_do_not_replace_external_monitoring_revocation_quarantines_the_managed_certificate_pair_and_requests_a_reload_install_a_replacement_before_continuing_normal_service = "Online-Prüfungen laufen von diesem Server aus und ersetzen keine externe Überwachung. Durch den Widerruf wird das verwaltete Zertifikatspaar unter Quarantäne gestellt und ein Neuladen angefordert. Installieren Sie einen Ersatz, bevor Sie den normalen Service fortsetzen."
fluxheim_1_7_9_adds_runnable_migration_examples_for_irules_style_access_policy_openresty_style_header_policy_haproxy_spoe_style_routing_and_vcl_style_cache_policy_these_map_common_policy_jobs_to_fluxheim_s_typed_abi_they_do_not_run_source_code_from_those_products = "Fluxheim 1.7.9 fügt ausführbare Migrationsbeispiele für Zugriffsrichtlinien im iRules-Stil, Header-Richtlinien im OpenResty-Stil, Routing im HAProxy/SPOE-Stil und Cache-Richtlinien im VCL-Stil hinzu. Diese ordnen allgemeine politische Aufgaben dem typisierten ABI von Fluxheim zu; Sie führen keinen Quellcode dieser Produkte aus."
migration_examples = "Migrationsbeispiele"
build_the_checked_in_examples_into_digest_pinned_wasm_modules_every_example_uses_configured_symbolic_ids_and_remains_unable_to_access_arbitrary_files_networks_secrets_request_bodies_or_cache_objects = "Bauen Sie die eingecheckten Beispiele in Wasm-Module mit Digest-Pinning ein. Jedes Beispiel verwendet konfigurierte symbolische IDs und ist weiterhin nicht in der Lage, auf beliebige Dateien, Netzwerke, Geheimnisse, Anforderungstexte oder Cache-Objekte zuzugreifen."
webassembly_line_optional_bounded_policy_hooks_isolated_modules_disabled_by_default_proxy_wasm_and_wasi_previews_explicit_wasi_grants_validated_migration_examples_and_stronger_acme_snapshot_geoip_stream_tls_php_fpm_static_serving_and_wasm_boundaries = "WebAssembly-Zeile: optionale begrenzte Richtlinien-Hooks, isolierte Module, standardmässig deaktivierte Proxy-Wasm- und WASI-Vorschauen, explizite WASI-Gewährungen, validierte Migrationsbeispiele und stärkere ACME-, Snapshot-, GeoIP-, Stream-, TLS-, PHP-FPM-, Static-Serving- und Wasm-Grenzen."
