r1712_released_july_15_2026 = "Išleista 2026 m. liepos 15 d"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Prideda pasirenkamais standartais pagrįstus talpyklos, tarpinio serverio ir atsako santraukos metaduomenis"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Įrodo autentifikuotą tiesioginį momentinės nuotraukos įkėlimą iš naujo, atšaukimą, vientisumo patikrinimus ir paleidimo iš naujo patvarumą"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Prideda atkuriamus FIPS-backend įrodymus ir platų vietinį vykdymo laiką"
r1712_whats_next_summary = "prideda pasirenkamų standartų metaduomenis, autentifikuotą momentinės nuotraukos atšaukimo patikrinimą, atkuriamus FIPS-backend įrodymus ir stipresnę talpyklą, TLS, Wasm, buferio ir srauto ribas."
r1712_release_series_digest = "Fluxheim 1.7 leidimų serija: pasirenkami standartais pagrįsti talpykla, tarpinis serveris ir atsako santraukos metaduomenys; autentifikuotas momentinės nuotraukos perkėlimas ir grąžinimas; atkuriami FIPS-backend įrodymai; nulinės prastovos proceso atnaujinimai; nepriklausomai išbandyti Wasm politikos pavyzdžiai; ir stipresnė talpykla, TLS, buferio, srauto ir protokolo ribos."
r1712_standards_based_response_metadata = "Standartais pagrįsti atsakymų metaduomenys"
r1712_response_metadata_intro = "Pagal numatytuosius nustatymus atsakymų metaduomenys išjungti. Įjunkite tik tuos laukus, kurių jums reikia; Fluxheim juos išveda iš tikrojo talpyklos rezultato, tarpinio serverio gedimo ir galutinio atsako baitų neatskleisdamas talpyklos raktų, užpakalinės programos adresų, DNS pavadinimų ar neapdorotų klaidų."
r1712_field = "Laukas"
r1712_what_it_reports = "Ką ji praneša"
r1712_cache_status_description = "RFC 9211 talpyklos rezultatai, pvz., įvykis, praleistas, pasenęs persiuntimas, pakartotinis patvirtinimas, galiojimo pabaiga ir apėjimas."
r1712_proxy_status_description = "RFC 9209 mažo kardinalumo informacija apie gedimus, sugeneruotus Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 per galutinį HTTP pranešimo turinį po suspaudimo."
r1712_repr_digest_description = "SHA-256 tik tada, kai Fluxheim turi visą pasirinktą atvaizdą."
r1712_live_snapshots_and_rollback = "Tiesioginės momentinės nuotraukos ir atšaukimas"
r1712_live_snapshot_intro = "Autentifikuotos momentinės nuotraukos gali paskelbti patvirtintą kandidatą, pakeisti tiesioginį maršruto parinktuvą ir atšaukti iš naujo nepaleidžiant įprasto tik maršruto diegimo. Kiekviena užklausa nuo pradžios iki pabaigos lieka vienoje maršrutizatoriaus kartoje."
r1712_snapshot_private_directory = "Laikykite momentinių nuotraukų parduotuvę tam skirtame privačiame kataloge; esami ne privatūs katalogai ir failų sistemos šaknys atmetami."
r1712_snapshot_process_upgrade = "Naudokite proceso naujinimą, kai aktyvios fono apkrovos balansavimo ar aptikimo paslaugos."
r1712_snapshot_integrity_restart = "Paleiskite momentinės nuotraukos vientisumo patikras po paskelbimo arba atšaukimo ir patikrinkite, ar pasirinkta karta išgyvena paleidus iš naujo."
r1712_read_snapshot_contract = "Perskaitykite visą momentinę sutartį"
r1712_authorization_cache_bypass = "Užklausos, turinčios <code>Authorization</code> arba <code>Proxy-Authorization</code>, visada apeina bendros talpyklos paiešką ir saugojimą."
r1712_strict_cache_control = "Netinkamai suformuotas arba prieštaraujantis atsakas <code>Cache-Control</code> direktyvos atmetamos, o ne grįžta prie sukonfigūruotų TTL; <code>s-maxage</code> turi pirmenybę prieš <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> ir <code>s-maxage</code> draudžia pakartotinai naudoti pasenusį šviežumo galiojimo laiką."
r1712_encrypted_cache_upgrade_note = "Užšifruotos talpyklos atnaujinimo pastaba"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 perkelia užšifruotus disko talpyklos objektus į šakninius duomenis ir indekso raktus, turinčius patvarią būseną. Pirmasis paleidimas naudojant senesnę šifruotą šaknį ir kiekvienas vietinio rakto pasukimas, prieš aptarnaujant srautą, sąmoningai išvalo šią talpyklą."
r1712_encrypted_cache_disposable = "Užšifruotą talpyklą traktuokite kaip vienkartinį pagreitį, o ne kaip įrašo šaltinį."
r1712_encrypted_cache_private_storage = "Suteikite kiekvienai talpyklos šakninei nuolatinei privačiai saugyklai ir nekopijuokite jokios būsenos tarp nepriklausomų šaknų."
r1712_encrypted_cache_warmup = "Suplanuokite pradinį pajėgumą pirmajam pašildymui po atnaujinimo arba pasukę raktus."
r1712_client_certificate_revocation = "Kliento sertifikato atšaukimas"
r1712_client_certificate_revocation_intro = "Kai abipusis TLS turi atmesti atšauktus kliento sertifikatus, pateikite ribotą PEM CRL paketą. Fluxheim patvirtina visą išdavėjo grandinę ir atmeta pasibaigusią arba neužbaigtą CRL politiką."
r1712_client_certificate_revocation_compliance = "Reikalingam kliento autentifikavimui FIPS arba ISO reikalaujamu atitikties režimu taip pat reikalingas CRL paketas. Įprastas kliento autentifikavimas išlaiko atšaukimą kaip aiškų pasirinkimą."
r1712_fips_backend_evidence = "FIPS pagrindiniai įrodymai"
r1712_fips_backend_evidence_intro = "Fluxheim suteikia OpenSSL-FIPS ir rustls/AWS-LC-FIPS profiliams atskirai pritvirtintas CI patikimas aplinkas. Jie sukuria ir paleidžia tikslią dvejetainį profilį, naudoja pasroviui ir sertifikatais patvirtintą prieš srovę TLS, atmeta nesuderinamą politiką ir įrašo kompiliatoriaus, teikėjo, priklausomybės, dvejetainio ir vaizdo tapatybes."
r1712_fips_backend_evidence_boundary = "Tai yra atkuriami pagrindiniai įrodymai, o ne produkto lygio FIPS patvirtinimas. Laikykite bandomuosius konteinerius atskirai nuo įprastų leidimo vaizdų ir peržiūrėkite tikslios įdiegtos versijos įrodymus."
r1712_read_fips_evidence_guide = "Perskaitykite FIPS įrodymų vadovą"
r1712_loader_admission = "Modulių įkėlimo kontrolė"
r1712_loader_admission_description = "Viešuose papildinių aprašuose turi būti fiksuota SHA-256 santrauka. Visame procese vienu metu gali būti kompiliuojami ne daugiau kaip du moduliai. Numatytoji sukompiliuotos išvesties riba yra 32 MiB, o didžiausia riba – 256 MiB."
r1712_file_identity = "Failo tapatybė"
r1712_file_identity_description = "Fluxheim atidaro patvirtintus įskiepių failus be nuorodų, išlaiko patvirtintą įprasto failo rankenėlę ir nuskaito modulio baitus iš tos rankenos neatidarant kelio iš naujo."
