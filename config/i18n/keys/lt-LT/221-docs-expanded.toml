version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Versija 1.6.37 yra galutinis crate ribų tvarkymas prieš Wasm: ACME, observability, cache, load-balancer, PHP-FPM ir native runtime vidinės dalys perkeliamos į mažesnius crate valdomus modulius, runtime elgsena lieka stabili."

