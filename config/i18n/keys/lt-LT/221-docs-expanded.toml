fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 palieka Wasm pasirenkamą ir išplečia ribotus native HTTP/1 cache-policy hooks kartu su access-decision, header ir route-decision hooks. Plugins gali tęsti įprastą cache veikimą, pereiti į origin, apeiti cache, praleisti saugojimą, atmesti, pasirinkti fiksuotus mobile/desktop cache-key variantus ir pridėti fiksuotą cache-store TTL, tag bei stored-header metadata, bet negali išvesti savavališkų cache-key bytes, savavališkų TTLs, savavališkų tags, raw response headers, bodies, filesystem prieigos, tinklo prieigos, private keys ar admin APIs."
