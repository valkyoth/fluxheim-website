stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabilizálja a futtatható Wasm migrációs példákat és a kioldókapu tesztelést; opcionális HTTP-válaszbiztonsági profilokat, validált kérés-tudatos CORS-t, korlátozott újrapróbálkozási útmutatást, szigorúbb továbbítást és identitásfejléc-tisztítást, valamint biztonságosabb fejléc-elemzést és -újraírást ad hozzá."
