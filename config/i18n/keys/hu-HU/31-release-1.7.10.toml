stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Stabilizálja a futtatható Wasm házirend-példákat és a kiadási kapu által megkövetelt teszteket"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Erősíti a továbbított identitásfejléceket, a fejléc-elemzést és a kapacitáskorlátozásra vonatkozó újrapróbálkozási útmutatást"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "stabilizálja a Wasm migrációs példákat, és opcionális HTTP-válaszbiztonságot, kérés-tudatos CORS-t, valamint szigorúbb továbbítási és fejléchatárokat ad hozzá."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Fluxheim 1.7 kiadási sorozat: függetlenül tesztelt migrációs példák, korlátos hoszt-visszahívások, opcionális HTTP válasz-biztonsági profilok, validált kéréstudatos CORS, szigorúbb továbbított identitáskezelés és erősebb határok a Wasm, ACME, pillanatképek, GeoIP, adatfolyamok, TLS, PHP-FPM és statikus fájlszolgáltatások számára."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "A Fluxheim 1.7.10 minden migrációs családot függetlenül tesztelhetővé tesz, a teljes Wasm füsttesztet a kioldókapun tartja, és ellenőrzi, hogy a vendég által vezérelt szimbolikus azonosítók biztonságosan elutasításra kerülnek. A folyamat közbeni gazdagép-visszahívások véges, nem blokkoló műveletekre korlátozódnak."
wasm_host_callbacks = "Wasm fogadó visszahívások"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "A visszahívások véges szimbolikus dekódolásra, korlátos kontextusolvasásra és korlátos állapotra korlátozódnak. Nem végezhetnek fájl-, hálózat-, IPC-, alvó-, folyamat- vagy harmadik féltől származó visszahívási munkát."
release_testing = "Kiadási tesztelés"
each_migration_family_can_run_independently_while_the_release_gate_also_runs_the_complete_smoke_test_and_an_arbitrary_guest_id_decoder_property_test = "Mindegyik migrációs család önállóan futhat, míg a kioldókapu a teljes füsttesztet és egy tetszőleges vendégazonosító-dekóder tulajdonságtesztet is futtat."
http_response_security = "HTTP válaszbiztonság"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "A HTTP válasz-biztonsági profilok nem kötelezőek. Kezdje a következővel: <code>baseline</code>; csak az összes szkript, betűtípus, kép, bejelentkezési folyamat és beágyazott erőforrás tesztelése után használja a több eredetű elkülönítést."
profile = "Profil"
what_it_does = "Mit csinál"
keeps_the_opt_in_hardening_headers_disabled = "Letiltva tartja az opt-in keményítő fejléceket."
adds_conservative_browser_isolation_and_resource_policy_defaults_suitable_for_most_sites = "Konzervatív böngészőizolációt és erőforrás-politikai alapértelmezéseket ad hozzá, amelyek a legtöbb webhelyhez megfelelnek."
enables_strict_cross_origin_isolation_for_applications_that_have_tested_every_external_dependency = "Lehetővé teszi a szigorú eredetközi elkülönítést az összes külső függőséget tesztelő alkalmazások számára."
neither_profile_enables_hsts_or_csp_configure_those_separately_after_testing_them_against_the_real_site = "Egyik profil sem engedélyezi a HSTS-t vagy a CSP-t. Konfigurálja ezeket külön, miután tesztelte őket a valódi webhelyen."
cors_for_browser_apps = "CORS böngészőalkalmazásokhoz"
enable_cors_only_when_browser_applications_on_known_origins_must_call_this_route = "Csak akkor engedélyezze a CORS-t, ha az ismert eredetű böngészőalkalmazásoknak meg kell hívniuk ezt az útvonalat."
fluxheim_answers_valid_preflight_requests_locally_rejected_preflights_return_403_without_reaching_the_application = "A Fluxheim helyben válaszol az érvényes CORS preflight kérésekre; az elutasított preflight kérések <code>403</code> választ adnak anélkül, hogy elérnék az alkalmazást."
do_not_combine_a_wildcard_origin_with_credentials = "Ne használjon helyettesítő karaktert a hitelesítő adatokkal."
