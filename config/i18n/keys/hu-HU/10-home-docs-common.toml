load_balancer_control_plane_text = "Célzott 1.5 load-balancer bináris és image fejlett kiválasztással, helyi perzisztenciával, health/ejection szabályzattal, korlátozott sorokkal és futásidejű tagvezérléssel."
modular_build_profiles = "Moduláris build profilok"
modular_build_profiles_text = "Csak azt fordítsd, amire szükséged van. Célzott profilok statikus site-hoz, cache edge-hez, fordított proxyhoz, terheléselosztáshoz, TCP stream proxyhoz, PHP-FPM-hez, GeoIP-hez, forgalomtükrözéshez és tömörítéssel ellátott production bundle-ökhöz."
tls_managed_acme = "TLS és kezelt ACME"
tls_managed_acme_text = "rustls-first megközelítés támogatott OpenSSL és FIPS/ISO bizonyító build útvonalakkal, kliens tanúsítványos auth, upstream mTLS, automatikus ACME kiadás és többtanúsítványos SNI."
advanced_cache_system = "Fejlett cache rendszer"
advanced_cache_system_text = "Memória-, lemez-, többszintű és titkosított cache backendek cache-biztos gzip, Zstandard és Brotli tömörítéssel, valamint range cachinggel nagy objektumokhoz."
