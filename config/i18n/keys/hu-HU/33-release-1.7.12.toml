r1712_released_july_15_2026 = "Megjelenés: 2026. július 15"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Hozzáadja az engedélyezési szabványon alapuló gyorsítótárat, proxyt és válasz-kivonat metaadatokat"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Hitelesített élő pillanatkép újratöltést, visszaállítást, integritás-ellenőrzést és újraindítási állandóságot bizonyít"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Reprodukálható FIPS-backend bizonyítékot és széles körű natív futásidejű keményedést ad hozzá"
r1712_whats_next_summary = "hozzáadja az opt-in szabványos metaadatokat, a hitelesített pillanatfelvétel visszagörgetési bizonyítását, a reprodukálható FIPS-backend bizonyítékot, és erősebb gyorsítótárat, TLS, Wasm, pufferelést és adatfolyam-határokat."
r1712_release_series_digest = "Fluxheim 1.7 kiadási sorozat: szabványalapú gyorsítótár, proxy és válasz-kivonat metaadatok; hitelesített élő pillanatkép újratöltése és visszaállítása; reprodukálható FIPS-backend bizonyíték; nulla állásidő nélküli folyamatfrissítések; függetlenül tesztelt Wasm házirend példák; és erősebb gyorsítótár, TLS, pufferelési, adatfolyam- és protokollhatárok."
r1712_standards_based_response_metadata = "Szabványalapú válaszmetaadatok"
r1712_response_metadata_intro = "A válasz metaadatai alapértelmezés szerint le vannak tiltva. Csak a szükséges mezőket engedélyezze; A Fluxheim a gyorsítótár tényleges eredményéből, a proxyhibából és a végső válasz bájtjaiból származtatja őket anélkül, hogy felfedné a gyorsítótár kulcsait, a háttércímeket, a DNS-neveket vagy a nyers hibákat."
r1712_field = "Mező"
r1712_what_it_reports = "Amiről beszámol"
r1712_cache_status_description = "RFC 9211 gyorsítótár-eredmények, például találat, kihagyás, elavult továbbítás, újraérvényesítés, lejárat és bypass."
r1712_proxy_status_description = "RFC 9209 alacsony kardinalitású részletek a Fluxheim által generált hibákhoz."
r1712_content_digest_description = "RFC 9530 SHA-256 a tömörítés utáni utolsó HTTP üzenettartalom felett."
r1712_repr_digest_description = "SHA-256 csak akkor, ha a Fluxheim tartalmazza a teljes kiválasztott ábrázolást."
r1712_live_snapshots_and_rollback = "Élő pillanatképek és visszaállítás"
r1712_live_snapshot_intro = "A hitelesített pillanatképek közzétehetik az ellenőrzött jelöltet, lecserélhetik az élő útválasztót, és visszaállíthatók a normál, csak útválasztásra szolgáló központi telepítések újraindítása nélkül. Minden kérés az elejétől a végéig egy útválasztó generáción marad."
r1712_snapshot_private_directory = "Tartsa a pillanatkép-tárat egy dedikált privát könyvtárban; a meglévő nem privát könyvtárak és fájlrendszer-gyökerek elutasításra kerülnek."
r1712_snapshot_process_upgrade = "Használjon folyamatfrissítést, ha a háttérterhelés-elosztó állapota vagy a felderítési szolgáltatások aktívak."
r1712_snapshot_integrity_restart = "Futtassa le a pillanatkép integritásának ellenőrzését a közzététel vagy a visszaállítás után, és ellenőrizze, hogy a kiválasztott generáció túléli-e az újraindítást."
r1712_read_snapshot_contract = "Olvassa el a teljes pillanatfelvételi szerződést"
r1712_authorization_cache_bypass = "A <code>Authorization</code> vagy <code>Proxy-Authorization</code> kérelmek mindig megkerülik a megosztott gyorsítótár keresését és tárolását."
r1712_strict_cache_control = "Rosszul formázott vagy ütköző válasz A <code>Cache-Control</code> direktívák elutasításra kerülnek, ahelyett, hogy visszakerülnének a konfigurált TTL-ekre; A <code>s-maxage</code> elsőbbséget élvez a <code>max-age</code>-val szemben."
r1712_mandatory_revalidation = "A <code>must-revalidate</code>, <code>proxy-revalidate</code> és <code>s-maxage</code> tiltja az elavult újrafelhasználást a frissesség lejárta után."
r1712_encrypted_cache_upgrade_note = "Megjegyzés a titkosított gyorsítótár frissítéséről"
r1712_encrypted_cache_upgrade_intro = "Fluxheim A 1.7.12 a titkosított lemezgyorsítótár objektumokat gyökér-kötött adatokba és indexkulcsokba helyezi át tartós nonce állapotú. Az első indítás egy régebbi titkosított gyökér ellen, és minden helyi kulcs elforgatása szándékosan hidegen törli a gyorsítótárat a forgalom kiszolgálása előtt."
r1712_encrypted_cache_disposable = "A titkosított gyorsítótárat kezelje eldobható gyorsítóként, ne a rekord forrásaként."
r1712_encrypted_cache_private_storage = "Minden gyorsítótár-gyökérnek adjon állandó privát tárhelyet, és ne másoljon át semmilyen állapotot a független gyökerek között."
r1712_encrypted_cache_warmup = "Tervezze meg az eredetkapacitást az első bemelegítéshez a frissítés vagy a kulcsok elforgatása után."
r1712_client_certificate_revocation = "Ügyféltanúsítvány visszavonása"
r1712_client_certificate_revocation_intro = "Ha a kölcsönös TLS-nak el kell utasítania a visszavont ügyféltanúsítványokat, biztosítson egy korlátozott PEM CRL köteget. A Fluxheim érvényesíti a teljes kibocsátói láncot, és elutasítja a lejárt vagy hiányos CRL szabályzatot."
r1712_client_certificate_revocation_compliance = "A FIPS vagy ISO által megkövetelt megfelelőségi módban a szükséges ügyfél-hitelesítéshez CRL köteg is szükséges. A szokásos ügyfél-hitelesítés a visszavonást kifejezett engedélyezésként tartja meg."
r1712_fips_backend_evidence = "FIPS háttér bizonyíték"
r1712_fips_backend_evidence_intro = "A Fluxheim külön rögzített CI proof környezeteket biztosít a OpenSSL-FIPS és rustls/AWS-LC-FIPS profilokhoz. Pontos bináris profilt készítenek és futtatnak, lefelé irányuló és tanúsítvánnyal ellenőrzött upstream TLS-t hajtanak végre, elutasítják az inkompatibilis házirendet, és rögzítik a fordító-, szolgáltató-, függőségi-, bináris- és képazonosítókat."
r1712_fips_backend_evidence_boundary = "Ez reprodukálható háttér bizonyíték, nem termékszintű FIPS érvényesítés. Tartsa elkülönítve a próbatárolókat a normál kiadású képektől, és tekintse át a bizonyítékokat a pontosan telepített buildhez."
r1712_read_fips_evidence_guide = "Olvassa el a FIPS bizonyítékok útmutatóját"
r1712_loader_admission = "Modulbetöltési korlátozások"
r1712_loader_admission_description = "A nyilvános bővítményjegyzékeknek rögzített SHA-256 kivonatot kell tartalmazniuk. A teljes folyamatban egyszerre legfeljebb két modul fordítható. A lefordított kimenet alapértelmezett korlátja 32 MiB, és nem haladhatja meg a 256 MiB értéket."
r1712_file_identity = "Fájlazonosító"
r1712_file_identity_description = "A Fluxheim hivatkozások követése nélkül nyitja meg a jóváhagyott bővítményfájlokat, megtartja az érvényesített normál fájlkezelőt, és az elérési út újranyitása nélkül beolvassa a modul bájtjait."
