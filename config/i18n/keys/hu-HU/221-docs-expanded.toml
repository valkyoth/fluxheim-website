fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "A Fluxheim 1.7.2 megtartja a Wasm opcionális jellegét, és hozzáadja az első korlátozott natív HTTP/1 hook-családot request-header és response-header kezeléshez. A pluginek jóváhagyott szintetikus policy-módosításokat végezhetnek, de továbbra sem kapnak nyers headereket, bodykat, fájlrendszer-hozzáférést, hálózati hozzáférést, privát kulcsokat vagy admin API-kat."
