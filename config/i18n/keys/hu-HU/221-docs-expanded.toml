cache_policy_limits = "Cache-policy korlátok"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "A cache hookok külön, folyamat szintű felvételi plafont használnak, hogy a forró cache-policy útvonalak ne vegyék el a kapacitást az access, route vagy header hookoktól."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "A Fluxheim 1.7.5 opcionálisan hagyja a Wasmot, és kiterjeszti a korlátozott native HTTP/1 cache-policy hookokat az access-decision, header és route-decision hookok mellett. A pluginek folytathatják a normál cache viselkedést, továbbengedhetnek origin felé, megkerülhetik a cache-t, kihagyhatják a tárolást, elutasíthatnak, fix mobile/desktop cache key variánsokat választhatnak, valamint fix cache-store TTL-t, taget és tárolt header metaadatokat csatolhatnak, de továbbra sem bocsáthatnak ki tetszőleges cache key byteokat, tetszőleges TTL-eket, tetszőleges tageket, nyers response headereket, bodykat, filesystem-hozzáférést, hálózati hozzáférést, private keyeket vagy admin APIs-t."
cache_metadata = "Cache metaadatok"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "A <code>cache-lookup</code> hookok fix mobile/desktop cache key variánsokat adnak hozzá. A <code>cache-store</code> hookok fix TTL-t, taget és tárolt header metaadatokat állítanak be."
module_identity = "Modulazonosság"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "A process-wide, cache-global, cache-vhost, per-plugin és per-attachment végrehajtási felső határok megakadályozzák a korlátlan pluginmunkát."
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "A Fluxheim 1.7.7 opcionálisan hagyja a Wasmot, és hozzáadja az első választható Proxy-Wasm ABI-kompatibilitási előnézetet. Külön, feature gate által védett gazdahívási névteret hoz létre szigorú manifest-ellenőrzéssel és a nem támogatott hívások determinisztikus, biztonságos elutasításával; nem állítja, hogy tetszőleges meglévő Proxy-Wasm pluginok változtatás nélkül futnak."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "A lefordított modulok a plugin digestjéhez, az ABI-verzióhoz, a hookok funkciókészletéhez, a gazdahívási névtérhez és a Fluxheim-verzióhoz kötődnek, így későbbi újrafelhasználásuk nem lépheti át a kiadás-, funkció- vagy ABI-határokat."
proxy_wasm_preview = "Proxy-Wasm-előnézet"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Fordítsa le a <code>wasm-proxy-abi</code> használatával, engedélyezze az <code>allow_preview_abi</code> beállítást, és deklarálja a <code>proxy-wasm-preview</code> ABI-t, valamint a gazdahívási névteret. A nem támogatott importok és hívások biztonságosan elutasításra kerülnek."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Több-bérlős telepítéseknél engedélyezze a <code>[server.host_routing].strict = true</code> beállítást, így a hiányzó vagy érvénytelen host-azonosság <code>400</code>, az ismeretlen hosts pedig <code>421</code> választ adnak az alapértelmezett webhely helyett."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "A konfigurációs fájlok és minden meglévő szülőkönyvtár megbízható tulajdonban legyen, és a csoport vagy más felhasználók ne írhassák őket."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Cserélje le a folyamatot, ha a TLS, listeners, streams, UDP, ACME, cache-tisztítás, tracing vagy a felügyelt PHP-FPM folyamat beállításai változnak; a szokásos útválasztás és kérés közbeni szabályok snapshot-újratöltést használhatnak."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Használjon a cache-szabályokhoz méretezett tartós, írható volume-ot. Minden storage-bin replika kapjon saját helyi vagy RWO volume-ot; megosztott RWX storage csak ellenőrzött csomópontközi zárolással és orchestration szintű egyetlen-writer kikényszerítéssel használható."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Minden futó Fluxheim folyamathoz egy storage-bin root tartozzon; a tulajdonjog tanácsadó fájlrendszerzárat használ, a több writer által megosztott roots pedig ellenőrzött külső zárolás nélkül nem biztonságosak."
