fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "A Fluxheim 1.7.3 opcionálisan tartja a Wasmot, és korlátozott native HTTP/1 route-decision hookokat ad az access-decision és header hookok mellé. A pluginek folytathatnak, elutasíthatnak vagy kiválaszthatnak konfigurált canary és mirror útvonalágakat, de továbbra sem hozhatnak létre upstreamet, nem kerülhetik meg az útvonal-egyeztetést, nem írhatják felül a Fluxheim hozzáférési szabályzatát, és nem kaphatnak nyers headereket, bodykat, fájlrendszer-hozzáférést, hálózatot, privát kulcsokat vagy admin API-kat."
