version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Az 1.6.37-es verzió a végső Wasm előtti crate-határ takarítás: az ACME, observability, cache, load-balancer, PHP-FPM és native runtime belső részei kisebb, crate-tulajdonú modulokba kerülnek, miközben a runtime viselkedése stabil marad."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Az 1.6.37-es verzió megbízhatóbbá teszi a helyi observability smoke-ot azzal, hogy frissen kiosztott portokkal újrapróbálja az ideiglenes Prometheus- és Jaeger-indításokat, ha a host-network portok más runner folyamatokkal ütköznek."

