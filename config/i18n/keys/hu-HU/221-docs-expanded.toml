fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "A Fluxheim 1.7.4 továbbra is választhatóan kezeli a Wasm-ot, és korlátozott natív HTTP/1 cache-policy hookokat ad az access-decision, header és route-decision hookok mellé. A pluginek folytathatják a normál cache-viselkedést, továbbengedhetnek az origin felé, megkerülhetik a cache-t, kihagyhatják a tárolást vagy elutasíthatnak, de továbbra sem módosíthatnak nyers cache-kulcsokat, TTL-eket, tageket, válaszfejléceket vagy tárolt metaadatokat, és nem kapnak nyers fejléceket, body-kat, fájlrendszer-hozzáférést, hálózati hozzáférést, privát kulcsokat vagy admin API-kat."
