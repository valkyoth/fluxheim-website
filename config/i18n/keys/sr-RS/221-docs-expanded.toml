version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Верзија 1.6.37 је завршно чишћење граница crate-ова пре Wasm-а: ACME, observability, cache, load-balancer, PHP-FPM и унутрашњи делови native runtime-а прелазе у мање модуле у власништву crate-а, док понашање runtime-а остаје стабилно."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Верзија 1.6.37 чини локални observability smoke поузданијим поновним покушајем привремених покретања Prometheus-а и Jaeger-а са ново додељеним портовима када се host-network портови такмиче са другим runner процесима."

