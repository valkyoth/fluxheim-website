fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 оставља Wasm као опцију и додаје ограничене native HTTP/1 cache-policy hook-ове поред access-decision, header и route-decision hook-ова. Plugin-и могу да наставе нормално понашање cache-а, проследе ка origin-у, заобиђу cache, прескоче чување или одбију, али и даље не могу да мењају сирове cache кључеве, TTL-ове, tag-ове, response header-е или сачуване метаподатке, нити да добију сирове header-е, body-је, приступ filesystem-у, мрежни приступ, приватне кључеве или admin API-је."
cache_decisions = "Cache одлуке"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hook-ови могу да наставе, проследе ка origin-у, заобиђу cache или одбију. <code>cache-store</code> hook-ови могу да наставе, прескоче чување или одбију пре уписа у memory/disk cache."
cache_policy_limits = "Cache-policy ограничења"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hook-ови користе посебан процесни лимит пријема, тако да активне cache-policy руте не могу да исцрпе access, route или header hook-ове."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 задржава Wasm као опционалан и проширује ограничене native HTTP/1 cache-policy hook-ове уз access-decision, header и route-decision hook-ове. Plugin-и могу да наставе нормално cache понашање, пропусте до origin-а, заобиђу cache, прескоче складиштење, одбију, изаберу фиксне mobile/desktop cache-key варијанте и додају фиксне cache-store TTL, tag и stored-header metadata. И даље не могу да емитују произвољне cache-key bytes, произвољне TTL-ове, произвољне tag-ове, raw response headers, bodies, filesystem access, network access, private keys или admin APIs."
cache_metadata = "Cache метаподаци"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hook-ови додају фиксне mobile/desktop cache-key варијанте. <code>cache-store</code> hook-ови постављају фиксне TTL, tag и stored-header metadata."
module_identity = "Идентитет модула"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Process-wide, cache-global, cache-vhost, per-plugin и per-attachment execution ceilings спречавају неограничен plugin рад."
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 задржава Wasm као опционалан и додаје први опциони Proxy-Wasm ABI compatibility preview. Уводи засебан host-call namespace под feature gate-ом, са строгом manifest валидацијом и детерминистичком fail-closed обрадом неподржаних call-ова; то не значи да ће произвољни постојећи Proxy-Wasm plugin-и радити без измена."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Компајлирани модули су везани за plugin digest, ABI верзију, hook feature surface, host-call namespace и Fluxheim верзију, тако да будућа поновна употреба не може да пређе release, feature или ABI границе."
proxy_wasm_preview = "Proxy-Wasm преглед"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Компајлирајте са <code>wasm-proxy-abi</code>, укључите <code>allow_preview_abi</code> и декларишите и <code>proxy-wasm-preview</code> ABI и host-call namespace. Неподржани imports и calls завршавају fail-closed."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "За multi-tenant deployments укључите <code>[server.host_routing].strict = true</code>: недостајући или неважећи host identity враћа <code>400</code>, а непознати hosts враћају <code>421</code> уместо да стигну до default site-а."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Држите config files и све постојеће parent directories под поузданом ownership и без права уписа за group или друге users."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Замените process када се промене TLS, listeners, streams, UDP, ACME, cache purging, tracing или managed PHP-FPM process settings; обичан routing и request-time policy могу да користе snapshot reload."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Користите persistent writable volume величине прилагођене cache policy-ју. Свакој storage-bin replica-и доделите сопствени local или RWO volume; shared RWX storage користите само уз проверен cross-node locking и single-writer принуду на orchestration нивоу."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Користите један storage-bin root за сваки покренути Fluxheim process; ownership користи advisory filesystem lock, па shared multi-writer roots нису безбедни без провереног external locking-а."
