r1712_released_july_15_2026 = "Објављено 15. јула 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Додаје кеш меморију, прокси и метаподатке засноване на стандардима за омогућавање"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Доказује аутентичност поновног учитавања снимка уживо, враћања, провере интегритета и постојаност поновног покретања"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Додаје поновљиве доказе за FIPS позадинске системе и широко ојачавање изворног извршног окружења"
r1712_whats_next_summary = "додаје опционе стандардне метаподатке, доказ аутентификованог враћања снимка, поновљиве доказе за FIPS позадинске системе и јаче границе кеша, TLS-а, Wasm-а, баферовања и токова."
r1712_release_series_digest = "Серија Fluxheim 1.7: опциони стандардни метаподаци кеша, проксија и сажетка одговора; аутентификовано поновно учитавање и враћање снимка уживо; поновљиви докази за FIPS позадинске системе; надоградње процеса без застоја; независно тестирани примери Wasm политика; и јаче границе кеша, TLS-а, баферовања, токова и протокола."
r1712_standards_based_response_metadata = "Метаподаци одговора засновани на стандардима"
r1712_response_metadata_intro = "Метаподаци одговора су подразумевано онемогућени. Омогућите само поља која су вам потребна; Fluxheim их изводи из стварног резултата кеша, грешке проксија и коначних бајтова одговора без откривања кључева кеша, адреса позадинских сервера, DNS имена или необрађених грешака."
r1712_field = "Поље"
r1712_what_it_reports = "Шта извештава"
r1712_cache_status_description = "Исходи кеша према RFC 9211, као што су погодак, промашај, прослеђивање застарелог садржаја, поновна валидација, истек и заобилажење."
r1712_proxy_status_description = "Детаљи ниске кардиналности према RFC 9209 за грешке које генерише Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 над коначним садржајем HTTP поруке након компресије."
r1712_repr_digest_description = "SHA-256 само када Fluxheim држи потпуну изабрану репрезентацију."
r1712_live_snapshots_and_rollback = "Снимци уживо и враћање"
r1712_live_snapshot_intro = "Овјерени снимци могу објавити валидираног кандидата, замијенити активни рутер и вратити се без поновног покретања уобичајених имплементација само за рутирање. Сваки захтев остаје на једној генерацији рутера од почетка до краја."
r1712_snapshot_private_directory = "Чувајте складиште снимака у наменском приватном директоријуму; постојећи не-приватни директоријуми и корени система датотека су одбијени."
r1712_snapshot_process_upgrade = "Користите надоградњу процеса када су активни сервиси здравља или откривања балансера оптерећења у позадини."
r1712_snapshot_integrity_restart = "Покрените проверу интегритета снимака након објављивања или враћања и проверите да ли је изабрана генерација преживела поновно покретање."
r1712_read_snapshot_contract = "Прочитајте комплетан уговор о снимку"
r1712_authorization_cache_bypass = "Захтеви који садрже <code>Authorization</code> или <code>Proxy-Authorization</code> увек заобилазе претрагу и складиштење у дељеном кешу."
r1712_strict_cache_control = "Неисправне или међусобно супротне директиве одговора <code>Cache-Control</code> се одбијају уместо враћања на подешене TTL вредности; <code>s-maxage</code> има предност над <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> и <code>s-maxage</code> забрањују поновну употребу застарелог садржаја након истека свежине."
r1712_encrypted_cache_upgrade_note = "Напомена о надоградњи шифрованог кеша"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 премешта шифроване објекте дисковног кеша на кључеве података и индекса везане за корен, са трајним nonce стањем. Прво покретање над старијим шифрованим кореном и свака ротација локалног кључа намерно потпуно празне тај кеш пре опслуживања саобраћаја."
r1712_encrypted_cache_disposable = "Третирајте шифровани кеш као једнократно убрзање, а не извор записа."
r1712_encrypted_cache_private_storage = "Дајте сваком корену кеша трајно приватно складиште и немојте копирати једнократно стање између независних корена."
r1712_encrypted_cache_warmup = "Планирајте изворни капацитет за прво загревање након надоградње или ротирања тастера."
r1712_client_certificate_revocation = "Опозив сертификата клијента"
r1712_client_certificate_revocation_intro = "Када узајамни TLS мора да одбије опозване клијентске сертификате, наведите ограничени PEM CRL пакет. Fluxheim проверава цео ланац издавалаца и одбија истекле или непотпуне CRL смернице."
r1712_client_certificate_revocation_compliance = "Обавезна аутентификација клијента у режиму усклађености који захтева FIPS или ISO такође захтева CRL пакет. Обична аутентификација клијента задржава проверу опозива као изричито укључиву опцију."
r1712_fips_backend_evidence = "Докази за FIPS позадинске системе"
r1712_fips_backend_evidence_intro = "Fluxheim обезбеђује засебно фиксирана CI окружења за доказивање профила OpenSSL-FIPS и rustls/AWS-LC-FIPS. Она граде и покрећу тачну бинарну датотеку профила, испитују низводни и сертификатом проверени узводни TLS, одбијају неусклађене смернице и бележе идентитете компајлера, добављача, зависности, бинарне датотеке и слике."
r1712_fips_backend_evidence_boundary = "Ово су поновљиви докази позадинског система, а не FIPS валидација целог производа. Држите контејнере за доказивање одвојено од нормалних слика издања и прегледајте доказе за тачну верзију коју примењујете."
r1712_read_fips_evidence_guide = "Прочитајте водич за FIPS доказе"
r1712_loader_admission = "Контрола учитавања модула"
r1712_loader_admission_description = "Јавни манифести додатака морају да садрже фиксни SHA-256 сажетак. У целом процесу истовремено се компајлирају највише два модула. Компајлирани излаз подразумевано је ограничен на 32 MiB и не може да пређе 256 MiB."
r1712_file_identity = "Идентитет датотеке"
r1712_file_identity_description = "Fluxheim отвара одобрене датотеке додатака без праћења веза, задржава проверену ручку регуларне датотеке и чита бајтове модула преко те ручке без поновног отварања путање."
