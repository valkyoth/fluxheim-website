fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 继续将 Wasm 保持为可选功能，并在 access-decision 和 header hook 旁加入受限的 native HTTP/1 route-decision hook。插件可以继续、拒绝，或选择已配置的 canary 与 mirror 路由分支，但仍不能创建 upstream、绕过路由匹配、覆盖 Fluxheim 访问策略，或接收原始 header、body、文件系统访问、网络访问、私钥或 admin API。"
