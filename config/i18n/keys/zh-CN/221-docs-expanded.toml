fluxheim_1_7_6_keeps_wasm_optional_and_hardens_the_mature_native_http_1_hook_runtime_compiled_modules_now_carry_identities_scoped_by_plugin_sha_256_digest_abi_version_native_hook_feature_surface_and_fluxheim_version_cache_hooks_also_get_per_vhost_admission_budgets_under_the_process_wide_cache_hook_ceiling_so_one_vhost_cannot_starve_another = "Fluxheim 1.7.6 继续将 Wasm 保持为可选功能，并加固成熟的 native HTTP/1 hook runtime。编译后的 module 现在带有由 plugin SHA-256 digest、ABI version、native hook feature surface 和 Fluxheim version 限定范围的 identity；cache hook 还会在 process-wide cache-hook ceiling 下获得按 vhost 分配的 admission budget，避免一个 vhost 耗尽另一个 vhost 的执行额度。"
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_and_fluxheim_version_so_future_reuse_cannot_cross_release_or_feature_boundaries = "compiled module 会绑定到 plugin digest、ABI version、hook feature surface 和 Fluxheim version，因此未来复用时不能跨越 release 或 feature 边界。"
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "process-wide、cache-global、cache-vhost、per-plugin 和 per-attachment 执行上限会防止 plugin work 无限制增长。"
