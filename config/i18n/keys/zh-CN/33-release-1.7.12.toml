r1712_released_july_15_2026 = "发布日期：2026 年 7 月 15 日"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "添加选择加入基于标准的缓存、代理和响应摘要元数据"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "证明经过身份验证的实时快照重新加载、回滚、完整性检查和重新启动持久性"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "添加可重现的 FIPS-backend 证据和广泛的本机运行时强化"
r1712_whats_next_summary = "添加了选择加入标准元数据、经过身份验证的快照回滚证明、可重现的 FIPS-backend 证据以及更强大的缓存、TLS、Wasm、缓冲和流边界。"
r1712_release_series_digest = "Fluxheim 1.7 发布系列：选择加入基于标准的缓存、代理和响应摘要元数据；经过身份验证的实时快照重新加载和回滚；可重复的 FIPS-backend 证据；零停机流程升级；独立测试的Wasm策略示例；以及更强的缓存、TLS、缓冲、流和协议边界。"
r1712_standards_based_response_metadata = "基于标准的响应元数据"
r1712_response_metadata_intro = "默认情况下禁用响应元数据。仅启用您需要的字段； Fluxheim 从实际缓存结果、代理失败和最终响应字节中派生它们，而不会暴露缓存密钥、后端地址、DNS 名称或原始错误。"
r1712_field = "字段"
r1712_what_it_reports = "报告内容"
r1712_cache_status_description = "RFC 9211 缓存结果，例如命中、未命中、过时转发、重新验证、过期和旁路。"
r1712_proxy_status_description = "RFC 9209 Fluxheim 生成的故障的低基数详细信息。"
r1712_content_digest_description = "RFC 9530 SHA-256 压缩后最终的HTTP 消息内容。"
r1712_repr_digest_description = "SHA-256 仅当 Fluxheim 持有完整的选定表示时。"
r1712_live_snapshots_and_rollback = "实时快照和回滚"
r1712_live_snapshot_intro = "经过身份验证的快照可以发布经过验证的候选者、替换活动路由器并回滚，而无需重新启动正常的仅路由部署。每个请求从开始到结束都停留在一代路由器上。"
r1712_snapshot_private_directory = "将快照存储保存在专用的私有目录中；现有的非私有目录和文件系统根被拒绝。"
r1712_snapshot_process_upgrade = "当后台负载均衡器运行状况或发现服务处于活动状态时，使用进程升级。"
r1712_snapshot_integrity_restart = "在发布或回滚后运行快照完整性检查，并验证所选生成是否在重新启动后仍然存在。"
r1712_read_snapshot_contract = "阅读完整的快照运行规范"
r1712_authorization_cache_bypass = "携带 <code>Authorization</code> 或 <code>Proxy-Authorization</code> 的请求始终绕过共享缓存查找和存储。"
r1712_strict_cache_control = "格式错误或冲突的响应 <code>Cache-Control</code> 指令将被拒绝，而不是回退到配置的 TTL； <code>s-maxage</code> 优先于 <code>max-age</code>。"
r1712_mandatory_revalidation = "<code>must-revalidate</code>、<code>proxy-revalidate</code>、<code>s-maxage</code> 禁止保鲜期满后重复使用。"
r1712_encrypted_cache_upgrade_note = "加密缓存升级说明"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 将加密的磁盘缓存对象移动到具有持久随机数状态的根绑定数据和索引键。针对较旧的加密根的首次启动以及每次本地密钥轮换都会在提供流量之前有意冷清除缓存。"
r1712_encrypted_cache_disposable = "将加密缓存视为可丢弃的加速数据，而不是权威数据源。"
r1712_encrypted_cache_private_storage = "为每个缓存根提供持久私有存储，并且不在独立根之间复制随机数状态。"
r1712_encrypted_cache_warmup = "为升级或轮换密钥后的首次缓存预热预留足够的源站容量。"
r1712_client_certificate_revocation = "客户端证书吊销"
r1712_client_certificate_revocation_intro = "当相互 TLS 必须拒绝撤销的客户端证书时，请提供有界的 PEM CRL 捆绑包。 Fluxheim 验证完整的发行人链并拒绝过期或不完整的 CRL 策略。"
r1712_client_certificate_revocation_compliance = "FIPS 或 ISO 所需的合规模式中所需的客户端身份验证还需要 CRL 捆绑包。普通客户端身份验证将撤销作为显式选择加入。"
r1712_fips_backend_evidence = "FIPS 后端验证证据"
r1712_fips_backend_evidence_intro = "Fluxheim 为 OpenSSL-FIPS 和 rustls/AWS-LC-FIPS 配置分别提供依赖项固定的 CI 验证环境。环境会构建并运行对应配置的二进制文件，测试下游 TLS 和经过证书验证的上游 TLS，拒绝不兼容策略，并记录编译器、加密提供程序、依赖项、二进制文件及镜像的标识。"
r1712_fips_backend_evidence_boundary = "这是可重现的后端验证证据，并不代表产品整体获得 FIPS 认证。请将验证容器与常规发布镜像分开，并核对证据是否与实际部署的构建完全一致。"
r1712_read_fips_evidence_guide = "阅读 FIPS 证据指南"
r1712_loader_admission = "加载准入控制"
r1712_loader_admission_description = "公开清单必须固定 SHA-256 摘要。整个进程最多同时执行两个编译任务；编译产物默认上限为 32 MiB，绝对上限为 256 MiB。"
r1712_file_identity = "文件身份一致性"
r1712_file_identity_description = "Fluxheim 打开批准的插件文件而不跟踪链接，保留经过验证的常规文件句柄，并从该句柄读取模块字节而不重新打开路径。"
