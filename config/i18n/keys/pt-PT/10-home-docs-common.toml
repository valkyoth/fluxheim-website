[home]
meta_description = "Fluxheim é um servidor web, reverse proxy e servidor de cache modular de alto desempenho construído em Rust."
meta_description_secure = "Fluxheim é um servidor web, reverse proxy e servidor de cache modular de alto desempenho. Escrito em Rust. Seguro por predefinição."
meta_description_short = "Um servidor edge e reverse proxy seguro para memória construído em Rust."
hero_memory_safe = "Seguro para memória"
hero_edge_server = "Servidor edge"
hero_built_in_rust = "Construído em Rust"
hero_line_one = "Reverse proxy modular, cache, balanceador de carga e host estático escrito"
hero_line_two = "em Rust. Seguro por predefinição com TLS, ACME, compressão, política edge,"
hero_line_three = "dynamic upstream discovery e espelhamento seguro de tráfego integrados."
tag_fluxheim_core = "Núcleo Fluxheim"
tag_rootless_containers = "Contentores rootless"
features_heading = "Tudo o que precisa no edge"
features_intro = "Fluxheim é entregue como builds focadas e modulares - use apenas o que o seu deployment precisa."
memory_safe_by_design = "Seguro para memória por design"
memory_safe_by_design_text = "Escrito em Rust com uma toolchain estável fixada. Sem buffer overflows, sem use-after-free e sem data races por construção."
fluxheim_http_core = "Núcleo HTTP do Fluxheim"
fluxheim_http_core_text = "Um runtime edge nativo em Rust com connection pooling, upstream retries, active health checks, HTTP/2, WebSocket upgrades e gRPC pass-through."
load_balancer_control_plane = "Plano de controlo do balanceador"
load_balancer_control_plane_text = "Binário e imagem load-balancer 1.5 focados com seleção avançada, persistência local, política health/ejection, filas limitadas e controlos de membros em runtime."
modular_build_profiles = "Perfis de build modulares"
modular_build_profiles_text = "Compile apenas o que precisa. Perfis focados para static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring e bundles de produção com compressão."
tls_managed_acme = "TLS e ACME gerido"
tls_managed_acme_text = "rustls-first com caminhos de build OpenSSL e FIPS/ISO suportados, client certificate auth, upstream mTLS, emissão ACME automática e SNI multi-cert."
advanced_cache_system = "Sistema de cache avançado"
advanced_cache_system_text = "Backends de cache em memória, disco, tiered e encriptados com compressão gzip, Zstandard e Brotli segura para cache, além de range caching para objetos grandes."
container_native = "Nativo para contentores"
container_native_text = "Imagens Podman rootless para Wolfi, Alpine, SUSE Micro e Debian. Systemd/RPM para deployments nativos. Zero assets externos no arranque."
prometheus_opentelemetry = "Prometheus e OpenTelemetry"
prometheus_opentelemetry_text = "Listener opcional de métricas Prometheus, exportação OTLP de métricas, propagação de trace context e exportação OTLP de traces para observability completa."
geo_context_text = "Consultas MMDB locais opcionais para políticas de país e ASN usando MaxMind GeoIP2/GeoLite2 ou datasets CIRCL Geo Open. Sem consulta remota nem downloader no request path."
tcp_stream_proxy = "TCP stream proxy"
tcp_stream_proxy_text = "Serviços TCP L4 raw com stream routes dedicadas, limites reais idle/lifetime/byte, controlos upstream TLS/mTLS, política weighted/drain/backup e PROXY protocol local à route."
php_fpm_support = "Suporte PHP-FPM"
php_fpm_support_text = "Ponte PHP-FPM FastCGI opcional para aplicações front-controller estilo WordPress. Resolução estrita de scripts e tratamento limitado de requests."
edge_policy_controls = "Controlos de política edge"
edge_policy_controls_text = "ACLs aware de trusted proxy, rate limits, auth subrequests, traffic mirroring, regex rewrites, filas limitadas, validação estrita de config e request handling endurecido."
