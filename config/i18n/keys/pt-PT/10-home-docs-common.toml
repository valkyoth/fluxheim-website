last_updated_june_23_2026 = "Última atualização: 23 de junho de 2026"
no_analytics_cookies = "Sem cookies de analytics"
no_analytics_cookies_text = "O website Fluxheim não usa cookies de analytics, cookies publicitários, fingerprinting, identificadores de local storage nem scripts de analytics de terceiros."
language_selector_cookie_text = "O seletor de idioma usa links normais e não precisa de cookie. Se um deployment futuro adicionar um cookie estritamente necessário, este aviso deve ser atualizado antes de essa alteração ser ativada."
aggregate_observability = "Observabilidade agregada"
aggregate_observability_text = "Recolhemos eventos first-party agregados de observability para contar visitas, uso de idiomas, secções de página, transferências, redirects para GitHub, latência de request e tempo visível aproximado numa página."
events_no_sensitive_text = "Estes eventos não contêm IPs raw, identificadores de utilizador, valores de cookies, fingerprints de navegador, request bodies, authorization headers nem query strings completas."
what_we_collect = "O que recolhemos"
privacy_collect_text = "O website regista métricas operacionais agregadas: request counts, page views, idioma selecionado, route normalizada, secção, classe de estado HTTP, duração do request, clicks de transferência, clicks de redirect para GitHub e tempo visível aproximado."
country_aggregation_text = "A agregação opcional por país pode ser ativada pelo operador. Quando ativa, o servidor deriva um código de país em memória e exporta apenas o código de país ou unknown."
what_we_do_not_collect = "O que não recolhemos"
privacy_do_not_collect_text = "Não exportamos IPs raw, identificadores por utilizador, analytics cookies, fingerprints de navegador, user agents completos, referrer URLs, request bodies, authorization headers, cookie headers nem query strings completas."
telemetry_use_text = "A telemetry é usada para operar o website, compreender o uso agregado da documentação e das transferências e detetar problemas de fiabilidade. Não é usada para criar perfis de visitantes individuais."
retention = "Retenção"
retention_text = "A retenção é controlada pelo deployment local de Prometheus e Grafana operado para o website. A aplicação web não escreve uma base de dados de analytics separada."
purpose_and_lawful_basis = "Finalidade e base legal"
gdpr_basis_text = "A finalidade da telemetry do website é segurança, fiabilidade, planeamento de capacidade e melhoria agregada da documentação. A base legal prevista é o interesse legítimo em operar e proteger o website com telemetry minimizada para privacidade."
data_minimisation = "Minimização de dados"
gdpr_minimisation_text = "As métricas usam labels limitados como locale, route normalizada, secção, classe de estado, artifact de transferência, target GitHub e código de país opcional. A implementação é desenhada para não armazenar nem exportar IPs raw ou identificadores de tracking ao nível do utilizador."
github_redirect_privacy_text = "Os clicks de saída para GitHub são contados de forma agregada antes de redirecionar o navegador para GitHub. O GitHub processa depois o request segundo os seus próprios termos e política de privacidade."
your_rights = "Os seus direitos"
gdpr_rights_text = "Como o website evita identificadores de utilizador e armazena apenas telemetry agregada, normalmente não conseguimos identificar um visitante específico nas métricas. Questões de privacidade ou RGPD podem ser abertas através do projeto Fluxheim no GitHub."
translation_notice = "Aviso sobre traduções"
translation_notice_text = "As traduções do website são assistidas por IA e mantidas numa base de melhor esforço. Correções e traduções melhoradas são bem-vindas nas <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">chaves i18n do website Fluxheim</a>."
