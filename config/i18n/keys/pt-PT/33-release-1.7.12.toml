r1712_released_july_15_2026 = "Lançado em 15 de julho de 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Adiciona cache baseado em padrões, proxy e metadados de resumo de resposta"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Comprova recarga, reversão, verificações de integridade e persistência de reinicialização de snapshots autenticados"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Adiciona evidência FIPS-backend reproduzível e ampla proteção de tempo de execução nativo"
r1712_whats_next_summary = "adiciona metadados de padrões opcionais, prova de reversão de instantâneo autenticado, evidência FIPS-backend reproduzível e cache mais forte, TLS, Wasm, buffer e limites de fluxo."
r1712_release_series_digest = "Fluxheim 1.7 série de lançamentos: cache baseado em padrões, proxy e metadados de resumo de resposta opcionais; recarga e reversão de instantâneos ao vivo autenticados; evidência FIPS-backend reproduzível; atualizações de processos com tempo de inatividade zero; exemplos de políticas Wasm testados de forma independente; e cache mais forte, TLS, buffer, fluxo e limites de protocolo."
r1712_standards_based_response_metadata = "Metadados de resposta baseados em padrões"
r1712_response_metadata_intro = "Os metadados de resposta estão desabilitados por padrão. Habilite apenas os campos necessários; Fluxheim os deriva do resultado real do cache, da falha do proxy e dos bytes de resposta finais sem expor chaves de cache, endereços de back-end, nomes DNS ou erros brutos."
r1712_field = "Campo"
r1712_what_it_reports = "O que relata"
r1712_cache_status_description = "Resultados de cache RFC 9211, como acerto, erro, encaminhamento obsoleto, revalidação, expiração e desvio."
r1712_proxy_status_description = "Detalhes de baixa cardinalidade de RFC 9209 para falhas geradas por Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 sobre o conteúdo final da mensagem HTTP após a compactação."
r1712_repr_digest_description = "SHA-256 somente quando Fluxheim contém a representação completa selecionada."
r1712_live_snapshots_and_rollback = "Instantâneos ao vivo e reversão"
r1712_live_snapshot_intro = "Os snapshots autenticados podem publicar um candidato validado, substituir o roteador ativo e reverter sem reiniciar as implantações normais somente de roteamento. Cada solicitação permanece em uma geração de roteador do início ao fim."
r1712_snapshot_private_directory = "Mantenha o armazenamento de instantâneos em um diretório privado dedicado; diretórios não privados existentes e raízes do sistema de arquivos são rejeitados."
r1712_snapshot_process_upgrade = "Use uma atualização de processo quando os serviços de descoberta ou integridade do balanceador de carga em segundo plano estiverem ativos."
r1712_snapshot_integrity_restart = "Execute verificações de integridade de instantâneo após a publicação ou reversão e verifique se a geração selecionada sobrevive à reinicialização."
r1712_read_snapshot_contract = "Leia o contrato instantâneo completo"
r1712_authorization_cache_bypass = "As solicitações que transportam <code>Authorization</code> ou <code>Proxy-Authorization</code> sempre ignoram a pesquisa e o armazenamento de cache compartilhado."
r1712_strict_cache_control = "As diretivas <code>Cache-Control</code> de resposta malformadas ou conflitantes são rejeitadas em vez de retornar aos TTLs configurados; <code>s-maxage</code> tem prioridade sobre <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> e <code>s-maxage</code> proíbem a reutilização obsoleta após o término da atualização."
r1712_encrypted_cache_upgrade_note = "Nota de atualização de cache criptografado"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 move objetos criptografados de cache de disco para dados vinculados à raiz e chaves de índice com estado nonce durável. A primeira inicialização em uma raiz criptografada mais antiga e cada rotação de chave local limpa intencionalmente esse cache antes de servir o tráfego."
r1712_encrypted_cache_disposable = "Trate o cache criptografado como uma aceleração descartável, não como uma fonte de registro."
r1712_encrypted_cache_private_storage = "Forneça a cada raiz de cache armazenamento privado persistente e não copie o estado nonce entre raízes independentes."
r1712_encrypted_cache_warmup = "Planeje a capacidade de origem para o primeiro aquecimento após a atualização ou rotação de chaves."
r1712_client_certificate_revocation = "Revogação de certificado de cliente"
r1712_client_certificate_revocation_intro = "Quando TLS mútuo deve rejeitar certificados de cliente revogados, forneça um pacote PEM CRL limitado. Fluxheim valida a cadeia completa do emissor e rejeita a política CRL expirada ou incompleta."
r1712_client_certificate_revocation_compliance = "A autenticação de cliente necessária em um modo de conformidade exigido por FIPS ou ISO também requer um pacote CRL. A autenticação de cliente comum mantém a revogação como uma aceitação explícita."
r1712_fips_backend_evidence = "Evidência de back-end FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim fornece ambientes de prova CI fixados separadamente para os perfis OpenSSL-FIPS e rustls/AWS-LC-FIPS. Eles constroem e executam o binário de perfil exato, exercem downstream e upstream com certificado verificado TLS, rejeitam políticas incompatíveis e registram identidades de compilador, provedor, dependência, binário e imagem."
r1712_fips_backend_evidence_boundary = "Esta é uma evidência de back-end reproduzível, não uma validação FIPS em nível de produto. Mantenha os contêineres de prova separados das imagens normais de lançamento e revise as evidências do build exato que você implantou."
r1712_read_fips_evidence_guide = "Leia o guia de evidências FIPS"
r1712_loader_admission = "Controlos de carregamento de módulos"
r1712_loader_admission_description = "Os manifestos públicos dos plugins têm de incluir um resumo SHA-256 fixo. Em todo o processo são compilados, no máximo, dois módulos em simultâneo. A saída compilada tem um limite predefinido de 32 MiB e não pode exceder 256 MiB."
r1712_file_identity = "Identidade do arquivo"
r1712_file_identity_description = "Fluxheim abre arquivos de plug-in aprovados sem seguir links, retém o identificador de arquivo regular validado e lê os bytes do módulo desse identificador sem reabrir o caminho."
