unsupported_native_runtime_shapes_still_fail_closed_with_explicit_blockers_instead_of_falling_back_to_legacy_adapters = "As formas runtime nativas não suportadas ainda falham no fechamento com bloqueadores explícitos, em vez de retornar aos adapters legados."
for_non_loopback_plaintext_peer_fill_urls_configure_cache_peer_fill_shared_secret_file_so_peer_responses_are_signed_before_they_can_be_stored = "Para texto simples non-loopback peer-fill URLs, configure <code>cache.peer_fill.shared_secret_file</code> para que as respostas dos pares sejam assinadas antes de serem armazenadas."
version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Atualiza a estrutura 1.6.36 com limpeza do proxy nativo, APIs próprias das crates, remoção de legado Pingora, imagens de observabilidade determinísticas e testes de regressão HTTP/1 chunked."
version_1_6_36_pins_the_prometheus_and_jaeger_smoke_test_images_to_stable_tags_so_local_and_ci_observability_checks_pull_deterministic_containers = "Atualiza a estrutura 1.6.36 com limpeza do proxy nativo, APIs próprias das crates, remoção de legado Pingora, imagens de observabilidade determinísticas e testes de regressão HTTP/1 chunked."
fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "O Fluxheim 1.7.2 mantém Wasm opcional e adiciona a primeira família limitada de hooks HTTP/1 nativos para cabeçalhos de pedido e resposta. Os plugins podem fazer alterações sintéticas de política aprovadas, mas continuam sem receber cabeçalhos brutos, corpos, acesso ao sistema de ficheiros, acesso à rede, chaves privadas ou APIs de administração."
