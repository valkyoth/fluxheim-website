fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 mantém Wasm opcional e adiciona hooks route-decision HTTP/1 nativos restritos juntamente com access-decision e hooks de cabeçalhos. Os plugins podem continuar, negar ou selecionar ramos de rota canary e mirror configurados, mas continuam sem poder inventar upstreams, contornar a correspondência de rotas, substituir a política de acesso do Fluxheim ou receber cabeçalhos brutos, corpos, acesso ao sistema de ficheiros, rede, chaves privadas ou APIs de administração."
route_decisions = "Decisões de rota"
route_decision_hooks_can_continue_deny_or_select_only_configured_matching_canary_and_mirror_route_branches = "Hooks <code>route-decision</code> só podem continuar, negar ou selecionar ramos de rota <code>canary</code> e <code>mirror</code> configurados e correspondentes."
selected_route_policy = "Política da rota selecionada"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "ACLs, rate limits, limites de concorrência, body limits, redirecionamentos e políticas de cabeçalhos da rota selecionada continuam a executar após uma decisão de rota Wasm."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 mantém Wasm optional e adiciona bounded native HTTP/1 cache-policy hooks alongside access-decision, header and route-decision hooks. Os plugins podem continue normal cache behavior, pass through origin, bypass cache, skip storage or deny, mas não podem mutate raw cache keys, TTLs, tags, response headers, stored metadata, or receive raw headers, bodies, filesystem access, network access, private keys or admin APIs."
cache_decisions = "Decisões de cache"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hooks can continue, pass, bypass or deny. <code>cache-store</code> hooks can continue, skip storage or deny before memory/disk cache writes."
cache_policy_limits = "Limites de cache-policy"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hooks usam um process-wide admission ceiling separado so hot cache-policy routes cannot starve access, route or header hooks."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 mantém Wasm opcional e alarga hooks cache-policy HTTP/1 nativos limitados juntamente com hooks access-decision, header e route-decision. Os plugins podem continuar o comportamento normal da cache, passar para a origin, contornar a cache, saltar o armazenamento, negar, selecionar variantes fixas mobile/desktop da cache key e anexar TTL, tag e metadados de headers armazenados fixos de cache-store, mas continuam sem poder emitir bytes arbitrários de cache key, TTLs arbitrários, tags arbitrários, response headers brutos, bodies, acesso ao filesystem, acesso à rede, chaves privadas ou admin APIs."
cache_metadata = "Metadados da cache"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "Os hooks <code>cache-lookup</code> adicionam variantes fixas mobile/desktop da cache key. Os hooks <code>cache-store</code> definem TTL, tag e metadados de headers armazenados fixos."
module_identity = "Identidade do módulo"
fluxheim_1_7_6_keeps_wasm_optional_and_hardens_the_mature_native_http_1_hook_runtime_compiled_modules_now_carry_identities_scoped_by_plugin_sha_256_digest_abi_version_native_hook_feature_surface_and_fluxheim_version_cache_hooks_also_get_per_vhost_admission_budgets_under_the_process_wide_cache_hook_ceiling_so_one_vhost_cannot_starve_another = "Fluxheim 1.7.6 mantém Wasm opcional e reforça o runtime maduro de hooks HTTP/1 nativos. Os módulos compilados passam a transportar identidades delimitadas pelo digest SHA-256 do plugin, versão ABI, superfície de funcionalidades de hooks nativos e versão do Fluxheim; os hooks de cache também recebem orçamentos de admissão por vhost abaixo do teto process-wide de cache-hook, para que um vhost não possa esgotar outro."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_and_fluxheim_version_so_future_reuse_cannot_cross_release_or_feature_boundaries = "Os módulos compilados ficam associados ao digest do plugin, versão ABI, superfície de funcionalidades de hooks e versão do Fluxheim, para que reutilização futura não cruze limites de release ou funcionalidades."
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Tetos de execução process-wide, cache-global, cache-vhost, por plugin e por attachment impedem trabalho ilimitado de plugins."
