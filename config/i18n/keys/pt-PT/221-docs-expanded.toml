version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "A versão 1.6.37 é a limpeza final das fronteiras de crates antes de Wasm: ACME, observabilidade, cache, load-balancer, PHP-FPM e internos do runtime nativo passam para módulos menores pertencentes às respetivas crates, mantendo estável o comportamento do runtime."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "A versão 1.6.37 torna o smoke local de observabilidade mais fiável ao repetir arranques descartáveis do Prometheus e Jaeger com portas recém-atribuídas quando portas host-network competem com outros processos runner."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "A partir da 1.7.0, o Fluxheim adiciona uma base de sandbox Wasm opcional. Está desativada por predefinição, é incompatível com privacy-mode e neste momento prova carregamento seguro de plugins e execução limitada antes de expor hooks de política request/response."
starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation = "A partir da 1.7.0, o Fluxheim adiciona uma base de sandbox Wasm opcional."
optional_webassembly_sandbox_foundation_for_future_policy_extensions_disabled_by_default = "Base de sandbox WebAssembly opcional para futuras extensões de política; desativada por predefinição."
privacy_builds_do_not_include_cache_metrics_tracing_otlp_export_or_wasm_features = "As builds privacy não incluem cache, métricas, tracing, exportação OTLP nem funcionalidades Wasm."
fluxheim_1_7_0_starts_the_optional_wasm_sandbox_foundation_it_proves_approved_root_plugin_loading_manifest_validation_and_bounded_wasmtime_execution_request_response_hooks_are_still_staged_for_later_1_7_x_releases = "O Fluxheim 1.7.0 inicia a base de sandbox WASM opcional. Prova carregamento de plugins a partir de raízes aprovadas, validação de manifesto e execução Wasmtime limitada. Os hooks request/response continuam planeados para versões 1.7.x posteriores."
