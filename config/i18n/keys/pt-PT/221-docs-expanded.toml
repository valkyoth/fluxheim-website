request_headers_and_response_headers_hooks_can_set_or_remove_only_allow_listed_synthetic_headers_such_as_the_policy_tier_example = "Os hooks <code>request-headers</code> e <code>response-headers</code> só podem definir ou remover cabeçalhos sintéticos permitidos, como o exemplo policy-tier."
