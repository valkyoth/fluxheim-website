country_aggregation_text = "ঐচ্ছিক দেশের সমষ্টি অপারেটর দ্বারা সক্ষম হতে পারে। যখন সক্রিয় থাকে, সার্ভার মেমরিতে একটি দেশের কোড প্রাপ্ত করে এবং শুধুমাত্র দেশের কোড বা অজানা রপ্তানি করে।"
what_we_do_not_collect = "আমরা যা সংগ্রহ করি না"
privacy_do_not_collect_text = "আমরা কাঁচা আইপি ঠিকানা, প্রতি-ব্যবহারকারী শনাক্তকারী, বিশ্লেষণ কুকি, ব্রাউজার আঙ্গুলের ছাপ, সম্পূর্ণ ব্যবহারকারী এজেন্ট, রেফারার ইউআরএল, অনুরোধ সংস্থা, অনুমোদন শিরোনাম, কুকি শিরোনাম, বা সম্পূর্ণ ক্যোয়ারী স্ট্রিং রপ্তানি করি না।"
telemetry_use_text = "টেলিমেট্রি ওয়েবসাইটটি পরিচালনা করতে, সামগ্রিক ডকুমেন্টেশন এবং ডাউনলোড ব্যবহার বুঝতে এবং নির্ভরযোগ্যতা সমস্যা সনাক্ত করতে ব্যবহৃত হয়। এটি পৃথক দর্শকদের সম্পর্কে প্রোফাইল তৈরি করতে ব্যবহৃত হয় না।"
retention = "সংরক্ষণ"
retention_text = "ওয়েবসাইটটির জন্য পরিচালিত স্থানীয় প্রমিথিউস এবং গ্রাফানা স্থাপনার দ্বারা ধারণ নিয়ন্ত্রণ করা হয়। ওয়েবসাইট অ্যাপ্লিকেশন একটি পৃথক বিশ্লেষণ ডাটাবেস লিখতে না."
purpose_and_lawful_basis = "উদ্দেশ্য এবং বৈধ ভিত্তি"
gdpr_basis_text = "The purpose of the website telemetry is security, reliability, capacity planning, and aggregate documentation improvement. The intended lawful basis is legitimate interest in operating and securing the website with গোপনীয়তা-minimised telemetry."
data_minimisation = "ডেটা মিনিমাইজেশন"
gdpr_minimisation_text = "মেট্রিক্স আবদ্ধ লেবেল ব্যবহার করে যেমন লোকেল, স্বাভাবিক রুট, বিভাগ, স্ট্যাটাস ক্লাস, ডাউনলোড আর্টিফ্যাক্ট, গিটহাব টার্গেট এবং ঐচ্ছিক দেশের কোড। বাস্তবায়নটি কাঁচা আইপি ঠিকানা বা ব্যবহারকারী-স্তরের ট্র্যাকিং সনাক্তকারী সংরক্ষণ বা রপ্তানি না করার জন্য ডিজাইন করা হয়েছে।"
github_redirect_privacy_text = "GitHub outbound clicks are counted in aggregate before redirecting the browser to GitHub. GitHub then processes the request under GitHub's own terms and গোপনীয়তা policy."
your_rights = "আপনার অধিকার"
gdpr_rights_text = "Because the website avoids user identifiers and stores only aggregate telemetry, we normally cannot identify a specific visitor inside the metrics. গোপনীয়তা or GDPR questions can be opened through the Fluxheim GitHub project."
translation_notice = "অনুবাদ নোটিশ"
translation_notice_text = "ওয়েবসাইট অনুবাদগুলি এআই-সহায়তা এবং সর্বোত্তম প্রচেষ্টার ভিত্তিতে রক্ষণাবেক্ষণ করা হয়। সংশোধন এবং উন্নত অনুবাদ স্বাগত জানাই <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">Fluxheim ওয়েবসাইট i18n কী</a>."
