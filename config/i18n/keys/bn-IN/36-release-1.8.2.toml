r182_summary = "সাতটি সর্বজনীন প্রোফাইলের প্রতিটির জন্য স্বাক্ষরবিহীন নেটিভ Windows x86_64 ZIP আর্কাইভ যোগ করে, Windows ফাইল সিস্টেম ও পরিচয়পত্রের সুরক্ষা বজায় রাখে এবং PHP SUSE Micro ইমেজকে স্বয়ংসম্পূর্ণ php-suse-bci রানটাইম দিয়ে প্রতিস্থাপন করে।"
