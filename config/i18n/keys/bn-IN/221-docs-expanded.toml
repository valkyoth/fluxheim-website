keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "config file এবং তার প্রতিটি বিদ্যমান parent directory বিশ্বস্ত ownership-এর অধীনে রাখুন এবং group বা অন্য user-এর লেখার অনুমতি বন্ধ রাখুন।"
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "TLS, listener, stream, UDP, ACME, cache purging, tracing বা managed PHP-FPM process setting বদলালে process প্রতিস্থাপন করুন; সাধারণ routing ও request-time policy snapshot reload ব্যবহার করতে পারে।"
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "cache policy অনুযায়ী আকারের স্থায়ী writable volume ব্যবহার করুন। প্রতিটি storage-bin replica-কে নিজস্ব local বা RWO volume দিন; cross-node locking যাচাই করা এবং orchestration স্তরে single-writer প্রয়োগ করা থাকলেই কেবল shared RWX storage ব্যবহার করুন।"
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "প্রতিটি চলমান Fluxheim process-এর জন্য একটি storage-bin root ব্যবহার করুন; ownership advisory filesystem lock ব্যবহার করে, তাই যাচাইকৃত external locking ছাড়া shared multi-writer root নিরাপদ নয়।"
