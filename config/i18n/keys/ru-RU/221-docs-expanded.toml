version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Версия 1.6.37 — финальная очистка границ crates перед Wasm: ACME, observability, cache, load-balancer, PHP-FPM и внутренности native runtime переходят в меньшие модули, которыми владеют соответствующие crates, при стабильном поведении runtime."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Версия 1.6.37 делает локальный observability smoke надёжнее, повторяя запуск одноразовых Prometheus и Jaeger с заново выделенными портами, когда host-network порты конкурируют с другими runner-процессами."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "Начиная с 1.7.0 Fluxheim добавляет необязательную основу песочницы Wasm. Она по умолчанию отключена, несовместима с privacy-mode и сейчас подтверждает безопасную загрузку плагинов и ограниченное выполнение до появления request/response policy hooks."
starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation = "Начиная с 1.7.0 Fluxheim добавляет необязательную основу песочницы Wasm."
