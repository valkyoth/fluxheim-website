fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 сохраняет Wasm опциональным и добавляет ограниченные native HTTP/1 route-decision hooks рядом с access-decision и header hooks. Плагины могут продолжить, запретить или выбрать настроенные canary и mirror ветви маршрута, но всё ещё не могут создавать upstream-ы, обходить сопоставление маршрутов, переопределять политику доступа Fluxheim или получать сырые headers, bodies, доступ к файловой системе, сети, приватным ключам или admin API."
route_decisions = "Решения маршрутов"
route_decision_hooks_can_continue_deny_or_select_only_configured_matching_canary_and_mirror_route_branches = "<code>route-decision</code> hooks могут только продолжить, запретить или выбрать настроенные совпадающие ветви маршрута <code>canary</code> и <code>mirror</code>."
selected_route_policy = "Политика выбранного маршрута"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "ACL, rate limits, concurrency limits, body limits, redirects и header-policy выбранного маршрута продолжают выполняться после Wasm-решения маршрута."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 оставляет Wasm optional и добавляет bounded native HTTP/1 cache-policy hooks рядом с access-decision, header и route-decision hooks. Plugins могут продолжать обычное поведение cache, pass through origin, bypass cache, skip storage или deny, но не могут изменять raw cache keys, TTLs, tags, response headers, stored metadata или получать raw headers, bodies, filesystem access, network access, private keys или admin APIs."
cache_decisions = "Cache-решения"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hooks могут continue, pass, bypass или deny. <code>cache-store</code> hooks могут continue, skip storage или deny перед memory/disk cache writes."
cache_policy_limits = "Ограничения cache-policy"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hooks используют отдельный process-wide admission ceiling, поэтому горячие cache-policy routes не могут исчерпать access, route или header hooks."
