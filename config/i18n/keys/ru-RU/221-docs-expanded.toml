version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Обновляет структуру 1.6.36: очистка native proxy, API в ответственных crate, удаление наследия Pingora, детерминированные observability-образы и регрессионные тесты HTTP/1 chunked."
