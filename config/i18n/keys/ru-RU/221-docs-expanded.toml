unsupported_native_runtime_shapes_still_fail_closed_with_explicit_blockers_instead_of_falling_back_to_legacy_adapters = "Неподдерживаемые собственные формы runtime по-прежнему не закрываются явными блокировщиками вместо возврата к устаревшим формам adapter."
