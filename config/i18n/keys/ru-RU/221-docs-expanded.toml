fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 сохраняет Wasm опциональным и добавляет первое ограниченное native HTTP/1 семейство hooks для request-header и response-header. Плагины могут выполнять одобренные синтетические изменения policy, но по-прежнему не получают сырые headers, bodies, доступ к файловой системе, сети, приватным ключам или admin API."
