r1712_released_july_15_2026 = "Выпущено 15 июля 2026 г."
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Добавляет дополнительные метаданные кэша, прокси-сервера и дайджеста ответов на основе стандартов."
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Доказывает аутентифицированную перезагрузку моментального снимка в реальном времени, откат, проверку целостности и постоянство перезапуска."
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Добавлены воспроизводимые доказательства FIPS-backend и расширенное встроенное усиление защиты во время выполнения."
r1712_whats_next_summary = "добавляет метаданные добровольных стандартов, подтверждение отката снимка с проверкой подлинности, воспроизводимые доказательства FIPS-backend и более надежный кеш, TLS, Wasm, буферизацию и границы потока."
r1712_release_series_digest = "Fluxheim 1.7: серия выпусков: возможность использования стандартного кэша, прокси-сервера и метаданных дайджеста ответов; перезагрузка и откат аутентифицированного живого снимка; воспроизводимые доказательства FIPS-backend; модернизация процессов без простоев; независимо протестированные примеры политик Wasm; и более сильный кеш, TLS, буферизация, поток и границы протокола."
r1712_standards_based_response_metadata = "Метаданные ответа на основе стандартов"
r1712_response_metadata_intro = "Метаданные ответа отключены по умолчанию. Включите только те поля, которые вам нужны; Fluxheim извлекает их из фактического результата кэширования, сбоя прокси-сервера и байтов окончательного ответа, не раскрывая ключи кэша, внутренние адреса, имена DNS или необработанные ошибки."
r1712_field = "Поле"
r1712_what_it_reports = "Что сообщает"
r1712_cache_status_description = "RFC 9211 результаты кэширования, такие как попадание, промах, устаревшая пересылка, повторная проверка, истечение срока действия и обход."
r1712_proxy_status_description = "Подробности RFC 9209 с низкой мощностью для сбоев, сгенерированных Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 поверх окончательного содержимого сообщения HTTP после сжатия."
r1712_repr_digest_description = "SHA-256 только тогда, когда Fluxheim содержит полное выбранное представление."
r1712_live_snapshots_and_rollback = "Живые снимки и откат"
r1712_live_snapshot_intro = "Снимки, прошедшие проверку подлинности, могут публиковать проверенного кандидата, заменять работающий маршрутизатор и выполнять откат без перезапуска обычных развертываний только с маршрутизацией. Каждый запрос от начала до конца остается в одном поколении маршрутизатора."
r1712_snapshot_private_directory = "Храните хранилище снимков в выделенном частном каталоге; существующие нечастные каталоги и корни файловой системы отклоняются."
r1712_snapshot_process_upgrade = "Используйте обновление процесса, когда фоновые службы балансировки нагрузки или обнаружения активны."
r1712_snapshot_integrity_restart = "Запустите проверку целостности моментального снимка после публикации или отката и убедитесь, что выбранное поколение выдерживает перезапуск."
r1712_read_snapshot_contract = "Прочитать полный контракт на моментальный снимок"
r1712_authorization_cache_bypass = "Запросы, содержащие <code>Authorization</code> или <code>Proxy-Authorization</code>, всегда обходят поиск и хранение в общем кэше."
r1712_strict_cache_control = "Неверный или противоречивый ответ. Директивы <code>Cache-Control</code> отклоняются вместо возврата к настроенным TTL; <code>s-maxage</code> имеет приоритет над <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> и <code>s-maxage</code> запрещают повторное использование устаревших файлов после истечения срока их актуальности."
r1712_encrypted_cache_upgrade_note = "Примечание по обновлению зашифрованного кэша"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 перемещает зашифрованные объекты дискового кэша в корневые данные и индексные ключи с устойчивым состоянием nonce. При первом запуске более старого зашифрованного корня и при каждой смене локального ключа этот кеш намеренно очищается перед обработкой трафика."
r1712_encrypted_cache_disposable = "Относитесь к зашифрованному кэшу как к одноразовому ускорению, а не как к источнику записи."
r1712_encrypted_cache_private_storage = "Предоставьте каждому корне кэша постоянное частное хранилище и не копируйте состояние nonce между независимыми корнями."
r1712_encrypted_cache_warmup = "Запланируйте исходную мощность для первого прогрева после обновления или замены ключей."
r1712_client_certificate_revocation = "Отзыв сертификата клиента"
r1712_client_certificate_revocation_intro = "Если взаимный TLS должен отклонить отозванные клиентские сертификаты, предоставьте ограниченный пакет PEM CRL. Fluxheim проверяет всю цепочку эмитентов и отклоняет просроченную или неполную политику CRL."
r1712_client_certificate_revocation_compliance = "Для обязательной аутентификации клиента в режиме соответствия требованиям FIPS или ISO также требуется пакет CRL. Обычная аутентификация клиента сохраняет отзыв как явное согласие."
r1712_fips_backend_evidence = "FIPS серверное свидетельство"
r1712_fips_backend_evidence_intro = "Fluxheim предоставляет отдельно закрепленные среды проверки CI для профилей OpenSSL-FIPS и rustls/AWS-LC-FIPS. Они создают и запускают точный двоичный файл профиля, используют нижестоящий и проверенный сертификатом восходящий TLS, отклоняют несовместимую политику и записывают идентификаторы компилятора, поставщика, зависимостей, двоичных файлов и изображений."
r1712_fips_backend_evidence_boundary = "Это воспроизводимое внутреннее свидетельство, а не проверка FIPS на уровне продукта. Храните пробные контейнеры отдельно от образов обычных выпусков и проверяйте доказательства именно той сборки, которую вы развертываете."
r1712_read_fips_evidence_guide = "Прочтите руководство по доказательствам FIPS."
r1712_loader_admission = "Контроль загрузки модулей"
r1712_loader_admission_description = "Публичные манифесты плагинов должны содержать фиксированный дайджест SHA-256. Во всём процессе одновременно компилируются не более двух модулей. Размер скомпилированного результата по умолчанию ограничен 32 MiB и не может превышать 256 MiB."
r1712_file_identity = "Идентификатор файла"
r1712_file_identity_description = "Fluxheim открывает утвержденные файлы плагинов без перехода по ссылкам, сохраняет проверенный дескриптор обычного файла и считывает байты модуля из этого дескриптора без повторного открытия пути."
