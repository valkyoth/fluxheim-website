released_june_29_2026 = "Выпущено 29 июня 2026 г."
adds_native_proxy_cache_parity_for_memory_filesystem_disk_storage_bin_encrypted_disk_openbao_transit_and_memory_disk_tiering = "Добавляет встроенную четность proxy-cache для памяти, диска файловой системы, storage-bin, зашифрованного диска, OpenBao Transit и многоуровневого хранения memory+disk."
supports_vary_and_request_header_variants_stale_serving_cache_locks_range_slice_cache_peer_fill_and_origin_protection_budgets = "Поддерживает варианты Vary и request-header, устаревшее обслуживание, блокировки кэша, кэш срезов диапазона, peer-fill и бюджеты защиты источника."
hardens_cache_admission_for_authorization_head_bypass_upstream_age_stripping_checked_expiry_arithmetic_and_only_if_cached_misses = "Усиливает доступ к кэшу для обхода Authorization, HEAD, удаления восходящего Age, проверки арифметики срока действия и промахов only-if-cached."
adds_native_cache_purge_parity_for_memory_and_disk_indexes_plus_exact_bulk_prefix_tag_wildcard_route_scope_and_stale_purges = "Добавляет встроенную четность очистки кэша для индексов памяти и диска, а также точные, групповые, префиксные, теговые, подстановочные знаки, route-scope и устаревшие очистки."
adds_native_cache_observability_for_proxy_counters_memory_disk_gauges_cache_lookup_histograms_and_regenerated_traceparent_span_ids = "Добавляет встроенную возможность наблюдения за кэшем для счетчиков прокси, датчиков памяти/диска, гистограмм поиска в кэше и восстановленных идентификаторов диапазона traceparent."
closes_native_proxy_cache_parity_for_memory_disk_storage_bin_encryption_peer_fill_stale_serving_purge_operations_and_native_cache_metrics = "закрывает встроенную четность proxy-cache для памяти, диска, storage-bin, шифрования, peer-fill, устаревшего обслуживания, операций очистки и показателей собственного кэша."
remaining_compatibility_runtime_only_cache_shapes_stay_documented_through_the_source_notes_and_release_gates = "Остальные формы кэша, предназначенные только для совместимости во время выполнения, остаются документированными в примечаниях к исходным кодам и шлюзах выпуска."
removes_the_final_pingora_runtime_listener_tls_adapter_crates_from_normal_fluxheim_build_profiles = "Удаляет финальную версию Pingora, runtime/listener/TLS, adapter, crates из обычного Fluxheim, build profiles."
keeps_the_native_http_1_and_http_2_proxy_runtime_as_the_normal_path_for_supported_route_cache_load_balancer_tls_websocket_admin_and_metrics_configurations = "Сохраняет собственный прокси-сервер HTTP/1 и HTTP/2 runtime в качестве обычного пути для поддерживаемых конфигураций route, cache, load-balancer, TLS, WebSocket, admin и metrics."
wires_native_admin_cache_purge_stale_disk_cache_purge_cache_object_lookup_and_live_load_balancer_stats_mutation_handlers_to_fluxheim_owned_runtime_handles = "Подключает встроенную очистку admin cache, очистку диска stale-cache, поиск объектов cache и живые обработчики статистики/мутаций load-balancer к дескрипторам Fluxheim-owned runtime."
updates_dependency_policy_release_gates_so_normal_default_full_edge_php_privacy_rpm_source_and_container_builds_fail_if_they_compile_pingora_crates = "Обновляет шлюзы выпуска dependency-policy, поэтому обычные сборки по умолчанию, полные, пограничные, PHP, конфиденциальные, RPM, исходные коды и контейнеры завершаются сбоем, если они компилируют Pingora crates."
hardens_native_admin_cache_previews_and_purges_with_normalized_host_matching_regex_route_previews_stale_purge_lock_avoidance_fail_closed_live_config_state_and_typed_route_proxy_build_contexts = "Усиливает встроенный предварительный просмотр и очистку admin cache с помощью нормализованного сопоставления хостов, предварительного просмотра regex-route, предотвращения блокировки очистки stale, состояния живой конфигурации fail-closed и типизированных контекстов сборки route-proxy."
completes_the_pingora_free_proof_for_normal_fluxheim_builds_keeping_the_native_runtime_as_the_standard_path_while_dependency_policy_gates_reject_any_normal_build_that_still_compiles_pingora_crates = "завершает доказательство Pingora-free для обычных сборок Fluxheim, сохраняя собственный путь runtime в качестве стандартного пути, в то время как шлюзы dependency-policy отклоняют любую нормальную сборку, которая все еще компилирует Pingora crates."
the_next_1_6_35_and_1_6_36_follow_ups_are_reserved_for_stabilization_soak_testing_performance_comparison_security_cleanup_and_removing_the_temporary_native_proxy_shim = "Следующие последующие версии 1.6.35 и 1.6.36 предназначены для стабилизации, soak testing, сравнения производительности, очистки безопасности и удаления временного native proxy shim."
