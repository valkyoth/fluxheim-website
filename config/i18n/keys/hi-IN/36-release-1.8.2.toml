r182_summary = "सभी सात सार्वजनिक प्रोफ़ाइलों के लिए बिना हस्ताक्षर वाले नेटिव Windows x86_64 ZIP संग्रह जोड़ता है, Windows फ़ाइल सिस्टम और क्रेडेंशियल सुरक्षा बनाए रखता है, और PHP SUSE Micro इमेज को स्व-निहित php-suse-bci रनटाइम से बदलता है।"
r182_verify_checksum = "संग्रह निकालने से पहले प्रकाशित SHA-256 चेकसम सत्यापित करें।"
r182_unsigned_preview = "बिना हस्ताक्षर वाला पूर्वावलोकन:"
r182_windows_unsigned = "यह बिना हस्ताक्षर वाला पोर्टेबल पूर्वावलोकन है। SmartScreen और PowerShell सुरक्षा चालू रखें; Authenticode हस्ताक्षर और Windows सेवा इंस्टॉलर अभी उपलब्ध नहीं हैं।"
r182_macos_unsigned = "यह बिना हस्ताक्षर वाला कमांड-लाइन पूर्वावलोकन है। Gatekeeper चालू रखें; Developer ID हस्ताक्षर, नोटरीकरण और launchd एकीकरण अभी उपलब्ध नहीं हैं।"
r182_windows_php = "प्रबंधित PHP-FPM पर्यवेक्षण केवल Unix पर उपलब्ध है; Windows बाहरी TCP FastCGI पूल का समर्थन करता है।"
