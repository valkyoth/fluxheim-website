tls_managed_acme_text = "समर्थित ओपनएसएसएल और एफआईपीएस/आईएसओ प्रूफ बिल्ड पथ, क्लाइंट सर्टिफिकेट ऑथ, अपस्ट्रीम एमटीएलएस, स्वचालित एसीएमई जारी करने और मल्टी-सर्टिफिकेट एसएनआई के साथ रस्टल-फर्स्ट।"
