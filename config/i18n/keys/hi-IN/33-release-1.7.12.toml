r1712_released_july_15_2026 = "15 जुलाई 2026 को जारी किया गया"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "ऑप्ट-इन मानक-आधारित कैश, प्रॉक्सी और प्रतिक्रिया-डाइजेस्ट मेटाडेटा जोड़ता है"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "प्रमाणित लाइव स्नैपशॉट रीलोड, रोलबैक, अखंडता जांच और पुनरारंभ दृढ़ता साबित करता है"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "प्रतिलिपि प्रस्तुत करने योग्य FIPS-backend साक्ष्य और व्यापक देशी रनटाइम हार्डनिंग जोड़ता है"
r1712_whats_next_summary = "ऑप्ट-इन मानक मेटाडेटा, प्रमाणित स्नैपशॉट रोलबैक प्रूफ, प्रतिलिपि प्रस्तुत करने योग्य FIPS-backend साक्ष्य और मजबूत कैश, TLS, Wasm, बफरिंग और स्ट्रीम सीमाएं जोड़ता है।"
r1712_release_series_digest = "Fluxheim 1.7 रिलीज़ श्रृंखला: ऑप्ट-इन मानक-आधारित कैश, प्रॉक्सी और प्रतिक्रिया-डाइजेस्ट मेटाडेटा; प्रमाणित लाइव स्नैपशॉट पुनः लोड और रोलबैक; प्रतिलिपि प्रस्तुत करने योग्य FIPS-backend साक्ष्य; शून्य-डाउनटाइम प्रक्रिया उन्नयन; स्वतंत्र रूप से परीक्षण किए गए Wasm नीति उदाहरण; और मजबूत कैश, TLS, बफरिंग, स्ट्रीम और प्रोटोकॉल सीमाएँ।"
r1712_standards_based_response_metadata = "मानक-आधारित प्रतिक्रिया मेटाडेटा"
r1712_response_metadata_intro = "प्रतिक्रिया मेटाडेटा डिफ़ॉल्ट रूप से अक्षम है। केवल वही फ़ील्ड सक्षम करें जिनकी आपको आवश्यकता है; Fluxheim उन्हें कैश कुंजी, बैकएंड पते, DNS नाम या कच्ची त्रुटियों को उजागर किए बिना वास्तविक कैश परिणाम, प्रॉक्सी विफलता और अंतिम प्रतिक्रिया बाइट्स से प्राप्त करता है।"
r1712_field = "मैदान"
r1712_what_it_reports = "यह क्या रिपोर्ट करता है"
r1712_cache_status_description = "RFC 9211 कैश परिणाम जैसे हिट, मिस, बासी अग्रेषण, पुनर्वैधीकरण, समाप्ति और बायपास।"
r1712_proxy_status_description = "Fluxheim द्वारा उत्पन्न विफलताओं के लिए RFC 9209 कम-कार्डिनैलिटी विवरण।"
r1712_content_digest_description = "संपीड़न के बाद अंतिम HTTP संदेश सामग्री पर RFC 9530 SHA-256।"
