r1712_live_snapshots_and_rollback = "लाइव स्नैपशॉट और रोलबैक"
r1712_live_snapshot_intro = "प्रमाणित स्नैपशॉट एक मान्य उम्मीदवार को प्रकाशित कर सकते हैं, लाइव राउटर को प्रतिस्थापित कर सकते हैं, और सामान्य रूटिंग-केवल तैनाती को पुनरारंभ किए बिना वापस रोल कर सकते हैं। प्रत्येक अनुरोध प्रारंभ से अंत तक एक राउटर पीढ़ी पर रहता है।"
r1712_snapshot_private_directory = "स्नैपशॉट स्टोर को एक समर्पित निजी निर्देशिका में रखें; मौजूदा गैर-निजी निर्देशिकाएँ और फ़ाइल सिस्टम रूट अस्वीकृत कर दिए जाते हैं।"
r1712_snapshot_process_upgrade = "जब पृष्ठभूमि लोड-बैलेंसर स्वास्थ्य या खोज सेवाएँ सक्रिय हों तो प्रक्रिया अपग्रेड का उपयोग करें।"
r1712_snapshot_integrity_restart = "प्रकाशन या रोलबैक के बाद स्नैपशॉट अखंडता जांच चलाएँ और सत्यापित करें कि चयनित पीढ़ी पुनः आरंभ होती है।"
r1712_read_snapshot_contract = "संपूर्ण स्नैपशॉट अनुबंध पढ़ें"
r1712_authorization_cache_bypass = "<code>Authorization</code> या <code>Proxy-Authorization</code> वाले अनुरोध हमेशा साझा-कैश लुकअप और स्टोरेज को बायपास करते हैं।"
r1712_strict_cache_control = "विकृत या विरोधाभासी प्रतिक्रिया <code>Cache-Control</code> निर्देशों को कॉन्फ़िगर किए गए टीटीएल पर वापस आने के बजाय अस्वीकार कर दिया जाता है; <code>s-maxage</code> को <code>max-age</code> पर प्राथमिकता मिलती है।"
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code>, और <code>s-maxage</code> ताजगी समाप्त होने के बाद बासी पुन: उपयोग पर रोक लगाते हैं।"
r1712_encrypted_cache_upgrade_note = "एन्क्रिप्टेड-कैश अपग्रेड नोट"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 एन्क्रिप्टेड डिस्क कैश ऑब्जेक्ट को टिकाऊ नॉन स्टेट के साथ रूट-बाउंड डेटा और इंडेक्स कुंजियों में ले जाता है। पुराने एन्क्रिप्टेड रूट के विरुद्ध पहला स्टार्टअप, और प्रत्येक स्थानीय-कुंजी रोटेशन, जानबूझकर ट्रैफ़िक परोसने से पहले उस कैश को कोल्ड-पर्ज करता है।"
r1712_encrypted_cache_disposable = "एन्क्रिप्टेड कैश को डिस्पोजेबल एक्सेलेरेशन के रूप में मानें, रिकॉर्ड के स्रोत के रूप में नहीं।"
r1712_encrypted_cache_private_storage = "प्रत्येक कैश रूट को लगातार निजी भंडारण दें और स्वतंत्र रूटों के बीच गैर-स्थिति की प्रतिलिपि न बनाएं।"
r1712_encrypted_cache_warmup = "चाबियों को अपग्रेड करने या घुमाने के बाद पहले वार्म-अप के लिए मूल क्षमता की योजना बनाएं।"
r1712_client_certificate_revocation = "ग्राहक प्रमाणपत्र निरस्तीकरण"
r1712_client_certificate_revocation_intro = "जब पारस्परिक TLS को निरस्त ग्राहक प्रमाणपत्रों को अस्वीकार करना होगा, तो एक बाध्य PEM CRL बंडल प्रदान करें। Fluxheim संपूर्ण जारीकर्ता श्रृंखला को मान्य करता है और समाप्त या अपूर्ण CRL पॉलिसी को अस्वीकार करता है।"
r1712_client_certificate_revocation_compliance = "FIPS या ISO-आवश्यक अनुपालन मोड में आवश्यक क्लाइंट प्रमाणीकरण के लिए CRL बंडल की भी आवश्यकता होती है। साधारण ग्राहक प्रमाणीकरण एक स्पष्ट ऑप्ट-इन के रूप में निरस्तीकरण रखता है।"
r1712_fips_backend_evidence = "FIPS बैकएंड साक्ष्य"
r1712_fips_backend_evidence_intro = "Fluxheim, OpenSSL-FIPS और rustls/AWS-LC-FIPS प्रोफाइल के लिए अलग से पिन किया गया CI प्रूफ वातावरण प्रदान करता है। वे सटीक प्रोफ़ाइल बाइनरी बनाते और चलाते हैं, डाउनस्ट्रीम और प्रमाणपत्र-सत्यापित अपस्ट्रीम TLS का उपयोग करते हैं, असंगत नीति को अस्वीकार करते हैं, और कंपाइलर, प्रदाता, निर्भरता, बाइनरी और छवि पहचान रिकॉर्ड करते हैं।"
r1712_fips_backend_evidence_boundary = "यह प्रतिलिपि प्रस्तुत करने योग्य बैकएंड साक्ष्य है, उत्पाद-स्तरीय FIPS सत्यापन नहीं। प्रूफ़ कंटेनरों को सामान्य रिलीज़ छवियों से अलग रखें और आपके द्वारा तैनात किए गए सटीक निर्माण के साक्ष्य की समीक्षा करें।"
r1712_read_fips_evidence_guide = "FIPS साक्ष्य मार्गदर्शिका पढ़ें"
r1712_loader_admission = "मॉड्यूल लोडिंग नियंत्रण"
r1712_loader_admission_description = "सार्वजनिक प्लगइन मैनिफेस्ट में एक निश्चित SHA-256 डाइजेस्ट होना चाहिए। पूरे प्रोसेस में एक समय में अधिकतम दो मॉड्यूल संकलित होते हैं। संकलित आउटपुट की डिफ़ॉल्ट सीमा 32 MiB है और यह 256 MiB से अधिक नहीं हो सकता।"
r1712_file_identity = "फ़ाइल पहचान"
r1712_file_identity_description = "Fluxheim लिंक का अनुसरण किए बिना स्वीकृत प्लगइन फ़ाइलें खोलता है, मान्य नियमित-फ़ाइल हैंडल को बनाए रखता है, और पथ को दोबारा खोले बिना उस हैंडल से मॉड्यूल बाइट्स पढ़ता है।"
