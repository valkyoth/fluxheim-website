[advanced_page]
advanced_001_advanced_features = "Fortgeschrittene Funktionen"
advanced_002_php_fpm_proxy_operations_admin_api_zero_retention_privacy_mode_waf_wasm = "PHP-FPM, Proxy-Operationen, Admin-API, Zero-Retention-Privacy-Modus, WAF, WASM-Erweiterbarkeit und geplante zukünftige Module."
advanced_003_php_fpm_bridge = "PHP-FPM-Bridge"
advanced_004_available_since_v1_3_1_via_the_php_fpm_cargo_feature_the = "Verfügbar seit v1.3.1 über das Cargo-Feature <code>php-fpm</code>. Die PHP-FPM-Bridge verbindet Fluxheim per FastCGI-Protokoll mit einem laufenden PHP-FPM-Pool. Sie unterstützt Front-Controller-Anwendungen im WordPress-Stil mit strikter Script-Auflösung und begrenzter Request-/Response-Verarbeitung."
advanced_005_bash_build_with_php_fpm_support = "bash - Build mit PHP-FPM-Unterstützung"
advanced_006_fluxheim_toml_wordpress_front_controller = "fluxheim.toml - WordPress-Front-Controller"
advanced_007_managed_php_fpm = "Verwaltetes PHP-FPM"
advanced_008_included_in_current_v1_6_28_builds_and_introduced_in_v1_3 = "In aktuellen v1.6.28-Builds enthalten und in v1.3.7 eingeführt. Managed Mode behält denselben FastCGI/php-fpm-Request-Pfad bei, aber Fluxheim startet und überwacht einen privaten php-fpm-Masterprozess für den Vhost. Externes php-fpm bleibt der Standard; nutze Managed Mode, wenn Fluxheim die Pool-Konfiguration erzeugen und den privaten Socket-Lebenszyklus besitzen soll."
advanced_009_fluxheim_toml_managed_php_fpm_pool = "fluxheim.toml - verwalteter php-fpm-Pool"
advanced_010_do_not_set_socket_tcp_or_tcp_upstreams_in_managed_mode_fluxheim = "Setze im Managed Mode nicht <code>socket</code>, <code>tcp</code> oder <code>tcp_upstreams</code>. Fluxheim erstellt den privaten Unix-Socket unter <code>socket_dir</code>, generiert die php-fpm-Pool-Dateien, beendet den Master bei Reload oder Gateway-Shutdown und startet ihn mit begrenztem Backoff neu, falls er nach dem Start abstürzt."
advanced_011_how_php_routing_works = "Wie PHP-Routing funktioniert"
advanced_012_requests_for_existing_php_files_are_routed_directly_to_php_fpm = "Requests für vorhandene <code>.php</code>-Dateien werden direkt zu PHP-FPM geroutet"
advanced_013_requests_for_non_existent_files_fall_back_to_the_front_controller_index = "Requests für nicht vorhandene Dateien fallen auf den Front Controller (<code>index.php</code>) zurück"
advanced_014_static_assets_css_js_images_are_served_directly_without_touching_php_fpm = "Statische Assets (<code>.css</code>, <code>.js</code>, Bilder) werden direkt ausgeliefert, ohne PHP-FPM zu berühren"
advanced_015_script_resolution_is_strict_only_files_within_the_configured_php_root_are = "Script-Auflösung ist strikt - nur Dateien innerhalb des konfigurierten PHP-<code>root</code> werden an FPM übergeben"
advanced_016_fluxheim_acme_companion = "fluxheim-acme-Begleitwerkzeug"
advanced_017_released_in_v1_3_2_fluxheim_acme_is_a_standalone_companion_binary = "Veröffentlicht in v1.3.2. <code>fluxheim-acme</code> ist ein eigenständiges Begleit-Binary zur Verwaltung von ACME-Zertifikatserneuerung und Reload-Operationen außerhalb des Haupt-Gateway-Prozesses. Es ist für Container- und externe Service-Manager-Deployments gedacht, bei denen das Gateway den Renewal-Lebenszyklus nicht besitzt."
advanced_018_bash_fluxheim_acme_operations = "bash - fluxheim-acme-Operationen"
advanced_019_the_acme_reload_socket_lets_fluxheim_acme_signal_the_running_gateway_to = "Der ACME-Reload-Socket erlaubt <code>fluxheim-acme</code>, dem laufenden Gateway frisch ausgestellte Zertifikate ohne vollständigen Neustart zu signalisieren. Konfiguriere den Socket-Pfad in deinem <code>[server]</code>-Block."
advanced_020_fluxheim_toml_acme_reload_socket = "fluxheim.toml - ACME-Reload-Socket"
advanced_021_fluxheim_config_tester = "fluxheim-config-tester"
advanced_022_released_in_v1_3_2_fluxheim_config_tester_is_a_standalone_binary = "Veröffentlicht in v1.3.2. <code>fluxheim-config-tester</code> ist ein eigenständiges Binary, das eine Fluxheim-Konfigurationsdatei validiert, ohne das Gateway zu starten. Nützlich in CI-Pipelines und Container-Entrypoints, wo Konfigurationsfehler vor der Anwendung auf einen laufenden Dienst erkannt werden sollen."
advanced_023_bash_validate_config_before_apply = "bash - Konfiguration vor Anwendung validieren"
advanced_024_proxy_operations = "Proxy-Operationen"
advanced_025_fluxheim_v1_4_x_adds_migration_focused_proxy_operations_on_top_of = "Fluxheim v1.4.x ergänzt migrationsorientierte Proxy-Operationen auf Basis der 1.4.0-Proxy-Parity-Baseline: Regex-Routen, Method-Routing, WebSocket-Upgrades, Auth-Subrequests, sicheres Traffic-Mirroring, dynamische Upstream-Discovery und einen lokalen read-only Ops-Socket."
advanced_026_fluxheim_toml_proxy_operations = "fluxheim.toml - Proxy-Operationen"
advanced_027_regex_support_is_disabled_until_server_regex_enabled_true_is_set_traffic = "Regex-Unterstützung ist deaktiviert, bis <code>server.regex_enabled = true</code> gesetzt ist. Traffic-Mirroring wird über das Feature <code>traffic-mirror</code> einkompiliert und spiegelt nur sichere Methoden ohne Body; es verändert nie die primäre Response."
advanced_028_zero_retention_privacy_mode = "Zero-Retention-Privacy-Modus"
advanced_029_the_privacy_mode_feature_compiles_fluxheim_without_any_caching_or_metrics_functionality = "Das Feature <code>privacy-mode</code> kompiliert Fluxheim ohne Caching- oder Metriken-Funktionalität und erzwingt Zero Log Retention auf Build-Ebene. Das passt für privacy-sensitive Deployments, bei denen keine Request-Daten gespeichert oder exportiert werden sollen."
advanced_030_bash_zero_retention_privacy_build = "bash - Zero-Retention-Privacy-Build"
advanced_031_what_privacy_mode_enforces = "Was privacy-mode erzwingt"
advanced_032_no_cache_module_compiled_caching_is_impossible_at_the_binary_level = "Kein Cache-Modul einkompiliert - Caching ist auf Binary-Ebene unmöglich"
advanced_033_no_metrics_module_compiled_no_prometheus_or_otlp_export = "Kein Metriken-Modul einkompiliert - kein Prometheus- oder OTLP-Export"
advanced_034_access_logs_may_be_disabled_in_the_config = "Access Logs können in der Konfiguration deaktiviert werden"
advanced_035_compile_time_guarantee_no_data_is_stored_no_external_telemetry_is_exported = "Compile-Time-Garantie: keine Daten werden gespeichert, keine externe Telemetrie wird exportiert"
advanced_036_admin_api = "Admin-API"
advanced_037_the_admin_control_plane_exposes_a_local_http_api_for_health_checks = "Die Admin-Control-Plane stellt eine lokale HTTP-API für Health Checks, Config Reload, Cache Purge und Statusabfragen bereit. Standardmäßig ist sie loopback-only und erfordert auf Nicht-Loopback-Listenern einen Bearer Token."
advanced_038_bash_admin_api_endpoints = "bash - Admin-API-Endpunkte"
advanced_039_wasm_extensibility = "WASM-Erweiterbarkeit"
advanced_040_planned_v1_6 = "Geplant - v1.6"
advanced_041_fluxheim_s_wasm_extensibility_layer_is_planned_for_the_1_6_release = "Fluxheims WASM-Erweiterbarkeitsschicht ist für das 1.6-Release geplant. Sie soll nginx-Lua-artige Request-/Response-Hooks und VCL-ähnliche Cache-Policy-Hooks über WebAssembly-Module unterstützen."
advanced_042_compile_time_opt_in_wasm_feature = "Compile-Time-Opt-in-Feature <code>wasm</code>"
