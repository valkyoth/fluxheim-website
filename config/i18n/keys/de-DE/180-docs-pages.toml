advanced_045_sandboxed_execution_with_bounded_resource_limits = "Sandbox-Ausführung mit begrenzten Ressourcenlimits"
advanced_046_waf_architecture = "WAF-Architektur"
advanced_047_planned_future = "Geplant - zukünftig"
advanced_048_a_web_application_firewall_module_is_documented_in_the_architecture_but_not = "Ein Web-Application-Firewall-Modul ist in der Architektur dokumentiert, aber in aktuellen stabilen Builds nicht aktiviert. Es ist als optionales Compile-Time-Modul mit regelbasiertem Request-Filtering, Rate-Limiting pro IP/Pfad/Methode und konfigurierbaren Block-/Log-/Challenge-Responses geplant."
advanced_049_load_balancer = "Load Balancer"
advanced_050_the_load_balancer_feature_adds_fluxheim_s_load_balancer_control_plane_and = "Das Feature <code>load-balancer</code> ergänzt Fluxheims Load-Balancer-Control-Plane und Health Checks zur Proxy-Runtime. Es ist optional und heute über <code>profile-load-balancer</code> oder <code>profile-load-balancer-edge</code> verfügbar."
