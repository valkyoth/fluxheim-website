stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabilisiert lauffähige Wasm-Migrationsbeispiele und Release-Gate-Tests; fügt optionale HTTP-Antwortsicherheitsprofile, validiertes anforderungsfähiges CORS, begrenzte Wiederholungsversuche, strengere Weiterleitung und Identitäts-Header-Bereinigung sowie sichereres Header-Parsen und -Umschreiben hinzu."
