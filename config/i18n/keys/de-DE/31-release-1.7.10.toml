released_july_13_2026 = "Veröffentlicht am 13. Juli 2026"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Fügt optionale HTTP-Antwortsicherheitsprofile und validiertes anforderungsfähiges CORS hinzu"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Stabilisiert ausführbare Wasm-Richtlinienbeispiele und die vom Release-Gate erforderlichen Tests"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Verstärkt weitergeleitete Identitätsheader, Header-Analyse und Wiederholungsanleitung für Kapazitätsgrenzen"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "stabilisiert die Wasm-Migrationsbeispiele und fügt optionale HTTP-Antwortsicherheit, anforderungsfähiges CORS sowie strengere Weiterleitungs- und Headergrenzen hinzu."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Fluxheim 1.7-Release-Serie: unabhängig getestete Migrationsbeispiele, begrenzte Host-Rückrufe, optionale HTTP-Antwortsicherheitsprofile, validiertes anforderungsfähiges CORS, strengere Weiterleitungsidentitätsbehandlung und strengere Grenzen für Wasm, ACME, Snapshots, GeoIP, Streams, TLS, PHP-FPM und statische Dateibereitstellung."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 macht jede Migrationsfamilie unabhängig testbar, behält den vollständigen Wasm-Rauchtest im Freigabetor und stellt sicher, dass vom Gast gesteuerte symbolische IDs sicher zurückgewiesen werden. In-Process-Hostrückrufe bleiben auf endliche, nicht blockierende Vorgänge beschränkt."
wasm_host_callbacks = "Wasm-Host-Rückrufe"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "Rückrufe sind auf endliche symbolische Dekodierung, begrenzte Kontextlesevorgänge und begrenzte Zustände beschränkt. Sie können keine Datei-, Netzwerk-, IPC-, Ruhezustands-, Prozess- oder Rückrufarbeiten von Drittanbietern durchführen."
release_testing = "Release-Tests"
each_migration_family_can_run_independently_while_the_release_gate_also_runs_the_complete_smoke_test_and_an_arbitrary_guest_id_decoder_property_test = "Jede Migrationsfamilie kann unabhängig ausgeführt werden, während das Release-Gate auch den vollständigen Rauchtest und einen willkürlichen Gast-ID-Decoder-Eigenschaftstest durchführt."
http_response_security = "HTTP-Antwortsicherheit"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "HTTP-Antwortsicherheitsprofile sind optional. Beginnen Sie mit <code>baseline</code>; Verwenden Sie die ursprungsübergreifende Isolierung erst, nachdem Sie jedes Skript, jede Schriftart, jedes Bild, jeden Anmeldeablauf und jede eingebettete Ressource getestet haben."
profile = "Profil"
what_it_does = "Was es bewirkt"
keeps_the_opt_in_hardening_headers_disabled = "Hält die Opt-in-Hardening-Header deaktiviert."
adds_conservative_browser_isolation_and_resource_policy_defaults_suitable_for_most_sites = "Fügt konservative Browserisolation und Standardeinstellungen für Ressourcenrichtlinien hinzu, die für die meisten Websites geeignet sind."
enables_strict_cross_origin_isolation_for_applications_that_have_tested_every_external_dependency = "Ermöglicht eine strikte ursprungsübergreifende Isolierung für Anwendungen, die alle externen Abhängigkeiten getestet haben."
