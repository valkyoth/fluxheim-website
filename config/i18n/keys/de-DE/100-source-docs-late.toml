fluxheim_stream_bytes_total_route_direction = "<li><code>fluxheim_stream_bytes_total{route,direction}</code></li>"
the_configuration_gauges_are_aggregate_label_free_and_populated_from_validated_configuration_whe = "<p>The configuration gauges are aggregate, label-free, and populated from validated configuration when the metrics listener starts. The local observability smoke verifies the route/vhost cache policy gauges, the request-collapsing policy count, and the maximum configured lock wait timeout. <code>fluxheim_acme_events_total</code> verwendet nur begrenzte Lifecycle-Labels: <code>event</code> is <code>pending</code>, <code>renewed</code>, <code>failed</code>, <code>reload_success</code>, <code>reload_failed</code>, <code>reload_unavailable</code>, <code>tick_error</code>, or <code>other</code>. Es vermeidet absichtlich Domainnamen, Zertifikatspfade, Challenge-URLs und Issuer-Secrets. <code>fluxheim_php_requests_total</code> and <code>fluxheim_php_request_duration_seconds</code> verwenden konfigurierte Vhost-Namen plus begrenzte Labels für Methode, Ergebnis und Statusklasse. <code>outcome</code> is <code>declined</code>, <code>redirect</code>, <code>forbidden</code>, <code>not_found</code>, <code>fpm_error</code>, <code>connect_timeout</code>, <code>request_timeout</code>, <code>connection_error</code>, <code>configuration_error</code>, <code>invalid_response</code>, <code>intercepted</code>, <code>offload</code>, <code>offload_error</code>, <code>response</code>, or <code>other</code>; these metrics avoid raw paths, queries, script filenames, usernames, cookies, and FastCGI params. <code>fluxheim_stream_connections_total</code> and <code>fluxheim_stream_bytes_total</code> verwenden nur konfigurierte Stream-Routennamen. Die Stream-Verbindung <code>outcome</code> is bounded to <code>completed</code>, <code>rejected</code>, <code>connect_error</code>, <code>timeout</code>, <code>shutdown</code>, or <code>error</code>. Das Stream-Byte <code>direction</code> is bounded to <code>downstream_to_upstream</code>, <code>upstream_to_downstream</code>, or <code>other</code>. <code>fluxheim_php_stderr_events_total</code> verwendet konfigurierte Vhost-Namen plus begrenzte <code>state</code>-Labels <code>emitted</code>, <code>truncated</code> oder <code>other</code>; sie zählt die STDERR-Präsenz, ohne PHP-Fehlertext offenzulegen. <code>fluxheim_php_fpm_retries_total</code> verwendet konfigurierte Vhost-Namen plus begrenzte <code>reason</code> labels of <code>connect_timeout</code>, <code>connection_error</code>, or <code>other</code>; sie zählt Retry-Versuche, ohne Upstream-Adressen, Socket-Pfade, rohe Request-Pfade, Cookies oder FastCGI-Parameter offenzulegen. <code>fluxheim_php_fpm_pool_idle_connections</code> and <code>fluxheim_php_fpm_pool_events_total</code> use configured vhost and pool labels. Das <code>pool</code>-Label ist <code>default</code> fuer eine PHP-Runtime auf Vhost-Ebene oder der konfigurierte Routenname fuer eine PHP-Runtime auf Routenebene. Pool <code>event</code> labels are bounded to <code>connect</code>, <code>reuse</code>, <code>return</code>, <code>drop_stale</code>, <code>discard_full</code>, or <code>other</code>. <code>fluxheim_cache_activity_total</code> verwendet nur begrenzte Labels: <code>tier</code> is <code>memory</code>, <code>disk</code>, <code>policy</code>, or <code>other</code>, and <code>event</code> is <code>hit</code>, <code>miss</code>, <code>store</code>, <code>store_refusal</code>, <code>eviction</code>, <code>purge</code>, <code>pass</code>, <code>bypass</code>, <code>stale</code>, <code>revalidate</code>, <code>peer_fill_hit</code>, <code>peer_fill_miss</code>, <code>peer_fill_error</code>, <code>peer_fill_fallback</code>, <code>peer_fill_fail_closed</code>, or <code>other</code>. These metrics intentionally avoid raw hosts, paths, queries, cache keys, peer URLs, and purge identities. <code>fluxheim_cache_activity_scope_total</code> verwendet dieselben begrenzten <code>tier</code> and <code>event</code> Labels plus konfigurierte Namenslabels: <code>scope</code> is <code>vhost</code> or <code>route</code>, <code>vhost</code> ist der konfigurierte Vhost-Name, und <code>route</code> is empty for vhost cache or the configured route name for route cache. It intentionally avoids raw <code>Host</code>, path, query, cache key, and purge identity labels. Cache operation duration histograms use the same configured-name labels plus bounded <code>phase</code> and <code>operation</code> labels. <code>operation</code> is <code>lookup</code> or <code>lock_wait</code>, damit Dashboards Storage-Lookup-Kosten von Request-Collapsing-Wartezeit ohne hochkardinale Request-Labels trennen können. Cache-Purger-Dauerhistogramme verwenden das begrenzte Purger- <code>outcome</code> label only, so operators can see when cleanup ticks are getting slow without exposing cache paths, queries, cache keys, and purge identities. Future OpenTelemetry attributes should mirror the same low-cardinality concepts used by admin JSON and Prometheus.</p>"
