[legacy_static_http]
legacy_static_http_support_fluxheim_source_docs = "<title>Legacy-Static-HTTP-Support - Fluxheim-Source-Dokumentation</title>"
legacy_static_http_support = "<h1 id=\"legacy-static-http-support\">Legacy-Static-HTTP-Support</h1>"
legacy_http_support_is_a_future_experimental_compatibility_feature_for_isolated_devices_that_can = "<p>Legacy-HTTP-Support ist ein zukuenftiges experimentelles Kompatibilitaetsfeature fuer isolierte Geraete, die kein modernes HTTP sprechen koennen. Es darf niemals Teil von Fluxheims Standard-Binary sein und niemals auf normalen Proxy-, Cache-, Admin-, PHP-, CGI- oder TLS-Listener-Pfaden laufen.</p>"
the_modern_protocol_focus_for_fluxheim_remains_strict_http_1_1_and_http_2_today_with_http_3_quic = "<p>Der moderne Protokollfokus fuer Fluxheim bleibt heute striktes HTTP/1.1 und HTTP/2, mit HTTP/3/QUIC als geplanter zukuenftiger Performance- und Security-Richtung. Legacy-Protokollsupport ist eine isolierte Kompatibilitaetsausnahme.</p>"
compile_time_features = "<h2 id=\"compile-time-features\">Compile-Time-Features</h2>"
planned_feature_flags = "<p>Geplante Feature-Flags:</p>"
the_default_feature_set_must_never_include_these_features_release_checks_should_fail_if_cargo_tr = "<p>Das Standard-Feature-Set darf diese Features niemals enthalten. Release-Checks sollten fehlschlagen, wenn <code>cargo tree -e features</code> ein Legacy-HTTP-Feature standardmaessig aktiviert zeigt.</p>"
runtime_isolation = "<h2 id=\"runtime-isolation\">Runtime-Isolation</h2>"
legacy_support_requires_explicit_runtime_config_and_dedicated_listeners = "<p>Legacy-Support erfordert explizite Runtime-Konfiguration und dedizierte Listener:</p>"
legacy_listeners_must_not_share_server_listen_server_tls_listen_admin_listen_or_metrics_listen_l = "<p>Legacy-Listener duerfen <code>server.listen</code>, <code>server.tls_listen</code>, <code>admin.listen</code> oder <code>metrics.listen</code> nicht teilen. Listener-Aenderungen sind Process-Upgrade-Aenderungen.</p>"
