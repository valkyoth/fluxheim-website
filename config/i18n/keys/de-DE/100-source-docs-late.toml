pingora_versions_before_0_8_0_had_http_request_smuggling_vulnerabilities_around_http_1_0_transfe = "<p>Pingora-Versionen vor <code>0.8.0</code> hatten HTTP-Request-Smuggling-Schwachstellen rund um HTTP/1.0-Transfer-Encoding-Parsing und vorzeitiges Upgrade-Handling. Fluxheim trackt bereits Pingora <code>0.8.0</code>, aber Legacy-Support muss trotzdem eine eigene strengere Reject-Schicht ergaenzen, weil Kompatibilitaetsmodi besonders stark mehrdeutigen Parsing-Angriffen ausgesetzt sind.</p>"
legacy_support_must_not_weaken_the_normal_modern_listener_behavior = "<p>Legacy-Support darf das normale moderne Listener-Verhalten nicht abschwaechen.</p>"

