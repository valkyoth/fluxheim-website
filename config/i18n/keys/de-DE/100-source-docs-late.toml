[certificate_renewal]
certificate_renewal_and_reload_fluxheim_source_docs = "<title>Zertifikatserneuerung und Reload - Fluxheim-Quelldokumentation</title>"
certificate_renewal_and_reload = "<h1 id=\"certificate-renewal-and-reload\">Zertifikatserneuerung und Reload</h1>"
fluxheim_should_support_both_operator_owned_certificates_and_acme_managed_certificates_manual_certif = "<p>Fluxheim soll sowohl betreibereigene Zertifikate als auch ACME-verwaltete Zertifikate unterstuetzen. Manuelle Zertifikate werden mit <code>cert_path</code> und <code>key_path</code> konfiguriert. ACME-Zertifikate werden pro Vhost konfiguriert und unter <code>tls.acme.storage</code> verwaltet. Fluxheim leitet verwaltete Zertifikatspfade unter <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/fullchain.pem</code> und <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/privkey.pem</code> ab; das Segment wird von Fluxheim bereinigt und mit Hash-Suffix versehen, nicht vom Betreiber geliefert. Fuer HTTP-01 leitet Fluxheim auch einen lokalen Challenge-Speicher unter <code>&lt;storage&gt;/http-01/&lt;safe-vhost-segment&gt;/</code> ab und liefert sichere Challenge-Token-Dateien direkt aus, wenn <code>tls.acme.challenge = &quot;http-01&quot;</code> gesetzt ist. TLS-ALPN-01 wird in <code>1.1.0</code> ebenfalls fuer das standardmaessige rustls-Backend unterstuetzt. Waehrend der Erneuerung schreibt Fluxheim kurzlebige Challenge-Zertifikate unter <code>&lt;storage&gt;/tls-alpn-01/&lt;safe-domain-segment&gt;/</code>, und der rustls-SNI-Resolver liefert sie nur aus, wenn der Client das ALPN-Protokoll <code>acme-tls/1</code> anbietet. DNS-01 bleibt Zukunftsarbeit, weil sichere Provider-Integrationen explizites, provider-spezifisches Secret-Handling statt generischer Shell-Hooks benoetigen. Challenge-Publikation nutzt denselben verwalteten Speicher: HTTP-01-Tokens sind auf ein URL-sicheres Pfadsegment beschraenkt, Key-Authorizations sind begrenzt und werden auf Steuerzeichen geprueft, TLS-ALPN-01-Zertifikate werden mit der ACME-Identifier-Erweiterung erzeugt, Dateien werden ueber temporaere Dateien geschrieben, und symlinkte Ziele werden abgelehnt. ACME-Account-Credentials werden separat unter <code>&lt;storage&gt;/accounts/&lt;safe-issuer-segment&gt;/credentials.json</code> gespeichert, ebenfalls mit einem von Fluxheim erzeugten bereinigten und Hash-suffixed Segment statt eines rohen Config-Werts.</p>"
downstream_tls_listeners_are_explicit_in_server_tls_listen_the_runtime_uses_the_first_global_tls_cer = "<p>Downstream-TLS-Listener sind in <code>server.tls_listen</code> explizit. Die Runtime verwendet den ersten globalen <code>[[tls.certificates]]</code>-Eintrag als Standard-Zertifikat fuer diese Listener. Wenn kein globales Zertifikat konfiguriert ist, kann <code>server.default_vhost</code> den Fallback entweder ueber <code>[vhosts.tls.certificate]</code> oder <code>[vhosts.tls.acme]</code> bereitstellen. Andere Vhosts koennen dieses Zertifikat mit ihrer eigenen statischen oder ACME-verwalteten Quelle ueberschreiben; Fluxheim waehlt das passende Zertifikat per SNI waehrend des Downstream-TLS-Handshakes.</p>"
managed_acme_certificates_may_be_absent_during_first_issuance_reloadable_sni_tls_backends_including = "<p>Verwaltete ACME-Zertifikate koennen waehrend der Erstausstellung fehlen. Reloadbare SNI-TLS-Backends, einschliesslich des standardmaessigen rustls-Builds, behandeln fehlende von Fluxheim verwaltete ACME-Zertifikatdateien als ausstehend, statt den Start zu verweigern. HTTP-01-Challenge-Routen und der Cleartext-Listener koennen die Issuer-Validierungsanfrage weiterhin bedienen, waehrend HTTPS-Handshakes fuer diese ausstehende SNI entweder ein verfuegbares Fallback-Zertifikat nutzen oder fehlschlagen, bis die Zertifikatdateien ausgestellt sind. Nachdem der Hintergrund-ACME-Worker die Dateien installiert hat, laedt Fluxheim den Downstream-SNI-Zertifikat-Resolver neu, damit neue Handshakes sie ohne Prozessneustart nutzen koennen. Statische Zertifikatspfade bleiben fail-closed: ein fehlendes betreibereigenes Zertifikat bleibt ein Konfigurations-/Runtime-Fehler.</p>"
storage_permissions = "<h2 id=\"storage-permissions\">Storage-Berechtigungen</h2>"
fluxheim_has_a_runtime_storage_checker_for_operator_owned_certificates_and_acme_storage_directories = "<p>Fluxheim hat einen Runtime-Storage-Checker fuer betreibereigene Zertifikate und ACME-Storage-Verzeichnisse.</p>"
recommended_unix_permissions = "<p>Empfohlene Unix-Berechtigungen:</p>"
private_keys_0600 = "<li>private Keys: <code>0600</code></li>"
acme_storage_directory_0700 = "<li>ACME-Storage-Verzeichnis: <code>0700</code></li>"
public_certificate_chains_normal_read_permissions_are_acceptable_for_example_0644 = "<li>oeffentliche Zertifikatsketten: normale Leseberechtigungen sind akzeptabel, zum Beispiel <code>0644</code></li>"
the_checker_reports_missing_certificate_key_files_non_file_certificate_key_paths_non_directory_acme = "<p>Der Checker meldet fehlende Zertifikat-/Key-Dateien, Zertifikat-/Key-Pfade, die keine Dateien sind, ACME-Storage-Pfade, die keine Verzeichnisse sind, symlinkte Zertifikat-/Key-/EAB-/Storage-Pfade einschliesslich symlinkter Parent-Verzeichnisse, group/world-lesbare private Keys und group/world-zugaengliche ACME-Storage-Verzeichnisse. Config-Parsing bleibt von Dateisystempruefungen getrennt, damit Konfiguration weiterhin validiert werden kann, bevor Dateien bereitgestellt sind.</p>"
secret_handling = "<h2 id=\"secret-handling\">Secret-Handling</h2>"
acme_issuers_that_require_external_account_binding_such_as_actalis_and_google_trust_services_need_a = "<p>ACME-Issuer, die External Account Binding erfordern, etwa Actalis und Google Trust Services, benoetigen eine Key-ID und einen HMAC-Key. Fluxheim unterstuetzt Umgebungsvariablen und Dateien fuer diese Werte, Produktionsdeployments sollten aber dateibasierte Secrets bevorzugen:</p>"
systemd_credentials_mounted_under_run_credentials_lt_unit_gt = "<li>systemd-Credentials gemountet unter <code>/run/credentials/&lt;unit&gt;/</code></li>"
docker_or_podman_secrets_mounted_under_run_secrets = "<li>Docker- oder Podman-Secrets gemountet unter <code>/run/secrets/</code></li>"
kubernetes_secret_volumes = "<li>Kubernetes-Secret-Volumes</li>"
these_mechanisms_keep_secrets_out_of_static_config_files_process_environment_listings_and_container = "<p>Diese Mechanismen halten Secrets aus statischen Konfigurationsdateien, Prozess-Environment-Listings und Container-Image-Metadaten heraus. Sie passen auch zu Fluxheims bestehenden Storage-Checks, weil die Anwendung nur normale Dateien mit strenger Ownership und strikten Berechtigungen lesen muss. Zur Laufzeit liest Fluxheim EAB-Secrets mit einem begrenzten File-Reader, entfernt nur umgebende Whitespaces, lehnt leere oder uebergrosse Werte ab, oeffnet Dateien unter Linux ohne dem finalen Symlink zu folgen, und speichert die geladenen Strings in zeroizing Memory-Wrappern.</p>"
example_systemd_service_override = "<p>Beispiel fuer systemd-Service-Override:</p>"
matching_fluxheim_config_credential_names_resolve_below_credentials_directory_when_fluxheim_is_launc = "<p>Passende Fluxheim-Config. Credential-Namen werden aufgeloest unter <code>$CREDENTIALS_DIRECTORY</code> wenn Fluxheim durch systemd gestartet wird, und unter <code>/run/secrets</code> fuer normale Secret-Mounts im Container-Stil:</p>"
built_in_issuer_names = "<p>Eingebaute Issuer-Namen:</p>"
letsencrypt_https_acme_v02_api_letsencrypt_org_directory = "<li><code>letsencrypt</code>: <code>https://acme-v02.api.letsencrypt.org/directory</code></li>"
letsencrypt_staging_https_acme_staging_v02_api_letsencrypt_org_directory = "<li><code>letsencrypt-staging</code>: <code>https://acme-staging-v02.api.letsencrypt.org/directory</code></li>"
actalis_https_acme_api_actalis_com_acme_directory_eab_required = "<li><code>actalis</code>: <code>https://acme-api.actalis.com/acme/directory</code>, EAB erforderlich</li>"
google_trust_services_https_dv_acme_v02_api_pki_goog_directory_eab_required = "<li><code>google-trust-services</code>: <code>https://dv.acme-v02.api.pki.goog/directory</code>, EAB erforderlich</li>"
google_trust_services_staging_https_dv_acme_v02_test_api_pki_goog_directory_eab_required = "<li><code>google-trust-services-staging</code>: <code>https://dv.acme-v02.test-api.pki.goog/directory</code>, EAB erforderlich</li>"
google_trust_services_eab_credentials_are_environment_specific_and_single_use_for_account_registrati = "<p>Google-Trust-Services-EAB-Credentials sind umgebungsspezifisch und fuer die Account-Registrierung einmalig nutzbar. Fluxheim haelt getrennte Production- und Staging-Standards:</p>"
production_fluxheim_gts_eab_kid_fluxheim_gts_eab_hmac_key = "<li>production: <code>FLUXHEIM_GTS_EAB_KID</code>, <code>FLUXHEIM_GTS_EAB_HMAC_KEY</code></li>"
staging_fluxheim_gts_staging_eab_kid_fluxheim_gts_staging_eab_hmac_key = "<li>staging: <code>FLUXHEIM_GTS_STAGING_EAB_KID</code>, <code>FLUXHEIM_GTS_STAGING_EAB_HMAC_KEY</code></li>"
for_containers_mount_the_same_two_values_as_secrets_and_point_fluxheim_at_the_mounted_files = "<p>Fuer Container dieselben zwei Werte als Secrets mounten und Fluxheim auf die gemounteten Dateien zeigen lassen:</p>"
environment_variables_remain_useful_for_local_testing_but_they_should_not_be_the_recommended_product = "<p>Umgebungsvariablen bleiben fuer lokale Tests nuetzlich, sollten aber nicht der empfohlene Produktionspfad fuer EAB-Secrets sein.</p>"
account_credentials = "<h2 id=\"account-credentials\">Account-Credentials</h2>"
acme_account_credentials_contain_account_identity_and_private_key_material_they_are_not_kept_in_the = "<p>ACME-Account-Credentials enthalten Account-Identitaet und privates Key-Material. Sie werden nicht in der TOML-Config gehalten. Fluxheim leitet ihren Storage-Pfad aus dem Issuer-Namen ab und schreibt sie unter <code>tls.acme.storage</code>:</p>"
the_credential_file_is_bounded_parsed_as_json_written_through_a_temporary_file_installed_with_owner = "<p>Die Credential-Datei ist begrenzt, wird als JSON geparst, ueber eine temporaere Datei geschrieben, unter Unix mit Owner-only-Berechtigungen installiert und unter Linux ohne dem finalen Symlink zu folgen geoeffnet. Das genaue Pfadsegment wird von Fluxheim erzeugt, sodass Issuer-Namen keine Path-Traversal- oder versteckten Dateisystemorte erzeugen koennen.</p>"
when_fluxheim_is_built_with_acme_client_it_can_load_existing_credentials_from_that_path_or_create_a = "<p>Wenn Fluxheim mit <code>acme-client</code> gebaut ist, kann es vorhandene Credentials von diesem Pfad laden oder ueber <code>instant-acme</code> ein neues Issuer-Konto erstellen und die zurueckgegebenen Credentials sofort persistieren. EAB-HMAC-Keys werden als base64/base64url-codierte ACME-MAC-Keys behandelt, bevor sie an den Issuer-Client uebergeben werden. Dasselbe Feature enthaelt auch die live HTTP-01- und rustls-TLS-ALPN-01-Order-Pfade: Order erstellen, Challenge-Material publizieren, Challenges bereit melden, den generierten CSR finalisieren, die Zertifikatskette abrufen, sie atomar installieren und Challenge-Dateien bereinigen.</p>"
production_packages_and_container_images_ship_the_fluxheim_acme_companion_as_the_preferred_external = "<p>Produktionspakete und Container-Images liefern den <code>fluxheim-acme</code>-Companion als bevorzugten externen Erneuerungsbefehl aus. Er nutzt dieselbe ACME-Engine, dasselbe Storage-Layout, dieselben Issuer-Credentials und denselben Vhost-Target-Planner wie das integrierte Gateway, haelt die Erneuerungsplanung aber ausserhalb des Traffic-serving-Prozesses:</p>"
by_default_renew_observes_the_managed_certificate_files_and_attempts_only_missing_or_due_certificate = "<p>Standardmaessig beobachtet <code>renew</code> die verwalteten Zertifikatdateien und versucht nur fehlende oder faellige Zertifikate. Wenn nichts erneuert werden muss, beendet der Befehl erfolgreich mit <code>acme attempted: 0</code> und einer Statusmeldung, dass keine Zertifikate faellig sind. Die Erstausstellung benoetigt normalerweise kein <code>--force-renew</code>: fehlende Zertifikatdateien sind faellige Targets. Der Befehl gibt jedes Target mit <code>status=due</code>, <code>status=skipped</code> oder <code>status=forced</code> aus und meldet danach pro Target <code>renewed:</code>- und <code>failed:</code>-Zeilen. Bei HTTP-01-Fehlern nach Veroeffentlichung der Challenge-Dateien enthaelt der Fehler <code>published_http_01=</code>-URLs, damit Betreiber die exakten oeffentlichen Challenge-Pfade testen koennen, die der Issuer haette erreichen sollen. Der Befehl beendet mit Non-Zero, wenn ein Target fehlgeschlagen ist, meldet aber weiterhin erfolgreiche Erneuerungen aus demselben Lauf.</p>"
fluxheim_acme_renew_also_asks_the_running_gateway_to_reload_its_certificate_handles_after_a_successf = "<p><code>fluxheim-acme renew</code> fordert nach erfolgreicher Erneuerung auch das laufende Gateway auf, seine Zertifikat-Handles neu zu laden, wenn <code>server.process.certificate_reload_sock</code> erreichbar ist. <code>reload</code> explizit nach manueller Installation verwalteter Dateien verwenden:</p>"
the_legacy_integrated_command_is_kept_for_manual_compatibility_but_new_automation_should_use_fluxhei = "<p>Der alte integrierte Befehl bleibt fuer manuelle Kompatibilitaet erhalten, neue Automatisierung sollte aber <code>fluxheim-acme</code> verwenden:</p>"
use_force_renew_only_for_deliberate_emergency_rotation_or_testing_when_you_really_need_to_reissue_ce = "<p><code>--force-renew</code> nur fuer bewusste Notfallrotation oder Tests verwenden, wenn noch gueltige Zertifikate wirklich neu ausgestellt werden muessen; wiederholte erzwungene Erneuerungen koennen Issuer-Rate-Limits treffen:</p>"
all_is_accepted_as_a_backward_compatible_alias_for_force_renew_but_it_prints_a_deprecation_warning_a = "<p><code>--all</code> wird als rueckwaertskompatibler Alias fuer <code>--force-renew</code> akzeptiert, gibt aber eine Deprecation-Warnung aus und sollte in neuer Automatisierung nicht verwendet werden.</p>"
official_rpm_and_container_release_assets_include_acme_client_by_default_if_you_compile_from_source = "<p>Offizielle RPM- und Container-Release-Artefakte enthalten <code>acme-client</code> standardmaessig. Wenn Sie aus dem Source mit einer eigenen Feature-Liste kompilieren, fuegen Sie es explizit hinzu:</p>"
initialize_acme = "<h2 id=\"initialize-acme\">ACME initialisieren</h2>"
packaged_builds_include_a_guided_initializer_for_the_global_issuer_setup = "<p>Paketierte Builds enthalten einen gefuehrten Initializer fuer das globale Issuer-Setup:</p>"
for_actalis_the_command_asks_for_the_contact_email_eab_key_id_and_eab_hmac_key_the_hmac_prompt_is_hi = "<p>Fuer Actalis fragt der Befehl nach Kontakt-E-Mail, EAB-Key-ID und EAB-HMAC-Key. Der HMAC-Prompt ist verborgen. Standardmaessig schreibt er:</p>"
etc_fluxheim_conf_d_acme_toml = "<li><code>/etc/fluxheim/conf.d/acme.toml</code></li>"
etc_fluxheim_secrets_actalis_eab_kid = "<li><code>/etc/fluxheim/secrets/actalis-eab-kid</code></li>"
etc_fluxheim_secrets_actalis_eab_hmac_key = "<li><code>/etc/fluxheim/secrets/actalis-eab-hmac-key</code></li>"
etc_systemd_system_fluxheim_service_d_actalis_eab_conf = "<li><code>/etc/systemd/system/fluxheim.service.d/actalis-eab.conf</code></li>"
it_refuses_to_overwrite_existing_files_unless_force_is_supplied = "<p>Der Befehl verweigert das Ueberschreiben vorhandener Dateien, sofern <code>--force</code> nicht gesetzt ist.</p>"
automation_should_pass_secrets_through_files_not_command_line_values = "<p>Automatisierung sollte Secrets ueber Dateien uebergeben, nicht ueber Kommandozeilenwerte:</p>"
after_initialization_add_vhosts_tls_acme_blocks_to_the_vhosts_that_should_receive_managed_certificat = "<p>Nach der Initialisierung <code>[vhosts.tls.acme]</code>-Bloecke zu den Vhosts hinzufuegen, die verwaltete Zertifikate erhalten sollen, systemd neu laden, wenn ein Drop-in erstellt wurde, und den Erneuerungsbefehl ausfuehren:</p>"
packaged_actalis_credentials = "<h2 id=\"packaged-actalis-credentials\">Paketierte Actalis-Credentials</h2>"
rpm_installs_create_etc_fluxheim_secrets_with_root_only_permissions_and_ship_an_optional_systemd_dro = "<p>RPM-Installationen erstellen <code>/etc/fluxheim/secrets</code> mit Root-only-Berechtigungen und liefern ein optionales systemd-Drop-in-Beispiel unter:</p>"
to_use_actalis_eab_with_systemd_credentials = "<p>So verwenden Sie Actalis EAB mit systemd-Credentials:</p>"
then_point_the_issuer_eab_sources_at_credential_names_the_same_toml_works_for_fluxheim_service_fluxh = "<p>Dann die Issuer-EAB-Quellen auf Credential-Namen zeigen lassen. Dasselbe TOML funktioniert fuer <code>fluxheim.service</code>, <code>fluxheim-acme.service</code> und Container-Secrets:</p>"
renewal_queue_planning = "<h2 id=\"renewal-queue-planning\">Planung der Erneuerungswarteschlange</h2>"
fluxheim_derives_renewal_targets_from_validated_vhost_acme_config_the_planner_is_implemented_and_pro = "<p>Fluxheim leitet Erneuerungsziele aus validierter Vhost-ACME-Config ab. Der Planner ist implementiert und erzeugt Queue-Items mit:</p>"
vhost_name = "<li>Vhost-Name</li>"
issuer_name = "<li>Issuer-Name</li>"
concrete_certificate_domains = "<li>konkrete Zertifikatsdomains</li>"
challenge_type = "<li>Challenge-Typ</li>"
certificate_expiration_time = "<li>Ablaufzeit des Zertifikats</li>"
next_renewal_time = "<li>naechster Erneuerungszeitpunkt</li>"
the_first_renewal_time_should_be_the_later_of = "<p>Der erste Erneuerungszeitpunkt sollte der spaetere dieser Werte sein:</p>"
certificate_not_after_tls_acme_renewal_renew_before_secs = "<li><code>certificate_not_after - tls.acme.renewal.renew_before_secs</code></li>"
tls_acme_renewal_renew_after_when_set = "<li><code>tls.acme.renewal.renew_after</code>, wenn gesetzt</li>"
renew_after_lets_an_operator_defer_automatic_renewal_until_a_chosen_toml_offset_datetime_for_example = "<p><code>renew_after</code> erlaubt einem Betreiber, automatische Erneuerung bis zu einem gewaehlten TOML-Offset-Datetime aufzuschieben, zum Beispiel <code>2026-06-01T00:00:00Z</code>. Lokale TOML-Datetimes werden abgelehnt, damit die Queue Operator-Absichten nicht in der falschen Zeitzone interpretiert.</p>"
when_fluxheim_is_built_with_acme_client_the_runtime_registers_a_background_renewal_service_when_acme = "<p>Wenn Fluxheim mit <code>acme-client</code> gebaut ist, registriert die Runtime einen Hintergrund-Erneuerungsdienst, wenn ACME-verwaltete Vhosts konfiguriert sind und <code>tls.acme.automation = &quot;background&quot;</code> gesetzt ist. Das ist der Standard fuer einfache Single-Process-Installationen. Der Dienst beobachtet den Ablauf verwalteter Zertifikate, wacht alle <code>tls.acme.renewal.check_interval_secs</code> auf und erneuert fehlende oder faellige Zertifikate ueber denselben ACME-Challenge-Pfad wie die CLI.</p>"
after_successful_renewal_fluxheim_reloads_the_downstream_sni_certificate_resolver_or_callback_so_new = "<p>Nach erfolgreicher Erneuerung laedt Fluxheim den Downstream-SNI-Zertifikat-Resolver oder Callback neu, damit neue Handshakes die frisch installierten Dateien ohne Neustart verwenden koennen. Wenn ein TLS-Backend oder eine Listener-Form keinen Reload-Handle bereitstellen kann, loggt Fluxheim, dass ein Neustart oder Prozess-Reload erforderlich ist.</p>"
this_reload_happens_inside_the_long_running_fluxheim_process_the_gateway_also_owns_a_local_unix_doma = "<p>Dieser Reload passiert im lang laufenden Fluxheim-Prozess. Das Gateway besitzt ausserdem einen lokalen Unix-Domain-Zertifikat-Reload-Socket unter <code>server.process.certificate_reload_sock</code>, standardmaessig:</p>"
the_socket_accepts_only_the_narrow_reload_certificates_operation_and_is_created_with_owner_only_perm = "<p>Der Socket akzeptiert nur die enge Operation <code>reload-certificates</code> und wird vom laufenden Gateway mit Owner-only-Berechtigungen erstellt. Er ist fuer denselben Runtime-User oder Container-Pod gedacht, nicht fuer Remote-Administration. Das lang laufende Gateway begrenzt gleichzeitige Reload-Control-Requests, und jeder akzeptierte Request nutzt weiterhin ein kurzes festes Read-Timeout. Der Companion liest die Gateway-Antwort mit einer kleinen festen Grenze, damit ein kompromittierter oder ersetzter lokaler Socket den Companion-Speicher nicht unbegrenzt wachsen lassen kann.</p>"
production_packages_include_the_fluxheim_acme_companion_binary_while_keeping_the_integrated_backgrou = "<p>Produktionspakete enthalten das <code>fluxheim-acme</code>-Companion-Binary und behalten den integrierten Hintergrund-Worker fuer einfache Installationen bei. In diesem Modell konzentriert sich <code>fluxheim.service</code> auf Traffic-Serving und Challenge-Dateien, waehrend der One-shot <code>fluxheim-acme.service</code> und der geplante <code>fluxheim-acme.timer</code> Erneuerungen als Fluxheim-Runtime-User ausfuehren. Der Companion-Befehl verwendet dieselbe ACME-Engine und dasselbe Storage-Layout wie der alte Befehl <code>fluxheim acme-renew</code>, nutzt systemd-Credentials oder Container-Secrets fuer EAB-Material und schreibt Zertifikate unterhalb des konfigurierten <code>tls.acme.storage</code>. Wenn Zertifikate erneuert werden, fordert er das laufende Gateway auf, seine Zertifikat-Handles ueber <code>server.process.certificate_reload_sock</code> neu zu laden. Setzen Sie in diesem Modus <code>tls.acme.automation = &quot;external&quot;</code>, damit der Webserver nicht zusaetzlich die Hintergrund-Erneuerungsschleife ausfuehrt.</p>"
preview_targets_without_contacting_the_issuer = "<p>Ziele anzeigen, ohne den Issuer zu kontaktieren:</p>"
check_due_missing_valid_state_before_issuing = "<p>Faelligen, fehlenden oder gueltigen Zustand vor der Ausstellung pruefen:</p>"
run_renewal_and_request_live_certificate_activation_after_successful_issuance = "<p>Erneuerung ausfuehren und nach erfolgreicher Ausstellung Live-Aktivierung des Zertifikats anfordern:</p>"
request_only_the_live_certificate_handle_reload_for_example_after_manually_installing_files_below_tl = "<p>Nur den Live-Reload der Zertifikat-Handles anfordern, zum Beispiel nach manueller Installation von Dateien unter <code>tls.acme.storage</code>:</p>"
enable_the_packaged_timer_after_acme_config_and_credentials_are_installed = "<p>Den paketierten Timer aktivieren, nachdem ACME-Config und Credentials installiert sind:</p>"
do_not_make_the_webserver_spawn_a_long_lived_helper_process_let_the_service_manager_or_container_orc = "<p>Den Webserver keinen langlebigen Helper-Prozess starten lassen; stattdessen soll der Service-Manager oder Container-Orchestrator den Companion ueberwachen.</p>"
container_renewal = "<h2 id=\"container-renewal\">Container-Erneuerung</h2>"
runtime_images_include_both_usr_local_bin_fluxheim_and_usr_local_bin_fluxheim_acme_the_companion_can = "<p>Runtime-Images enthalten sowohl <code>/usr/local/bin/fluxheim</code> als auch <code>/usr/local/bin/fluxheim-acme</code>. Der Companion kann mit <code>podman exec</code> innerhalb des bereits laufenden Gateway-Containers oder als separater One-shot-Container laufen. In beiden Faellen muss er dieselbe Config, denselben ACME-Speicher, dieselben Secrets und dasselbe <code>/run/fluxheim</code>-Verzeichnis wie das Gateway sehen.</p>"
the_gateway_and_companion_must_share_server_process_certificate_reload_sock_the_packaged_container_c = "<p>Gateway und Companion muessen <code>server.process.certificate_reload_sock</code> teilen. Die paketierten Container-Konfigurationen verwenden:</p>"
keep_the_host_side_run_directory_private_to_the_container_runtime_user_and_mount_it_read_write_into = "<p>Das hostseitige Run-Verzeichnis privat fuer den Container-Runtime-Nutzer halten und read-write in beide Container mounten:</p>"
if_the_gateway_container_is_already_running_the_simplest_operational_commands_are = "<p>Wenn der Gateway-Container bereits laeuft, sind die einfachsten Betriebsbefehle:</p>"
podman_exec_naturally_shares_the_gateway_container_filesystem_secrets_and_reload_socket_it_is_useful = "<p><code>podman exec</code> teilt natuerlich das Dateisystem des Gateway-Containers, Secrets und Reload-Socket. Das ist fuer manuelle Checks nuetzlich, aber geplante Erneuerungen sind oft sauberer als One-shot-Companion-Container:</p>"
use_status_before_renew_when_testing_a_new_mount_layout = "<p><code>status</code> vor <code>renew</code> verwenden, wenn ein neues Mount-Layout getestet wird:</p>"
for_compose_keep_fluxheim_and_fluxheim_acme_on_the_same_network_and_use_the_same_bind_mounts_the_com = "<p>Fuer Compose <code>fluxheim</code> und <code>fluxheim-acme</code> im selben Netzwerk halten und dieselben Bind-Mounts verwenden. Der Companion-Service sollte nur Entrypoint und Command ueberschreiben:</p>"
run_it_on_demand_with = "<p>Bei Bedarf ausfuehren mit:</p>"
for_scheduled_container_renewals_use_a_host_systemd_timer_kubernetes_cronjob_or_the_platform_schedul = "<p>Fuer geplante Container-Erneuerungen einen Host-systemd-Timer, Kubernetes-CronJob oder den Plattform-Scheduler verwenden, um den One-shot-Companion zu starten. Halten Sie <code>tls.acme.automation = &quot;external&quot;</code> damit das Gateway nicht zusaetzlich die Hintergrund-Erneuerungsschleife ausfuehrt.</p>"
runtime_crate_candidates = "<h2 id=\"runtime-crate-candidates\">Runtime-Crate-Kandidaten</h2>"
latest_checked_acme_runtime_candidates = "<p>Zuletzt gepruefte ACME-Runtime-Kandidaten:</p>"
instant_acme_0_8_5_apache_2_0_async_pure_rust_acme_client_with_eab_support_this_is_the_current_first = "<li><code>instant-acme 0.8.5</code>: Apache-2.0, async Pure-Rust-ACME-Client mit EAB-Unterstuetzung. Das ist der aktuelle erste Kandidat, weil er das TLS-Listener-Modell nicht besitzt.</li>"
rustls_acme_0_15_1_apache_2_0_or_mit_useful_reference_for_rustls_focused_certificate_management_but = "<li><code>rustls-acme 0.15.1</code>: Apache-2.0 OR MIT, nuetzliche Referenz fuer rustls-fokussiertes Zertifikatsmanagement, aber weniger passend zu Fluxheims mehreren Pingora-TLS-Backend-Zielen.</li>"
fips_iso_required_deployments = "<h2 id=\"fips-iso-required-deployments\">FIPS-/ISO-pflichtige Deployments</h2>"
managed_fluxheim_acme_is_intentionally_outside_the_strict_fips_iso_required_runtime_boundary_in_1_3 = "<p>Verwaltetes Fluxheim-ACME liegt in <code>1.3.6</code> absichtlich ausserhalb der strengen FIPS-/ISO-pflichtigen Runtime-Grenze. Eine Config mit <code>[tls.fips] required = true</code> oder <code>[tls.iso19790] required = true</code> lehnt <code>[tls.acme] enabled = true</code> ab, weil ACME-Account-Key-Generation, JWS-Account-Signing, External-Account-Binding-HMAC, ausgehender ACME-HTTPS-Transport und TLS-ALPN-Challenge-Zertifikatserzeugung nicht vollstaendig ueber den ausgewaehlten validierten Provider geroutet sind.</p>"
for_regulated_deployments_use_local_static_certificate_files_in_vhosts_tls_certificate_and_renew_the = "<p>Fuer regulierte Deployments lokale statische Zertifikatdateien in <code>[vhosts.tls.certificate]</code> verwenden und sie mit einem externen Prozess erneuern, der ein eigenes Evidence-Paket hat. Wenn dieser externe Prozess ACME-basiert ist, ACME-Client-Version, Host-FIPS-/ISO-Modus, Key-Generation-Policy, CA-/Audit-Evidence und Erneuerungslogs mit der Deployment-Evidence aufbewahren. Konservative Public-Web-PKI-Profile sollten RSA-2048- oder RSA-3072-Zertifikatkeys anfordern, sofern der Assessor das ausgewaehlte ECDSA-Zertifikatsprofil und die Chain nicht explizit akzeptiert.</p>"
the_fluxheim_acme_storage_path_hashing_uses_sha_256_and_does_not_use_md5_for_local_account_or_certif = "<p>Das Hashing der Fluxheim-ACME-Storage-Pfade nutzt SHA-256 und kein MD5 fuer lokale Account- oder Zertifikatsverzeichnis-Labels, aber das reicht nicht aus, um verwaltetes ACME zu einem Teil der genehmigten kryptografischen Grenze zu machen. <code>fluxheim-acme</code> als normales Automatisierungstool behandeln, solange verwaltetes ACME kein provider-geroutetes Signing, Key-Generation, EAB und outbound TLS-Evidence hat.</p>"
retry_policy = "<h2 id=\"retry-policy\">Retry-Policy</h2>"
failed_renewal_attempts_should_retry_with_bounded_backoff = "<p>Fehlgeschlagene Erneuerungsversuche sollten mit begrenztem Backoff wiederholen:</p>"
start_at_tls_acme_renewal_retry_initial_secs = "<li>bei <code>tls.acme.renewal.retry_initial_secs</code> starten</li>"
grow_up_to_tls_acme_renewal_retry_max_secs = "<li>bis <code>tls.acme.renewal.retry_max_secs</code> wachsen</li>"
never_remove_the_currently_active_certificate_because_of_a_failed_renewal = "<li>das aktuell aktive Zertifikat niemals wegen einer fehlgeschlagenen Erneuerung entfernen</li>"
the_scheduler_should_wake_at_least_every_tls_acme_renewal_check_interval_secs_to_catch_newly_due_cer = "<p>Der Scheduler sollte mindestens alle <code>tls.acme.renewal.check_interval_secs</code> aufwachen, um neu faellige Zertifikate und Config-Aenderungen zu erfassen.</p>"
atomic_install = "<h2 id=\"atomic-install\">Atomare Installation</h2>"
renewed_certificates_must_be_installed_atomically = "<p>Erneuerte Zertifikate muessen atomar installiert werden:</p>"
write_certificate_and_key_to_temporary_files_in_the_acme_storage_directory = "<li>Zertifikat und Key in temporaere Dateien im ACME-Storage-Verzeichnis schreiben.</li>"
validate_that_the_certificate_parses_matches_the_private_key_and_covers_the_configured_domains = "<li>Validieren, dass das Zertifikat geparst werden kann, zum privaten Key passt und die konfigurierten Domains abdeckt.</li>"
flush_files_and_directory_metadata_where_the_platform_supports_it = "<li>Dateien und Verzeichnismetadaten flushen, wo die Plattform es unterstuetzt.</li>"
rename_temporary_files_into_place = "<li>Temporaere Dateien an ihren Zielort umbenennen.</li>"
keep_the_previous_certificate_available_until_the_new_one_is_active = "<li>Das vorherige Zertifikat verfuegbar halten, bis das neue aktiv ist.</li>"
the_current_install_helper_implements_the_filesystem_side_of_that_contract_it_validates_basic_pem_sh = "<p>Der aktuelle Install-Helper implementiert die Dateisystemseite dieses Vertrags. Er validiert grundlegende PEM-Form und -Groesse, schreibt temporaere Dateien neben das verwaltete Ziel, lehnt symlinkte Verzeichnisse oder Zieldateien ab, behaelt Backups bestehender Dateien waehrend des Stagings und bereinigt temporaere Dateien bei Fehlern. Vollstaendiges Certificate/Key-Matching und Domain-Coverage-Validierung gehoeren in den ACME-Client-Schritt, bevor dieser Helper aufgerufen wird. Fehlgeschlagene Issuer-Aufrufe und fehlgeschlagene Zertifikatsinstallationen entfernen das vorherige aktive Zertifikat nicht.</p>"
no_downtime_reload = "<h2 id=\"no-downtime-reload\">Reload ohne Downtime</h2>"
runtime_state_should_be_immutable_snapshots_behind_an_atomic_pointer_existing_requests_keep_their_cu = "<p>Der Runtime-Zustand sollte aus unveraenderlichen Snapshots hinter einem atomaren Pointer bestehen. Bestehende Requests behalten ihren aktuellen Snapshot. Neue Requests nutzen nach dem Reload den neuesten Snapshot. Fluxheims Proxy-Routing-Zustand nutzt dieses Modell bereits fuer Vhost-, Upstream-, Cache- und Static-Web-Policy-Snapshots. Dieses Modell gilt fuer:</p>"
vhost_routing = "<li>Vhost-Routing</li>"
upstream_pools = "<li>Upstream-Pools</li>"
cache_policies = "<li>Cache-Policies</li>"
certificate_lookup_maps = "<li>Zertifikats-Lookup-Maps</li>"
listener_changes_are_process_level_changes_and_should_use_pingoras_zero_downtime_upgrade_path_rather = "<p>Listener-Aenderungen sind prozessweite Aenderungen und sollten Pingoras Zero-Downtime-Upgrade-Pfad statt In-place-Mutation verwenden.</p>"
reload_classification = "<h2 id=\"reload-classification\">Reload-Klassifizierung</h2>"
fluxheim_classifies_a_config_change_before_applying_it = "<p>Fluxheim klassifiziert eine Config-Aenderung, bevor sie angewendet wird:</p>"
noop_old_and_new_config_are_identical = "<li><code>Noop</code>: alte und neue Config sind identisch.</li>"
snapshot_safe_for_in_place_snapshot_swap = "<li><code>Snapshot</code>: safe for in-place snapshot swap.</li>"
processupgrade_requires_pingoras_process_level_zero_downtime_upgrade_path = "<li><code>ProcessUpgrade</code>: requires Pingora&#x27;s process-level zero-downtime upgrade path.</li>"
operators_can_check_the_impact_of_a_planned_config_change = "<p>Betreiber koennen die Auswirkung einer geplanten Config-Aenderung pruefen:</p>"
durable_config_history_and_rollback_commands_are_documented_in_config_snapshots_and_rollback = "<p>Dauerhafte Config-Historie und Rollback-Befehle sind dokumentiert in <a href=\"config-snapshots.html\" class=\"text-cyan-400 hover:text-cyan-300\">Config-Snapshots und Rollback</a>.</p>"
snapshot_reload_is_intended_for_routing_cache_policy_static_web_policy_and_certificate_lookup_change = "<p>Snapshot-Reload ist fuer Routing-, Cache-Policy-, Static-Web-Policy- und Zertifikats-Lookup-Aenderungen gedacht, die keine Listener oder beim Start besessenen Hintergrunddienste veraendern.</p>"
process_upgrade_is_required_when = "<p>Ein Process-Upgrade ist erforderlich, wenn:</p>"
listener_addresses_change = "<li>listener addresses change</li>"
downstream_tls_mode_changes = "<li>downstream TLS mode changes</li>"
the_configured_tls_backend_changes = "<li>the configured TLS-Backend changes</li>"
load_balancer_background_service_registration_ownership_changes = "<li>load-balancer background service registration/ownership changes</li>"
this_keeps_the_hot_reload_path_conservative_until_fluxheim_has_explicit_runtime_ownership_for_adding = "<p>Das haelt den Hot-Reload-Pfad konservativ, bis Fluxheim explizite Runtime-Zustaendigkeit fuer das Hinzufuegen und Entfernen von Hintergrunddiensten nach dem Start hat.</p>"

[logging_architecture]
logging_architecture_fluxheim_source_docs = "<title>Logging-Architektur - Fluxheim-Source-Dokumentation</title>"
logging_architecture = "<h1 id=\"logging-architecture\">Logging-Architektur</h1>"
fluxheim_logging_should_be_structured_asynchronous_and_explicit_about_the_tradeoff_between_reque = "<p>Fluxheim-Logging sollte strukturiert, asynchron und explizit ueber den Tradeoff zwischen Request-Latenz und Dauerhaftigkeit sein. Logging darf sicherheitsrelevante Events niemals verbergen, und Remote-Logging-Fehler duerfen normalen Traffic nicht unterbrechen.</p>"
goals = "<h2 id=\"goals\">Ziele</h2>"
use_tracing_as_the_core_instrumentation_api = "<li>Nutze <code>tracing</code> als zentrale Instrumentierungs-API.</li>"
emit_production_logs_as_json_through_serde_backed_formatting = "<li>Produktionslogs als JSON über serde-gestützte Formatierung ausgeben.</li>"
keep_stdout_available_as_the_default_sink_for_systemd_podman_and_local_debugging = "<li>stdout als Standard-Sink für systemd, Podman und lokales Debugging verfügbar halten.</li>"
avoid_disk_or_network_writes_on_request_worker_hot_paths = "<li>Festplatten- oder Netzwerk-Schreibvorgänge auf heißen Request-Worker-Pfaden vermeiden.</li>"
add_remote_logging_only_behind_explicit_config_and_optional_compile_features = "<li>Remote-Logging nur hinter expliziter Konfiguration und optionalen Compile-Features hinzufügen.</li>"
make_overflow_behavior_explicit_instead_of_pretending_logs_are_always_both_non_blocking_and_loss = "<li>Überlaufverhalten explizit machen, statt vorzugeben, Logs seien immer zugleich nicht blockierend und verlustfrei.</li>"
latest_reviewed_crates = "<p>Zuletzt gepruefte Crates:</p>"
tracing_0_1_44_mit = "<li><code>tracing 0.1.44</code>, MIT.</li>"
tracing_subscriber_0_3_23_mit = "<li><code>tracing-subscriber 0.3.23</code>, MIT.</li>"
tracing_appender_0_2_5_mit = "<li><code>tracing-appender 0.2.5</code>, MIT.</li>"
tracing_serde_0_2_0_mit = "<li><code>tracing-serde 0.2.0</code>, MIT.</li>"
log_classes = "<h2 id=\"log-classes\">Log-Klassen</h2>"
fluxheim_should_split_logs_by_intent = "<p>Fluxheim sollte Logs nach Absicht aufteilen:</p>"
access_one_event_per_completed_request = "<li><code>access</code>: ein Ereignis pro abgeschlossenem Request.</li>"
error_internal_failures_and_unexpected_runtime_errors = "<li><code>error</code>: interne Fehler und unerwartete Laufzeitfehler.</li>"
security_rejected_requests_request_smuggling_attempts_admin_auth_failures_path_traversal_denied = "<li><code>security</code>: abgelehnte Requests, Request-Smuggling-Versuche, Admin-Auth-Fehler, Path Traversal, verweigerte PHP/CGI-Ausführung und TLS-/Zertifikats-Berechtigungsfehler.</li>"
audit_admin_operations_such_as_snapshot_rollback_reload_purge_cache_activity_reset_load_balancer = "<li><code>audit</code>: Admin-Operationen wie Snapshot, Rollback, Reload, Purge, Cache-Activity-Reset, Load-Balancer-Member-State, Member-Weight oder Backend-Set-Mutation, Zertifikatserneuerung und kuenftige Account-/Key-Aenderungen.</li>"
security_and_audit_logs_should_not_be_silently_disabled_per_vhost_they_may_be_rerouted_or_filter = "<p>Security- und Audit-Logs sollten pro Vhost nicht stillschweigend deaktiviert werden. Sie duerfen nach Level umgeleitet oder gefiltert werden, aber Fluxheim sollte ihre Deaktivierung zu einer expliziten Hochrisiko-Betreiberentscheidung machen.</p>"
event_fields = "<h2 id=\"event-fields\">Ereignisfelder</h2>"
access_events_should_include = "<p>Access-Ereignisse sollten enthalten:</p>"
timestamp = "<li>Zeitstempel</li>"
level = "<li>Level</li>"
target_module = "<li>Ziel/Modul</li>"
request_id = "<li>Request-ID</li>"
vhost = "<li>Vhost</li>"
method = "<li>Methode</li>"
path = "<li>Pfad</li>"
query_present = "<li>query_present</li>"
protocol = "<li>Protokoll</li>"
status = "<li>Status</li>"
latency_ms = "<li>latency_ms</li>"
remote_addr = "<li>remote_addr</li>"
user_agent_length_capped = "<li>user_agent, längenbegrenzt</li>"
referer_length_capped = "<li>Referer, längenbegrenzt</li>"
upstream_when_proxied = "<li>Upstream, wenn proxied</li>"
cache_status_when_cache_participates = "<li>Cache-Status, wenn der Cache beteiligt ist</li>"
tls_when_known = "<li>TLS, wenn bekannt</li>"
legacy_protocol_when_future_legacy_static_listeners_are_used = "<li>Legacy-Protokoll, wenn kuenftige Legacy-Static-Listener verwendet werden</li>"
audit_security_events_should_include_action_outcome_fields_and_avoid_raw_secret_values = "<p>Audit-/Security-Events sollten Action-/Outcome-Felder enthalten und rohe Secret-Werte vermeiden.</p>"
pipeline = "<h2 id=\"pipeline\">Pipeline</h2>"
the_desired_pipeline_has_three_stages = "<p>Die gewünschte Pipeline hat drei Stufen:</p>"
capture_request_path_emits_tracing_events_with_structured_fields = "<li>Capture: Der Request-Pfad emittiert <code>tracing</code> Ereignisse mit strukturierten Feldern.</li>"
buffer_events_enter_a_bounded_async_queue = "<li>Buffer: Ereignisse gelangen in eine begrenzte asynchrone Queue.</li>"
dispatch_a_background_dispatcher_writes_to_configured_sinks = "<li>Dispatch: Ein Hintergrund-Dispatcher schreibt in konfigurierte Sinks.</li>"
the_request_worker_must_never_perform_slow_remote_network_logging_directly = "<p>Der Request-Worker darf langsames Remote-Netzwerk-Logging niemals direkt ausführen.</p>"
overflow_policy = "<h2 id=\"overflow-policy\">Überlauf-Policy</h2>"
fluxheim_must_expose_an_explicit_overflow_policy = "<p>Fluxheim muss eine explizite Überlauf-Policy bereitstellen:</p>"
drop_new_fastest_increments_dropped_log_metrics = "<li><code>drop_new</code>: schnellste Option; erhoeht Dropped-Log-Metriken.</li>"
block_preserves_logs_but_can_slow_request_handling = "<li><code>block</code>: bewahrt Logs, kann aber die Request-Verarbeitung verlangsamen.</li>"
spool_writes_to_a_bounded_durable_disk_queue_best_durability_but_more_operational_complexity = "<li><code>spool</code>: schreibt in eine begrenzte dauerhafte Disk-Queue; beste Haltbarkeit, aber mehr Betriebsaufwand.</li>"
without_spool_fluxheim_must_not_claim_zero_data_loss_with_block_fluxheim_must_not_claim_zero_req = "<p>Ohne <code>spool</code> darf Fluxheim keinen Datenverlust von null behaupten. Mit <code>block</code> darf Fluxheim keine Auswirkung von null auf die Request-Latenz behaupten.</p>"
sinks = "<h2 id=\"sinks\">Sinks</h2>"
initial_sinks = "<p>Initiale Sinks:</p>"
stdout_default = "<li><code>stdout</code>: Standard.</li>"
file_optional_structured_local_file = "<li><code>file</code>: optionale strukturierte lokale Datei.</li>"
remote_tcp_tls_future_production_sink_for_vector_logstash_or_similar = "<li><code>remote_tcp_tls</code>: künftiger Produktions-Sink für Vector, Logstash oder Ähnliches.</li>"
remote_udp_future_non_critical_sink_only_never_for_audit_security = "<li><code>remote_udp</code>: kuenftiger nicht kritischer Sink; niemals fuer Audit/Security.</li>"
remote_sinks_should_be_optional_compile_time_support_for_example_logging_remote_durable_disk_que = "<p>Remote-Sinks sollten optionale Compile-Zeit-Unterstuetzung sein, zum Beispiel <code>logging-remote</code>. Unterstuetzung fuer dauerhafte Disk-Queues sollte hinter <code>logging-spool</code> liegen.</p>"
circuit_breaker = "<h2 id=\"circuit-breaker\">Circuit Breaker</h2>"
remote_dispatch_should_use_a_circuit_breaker = "<p>Remote-Dispatch sollte einen Circuit Breaker verwenden:</p>"
connected_send_to_remote_sink = "<li><code>connected</code>: an den Remote-Sink senden.</li>"
tripped_remote_failed_write_to_stdout_or_spool = "<li><code>tripped</code>: Remote fehlgeschlagen; nach stdout oder in den Spool schreiben.</li>"
recovering_attempt_periodic_reconnect_heartbeat = "<li><code>recovering</code>: periodischen Reconnect/Heartbeat versuchen.</li>"
on_send_failure_the_dispatcher_should_immediately_fallback_for_that_event_trip_the_remote_sink_a = "<p>Bei Sendefehlern sollte der Dispatcher fuer dieses Event sofort auf den Fallback wechseln, den Remote-Sink ausloesen und Metriken erhoehen. Reconnect-Versuche sollten begrenzten exponentiellen Backoff verwenden.</p>"
security_requirements = "<h2 id=\"security-requirements\">Sicherheitsanforderungen</h2>"
redact_authorization_cookie_set_cookie_admin_bearer_tokens_acme_eab_values_api_keys_and_configur = "<li><code>Authorization</code>, <code>Cookie</code>, <code>Set-Cookie</code>, Admin-Bearer-Tokens, ACME-EAB-Werte, API-Schluessel und konfigurierte sensible Header/Felder redigieren.</li>"
never_log_request_bodies_by_default = "<li>Request-Bodies standardmäßig niemals loggen.</li>"
length_cap_paths_headers_error_messages_and_upstream_error_text = "<li>Pfade, Header, Fehlermeldungen und Upstream-Fehlertext in der Länge begrenzen.</li>"
use_serde_json_formatting_not_hand_built_json_strings = "<li>Serde-/JSON-Formatierung verwenden, keine handgebauten JSON-Strings.</li>"
mark_fallback_source_for_example_log_sink_stdout_fallback_or_log_sink_spool_fallback = "<li>Fallback-Quelle markieren, zum Beispiel <code>log_sink=&quot;stdout-fallback&quot;</code> oder <code>log_sink=&quot;spool-fallback&quot;</code>.</li>"
make_audit_security_logs_available_to_stdout_even_when_remote_logging_fails = "<li>Audit-/Security-Logs auch dann fuer stdout verfuegbar machen, wenn Remote-Logging fehlschlaegt.</li>"
protect_local_log_files_and_spool_directories_with_owner_only_permissions_where_supported = "<li>Lokale Logdateien und Spool-Verzeichnisse, wo unterstützt, mit Owner-only-Berechtigungen schützen.</li>"
config_shape = "<h2 id=\"config-shape\">Konfigurationsform</h2>"
initial_target = "<p>Initiales Ziel:</p>"
implemented_baseline_logging_access_enabled_controls_a_compact_json_access_event_emitted_from_pi = "<p>Implementierte Baseline: <code>logging.access.enabled</code> steuert ein kompaktes JSON-Access-Event, das aus Pingoras <code>logging</code>-Hook emittiert wird. Es erfasst Methode, optionalen rohen Host, Vhost, optionalen query-freien Pfad, Status, Statusklasse mit niedriger Kardinalitaet, Error-Flag, Request-ID, gelesene Request-Body-Bytes, gelesene Response-Body-Bytes und Latenz. Wenn Request-IDs aktiviert sind, verwendet Fluxheim eine gueltige eingehende Request-ID aus <code>request_id_header</code> wieder oder erzeugt eine und gibt sie upstream weiter, bevor normale Header-Policy-Mutationen laufen. Diese Baseline verwendet den bestehenden <code>log</code>-Stack. stderr/stdout und ein standardmaessig deaktivierter <code>[logging.file]</code>-Sink sind implementiert; der asynchrone Dispatcher und Remote-Sinks bleiben kuenftige Arbeit.</p>"
logging_level_and_logging_format_are_applied_at_startup_through_env_logger_rust_log_can_still_ov = "<p><code>logging.level</code> und <code>logging.format</code> werden beim Start ueber <code>env_logger</code> angewendet; <code>RUST_LOG</code> kann das Level fuer lokales Debugging weiterhin ueberschreiben. Eine Aenderung einer der beiden Einstellungen nach dem Start erfordert derzeit ein Prozess-Upgrade, weil der Logger einmalig initialisiert wird. Das JSON-Format emittiert strukturierte interne Laufzeitdatensaetze, waehrend Access-Events direkte JSON-Access-Datensaetze bleiben.</p>"
implementation_stages = "<h2 id=\"implementation-stages\">Implementierungsstufen</h2>"
add_typed_access_log_config_request_ids_and_baseline_json_access_events_through_log = "<li>Typisierte Access-Log-Konfiguration, Request-IDs und Baseline-JSON-Access-Ereignisse hinzufügen über <code>log</code>.</li>"
add_tracing_json_stdout_formatting_and_bridge_existing_log_records = "<li><code>tracing</code>, JSON-stdout-Formatierung und Bridge fuer bestehende <code>log</code>-Datensaetze hinzufuegen.</li>"
add_access_security_audit_event_schema_and_request_ids = "<li>Zugriffs-/Security-/Audit-Event-Schema und Request-IDs hinzufuegen.</li>"
add_bounded_dispatcher_queue_with_drop_new_and_block_policies = "<li>Begrenzte Dispatcher-Queue mit <code>drop_new</code>- und <code>block</code>-Policies hinzufuegen.</li>"
add_file_sink_and_protected_local_spool_directory = "<li>File-Sink und geschütztes lokales Spool-Verzeichnis hinzufügen.</li>"
add_remote_tcp_tls_sink_with_circuit_breaker_and_fallback = "<li>Remote-TCP/TLS-Sink mit Circuit Breaker und Fallback hinzufügen.</li>"
