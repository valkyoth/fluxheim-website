fluxheim_negotiates_response_compression_from_accept_encoding_when_compression_enabled_true_and_the = "<p>Fluxheim handelt Response-Komprimierung aus <code>Accept-Encoding</code> aus, wenn <code>compression.enabled = true</code> gesetzt ist und das Binary mit mindestens einem Codec-Feature gebaut wurde. Gzip ist ueber <code>compression-gzip</code> verfuegbar, Zstandard ueber <code>compression-zstd</code> und Brotli ueber <code>compression-brotli</code>. <code>q=0</code> wird fuer jede Codierung respektiert. Wenn mehrere akzeptierte Codierungen aktiviert sind, bevorzugt Fluxheim <code>br</code>, dann <code>zstd</code>, dann <code>gzip</code>.</p>"
