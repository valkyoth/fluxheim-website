adds_the_first_native_http_1_proxy_cutover_summary_to_the_server_plan_that_summary_is_an_eligibility = "fuegt dem Serverplan die erste native HTTP/1-Proxy-Cutover-Zusammenfassung hinzu. Diese Zusammenfassung ist ein Eligibility-Signal, kein Traffic-Switch: Die Produktionsruntime bleibt auf dem Compatibility-Adapter, bis jeder konfigurierte Proxy-Pfad entweder native Parity hat oder mit einem begrenzten Grund explizit auf dem Compatibility-Pfad gehalten wird. Operatoren sollen"
as_rollout_evidence_for_the_pingora_exit_line_rather_than_as_an_active_runtime_adapter_claim = "als Rollout Evidence fuer die Pingora-Exit-Linie behandeln und nicht als aktiven Runtime-Adapter-Claim."
adds_the_broader_native_runtime_cutover_summary_it_reports_remaining_blockers_such_as_native_http_1 = "fuegt die breitere Native-Runtime-Cutover-Zusammenfassung hinzu. Sie meldet verbleibende Blocker wie native HTTP/1-Proxy-Parity, native HTTP/2-Downstream-Parity, Admin-, Metrics-, Stream- und UDP-Service-Adapter. Dies ist weiterhin nur Diagnostic Evidence; es aendert den aktiven Runtime-Adapter nicht."
later_1_6_releases_may_add_a_bounded_in_memory_fact_ring_for_admin_diagnostics_the_ring_must_be_opti = "Spaetere 1.6-Releases koennen einen begrenzten In-Memory-Fact-Ring fuer Admin-Diagnostik ergaenzen. Der Ring muss optional, fixed-size, nach Typ redigiert und sicher deaktivierbar sein. Er darf niemals fuer Request Forwarding erforderlich sein."
