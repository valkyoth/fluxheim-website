fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 hält Wasm optional und ergänzt eingeschränkte native HTTP/1-route-decision-Hooks neben access-decision- und Header-Hooks. Plugins können fortfahren, ablehnen oder konfigurierte Canary- und Mirror-Routenbranches wählen, können aber weiterhin keine Upstreams erfinden, Route-Matching umgehen, die Fluxheim-Zugriffspolitik überschreiben oder rohe Header, Bodies, Dateisystemzugriff, Netzwerkzugriff, private Schlüssel oder Admin-APIs erhalten."
