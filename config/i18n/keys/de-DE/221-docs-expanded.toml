version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Version 1.6.37 ist die finale Crate-Grenzen-Bereinigung vor Wasm: ACME, Observability, Cache, Load-Balancer, PHP-FPM und native Runtime-Interna wandern in kleinere crate-eigene Module, während das Runtime-Verhalten stabil bleibt."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Version 1.6.37 macht den lokalen Observability-Smoke zuverlässiger, indem kurzlebige Prometheus- und Jaeger-Starts mit frisch zugewiesenen Ports wiederholt werden, wenn Host-Netzwerkports mit anderen Runner-Prozessen konkurrieren."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "Ab 1.7.0 fügt Fluxheim eine optionale Wasm-Sandbox-Grundlage hinzu. Sie ist standardmäßig deaktiviert, mit privacy-mode inkompatibel und belegt derzeit sicheres Plugin-Laden sowie begrenzte Ausführung, bevor Request/Response-Policy-Hooks freigegeben werden."
starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation = "Ab 1.7.0 fügt Fluxheim eine optionale Wasm-Sandbox-Grundlage hinzu."
optional_webassembly_sandbox_foundation_for_future_policy_extensions_disabled_by_default = "Optionale WebAssembly-Sandbox-Grundlage für künftige Policy-Erweiterungen; standardmäßig deaktiviert."
privacy_builds_do_not_include_cache_metrics_tracing_otlp_export_or_wasm_features = "Privacy-Builds enthalten keinen Cache, keine Metriken, kein Tracing, keinen OTLP-Export und keine Wasm-Features."
fluxheim_1_7_0_starts_the_optional_wasm_sandbox_foundation_it_proves_approved_root_plugin_loading_manifest_validation_and_bounded_wasmtime_execution_request_response_hooks_are_still_staged_for_later_1_7_x_releases = "Fluxheim 1.7.0 startet die optionale WASM-Sandbox-Grundlage. Sie belegt Plugin-Laden aus freigegebenen Wurzeln, Manifestvalidierung und begrenzte Wasmtime-Ausführung. Request/Response-Hooks bleiben für spätere 1.7.x-Releases geplant."
