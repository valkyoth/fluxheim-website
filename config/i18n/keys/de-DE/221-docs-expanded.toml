starting_with_1_6_34_normal_fluxheim_release_profiles_use_the_fluxheim_owned_native_runtime_and_no_longer_compile_pingora_crates = "Ab 1.6.34 verwenden normale Fluxheim release profiles das native Fluxheim-owned runtime und kompilieren Pingora crates nicht mehr."
unsupported_native_runtime_shapes_still_fail_closed_with_explicit_blockers_instead_of_falling_back_to_legacy_adapters = "Nicht unterstützte native runtime-Formen schlagen beim Schließen mit expliziten Blockern immer noch fehl, anstatt auf ältere adapters zurückzugreifen."
for_non_loopback_plaintext_peer_fill_urls_configure_cache_peer_fill_shared_secret_file_so_peer_responses_are_signed_before_they_can_be_stored = "Konfigurieren Sie für non-loopback-Klartext peer-fill URLs <code>cache.peer_fill.shared_secret_file</code> so, dass Peer-Antworten signiert werden, bevor sie gespeichert werden können."
version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Version 1.6.36 entfernt weiteren temporären Kompatibilitätscode: Die native Proxy-Grenze nutzt jetzt direkte crate-eigene APIs, und tote Root-Adapter aus der Pingora-Ära sind aus normalen Source-Pfaden verschwunden."
version_1_6_36_pins_the_prometheus_and_jaeger_smoke_test_images_to_stable_tags_so_local_and_ci_observability_checks_pull_deterministic_containers = "Version 1.6.36 pinnt die Prometheus- und Jaeger-Smoke-Test-Images auf stabile Tags, damit lokale und CI-Observability-Prüfungen deterministische Container ziehen."
fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 hält Wasm optional und ergänzt die erste begrenzte native HTTP/1-Hook-Familie für Request-Header und Response-Header. Plugins können freigegebene synthetische Policy-Änderungen ausführen, erhalten aber weiterhin keine rohen Header, Bodies, Dateisystemzugriffe, Netzwerkzugriffe, privaten Schlüssel oder Admin-APIs."
