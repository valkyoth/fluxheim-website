validate_the_mounted_config_directly_with_podman_run_rm_this_avoids_compose_provider_dif = "Validiere die gemountete Konfiguration direkt mit <code>podman run --rm</code>. Das vermeidet Compose-Provider-Unterschiede bei One-Shot-Kommandos:"
