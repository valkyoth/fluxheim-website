starting_with_v1_5_0_the_load_balancer_image_profile_is_part_of_normal_tag_publishing_fo = "Ab <code>v1.5.0</code> ist das Load-Balancer-Image-Profil Teil der normalen Tag-Veröffentlichung. Fuer aeltere Tags oder Entwicklungsbranches kann es in manuellen Workflow-Laeufen weiter mit <code>include_load_balancer=true</code> eingeschlossen werden."
the_workflow_defaults_to_linux_amd64_use_manual_dispatch_to_test_additional_platforms_fo = "Der Workflow verwendet standardmaessig <code>linux/amd64</code>. Nutze manuelle Ausfuehrung, um weitere Plattformen zu testen, zum Beispiel <code>linux/amd64,linux/arm64</code>, sobald jede ausgewaehlte Runtime-Basis fuer diese Architekturen verifiziert ist."
manual_workflow_inputs_also_allow_runtime_uid_runtime_gid_and_a_temporary_feature_overri = "Manuelle Workflow-Inputs erlauben auch <code>runtime_uid</code>, <code>runtime_gid</code> und einen temporaeren Feature-Override. Halte beide IDs fuer normale Images auf <code>65532</code>. Verwende <code>0</code> nur fuer ein bewusstes Root-Runtime-Image. Lasse den Feature-Override fuer normale Release-Profil-Builds leer."
1_3_2_adds_a_separate_fluxheim_config_tester_binary_target_for_diagnosing_configs_outsid = "<code>1.3.2</code> fuegt ein separates Binary-Target <code>fluxheim-config-tester</code> hinzu, um Konfigurationen ausserhalb des Runtime-Containers zu diagnostizieren. Es ist fuer Faelle gedacht, in denen ein Podman- oder systemd-Deployment nicht starten kann und der Operator trotzdem Fluxheims echten Config-Parser, Feature-/Profil-Pruefungen, TLS-Storage-Pruefungen, ACME-Target-Preview und Upstream-DNS-Pruefungen braucht."
use_profile_full_profile_cache_profile_proxy_or_profile_web_php_to_match_the_release_art = "Nutze <code>--profile full</code>, <code>--profile cache</code>, <code>--profile proxy</code> oder <code>--profile web-php</code>, passend zum Release-Artefakt oder Image-Profil, das du ausfuehren willst. Fuege <code>--no-runtime-paths</code> hinzu, wenn du nur Syntax-, Semantik- und Profilvalidierung ausserhalb des Gateway-Containers brauchst und keinen Zugriff auf Service-Runtime-Mounts wie <code>/run/fluxheim</code> hast. Lasse das Flag weg, wenn der Tester <code>server.process.pid_file</code>, Upgrade-Socket und Certificate-Reload-Socket-Pfade als Teil eines Deployment-Preflight pruefen soll."
runtime_images_and_rpms_do_include_fluxheim_acme_which_is_the_acme_companion_entry_point = "Runtime-Images und RPMs enthalten <code>fluxheim-acme</code>, den ACME-Companion-Einstiegspunkt fuer Service-Manager- oder Container-geplante Renewal-Workflows:"
for_live_activation_after_renewal_the_running_gateway_and_companion_need_the_same_writab = "Fuer Live-Aktivierung nach der Erneuerung brauchen laufendes Gateway und Companion denselben schreibbaren <code>/run/fluxheim</code>-Mount, damit <code>fluxheim-acme</code> <code>server.process.certificate_reload_sock</code> erreichen kann."
