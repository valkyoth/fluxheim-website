per_site_static_roots_referenced_by_vhosts = "Per-Site-Static-Roots, die von Vhosts referenziert werden."
optional_file_logs_when_logging_file_is_enabled = "Optionale File-Logs, wenn <code>[logging.file]</code> aktiviert ist."
for_podman_on_selinux_hosts_z_gives_the_bind_mount_a_private_container_label_add_u_only = "Fuer Podman auf SELinux-Hosts gibt <code>:Z</code> dem Bind-Mount ein privates Container-Label. Fuege <code>:U</code> nur fuer schreibbare Pfade hinzu, wenn Podman Ownership fuer User Namespaces anpassen soll. Read-only-Pfade verwenden normalerweise <code>:ro,Z</code>, nicht <code>:U</code>."
the_default_image_user_is_65532_65532_so_writable_host_directories_should_be_owned_or_ma = "Der Default-Image-User ist <code>65532:65532</code>, daher sollten schreibbare Host-Verzeichnisse diesem User gehoeren oder fuer ihn gemappt sein. Mit rootless Podman ist <code>:U</code> oft die einfachste sichere Option fuer Cache-/State-/Log-Verzeichnisse."
