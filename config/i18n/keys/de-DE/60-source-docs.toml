for_multi_site_setups_prefer_etc_fluxheim_conf_d_with_one_vhost_per_file_vhosts_starts_a = "Fuer Multi-Site-Setups bevorzuge <code>/etc/fluxheim/conf.d/</code> mit einem Vhost pro Datei. <code>[[vhosts]]</code> startet einen Vhost, und jede folgende <code>[vhosts.*]</code>-Tabelle gehoert zu diesem Vhost bis zum naechsten <code>[[vhosts]]</code>. Die paketierte <code>/etc/fluxheim/fluxheim.toml</code> setzt <code>include_conf_d = true</code> und laedt daher sichtbare <code>*.toml</code>-Dateien aus <code>/etc/fluxheim/conf.d/</code> nach der Hauptdatei. Wenn Fluxheim aus <code>/etc/fluxheim</code> startet, laedt es zuerst Top-Level-TOML-Dateien und danach <code>/etc/fluxheim/conf.d/*.toml</code>."
