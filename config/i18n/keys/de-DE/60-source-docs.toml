native_freebsd_packaging_should_be_documented_separately_after_it_is_tested_on_a_freebsd = "Native FreeBSD-Paketierung soll separat dokumentiert werden, nachdem sie auf einem FreeBSD-Host getestet wurde. Der erwartete Pfad ist ein normales Fluxheim-Binary plus rc.d-Service oder Jail-Deployment, nicht die obigen Linux-Container-Images."
