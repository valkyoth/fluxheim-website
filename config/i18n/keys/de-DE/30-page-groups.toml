geo_rules_live_on_the_existing_vhost_and = "Geo-Regeln liegen auf der bestehenden vhost- und Route-Zugriffspolitik. Laendercodes sind ISO-Alpha-2-Werte in Grossbuchstaben. ASN-Werte sind numerisch und muessen groesser als null sein."
vhost_policy_runs_before_route_policy_geo_allow = "Vhost-Policy laeuft vor Route-Policy. Geo-Allow-Listen fail-closed, wenn fuer die Client-IP kein Geo-Context verfuegbar ist. Geo-Deny-Listen verweigern nur, wenn das aufgeloeste Land oder ASN passt."
when_geoip_is_compiled_and_a_lookup_succeeds = "Wenn <code>geoip</code> einkompiliert ist und ein Lookup erfolgreich ist, enthalten strukturierte Access-Logs:"
