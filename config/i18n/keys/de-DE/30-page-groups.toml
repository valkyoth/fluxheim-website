fluxheim_does_not_download_or_update_databases_in = "Fluxheim laedt oder aktualisiert Datenbanken nicht im Prozess. Nutze einen externen systemd-Timer, Package-Job oder Sidecar, um Datenbankdateien abzurufen und zu verifizieren, und lade Fluxheim danach neu. Datenbankdateien werden als regulaere Dateien geoeffnet, und Symlink-Blattpfade werden abgelehnt."
