runtime_parity_fixtures = "Runtime-Parity-Fixtures"
pingora_exit_baseline = "Pingora-Exit-Baseline"
line_replaces_the_current_pingora_runtime_in_stages = "Linie ersetzt die aktuelle Pingora-Runtime schrittweise. Vor jedem Cutover fuehrt Fluxheim ein explizites Inventar von Fixtures und Smoke-Skripten, die das aktuelle Verhalten definieren. Das ist nicht die gesamte Testsuite, sondern die minimale release-gated Paritaetsflaeche, die sichtbar bleiben muss, waehrend alte und neue Runtime-Pfade nebeneinander existieren."
the_machine_readable_inventory_is = "Das maschinenlesbare Inventar ist:"
