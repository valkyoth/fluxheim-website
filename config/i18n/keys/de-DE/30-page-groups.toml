cutover_releases_should_add_more_entries_before_replacing = "Cutover-Releases sollten weitere Eintraege hinzufuegen, bevor ein Subsystem ersetzt wird, nicht erst nach dem Entdecken einer Paritaetsluecke."
how_to_use = "Verwendung"
add_a_fixture_before_changing_a_runtime_boundary = "Fuege ein Fixture hinzu, bevor eine Runtime-Grenze geaendert wird."
keep_fixtures_focused_on_observable_behavior_not_implementation = "Halte Fixtures auf beobachtbares Verhalten fokussiert, nicht auf Implementierungsdetails."
prefer_local_deterministic_scripts_over_external_services_unless = "Bevorzuge lokale deterministische Skripte gegenueber externen Diensten, sofern das Feature nicht ausdruecklich eine containerisierte Abhaengigkeit benoetigt."
keep_the_inventory_target_column_aligned_with_the = "Halte die Target-Spalte des Inventars ausgerichtet auf das"
