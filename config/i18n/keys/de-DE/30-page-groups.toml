when_country_or_asn_access_rules_are_configured = "Wenn Country- oder ASN-Zugriffsregeln konfiguriert sind, prueft Fluxheim die Type-Strings der geladenen MMDB-Datenbanken und gibt eine Sicherheitswarnung aus, wenn keine geladene Datenbank die erforderliche Record-Familie bereitzustellen scheint. Das ist eine Diagnoseabsicherung, kein Ersatz fuer Tests des Policy-Verhaltens mit bekannten Source-IPs."
