retention = "Aufbewahrung"
retention_text = "Die Aufbewahrung wird durch die lokale Prometheus- und Grafana-Bereitstellung gesteuert, die für die Website betrieben wird. Die Website-Anwendung schreibt keine separate Analytics-Datenbank."
purpose_and_lawful_basis = "Zweck und Rechtsgrundlage"
gdpr_basis_text = "Zweck der Website-Telemetry sind Sicherheit, Zuverlässigkeit, Kapazitätsplanung und aggregierte Verbesserung der Dokumentation. Die vorgesehene Rechtsgrundlage ist das berechtigte Interesse am Betrieb und an der Absicherung der Website mit datenschutzminimierter Telemetry."
data_minimisation = "Datenminimierung"
gdpr_minimisation_text = "Metriken verwenden begrenzte Labels wie Locale, normalisierte Route, Bereich, Statusklasse, Download-Artefakt, GitHub-Ziel und optionalen Ländercode. Die Implementierung ist darauf ausgelegt, keine rohen IP-Adressen oder Tracking-Kennungen auf Benutzerebene zu speichern oder zu exportieren."
github_redirect_privacy_text = "Ausgehende GitHub-Klicks werden aggregiert gezählt, bevor der Browser zu GitHub weitergeleitet wird. Danach verarbeitet GitHub den Request nach den eigenen Bedingungen und der eigenen Datenschutzerklärung."
your_rights = "Ihre Rechte"
gdpr_rights_text = "Da die Website Benutzerkennungen vermeidet und nur aggregierte Telemetry speichert, können wir einen bestimmten Besucher in den Metriken normalerweise nicht identifizieren. Datenschutz- oder DSGVO-Fragen können über das Fluxheim-GitHub-Projekt geöffnet werden."
