durable_snapshots_validated_toml_configs_stored_on_disk_with_a_current_pointer = "Dauerhafte Snapshots: validierte TOML-Konfigurationen auf Disk mit einem Current-Pointer."
the_runtime_snapshot_model_means_old_requests_can_keep_using_the_config_they_started_with_while_new = "Das Runtime-Snapshot-Modell bedeutet, dass alte Requests die gestartete Konfiguration weiter nutzen koennen, waehrend neue Requests nach einem atomaren Pointer-Swap die neue Konfiguration verwenden. Der dauerhafte Snapshot-Store gibt Betreibern ein auditierbares Rollback-Ziel und der Admin-API einen anwendbaren Current-Pointer."
store_layout = "Store-Layout"
use_an_operator_chosen_state_directory_for_example = "Verwende ein vom Betreiber gewaehltes State-Verzeichnis, zum Beispiel"
current_contains_the_active_snapshot_id_fluxheim_uses_an_atomically_replaced_pointer_file_instead_of = "<code>current</code> enthaelt die aktive Snapshot-ID. Fluxheim nutzt eine atomar ersetzte Pointer-Datei statt eines Symlinks. Ein Symlink-Swap ist ein gutes reines Linux-Design, aber die Pointer-Datei haelt den Store in rootless Podman, eingeschraenkten Volume-Mounts und Nicht-Unix-Entwicklungsumgebungen einfach und nutzt weiterhin Write-temp-and-rename-Semantik."
snapshot_config_files_contain_the_validated_effective_config_written_back_as_toml_metadata_files_con = "Snapshot-Konfigurationsdateien enthalten die validierte effektive Konfiguration, wieder als TOML geschrieben. Metadatendateien enthalten Snapshot-ID, Erstellungszeit und optionale Betreiber-Nachricht. Betreiber-Nachrichten werden getrimmt und vor dem Schreiben oder Laden auf 4096 Byte Nicht-Kontrolltext begrenzt. Generierte Snapshot-IDs enthalten Unix-Zeit plus eine prozesslokale Sequenz; sie enthalten nicht die Fluxheim-Prozess-ID."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_as = "Der Store ist bei Dateisystem-Indirektion bewusst konservativ. Snapshot-IDs duerfen nur ASCII-Buchstaben, Ziffern, <code>_</code> und <code>-</code> enthalten und sind auf 128 Byte begrenzt; die Store-Root darf kein <code>..</code> enthalten und nicht unter einem symlinkten Parent-Verzeichnis liegen; die Store-Root und das <code>configs</code>-Verzeichnis muessen echte Verzeichnisse sein; das <code>configs</code>-Verzeichnis muss innerhalb des Snapshot-Stores bleiben; und <code>current</code>, Snapshot-TOML-Dateien und Metadaten-TOML-Dateien werden als regulaere Dateien geoeffnet. Symlinkte Store-Roots, Pointer, Konfigurationen, Metadaten oder <code>configs</code>-Pfade werden abgelehnt, damit ein Rollback nicht auf eine vom Betreiber nicht freigegebene Datei umgeleitet werden kann. Atomare Writes erfordern ausserdem ein bereits validiertes echtes Parent-Verzeichnis und ersetzen kein symlinktes Ziel. Snapshot-Reads sind begrenzt: <code>current</code> ist auf 4 KiB begrenzt und Snapshot-TOML-/Metadaten-Reads sind auf 16 MiB begrenzt. Snapshot-Stores sind auf 1024 Snapshots begrenzt; Betreiber sollten alte Snapshots vor diesem Limit exportieren oder bereinigen."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_2 = "Der Store ist bei Dateisystem-Indirektion bewusst konservativ. Snapshot-IDs duerfen nur ASCII-Buchstaben, Ziffern,"
and_are_limited_to_128_bytes_the_store_root_cannot_contain = "enthalten und sind auf 128 Byte begrenzt; die Store-Root darf nicht enthalten:"
or_sit_below_a_symlinked_parent_directory_the_store_root_and = "oder unter einem symlinkten Parent-Verzeichnis liegen; die Store-Root und"
