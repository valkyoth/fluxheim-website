this_is_needed_because_fluxheim_must_restore_client_identity_before_tls_and_http_handling_when_it_si = "Das ist noetig, weil Fluxheim die Client-Identitaet vor TLS- und HTTP-Handling wiederherstellen muss, wenn es hinter einem vertrauenswuerdigen Load Balancer sitzt, der PROXY-Protokoll spricht. Der v2-Parser unterstuetzt aktuell TCP4/TCP6 plus LOCAL-/UNSPEC-Frames und ueberspringt begrenzte TLV-Payloads; TLV-Interpretation ist absichtlich nicht enthalten."
removal_criteria = "Entfernungskriterien"
