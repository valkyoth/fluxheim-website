policies_apply_even_when_no_other_setting_forced_pingora_to_clone_the_rustls_client_config_in_pingor = "Policies auch gelten, wenn keine andere Einstellung Pingora gezwungen hat, die rustls-Client-Config zu klonen. In Pingora 0.8 wurde der gefaehrliche Verifier-Pfad nur installiert, wenn bereits eine geklonte Config fuer ALPN oder Upstream-mTLS existierte. Fluxheim stellt explizite Upstream-TLS-Verifikationscontrols bereit, daher muss der Connector die Config klonen und den Custom-Verifier installieren, wenn Verifikation deaktiviert oder SNI nicht vorhanden ist."
