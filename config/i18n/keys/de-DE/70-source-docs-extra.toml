paths_are_rejected_so_a_rollback_cannot_be_redirected_to_an_operator_unapproved_file_atomic_writes_a = "Pfade werden abgelehnt, damit ein Rollback nicht auf eine vom Betreiber nicht freigegebene Datei umgeleitet werden kann. Atomare Writes erfordern ausserdem ein bereits validiertes echtes Parent-Verzeichnis und ersetzen kein symlinktes Ziel. Snapshot-Reads sind begrenzt:"
