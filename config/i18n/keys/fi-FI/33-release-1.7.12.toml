r1712_released_july_15_2026 = "Julkaistu 15.7.2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Lisää valinnaisiin standardeihin perustuvan välimuistin, välityspalvelimen ja vastauskoosteen metatiedot"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Todistaa todennetun reaaliaikaisen tilannekuvan uudelleenlatauksen, palautuksen, eheyden tarkistukset ja uudelleenkäynnistyksen pysyvyyden"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Lisää toistettavat todisteet FIPS-taustajärjestelmistä ja laajan natiivin suoritusympäristön kovennuksen"
r1712_whats_next_summary = "lisää valinnaiset standardimetatiedot, todennetun tilannevedoksen palautuksen, toistettavat todisteet FIPS-taustajärjestelmistä sekä vahvemmat rajat välimuistille, TLS:lle, Wasmille, puskuroinnille ja tietovirroille."
r1712_release_series_digest = "Fluxheim 1.7 -julkaisusarja: valinnaiset standardipohjaiset välimuisti-, välityspalvelin- ja vastaustiivistemetatiedot; todennetun tilannevedoksen uudelleenlataus ja palautus; toistettavat todisteet FIPS-taustajärjestelmistä; prosessipäivitykset ilman käyttökatkoa; itsenäisesti testatut Wasm-käytäntöesimerkit; sekä vahvemmat välimuisti-, TLS-, puskurointi-, tietovirta- ja protokollarajat."
r1712_standards_based_response_metadata = "Standardeihin perustuva vastaus metatiedot"
r1712_response_metadata_intro = "Vastauksen metatiedot on oletuksena poistettu käytöstä. Ota käyttöön vain tarvitsemasi kentät; Fluxheim johtaa ne todellisesta välimuistin tuloksesta, välityspalvelimen virheestä ja lopullisista vastaustavuista paljastamatta välimuistin avaimia, taustaosoitteita, DNS-nimiä tai raakavirheitä."
r1712_field = "Kenttä"
r1712_what_it_reports = "Mitä se raportoi"
r1712_cache_status_description = "RFC 9211 välimuistin tulokset, kuten osuma, ohitus, vanhentunut edelleenlähetys, uudelleentarkistus, vanheneminen ja ohitus."
r1712_proxy_status_description = "RFC 9209 matalakardinaliteettitiedot Fluxheim:n luomista vioista."
r1712_content_digest_description = "RFC 9530 SHA-256 viimeisen HTTP-viestin sisällön pakkaamisen jälkeen."
r1712_repr_digest_description = "SHA-256 vain, kun Fluxheim sisältää koko valitun esityksen."
r1712_live_snapshots_and_rollback = "Live tilannekuvat ja palautus"
r1712_live_snapshot_intro = "Autentikoidut tilannevedokset voivat julkaista validoidun ehdokkaan, korvata toimivan reitittimen ja palauttaa ne käynnistämättä uudelleen normaaleja vain reititystä koskevia käyttöönottoja. Jokainen pyyntö pysyy yhdessä reitittimen sukupolvessa alusta loppuun."
r1712_snapshot_private_directory = "Säilytä tilannekuvavarasto erillisessä yksityisessä hakemistossa; olemassa olevat ei-yksityiset hakemistot ja tiedostojärjestelmän juuret hylätään."
r1712_snapshot_process_upgrade = "Käytä prosessin päivitystä, kun taustakuormituksen tasapainottimen kunto- tai etsintäpalvelut ovat aktiivisia."
r1712_snapshot_integrity_restart = "Suorita tilannevedoksen eheystarkistukset julkaisun tai palautuksen jälkeen ja varmista, että valittu sukupolvi kestää uudelleenkäynnistyksen."
r1712_read_snapshot_contract = "Lue koko tilannekuvasopimus"
r1712_authorization_cache_bypass = "<code>Authorization</code>- tai <code>Proxy-Authorization</code>-pyynnöt ohittavat aina jaetun välimuistin haun ja tallennustilan."
r1712_strict_cache_control = "Väärin muotoiltu tai ristiriitainen vastaus <code>Cache-Control</code>-käskyt hylätään sen sijaan, että ne palaisivat määritettyihin TTL:ihin. <code>s-maxage</code> on etusijalla <code>max-age</code>:han nähden."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> ja <code>s-maxage</code> estävät vanhentuneen uudelleenkäytön tuoreuden umpeutumisen jälkeen."
r1712_encrypted_cache_upgrade_note = "Salatun välimuistin päivityshuomautus"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 käyttää salatuille levyvälimuistiobjekteille välimuistijuureen sidottuja data- ja indeksiavaimia sekä pysyvää nonce-tilaa. Ensimmäinen käynnistys vanhemmalla salatulla juurella ja jokainen paikallisen avaimen kierto tyhjentävät välimuistin tarkoituksella ennen liikenteen vastaanottamista."
r1712_encrypted_cache_disposable = "Salatut välimuistitiedot ovat korvattavissa, eikä niitä saa käsitellä ensisijaisena tietolähteenä."
r1712_encrypted_cache_private_storage = "Anna jokaiselle välimuistin juurelle pysyvä yksityinen tallennustila, äläkä kopioi nonce-tilaa itsenäisten juurien välillä."
r1712_encrypted_cache_warmup = "Varmista, että alkuperäpalvelin kestää välimuistin ensimmäisen lämmityksen päivityksen tai avaimen kierron jälkeen."
r1712_client_certificate_revocation = "Asiakasvarmenteen peruuttaminen"
r1712_client_certificate_revocation_intro = "Kun keskinäisen TLS:n on hylättävä peruutetut asiakasvarmenteet, toimita rajoitettu PEM CRL -paketti. Fluxheim vahvistaa koko myöntäjäketjun ja hylkää vanhentuneen tai epätäydellisen CRL-käytännön."
r1712_client_certificate_revocation_compliance = "Vaadittu asiakastodennus FIPS- tai ISO-vaatimustenmukaisuustilassa edellyttää myös CRL-pakettia. Tavallinen asiakastodennus pitää peruutuksen nimenomaisena valintana."
r1712_fips_backend_evidence = "FIPS taustatodisteet"
r1712_fips_backend_evidence_intro = "Fluxheim tarjoaa erilliset, versiolukitut CI-todennusympäristöt OpenSSL-FIPS- ja rustls/AWS-LC-FIPS-profiileille. Ne rakentavat ja suorittavat täsmälleen profiilin binaarin, testaavat alavirran TLS:n ja varmenteella varmennetun ylävirran TLS:n, hylkäävät yhteensopimattomat käytännöt ja tallentavat kääntäjän, palveluntarjoajan, riippuvuuksien, binaarin ja levykuvan tunnisteet."
r1712_fips_backend_evidence_boundary = "Nämä ovat toistettavia taustajärjestelmän todisteita, eivät koko tuotteen FIPS-validointi. Pidä todennuskontit erillään tavallisista julkaisuimageista ja tarkista todisteet juuri käyttöön otettavalle koontiversiolle."
r1712_read_fips_evidence_guide = "Lue todisteiden opas FIPS"
r1712_loader_admission = "Moduulien latauksen hallinta"
r1712_loader_admission_description = "Julkisten liitännäisten manifestien on sisällettävä kiinteä SHA-256-tiiviste. Koko prosessissa käännetään samanaikaisesti enintään kaksi moduulia. Käännetyn tuloksen oletusraja on 32 MiB, eikä se saa ylittää 256 MiB."
r1712_file_identity = "Tiedoston identiteetti"
r1712_file_identity_description = "Fluxheim avaa hyväksytyt liitännäistiedostot seuraamatta linkkejä, säilyttää validoidun tavallisen tiedoston kahvan ja lukee moduulitavut kyseisestä kahvasta avaamatta polkua uudelleen."
