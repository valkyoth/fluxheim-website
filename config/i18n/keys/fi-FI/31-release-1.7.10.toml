enable_cors_only_when_browser_applications_on_known_origins_must_call_this_route = "Ota CORS käyttöön vain, kun tunnetun alkuperän selainsovellusten on kutsuttava tätä reittiä."
fluxheim_answers_valid_preflight_requests_locally_rejected_preflights_return_403_without_reaching_the_application = "Fluxheim vastaa kelvollisiin CORS-preflight-pyyntöihin paikallisesti; hylätyt preflight-pyynnöt palauttavat <code>403</code> saavuttamatta sovellusta."
do_not_combine_a_wildcard_origin_with_credentials = "Älä yhdistä jokerimerkkiä valtuustietoihin."
cors_is_not_authentication_authorization_or_csrf_protection = "CORS ei ole todennus, valtuutus tai CSRF-suojaus."
stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabiloi ajettavia Wasm-migraatioesimerkkejä ja vapautusporttitestausta; lisää valinnaiset HTTP-vastaussuojausprofiilit, validoidun pyyntötietoisen CORS:n, rajoitetun uudelleenyritysopastuksen, tiukemman edelleenlähetyksen ja identiteetin otsikon puhdistamisen sekä turvallisemman otsikon jäsentämisen ja uudelleenkirjoituksen."
