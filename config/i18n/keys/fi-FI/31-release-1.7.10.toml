released_july_13_2026 = "Julkaistu 13.7.2026"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Lisää valinnaisia HTTP-vastausturvaprofiileja ja validoituja pyyntötietoisia CORS-profiileja"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Stabiloi suoritettavat Wasm-käytäntöesimerkit ja julkaisuportin edellyttämät testit"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Vahvistaa edelleen lähetettyjä identiteettiotsikoita, otsikon jäsentämistä ja uudelleenyritysohjeita kapasiteettirajoitusten selvittämiseksi"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "stabiloi Wasm-siirtoesimerkit ja lisää valinnaisen HTTP-vastaussuojauksen, pyyntötietoisen CORS:n ja tiukemmat edelleenlähetys- ja otsikkorajat."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Fluxheim 1.7 -julkaisusarja: itsenäisesti testattuja siirtoesimerkkejä, rajoitetut isäntäpuhelut, valinnaiset HTTP-vastaussuojausprofiilit, validoitu pyyntötietoinen CORS, tiukempi edelleenlähetetty identiteetin käsittely ja vahvemmat rajat Wasmille, ACME:lle, tilannekuville, GeoIP:lle, streameille, TLS:lle, PHP-FPM:lle ja staattiselle palvelimelle."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 tekee jokaisesta siirtoperheestä itsenäisesti testattavan, pitää täydellisen Wasm-savutestin vapautusportissa ja varmistaa, että vieraiden ohjaamat symboliset tunnukset hylätään turvallisesti. Prosessin sisäiset isäntäpuhelut rajoittuvat rajallisiin, ei-estäviin toimintoihin."
wasm_host_callbacks = "Wasm-isännän takaisinsoittoja"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "Takaisinkutsut rajoittuvat rajalliseen symboliseen dekoodaukseen, rajoitettuun kontekstin lukemiseen ja rajoitettuun tilaan. He eivät voi suorittaa tiedosto-, verkko-, IPC-, lepotila-, prosessi- tai kolmannen osapuolen takaisinsoittotyötä."
release_testing = "Julkaisutestaus"
each_migration_family_can_run_independently_while_the_release_gate_also_runs_the_complete_smoke_test_and_an_arbitrary_guest_id_decoder_property_test = "Jokainen siirtoperhe voi toimia itsenäisesti, kun taas vapautusportti suorittaa myös täydellisen savutestin ja mielivaltaisen vierastunnuksen dekooderin ominaisuustestin."
http_response_security = "HTTP-vastauksen suojaus"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "HTTP-vastausturvaprofiilit ovat valinnaisia. Aloita sanalla <code>baseline</code>; käytä eri lähteiden eristämistä vasta sen jälkeen, kun olet testannut jokaisen skriptin, kirjasimen, kuvan, kirjautumiskulun ja upotetun resurssin."
profile = "Profiili"
what_it_does = "Mitä se tekee"
keeps_the_opt_in_hardening_headers_disabled = "Pitää valinnaiset karkaisuotsikot pois käytöstä."
adds_conservative_browser_isolation_and_resource_policy_defaults_suitable_for_most_sites = "Lisää konservatiivisen selaimen eristyksen ja resurssipolitiikan oletusasetukset, jotka sopivat useimmille sivustoille."
enables_strict_cross_origin_isolation_for_applications_that_have_tested_every_external_dependency = "Mahdollistaa tiukan lähteiden välisen eristyksen sovelluksille, jotka ovat testanneet kaikki ulkoiset riippuvuudet."
neither_profile_enables_hsts_or_csp_configure_those_separately_after_testing_them_against_the_real_site = "Kumpikaan profiili ei ota käyttöön HSTS:ää tai CSP:tä. Määritä ne erikseen testattuasi niitä todellisessa sivustossa."
