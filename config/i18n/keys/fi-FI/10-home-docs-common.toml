features_heading = "Kaikki mitä tarvitset edgessä"
features_intro = "Fluxheim toimitetaan kohdennettuina, modulaarisina build-versioina - käytä vain sitä mitä käyttöönotto tarvitsee."
memory_safe_by_design = "Suunnittelultaan muistiturvallinen"
memory_safe_by_design_text = "Kirjoitettu Rustilla ja lukitulla vakaalla työkaluketjulla. Ei puskuriylivuotoja, ei use-after-free-virheitä eikä datakilpailuja rakenteen vuoksi."
fluxheim_http_core = "Fluxheim HTTP -ydin"
fluxheim_http_core_text = "Rust-native edge-runtime, jossa on connection pooling, upstream retries, aktiiviset health checkit, HTTP/2, WebSocket-päivitykset ja gRPC pass-through."
load_balancer_control_plane = "Load balancer control plane"
load_balancer_control_plane_text = "Kohdennettu 1.5 load-balancer-binaari ja image, jossa on edistynyt valinta, paikallinen pysyvyys, health/ejection policy, rajatut jonot ja runtime member controls."
modular_build_profiles = "Modulaariset build-profiilit"
modular_build_profiles_text = "Käännä vain tarvitsemasi osat. Kohdennetut profiilit staattisille sivustoille, cache edgelle, reverse proxylle, load balancingille, TCP stream proxyingille, PHP-FPM:lle, GeoIP:lle, traffic mirroringille ja tuotantopaketeille, joissa on pakkaus."
tls_managed_acme = "TLS ja hallittu ACME"
tls_managed_acme_text = "rustls ensin, tuetut OpenSSL- ja FIPS/ISO proof -build-polut, client certificate auth, upstream mTLS, automaattinen ACME-julkaisu ja multi-cert SNI."
advanced_cache_system = "Edistynyt välimuistijärjestelmä"
advanced_cache_system_text = "Muisti-, levy-, tiered- ja salatut cache-backendit, cache-turvallinen gzip-, Zstandard- ja Brotli-pakkaus sekä range caching suurille objekteille."
container_native = "Konttinatiivi"
container_native_text = "Rootless Podman -imaget Wolfille, Alpinelle, SUSE Microlle ja Debianille. Systemd/RPM native-käyttöönottoihin. Ei ulkoisia assetteja käynnistyksessä."
