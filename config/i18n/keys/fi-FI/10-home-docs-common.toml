data_minimisation = "Tietojen minimointi"
gdpr_minimisation_text = "Mittarit käyttävät rajattuja label-arvoja, kuten locale, normalisoitu reitti, osio, statusluokka, latausartefakti, GitHub-kohde ja valinnainen maakoodi. Toteutus on suunniteltu niin, ettei se tallenna tai vie raakoja IP-osoitteita tai käyttäjätason seurantatunnisteita."
github_redirect_privacy_text = "GitHubiin lähtevät klikkaukset lasketaan aggregoidusti ennen selaimen uudelleenohjausta GitHubiin. GitHub käsittelee requestin tämän jälkeen omien ehtojensa ja tietosuojakäytäntönsä mukaan."
your_rights = "Oikeutesi"
gdpr_rights_text = "Koska sivusto välttää käyttäjätunnisteita ja tallentaa vain aggregoitua telemetriaa, emme normaalisti voi tunnistaa tiettyä kävijää mittareista. Tietosuoja- tai GDPR-kysymykset voi avata Fluxheim GitHub -projektin kautta."
