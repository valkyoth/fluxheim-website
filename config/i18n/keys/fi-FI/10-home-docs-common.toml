edge_policy_controls = "Edge policy -kontrollit"
edge_policy_controls_text = "Trusted-proxy-aware ACL:t, rate limitit, auth subrequestit, traffic mirroring, regex rewrites, rajatut jonot, tiukka config-validointi ja kovennettu request-käsittely."
