prometheus_opentelemetry_text = "Valinnainen Prometheus metrics listener, OTLP metrics export, trace context propagation ja OTLP trace export täyteen observabilityyn."
geo_context_text = "Valinnaiset paikalliset MMDB-haut maa- ja ASN-policyille MaxMind GeoIP2/GeoLite2- tai CIRCL Geo Open -dataseteillä. Ei etähakua tai downloaderia request-polulla."
tcp_stream_proxy = "TCP stream proxy"
tcp_stream_proxy_text = "Raaka L4 TCP -palvelu omilla stream routeilla, todellisilla idle-/lifetime-/byte-rajoilla, upstream TLS/mTLS -kontrolleilla, weighted/drain/backup policylla ja route-local PROXY protocolilla."
php_fpm_support = "PHP-FPM-tuki"
