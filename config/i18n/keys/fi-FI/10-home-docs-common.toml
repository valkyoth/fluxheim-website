retention = "Säilytysaika"
retention_text = "Säilytysaikaa hallitsee sivustolle operoitu paikallinen Prometheus- ja Grafana-käyttöönotto. Verkkosovellus ei kirjoita erillistä analytiikkatietokantaa."
