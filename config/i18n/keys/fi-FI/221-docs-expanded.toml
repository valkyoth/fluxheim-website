fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 pitää Wasmin valinnaisena ja lisää rajatut native HTTP/1 route-decision-hookit access-decision- ja header-hookien rinnalle. Pluginit voivat jatkaa, estää tai valita määritettyjä canary- ja mirror-reittihaaroja, mutta ne eivät edelleenkään voi keksiä upstreameja, ohittaa reittimätsäystä, yliajaa Fluxheimin access policya tai saada raakoja headereita, bodyja, tiedostojärjestelmäpääsyä, verkkopääsyä, private key -avaimia tai admin-API:eja."
route_decisions = "Reittipäätökset"
route_decision_hooks_can_continue_deny_or_select_only_configured_matching_canary_and_mirror_route_branches = "<code>route-decision</code>-hookit voivat vain jatkaa, estää tai valita määritettyjä mätsääviä <code>canary</code>- ja <code>mirror</code>-reittihaaroja."
selected_route_policy = "Valitun reitin policy"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "Valitun reitin ACL:t, rate limitit, concurrency limitit, body limitit, redirectit ja header-policy suoritetaan edelleen Wasm-reittipäätöksen jälkeen."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 pitää Wasmin valinnaisena ja lisää rajatut native HTTP/1 cache-policy hooks access-decision-, header- ja route-decision-hooksien rinnalle. Plugin-t voivat jatkaa tavallista cache-käyttäytymistä, välittää origin-palveluun, ohittaa cachen, ohittaa tallennuksen tai hylätä, mutta eivät voi muuttaa raakoja cache keys -arvoja, TTL:iä, tags-arvoja, response headers -arvoja tai tallennettua metadataa eivätkä vastaanottaa raakoja headereita, bodyja, tiedostojärjestelmäpääsyä, verkkopääsyä, yksityisiä avaimia tai admin APIs -rajapintoja."
cache_decisions = "Cache-päätökset"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hooks voivat tehdä continue, pass, bypass tai deny. <code>cache-store</code> hooks voivat tehdä continue, skip storage tai deny ennen memory/disk cache -kirjoituksia."
cache_policy_limits = "Cache-policy-rajat"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hooks käyttävät erillistä prosessinlaajuista hyväksyntäkattoa, jotta kuumat cache-policy route -polut eivät vie resursseja access-, route- tai header-hookeilta."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 pitää Wasmin valinnaisena ja laajentaa rajattuja native HTTP/1 cache-policy hookeja access-decision-, header- ja route-decision-hookien rinnalla. Pluginit voivat jatkaa normaalia cache-käyttäytymistä, päästää pyynnön originille, ohittaa cachen, ohittaa tallennuksen, hylätä, valita kiinteitä mobile/desktop cache key -variantteja sekä liittää kiinteän cache-store TTL:n, tagin ja tallennetut header-metatiedot, mutta ne eivät edelleenkään voi tuottaa mielivaltaisia cache key -tavuja, mielivaltaisia TTL-arvoja, mielivaltaisia tageja, raakoja response headereita, bodyja, tiedostojärjestelmäpääsyä, verkkopääsyä, yksityisiä avaimia tai admin APIs -rajapintoja."
cache_metadata = "Cache-metatiedot"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code>-hookit lisäävät kiinteitä mobile/desktop cache key -variantteja. <code>cache-store</code>-hookit asettavat kiinteän TTL:n, tagin ja tallennetut header-metatiedot."
module_identity = "Moduulin identiteetti"
fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 pitää Wasmin valinnaisena ja lisää ensimmäisen valinnaisen Proxy-Wasm ABI -yhteensopivuusesikatselun. Se luo erillisen, ominaisuusportilla suojatun isäntäkutsujen nimiavaruuden, jossa manifesti validoidaan tiukasti ja kutsut, joita ei tueta, käsitellään deterministisesti suljetusti epäonnistuen; tämä ei tarkoita, että mitkä tahansa nykyiset Proxy-Wasm-liitännäiset toimisivat muuttamattomina."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Käännetyt moduulit sidotaan liitännäisen tiivisteeseen, ABI-versioon, koukkujen ominaisuuspintaan, isäntäkutsujen nimiavaruuteen ja Fluxheim-versioon, jotta tuleva uudelleenkäyttö ei voi ylittää julkaisu-, ominaisuus- tai ABI-rajoja."
proxy_wasm_preview = "Proxy-Wasm-esikatselu"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Käännä <code>wasm-proxy-abi</code>-ominaisuudella, ota <code>allow_preview_abi</code> käyttöön ja määritä sekä <code>proxy-wasm-preview</code>-ABI että isäntäkutsujen nimiavaruus. Tuemattomat tuonnit ja kutsut hylätään turvallisesti."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Ota usean vuokraajan ympäristöissä käyttöön <code>[server.host_routing].strict = true</code>, jolloin puuttuva tai virheellinen isäntätunniste palauttaa <code>400</code> ja tuntematon isäntä <code>421</code> oletussivustolle siirtymisen sijasta."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Pidä määritystiedostot ja kaikki olemassa olevat ylemmät hakemistot luotettujen omistajien hallinnassa, eikä ryhmällä tai muilla käyttäjillä saa olla niihin kirjoitusoikeutta."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Korvaa prosessi, kun TLS:n, kuuntelijoiden, virtojen, UDP:n, ACME:n, välimuistin tyhjennyksen, jäljityksen tai hallittujen PHP-FPM-prosessien asetukset muuttuvat; tavallinen reititys ja pyyntöaikainen käytäntö voidaan päivittää tilannevedoksen uudelleenlatauksella."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Pysyvä kirjoitettava taltio, joka on mitoitettu välimuistikäytännön mukaan. Anna jokaiselle storage-bin-replikalle oma paikallinen tai RWO-taltio; käytä jaettua RWX-tallennustilaa vain, kun solmujen välinen lukitus on varmennettu ja orkestrointi pakottaa yhden kirjoittajan käytön."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Käytä yhtä storage-bin-juurihakemistoa kutakin käynnissä olevaa Fluxheim-prosessia kohti; omistajuus käyttää neuvoa-antavaa tiedostojärjestelmälukkoa, ja jaetut usean kirjoittajan juuret ovat vaarallisia ilman varmennettua ulkoista lukitusta."
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Process-wide-, cache-global-, cache-vhost-, per-plugin- ja per-attachment-suorituskatot estävät rajaamattoman plugin-työn."
