pingora_free_normal_builds = "Pingora-free normaalit rakenteet"
starting_with_1_6_34_normal_fluxheim_release_profiles_use_the_fluxheim_owned_native_runtime_and_no_longer_compile_pingora_crates = "Alkaen versiosta 1.6.34, normaali Fluxheim release profiles käyttää alkuperäistä Fluxheim-owned runtime:ää eikä enää käännä Pingora crates."
unsupported_native_runtime_shapes_still_fail_closed_with_explicit_blockers_instead_of_falling_back_to_legacy_adapters = "Tukemattomia alkuperäisiä runtime-muotoja ei edelleenkään pystytä sulkemaan eksplisiittisillä estäjillä sen sijaan, että palaisivat takaisin vanhoihin adapter-muotoihin."
for_non_loopback_plaintext_peer_fill_urls_configure_cache_peer_fill_shared_secret_file_so_peer_responses_are_signed_before_they_can_be_stored = "Jos kyseessä on non-loopback-plaintext peer-fill URLs, määritä <code>cache.peer_fill.shared_secret_file</code> niin, että vertaisvastaukset allekirjoitetaan ennen kuin ne voidaan tallentaa."
version_1_6_36_removes_more_temporary_compatibility_code_the_native_proxy_boundary_now_uses_direct_crate_owned_apis_and_dead_pingora_era_root_adapters_are_gone_from_normal_source_paths = "Versio 1.6.36 poistaa lisää väliaikaista yhteensopivuuskoodia. Native proxyn rajapinta käyttää nyt suoraan cratejen omia API-rajapintoja, eikä käytöstä poistettuja Pingora-aikakauden juurisovitteita enää ole normaaleissa lähdekoodipoluissa."
version_1_6_36_pins_the_prometheus_and_jaeger_smoke_test_images_to_stable_tags_so_local_and_ci_observability_checks_pull_deterministic_containers = "Versio 1.6.36 kiinnittää Prometheus- ja Jaeger-smoke-testikuvat vakaisiin tunnisteisiin, jotta paikalliset ja CI:n observability-tarkistukset noutavat deterministiset kontit."
fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 pitää Wasmin valinnaisena ja lisää ensimmäisen rajatun natiivin HTTP/1-hook-perheen request- ja response-headereille. Plugin voi tehdä hyväksyttyjä synteettisiä policy-muutoksia, mutta se ei edelleenkään saa raakoja headereita, bodyja, tiedostojärjestelmän käyttöä, verkkokäyttöä, yksityisiä avaimia tai admin-API:eja."
