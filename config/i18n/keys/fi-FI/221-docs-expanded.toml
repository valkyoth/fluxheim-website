live_native_http_1_access_decision_hooks_use_priority_ordering_first_deny_wins_composition_and_fail_closed_behaviour = "Live natiivit HTTP/1 access-decision -hookit käyttävät prioriteettijärjestystä, first-deny-wins-koostamista ja fail-closed-toimintaa."
request_headers_and_response_headers_hooks_can_set_or_remove_only_allow_listed_synthetic_headers_such_as_the_policy_tier_example = "<code>request-headers</code>- ja <code>response-headers</code>-hookit voivat asettaa tai poistaa vain sallittuja synteettisiä headereita, kuten policy-tier-esimerkissä."
