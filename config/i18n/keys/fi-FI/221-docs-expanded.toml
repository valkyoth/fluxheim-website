plugin_files_must_be_absolute_regular_files_below_approved_roots_without_symlinked_files_or_parent_paths = "Pluginfiler måste vara absoluta, reguljära filer under godkända rötter, utan symlinkade filer eller överordnade sökvägar."
bounded_execution = "Begränsad körning"
fuel_memory_table_instance_compile_timeout_compile_worker_and_per_call_watchdog_limits_keep_the_sandbox_bounded = "Gränser för fuel, minne, tabell, instans, kompilerings-timeout, kompileringsarbetare och watchdog per anrop håller sandboxen begränsad."
