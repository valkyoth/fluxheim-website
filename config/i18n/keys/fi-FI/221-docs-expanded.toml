version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Versio 1.6.37 on viimeinen crate-rajojen siivous ennen Wasmia: ACME, observability, cache, load-balancer, PHP-FPM ja native-runtime-sisäosat siirtyvät pienempiin crate-omisteisiin moduuleihin, ja runtime-käyttäytyminen pysyy vakaana."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Versio 1.6.37 tekee paikallisesta observability-smokesta luotettavamman yrittämällä kertakäyttöisten Prometheus- ja Jaeger-käynnistysten uudelleenajoa uusilla porteilla, kun host-network-portit kilpailevat muiden runner-prosessien kanssa."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "Från 1.7.0 lägger Fluxheim till en valfri Wasm-sandboxgrund. Den är avstängd som standard, inkompatibel med privacy-mode och bevisar för närvarande säker pluginladdning plus begränsad körning innan request/response-policyhooks exponeras."
starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation = "Från 1.7.0 lägger Fluxheim till en valfri Wasm-sandboxgrund."
optional_webassembly_sandbox_foundation_for_future_policy_extensions_disabled_by_default = "Valfri WebAssembly-sandboxgrund för framtida policyutbyggnader; avstängd som standard."
privacy_builds_do_not_include_cache_metrics_tracing_otlp_export_or_wasm_features = "Privacy-buildit eivät sisällä cache-, metrics-, tracing-, OTLP export- tai Wasm-ominaisuuksia."
fluxheim_1_7_0_starts_the_optional_wasm_sandbox_foundation_it_proves_approved_root_plugin_loading_manifest_validation_and_bounded_wasmtime_execution_request_response_hooks_are_still_staged_for_later_1_7_x_releases = "Fluxheim 1.7.0 startar den valfria WASM-sandboxgrunden. Den bevisar pluginladdning från godkända rötter, manifestvalidering och begränsad Wasmtime-körning. Request/response-hooks ligger kvar för senare 1.7.x-versioner."
default_and_privacy_builds_do_not_compile_wasm_features = "Oletus- ja privacy-koonnokset eivät käännä Wasm-toimintoja."
