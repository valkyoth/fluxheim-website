[home]
meta_description = "Fluxheim es un servidor web, reverse proxy y servidor de caché modular de alto rendimiento construido en Rust."
meta_description_secure = "Fluxheim es un servidor web, reverse proxy y servidor de caché modular de alto rendimiento. Escrito en Rust. Seguro por defecto."
meta_description_short = "Un servidor edge y reverse proxy seguro para memoria construido en Rust."
hero_memory_safe = "Seguro para memoria"
hero_edge_server = "Servidor edge"
hero_built_in_rust = "Construido en Rust"
hero_line_one = "Reverse proxy modular, caché, balanceador de carga y host estático escrito"
hero_line_two = "en Rust. Seguro por defecto con TLS, ACME, compresión, política edge,"
hero_line_three = "dynamic upstream discovery y mirroring seguro de tráfico integrados."
tag_fluxheim_core = "Núcleo de Fluxheim"
tag_rootless_containers = "Contenedores rootless"
features_heading = "Todo lo que necesitas en el edge"
features_intro = "Fluxheim se entrega como builds enfocados y modulares: usa solo lo que necesita tu despliegue."
memory_safe_by_design = "Seguro para memoria por diseño"
memory_safe_by_design_text = "Escrito en Rust con una toolchain estable fijada. Sin buffer overflows, sin use-after-free y sin data races por construcción."
fluxheim_http_core = "Núcleo HTTP de Fluxheim"
fluxheim_http_core_text = "Un runtime edge nativo en Rust con connection pooling, upstream retries, active health checks, HTTP/2, WebSocket upgrades y gRPC pass-through."
load_balancer_control_plane = "Plano de control del balanceador"
load_balancer_control_plane_text = "Binario e imagen load-balancer 1.5 enfocados con selección avanzada, persistencia local, política health/ejection, colas acotadas y controles de miembros en runtime."
modular_build_profiles = "Perfiles de build modulares"
modular_build_profiles_text = "Compila solo lo que necesitas. Perfiles enfocados para static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring y bundles de producción con compresión."
tls_managed_acme = "TLS y ACME gestionado"
tls_managed_acme_text = "rustls-first con rutas de build OpenSSL y FIPS/ISO compatibles, client certificate auth, upstream mTLS, emisión ACME automática y SNI multi-cert."
advanced_cache_system = "Sistema de caché avanzado"
advanced_cache_system_text = "Backends de caché en memoria, disco, tiered y cifrados con compresión gzip, Zstandard y Brotli segura para caché, además de range caching para objetos grandes."
container_native = "Nativo para contenedores"
container_native_text = "Imágenes Podman rootless para Wolfi, Alpine, SUSE Micro y Debian. Systemd/RPM para despliegues nativos. Cero assets externos al arrancar."
prometheus_opentelemetry = "Prometheus y OpenTelemetry"
prometheus_opentelemetry_text = "Listener opcional de métricas Prometheus, exportación OTLP de métricas, propagación de trace context y exportación OTLP de traces para observability completa."
geo_context_text = "Consultas MMDB locales opcionales para políticas de país y ASN usando MaxMind GeoIP2/GeoLite2 o datasets CIRCL Geo Open. Sin consulta remota ni downloader en el request path."
tcp_stream_proxy = "TCP stream proxy"
tcp_stream_proxy_text = "Servicios TCP L4 raw con stream routes dedicadas, límites reales idle/lifetime/byte, controles upstream TLS/mTLS, política weighted/drain/backup y PROXY protocol local a la ruta."
php_fpm_support = "Soporte PHP-FPM"
php_fpm_support_text = "Puente PHP-FPM FastCGI opcional para aplicaciones front-controller estilo WordPress. Resolución estricta de scripts y manejo acotado de requests."
edge_policy_controls = "Controles de política edge"
edge_policy_controls_text = "ACLs aware de trusted proxy, rate limits, auth subrequests, traffic mirroring, regex rewrites, colas acotadas, validación estricta de config y request handling endurecido."
