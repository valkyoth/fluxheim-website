cookie_notice = "Aviso de cookies"
gdpr_information = "Información RGPD"
last_updated_june_23_2026 = "Última actualización: 23 de junio de 2026"
no_analytics_cookies = "Sin cookies de analytics"
no_analytics_cookies_text = "El sitio web de Fluxheim no usa cookies de analytics, cookies publicitarias, fingerprinting, identificadores de local storage ni scripts de analytics de terceros."
language_selector_cookie_text = "El selector de idioma usa enlaces normales y no necesita cookie. Si un despliegue futuro añade una cookie estrictamente necesaria, este aviso debe actualizarse antes de activar ese cambio."
aggregate_observability = "Observabilidad agregada"
aggregate_observability_text = "Recopilamos eventos first-party agregados de observability para contar visitas, uso de idiomas, secciones de página, descargas, redirects a GitHub, latencia de request y tiempo visible aproximado en página."
events_no_sensitive_text = "Estos eventos no contienen IPs raw, identificadores de usuario, valores de cookies, fingerprints de navegador, request bodies, authorization headers ni query strings completas."
what_we_collect = "Qué recopilamos"
privacy_collect_text = "El sitio registra métricas operativas agregadas: request counts, page views, idioma seleccionado, ruta normalizada, sección, clase de estado HTTP, duración de request, clicks de descarga, clicks de redirect a GitHub y tiempo visible aproximado."
country_aggregation_text = "El operador puede activar agregación opcional por país. Cuando está activa, el servidor deriva un código de país en memoria y solo exporta el código de país o unknown."
what_we_do_not_collect = "Qué no recopilamos"
privacy_do_not_collect_text = "No exportamos IPs raw, identificadores por usuario, analytics cookies, fingerprints de navegador, user agents completos, referrer URLs, request bodies, authorization headers, cookie headers ni query strings completas."
telemetry_use_text = "La telemetry se usa para operar el sitio, entender el uso agregado de documentación y descargas y detectar problemas de fiabilidad. No se usa para crear perfiles de visitantes individuales."
retention = "Retención"
retention_text = "La retención la controla el despliegue local de Prometheus y Grafana operado para el sitio. La aplicación web no escribe una base de datos de analytics separada."
purpose_and_lawful_basis = "Finalidad y base jurídica"
gdpr_basis_text = "La finalidad de la telemetry del sitio es seguridad, fiabilidad, planificación de capacidad y mejora agregada de la documentación. La base jurídica prevista es el interés legítimo en operar y proteger el sitio con telemetry minimizada para privacidad."
data_minimisation = "Minimización de datos"
gdpr_minimisation_text = "Las métricas usan labels acotados como locale, ruta normalizada, sección, clase de estado, artifact de descarga, target de GitHub y código de país opcional. La implementación está diseñada para no almacenar ni exportar IPs raw ni identificadores de tracking a nivel de usuario."
github_redirect_privacy_text = "Los clicks salientes a GitHub se cuentan de forma agregada antes de redirigir el navegador a GitHub. GitHub procesa después el request según sus propios términos y política de privacidad."
your_rights = "Tus derechos"
gdpr_rights_text = "Como el sitio evita identificadores de usuario y solo almacena telemetry agregada, normalmente no podemos identificar a un visitante concreto dentro de las métricas. Las preguntas de privacidad o RGPD pueden abrirse mediante el proyecto Fluxheim en GitHub."
translation_notice = "Aviso sobre traducciones"
translation_notice_text = "Las traducciones del sitio web están asistidas por IA y se mantienen con el mejor esfuerzo posible. Las correcciones y traducciones mejoradas son bienvenidas en las <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">claves i18n del sitio web de Fluxheim</a>."
