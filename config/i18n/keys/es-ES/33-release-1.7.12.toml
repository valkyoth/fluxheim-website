r1712_released_july_15_2026 = "Publicado el 15 de julio de 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Agrega metadatos de resumen de respuesta, proxy y caché basados en estándares opcionales"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Prueba la recarga, reversión, verificaciones de integridad y persistencia de reinicio de instantáneas en vivo autenticadas"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Agrega evidencia FIPS-backend reproducible y un amplio refuerzo del tiempo de ejecución nativo"
r1712_whats_next_summary = "agrega metadatos de estándares opcionales, prueba de reversión de instantáneas autenticadas, evidencia reproducible FIPS-backend y caché más sólida, TLS, Wasm, almacenamiento en búfer y límites de transmisión."
r1712_release_series_digest = "Serie de versiones Fluxheim 1.7: caché basada en estándares opcionales, proxy y metadatos de resumen de respuesta; recarga y reversión de instantáneas en vivo autenticadas; evidencia reproducible FIPS-backend; actualizaciones de procesos sin tiempo de inactividad; ejemplos de políticas Wasm probados de forma independiente; y caché más fuerte, TLS, almacenamiento en búfer, flujo y límites de protocolo."
r1712_standards_based_response_metadata = "Metadatos de respuesta basados en estándares"
r1712_response_metadata_intro = "Los metadatos de respuesta están deshabilitados de forma predeterminada. Habilite sólo los campos que necesite; Fluxheim los deriva del resultado de la caché real, la falla del proxy y los bytes de respuesta final sin exponer claves de caché, direcciones de backend, nombres DNS o errores sin formato."
r1712_field = "campo"
r1712_what_it_reports = "lo que informa"
r1712_cache_status_description = "Resultados de caché RFC 9211 como acierto, error, reenvío obsoleto, revalidación, caducidad y omisión."
r1712_proxy_status_description = "RFC 9209 detalles de baja cardinalidad para fallas generadas por Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 sobre el contenido final del mensaje HTTP después de la compresión."
r1712_repr_digest_description = "SHA-256 solo cuando Fluxheim contiene la representación seleccionada completa."
r1712_live_snapshots_and_rollback = "Instantáneas en vivo y reversión"
r1712_live_snapshot_intro = "Las instantáneas autenticadas pueden publicar un candidato validado, reemplazar el enrutador activo y revertir sin reiniciar las implementaciones normales de solo enrutamiento. Cada solicitud permanece en una generación de enrutadores de principio a fin."
r1712_snapshot_private_directory = "Mantenga el almacén de instantáneas en un directorio privado dedicado; Se rechazan los directorios no privados existentes y las raíces del sistema de archivos."
r1712_snapshot_process_upgrade = "Utilice una actualización de proceso cuando los servicios de descubrimiento o estado del balanceador de carga en segundo plano estén activos."
r1712_snapshot_integrity_restart = "Ejecute comprobaciones de integridad de instantáneas después de la publicación o reversión y verifique que la generación seleccionada sobreviva al reinicio."
r1712_read_snapshot_contract = "Lea el contrato instantáneo completo"
r1712_authorization_cache_bypass = "Las solicitudes que llevan <code>Authorization</code> o <code>Proxy-Authorization</code> siempre omiten la búsqueda y el almacenamiento en caché compartido."
r1712_strict_cache_control = "Las directivas <code>Cache-Control</code> de respuesta con formato incorrecto o conflictivo se rechazan en lugar de recurrir a los TTL configurados; <code>s-maxage</code> tiene prioridad sobre <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> y <code>s-maxage</code> prohíben la reutilización obsoleta una vez que caduque la frescura."
r1712_encrypted_cache_upgrade_note = "Nota de actualización de caché cifrada"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 mueve objetos de caché de disco cifrados a datos vinculados a raíz y claves de índice con estado nonce duradero. El primer inicio contra una raíz cifrada más antigua y cada rotación de clave local purgan intencionalmente en frío ese caché antes de atender el tráfico."
r1712_encrypted_cache_disposable = "Trate la caché cifrada como una aceleración desechable, no como la fuente de registro."
r1712_encrypted_cache_private_storage = "Proporcione a cada raíz de caché almacenamiento privado persistente y no copie el estado nonce entre raíces independientes."
r1712_encrypted_cache_warmup = "Planifique la capacidad de origen para el primer calentamiento después de actualizar o rotar claves."
r1712_client_certificate_revocation = "Revocación del certificado de cliente"
r1712_client_certificate_revocation_intro = "Cuando TLS mutuo deba rechazar certificados de cliente revocados, proporcione un paquete PEM CRL limitado. Fluxheim valida la cadena de emisores completa y rechaza la política CRL vencida o incompleta."
r1712_client_certificate_revocation_compliance = "La autenticación de cliente requerida en un modo de cumplimiento requerido por FIPS o ISO también requiere un paquete CRL. La autenticación ordinaria del cliente mantiene la revocación como una opción explícita."
r1712_fips_backend_evidence = "FIPS evidencia de fondo"
r1712_fips_backend_evidence_intro = "Fluxheim proporciona entornos de prueba CI fijados por separado para los perfiles OpenSSL-FIPS y rustls/AWS-LC-FIPS. Crean y ejecutan el perfil binario exacto, ejercitan el TLS descendente y ascendente verificado con certificado, rechazan políticas incompatibles y registran las identidades del compilador, proveedor, dependencia, binario e imagen."
r1712_fips_backend_evidence_boundary = "Esta es una evidencia de backend reproducible, no una validación FIPS a nivel de producto. Mantenga los contenedores de prueba separados de las imágenes de lanzamiento normales y revise la evidencia para determinar la compilación exacta que implementa."
r1712_read_fips_evidence_guide = "Lea la guía de evidencia FIPS"
r1712_loader_admission = "Controles de carga de módulos"
r1712_loader_admission_description = "Los manifiestos públicos de complementos deben incluir un resumen SHA-256 fijo. En todo el proceso se compilan como máximo dos módulos a la vez. La salida compilada tiene un límite predeterminado de 32 MiB y no puede superar los 256 MiB."
r1712_file_identity = "Identidad del archivo"
r1712_file_identity_description = "Fluxheim abre archivos de complemento aprobados sin seguir enlaces, conserva el identificador de archivo normal validado y lee bytes de módulo de ese identificador sin volver a abrir la ruta."
