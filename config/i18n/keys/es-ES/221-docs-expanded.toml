version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "La versión 1.6.37 es la limpieza final de límites de crates antes de Wasm: ACME, observabilidad, caché, load-balancer, PHP-FPM e internos del runtime nativo pasan a módulos más pequeños propiedad de sus crates, manteniendo estable el comportamiento del runtime."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "La versión 1.6.37 hace más fiable el smoke local de observabilidad reintentando arranques desechables de Prometheus y Jaeger con puertos recién asignados cuando los puertos host-network compiten con otros procesos runner."

