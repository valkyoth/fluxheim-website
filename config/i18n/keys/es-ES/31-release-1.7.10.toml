stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Estabiliza los ejemplos ejecutables de migración de Wasm y las pruebas de liberación; agrega perfiles de seguridad de respuesta HTTP opcionales, CORS validado que reconoce solicitudes, guía de reintento limitada, reenvío y desinfección de encabezados de identidad más estrictos, y análisis y reescritura de encabezados más seguros."
