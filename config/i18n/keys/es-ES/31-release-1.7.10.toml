released_july_13_2026 = "Publicado el 13 de julio de 2026"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Agrega perfiles de seguridad de respuesta HTTP opcionales y CORS validado que reconoce solicitudes"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Estabiliza los ejemplos de políticas ejecutables de Wasm y las pruebas requeridas por la puerta de lanzamiento."
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Fortalece los encabezados de identidad reenviados, el análisis de encabezados y la guía de reintento para límites de capacidad."
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "estabiliza los ejemplos de migración de Wasm y agrega seguridad de respuesta HTTP opcional, CORS con reconocimiento de solicitudes y límites de encabezado y reenvío más estrictos."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Serie de lanzamientos Fluxheim 1.7: ejemplos de migración probados de forma independiente, devoluciones de llamadas de host limitadas, perfiles de seguridad de respuesta HTTP opcionales, CORS validado con reconocimiento de solicitudes, manejo de identidades reenviadas más estricto y límites más estrictos para Wasm, ACME, instantáneas, GeoIP, transmisiones, TLS, PHP-FPM y servicio de archivos estáticos."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 hace que cada familia migratoria sea comprobable de forma independiente, mantiene la prueba de humo Wasm completa en la puerta de salida y verifica que las identificaciones simbólicas controladas por invitados se rechacen de forma segura. Las devoluciones de llamadas del host en proceso siguen limitadas a operaciones finitas y sin bloqueo."
wasm_host_callbacks = "Devoluciones de llamada del host de Wasm"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "Las devoluciones de llamada se limitan a decodificación simbólica finita, lecturas de contexto acotadas y estados acotados. No pueden realizar trabajos de archivos, redes, IPC, suspensión, procesos o devolución de llamadas de terceros."
release_testing = "Pruebas de lanzamiento"
