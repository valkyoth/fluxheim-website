r1712_released_july_15_2026 = "Utjûn op 15 july 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Foeget opt-in noarmen-basearre cache, proxy, en antwurd-digest metadata ta"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Bewiist authentisearre live snapshot opnij laden, weromdraaien, yntegriteitskontrôles en persistinsje opnij starte"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Foeget reprodusearber FIPS-backend-bewiis ta en brede native runtime-harding"
r1712_whats_next_summary = "foeget opt-in noarmen metadata ta, autentike snapshot rollback bewiis, reproducible FIPS-backend bewiis, en sterker cache, TLS, Wasm, buffering, en stream grinzen."
r1712_release_series_digest = "Fluxheim 1.7 release rige: opt-in noarmen-basearre cache, proxy, en antwurd-digest metadata; autentike live snapshot opnij laden en weromdraaie; reproducible FIPS-backend bewiis; nul-downtime proses upgrades; ûnôfhinklik hifke Wasm belied foarbylden; en sterker cache, TLS, buffering, stream, en protokol grinzen."
r1712_standards_based_response_metadata = "Noarmen-basearre antwurd metadata"
r1712_response_metadata_intro = "Antwurdmetadata is standert útskeakele. Skeakelje allinich de fjilden yn dy't jo nedich binne; Fluxheim ûntliend se fan it eigentlike cache-resultaat, proxy-mislearring, en definitive antwurdbytes sûnder cache-kaaien, efterkantadressen, DNS-nammen of rauwe flaters te bleatsjen."
r1712_field = "Field"
r1712_what_it_reports = "Wat it rapportearret"
r1712_cache_status_description = "RFC 9211-cache-útkomsten lykas hit, miss, ferâldere trochstjoering, revalidaasje, ferfallen en bypass."
r1712_proxy_status_description = "RFC 9209 lege kardinaliteit details foar mislearrings oanmakke troch Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 oer de definitive HTTP berjochtynhâld nei kompresje."
r1712_repr_digest_description = "SHA-256 allinich as Fluxheim de folsleine selektearre fertsjintwurdiging hâldt."
r1712_live_snapshots_and_rollback = "Live snapshots en weromdraaien"
r1712_live_snapshot_intro = "Ferifiearre snapshots kinne in falidearre kandidaat publisearje, de live router ferfange, en weromrolle sûnder normale routing-allinich ynset op 'e nij te begjinnen. Elk fersyk bliuwt op ien routergeneraasje fan begjin oant ein."
r1712_snapshot_private_directory = "Hâld de snapshotwinkel yn in tawijd privee map; besteande net-privee mappen en triemsysteem woartels wurde ôfwiisd."
r1712_snapshot_process_upgrade = "Brûk in proses upgrade as eftergrûn load-balancer sûnens of ûntdekking tsjinsten binne aktyf."
r1712_snapshot_integrity_restart = "Utfiere snapshot-yntegriteitskontrôles nei publikaasje of weromdraaien en ferifiearje dat de selekteare generaasje trochstart oerlibbet."
r1712_read_snapshot_contract = "Lês it folsleine snapshotkontrakt"
r1712_authorization_cache_bypass = "Fersiken dy't <code>Authorization</code> of <code>Proxy-Authorization</code> drage, geane altyd om opsykjen en opslach fan dielde cache."
r1712_strict_cache_control = "Misfoarme of tsjinstridige antwurd <code>Cache-Control</code> rjochtlinen wurde ôfwiisd ynstee fan in falle werom nei konfigurearre TTLs; <code>s-maxage</code> hat prioriteit boppe <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code>, en <code>s-maxage</code> ferbiede ferâldere werbrûk neidat farskheid ferrint."
r1712_encrypted_cache_upgrade_note = "Fersifere-cache upgrade notysje"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 ferpleatst fersifere skiif-cache-objekten nei root-bûne gegevens en yndekstoetsen mei duorsume nonce-status. De earste opstart tsjin in âldere fersifere root, en elke rotaasje fan lokale kaaien, sil dizze cache mei opsetsin kâld skjinmeitsje foardat it ferkear tsjinnet."
r1712_encrypted_cache_disposable = "Behannelje de fersifere cache as wegwerpfersnelling, net de boarne fan rekord."
r1712_encrypted_cache_private_storage = "Jou elke cache-root persistente privee opslach en kopiearje gjin nonce-status tusken ûnôfhinklike roots."
r1712_encrypted_cache_warmup = "Plan oarsprongskapasiteit foar de earste warming-up nei it opwurdearjen of draaiende toetsen."
r1712_client_certificate_revocation = "Client sertifikaat ynlûken"
r1712_client_certificate_revocation_intro = "Wannear't ûnderlinge TLS ynlutsen kliïnt sertifikaten moatte wegerje, soargje foar in beheine PEM CRL bondel. Fluxheim falidearret de folsleine útjouwer keten en fersmyt ferrûn of ûnfolslein CRL belied."
r1712_client_certificate_revocation_compliance = "Fereaske kliïntautentikaasje yn in FIPS of ISO-easke konformiteitsmodus fereasket ek in CRL-bondel. Gewoane kliïntautentikaasje hâldt ynlûking as in eksplisite opt-in."
r1712_fips_backend_evidence = "FIPS backend bewiis"
r1712_fips_backend_evidence_intro = "Fluxheim jout apart pinned CI-bewiis omjouwings foar de OpenSSL-FIPS en rustls/AWS-LC-FIPS profilen. Se bouwe en rinne it krekte profyl binêr, oefenje streamôfwerts en sertifikaat-ferifiearre streamop TLS, fersmite ynkompatibele belied, en registrearje kompilator, provider, ôfhinklikens, binêre en byldidentiteiten."
r1712_fips_backend_evidence_boundary = "Dit is reprodusearber backend bewiis, gjin produkt-nivo FIPS falidaasje. Hâld de bewiiskonteners apart fan normale releaseôfbyldings en besjoch it bewiis foar de krekte bou dy't jo ynsette."
r1712_read_fips_evidence_guide = "Lês de FIPS bewiisgids"
r1712_loader_admission = "Kontrôle foar it laden fan modules"
r1712_loader_admission_description = "Iepenbiere pluginmanifesten moatte in fêste SHA-256-kontrolesom befetsje. Yn it hiele proses wurde op syn meast twa modules tagelyk kompilearre. Kompilearre útfier hat standert in limyt fan 32 MiB en mei net grutter wêze as 256 MiB."
r1712_file_identity = "Triem identiteit"
r1712_file_identity_description = "Fluxheim iepenet goedkarde plugin-bestannen sûnder keppelings te folgjen, behâldt de falidearre reguliere-bestânhandgreep en lêst modulebytes fan dat handgreep sûnder it paad opnij te iepenjen."
