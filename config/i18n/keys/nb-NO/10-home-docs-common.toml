your_rights = "Dine rettigheter"
gdpr_rights_text = "Fordi nettstedet unngår brukeridentifikatorer og bare lagrer aggregert telemetri, kan vi normalt ikke identifisere en bestemt besøkende i metrikkene. Personvern- eller GDPR-spørsmål kan åpnes gjennom Fluxheim GitHub-prosjektet."
