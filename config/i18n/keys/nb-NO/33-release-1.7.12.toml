r1712_released_july_15_2026 = "Utgitt 15. juli 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Legger til opt-in standardbasert hurtigbuffer, proxy og respons-digest metadata"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Beviser autentisert live snapshot reload, rollback, integritetssjekker og omstart persistens"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Legger til reproduserbare FIPS-backend-bevis og bred native runtime-herding"
r1712_whats_next_summary = "legger til metadata for opt-in standarder, autentisert tilbakerullingssikker for øyeblikksbilder, reproduserbare FIPS-backend-bevis og sterkere hurtigbuffer, TLS, Wasm, bufring og strømgrenser."
r1712_release_series_digest = "Fluxheim 1.7 utgivelsesserie: opt-in standardbasert hurtigbuffer, proxy og respons-digest metadata; autentisert live snapshot reload og rollback; reproduserbare FIPS-backend bevis; null nedetid prosessoppgraderinger; uavhengig testet Wasm policy eksempler; og sterkere cache, TLS, bufring, strømme og protokollgrenser."
r1712_standards_based_response_metadata = "Standardbasert responsmetadata"
r1712_response_metadata_intro = "Responsmetadata er deaktivert som standard. Aktiver bare feltene du trenger; Fluxheim henter dem fra det faktiske hurtigbufferresultatet, proxy-feil og endelige svarbytes uten å avsløre cache-nøkler, backend-adresser, DNS-navn eller råfeil."
r1712_field = "Felt"
r1712_what_it_reports = "Hva den rapporterer"
r1712_cache_status_description = "RFC 9211 cache-utfall som treff, miss, foreldet videresending, revalidering, utløp og bypass."
r1712_proxy_status_description = "RFC 9209 detaljer med lav kardinalitet for feil generert av Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 over det endelige innholdet i HTTP etter komprimering."
r1712_repr_digest_description = "SHA-256 bare når Fluxheim har den fullstendige valgte representasjonen."
r1712_live_snapshots_and_rollback = "Live øyeblikksbilder og tilbakerulling"
r1712_live_snapshot_intro = "Autentiserte øyeblikksbilder kan publisere en validert kandidat, erstatte live-ruteren og rulle tilbake uten å starte normale distribusjoner som kun er for ruting. Hver forespørsel forblir på én rutergenerasjon fra start til slutt."
r1712_snapshot_private_directory = "Hold øyeblikksbildebutikken i en dedikert privat katalog; eksisterende ikke-private kataloger og filsystemrøtter avvises."
r1712_snapshot_process_upgrade = "Bruk en prosessoppgradering når bakgrunnsbelastningsbalanserhelse eller oppdagelsestjenester er aktive."
r1712_snapshot_integrity_restart = "Kjør integritetskontroller for øyeblikksbilder etter publisering eller tilbakeføring og bekreft at den valgte generasjonen overlever omstart."
r1712_read_snapshot_contract = "Les hele øyeblikksbildekontrakten"
r1712_authorization_cache_bypass = "Forespørsler som bærer <code>Authorization</code> eller <code>Proxy-Authorization</code> omgår alltid delt hurtigbufferoppslag og lagring."
r1712_strict_cache_control = "Feilaktig eller motstridende respons <code>Cache-Control</code>-direktiver avvises i stedet for å falle tilbake til konfigurerte TTL-er; <code>s-maxage</code> prioriteres over <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> og <code>s-maxage</code> forbyr gammel gjenbruk etter at ferskheten utløper."
r1712_encrypted_cache_upgrade_note = "Merknad om oppgradering av kryptert cache"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 flytter krypterte diskbufferobjekter til rotbundne data og indeksnøkler med varig nonce-tilstand. Den første oppstarten mot en eldre kryptert rot, og hver rotasjon av lokalnøkkel, kaldtømmer med hensikt den cachen før den betjener trafikk."
r1712_encrypted_cache_disposable = "Behandle den krypterte cachen som engangsakselerasjon, ikke kilden til registreringen."
r1712_encrypted_cache_private_storage = "Gi hver cache-rot vedvarende privat lagring og ikke kopier nonce-tilstand mellom uavhengige røtter."
r1712_encrypted_cache_warmup = "Planlegg opprinnelseskapasitet for første oppvarming etter oppgradering eller rotering av taster."
r1712_client_certificate_revocation = "Tilbakekalling av klientsertifikat"
r1712_client_certificate_revocation_intro = "Når gjensidig TLS må avvise tilbakekalte klientsertifikater, oppgi en avgrenset PEM CRL-pakke. Fluxheim validerer hele utstederkjeden og avviser utløpte eller ufullstendige CRL-policyer."
r1712_client_certificate_revocation_compliance = "Nødvendig klientautentisering i en FIPS eller ISO-påkrevd samsvarsmodus krever også en CRL-pakke. Vanlig klientautentisering beholder tilbakekalling som en eksplisitt opt-in."
r1712_fips_backend_evidence = "FIPS backend-bevis"
r1712_fips_backend_evidence_intro = "Fluxheim gir separat festede CI-sikre miljøer for OpenSSL-FIPS- og rustls/AWS-LC-FIPS-profilene. De bygger og kjører den eksakte profilbinæren, utøver nedstrøms og sertifikatverifisert oppstrøms TLS, avviser inkompatibel policy og registrerer kompilator-, leverandør-, avhengighets-, binær- og bildeidentiteter."
r1712_fips_backend_evidence_boundary = "Dette er reproduserbare backend-bevis, ikke FIPS-validering på produktnivå. Hold prøvebeholderne atskilt fra vanlige utgivelsesbilder og se gjennom bevisene for den nøyaktige konstruksjonen du distribuerer."
r1712_read_fips_evidence_guide = "Les FIPS bevisveiledning"
r1712_loader_admission = "Kontroll av modulinnlasting"
r1712_loader_admission_description = "Offentlige pluginmanifester må inneholde en fast SHA-256-kontrollsum. Høyst to moduler kompileres samtidig i hele prosessen. Kompilert utdata har som standard en grense på 32 MiB og kan ikke overstige 256 MiB."
r1712_file_identity = "Filidentitet"
r1712_file_identity_description = "Fluxheim åpner godkjente plugin-filer uten å følge koblinger, beholder det validerte vanlige filhåndtaket og leser modulbytes fra det håndtaket uten å åpne banen på nytt."
