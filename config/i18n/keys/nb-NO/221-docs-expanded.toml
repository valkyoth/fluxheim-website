version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Versjon 1.6.37 er den siste crate-grenseoppryddingen før Wasm: ACME, observability, cache, load-balancer, PHP-FPM og native-runtime-internlogikk flyttes til mindre crate-eide moduler mens runtime-atferden forblir stabil."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Versjon 1.6.37 gjør den lokale observability-smoken mer pålitelig ved å prøve midlertidige Prometheus- og Jaeger-starter på nytt med nylig tildelte porter når host-network-porter konkurrerer med andre runnerprosesser."

