fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2 holder Wasm valgfritt og legger til den første begrensede native HTTP/1-hookfamilien for request-headers og response-headers. Plugins kan gjøre godkjente syntetiske policyendringer, men får fortsatt ikke rå headers, bodies, filsystemtilgang, nettverkstilgang, private nøkler eller admin-API-er."
