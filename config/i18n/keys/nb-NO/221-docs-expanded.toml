fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3 holder Wasm valgfritt og legger til avgrensede native HTTP/1 route-decision-hooks ved siden av access-decision- og header-hooks. Plugins kan fortsette, avvise eller velge konfigurerte canary- og mirror-rutegrener, men kan fortsatt ikke finne opp upstreams, omgå rutematching, overstyre Fluxheims tilgangspolicy eller motta rå headers, bodies, filsystemtilgang, nettverkstilgang, private nøkler eller admin-API-er."
