starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "Från 1.7.0 lägger Fluxheim till en valfri Wasm-sandboxgrund. Den är avstängd som standard, inkompatibel med privacy-mode och bevisar för närvarande säker pluginladdning plus begränsad körning innan request/response-policyhooks exponeras."
