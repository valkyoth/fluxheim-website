r1712_released_july_15_2026 = "Publicà el 15 de lujo 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Zonta metadati facoltativi basài sui standard par cache, proxy e digest de ła risposta"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "El prova el ricaricamento e el rollback dei snapshot live autenticài, i controłi de integrità e ła persistenza dopo el riavìo"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Zonta prove riproduxìbiłi par backend FIPS e un rinforso ampio del runtime nativo"
r1712_whats_next_summary = "el zonta metadati standard facoltativi, prova del rollback dei snapshot autenticài, prove riproduxìbiłi par backend FIPS e confini pì robusti par cache, TLS, Wasm, buffering e stream."
r1712_release_series_digest = "Serie Fluxheim 1.7: metadati facoltativi basài sui standard par cache, proxy e digest de ła risposta; ricaricamento e rollback dei snapshot live autenticài; prove riproduxìbiłi par backend FIPS; ajornamenti dei procesi sensa interusion; esempi de policy Wasm provài separatamente; e confini pì robusti par cache, TLS, buffering, stream e protocolo."
r1712_standards_based_response_metadata = "Metadati de risposta basài sui standard"
r1712_response_metadata_intro = "I metadati de ła risposta i xe disativài par default. Ativa soło i campi che te serve; Fluxheim li deriva dal risultato reałe de ła cache, dal guasto del proxy e dai byte finałi de ła risposta, sensa mostrar ciavi de cache, indirisi del backend, nomi DNS o erori grezi."
r1712_field = "Campo"
r1712_what_it_reports = "Cossa el segnala"
r1712_cache_status_description = "Risultati de ła cache RFC 9211 come hit, miss, invio de dati veci, rivalidazion, scadensa e bypass."
r1712_proxy_status_description = "Detaji a bassa cardinalità RFC 9209 par i guasti generài da Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 sul contenuto finałe del mesajo HTTP dopo ła compresion."
r1712_repr_digest_description = "SHA-256 soło quando Fluxheim el tien ła raprexentazion completa sełesionada."
r1712_live_snapshots_and_rollback = "Snapshot live e rollback"
r1712_live_snapshot_intro = "I snapshot autenticài i pol publicar un candidato validà, sostituir el router ativo e far rollback sensa riaviar łe normali instalasion soło de routing. Ogni richiesta ła resta su na soła jenerasion del router dal principio a ła fine."
r1712_snapshot_private_directory = "Tien el deposito dei snapshot inte na directory privata dedicada; łe directory esistenti no private e łe radixe del filesystem łe vien rifiutade."
r1712_snapshot_process_upgrade = "Dòpara un ajornamento del proceso quando xe ativi i servizi in background par ła sałute o ła scoperta del load balancer."
r1712_snapshot_integrity_restart = "Fa i controłi de integrità del snapshot dopo ła publicasion o el rollback e verifica che ła jenerasion sełesionada ła sopraviva al riavìo."
r1712_read_snapshot_contract = "Lezi el contrato completo dei snapshot"
r1712_authorization_cache_bypass = "Łe richieste co <code>Authorization</code> o <code>Proxy-Authorization</code> łe salta sempre ła ricerca e el salvatagio inte ła cache condivixa."
r1712_strict_cache_control = "Łe diretive de risposta <code>Cache-Control</code> malformade o in conflito łe vien rifiutade invese de tornar ai TTL configurài; <code>s-maxage</code> el ga priorità su <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> e <code>s-maxage</code> i vieta de riutilixar dati veci dopo che ła frescheza ła xe scaduda."
r1712_encrypted_cache_upgrade_note = "Nota par l'ajornamento de ła cache cifrada"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 el sposta i ojeti de ła cache cifrada su disco a ciavi dati e indixe łegade a ła radixe, co un stato nonce durevołe. El primo avìo su na radixe cifrada pì vecia e ogni rotasion de ła ciave locałe i purga aposta ła cache a fredo prima de servir el trafico."
r1712_encrypted_cache_disposable = "Trata ła cache cifrada come acelerasion che se pol butar via, no come fonte ufisiałe dei dati."
r1712_encrypted_cache_private_storage = "Dà a ogni radixe de cache un spàsio privà persistente e no copiar el stato nonce tra radixe indipendenti."
r1712_encrypted_cache_warmup = "Pianifica ła capacità de l'origine par el primo riscaldamento dopo l'ajornamento o ła rotasion de łe ciavi."
r1712_client_certificate_revocation = "Revoca del sertificato del cliente"
r1712_client_certificate_revocation_intro = "Quando TLS reciproco el ga da rifiutar sertificati cliente revocài, fornisci un bundle PEM CRL limità. Fluxheim el valida tuta ła cadena de l'emisor e el rifiuta policy CRL scadude o incomplete."
r1712_client_certificate_revocation_compliance = "L'autenticazion cliente obligatoria inte na modalità de conformità FIPS o ISO ła richiede anca un bundle CRL. L'autenticazion cliente normałe ła tien ła revoca come scelta esplicita."
r1712_fips_backend_evidence = "Prove par backend FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim el fornisce ambienti de prova CI fissài e separài par i profiłi OpenSSL-FIPS e rustls/AWS-LC-FIPS. I costruise e i avìa el binario esato del profilo, i prova TLS a valle e TLS a monte verificà col sertificato, i rifiuta policy incompatìbiłi e i registra łe identità del compilator, del provider, de łe dipendense, del binario e de l'imàjine."
r1712_fips_backend_evidence_boundary = "Questa ła xe na prova riproduxìbiłe del backend, no na validasion FIPS del prodoto. Tien i container de prova separài da łe imàjini normałi de release e controła łe prove par el build preciso che te distribusi."
r1712_read_fips_evidence_guide = "Lezi ła guida de łe prove FIPS"
r1712_loader_admission = "Controłi par cargar i moduli"
r1712_loader_admission_description = "I manifesti publici dei plugin i ga da contenir un digest SHA-256 fisso. In tuto el proceso se compila al massimo do moduli par volta. L'output compilà el ga par default un limite de 32 MiB e no el pol superar 256 MiB."
r1712_file_identity = "Identità del file plugin"
r1712_file_identity_description = "Fluxheim el verze i file plugin aprovài sensa seguir i link, el tien el handle validà del file regołare e el leze i byte del modulo da chel handle sensa riaverzer el percorso."
