version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "版本 1.6.37 係 Wasm 前最後 crate boundary cleanup：ACME、observability、cache、load-balancer、PHP-FPM 同 native runtime 內部搬去更細、由 crate 擁有嘅 modules，同時 runtime 行為保持穩定。"

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "版本 1.6.37 會喺 host-network ports 同其他 runner processes 爭用時，用新分配嘅 ports 重試一次性 Prometheus 同 Jaeger startup，令本機 observability smoke 更可靠。"

