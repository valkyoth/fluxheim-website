version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "版本 1.6.37 是 Wasm 前的最終 crate 邊界整理：ACME、observability、cache、load-balancer、PHP-FPM 與 native runtime 內部邏輯移入更小的 crate 自有模組，同時 runtime 行為保持穩定。"

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "版本 1.6.37 會在 host-network 連接埠與其他 runner 程序競爭時，以新分配的連接埠重試一次性 Prometheus 與 Jaeger 啟動，讓本機 observability smoke 更可靠。"
