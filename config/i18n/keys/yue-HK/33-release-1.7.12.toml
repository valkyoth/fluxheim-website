r1712_released_july_15_2026 = "2026 年 7 月 15 號發佈"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "加入咗選擇加入基於標準嘅快取、代理同埋回應摘要元數據"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "證明經過驗證嘅即時快照重新載入、回滾、完整性檢查同埋重新啟動持久性"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "加入咗可重複嘅 FIPS-backend 證據同埋廣泛嘅原生執行時間強化"
r1712_whats_next_summary = "加入咗選擇加入標準元數據、經過認證嘅快照回滾證明、可重複嘅 FIPS-backend 證據，同埋更強大嘅快取、 TLS 、 Wasm 、緩衝同埋流邊界。"
r1712_release_series_digest = "Fluxheim 1.7 發佈系列：選擇加入基於標準嘅緩存、代理同响應摘要元數據；經過認證嘅實時快照重新載入同回滾；可重複嘅 FIPS-backend 證據；零停機流程升級；獨立測試過 Wasm 政策例子；同埋更強嘅緩存、 TLS 、緩衝、流同協議邊界。"
r1712_standards_based_response_metadata = "基於標準嘅回應元數據"
r1712_response_metadata_intro = "預設係停用咗回應元數據。只啟用你需要嘅欄位； Fluxheim 係由實際嘅緩存結果、代理失敗同最終响應字节派生出嚟，而唔會暴露緩存密鑰、後端地址、 DNS 名稱或者原始錯誤。"
r1712_field = "欄位"
r1712_what_it_reports = "佢報告嘅嘢"
r1712_cache_status_description = "RFC 9211 快取結果，例如命中、錯過、過時轉寄、重新驗證、到期同埋繞過。"
r1712_proxy_status_description = "RFC 9209 低基數詳情，用嚟顯示由 Fluxheim 產生嘅故障。"
r1712_content_digest_description = "針對壓縮後最終 HTTP 訊息內容計算 RFC 9530 SHA-256。"
r1712_repr_digest_description = "只有當 Fluxheim 保留完整嘅所選表示時，先會有 SHA-256 。"
r1712_live_snapshots_and_rollback = "即時快照同回滾"
r1712_live_snapshot_intro = "經過驗證嘅快照可以發佈經過驗證嘅候選，取代實時路由器，同埋回滾，而唔使重新啟動正常嘅僅路由部署。每個要求由頭到尾都會喺一代路由器上面保留。"
r1712_snapshot_private_directory = "將快照存儲放喺專用嘅私人目錄入面；現有嘅非私人目錄同檔案系統根會被拒絕。"
r1712_snapshot_process_upgrade = "當背景負載平衡器健康或者發現服務啟用嗰陣，請使用進程升級。"
r1712_snapshot_integrity_restart = "喺發佈或者回滾之後執行快照完整性檢查，並確認所選版本喺重新啟動之後仍然保留。"
r1712_read_snapshot_contract = "睇完整嘅快照運作規範"
r1712_authorization_cache_bypass = "帶有 <code>Authorization</code> 或者 <code>Proxy-Authorization</code> 嘅請求始終會繞過共用快取查找同儲存。"
r1712_strict_cache_control = "錯誤格式或者衝突嘅回應 <code>Cache-Control</code> 指令會被拒絕，而唔係返去配置咗嘅 TTL ； <code>s-maxage</code> 優先於 <code>max-age</code> 。"
r1712_mandatory_revalidation = "<code>must-revalidate</code> 、 <code>proxy-revalidate</code> 同 <code>s-maxage</code> 禁止喺新鮮過期後過期重複使用。"
r1712_encrypted_cache_upgrade_note = "加密緩存升級筆記"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 將加密磁碟快取對象移動到根綁定資料同索引密鑰，並且具有持久嘅隨機狀態。第一個針對舊加密根嘅啟動，同埋每次本地密鑰輪流，都會喺提供流量之前有意冷清除緩存。"
r1712_encrypted_cache_disposable = "將加密快取當成可以棄置嘅加速資料，而唔係權威資料來源。"
r1712_encrypted_cache_private_storage = "畀每個緩存根持久嘅私人儲存空間，同埋唔好喺獨立根之間複製 nonce 狀態。"
r1712_encrypted_cache_warmup = "為升級或者輪換金鑰之後第一次快取預熱，預留足夠嘅源站容量。"
r1712_client_certificate_revocation = "客戶端憑證撤銷"
r1712_client_certificate_revocation_intro = "當互相嘅 TLS 必須拒絕撤銷嘅用戶端證書嗰陣，提供一個有界嘅 PEM CRL 捆綁包。 Fluxheim 會驗證完整嘅發行商鏈，並拒絕過期或者唔完整嘅 CRL 政策。"
r1712_client_certificate_revocation_compliance = "喺 FIPS 或者 ISO 所需嘅合規模式入面所需嘅用戶端認證亦都需要 CRL 捆綁。普通嘅用戶端認證會將撤銷保留為明確嘅選擇加入。"
r1712_fips_backend_evidence = "FIPS 後端驗證證據"
r1712_fips_backend_evidence_intro = "Fluxheim 為 OpenSSL-FIPS 同 rustls/AWS-LC-FIPS 設定分別提供依賴版本固定嘅 CI 驗證環境。環境會構建同執行對應設定嘅二進制檔案，測試下游 TLS 同經證書驗證嘅上游 TLS，拒絕唔兼容嘅政策，並記錄編譯器、加密提供者、依賴項、二進制檔案同映像識別資料。"
r1712_fips_backend_evidence_boundary = "呢啲係可重複嘅後端驗證證據，唔代表成個產品已經取得 FIPS 認證。驗證容器要同一般發佈映像分開，亦要確認證據同實際部署嘅構建完全一致。"
r1712_read_fips_evidence_guide = "睇吓 FIPS 證據指南"
r1712_loader_admission = "載入准入控制"
r1712_loader_admission_description = "公開清單一定要固定 SHA-256 摘要。成個程序最多同時做兩個編譯工作；編譯產物預設上限係 32 MiB，絕對上限係 256 MiB。"
r1712_file_identity = "檔案身分一致性"
r1712_file_identity_description = "Fluxheim 會喺唔跟隨連結嘅情況下開啟已批准嘅外掛程式檔案，保留經驗證嘅一般檔案句柄，並直接由該句柄讀取模組位元組，唔會重新開啟路徑。"
