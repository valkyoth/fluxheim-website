memory_safe_by_design = "Minnessäker genom design"
memory_safe_by_design_text = "Skrivet i Rust med en låst stabil verktygskedja. Inga buffer overflows, ingen use-after-free och inga datarace genom design."
fluxheim_http_core = "Fluxheim HTTP-kärna"
fluxheim_http_core_text = "En Rust-native edge-runtime med anslutningspooling, upstream-retry, aktiva hälsokontroller, HTTP/2, WebSocket-uppgraderingar och gRPC pass-through."
