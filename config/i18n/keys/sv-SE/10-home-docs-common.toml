[home]
meta_description = "Fluxheim är en högpresterande, modulär webbserver, omvänd proxy och cacheserver byggd i Rust."
meta_description_secure = "Fluxheim är en högpresterande, modulär webbserver, omvänd proxy och cachingserver. Skrivet i Rust. Säkert som standard."
meta_description_short = "En minnessäker edge-server och omvänd proxy byggd i Rust."
hero_memory_safe = "Minnessäker"
hero_edge_server = "Edge-server"
hero_built_in_rust = "Byggd i Rust"
hero_line_one = "Modulär omvänd proxy, cache, lastbalanserare och statisk värd skriven"
hero_line_two = "i Rust. Säker som standard med TLS, ACME, komprimering, edge-policy,"
hero_line_three = "dynamisk upstream-discovery och inbyggd säker trafikspegling."
tag_fluxheim_core = "Fluxheim-kärna"
tag_rootless_containers = "Rootless-containrar"
features_heading = "Allt du behöver vid kanten"
