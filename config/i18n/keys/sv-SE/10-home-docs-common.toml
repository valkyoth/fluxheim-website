retention = "Lagringstid"
retention_text = "Lagringstiden styrs av den lokala Prometheus- och Grafana-distributionen som driver webbplatsen. Webbplatsapplikationen skriver inte en separat analysdatabas."
purpose_and_lawful_basis = "Syfte och rättslig grund"
gdpr_basis_text = "Syftet med webbplatstelemetrin är säkerhet, tillförlitlighet, kapacitetsplanering och förbättring av dokumentationen på aggregerad nivå. Den avsedda rättsliga grunden är berättigat intresse av att driva och säkra webbplatsen med integritetsminimerad telemetri."
data_minimisation = "Dataminimering"
gdpr_minimisation_text = "Mätvärden använder avgränsade etiketter som språk, normaliserad rutt, sektion, statusklass, nedladdningsartefakt, GitHub-mål och valfri landskod. Implementeringen är utformad för att inte lagra eller exportera råa IP-adresser eller spårningsidentifierare på användarnivå."
github_redirect_privacy_text = "GitHub utgående klick räknas sammanlagt innan webbläsaren omdirigeras till GitHub. GitHub behandlar sedan begäran enligt GitHubs egna villkor och integritetspolicy."
your_rights = "Dina rättigheter"
gdpr_rights_text = "Eftersom webbplatsen undviker användaridentifierare och endast lagras aggregerad telemetri, kan vi normalt inte identifiera en specifik besökare i mätvärdena. Sekretess- eller GDPR-frågor kan öppnas genom Fluxheim GitHub-projektet."
