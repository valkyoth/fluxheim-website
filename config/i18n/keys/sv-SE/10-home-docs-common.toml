modular_build_profiles_text = "Kompilera bara det du behöver. Fokuserade profiler för statisk webbplats, cache-edge, omvänd proxy, lastbalansering, TCP-strömproxy, PHP-FPM, GeoIP, trafikspegling och komprimeringsaktiverade produktionspaket."
