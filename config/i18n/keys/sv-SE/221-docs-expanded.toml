version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Version 1.6.37 är den sista crate-gränsrensningen före Wasm: ACME, observability, cache, load-balancer, PHP-FPM och native-runtime-interna delar flyttas till mindre crate-ägda moduler medan runtime-beteendet förblir stabilt."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Version 1.6.37 gör den lokala observability-smoken mer tillförlitlig genom att starta om tillfälliga Prometheus- och Jaeger-processer med nya portar när host-network-portar krockar med andra runner-processer."

