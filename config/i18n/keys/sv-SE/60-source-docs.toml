the_workflow_defaults_to_linux_amd64_use_manual_dispatch_to_test_additional_platforms_fo = "Arbetsflödet använder <code>linux/amd64</code> som standard. Använd manuell dispatch för att testa ytterligare plattformar, till exempel <code>linux/amd64,linux/arm64</code>, när varje vald runtimebas har verifierats för dessa arkitekturer."
manual_workflow_inputs_also_allow_runtime_uid_runtime_gid_and_a_temporary_feature_overri = "Manuella arbetsflödesindata tillåter också <code>runtime_uid</code>, <code>runtime_gid</code> och en tillfällig funktionsöverstyrning. Behåll båda ID:n på <code>65532</code> för normala bilder. Använd endast <code>0</code> för en avsiktlig körtidsbild som root. Lämna funktionsöverstyrningen tom för normala utgåvor av releaseprofiler."
1_3_2_adds_a_separate_fluxheim_config_tester_binary_target_for_diagnosing_configs_outsid = "<code>1.3.2</code> lägger till ett separat binärt mål <code>fluxheim-config-tester</code> för att diagnostisera konfigurationer utanför körtidsbehållaren. Det är avsett för fall där en Podman- eller systemd-distribution inte kan starta och operatören fortfarande behöver Fluxheims riktiga konfigurationsparser, funktions-/profilkontroller, TLS-lagringskontroller, ACME-målförhandsgranskning och uppströms DNS-kontroller."
use_profile_full_profile_cache_profile_proxy_or_profile_web_php_to_match_the_release_art = "Använd <code>--profile full</code>, <code>--profile cache</code>, <code>--profile proxy</code> eller <code>--profile web-php</code> för att matcha utgivningsartefakten eller bildprofilen du planerar att köra. Lägg till <code>--no-runtime-paths</code> när du bara behöver syntax-, semantisk- och profilvalidering utanför gateway-behållaren och inte har tillgång till tjänstens körtidsmontering som <code>/run/fluxheim</code>. Lämna den flaggan av när du vill att testaren ska inspektera <code>server.process.pid_file</code>, uppgraderingssockets och certifikatåterladdningssockets sökvägar som en del av en distributionsförkontroll."
runtime_images_and_rpms_do_include_fluxheim_acme_which_is_the_acme_companion_entry_point = "Körtidsbilder och RPM inkluderar <code>fluxheim-acme</code>, som är ACME-kompanjonstartpunkten för arbetsflöden för servicehanterare eller containerschemalagda förnyelse:"
for_live_activation_after_renewal_the_running_gateway_and_companion_need_the_same_writab = "För aktiv aktivering efter förnyelse behöver den löpande gatewayen och följeslagaren samma skrivbara <code>/run/fluxheim</code>-fäste så att <code>fluxheim-acme</code> kan nå <code>server.process.certificate_reload_sock</code>."
process_runtime_files_such_as_pid_files_upgrade_sockets_and_the_certificate_reload_socke = "Bearbeta runtime-filer som PID-filer, uppgraderingssockets och certifikatåterladdningssocket."
