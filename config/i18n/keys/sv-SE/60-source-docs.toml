for_multi_site_setups_prefer_etc_fluxheim_conf_d_with_one_vhost_per_file_vhosts_starts_a = "För flersajtskonfigurationer, föredra <code>/etc/fluxheim/conf.d/</code> med en vhost per fil. <code>[[vhosts]]</code> startar en vhost, och varje efterföljande <code>[vhosts.*]</code>-tabell tillhör den vhosten tills nästa <code>[[vhosts]]</code>. De paketerade <code>/etc/fluxheim/fluxheim.toml</code>-konfigurationerna sätter <code>include_conf_d = true</code>, så den laddar också synliga <code>*.toml</code>-filer från <code>/etc/fluxheim/conf.d/</code> efter huvudfilen. När Fluxheim startar från <code>/etc/fluxheim</code>, laddar den först TOML-filer på toppnivå och sedan <code>/etc/fluxheim/conf.d/*.toml</code>."
