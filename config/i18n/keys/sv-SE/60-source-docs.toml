for_podman_on_selinux_hosts_z_gives_the_bind_mount_a_private_container_label_add_u_only = "För Podman på SELinux-värdar ger <code>:Z</code> bindningsfästet en privat containeretikett. Lägg till <code>:U</code> endast för skrivbara sökvägar när du vill att Podman ska justera äganderätten för användarnamnrymder. Skrivskyddade sökvägar använder normalt <code>:ro,Z</code>, inte <code>:U</code>."
the_default_image_user_is_65532_65532_so_writable_host_directories_should_be_owned_or_ma = "Standardbildanvändaren är <code>65532:65532</code>, så skrivbara värdkataloger bör ägas eller mappas för den användaren. Med rootless Podman är <code>:U</code> ofta det enklaste säkra alternativet för cache-/tillstånds-/loggkataloger."
