[certificate_renewal]
certificate_renewal_and_reload_fluxheim_source_docs = "<title>Certifikatförnyelse och omladdning — Fluxheim Källdokument</title>"
certificate_renewal_and_reload = "<h1 id=\"certificate-renewal-and-reload\">Certifikatförnyelse och omladdning</h1>"
fluxheim_should_support_both_operator_owned_certificates_and_acme_managed_certificates_manual_certif = "<p>Fluxheim bör stödja både operatörsägda certifikat och ACME-hanterade certifikat. Manuella certifikat konfigureras med <code>cert_path</code> och <code>key_path</code>. ACME-certifikat konfigureras per vhost och hanteras under <code>tls.acme.storage</code>. Fluxheim härleder hanterade certifikatsökvägar under <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/fullchain.pem</code> och <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/privkey.pem</code>; segmentet är sanerat och hash-suffixat av Fluxheim, inte tillhandahållet av operatören. För HTTP-01 härleder Fluxheim också en lokal utmaningsbutik på <code>&lt;storage&gt;/http-01/&lt;safe-vhost-segment&gt;/</code> och serverar säkra utmaningstokenfiler direkt när <code>tls.acme.challenge = &quot;http-01&quot;</code>. TLS-ALPN-01 stöds också i <code>1.1.0</code> för standard rustls backend. Under förnyelse skriver Fluxheim kortlivade utmaningscertifikat under <code>&lt;storage&gt;/tls-alpn-01/&lt;safe-domain-segment&gt;/</code> och rustls SNI-resolvern betjänar dem endast när klienten erbjuder <code>acme-tls/1</code> ALPN-protokollet. DNS-01 förblir framtida arbete eftersom säkra leverantörsintegrationer behöver explicit, leverantörsspecifik hemlighetshantering snarare än generiska skalkrokar. Utmaningspublicering använder samma hanterade lagring: HTTP-01-tokens begränsas till ett URL-säkert sökvägssegment, key-authorizations är avgränsade och kontrolleras för kontrollbytes, TLS-ALPN-01-certifikat genereras med ACME-identifierarutökningen, filer skrivs via temporära filer och symlinkade destinationer avvisas. ACME-kontoreferenser lagras separat på <code>&lt;storage&gt;/accounts/&lt;safe-issuer-segment&gt;/credentials.json</code>, återigen med hjälp av ett Fluxheim-genererat sanerat och hash-suffixerat segment snarare än ett råkonfigurationsvärde.</p>"
downstream_tls_listeners_are_explicit_in_server_tls_listen_the_runtime_uses_the_first_global_tls_cer = "<p>Downstream TLS-lyssnare är explicita i <code>server.tls_listen</code>. Körtiden använder den första globala <code>[[tls.certificates]]</code>-posten som standardcertifikat för dessa lyssnare. Om inget globalt certifikat är konfigurerat kan <code>server.default_vhost</code> tillhandahålla reservsystemet genom antingen <code>[vhosts.tls.certificate]</code> eller <code>[vhosts.tls.acme]</code>. Andra vhosts kan åsidosätta det certifikatet med sin egen statiska eller ACME-hanterade källa; Fluxheim väljer det matchande certifikatet av SNI under nedströms TLS handskakning.</p>"
managed_acme_certificates_may_be_absent_during_first_issuance_reloadable_sni_tls_backends_including = "<p>Managed ACME-certifikat kan saknas under första utfärdandet. Återladdningsbara SNI TLS-backends, inklusive standard rustls-bygget, behandlar saknade Fluxheim-hanterade ACME-certifikatfiler som väntande istället för att vägra start. HTTP-01 utmaningsrutter och klartextavlyssnaren kan fortfarande betjäna utfärdarens valideringsbegäran, medan HTTPS handskakningar för den pågående SNI antingen använder ett tillgängligt reservcertifikat eller misslyckas tills certifikatfilerna har utfärdats. Efter att bakgrundsarbetaren ACME har installerat filerna, laddar Fluxheim nedströms SNI-certifikatupplösaren så att nya handskakningar kan använda dem utan omstart av processen. Statiska certifikatsökvägar förblir felstängda: ett saknat operatörsägt certifikat är fortfarande ett konfigurations-/körningsfel.</p>"
storage_permissions = "<h2 id=\"storage-permissions\">Lagringsbehörigheter</h2>"
fluxheim_has_a_runtime_storage_checker_for_operator_owned_certificates_and_acme_storage_directories = "<p>Fluxheim har en runtime-lagringskontroll för operatörsägda certifikat och ACME-lagringskataloger.</p>"
recommended_unix_permissions = "<p>Rekommenderade Unix-behörigheter: </p>"
