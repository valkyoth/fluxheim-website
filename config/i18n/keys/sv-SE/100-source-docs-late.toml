public_certificate_chains_normal_read_permissions_are_acceptable_for_example_0644 = "<li>offentliga certifikatkedjor: normala läsbehörigheter är acceptabla, till exempel <code>0644</code></li>"
the_checker_reports_missing_certificate_key_files_non_file_certificate_key_paths_non_directory_acme = "<p> Kontrolleraren rapporterar saknade certifikat/nyckelfiler, icke-filcertifikat/nyckelsökvägar, icke-katalog ACME lagringsvägar, symlänkade certifikat/nyckel/EAB/lagringssökvägar inklusive symlänkade överordnade kataloger, grupp/världsläsbara privata nycklar och grupp/världen tillgängliga ACME lagringskataloger. Config parsing förblir separat från filsystemkontroller så konfigurationen kan fortfarande valideras innan filer tillhandahålls.</p>"
secret_handling = "<h2 id=\"secret-handling\">Hemlighetshantering</h2>"
acme_issuers_that_require_external_account_binding_such_as_actalis_and_google_trust_services_need_a = "<p>ACME-utgivare som kräver extern kontobindning, som Actalis och Google Trust Services, behöver en nyckelidentifierare och HMAC-nyckel. Fluxheim stöder miljövariabler och filer för dessa värden, men produktionsinstallationer bör föredra filstödda hemligheter: </p>"
systemd_credentials_mounted_under_run_credentials_lt_unit_gt = "<li>systemd autentiseringsuppgifter monterade under <code>/run/credentials/&lt;unit&gt;/</code></li>"
docker_or_podman_secrets_mounted_under_run_secrets = "<li>Docker- eller Podman-hemligheter monterade under <code>/run/secrets/</code></li>"
kubernetes_secret_volumes = "<li>Kubernetes hemliga volymer</li>"
these_mechanisms_keep_secrets_out_of_static_config_files_process_environment_listings_and_container = "<p>Dessa mekanismer håller hemligheter borta från statiska konfigurationsfiler, listor över processmiljöer och containerbildsmetadata. De passar även Fluxheims befintliga lagringskontroller eftersom applikationen bara behöver läsa vanliga filer med snäva äganderättigheter och behörigheter. Under körning läser Fluxheim EAB-hemligheter med en avgränsad filläsare, trimmar endast omgivande blanksteg, avvisar tomma eller överdimensionerade värden, öppnar filer utan att följa slutliga symbollänkar på Linux och lagrar de inlästa strängarna i nollställande minnesomslag.</p>"
example_systemd_service_override = "<p>Exempel systemd tjänsteöverstyrning:</p>"
matching_fluxheim_config_credential_names_resolve_below_credentials_directory_when_fluxheim_is_launc = "<p>Matching Fluxheim konfig. Autentiseringsnamn löser sig under <code>$CREDENTIALS_DIRECTORY</code> när Fluxheim lanseras av systemd, och under <code>/run/secrets</code> för normala container-stil hemliga monteringar: </p>"
built_in_issuer_names = "<p>Inbyggda utfärdarnamn: </p>"
letsencrypt_https_acme_v02_api_letsencrypt_org_directory = "<li><code>letsencrypt</code>: <code>https://acme-v02.api.letsencrypt.org/directory</code></li>"
letsencrypt_staging_https_acme_staging_v02_api_letsencrypt_org_directory = "<li><code>letsencrypt-staging</code>: <code>https://acme-staging-v02.api.letsencrypt.org/directory</code></li>"
actalis_https_acme_api_actalis_com_acme_directory_eab_required = "<li><code>actalis</code>: <code>https://acme-api.actalis.com/acme/directory</code>, EAB krävs</li>"
google_trust_services_https_dv_acme_v02_api_pki_goog_directory_eab_required = "<li><code>google-trust-services</code>: <code>https://dv.acme-v02.api.pki.goog/directory</code>, EAB krävs</li>"
google_trust_services_staging_https_dv_acme_v02_test_api_pki_goog_directory_eab_required = "<li><code>google-trust-services-staging</code>: <code>https://dv.acme-v02.test-api.pki.goog/directory</code>, EAB krävs</li>"
google_trust_services_eab_credentials_are_environment_specific_and_single_use_for_account_registrati = "<p>Google Trust Services EAB användaruppgifter är miljöspecifika och för engångsbruk för kontoregistrering. Fluxheim behåller separata produktions- och iscensättningsstandarder: </p>"
production_fluxheim_gts_eab_kid_fluxheim_gts_eab_hmac_key = "<li>produktion: <code>FLUXHEIM_GTS_EAB_KID</code>, <code>FLUXHEIM_GTS_EAB_HMAC_KEY</code></li>"
staging_fluxheim_gts_staging_eab_kid_fluxheim_gts_staging_eab_hmac_key = "<li>staging: <code>FLUXHEIM_GTS_STAGING_EAB_KID</code>, <code>FLUXHEIM_GTS_STAGING_EAB_HMAC_KEY</code></li>"
for_containers_mount_the_same_two_values_as_secrets_and_point_fluxheim_at_the_mounted_files = "<p>För containrar, montera samma två värden som hemligheter och peka Fluxheim på de monterade filerna: </p>"
environment_variables_remain_useful_for_local_testing_but_they_should_not_be_the_recommended_product = "<p>Environment-variabler förblir användbara för lokal testning, men de bör inte vara den rekommenderade produktionsvägen för EAB-hemligheter.</p>"
account_credentials = "<h2 id=\"account-credentials\">Kontouppgifter</h2>"
acme_account_credentials_contain_account_identity_and_private_key_material_they_are_not_kept_in_the = "<p>ACME kontouppgifter innehåller kontoidentitet och privat nyckelmaterial. De sparas inte i TOML-konfigurationen. Fluxheim härleder deras lagringssökväg från utfärdarens namn och skriver dem nedan <code>tls.acme.storage</code>:</p>"
the_credential_file_is_bounded_parsed_as_json_written_through_a_temporary_file_installed_with_owner = "<p>Autentiseringsfilen är avgränsad, tolkad som JSON, skriven genom en temporär fil, installerad med ägarbehörigheter på Unix och öppnas utan att följa den sista symbollänken på Linux. Det exakta sökvägssegmentet genereras av Fluxheim, så utfärdarnamn kan inte skapa sökvägsövergång eller dolda filsystemplatser.</p>"
when_fluxheim_is_built_with_acme_client_it_can_load_existing_credentials_from_that_path_or_create_a = "<p>När Fluxheim är byggd med <code>acme-client</code> kan den ladda befintliga referenser från den sökvägen eller skapa ett nytt utfärdarkonto genom <code>instant-acme</code> och omedelbart spara de returnerade referenserna. EAB HMAC-nycklar behandlas som base64/base64url-kodade ACME MAC-nycklar innan de skickas till utfärdarklienten. Samma funktion innehåller även ordervägarna för HTTP-01 och rustls TLS-ALPN-01: skapa order, publicera utmaningsmaterial, markera utmaningar som klara, slutföra den genererade CSR:en, hämta den färdiga certifikatkedjan och installera den i certifikatlagringen.</p>"
production_packages_and_container_images_ship_the_fluxheim_acme_companion_as_the_preferred_external = "<p>Produktionspaket och containerbilder levererar <code>fluxheim-acme</code>-companion-binären som det föredragna externa förnyelsekommandot. Den använder samma ACME-motor, lagringslayout, utfärdarreferenser och vhost-målplanerare som den integrerade gatewayen, men schemalägger förnyelser utanför trafikprocessen: </p>"
by_default_renew_observes_the_managed_certificate_files_and_attempts_only_missing_or_due_certificate = "<p> Som standard observerar <code>renew</code> de hanterade certifikatfilerna och försöker endast saknade eller förfallna certifikat. Om inget behöver förnyas avslutas det framgångsrikt med <code>acme attempted: 0</code> och ett statusmeddelande som säger att inga certifikat förfaller. Första utfärdandet behöver normalt inte <code>--force-renew</code>: saknade certifikatfiler är förfallna mål. Kommandot skriver ut varje mål med <code>status=due</code>, <code>status=skipped</code> eller <code>status=forced</code> och rapporterar sedan <code>renewed:</code>- och <code>failed:</code>-linjer per mål. För HTTP-01-fel efter att utmaningsfiler har publicerats, inkluderar felet <code>published_http_01=</code>-URL:er så att operatörer kan testa de exakta publika utmaningsvägarna som utfärdaren borde ha nått. Den avslutas från noll om något mål misslyckades, samtidigt som framgångsrika förnyelser från samma körning rapporteras.</p>"
fluxheim_acme_renew_also_asks_the_running_gateway_to_reload_its_certificate_handles_after_a_successf = "<p><code>fluxheim-acme renew</code> ber också den körande gatewayen att ladda om sina certifikathandtag efter en lyckad förnyelse när <code>server.process.certificate_reload_sock</code> är nåbar. Använd <code>reload</code> uttryckligen efter manuell installation av hanterade filer: </p>"
the_legacy_integrated_command_is_kept_for_manual_compatibility_but_new_automation_should_use_fluxhei = "<p>Det äldre integrerade kommandot behålls för manuell kompatibilitet, men ny automatisering bör använda <code>fluxheim-acme</code>:</p>"
use_force_renew_only_for_deliberate_emergency_rotation_or_testing_when_you_really_need_to_reissue_ce = "<p>Använd <code>--force-renew</code> endast för avsiktlig nödrotation eller testning när du verkligen behöver återutfärda certifikat som fortfarande är giltiga; upprepade påtvingade förnyelser kan träffa emittentens räntegränser: </p>"
all_is_accepted_as_a_backward_compatible_alias_for_force_renew_but_it_prints_a_deprecation_warning_a = "<p><code>--all</code> accepteras som ett bakåtkompatibelt alias för <code>--force-renew</code>, men det skriver ut en utfasningsvarning och bör inte användas i ny automation.</p>"
official_rpm_and_container_release_assets_include_acme_client_by_default_if_you_compile_from_source = "<p>Officiella RPM- och containerreleaseartefakter inkluderar <code>acme-client</code> som standard. Om du kompilerar från källan med en anpassad funktionslista, inkludera den uttryckligen: </p>"
