[legacy_static_http]
legacy_static_http_support_fluxheim_source_docs = "<title>Äldre statiskt HTTP-stöd — Fluxheim källdokument</title>"
legacy_static_http_support = "<h1 id=\"legacy-static-http-support\">Äldre statiskt HTTP-stöd</h1>"
legacy_http_support_is_a_future_experimental_compatibility_feature_for_isolated_devices_that_can = "<p>Legacy HTTP-stöd är en framtida experimentell kompatibilitetsfunktion för isolerade enheter som inte kan tala modern HTTP. Det får aldrig vara en del av Fluxheim&#x27;s standardbinär och får aldrig köras på normal proxy, cache, admin, PHP, CGI eller TLS lyssnarsökvägar.</p>"
the_modern_protocol_focus_for_fluxheim_remains_strict_http_1_1_and_http_2_today_with_http_3_quic = "<p> Det moderna protokollfokuset för Fluxheim är fortfarande strikt HTTP/1.1 och HTTP/2 idag, med HTTP/3/QUIC planerad som framtida prestanda- och säkerhetsriktning. Stöd för äldre protokoll är ett undantag för kompatibilitet i karantän.</p>"
compile_time_features = "<h2 id=\"compile-time-features\">Kompileringstidsfunktioner</h2>"
planned_feature_flags = "<p>Planerade funktionsflaggor: </p>"
the_default_feature_set_must_never_include_these_features_release_checks_should_fail_if_cargo_tr = "<p>Standardfunktionsuppsättningen får aldrig inkludera dessa funktioner. Utgivningskontroller bör misslyckas om <code>cargo tree -e features</code> visar någon äldre HTTP-funktion aktiverad som standard.</p>"
runtime_isolation = "<h2 id=\"runtime-isolation\">Runtime-isolering</h2>"
legacy_support_requires_explicit_runtime_config_and_dedicated_listeners = "<p>Legacy-stöd kräver explicit körtidskonfiguration och dedikerade lyssnare:</p>"
legacy_listeners_must_not_share_server_listen_server_tls_listen_admin_listen_or_metrics_listen_l = "<p>Legacy-lyssnare får inte dela <code>server.listen</code>, <code>server.tls_listen</code>, <code>admin.listen</code> eller <code>metrics.listen</code>. Lyssnarändringar är processuppgraderingsändringar.</p>"
http_1_0_static_mode = "<h2 id=\"http-1-0-static-mode\">HTTP/1.0 Statiskt läge</h2>"
