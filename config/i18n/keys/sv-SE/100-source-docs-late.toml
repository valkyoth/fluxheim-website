the_motivation_is_compatibility_with_old_internal_health_checks_plcs_and_legacy_enterprise_equip = "<p> Motivationen är kompatibilitet med gamla interna hälsokontroller, PLC:er och äldre företagsutrustning, inte offentlig internettjänst.</p>"
