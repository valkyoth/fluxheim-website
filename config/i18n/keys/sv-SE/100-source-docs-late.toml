fluxheim_stream_bytes_total_route_direction = "<li><code>fluxheim_stream_bytes_total{route,direction}</code></li>"
the_configuration_gauges_are_aggregate_label_free_and_populated_from_validated_configuration_whe = "<p>Konfigurationsmätarna är aggregerade, utan etiketter och fylls från validerad konfiguration när metrics-lyssnaren startar. Den lokala observability-smoken verifierar mätare för route/vhost-cachepolicy, antalet request-collapsing-policyer och den högsta konfigurerade lock-wait-timeouten. <code>fluxheim_acme_events_total</code> använder endast avgränsade livscykeletiketter: <code>event</code> är <code>pending</code>, <code>renewed</code>, <code>failed</code>, <code>reload_success</code>, <code>reload_failed</code>, <code>reload_unavailable</code>, <code>tick_error</code> eller <code>other</code>. Den undviker avsiktligt domännamn, certifikatsökvägar, challenge-URL:er och utfärdarhemligheter. <code>fluxheim_php_requests_total</code> och <code>fluxheim_php_request_duration_seconds</code> använder konfigurerade vhost-namn plus avgränsade etiketter för metod, utfall och statusklass. <code>outcome</code> är <code>declined</code>, <code>redirect</code>, <code>forbidden</code>, <code>not_found</code>, <code>fpm_error</code>, <code>connect_timeout</code>, <code>request_timeout</code>, <code>connection_error</code>, <code>configuration_error</code>, <code>invalid_response</code>, <code>intercepted</code>, <code>offload</code>, <code>offload_error</code>, <code>response</code> eller <code>other</code>; dessa mätvärden undviker råa sökvägar, queries, scriptfilnamn, användarnamn, cookies och FastCGI-parametrar. <code>fluxheim_stream_connections_total</code> och <code>fluxheim_stream_bytes_total</code> använder endast konfigurerade stream-ruttnamn. Stream connection <code>outcome</code> är avgränsad till <code>completed</code>, <code>rejected</code>, <code>connect_error</code>, <code>timeout</code>, <code>shutdown</code> eller <code>error</code>. Stream byte <code>direction</code> är avgränsad till <code>downstream_to_upstream</code>, <code>upstream_to_downstream</code> eller <code>other</code>. <code>fluxheim_php_stderr_events_total</code> använder konfigurerade vhost-namn plus avgränsade <code>state</code>-etiketter: <code>emitted</code>, <code>truncated</code> eller <code>other</code>; den räknar STDERR-förekomst utan att exponera PHP-feltext. <code>fluxheim_php_fpm_retries_total</code> använder konfigurerade vhost-namn plus avgränsade <code>reason</code>-etiketter: <code>connect_timeout</code>, <code>connection_error</code> eller <code>other</code>; den räknar retry-försök utan att exponera uppströmsadresser, socket-sökvägar, råa request-sökvägar, cookies eller FastCGI-parametrar. <code>fluxheim_php_fpm_pool_idle_connections</code> och <code>fluxheim_php_fpm_pool_events_total</code> använder konfigurerade vhost- och pool-etiketter. <code>pool</code>-etiketten är <code>default</code> för PHP-runtime på vhost-nivå eller det konfigurerade ruttnamnet för PHP-runtime på ruttnivå. Poolens <code>event</code>-etiketter är avgränsade till <code>connect</code>, <code>reuse</code>, <code>return</code>, <code>drop_stale</code>, <code>discard_full</code> eller <code>other</code>. <code>fluxheim_cache_activity_total</code> använder endast avgränsade etiketter: <code>tier</code> är <code>memory</code>, <code>disk</code>, <code>policy</code> eller <code>other</code>, och <code>event</code> är <code>hit</code>, <code>miss</code>, <code>store</code>, <code>store_refusal</code>, <code>eviction</code>, <code>purge</code>, <code>pass</code>, <code>bypass</code>, <code>stale</code>, <code>revalidate</code>, <code>peer_fill_hit</code>, <code>peer_fill_miss</code>, <code>peer_fill_error</code>, <code>peer_fill_fallback</code>, <code>peer_fill_fail_closed</code> eller <code>other</code>. Dessa mätvärden undviker avsiktligt råa hosts, sökvägar, queries, cache keys, peer-URL:er och purge-identiteter. <code>fluxheim_cache_activity_scope_total</code> använder samma avgränsade <code>tier</code>- och <code>event</code>-etiketter plus etiketter med konfigurerade namn: <code>scope</code> är <code>vhost</code> eller <code>route</code>, <code>vhost</code> är det konfigurerade vhost-namnet, och <code>route</code> är tom för vhost-cache eller det konfigurerade ruttnamnet för route-cache. Den undviker avsiktligt rå <code>Host</code>, path, query, cache key och purge identity-etiketter. Varaktighetshistogram för cacheoperationer använder samma konfigurerade namnetiketter plus avgränsade <code>phase</code>- och <code>operation</code>-etiketter. <code>operation</code> är <code>lookup</code> eller <code>lock_wait</code>, så dashboards kan skilja lagringsuppslagskostnad från väntetid för request collapsing utan request-etiketter med hög kardinalitet. Varaktighetshistogram för cachepurger använder endast den avgränsade purger-etiketten <code>outcome</code>, så operatörer kan se när cleanup-ticks blir långsamma utan att exponera cachesökvägar, queries, cache keys och purge-identiteter. Framtida OpenTelemetry-attribut bör spegla samma lågkardinalitetskoncept som används av admin JSON och Prometheus.</p>"
