tls_acme_renewal_renew_after_when_set = "<li><code>tls.acme.renewal.renew_after</code>, när inställd </li>"
renew_after_lets_an_operator_defer_automatic_renewal_until_a_chosen_toml_offset_datetime_for_example = "<p><code>renew_after</code> låter en operatör skjuta upp automatisk förnyelse till en vald TOML offset datumtid, till exempel <code>2026-06-01T00:00:00Z</code>. Lokala TOML datumtider avvisas så att kön inte kan tolka operatörens avsikt i fel tidszon.</p>"
when_fluxheim_is_built_with_acme_client_the_runtime_registers_a_background_renewal_service_when_acme = "<p>När Fluxheim är byggd med <code>acme-client</code>, registrerar runtime en bakgrundsförnyelsetjänst när ACME-hanterade vhosts konfigureras och <code>tls.acme.automation = &quot;background&quot;</code>. Detta är standard för enkla installationer med en enda process. Tjänsten observerar att hanterat certifikat löper ut, väcker varje <code>tls.acme.renewal.check_interval_secs</code> och förnyar saknade eller förfallna certifikat via samma ACME-utmaningsväg som används av CLI.</p>"
after_successful_renewal_fluxheim_reloads_the_downstream_sni_certificate_resolver_or_callback_so_new = "<p>Efter lyckad förnyelse laddar Fluxheim nedströms SNI-certifikatupplösaren eller återuppringning så att nya handslag kan använda de nyinstallerade filerna utan att starta om. Om en TLS-backend eller lyssnarform inte kan tillhandahålla ett omladdningshandtag, loggar Fluxheim att en omstart eller processomladdning krävs.</p>"
this_reload_happens_inside_the_long_running_fluxheim_process_the_gateway_also_owns_a_local_unix_doma = "<p>Denna omladdning sker i den långvariga Fluxheim-processen. Gatewayen äger också en lokal Unix-domän omladdningssocket för certifikat vid <code>server.process.certificate_reload_sock</code>, som standard är: </p>"
the_socket_accepts_only_the_narrow_reload_certificates_operation_and_is_created_with_owner_only_perm = "<p> Sockeln accepterar endast den smala <code>reload-certificates</code>-operationen och skapas med enbart ägarbehörigheter av den körande gatewayen. Den är avsedd för samma runtime-användare eller containerpod, inte fjärradministration. Den långvariga gatewayen begränsar samtidiga omladdningskontrollförfrågningar, och varje accepterad begäran använder fortfarande en kort fast lästid. Kompanjonen läser gatewaysvaret med en liten fast gräns så en komprometterad eller ersatt lokal socket kan inte växa medföljande minne utan begränsning.</p>"
production_packages_include_the_fluxheim_acme_companion_binary_while_keeping_the_integrated_backgrou = "<p>Production-paketen inkluderar <code>fluxheim-acme</code>-kompanjonbinären samtidigt som den integrerade bakgrundsarbetaren behålls för enkla installationer. I den här modellen förblir <code>fluxheim.service</code> fokuserad på att betjäna trafik- och utmaningsfiler, medan engångs <code>fluxheim-acme.service</code> och schemalagda <code>fluxheim-acme.timer</code> kör förnyelser som Fluxheim runtime-användare. Companion-kommandot återanvänder samma ACME-motor och lagringslayout som det äldre <code>fluxheim acme-renew</code>-kommandot, använder systemd-referenser eller containerhemligheter för EAB-material och skriver certifikat under den konfigurerade <code>tls.acme.storage</code>. När certifikaten förnyas ber den den körande gatewayen att ladda om sina certifikathandtag genom <code>server.process.certificate_reload_sock</code>. Ställ in <code>tls.acme.automation = &quot;external&quot;</code> i detta läge så att webbservern inte också kör bakgrundsförnyelseloopen.</p>"
preview_targets_without_contacting_the_issuer = "<p>Förhandsgranska mål utan att kontakta utfärdaren:</p>"
check_due_missing_valid_state_before_issuing = "<p>Kontrollera förfallna/saknade/giltiga tillstånd före utfärdande:</p>"
run_renewal_and_request_live_certificate_activation_after_successful_issuance = "<p>Kör förnyelse och begär aktivering av livecertifikat efter framgångsrikt utfärdande: </p>"
request_only_the_live_certificate_handle_reload_for_example_after_manually_installing_files_below_tl = "<p>Begär endast omladdningen av live-certifikatet, till exempel efter manuell installation av filer under <code>tls.acme.storage</code>:</p>"
enable_the_packaged_timer_after_acme_config_and_credentials_are_installed = "<p>Aktivera den paketerade timern efter att ACME-konfigurationen och användaruppgifterna har installerats: </p>"
do_not_make_the_webserver_spawn_a_long_lived_helper_process_let_the_service_manager_or_container_orc = "<p>Gör inte webbservern till en långlivad hjälpprocess; låt servicechefen eller containerorkesteraren övervaka följeslagaren.</p>"
container_renewal = "<h2 id=\"container-renewal\">Containerförnyelse</h2>"
runtime_images_include_both_usr_local_bin_fluxheim_and_usr_local_bin_fluxheim_acme_the_companion_can = "<p>Runtime-bilder inkluderar både <code>/usr/local/bin/fluxheim</code> och <code>/usr/local/bin/fluxheim-acme</code>. Companion-binären kan köras inuti den redan körande gateway-containern med <code>podman exec</code>, eller som en separat one-shot-container. I båda fallen måste den se samma konfiguration, ACME-lagring, hemligheter och <code>/run/fluxheim</code>-katalog som gatewayen.</p>"
the_gateway_and_companion_must_share_server_process_certificate_reload_sock_the_packaged_container_c = "<p> Gatewayen och följeslagaren måste dela <code>server.process.certificate_reload_sock</code>. De paketerade behållarkonfigurationerna använder:</p>"
keep_the_host_side_run_directory_private_to_the_container_runtime_user_and_mount_it_read_write_into = "<p>Håll körkatalogen på värdsidan privat för containerruntime-användaren och montera den läs-skriv i båda behållarna: </p>"
if_the_gateway_container_is_already_running_the_simplest_operational_commands_are = "<p>Om gateway-containern redan körs är de enklaste operativa kommandona: </p>"
podman_exec_naturally_shares_the_gateway_container_filesystem_secrets_and_reload_socket_it_is_useful = "<p><code>podman exec</code> delar naturligt gatewaycontainerns filsystem, hemligheter och reload-socket. Det är användbart för manuella kontroller, men schemalagda förnyelser är ofta renare som en companion-container: </p>"
use_status_before_renew_when_testing_a_new_mount_layout = "<p>Använd <code>status</code> före <code>renew</code> när du testar en ny monteringslayout: </p>"
for_compose_keep_fluxheim_and_fluxheim_acme_on_the_same_network_and_use_the_same_bind_mounts_the_com = "<p>För Compose, behåll <code>fluxheim</code> och <code>fluxheim-acme</code> i samma nätverk och använd samma bindningsfästen. Den medföljande tjänsten bör endast åsidosätta ingångspunkten och kommandot:</p>"
run_it_on_demand_with = "<p>Kör den på begäran med:</p>"
for_scheduled_container_renewals_use_a_host_systemd_timer_kubernetes_cronjob_or_the_platform_schedul = "<p>För schemalagda containerförnyelser, använd en värd systemd-timer, Kubernetes CronJob eller plattformsschemaläggaren för att starta en engångsföljare. Behåll <code>tls.acme.automation = &quot;external&quot;</code> så att gatewayen inte också kör bakgrundsförnyelseloopen.</p>"
runtime_crate_candidates = "<h2 id=\"runtime-crate-candidates\">Kandidater för runtime-crates</h2>"
latest_checked_acme_runtime_candidates = "<p> Senaste kontrollerade ACME runtime-kandidater: </p>"
instant_acme_0_8_5_apache_2_0_async_pure_rust_acme_client_with_eab_support_this_is_the_current_first = "<li><code>instant-acme 0.8.5</code>: Apache-2.0, asynkron pure-Rust ACME-klient med EAB-stöd. Detta är den nuvarande första kandidaten eftersom den inte äger lyssnarmodellen TLS.</li>"
rustls_acme_0_15_1_apache_2_0_or_mit_useful_reference_for_rustls_focused_certificate_management_but = "<li><code>rustls-acme 0.15.1</code>: Apache-2.0 OR MIT, användbar referens för rustls-fokuserad certifikathantering, men mindre i linje med Fluxheims multipla Pingora TLS backend-mål.</li>"
fips_iso_required_deployments = "<h2 id=\"fips-iso-required-deployments\">FIPS/ISO-Obligatoriska distributioner</h2>"
managed_fluxheim_acme_is_intentionally_outside_the_strict_fips_iso_required_runtime_boundary_in_1_3 = "<p>Managed Fluxheim ACME ligger avsiktligt utanför den strikta FIPS/ISO-krävda körtidsgränsen i <code>1.3.6</code>. En konfiguration med <code>[tls.fips] required = true</code> eller <code>[tls.iso19790] required = true</code> avvisar <code>[tls.acme] enabled = true</code> eftersom ACME-kontonyckelgenerering, JWS-kontosignering, HMAC för extern kontobindning, utgående ACME HTTPS-transport och certifikatgenerering inte helt går genom den valda validerade leverantören.</p>"
for_regulated_deployments_use_local_static_certificate_files_in_vhosts_tls_certificate_and_renew_the = "<p>För reglerade distributioner, använd lokala statiska certifikatfiler i <code>[vhosts.tls.certificate]</code> och förnya dem med en extern process som har sitt eget bevispaket. Om den externa processen är ACME-baserad, behåll ACME-klientversionen, värd FIPS/ISO-läge, nyckelgenereringspolicy, CA/revisionsbevis och förnyelseloggar med distributionsbeviset. Konservativa PKI-profiler på den offentliga webben bör begära RSA 2048 eller RSA 3072 certifikatnycklar om inte bedömaren uttryckligen accepterar den valda ECDSA-certifikatprofilen och kedjan.</p>"
the_fluxheim_acme_storage_path_hashing_uses_sha_256_and_does_not_use_md5_for_local_account_or_certif = "<p> Fluxheim ACME-lagringssökvägshasningen använder SHA-256 och använder inte MD5 för lokala konto- eller certifikatkatalogetiketter, men det räcker inte för att göra hanterade ACME till en del av den godkända kryptografiska gränsen. Behandla <code>fluxheim-acme</code> som ett normalt automationsverktyg om inte och tills den hanteras ACME har leverantörsdirigerad signering, nyckelgenerering, EAB och utgående TLS-bevis.</p>"
retry_policy = "<h2 id=\"retry-policy\">Försök policy igen</h2>"
failed_renewal_attempts_should_retry_with_bounded_backoff = "<p> Misslyckade förnyelseförsök bör försöka igen med begränsad backoff:</p>"
start_at_tls_acme_renewal_retry_initial_secs = "<li>start på <code>tls.acme.renewal.retry_initial_secs</code></li>"
grow_up_to_tls_acme_renewal_retry_max_secs = "<li> växa upp till <code>tls.acme.renewal.retry_max_secs</code></li>"
never_remove_the_currently_active_certificate_because_of_a_failed_renewal = "<li> Ta aldrig bort det för närvarande aktiva certifikatet på grund av en misslyckad förnyelse</li>"
the_scheduler_should_wake_at_least_every_tls_acme_renewal_check_interval_secs_to_catch_newly_due_cer = "<p> Schemaläggaren bör väcka minst varje <code>tls.acme.renewal.check_interval_secs</code> för att fånga nya certifikat och konfigurationsändringar.</p>"
atomic_install = "<h2 id=\"atomic-install\">Atomär installation</h2>"
renewed_certificates_must_be_installed_atomically = "<p>Förnyade certifikat måste installeras atomiskt: </p>"
write_certificate_and_key_to_temporary_files_in_the_acme_storage_directory = "<li>Skriv certifikat och nyckel till temporära filer i lagringskatalogen ACME.</li>"
validate_that_the_certificate_parses_matches_the_private_key_and_covers_the_configured_domains = "<li>Validera att certifikatet analyserar, matchar den privata nyckeln och täcker de konfigurerade domänerna.</li>"
flush_files_and_directory_metadata_where_the_platform_supports_it = "<li>Flush filer och katalogmetadata där plattformen stöder det.</li>"
rename_temporary_files_into_place = "<li>Byt namn på temporära filer på plats.</li>"
keep_the_previous_certificate_available_until_the_new_one_is_active = "<li>Håll det tidigare certifikatet tillgängligt tills det nya är aktivt.</li>"
the_current_install_helper_implements_the_filesystem_side_of_that_contract_it_validates_basic_pem_sh = "<p>Den nuvarande installationshjälpen implementerar filsystemsidan av det kontraktet. Den validerar grundläggande PEM-form och -storlek, skriver temporära filer bredvid den hanterade destinationen, avvisar symboliska kataloger eller destinationsfiler, behåller säkerhetskopior av befintliga filer under iscensättning och rensar tillfälliga filer vid fel. Fullständig matchning av certifikat/nyckel och domäntäckningsvalidering hör hemma i ACME-klientsteget innan denna hjälpare anropas. Misslyckade utfärdaranrop och misslyckade certifikatinstallationer tar inte bort det tidigare aktiva certifikatet.</p>"
no_downtime_reload = "<h2 id=\"no-downtime-reload\">Ingen nedetid Ladda om </h2>"
runtime_state_should_be_immutable_snapshots_behind_an_atomic_pointer_existing_requests_keep_their_cu = "<p>Runtime-tillståndet bör vara oföränderliga ögonblicksbilder bakom en atompekare. Befintliga förfrågningar behåller sin nuvarande ögonblicksbild. Nya förfrågningar använder den senaste ögonblicksbilden efter omladdning. Fluxheims proxydirigeringstillstånd använder redan denna modell för vhost, uppströms, cache och statiska ögonblicksbilder av webbpolicy. Denna modell gäller för:</p>"
vhost_routing = "<li>vhost-routing</li>"
upstream_pools = "<li>upstream pooler</li>"
cache_policies = "<li>cachepolicyer</li>"
certificate_lookup_maps = "<li> certifikatsökningskartor</li>"
listener_changes_are_process_level_changes_and_should_use_pingoras_zero_downtime_upgrade_path_rather = "<p>Listener-ändringar är förändringar på processnivå och bör använda Pingoras uppgraderingsväg utan driftstopp snarare än mutation på plats.</p>"
reload_classification = "<h2 id=\"reload-classification\">Ladda om klassificering</h2>"
fluxheim_classifies_a_config_change_before_applying_it = "<p>Fluxheim klassificerar en konfigurationsändring innan den tillämpas: </p>"
noop_old_and_new_config_are_identical = "<li><code>Noop</code>: gamla och nya konfigurationer är identiska.</li>"
snapshot_safe_for_in_place_snapshot_swap = "<li><code>Snapshot</code>: säkert för att byta ögonblicksbild på plats.</li>"
processupgrade_requires_pingoras_process_level_zero_downtime_upgrade_path = "<li><code>ProcessUpgrade</code>: kräver Pingoras uppgraderingsväg utan driftstopp på processnivå. </li>"
operators_can_check_the_impact_of_a_planned_config_change = "<p>Operatorer kan kontrollera effekten av en planerad konfigurationsändring:</p>"
durable_config_history_and_rollback_commands_are_documented_in_config_snapshots_and_rollback = "<p>Tålig konfigurationshistorik och återställningskommandon finns dokumenterade i <a href=\"config-snapshots.html\" class=\"text-cyan-400 hover:text-cyan-300\">Config Snapshots And Rollback</a>.</p>"
snapshot_reload_is_intended_for_routing_cache_policy_static_web_policy_and_certificate_lookup_change = "<p>Snapshot reload är avsedd för routing, cachepolicy, statisk webbpolicy och certifikatuppslagsändringar som inte ändrar lyssnare eller nystartade bakgrundstjänster.</p>"
process_upgrade_is_required_when = "<p>Processuppgradering krävs när:</p>"
listener_addresses_change = "<li>listener adresser change</li>"
downstream_tls_mode_changes = "<li>nedströms TLS lägesändringar</li>"
the_configured_tls_backend_changes = "<li>de konfigurerade TLS-backend-ändringarna</li>"
load_balancer_background_service_registration_ownership_changes = "<li>load-balancer bakgrundstjänstregistrering/ägarförändringar</li>"
this_keeps_the_hot_reload_path_conservative_until_fluxheim_has_explicit_runtime_ownership_for_adding = "<p>Detta håller hot-reload-vägen konservativ tills Fluxheim har explicit körtidsäganderätt för att lägga till och ta bort bakgrundstjänster efter uppstart.</p>"

[logging_architecture]
logging_architecture_fluxheim_source_docs = "<title>Logging Architecture — Fluxheim Källdokument</title>"
logging_architecture = "<h1 id=\"logging-architecture\">Loggingarkitektur</h1>"
fluxheim_logging_should_be_structured_asynchronous_and_explicit_about_the_tradeoff_between_reque = "<p>Fluxheim loggning bör vara strukturerad, asynkron och explicit om kompromissen mellan fördröjningsfördröjning och hållbarhet. Loggning får aldrig dölja säkerhetsrelevanta händelser, och fjärrloggningsfel får inte bryta normal trafik.</p>"
goals = "<h2 id=\"goals\">Mål</h2>"
use_tracing_as_the_core_instrumentation_api = "<li>Använd <code>tracing</code> som kärninstrument API.</li>"
emit_production_logs_as_json_through_serde_backed_formatting = "<li>Emit produktionsloggar som JSON genom serde-backed formatering.</li>"
keep_stdout_available_as_the_default_sink_for_systemd_podman_and_local_debugging = "<li>Håll standard tillgänglig som standardsink för systemd, Podman och lokal debugging.</li>"
avoid_disk_or_network_writes_on_request_worker_hot_paths = "<li>Undvik disk- eller nätverksskrivningar på begäran av arbetsvägar.</li>"
add_remote_logging_only_behind_explicit_config_and_optional_compile_features = "<li>Lägg till fjärrloggning endast bakom explicit konfiguration och valfria kompileringsfunktioner.</li>"
make_overflow_behavior_explicit_instead_of_pretending_logs_are_always_both_non_blocking_and_loss = "<li>Gör översvämningsbeteendet explicit istället för att låtsas att loggar alltid är både icke-blockerande och förlustfria.</li>"
latest_reviewed_crates = "<p>Senast granskade crates:</p>"
tracing_0_1_44_mit = "<li><code>tracing 0.1.44</code>, MIT.</li>"
tracing_subscriber_0_3_23_mit = "<li><code>tracing-subscriber 0.3.23</code>, MIT.</li>"
tracing_appender_0_2_5_mit = "<li><code>tracing-appender 0.2.5</code>, MIT.</li>"
tracing_serde_0_2_0_mit = "<li><code>tracing-serde 0.2.0</code>, MIT.</li>"
log_classes = "<h2 id=\"log-classes\">Loggklasser</h2>"
fluxheim_should_split_logs_by_intent = "<p>Fluxheim bör dela loggar efter avsikt: </p>"
access_one_event_per_completed_request = "<li><code>access</code>: en händelse per slutförd begäran.</li>"
error_internal_failures_and_unexpected_runtime_errors = "<li><code>error</code>: interna fel och oväntade körtidsfel.</li>"
security_rejected_requests_request_smuggling_attempts_admin_auth_failures_path_traversal_denied = "<li><code>security</code>: avvisade förfrågningar, försök att smuggla förfrågningar, misslyckanden i administratörsbehörighet, korsning av sökväg, nekad PHP/CGI-körning och TLS/certifikatbehörighetsfel.</li>"
audit_admin_operations_such_as_snapshot_rollback_reload_purge_cache_activity_reset_load_balancer = "<li><code>audit</code>: administratörsåtgärder som ögonblicksbild, återställning, omladdning, rensning, återställning av cacheaktivitet, belastningsbalanserande medlemsstat, medlemsvikt eller mutation i backend-set, certifikatförnyelse och framtida konto-/nyckeländringar.</li>"
security_and_audit_logs_should_not_be_silently_disabled_per_vhost_they_may_be_rerouted_or_filter = "<p> Säkerhets- och granskningsloggar bör inte inaktiveras tyst per vhost. De kan omdirigeras eller filtreras efter nivå, men Fluxheim bör göra inaktivering av dem till ett explicit val av högriskoperatör. </p>"
event_fields = "<h2 id=\"event-fields\">Händelsefält</h2>"
access_events_should_include = "<p>Access-händelser bör inkludera: </p>"
timestamp = "<li>tidsstämpel</li>"
level = "<li>nivå</li>"
target_module = "<li>mål/modul</li>"
request_id = "<li>request_id</li>"
vhost = "<li>vhost</li>"
method = "<li>metod</li>"
path = "<li>sökväg</li>"
query_present = "<li>query_present</li>"
protocol = "<li>protokoll</li>"
status = "<li>status</li>"
latency_ms = "<li>latency_ms</li>"
remote_addr = "<li>remote_addr</li>"
user_agent_length_capped = "<li>user_agent, längdavgränsad</li>"
referer_length_capped = "<li>referer, längdkapslad</li>"
upstream_when_proxied = "<li>upstream, när fullmakt </li>"
cache_status_when_cache_participates = "<li>cache_status, när cachen deltar</li>"
tls_when_known = "<li>tls, när känd</li>"
legacy_protocol_when_future_legacy_static_listeners_are_used = "<li>legacy_protocol, när framtida äldre statiska lyssnare används</li>"
audit_security_events_should_include_action_outcome_fields_and_avoid_raw_secret_values = "<p>Revisions-/säkerhetshändelser bör inkludera åtgärds-/resultatfält och undvika råa hemliga värden.</p>"
pipeline = "<h2 id=\"pipeline\">Loggningspipeline</h2>"
the_desired_pipeline_has_three_stages = "<p>Den önskade pipelinen har tre steg: </p>"
capture_request_path_emits_tracing_events_with_structured_fields = "<li>Fångst: begäranssökvägen avger <code>tracing</code>-händelser med strukturerade fält.</li>"
buffer_events_enter_a_bounded_async_queue = "<li>Buffert: händelser går in i en avgränsad asynkron kö.</li>"
dispatch_a_background_dispatcher_writes_to_configured_sinks = "<li>Dispatch: en bakgrundsavsändare skriver till konfigurerade sänkor.</li>"
the_request_worker_must_never_perform_slow_remote_network_logging_directly = "<p>Förfrågningsarbetaren får aldrig utföra långsam fjärrnätverksloggning direkt.</p>"
overflow_policy = "<h2 id=\"overflow-policy\">Överflödespolicy</h2>"
fluxheim_must_expose_an_explicit_overflow_policy = "<p>Fluxheim måste exponera en explicit överflödespolicy: </p>"
drop_new_fastest_increments_dropped_log_metrics = "<li><code>drop_new</code>: snabbast; ökar tappad-logg metrics.</li>"
block_preserves_logs_but_can_slow_request_handling = "<li><code>block</code>: bevarar loggar men kan fördröja hanteringen av förfrågningar.</li>"
spool_writes_to_a_bounded_durable_disk_queue_best_durability_but_more_operational_complexity = "<li><code>spool</code>: skriver till en avgränsad varaktig diskkö; bästa hållbarhet men mer operativ komplexitet.</li>"
without_spool_fluxheim_must_not_claim_zero_data_loss_with_block_fluxheim_must_not_claim_zero_req = "<p>Utan <code>spool</code> får Fluxheim inte göra anspråk på noll dataförlust. Med <code>block</code> får Fluxheim inte göra anspråk på noll fördröjningspåverkan. </p>"
sinks = "<h2 id=\"sinks\">Sänkor</h2>"
initial_sinks = "<p>Initiala sänkor: </p>"
stdout_default = "<li><code>stdout</code>: standard.</li>"
file_optional_structured_local_file = "<li><code>file</code>: valfri strukturerad lokal fil.</li>"
remote_tcp_tls_future_production_sink_for_vector_logstash_or_similar = "<li><code>remote_tcp_tls</code>: framtida produktionssänka för Vector, Logstash eller liknande.</li>"
remote_udp_future_non_critical_sink_only_never_for_audit_security = "<li><code>remote_udp</code>: endast framtida icke-kritisk sink; aldrig för revision/säkerhet.</li>"
remote_sinks_should_be_optional_compile_time_support_for_example_logging_remote_durable_disk_que = "<p>Fjärrsänkor bör vara valfritt kompileringstidsstöd, till exempel <code>logging-remote</code>. Stöd för hållbar diskkö bör ligga bakom <code>logging-spool</code>.</p>"
circuit_breaker = "<h2 id=\"circuit-breaker\">Circuit breaker</h2>"
remote_dispatch_should_use_a_circuit_breaker = "<p>Fjärrsändning bör använda en circuit breaker:</p>"
connected_send_to_remote_sink = "<li><code>connected</code>: skicka till fjärrsink.</li>"
tripped_remote_failed_write_to_stdout_or_spool = "<li><code>tripped</code>: fjärrsink misslyckades; skriv till stdout eller spool.</li>"
recovering_attempt_periodic_reconnect_heartbeat = "<li><code>recovering</code>: försök periodisk återansluta/heartbeat.</li>"
on_send_failure_the_dispatcher_should_immediately_fallback_for_that_event_trip_the_remote_sink_a = "<p> Vid sändningsfel bör avsändaren omedelbart fallback för den händelsen, lösa ut fjärrsänkan och öka mätvärdena. Återanslutningsförsök bör använda gränsad exponentiell backoff.</p>"
security_requirements = "<h2 id=\"security-requirements\"> Säkerhetskrav</h2>"
redact_authorization_cookie_set_cookie_admin_bearer_tokens_acme_eab_values_api_keys_and_configur = "<li>Maskera <code>Authorization</code>, <code>Cookie</code>, <code>Set-Cookie</code>, admin-bearer-tokens, ACME EAB-värden, API-nycklar och konfigurerade känsliga rubriker/fält.</li>"
never_log_request_bodies_by_default = "<li>Logga aldrig begärandekroppar som standard.</li>"
length_cap_paths_headers_error_messages_and_upstream_error_text = "<li>Längdbegränsa sökvägar, rubriker, felmeddelanden och uppströms feltext.</li>"
use_serde_json_formatting_not_hand_built_json_strings = "<li>Använd serde/JSON-formatering, inte handbyggda JSON-strängar.</li>"
mark_fallback_source_for_example_log_sink_stdout_fallback_or_log_sink_spool_fallback = "<li>Märk reservkälla, till exempel <code>log_sink=&quot;stdout-fallback&quot;</code> eller <code>log_sink=&quot;spool-fallback&quot;</code>.</li>"
make_audit_security_logs_available_to_stdout_even_when_remote_logging_fails = "<li>Gör gransknings-/säkerhetsloggar tillgängliga för stdout även när fjärrloggning misslyckas.</li>"
protect_local_log_files_and_spool_directories_with_owner_only_permissions_where_supported = "<li> Skydda lokala loggfiler och spoolkataloger med ägarbehörigheter där det stöds.</li>"
config_shape = "<h2 id=\"config-shape\">Konfigurationsform</h2>"
initial_target = "<p>Initialt mål:</p>"
implemented_baseline_logging_access_enabled_controls_a_compact_json_access_event_emitted_from_pi = "<p>Implementerad baslinje: <code>logging.access.enabled</code> styr en kompakt JSON-åtkomsthändelse som sänds ut från Pingoras <code>logging</code>-hook. Den registrerar metod, valfri rå host, vhost, valfri sökväg utan query, status, statusklass med låg kardinalitet, felflagga, request-ID, observerade request body-bytes, observerade response body-bytes och latens. Om request-ID:n är aktiverade återanvänder Fluxheim ett giltigt inkommande request-ID från <code>request_id_header</code> eller genererar ett och skickar det uppströms innan normala rubrikpolicymutationer körs. Denna baslinje använder den befintliga <code>log</code>-stacken. stderr/stdout och en inaktiverad som standard <code>[logging.file]</code>-sink implementeras; den asynkrona dispatchern och fjärrsinkar förblir framtida arbete.</p>"
logging_level_and_logging_format_are_applied_at_startup_through_env_logger_rust_log_can_still_ov = "<p><code>logging.level</code> och <code>logging.format</code> tillämpas vid start genom <code>env_logger</code>; <code>RUST_LOG</code> kan fortfarande åsidosätta nivån för lokal felsökning. Att ändra någon av inställningarna efter start kräver för närvarande en processuppgradering eftersom loggern initieras en gång. JSON-format avger strukturerade interna körtidsposter, medan åtkomsthändelser förblir direkta JSON-åtkomstposter.</p>"
implementation_stages = "<h2 id=\"implementation-stages\">Implementeringsstadier</h2>"
add_typed_access_log_config_request_ids_and_baseline_json_access_events_through_log = "<li>Lägg till typad åtkomstloggkonfiguration, request-ID:n och baslinje-JSON-åtkomsthändelser genom <code>log</code>.</li>"
add_tracing_json_stdout_formatting_and_bridge_existing_log_records = "<li>Lägg till <code>tracing</code>, JSON standardformatering och överbrygga befintliga <code>log</code>-poster.</li>"
add_access_security_audit_event_schema_and_request_ids = "<li>Lägg till schema för åtkomst/säkerhet/revisionshändelse och begär ids.</li>"
add_bounded_dispatcher_queue_with_drop_new_and_block_policies = "<li>Lägg till avgränsad dispatcherkö med <code>drop_new</code>- och <code>block</code>-policyer.</li>"
add_file_sink_and_protected_local_spool_directory = "<li>Lägg till filsink och skyddad lokal spoolkatalog.</li>"
add_remote_tcp_tls_sink_with_circuit_breaker_and_fallback = "<li>Lägg till fjärr-TCP/TLS-sink med circuit breaker och reserv.</li>"
expose_log_health_through_prometheus_admin_status_dropped_logs_spooled_logs_remote_failures_curr = "<li>Exponera loggtillstånd genom Prometheus/adminstatus: tappade loggar, spoolade loggar, fjärrfel, aktuellt kretstillstånd och återanslutningsförsök.</li>"
tests = "<h2 id=\"tests\">Tester</h2>"
required_tests = "<p>Nödvändiga tester:</p>"
json_output_contains_expected_request_fields = "<li>JSON-utgången innehåller förväntade begärandefält.</li>"
secret_fields_are_redacted = "<li>Hemliga fält maskeras.</li>"
long_fields_are_capped = "<li>Långa fält är begränsade.</li>"
