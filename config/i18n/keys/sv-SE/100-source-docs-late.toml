after_initialization_add_vhosts_tls_acme_blocks_to_the_vhosts_that_should_receive_managed_certificat = "<p>Efter initiering, lägg till <code>[vhosts.tls.acme]</code>-block till vhosts som ska ta emot hanterade certifikat, ladda om systemd när en drop-in skapades och kör förnyelsekommandot:</p>"
