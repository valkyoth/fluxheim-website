metrics_and_access_logs_must_label_legacy_protocol_traffic_clearly = "<li>Mätvärden och åtkomstloggar måste märka äldre protokolltrafik tydligt.</li>"
relationship_to_pingora_smuggling_advisories = "<h2 id=\"relationship-to-pingora-smuggling-advisories\">Förhållande till Pingora Smuggling Advisories</h2>"
pingora_versions_before_0_8_0_had_http_request_smuggling_vulnerabilities_around_http_1_0_transfe = "<p>Pingora-versioner före <code>0.8.0</code> hade HTTP-sårbarheter för smuggling av förfrågningar kring HTTP/1.0-överföringskodningsanalys och för tidig uppgraderingshantering. Fluxheim spårar redan Pingora <code>0.8.0</code>, men äldre support måste fortfarande lägga till ett eget strängare avvisningslager eftersom kompatibilitetslägen är särskilt utsatta för tvetydiga analysattacker.</p>"
legacy_support_must_not_weaken_the_normal_modern_listener_behavior = "<p>Legacy-stöd får inte försvaga det normala moderna lyssnarbeteendet.</p>"

