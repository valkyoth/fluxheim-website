[advanced_page]
advanced_001_advanced_features = "Avancerade funktioner"
advanced_002_php_fpm_proxy_operations_admin_api_zero_retention_privacy_mode_waf_wasm = "PHP-FPM, proxyoperationer, admin API, integritetsläge med nollretention, WAF, WASM utbyggbarhet och planerade framtida moduler."
advanced_003_php_fpm_bridge = "PHP-FPM-brygga"
advanced_004_available_since_v1_3_1_via_the_php_fpm_cargo_feature_the = "Tillgänglig sedan v1.3.1 via Cargo-funktionen <code>php-fpm</code>. PHP-FPM-bryggan ansluter Fluxheim till en körande PHP-FPM-pool med FastCGI-protokollet. Den stöder front-controller-appar i WordPress-stil med strikt skriptupplösning och avgränsad begärande-/svarshantering."
advanced_005_bash_build_with_php_fpm_support = "bash — bygg med PHP-FPM-stöd"
advanced_006_fluxheim_toml_wordpress_front_controller = "fluxheim.toml — WordPress frontkontroller"
advanced_007_managed_php_fpm = "Hanterad PHP-FPM"
advanced_008_included_in_current_v1_6_28_builds_and_introduced_in_v1_3 = "Ingår i nuvarande version 1.6.28 och introducerades i version 1.3.7. Hanterat läge behåller samma sökväg för FastCGI/php-fpm-begäranden, men Fluxheim startar och övervakar en privat php-fpm-masterprocess för varje vhost. Extern php-fpm förblir standard; använd hanterat läge när Fluxheim ska generera poolkonfigurationen och äga den privata socketens livscykel."
advanced_009_fluxheim_toml_managed_php_fpm_pool = "fluxheim.toml — hanterad php-fpm-pool"
advanced_010_do_not_set_socket_tcp_or_tcp_upstreams_in_managed_mode_fluxheim = "Ställ inte in <code>socket</code>, <code>tcp</code> eller <code>tcp_upstreams</code> i hanterat läge. Fluxheim skapar den privata Unix-sockeln under <code>socket_dir</code>, genererar php-fpm-poolfilerna, stänger av mastern vid omladdning eller avstängning av gatewayen och återskapar den med begränsad backoff om den kraschar efter start."
advanced_011_how_php_routing_works = "Hur PHP-routing fungerar"
advanced_012_requests_for_existing_php_files_are_routed_directly_to_php_fpm = "Begäranden om befintliga <code>.php</code>-filer dirigeras direkt till PHP-FPM"
advanced_013_requests_for_non_existent_files_fall_back_to_the_front_controller_index = "Begäranden om filer som inte finns faller tillbaka till front-controllern (<code>index.php</code>)"
advanced_014_static_assets_css_js_images_are_served_directly_without_touching_php_fpm = "Statiska resurser (<code>.css</code>, <code>.js</code>, bilder) serveras direkt utan att röra PHP-FPM"
advanced_015_script_resolution_is_strict_only_files_within_the_configured_php_root_are = "Skriptupplösningen är strikt — endast filer inom den konfigurerade PHP <code>root</code> skickas till FPM"
advanced_016_fluxheim_acme_companion = "fluxheim-acme companion"
advanced_017_released_in_v1_3_2_fluxheim_acme_is_a_standalone_companion_binary = "Släppt i v1.3.2. <code>fluxheim-acme</code> är en fristående kompletterande binär för hantering av ACME-certifikatförnyelse och omladdningsoperationer utanför huvudgatewayprocessen. Den är designad för container- och externa servicehanterare där gatewayen inte äger förnyelselivscykeln."
advanced_018_bash_fluxheim_acme_operations = "bash — fluxheim-acme operationer"
advanced_019_the_acme_reload_socket_lets_fluxheim_acme_signal_the_running_gateway_to = "ACME reload socket låter <code>fluxheim-acme</code> signalera den löpande gatewayen för att hämta nyligen utfärdade certifikat utan en fullständig omstart. Konfigurera sockelvägen i ditt <code>[server]</code>-block."
advanced_020_fluxheim_toml_acme_reload_socket = "fluxheim.toml — ACME reload-socket"
advanced_021_fluxheim_config_tester = "fluxheim-config-testare"
advanced_022_released_in_v1_3_2_fluxheim_config_tester_is_a_standalone_binary = "Släppt i v1.3.2. <code>fluxheim-config-tester</code> är en fristående binär som validerar en Fluxheim-konfigurationsfil utan att starta gatewayen. Användbar i CI-pipelines och container-ingångspunkter där konfigurationsfel ska fångas upp innan de appliceras på en pågående tjänst."
advanced_023_bash_validate_config_before_apply = "bash — validera konfigurationen innan applicering"
advanced_024_proxy_operations = "Proxyoperationer"
advanced_025_fluxheim_v1_4_x_adds_migration_focused_proxy_operations_on_top_of = "Fluxheim v1.4.x lägger till migrationsfokuserade proxyoperationer ovanpå 1.4.0 proxyparitetsbaslinjen: regexrutter, metodrouting, WebSocket-uppgraderingar, autentiseringsförfrågningar, säker trafikspegling, dynamisk uppströmsupptäckt och en skrivskyddad lokal ops-socket."
advanced_026_fluxheim_toml_proxy_operations = "fluxheim.toml — proxyoperationer"
advanced_027_regex_support_is_disabled_until_server_regex_enabled_true_is_set_traffic = "Regex-stöd är inaktiverat tills <code>server.regex_enabled = true</code> är inställt. Trafikspegling kompileras genom <code>traffic-mirror</code>-funktionen och speglar endast säkra kroppslösa metoder; det ändrar aldrig det primära svaret."
advanced_028_zero_retention_privacy_mode = "Integritetsläge med noll lagring"
advanced_029_the_privacy_mode_feature_compiles_fluxheim_without_any_caching_or_metrics_functionality = "<code>privacy-mode</code>-funktionen kompilerar Fluxheim utan någon cache- eller mätfunktionalitet, vilket tvingar fram noll logglagring på byggnivå. Detta är lämpligt för integritetskänsliga distributioner där ingen förfrågningsdata ska lagras eller exporteras."
advanced_030_bash_zero_retention_privacy_build = "bash — integritetsbygge med nollretention"
advanced_031_what_privacy_mode_enforces = "Vad privacy-mode upprätthåller"
advanced_032_no_cache_module_compiled_caching_is_impossible_at_the_binary_level = "Ingen cachemodul kompilerad — cachelagring är omöjlig på binär nivå"
advanced_033_no_metrics_module_compiled_no_prometheus_or_otlp_export = "Ingen metrikmodul kompilerad — ingen Prometheus eller OTLP export"
advanced_034_access_logs_may_be_disabled_in_the_config = "Åtkomstloggar kan vara inaktiverade i konfigurationen"
advanced_035_compile_time_guarantee_no_data_is_stored_no_external_telemetry_is_exported = "Garanti för kompileringstid: ingen data lagras, ingen extern telemetri exporteras"
advanced_036_admin_api = "Admin-API"
advanced_037_the_admin_control_plane_exposes_a_local_http_api_for_health_checks = "Administratörskontrollplanet exponerar ett lokalt HTTP-API för hälsokontroller, omladdning av konfiguration, cacherensning och statusfrågor. Det är som standard begränsat till loopback och kräver bearer-token på lyssnare som inte är loopback."
advanced_038_bash_admin_api_endpoints = "bash — admin-API-slutpunkter"
advanced_039_wasm_extensibility = "WASM-utbyggbarhet"
advanced_040_planned_v1_6 = "Planerad — v1.6"
advanced_041_fluxheim_s_wasm_extensibility_layer_is_planned_for_the_1_6_release = "Fluxheims WASM-utbyggbarhetslager är planerat för 1.6-versionen. Det ska stödja nginx-Lua-liknande begärande-/svarskrokar och VCL-liknande cachepolicykrokar genom WebAssembly-moduler."
advanced_042_compile_time_opt_in_wasm_feature = "<code>wasm</code>-funktion för kompileringstid"
advanced_043_hook_points_request_received_upstream_response_cache_policy_response_send = "Hook points: begäran mottagen, uppströmssvar, cachepolicy, svar skickas"
advanced_044_shared_memory_model_between_wasm_modules_and_the_host = "Delat minnesmodell mellan WASM-moduler och värden"
advanced_045_sandboxed_execution_with_bounded_resource_limits = "Sandlådekörning med avgränsade resursgränser"
advanced_046_waf_architecture = "WAF arkitektur"
advanced_047_planned_future = "Planerad — framtid"
advanced_048_a_web_application_firewall_module_is_documented_in_the_architecture_but_not = "En Web Application Firewall-modul är dokumenterad i arkitekturen men är inte aktiverad i de aktuella stabila byggena. Den är planerad som en valfri kompileringsmodul med regelbaserad begärandefiltrering, hastighetsbegränsning per IP/sökväg/metod och konfigurerbara block-, logg- och challenge-svar."
advanced_049_load_balancer = "Lastbalanserare"
advanced_050_the_load_balancer_feature_adds_fluxheim_s_load_balancer_control_plane_and = "<code>load-balancer</code>-funktionen lägger till Fluxheims belastningsbalanserande kontrollplan och hälsokontroller till proxykörningstiden. Den är opt-in och tillgänglig idag via <code>profile-load-balancer</code> eller <code>profile-load-balancer-edge</code>."
