r1712_released_july_15_2026 = "Släppt 15 juli 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Lägger till opt-in standardbaserad cache, proxy och responssammanfattningsmetadata"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Bevisar autentiserad omladdning av ögonblicksbilder i realtid, återställning, integritetskontroller och omstartsbeständighet"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Lägger till reproducerbara FIPS-backend-bevis och bred native runtime-härdning"
r1712_whats_next_summary = "lägger till metadata för opt-in-standarder, autentiserad återställningssäker för ögonblicksbilder, reproducerbara FIPS-backend-bevis och starkare cache, TLS, Wasm, buffring och strömningsgränser."
r1712_release_series_digest = "Fluxheim 1.7 releaseserie: opt-in standardbaserad cache, proxy och responssammandragsmetadata; autentiserad live ögonblicksbild återladdning och återställning; reproducerbara FIPS-backend bevis; processuppgraderingar utan driftstopp; oberoende testade Wasm policyexempel; och starkare cache, TLS, buffring, strömning och protokollgränser."
r1712_standards_based_response_metadata = "Standardbaserad responsmetadata"
r1712_response_metadata_intro = "Svarsmetadata är inaktiverat som standard. Aktivera endast de fält du behöver; Fluxheim härleder dem från det faktiska cacheresultatet, proxyfel och slutliga svarsbytes utan att exponera cache-nycklar, backend-adresser, DNS-namn eller råfel."
r1712_field = "Fält"
r1712_what_it_reports = "Vad den rapporterar"
r1712_cache_status_description = "RFC 9211 cacheresultat som träff, miss, inaktuell vidarebefordran, förlängning, utgång och bypass."
r1712_proxy_status_description = "RFC 9209 detaljer med låg kardinalitet för fel som genereras av Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 över det slutliga innehållet i HTTP efter komprimering."
r1712_repr_digest_description = "SHA-256 endast när Fluxheim innehåller den fullständiga valda representationen."
r1712_live_snapshots_and_rollback = "Live ögonblicksbilder och rollback"
r1712_live_snapshot_intro = "Autentiserade ögonblicksbilder kan publicera en validerad kandidat, ersätta liveroutern och rulla tillbaka utan att starta om normala distributioner av enbart routing. Varje begäran stannar på en routergeneration från början till slut."
r1712_snapshot_private_directory = "Håll ögonblicksbildsbutiken i en dedikerad privat katalog; befintliga icke-privata kataloger och filsystemrötter avvisas."
r1712_snapshot_process_upgrade = "Använd en processuppgradering när belastningsbalanserarens hälsa eller upptäcktstjänster är aktiva."
r1712_snapshot_integrity_restart = "Kör integritetskontroller för ögonblicksbilder efter publicering eller återställning och verifiera att den valda generationen överlever omstart."
r1712_read_snapshot_contract = "Läs hela ögonblicksbildskontraktet"
r1712_authorization_cache_bypass = "Förfrågningar som bär <code>Authorization</code> eller <code>Proxy-Authorization</code> kringgår alltid delad cachesökning och lagring."
r1712_strict_cache_control = "Felaktiga eller motstridiga svar <code>Cache-Control</code>-direktiv avvisas istället för att falla tillbaka till konfigurerade TTL:er; <code>s-maxage</code> har prioritet framför <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> och <code>s-maxage</code> förbjuder gammal återanvändning efter att färskheten upphört."
r1712_encrypted_cache_upgrade_note = "Uppgraderingsnotering om krypterad cache"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 flyttar krypterade diskcacheobjekt till rotbundna data och indexnycklar med varaktigt icke-tillstånd. Den första uppstarten mot en äldre krypterad rot, och varje rotation av lokal nyckel, kallrensar avsiktligt den cachen innan trafik betjänas."
r1712_encrypted_cache_disposable = "Behandla den krypterade cachen som engångsacceleration, inte källan till registreringen."
r1712_encrypted_cache_private_storage = "Ge varje cacherot beständig privat lagring och kopiera inte nonce-tillstånd mellan oberoende rötter."
r1712_encrypted_cache_warmup = "Planera ursprungskapacitet för den första uppvärmningen efter uppgradering eller vridning av knappar."
r1712_client_certificate_revocation = "Återkallelse av klientcertifikat"
r1712_client_certificate_revocation_intro = "När ömsesidiga TLS måste avvisa återkallade klientcertifikat, tillhandahåll ett begränsat PEM CRL-paket. Fluxheim validerar hela utfärdarkedjan och avvisar utgången eller ofullständig CRL-policy."
r1712_client_certificate_revocation_compliance = "Krävd klientautentisering i ett FIPS eller ISO-krävt överensstämmelseläge kräver också ett CRL-paket. Vanlig klientautentisering behåller återkallelse som en explicit opt-in."
r1712_fips_backend_evidence = "FIPS backend-bevis"
r1712_fips_backend_evidence_intro = "Fluxheim tillhandahåller separat stiftade CI-säkra miljöer för profilerna OpenSSL-FIPS och rustls/AWS-LC-FIPS. De bygger och kör den exakta profilbinären, utövar nedströms och certifikatverifierade uppströms TLS, avvisar inkompatibel policy och registrerar kompilator-, leverantörs-, beroende-, binär- och bildidentiteter."
r1712_fips_backend_evidence_boundary = "Detta är reproducerbara backend-bevis, inte FIPS-validering på produktnivå. Håll provbehållarna åtskilda från vanliga releasebilder och granska bevisen för den exakta versionen du distribuerar."
r1712_read_fips_evidence_guide = "Läs FIPS bevisguide"
r1712_loader_admission = "Kontroller för modulinläsning"
r1712_loader_admission_description = "Offentliga pluginmanifest måste innehålla en fast SHA-256-kontrollsumma. Högst två moduler kompileras samtidigt i hela processen. Kompilerad utdata har som standard en gräns på 32 MiB och får inte överstiga 256 MiB."
r1712_file_identity = "Filidentitet"
r1712_file_identity_description = "Fluxheim öppnar godkända plugin-filer utan att följa länkar, behåller det validerade vanliga filhandtaget och läser modulbytes från det handtaget utan att öppna sökvägen igen."
