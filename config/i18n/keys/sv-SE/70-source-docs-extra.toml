current_contains_the_active_snapshot_id_fluxheim_uses_an_atomically_replaced_pointer_file_instead_of = "<code>current</code> innehåller det aktiva ögonblicksbild-id. Fluxheim använder en atomärt ersatt pekarfil istället för en symbollänk. En symlink swap är en bra Linux-endast design, men pekarfilen håller butiken okomplicerad i rotlösa Podman, begränsade volymmonteringar och icke-Unix-utvecklingsmiljöer medan den fortfarande använder skriv-temp-och-byta namn-semantik."
snapshot_config_files_contain_the_validated_effective_config_written_back_as_toml_metadata_files_con = "Snapshot-konfigurationsfiler innehåller den validerade effektiva konfigurationen, skriven tillbaka som TOML. Metadatafiler innehåller ögonblicksbild-id, skapelsetid och valfritt operatörsmeddelande. Operatörsmeddelanden trimmas och begränsas till 4096 byte av icke-kontrollerande text innan de skrivs eller laddas. Genererade ögonblicksbild-ID innehåller Unix-tid plus en process-lokal sekvens; de inkluderar inte Fluxheim process-id."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_as = "Butiken är medvetet konservativ när det gäller filsysteminriktning. Snapshot-ID får endast innehålla ASCII bokstäver, siffror, <code>_</code> och <code>-</code>, och är begränsade till 128 byte; butiksroten kan inte innehålla <code>..</code> eller sitta under en symbolisk överordnad katalog; butiksroten och <code>configs</code>-katalogen måste vara riktiga kataloger; katalogen <code>configs</code> måste finnas kvar i ögonblicksbildsarkivet; och <code>current</code>, ögonblicksbild TOML-filer och metadata TOML-filer öppnas som vanliga filer. Symlinkade butiksrötter, pekare, konfiguration, metadata eller <code>configs</code>-sökvägar avvisas så att en återställning inte kan omdirigeras till en fil som inte är godkänd av operatören. Atomic-skrivningar kräver också en redan validerad riktig överordnad katalog och kommer inte att ersätta en symbolisk destination. Snapshot-läsningar är begränsade: <code>current</code> är begränsad till 4 KiB och ögonblicksbild TOML/metadata-läsningar är begränsade till 16 MiB. Snapshot-butiker är begränsade till 1024 ögonblicksbilder; Operatörer bör exportera eller beskära gamla ögonblicksbilder före den gränsen."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_2 = "Butiken är medvetet konservativ när det gäller filsysteminriktning. Snapshot-ID får endast innehålla ASCII bokstäver, siffror,"
