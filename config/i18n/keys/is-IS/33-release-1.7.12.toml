r1712_released_july_15_2026 = "Gefið út 15. júlí 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Bætir við innskráningu staðla-undirstaða skyndiminni, umboð og svar-uppdrætti lýsigögn"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Sannar staðfesta endurhleðslu í beinni skyndimynd, afturköllun, heilleikaskoðun og endurræsingu"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Bætir við endurgeranlegum FIPS-backend sönnunargögnum og víðtækri innbyggðri keyrslutímaherðingu"
r1712_whats_next_summary = "bætir við lýsigögnum um opt-in staðla, sannvottaðri skyndimyndarsönnun, endurtakanlegum FIPS-backend sönnunargögnum og sterkara skyndiminni, TLS, Wasm, biðminni og straumamörkum."
r1712_release_series_digest = "Fluxheim 1.7 útgáfuröð: lýsigögn sem byggja á stöðlum sem byggjast á vali á staðla, umboð og lýsigögn fyrir svörun; endurhleðsla og afturköllun í beinni skyndimynd; endurtakanlegar FIPS-backend sönnunargögn; núll niður í miðbæ ferli uppfærslu; sjálfstætt prófuð Wasm stefnudæmi; og sterkara skyndiminni, TLS, biðminni, streymi og samskiptamörk."
r1712_standards_based_response_metadata = "Staðlamiðuð svarlýsigögn"
r1712_response_metadata_intro = "Lýsigögn svars eru sjálfgefið óvirk. Virkjaðu aðeins þá reiti sem þú þarft; Fluxheim dregur þær frá raunverulegri skyndiminnisniðurstöðu, umboðsbilun og lokasvarbætum án þess að afhjúpa skyndiminnislykla, bakenda vistföng, DNS nöfn eða óunnar villur."
r1712_field = "Field"
r1712_what_it_reports = "Það sem það greinir frá"
r1712_cache_status_description = "RFC 9211 skyndiminni niðurstöður eins og högg, miss, gamaldags áframsending, framlenging, fyrning og framhjá."
r1712_proxy_status_description = "RFC 9209 upplýsingar með lágt kardinalitet fyrir bilanir sem myndast af Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 yfir loka innihaldi HTTP skilaboðanna eftir þjöppun."
r1712_repr_digest_description = "SHA-256 aðeins þegar Fluxheim geymir fullkomna valda framsetningu."
r1712_live_snapshots_and_rollback = "Lifandi skyndimyndir og afturköllun"
r1712_live_snapshot_intro = "Staðfestar skyndimyndir geta birt fullgiltan umsækjanda, skipt út beininum í beinni og snúið til baka án þess að endurræsa venjulega leiðaruppfærslu eingöngu. Hver beiðni er áfram á einni leiðarkynslóð frá upphafi til enda."
r1712_snapshot_private_directory = "Geymdu skyndimyndaverslunina í sérstakri einkaskrá; núverandi möppum sem ekki eru einkareknar og rótum skráakerfisins er hafnað."
r1712_snapshot_process_upgrade = "Notaðu ferliuppfærslu þegar heilbrigði eða uppgötvunarþjónusta í bakgrunni er virk."
r1712_snapshot_integrity_restart = "Keyrðu heilleikaathuganir á skyndimynd eftir birtingu eða afturköllun og staðfestu að valda kynslóðin lifi af endurræsingu."
r1712_read_snapshot_contract = "Lestu heildarmyndasamninginn"
r1712_authorization_cache_bypass = "Beiðnir sem bera <code>Authorization</code> eða <code>Proxy-Authorization</code> fara alltaf framhjá samnýttu skyndiminni leit og geymslu."
r1712_strict_cache_control = "Gallað eða misvísandi svar <code>Cache-Control</code> tilskipunum er hafnað í stað þess að falla aftur til stillt TTL; <code>s-maxage</code> hefur forgang fram yfir <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> og <code>s-maxage</code> banna gamaldags endurnotkun eftir að ferskleiki rennur út."
r1712_encrypted_cache_upgrade_note = "Athugasemd um uppfærslu á dulkóðuðu skyndiminni"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 flytur dulkóðaða diskskyndiminni hluti yfir á rótbundin gögn og vísitölulykla með varanlegu nonce ástandi. Fyrsta gangsetningin gegn eldri dulkóðuðu rótinni, og hver staðbundinn lykilsnúningur, kaldhreinsar skyndiminni viljandi áður en þú þjónar umferð."
r1712_encrypted_cache_disposable = "Meðhöndlaðu dulkóðaða skyndiminni sem einnota hröðun, ekki uppsprettu skráningar."
r1712_encrypted_cache_private_storage = "Gefðu hverri skyndiminni rót viðvarandi einkageymslu og afritaðu ekki óstöðugleika á milli sjálfstæðra róta."
r1712_encrypted_cache_warmup = "Skipuleggðu upphafsgetu fyrir fyrstu upphitun eftir uppfærslu eða snúning á lyklum."
r1712_client_certificate_revocation = "Afturköllun viðskiptavinavottorðs"
r1712_client_certificate_revocation_intro = "Þegar gagnkvæmt TLS verður að hafna afturkölluðum biðlaravottorðum, gefðu upp afmarkaða PEM CRL búnt. Fluxheim staðfestir alla útgefendakeðjuna og hafnar útrunnum eða ófullnægjandi CRL stefnu."
r1712_client_certificate_revocation_compliance = "Nauðsynleg auðkenning viðskiptavinar í FIPS eða ISO, sem krafist er samræmishamur, krefst einnig CRL búnts. Venjuleg auðkenning viðskiptavinar heldur afturköllun sem skýrri innskráningu."
r1712_fips_backend_evidence = "FIPS bakenda sönnunargögn"
r1712_fips_backend_evidence_intro = "Fluxheim býður upp á sérstaklega fest CI sönnunarumhverfi fyrir OpenSSL-FIPS og rustls/AWS-LC-FIPS sniðin. Þeir búa til og keyra nákvæmlega tvöfalda prófílinn, æfa downstream og vottorðsstaðfesta andstreymis TLS, hafna ósamrýmanlegri stefnu og skrá þýðanda, veitanda, ósjálfstæði, tvöfalda og myndauðkenni."
r1712_fips_backend_evidence_boundary = "Þetta er endurritanleg sönnunargögn fyrir bakhlið, ekki FIPS staðfesting á vörustigi. Haltu sönnunargámunum aðskildum frá venjulegum útgáfumyndum og skoðaðu sönnunargögnin fyrir nákvæma byggingu sem þú setur upp."
r1712_read_fips_evidence_guide = "Lestu FIPS sönnunarleiðbeiningar"
r1712_loader_admission = "Stýringar fyrir hleðslu eininga"
r1712_loader_admission_description = "Opinber viðbótarmyndrit verða að innihalda fast SHA-256-samantektargildi. Í öllu ferlinu eru í mesta lagi tvær einingar þýddar samtímis. Þýdd úttak hefur sjálfgefin mörk 32 MiB og má ekki fara yfir 256 MiB."
r1712_file_identity = "Skrá auðkenni"
r1712_file_identity_description = "Fluxheim opnar samþykktar viðbótaskrár án þess að fylgja tenglum, heldur viðurkenndu venjulegu skráarhandfangi og les einingabæti úr því handfangi án þess að opna slóðina aftur."
