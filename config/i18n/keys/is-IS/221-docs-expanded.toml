fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 heldur Wasm valfrjálsu og bætir við fyrstu valfrjálsu samhæfniforskoðuninni fyrir Proxy-Wasm ABI. Hún kemur á sérstöku, eiginleikastýrðu nafnrými hýsilkalla með strangri staðfestingu manifests og fyrirsjáanlegri lokaðri villumeðhöndlun fyrir óstudd köll; ekki er fullyrt að hvaða fyrirliggjandi Proxy-Wasm-viðbót sem er keyri óbreytt."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Þýddar einingar eru bundnar við digest viðbótar, ABI-útgáfu, eiginleikaflöt hook-a, nafnrými hýsilkalla og Fluxheim-útgáfu, svo endurnýting síðar geti ekki farið yfir útgáfu-, eiginleika- eða ABI-mörk."
proxy_wasm_preview = "Proxy-Wasm-forskoðun"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Byggðu með <code>wasm-proxy-abi</code>, virkjaðu <code>allow_preview_abi</code> og skilgreindu bæði <code>proxy-wasm-preview</code> ABI og nafnrými hýsilkalla. Óstudd imports og köll mistakast lokað."
for_multi_tenant_deployments_enable_server_host_routing_strict_true_so_missing_or_invalid_host_identity_returns_400_and_unknown_hosts_return_421_instead_of_reaching_the_default_site = "Í fjölleigjandauppsetningum skal virkja <code>[server.host_routing].strict = true</code>, svo vantað eða ógilt hýsiauðkenni skili <code>400</code> og óþekktir hýslar skili <code>421</code> í stað þess að komast á sjálfgefna vefinn."
keep_config_files_and_every_existing_parent_directory_under_trusted_ownership_and_not_writable_by_group_or_other_users = "Haltu stillingarskrám og öllum fyrirliggjandi yfirmöppum undir traustu eignarhaldi og tryggðu að hópar eða aðrir notendur geti ekki skrifað í þær."
replace_the_process_when_tls_listeners_streams_udp_acme_cache_purging_tracing_or_managed_php_fpm_process_settings_change_ordinary_routing_and_request_time_policy_can_use_a_snapshot_reload = "Skiptu um ferli þegar stillingar fyrir TLS, hlustara, strauma, UDP, ACME, hreinsun skyndiminnis, rakningu eða stýrð PHP-FPM-ferli breytast; venjuleg leiðun og stefna við beiðni geta notað endurhleðslu skyndimyndar."
persistent_writable_volume_sized_for_the_cache_policy_give_each_storage_bin_replica_its_own_local_or_rwo_volume_use_shared_rwx_storage_only_with_verified_cross_node_locking_and_orchestration_level_single_writer_enforcement = "Varanlegt skrifanlegt gagnasvæði, stærðarsniðið eftir skyndiminnisstefnunni. Gefðu hverri storage-bin-eftirmynd eigið staðbundið eða RWO-gagnasvæði; notaðu sameiginlega RWX-geymslu aðeins með staðfestri læsingu milli hnúta og eins-ritara reglu sem orkestrunarkerfið framfylgir."
use_one_storage_bin_root_per_running_fluxheim_process_ownership_uses_an_advisory_filesystem_lock_and_shared_multi_writer_roots_are_unsafe_without_verified_external_locking = "Notaðu eina storage-bin-rót fyrir hvert Fluxheim-ferli sem keyrir; eignarhald notar ráðgefandi skráakerfislás og sameiginlegar rætur með mörgum riturum eru óöruggar án staðfestrar ytri læsingar."
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "Process-wide, cache-global, cache-vhost, per-plugin og per-attachment keyrsluþök koma í veg fyrir óafmarkað plugin-vinnu."
