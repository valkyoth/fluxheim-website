fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 heldur Wasm valfrjálsu og bætir við afmörkuðum native HTTP/1 cache-policy hooks samhliða access-decision-, header- og route-decision-hooks. Plugins geta haldið áfram venjulegri cache-hegðun, sent áfram til origin, farið fram hjá cache, sleppt geymslu eða hafnað, en geta ekki breytt hráum cache keys, TTL, tags, response headers eða vistuðum metadata né fengið hráa headera, body, skráakerfisaðgang, netaðgang, einkalykla eða admin APIs."
