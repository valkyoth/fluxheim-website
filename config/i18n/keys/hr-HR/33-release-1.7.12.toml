r1712_released_july_15_2026 = "Objavljeno 15. srpnja 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Dodaje opt-in standarde temeljene na predmemoriju, proxy i metapodatke sažetka odgovora"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Dokazuje autentičnost ponovnog učitavanja snimke uživo, vraćanja, provjere integriteta i postojanosti ponovnog pokretanja"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Dodaje ponovljive FIPS-backend dokaze i široko izvorno očvršćavanje vremena izvođenja"
r1712_whats_next_summary = "dodaje opt-in standardne metapodatke, autentificirani dokaz vraćanja snimke, reproducibilne FIPS-backend dokaze i jaču predmemoriju, TLS, Wasm, međuspremnik i granice toka."
r1712_release_series_digest = "Fluxheim 1.7 serija izdanja: predmemorija temeljena na standardima za uključivanje, proxy i metapodaci sažetka odgovora; ponovno učitavanje i vraćanje provjerene snimke uživo; ponovljivi FIPS-backend dokazi; nadogradnje procesa bez zastoja; neovisno testirani Wasm primjeri pravila; i jača predmemorija, TLS, međuspremnik, tok i granice protokola."
r1712_standards_based_response_metadata = "Metapodaci odgovora temeljeni na standardima"
r1712_response_metadata_intro = "Metapodaci odgovora onemogućeni su prema zadanim postavkama. Omogućite samo polja koja su vam potrebna; Fluxheim ih izvodi iz stvarnog rezultata predmemorije, kvara proxyja i konačnih bajtova odgovora bez izlaganja ključeva predmemorije, pozadinskih adresa, DNS imena ili sirovih pogrešaka."
r1712_field = "Polje"
r1712_what_it_reports = "Što izvještava"
r1712_cache_status_description = "Ishodi predmemorije RFC 9211 kao što su pogodak, promašaj, ustajalo prosljeđivanje, ponovna potvrda, istek i zaobilaženje."
r1712_proxy_status_description = "RFC 9209 detalji niske kardinalnosti za kvarove koje generira Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 preko konačnog sadržaja HTTP poruke nakon kompresije."
r1712_repr_digest_description = "SHA-256 samo kada Fluxheim sadrži kompletan odabrani prikaz."
r1712_live_snapshots_and_rollback = "Snimke uživo i povratak"
r1712_live_snapshot_intro = "Autentificirane snimke mogu objaviti potvrđenog kandidata, zamijeniti aktivni usmjerivač i vratiti se bez ponovnog pokretanja normalnih implementacija samo za usmjeravanje. Svaki zahtjev ostaje na jednoj generaciji usmjerivača od početka do kraja."
r1712_snapshot_private_directory = "Držite pohranu snimaka u namjenskom privatnom imeniku; postojeći neprivatni direktoriji i korijeni datotečnog sustava su odbijeni."
r1712_snapshot_process_upgrade = "Upotrijebite nadogradnju procesa kada su aktivne usluge pozadinskog balansiranja opterećenja ili usluge otkrivanja."
r1712_snapshot_integrity_restart = "Pokrenite provjere integriteta snimke nakon objavljivanja ili vraćanja i provjerite je li odabrana generacija preživjela ponovno pokretanje."
r1712_read_snapshot_contract = "Pročitajte cijeli ugovor o snimci"
r1712_authorization_cache_bypass = "Zahtjevi koji nose <code>Authorization</code> ili <code>Proxy-Authorization</code> uvijek zaobilaze traženje i pohranjivanje zajedničke predmemorije."
r1712_strict_cache_control = "Neispravan ili proturječan odgovor <code>Cache-Control</code> direktive se odbijaju umjesto vraćanja na konfigurirane TTL-ove; <code>s-maxage</code> ima prioritet nad <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> i <code>s-maxage</code> zabranjuju ustajalu ponovnu upotrebu nakon isteka svježine."
r1712_encrypted_cache_upgrade_note = "Napomena o nadogradnji šifrirane predmemorije"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 premješta objekte kriptirane predmemorije diska u korijenski vezane podatke i ključeve indeksa s trajnim nonce stanjem. Prvo pokretanje sa starijim kriptiranim korijenom i svaka rotacija lokalnog ključa namjerno hladno čisti tu predmemoriju prije posluživanja prometa."
r1712_encrypted_cache_disposable = "Tretirajte šifriranu predmemoriju kao jednokratno ubrzanje, a ne kao izvor zapisa."
r1712_encrypted_cache_private_storage = "Dajte svakom korijenu predmemorije stalnu privatnu pohranu i nemojte kopirati nonce stanje između neovisnih korijena."
r1712_encrypted_cache_warmup = "Planirajte izvorni kapacitet za prvo zagrijavanje nakon nadogradnje ili rotiranja ključeva."
r1712_client_certificate_revocation = "Opoziv certifikata klijenta"
r1712_client_certificate_revocation_intro = "Kada zajednički TLS mora odbiti opozvane klijentske certifikate, osigurajte ograničeni paket PEM CRL. Fluxheim potvrđuje cijeli lanac izdavatelja i odbacuje isteklu ili nepotpunu CRL politiku."
r1712_client_certificate_revocation_compliance = "Potrebna provjera autentičnosti klijenta u načinu usklađenosti koji zahtijeva FIPS ili ISO također zahtijeva paket CRL. Uobičajena provjera autentičnosti klijenta zadržava opoziv kao izričitu prijavu."
r1712_fips_backend_evidence = "FIPS pozadinski dokaz"
r1712_fips_backend_evidence_intro = "Fluxheim pruža zasebno prikvačena CI okruženja za provjeru za profile OpenSSL-FIPS i rustls/AWS-LC-FIPS. Oni izgrađuju i pokreću točan binarni profil, provode nizvodno i uzvodno verificirani certifikatom TLS, odbacuju nekompatibilna pravila i bilježe prevoditelj, pružatelj, zavisnost, binarni i slikovni identitet."
r1712_fips_backend_evidence_boundary = "Ovo je ponovljivi pozadinski dokaz, a ne FIPS potvrda na razini proizvoda. Spremnike s dokazima držite odvojeno od normalnih slika izdanja i pregledajte dokaze za točnu verziju koju implementirate."
r1712_read_fips_evidence_guide = "Pročitajte vodič za dokaze FIPS"
r1712_loader_admission = "Kontrole učitavanja modula"
r1712_loader_admission_description = "Javni manifesti dodataka moraju sadržavati fiksni SHA-256 sažetak. U cijelom procesu istodobno se mogu kompajlirati najviše dva modula. Kompajlirani izlaz zadano je ograničen na 32 MiB i ne može prijeći 256 MiB."
r1712_file_identity = "Identitet datoteke"
r1712_file_identity_description = "Fluxheim otvara odobrene datoteke dodataka bez praćenja poveznica, zadržava potvrđenu oznaku regularne datoteke i čita bajtove modula iz te hvataljke bez ponovnog otvaranja staze."
