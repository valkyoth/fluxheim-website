r1712_released_july_15_2026 = "15 Temmuz 2026'da yayınlandı"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "İsteğe bağlı standartlara dayalı önbellek, proxy ve yanıt özeti meta verileri ekler"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Kimliği doğrulanmış canlı anlık görüntü yeniden yükleme, geri alma, bütünlük kontrolleri ve yeniden başlatma kalıcılığını kanıtlar"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Tekrarlanabilir FIPS-backend kanıtı ve geniş kapsamlı yerel çalışma zamanı güçlendirmesi ekler"
r1712_whats_next_summary = "katılım standartları meta verileri, kimliği doğrulanmış anlık görüntü geri alma kanıtı, tekrarlanabilir FIPS-backend kanıtı ve daha güçlü önbellek, TLS, Wasm, ara belleğe alma ve akış sınırları ekler."
r1712_release_series_digest = "Fluxheim 1.7 sürüm serisi: isteğe bağlı standartlara dayalı önbellek, proxy ve yanıt özeti meta verileri; kimliği doğrulanmış canlı anlık görüntüyü yeniden yükleme ve geri alma; tekrarlanabilir FIPS-backend kanıtı; sıfır kesinti süreli süreç yükseltmeleri; bağımsız olarak test edilmiş Wasm politika örnekleri; ve daha güçlü önbellek, TLS, ara belleğe alma, akış ve protokol sınırları."
r1712_standards_based_response_metadata = "Standartlara dayalı yanıt meta verileri"
r1712_response_metadata_intro = "Yanıt meta verileri varsayılan olarak devre dışıdır. Yalnızca ihtiyacınız olan alanları etkinleştirin; Fluxheim bunları, önbellek anahtarlarını, arka uç adreslerini, DNS adlarını veya ham hataları açığa çıkarmadan gerçek önbellek sonucundan, proxy hatasından ve son yanıt baytlarından türetir."
r1712_field = "Alan"
r1712_what_it_reports = "Ne rapor ediyor"
r1712_cache_status_description = "RFC 9211 isabet, kayıp, eski yönlendirme, yeniden doğrulama, süre sonu ve atlama gibi önbellek sonuçları."
r1712_proxy_status_description = "RFC 9209, Fluxheim tarafından oluşturulan hatalara ilişkin düşük kardinalite ayrıntıları."
r1712_content_digest_description = "Sıkıştırma sonrasında son HTTP mesaj içeriği üzerinde RFC 9530 SHA-256."
r1712_repr_digest_description = "SHA-256 yalnızca Fluxheim seçilen gösterimin tamamını tuttuğunda."
r1712_live_snapshots_and_rollback = "Canlı anlık görüntüler ve geri alma"
r1712_live_snapshot_intro = "Kimliği doğrulanmış anlık görüntüler, doğrulanmış bir adayı yayınlayabilir, canlı yönlendiriciyi değiştirebilir ve normal yalnızca yönlendirme dağıtımlarını yeniden başlatmadan geri alabilir. Her istek baştan sona bir yönlendirici neslinde kalır."
r1712_snapshot_private_directory = "Anlık görüntü deposunu özel bir dizinde tutun; mevcut özel olmayan dizinler ve dosya sistemi kökleri reddedilir."
r1712_snapshot_process_upgrade = "Arka plan yük dengeleyici durumu veya bulma hizmetleri etkin olduğunda bir işlem yükseltmesi kullanın."
r1712_snapshot_integrity_restart = "Yayınlama veya geri alma sonrasında anlık görüntü bütünlüğü kontrollerini çalıştırın ve seçilen neslin yeniden başlatmadan sağ çıktığını doğrulayın."
r1712_read_snapshot_contract = "Anlık görüntü sözleşmesinin tamamını okuyun"
r1712_authorization_cache_bypass = "<code>Authorization</code> veya <code>Proxy-Authorization</code> taşıyan istekler her zaman paylaşılan önbellek aramasını ve depolamayı atlar."
r1712_strict_cache_control = "Hatalı biçimlendirilmiş veya çelişkili yanıt <code>Cache-Control</code> yönergeleri, yapılandırılmış TTL'lere geri dönmek yerine reddedilir; <code>s-maxage</code>, <code>max-age</code>'ya göre önceliklidir."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> ve <code>s-maxage</code>, tazelik süresi dolduktan sonra eskimiş yeniden kullanımı yasaklar."
r1712_encrypted_cache_upgrade_note = "Şifreli önbellek yükseltme notu"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12, şifrelenmiş disk önbellek nesnelerini dayanıklı tek seferlik durumla kök bağlantılı verilere ve dizin anahtarlarına taşır. Daha eski bir şifrelenmiş köke karşı ilk başlatma ve her yerel anahtar rotasyonu, trafiğe hizmet vermeden önce bu önbelleği kasıtlı olarak soğuk olarak temizler."
r1712_encrypted_cache_disposable = "Şifrelenmiş önbelleğe kaydın kaynağı olarak değil, tek kullanımlık hızlandırma olarak davranın."
r1712_encrypted_cache_private_storage = "Her önbellek köküne kalıcı özel depolama alanı sağlayın ve bağımsız kökler arasında tek seferlik durumu kopyalamayın."
r1712_encrypted_cache_warmup = "Anahtarları yükselttikten veya döndürdükten sonra ilk ısınma için başlangıç kapasitesini planlayın."
r1712_client_certificate_revocation = "İstemci sertifikası iptali"
r1712_client_certificate_revocation_intro = "Karşılıklı TLS'nun iptal edilen istemci sertifikalarını reddetmesi gerektiğinde sınırlı bir PEM CRL paketi sağlayın. Fluxheim, veren kuruluş zincirinin tamamını doğrular ve süresi dolmuş veya eksik CRL ilkesini reddeder."
r1712_client_certificate_revocation_compliance = "FIPS veya ISO gerekli uyumluluk modunda gerekli istemci kimlik doğrulaması ayrıca bir CRL paketi gerektirir. Sıradan istemci kimlik doğrulaması, iptali açık bir katılım olarak korur."
r1712_fips_backend_evidence = "FIPS arka uç kanıtı"
r1712_fips_backend_evidence_intro = "Fluxheim, OpenSSL-FIPS ve rustls/AWS-LC-FIPS profilleri için ayrı olarak sabitlenmiş CI geçirmez ortamlar sağlar. Tam profil ikili dosyasını oluşturur ve çalıştırırlar, aşağı akış ve sertifikayla doğrulanmış yukarı akış TLS'yu kullanırlar, uyumsuz politikayı reddederler ve derleyici, sağlayıcı, bağımlılık, ikili ve görüntü kimliklerini kaydederler."
r1712_fips_backend_evidence_boundary = "Bu, ürün düzeyinde FIPS doğrulaması değil, tekrarlanabilir arka uç kanıtıdır. Prova kapsayıcılarını normal sürüm görüntülerinden ayrı tutun ve dağıttığınız yapıyla ilgili kanıtları inceleyin."
r1712_read_fips_evidence_guide = "FIPS kanıt kılavuzunu okuyun"
r1712_loader_admission = "Modül yükleme denetimleri"
r1712_loader_admission_description = "Herkese açık eklenti bildirimleri sabit bir SHA-256 özeti içermelidir. Süreç genelinde aynı anda en fazla iki modül derlenir. Derlenmiş çıktının varsayılan sınırı 32 MiB'dir ve 256 MiB'yi aşamaz."
r1712_file_identity = "Dosya kimliği"
r1712_file_identity_description = "Fluxheim, onaylanmış eklenti dosyalarını aşağıdaki bağlantıları olmadan açar, doğrulanmış normal dosya tanıtıcısını korur ve yolu yeniden açmadan bu tanıtıcıdan modül baytlarını okur."
