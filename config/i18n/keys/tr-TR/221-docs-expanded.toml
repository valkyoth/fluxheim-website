version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Sürüm 1.6.37, Wasm öncesi final crate-boundary temizliğidir: ACME, observability, cache, load-balancer, PHP-FPM ve native runtime internalleri daha küçük crate-owned modüllere taşınırken runtime davranışı sabit kalır."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Sürüm 1.6.37, host-network portları diğer runner süreçleriyle yarıştığında Prometheus ve Jaeger geçici başlatmalarını yeni atanmış portlarla tekrar deneyerek yerel observability smoke’u daha güvenilir yapar."

