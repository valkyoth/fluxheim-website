r1712_released_july_15_2026 = "Pubbricatu lu 15 giugnettu 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Aggiungi metadati dâ cache, dû proxy e dâ diggistiuni dî risposti basati supra li standard di opt-in"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Dimustra la pirsistenza dû ricaricamentu, dû rollback, dî cuntrolli di ntigrità e dû riavviu di l'istantanei diretti autinticati"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Aggiungi provi FIPS-backend riproducìbbili e n'ampiu 'ndurimentu dû tempu di runtime nativu"
r1712_whats_next_summary = "agghiunci metadati dî standard facurtativi, prova di rollback di l'istantanea autinticata, provi FIPS-backend riproducìbbili e cunfini cchiù forti pi cache, TLS, Wasm, buffering e flussi."
r1712_release_series_digest = "Seri Fluxheim 1.7: metadati facurtativi dâ cache, dû proxy e dû digest dâ risposta basati supra li standard; ricaricamentu e rollback di l'istantanea 'n diretta autinticata; provi FIPS-backend riproducìbbili; agghiornamenti dû prucessu senza ntirruzzioni; esempi di pulìtica Wasm tistati 'n manera nnipinnenti; e cunfini cchiù forti pi cache, TLS, buffering, flussi e prutocolli."
r1712_standards_based_response_metadata = "Metadati di risposta basati supra li standard"
r1712_response_metadata_intro = "Li metadati dâ risposta sunnu disattivati pi difauttu. Attiva sulu li campi ca ti servinu; Fluxheim li diriva dû risurtatu dâ cache riali, dû fallimentu dû proxy e dî byte di risposta finali senza espòniri li chiavi dâ cache, l'indirizzi dû backend, li nomi DNS o l'erruri grezzi."
r1712_field = "Campu"
r1712_what_it_reports = "Chiddu ca riporta"
r1712_cache_status_description = "Risurtati dâ cache RFC 9211 comu colpi, mancanza, rinviu vècchiu, rivalidazzioni, scadenza e bypass."
r1712_proxy_status_description = "Dittagghi a vascia cardinalità pi guasti ginirati di Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 supra lu cuntinutu dû missaggiu HTTP finali doppu la cumpressioni."
r1712_repr_digest_description = "SHA-256 sulu quannu Fluxheim teni la riprisintazzioni cumpleta scigghiuta."
r1712_live_snapshots_and_rollback = "Istantanei 'n diretta e rollback"
r1712_live_snapshot_intro = "Li snapshot autinticati ponnu pubbricari un cannidatu cunvalidatu, scanciari lu router live e arriturnari senza riavviari li distribbuzzioni nurmali sulu pi routing. Ogni richiesta arrista nnâ ginirazzioni di router di l'inizziu â fini."
r1712_snapshot_private_directory = "Mantèniri lu magazzinu di l'istantanei nna na cartella privata didicata; li cartelli nun privati ​​esistenti e li ràdichi dû sistema di file vennu rifiutati."
r1712_snapshot_process_upgrade = "Usa n'agghiornamentu dû prucessu quannu li sirvizzi di saluti o di scuperta dû bilanciaturi di càrricu di funnu sunnu attivi."
r1712_snapshot_integrity_restart = "Esegui cuntrolli di ntigrità di l'istantanea doppu la pubblicazzioni o lu rollback e virìfica ca la ginirazzioni scigghiuta supravvivi ô riavviu."
r1712_read_snapshot_contract = "Leggi lu cuntrattu cumpletu di l'istantanea"
r1712_authorization_cache_bypass = "Li richiesti ca purtanu <code>Authorization</code> o <code>Proxy-Authorization</code> supiranu sempri la ricerca e l'archiviazzioni dâ cache cunnivisa."
r1712_strict_cache_control = "Li dirittivi <code>Cache-Control</code> di risposta malfurmati o cuntrastanti vennu rifiutati ô postu di turnari ê TTL cunfigurati; <code>s-maxage</code> àvi la priurità supra <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> e <code>s-maxage</code> pruìbbinu lu riutilizzu vecchiu doppu ca scadi la friscura."
r1712_encrypted_cache_upgrade_note = "Nota pi l'agghiornamentu dâ cache criptata"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 spusta l'uggetti dâ cache dû discu criptatu ê dati ligati â ràdica e ê chiavi di l'indici cu nu statu nonce durabbili. Lu primu startup contra na root criptata cchiù vecchia, e ogni rutazzioni dâ chiavi lucali, purga apposta la cache a friddu prima di sirviri lu trafficu."
r1712_encrypted_cache_disposable = "Tratta la cache criptata comu n'accilirazzioni usa e getta, no la funti dâ riggistrazzioni."
r1712_encrypted_cache_private_storage = "Dàri a ogni ràdica dâ cache n'archiviazzioni privata pirsistenti e nun cupiari lu statu nunce ntra ràdichi nnipinnenti."
r1712_encrypted_cache_warmup = "Pianificari la capacità d'urìggini pû primu riscaldamentu doppu l'agghiornamentu o la rutazzioni dî chiavi."
r1712_client_certificate_revocation = "Rivoca dû cirtificatu dû clienti"
r1712_client_certificate_revocation_intro = "Quannu TLS ricìprocu àvi a rifiutari li certificati clienti rifiutati, furniri nu pacchettu CRL limitatu. Fluxheim cunvalida a catina emittenti cumpleta e rifiuta a pulìtica CRL scaduta o ‘ncumpleta."
r1712_client_certificate_revocation_compliance = "L'autinticazzioni dû clienti richiesta nnâ modalità di cunfurmità richiesta richiedi macari nu pacchettu CRL. L'autinticazzioni dû clienti urdinaria manteni la revoca comu n'opt-in esplìcita."
r1712_fips_backend_evidence = "Prova di backend"
r1712_fips_backend_evidence_intro = "Fluxheim duna ammienti di prova CI pinnati siparatamenti pî prufili OpenSSL-FIPS e rustls/AWS-LC-FIPS. Custruisciunu e gèstinu lu prufilu binariu esattu, esercitanu TLS a valli e virìficatu cû certificatu, rifiutanu pulìtichi ncumpatibbili e arrigistranu cumpilaturi, furnituri, dipinnenza, binari e identità di mmàggini."
r1712_fips_backend_evidence_boundary = "Chista è na prova di backend riproducìbbili, no la cunvalidazzioni FIPS a liveḍḍu di pruduttu. Mantèniri li cuntinitura di prova siparati di l'immaggini di rilassu nurmali e rivìdiri li provi pâ custruzzioni esatta ca distribuisci."
r1712_read_fips_evidence_guide = "Leggi la guida dî provi FIPS"
r1712_loader_admission = "Cuntrolli dû carricamentu dî mòduli"
r1712_loader_admission_description = "Li manifesti pùbbrici dî plugin hannu a cunteniri nu digest SHA-256 fissu. 'N tuttu lu prucessu si cumpìlanu ô massimu dui mòduli â vota. L'output cumpilatu havi nu lìmiti predefinutu di 32 MiB e nun po supirari 256 MiB."
r1712_file_identity = "Identità dû file"
r1712_file_identity_description = "Fluxheim apri li file di plugin appruvati senza siguiri li link, manteni lu manicu dû file rigulari cunvalidatu e leggi li byte dû mòdulu di ḍḍu manicu senza riapriri lu percorsu."
