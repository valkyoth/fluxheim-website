systemd_socket_activation_keeps_the_public_listener_available_while_fluxheim_validates_the_replacement_and_drains_existing_connections_containers_need_a_stable_front_proxy_load_balancer_or_orchestrator_because_directly_published_host_ports_cannot_be_replaced_without_a_listener_gap = "L'attivazzioni dî socket systemd manteni dispunìbbili lu socket pùbblicu d'ascoltu mentri Fluxheim virìfica lu novu prucessu e lassa finiri li cunnissioni ca già sunnu aperti. Li container hannu bisognu d'un proxy frontali, d'un load balancer o d'un orchestrator stàbbili, picchì li porti dû host pubblicati direttamenti nun ponnu èssiri rimpiazzati senza ntirrùmpiri l'ascoltu."
