fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5 teni Wasm opzionali e allarga hook native HTTP/1 cache-policy limitati nzemi a hook access-decision, header e route-decision. Li plugin ponnu cuntinuari lu cumpurtamentu normali di cache, passari a origin, bypassari cache, satari lu sarvataggiu, nigari, scigghiri varianti cache-key fissi mobile/desktop e attaccari TTL, tag e metadata stored-header fissi pi cache-store. Ancora nun ponnu emettiri cache-key bytes arbitrarii, TTL arbitrarii, tag arbitrarii, response headers grezzi, body, accessu ô sistema di file, accessu â riti, chiavi privati o admin APIs."
cache_metadata = "Metadata di cache"
