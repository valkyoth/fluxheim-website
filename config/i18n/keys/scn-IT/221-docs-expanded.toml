fluxheim_1_7_7_keeps_wasm_optional_and_adds_the_first_opt_in_proxy_wasm_abi_compatibility_preview_it_establishes_a_separate_feature_gated_host_call_namespace_with_strict_manifest_validation_and_deterministic_fail_closed_handling_for_unsupported_calls_it_does_not_claim_that_arbitrary_existing_proxy_wasm_plugins_run_unchanged = "Fluxheim 1.7.7 teni Wasm opziunali e agghiunci la prima anteprima opziunali di cumpatibilità ABI Proxy-Wasm. Stabbilisci nu namespace siparatu pî chiamati host, prutiggiutu di na feature, cu validazzioni stritta dû manifest e gestioni deterministica fail-closed pî chiamati nun suppurtati; nun dici ca qualunqui plugin Proxy-Wasm esistenti funziona senza canciamenti."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_host_call_namespace_and_fluxheim_version_so_future_reuse_cannot_cross_release_feature_or_abi_boundaries = "Li moduli compilati sunnu attaccati ô digest dû plugin, â virsioni ABI, â superfici dî feature hook, ô namespace dî chiamati host e â virsioni Fluxheim, accussì lu riusu futuru nun po’ passari li cunfini di release, feature o ABI."
proxy_wasm_preview = "Anteprima Proxy-Wasm"
build_with_wasm_proxy_abi_enable_allow_preview_abi_and_declare_both_the_proxy_wasm_preview_abi_and_host_call_namespace_unsupported_imports_and_calls_fail_closed = "Compila cu <code>wasm-proxy-abi</code>, attiva <code>allow_preview_abi</code> e dichiara sia l’ABI <code>proxy-wasm-preview</code> sia lu namespace dî chiamati host. Import e chiamati nun suppurtati falliscinu fail-closed."
