version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "La virsioni 1.6.37 è la pulizzìa finali dî cunfini crate prima di Wasm: ACME, observability, cache, load-balancer, PHP-FPM e l’interni dû native runtime passanu a moduli cchiù nichi patruni dû crate, mentri lu runtime arresta stabbili."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "La virsioni 1.6.37 fa cchiù affidabbili lu smoke lucali di observability, ripruvannu avvii timpuranei di Prometheus e Jaeger cu porti appena assignati quannu li porti host-network cumpitinu cu autri prucessi runner."

