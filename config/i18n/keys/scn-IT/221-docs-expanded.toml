module_identity = "Identità dû mòdulu"
fluxheim_1_7_6_keeps_wasm_optional_and_hardens_the_mature_native_http_1_hook_runtime_compiled_modules_now_carry_identities_scoped_by_plugin_sha_256_digest_abi_version_native_hook_feature_surface_and_fluxheim_version_cache_hooks_also_get_per_vhost_admission_budgets_under_the_process_wide_cache_hook_ceiling_so_one_vhost_cannot_starve_another = "scn-IT: Fluxheim 1.7.6 keeps Wasm optional and hardens the mature native HTTP/1 hook runtime. Compiled modules now carry identities scoped by plugin SHA-256 digest, ABI version, native hook feature surface, and Fluxheim version; cache hooks also get per-vhost admission budgets under the process-wide cache-hook ceiling so one vhost cannot starve another."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_and_fluxheim_version_so_future_reuse_cannot_cross_release_or_feature_boundaries = "scn-IT: Compiled modules are tied to plugin digest, ABI version, hook feature surface, and Fluxheim version so future reuse cannot cross release or feature boundaries."
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "scn-IT: Process-wide, cache-global, cache-vhost, per-plugin, and per-attachment execution ceilings prevent unbounded plugin work."
