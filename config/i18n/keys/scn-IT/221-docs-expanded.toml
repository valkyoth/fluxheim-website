fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4 teni Wasm opzionali e agghiunci hook native HTTP/1 cache-policy limitati nzemi a access-decision, header e route-decision hooks. Li plugin ponnu cuntinuari lu cumpurtamentu normali di cache, passari a origin, bypassari cache, satari lu sarvataggiu o nigari, ma nun ponnu canciari cache keys grezzi, TTL, tags, response headers o metadata sarvati, né riciviri header grezzi, body, accessu ô sistema di file, accessu â riti, chiavi privati o admin APIs."
cache_decisions = "Decisioni cache"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "Li hook <code>cache-lookup</code> ponnu fari continue, pass, bypass o deny. Li hook <code>cache-store</code> ponnu fari continue, skip storage o deny prima dî scritturi memory/disk cache."
