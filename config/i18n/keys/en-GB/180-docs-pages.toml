[advanced_page]
advanced_001_advanced_features = "Advanced Features"
advanced_002_php_fpm_proxy_operations_admin_api_zero_retention_privacy_mode_waf_wasm = "PHP-FPM, proxy operations, admin API, zero-retention privacy mode, WAF, WASM extensibility, and planned future modules."
advanced_003_php_fpm_bridge = "PHP-FPM Bridge"
advanced_004_available_since_v1_3_1_via_the_php_fpm_cargo_feature_the = "Available since v1.3.1 via the <code>php-fpm</code> Cargo feature. The PHP-FPM bridge connects Fluxheim to a running PHP-FPM pool using the FastCGI protocol. It supports WordPress-style front-controller applications with strict script resolution and bounded request/response handling."
advanced_005_bash_build_with_php_fpm_support = "bash — build with PHP-FPM support"
advanced_006_fluxheim_toml_wordpress_front_controller = "fluxheim.toml — WordPress front-controller"
advanced_007_managed_php_fpm = "Managed PHP-FPM"
advanced_008_included_in_current_v1_6_28_builds_and_introduced_in_v1_3 = "Included in current v1.6.30 builds and introduced in v1.3.7. Managed mode keeps the same FastCGI/php-fpm request path, but Fluxheim starts and supervises a private php-fpm master process for the vhost. External php-fpm remains the default; use managed mode when you want Fluxheim to generate the pool config and own the private socket lifecycle."
advanced_009_fluxheim_toml_managed_php_fpm_pool = "fluxheim.toml — managed php-fpm pool"
advanced_010_do_not_set_socket_tcp_or_tcp_upstreams_in_managed_mode_fluxheim = "Do not set <code>socket</code>, <code>tcp</code>, or <code>tcp_upstreams</code> in managed mode. Fluxheim creates the private Unix socket under <code>socket_dir</code>, generates the php-fpm pool files, shuts the master down on reload or gateway shutdown, and respawns it with bounded backoff if it crashes after startup."
advanced_011_how_php_routing_works = "How PHP routing works"
advanced_012_requests_for_existing_php_files_are_routed_directly_to_php_fpm = "Requests for existing <code>.php</code> files are routed directly to PHP-FPM"
advanced_013_requests_for_non_existent_files_fall_back_to_the_front_controller_index = "Requests for non-existent files fall back to the front controller (<code>index.php</code>)"
advanced_014_static_assets_css_js_images_are_served_directly_without_touching_php_fpm = "Static assets (<code>.css</code>, <code>.js</code>, images) are served directly without touching PHP-FPM"
advanced_015_script_resolution_is_strict_only_files_within_the_configured_php_root_are = "Script resolution is strict — only files within the configured PHP <code>root</code> are passed to FPM"
advanced_016_fluxheim_acme_companion = "fluxheim-acme Companion"
advanced_017_released_in_v1_3_2_fluxheim_acme_is_a_standalone_companion_binary = "Released in v1.3.2. <code>fluxheim-acme</code> is a standalone companion binary for managing ACME certificate renewal and reload operations outside of the main gateway process. It is designed for container and external service-manager deployments where the gateway does not own the renewal lifecycle."
advanced_018_bash_fluxheim_acme_operations = "bash — fluxheim-acme operations"
advanced_019_the_acme_reload_socket_lets_fluxheim_acme_signal_the_running_gateway_to = "The ACME reload socket lets <code>fluxheim-acme</code> signal the running gateway to pick up freshly issued certificates without a full restart. Configure the socket path in your <code>[server]</code> block."
advanced_020_fluxheim_toml_acme_reload_socket = "fluxheim.toml — ACME reload socket"
advanced_021_fluxheim_config_tester = "fluxheim-config-tester"
advanced_022_released_in_v1_3_2_fluxheim_config_tester_is_a_standalone_binary = "Released in v1.3.2. <code>fluxheim-config-tester</code> is a standalone binary that validates a Fluxheim config file without starting the gateway. Useful in CI pipelines and container entrypoints where config errors should be caught before being applied to a running service."
advanced_023_bash_validate_config_before_apply = "bash — validate config before apply"
advanced_024_proxy_operations = "Proxy Operations"
advanced_025_fluxheim_v1_4_x_adds_migration_focused_proxy_operations_on_top_of = "Fluxheim v1.4.x adds migration-focused proxy operations on top of the 1.4.0 proxy parity baseline: regex routes, method routing, WebSocket upgrades, auth subrequests, safe traffic mirroring, dynamic upstream discovery, and a read-only local ops socket."
advanced_026_fluxheim_toml_proxy_operations = "fluxheim.toml — proxy operations"
advanced_027_regex_support_is_disabled_until_server_regex_enabled_true_is_set_traffic = "Regex support is disabled until <code>server.regex_enabled = true</code> is set. Traffic mirroring is compiled through the <code>traffic-mirror</code> feature and mirrors safe bodyless methods only; it never changes the primary response."
advanced_028_zero_retention_privacy_mode = "Zero-Retention Privacy Mode"
advanced_029_the_privacy_mode_feature_compiles_fluxheim_without_any_caching_or_metrics_functionality = "The <code>privacy-mode</code> feature compiles Fluxheim without any caching or metrics functionality, enforcing zero log retention at the build level. This is suitable for privacy-sensitive deployments where no request data should be stored or exported."
advanced_030_bash_zero_retention_privacy_build = "bash — zero-retention privacy build"
advanced_031_what_privacy_mode_enforces = "What privacy-mode enforces"
advanced_032_no_cache_module_compiled_caching_is_impossible_at_the_binary_level = "No cache module compiled — caching is impossible at the binary level"
advanced_033_no_metrics_module_compiled_no_prometheus_or_otlp_export = "No metrics module compiled — no Prometheus or OTLP export"
advanced_034_access_logs_may_be_disabled_in_the_config = "Access logs may be disabled in the config"
advanced_035_compile_time_guarantee_no_data_is_stored_no_external_telemetry_is_exported = "Compile-time guarantee: no data is stored, no external telemetry is exported"
advanced_036_admin_api = "Admin API"
advanced_037_the_admin_control_plane_exposes_a_local_http_api_for_health_checks = "The admin control-plane exposes a local HTTP API for health checks, config reload, cache purge, and status queries. It defaults to loopback-only and requires a bearer token on non-loopback listeners."
advanced_038_bash_admin_api_endpoints = "bash — admin API endpoints"
advanced_039_wasm_extensibility = "WASM Extensibility"
advanced_040_planned_v1_6 = "Planned — v1.6"
advanced_041_fluxheim_s_wasm_extensibility_layer_is_planned_for_the_1_6_release = "Fluxheim's WASM extensibility layer is planned for the 1.6 release. It will support nginx-Lua-style request/response hooks and VCL-like cache policy hooks through WebAssembly modules."
advanced_042_compile_time_opt_in_wasm_feature = "Compile-time opt-in <code>wasm</code> feature"
advanced_043_hook_points_request_received_upstream_response_cache_policy_response_send = "Hook points: request received, upstream response, cache policy, response send"
advanced_044_shared_memory_model_between_wasm_modules_and_the_host = "Shared memory model between WASM modules and the host"
advanced_045_sandboxed_execution_with_bounded_resource_limits = "Sandboxed execution with bounded resource limits"
advanced_046_waf_architecture = "WAF Architecture"
advanced_047_planned_future = "Planned — future"
advanced_048_a_web_application_firewall_module_is_documented_in_the_architecture_but_not = "A Web Application Firewall module is documented in the architecture but not enabled in the current stable builds. It is planned as a compile-time optional module with rule-based request filtering, rate limiting per IP/path/method, and configurable block/log/challenge responses."
advanced_049_load_balancer = "Load Balancer"
advanced_050_the_load_balancer_feature_adds_fluxheim_s_load_balancer_control_plane_and = "The <code>load-balancer</code> feature adds Fluxheim's load-balancer control plane and health checks to the proxy runtime. It is opt-in and available today via <code>profile-load-balancer</code> or <code>profile-load-balancer-edge</code>."
