last_updated_june_23_2026 = "Last updated: June 23, 2026"
no_analytics_cookies = "No analytics cookies"
no_analytics_cookies_text = "The Fluxheim website does not use analytics cookies, advertising cookies, fingerprinting, local storage identifiers, or third-party analytics scripts."
language_selector_cookie_text = "The language selector uses normal links and does not need a cookie. If a future deployment adds a strictly necessary cookie, this notice must be updated before that change is enabled."
aggregate_observability = "Aggregate observability"
aggregate_observability_text = "We collect first-party aggregate observability events to count visits, language usage, page sections, downloads, GitHub redirects, request latency, and approximate visible time on a page."
events_no_sensitive_text = "These events do not contain raw IP addresses, user identifiers, cookie values, browser fingerprints, request bodies, authorisation headers, or full query strings."
what_we_collect = "What we collect"
privacy_collect_text = "The website records aggregate operational metrics: request counts, page views, selected language, normalised page route, section, HTTP status class, request duration, download clicks, GitHub redirect clicks, and approximate page visible time."
country_aggregation_text = "Optional country aggregation may be enabled by the operator. When enabled, the server derives a country code in memory and exports only the country code or unknown."
what_we_do_not_collect = "What we do not collect"
privacy_do_not_collect_text = "We do not export raw IP addresses, per-user identifiers, analytics cookies, browser fingerprints, complete user agents, referrer URLs, request bodies, authorisation headers, cookie headers, or full query strings."
telemetry_use_text = "Telemetry is used to operate the website, understand aggregate documentation and download usage, and detect reliability problems. It is not used to build profiles about individual visitors."
retention = "Retention"
retention_text = "Retention is controlled by the local Prometheus and Grafana deployment operated for the website. The website application does not write a separate analytics database."
purpose_and_lawful_basis = "Purpose and lawful basis"
gdpr_basis_text = "The purpose of the website telemetry is security, reliability, capacity planning, and aggregate documentation improvement. The intended lawful basis is legitimate interest in operating and securing the website with privacy-minimised telemetry."
data_minimisation = "Data minimisation"
gdpr_minimisation_text = "Metrics use bounded labels such as locale, normalised route, section, status class, download artefact, GitHub target, and optional country code. The implementation is designed not to store or export raw IP addresses or user-level tracking identifiers."
github_redirect_privacy_text = "GitHub outbound clicks are counted in aggregate before redirecting the browser to GitHub. GitHub then processes the request under GitHub's own terms and privacy policy."
your_rights = "Your rights"
gdpr_rights_text = "Because the website avoids user identifiers and stores only aggregate telemetry, we normally cannot identify a specific visitor inside the metrics. Privacy or GDPR questions can be opened through the Fluxheim GitHub project."
translation_notice = "Translation notice"
translation_notice_text = "Website translations are AI-assisted and maintained on a best-effort basis. Corrections and improved translations are welcome in the <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">Fluxheim website i18n keys</a>."
