when_an_operator_explicitly_allow_lists_common_request_context_names_fluxheim_generated_context = "<p>When an operator explicitly allow-lists common request-context names, Fluxheim-generated context wins over client-supplied values. <code>X-Original-URI</code>, <code>X-Forwarded-URI</code>, <code>X-Auth-Request-Redirect</code>, <code>X-Forwarded-For</code>, <code>X-Real-IP</code>, <code>X-Forwarded-Host</code>, and <code>X-Forwarded-Proto</code> are built from the current request and trusted proxy chain before the auth subrequest is sent. Repeated <code>Cookie</code> fields are joined with <code>; </code>, matching the normalized upstream origin request, so the auth service and origin receive the same cookie structure when cookies are explicitly forwarded.</p>"
