wolfi_short_aliases = "Wolfi short aliases:"
starting_with_v1_5_0_the_load_balancer_image_profile_is_part_of_normal_tag_publishing_fo = "Starting with <code>v1.5.0</code>, the load-balancer image profile is part of normal tag publishing. For older tags or development branches, it can still be included in manual workflow runs by setting <code>include_load_balancer=true</code>."
the_workflow_defaults_to_linux_amd64_use_manual_dispatch_to_test_additional_platforms_fo = "The workflow defaults to <code>linux/amd64</code>. Use manual dispatch to test additional platforms, for example <code>linux/amd64,linux/arm64</code>, once every selected runtime base has been verified for those architectures."
manual_workflow_inputs_also_allow_runtime_uid_runtime_gid_and_a_temporary_feature_overri = "Manual workflow inputs also allow <code>runtime_uid</code>, <code>runtime_gid</code>, and a temporary feature override. Keep both IDs at <code>65532</code> for normal images. Use <code>0</code> only for a deliberate root-runtime image. Leave the feature override empty for normal release profile builds."
1_3_2_adds_a_separate_fluxheim_config_tester_binary_target_for_diagnosing_configs_outsid = "<code>1.3.2</code> adds a separate <code>fluxheim-config-tester</code> binary target for diagnosing configs outside the runtime container. It is intended for cases where a Podman or systemd deployment cannot start and the operator still needs Fluxheim&#x27;s real config parser, feature/profile checks, TLS storage checks, ACME target preview, and upstream DNS checks."
use_profile_full_profile_cache_profile_proxy_or_profile_web_php_to_match_the_release_art = "Use <code>--profile full</code>, <code>--profile cache</code>, <code>--profile proxy</code>, or <code>--profile web-php</code> to match the release artifact or image profile you plan to run. Add <code>--no-runtime-paths</code> when you only need syntax, semantic, and profile validation from outside the gateway container and do not have access to the service runtime mount such as <code>/run/fluxheim</code>. Leave that flag off when you want the tester to inspect <code>server.process.pid_file</code>, upgrade socket, and certificate reload socket paths as part of a deployment preflight."
runtime_images_and_rpms_do_include_fluxheim_acme_which_is_the_acme_companion_entry_point = "Runtime images and RPMs do include <code>fluxheim-acme</code>, which is the ACME companion entry point for service-manager or container-scheduled renewal workflows:"
for_live_activation_after_renewal_the_running_gateway_and_companion_need_the_same_writab = "For live activation after renewal, the running gateway and companion need the same writable <code>/run/fluxheim</code> mount so <code>fluxheim-acme</code> can reach <code>server.process.certificate_reload_sock</code>."
process_runtime_files_such_as_pid_files_upgrade_sockets_and_the_certificate_reload_socke = "Process runtime files such as PID files, upgrade sockets, and the certificate reload socket."
default_static_content_root_if_you_want_one_shared_root = "Default static content root if you want one shared root."
per_site_static_roots_referenced_by_vhosts = "Per-site static roots referenced by vhosts."
