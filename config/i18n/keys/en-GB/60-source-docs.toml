wolfi_short_aliases = "Wolfi short aliases:"
starting_with_v1_5_0_the_load_balancer_image_profile_is_part_of_normal_tag_publishing_fo = "Starting with <code>v1.5.0</code>, the load-balancer image profile is part of normal tag publishing. For older tags or development branches, it can still be included in manual workflow runs by setting <code>include_load_balancer=true</code>."
the_workflow_defaults_to_linux_amd64_use_manual_dispatch_to_test_additional_platforms_fo = "The workflow defaults to <code>linux/amd64</code>. Use manual dispatch to test additional platforms, for example <code>linux/amd64,linux/arm64</code>, once every selected runtime base has been verified for those architectures."
manual_workflow_inputs_also_allow_runtime_uid_runtime_gid_and_a_temporary_feature_overri = "Manual workflow inputs also allow <code>runtime_uid</code>, <code>runtime_gid</code>, and a temporary feature override. Keep both IDs at <code>65532</code> for normal images. Use <code>0</code> only for a deliberate root-runtime image. Leave the feature override empty for normal release profile builds."
1_3_2_adds_a_separate_fluxheim_config_tester_binary_target_for_diagnosing_configs_outsid = "<code>1.3.2</code> adds a separate <code>fluxheim-config-tester</code> binary target for diagnosing configs outside the runtime container. It is intended for cases where a Podman or systemd deployment cannot start and the operator still needs Fluxheim&#x27;s real config parser, feature/profile checks, TLS storage checks, ACME target preview, and upstream DNS checks."
use_profile_full_profile_cache_profile_proxy_or_profile_web_php_to_match_the_release_art = "Use <code>--profile full</code>, <code>--profile cache</code>, <code>--profile proxy</code>, or <code>--profile web-php</code> to match the release artifact or image profile you plan to run. Add <code>--no-runtime-paths</code> when you only need syntax, semantic, and profile validation from outside the gateway container and do not have access to the service runtime mount such as <code>/run/fluxheim</code>. Leave that flag off when you want the tester to inspect <code>server.process.pid_file</code>, upgrade socket, and certificate reload socket paths as part of a deployment preflight."
runtime_images_and_rpms_do_include_fluxheim_acme_which_is_the_acme_companion_entry_point = "Runtime images and RPMs do include <code>fluxheim-acme</code>, which is the ACME companion entry point for service-manager or container-scheduled renewal workflows:"
for_live_activation_after_renewal_the_running_gateway_and_companion_need_the_same_writab = "For live activation after renewal, the running gateway and companion need the same writable <code>/run/fluxheim</code> mount so <code>fluxheim-acme</code> can reach <code>server.process.certificate_reload_sock</code>."
process_runtime_files_such_as_pid_files_upgrade_sockets_and_the_certificate_reload_socke = "Process runtime files such as PID files, upgrade sockets, and the certificate reload socket."
default_static_content_root_if_you_want_one_shared_root = "Default static content root if you want one shared root."
per_site_static_roots_referenced_by_vhosts = "Per-site static roots referenced by vhosts."
optional_file_logs_when_logging_file_is_enabled = "Optional file logs when <code>[logging.file]</code> is enabled."
for_podman_on_selinux_hosts_z_gives_the_bind_mount_a_private_container_label_add_u_only = "For Podman on SELinux hosts, <code>:Z</code> gives the bind mount a private container label. Add <code>:U</code> only for writable paths when you want Podman to adjust ownership for user namespaces. Read-only paths normally use <code>:ro,Z</code>, not <code>:U</code>."
the_default_image_user_is_65532_65532_so_writable_host_directories_should_be_owned_or_ma = "The default image user is <code>65532:65532</code>, so writable host directories should be owned or mapped for that user. With rootless Podman, <code>:U</code> is often the easiest safe option for cache/state/log directories."
example_host_layout = "Example host layout:"
matching_config_paths = "Matching config paths:"
for_multi_site_setups_prefer_etc_fluxheim_conf_d_with_one_vhost_per_file_vhosts_starts_a = "For multi-site setups, prefer <code>/etc/fluxheim/conf.d/</code> with one vhost per file. <code>[[vhosts]]</code> starts a vhost, and each following <code>[vhosts.*]</code> table belongs to that vhost until the next <code>[[vhosts]]</code>. The packaged <code>/etc/fluxheim/fluxheim.toml</code> sets <code>include_conf_d = true</code>, so it also loads visible <code>*.toml</code> files from <code>/etc/fluxheim/conf.d/</code> after the main file. When Fluxheim starts from <code>/etc/fluxheim</code>, it loads top-level TOML files first and then <code>/etc/fluxheim/conf.d/*.toml</code>."
for_managed_acme_in_containers_use_the_same_bind_mounts_for_the_gateway_and_the_one_shot = "For managed ACME in containers, use the same bind mounts for the gateway and the one-shot renewal container. A complete example with an external <code>fluxheim-acme</code> service is available at"
start_the_gateway_first_then_run_due_only_renewal_with = ". Start the gateway first, then run due-only renewal with:"
keep_tls_acme_automation_and_quot_external_and_quot_in_this_mode_so_the_long_running_gat = "Keep <code>tls.acme.automation = &quot;external&quot;</code> in this mode so the long-running gateway does not also run the background renewal loop."
example_container_main_config_shape_for_first_issuance = "Example container main config shape for first issuance:"
for_container_secret_files_mount_the_files_read_only_if_the_host_tree_is_already_labeled = "For container secret files, mount the files read-only. If the host tree is already labeled with <code>container_file_t</code>, do not add a <code>:Z</code> relabel suffix to individual secret-file mounts:"
validate_the_mounted_config_directly_with_podman_run_rm_this_avoids_compose_provider_dif = "Validate the mounted config directly with <code>podman run --rm</code>. This avoids compose-provider differences around one-shot commands:"
then_start_fluxheim_replacing_any_existing_gateway_on_the_published_ports_if_you_kept_se = "Then start Fluxheim, replacing any existing gateway on the published ports. If you kept <code>server.tls_listen</code> enabled, also publish <code>443:8443</code>; otherwise publish only <code>80:8080</code> for the first issuance step:"
run_due_only_renewal_from_a_second_container_missing_certificate_files_are_due_targets_s = "Run due-only renewal from a second container. Missing certificate files are due targets, so first issuance does not require <code>--force-renew</code>:"
if_you_kept_server_tls_listen_disabled_for_the_first_run_enable_https_in_the_main_config = "If you kept <code>server.tls_listen</code> disabled for the first run, enable HTTPS in the main config after every configured ACME target has renewed:"
recreate_the_gateway_with_both_published_ports_and_verify_sni = "Recreate the gateway with both published ports and verify SNI:"
optional_mounted_error_pages_should_use_a_path_whose_parent_already_exists_in_the_runtim = "Optional mounted error pages should use a path whose parent already exists in the runtime image, such as <code>/var/lib/fluxheim/errors</code>. Avoid nested mountpoints below read-only image paths such as <code>/srv/fluxheim/errors</code>."
for_services_running_on_the_host_use_podman_and_x27_s_host_gateway_name_when_available = "For services running on the host, use Podman&#x27;s host gateway name when available:"
the_container_config_sets_grace_period_seconds_2_and_graceful_shutdown_timeout_seconds_5 = "The container config sets <code>grace_period_seconds = 2</code> and <code>graceful_shutdown_timeout_seconds = 5</code>; keep the Podman stop timeout higher than the sum of those values so normal shutdown does not fall back to <code>SIGKILL</code>."
for_local_binary_rpm_smoke_builds_use_the_containerized_helper = "For local binary RPM smoke builds, use the containerized helper:"
this_helper_is_intended_for_installation_testing_on_rpm_based_hosts_the_release_grade_rp = "This helper is intended for installation testing on RPM-based hosts. The release-grade RPM source of truth remains <code>packaging/rpm/fluxheim.spec</code>."
official_podman_documentation_describes_the_rootless_api_socket_default_as_unix_xdg_runt = "Official Podman documentation describes the rootless API socket default as <code>unix://$XDG_RUNTIME_DIR/podman/podman.sock</code>, and <code>CONTAINER_HOST</code> has precedence over configured service destinations for Podman remote connections."

