for_podman_on_selinux_hosts_z_gives_the_bind_mount_a_private_container_label_add_u_only = "For Podman on SELinux hosts, <code>:Z</code> gives the bind mount a private container label. Add <code>:U</code> only for writable paths when you want Podman to adjust ownership for user namespaces. Read-only paths normally use <code>:ro,Z</code>, not <code>:U</code>."
