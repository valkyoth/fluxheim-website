native_freebsd_packaging_should_be_documented_separately_after_it_is_tested_on_a_freebsd = "Native FreeBSD packaging should be documented separately after it is tested on a FreeBSD host. The expected path is a normal Fluxheim binary plus an rc.d service or jail deployment, not the Linux container images above."
cross_compiling_from_linux_to_freebsd_may_be_possible_later_but_it_needs_its_own_ci_job = "Cross-compiling from Linux to FreeBSD may be possible later, but it needs its own CI job because Pingora and native TLS/compression dependencies can require platform-specific toolchains and libraries."
