the_scheduler_should_wake_at_least_every_tls_acme_renewal_check_interval_secs_to_catch_newly_due_cer = "<p>The scheduler should wake at least every <code>tls.acme.renewal.check_interval_secs</code> to catch newly due certificates and config changes.</p>"
atomic_install = "<h2 id=\"atomic-install\">Atomic Install</h2>"
renewed_certificates_must_be_installed_atomically = "<p>Renewed certificates must be installed atomically:</p>"
write_certificate_and_key_to_temporary_files_in_the_acme_storage_directory = "<li>Write certificate and key to temporary files in the ACME storage directory.</li>"
validate_that_the_certificate_parses_matches_the_private_key_and_covers_the_configured_domains = "<li>Validate that the certificate parses, matches the private key, and covers the configured domains.</li>"
flush_files_and_directory_metadata_where_the_platform_supports_it = "<li>Flush files and directory metadata where the platform supports it.</li>"
