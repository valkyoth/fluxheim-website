make_audit_security_logs_available_to_stdout_even_when_remote_logging_fails = "<li>Make audit/security logs available to stdout even when remote logging fails.</li>"
protect_local_log_files_and_spool_directories_with_owner_only_permissions_where_supported = "<li>Protect local log files and spool directories with owner-only permissions where supported.</li>"
config_shape = "<h2 id=\"config-shape\">Config Shape</h2>"
initial_target = "<p>Initial target:</p>"
implemented_baseline_logging_access_enabled_controls_a_compact_json_access_event_emitted_from_pi = "<p>Implemented baseline: <code>logging.access.enabled</code> controls a compact JSON access event emitted from Pingora&#x27;s <code>logging</code> hook. It records method, optional raw host, vhost, optional query-free path, status, low-cardinality status class, error flag, request ID, request body bytes seen, response body bytes seen, and latency. If request IDs are enabled, Fluxheim reuses a valid inbound request ID from <code>request_id_header</code> or generates one and passes it upstream before normal header policy mutations run. This baseline uses the existing <code>log</code> stack. stderr/stdout and a disabled-by-default <code>[logging.file]</code> sink are implemented; the async dispatcher and remote sinks remain future work.</p>"
logging_level_and_logging_format_are_applied_at_startup_through_env_logger_rust_log_can_still_ov = "<p><code>logging.level</code> and <code>logging.format</code> are applied at startup through <code>env_logger</code>; <code>RUST_LOG</code> can still override the level for local debugging. Changing either setting after startup currently requires a process upgrade because the logger is initialized once. JSON format emits structured internal runtime records, while access events remain direct JSON access records.</p>"
