remote_sinks_should_be_optional_compile_time_support_for_example_logging_remote_durable_disk_que = "<p>Remote sinks should be optional compile-time support, for example <code>logging-remote</code>. Durable disk queue support should be behind <code>logging-spool</code>.</p>"
