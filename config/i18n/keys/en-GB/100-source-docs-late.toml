runtime_crate_candidates = "<h2 id=\"runtime-crate-candidates\">Runtime Crate Candidates</h2>"
latest_checked_acme_runtime_candidates = "<p>Latest checked ACME runtime candidates:</p>"
instant_acme_0_8_5_apache_2_0_async_pure_rust_acme_client_with_eab_support_this_is_the_current_first = "<li><code>instant-acme 0.8.5</code>: Apache-2.0, async pure-Rust ACME client with EAB support. This is the current first candidate because it does not own the TLS listener model.</li>"
rustls_acme_0_15_1_apache_2_0_or_mit_useful_reference_for_rustls_focused_certificate_management_but = "<li><code>rustls-acme 0.15.1</code>: Apache-2.0 OR MIT, useful reference for rustls-focused certificate management, but less aligned with Fluxheim&#x27;s multiple Pingora TLS backend targets.</li>"
fips_iso_required_deployments = "<h2 id=\"fips-iso-required-deployments\">FIPS/ISO-Required Deployments</h2>"
managed_fluxheim_acme_is_intentionally_outside_the_strict_fips_iso_required_runtime_boundary_in_1_3 = "<p>Managed Fluxheim ACME is intentionally outside the strict FIPS/ISO-required runtime boundary in <code>1.3.6</code>. A config with <code>[tls.fips] required = true</code> or <code>[tls.iso19790] required = true</code> rejects <code>[tls.acme] enabled = true</code> because ACME account key generation, JWS account signing, External Account Binding HMAC, outbound ACME HTTPS transport, and TLS-ALPN challenge certificate generation are not fully routed through the selected validated provider.</p>"
for_regulated_deployments_use_local_static_certificate_files_in_vhosts_tls_certificate_and_renew_the = "<p>For regulated deployments, use local static certificate files in <code>[vhosts.tls.certificate]</code> and renew them with an external process that has its own evidence package. If that external process is ACME-based, keep the ACME client version, host FIPS/ISO mode, key-generation policy, CA/audit evidence, and renewal logs with the deployment evidence. Conservative public-Web PKI profiles should request RSA 2048 or RSA 3072 certificate keys unless the assessor explicitly accepts the selected ECDSA certificate profile and chain.</p>"
the_fluxheim_acme_storage_path_hashing_uses_sha_256_and_does_not_use_md5_for_local_account_or_certif = "<p>The Fluxheim ACME storage path hashing uses SHA-256 and does not use MD5 for local account or certificate directory labels, but that is not enough to make managed ACME part of the approved cryptographic boundary. Treat <code>fluxheim-acme</code> as a normal automation tool unless and until managed ACME has provider-routed signing, key generation, EAB, and outbound TLS evidence.</p>"
retry_policy = "<h2 id=\"retry-policy\">Retry Policy</h2>"
