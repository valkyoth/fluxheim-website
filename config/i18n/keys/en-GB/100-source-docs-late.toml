both_modes_must_reuse_the_existing_static_resolver_s_canonical_path_checks = "<li>Both modes must reuse the existing static resolver&#x27;s canonical path checks.</li>"
metrics_and_access_logs_must_label_legacy_protocol_traffic_clearly = "<li>Metrics and access logs must label legacy protocol traffic clearly.</li>"
relationship_to_pingora_smuggling_advisories = "<h2 id=\"relationship-to-pingora-smuggling-advisories\">Relationship To Pingora Smuggling Advisories</h2>"
pingora_versions_before_0_8_0_had_http_request_smuggling_vulnerabilities_around_http_1_0_transfe = "<p>Pingora versions before <code>0.8.0</code> had HTTP request-smuggling vulnerabilities around HTTP/1.0 transfer-encoding parsing and premature upgrade handling. Fluxheim already tracks Pingora <code>0.8.0</code>, but legacy support must still add its own stricter rejection layer because compatibility modes are especially exposed to ambiguous parsing attacks.</p>"
