[legacy_static_http]
legacy_static_http_support_fluxheim_source_docs = "<title>Legacy Static HTTP Support — Fluxheim Source Docs</title>"
legacy_static_http_support = "<h1 id=\"legacy-static-http-support\">Legacy Static HTTP Support</h1>"
legacy_http_support_is_a_future_experimental_compatibility_feature_for_isolated_devices_that_can = "<p>Legacy HTTP support is a future experimental compatibility feature for isolated devices that cannot speak modern HTTP. It must never be part of Fluxheim&#x27;s default binary and must never run on normal proxy, cache, admin, PHP, CGI, or TLS listener paths.</p>"
the_modern_protocol_focus_for_fluxheim_remains_strict_http_1_1_and_http_2_today_with_http_3_quic = "<p>The modern protocol focus for Fluxheim remains strict HTTP/1.1 and HTTP/2 today, with HTTP/3/QUIC planned as the future performance and security direction. Legacy protocol support is a quarantined compatibility exception.</p>"
compile_time_features = "<h2 id=\"compile-time-features\">Compile-Time Features</h2>"
planned_feature_flags = "<p>Planned feature flags:</p>"
the_default_feature_set_must_never_include_these_features_release_checks_should_fail_if_cargo_tr = "<p>The default feature set must never include these features. Release checks should fail if <code>cargo tree -e features</code> shows any legacy HTTP feature enabled by default.</p>"
runtime_isolation = "<h2 id=\"runtime-isolation\">Runtime Isolation</h2>"
legacy_support_requires_explicit_runtime_config_and_dedicated_listeners = "<p>Legacy support requires explicit runtime config and dedicated listeners:</p>"
legacy_listeners_must_not_share_server_listen_server_tls_listen_admin_listen_or_metrics_listen_l = "<p>Legacy listeners must not share <code>server.listen</code>, <code>server.tls_listen</code>, <code>admin.listen</code>, or <code>metrics.listen</code>. Listener changes are process-upgrade changes.</p>"
