[certificate_renewal]
certificate_renewal_and_reload_fluxheim_source_docs = "<title>Certificate Renewal And Reload — Fluxheim Source Docs</title>"
certificate_renewal_and_reload = "<h1 id=\"certificate-renewal-and-reload\">Certificate Renewal And Reload</h1>"
fluxheim_should_support_both_operator_owned_certificates_and_acme_managed_certificates_manual_certif = "<p>Fluxheim should support both operator-owned certificates and ACME-managed certificates. Manual certificates are configured with <code>cert_path</code> and <code>key_path</code>. ACME certificates are configured per vhost and managed under <code>tls.acme.storage</code>. Fluxheim derives managed certificate paths under <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/fullchain.pem</code> and <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/privkey.pem</code>; the segment is sanitized and hash-suffixed by Fluxheim, not supplied by the operator. For HTTP-01, Fluxheim also derives a local challenge store at <code>&lt;storage&gt;/http-01/&lt;safe-vhost-segment&gt;/</code> and serves safe challenge token files directly when <code>tls.acme.challenge = &quot;http-01&quot;</code>. TLS-ALPN-01 is also supported in <code>1.1.0</code> for the default rustls backend. During renewal, Fluxheim writes short-lived challenge certificates under <code>&lt;storage&gt;/tls-alpn-01/&lt;safe-domain-segment&gt;/</code> and the rustls SNI resolver serves them only when the client offers the <code>acme-tls/1</code> ALPN protocol. DNS-01 remains future work because secure provider integrations need explicit, provider-specific secret handling rather than generic shell hooks. Challenge publication uses the same managed store: HTTP-01 tokens are restricted to one URL-safe path segment, key-authorizations are bounded and checked for control bytes, TLS-ALPN-01 certificates are generated with the ACME identifier extension, files are written through temporary files, and symlinked destinations are rejected. ACME account credentials are stored separately at <code>&lt;storage&gt;/accounts/&lt;safe-issuer-segment&gt;/credentials.json</code>, again using a Fluxheim-generated sanitized and hash-suffixed segment rather than a raw config value.</p>"
downstream_tls_listeners_are_explicit_in_server_tls_listen_the_runtime_uses_the_first_global_tls_cer = "<p>Downstream TLS listeners are explicit in <code>server.tls_listen</code>. The runtime uses the first global <code>[[tls.certificates]]</code> entry as the default certificate for those listeners. If no global certificate is configured, <code>server.default_vhost</code> may provide the fallback through either <code>[vhosts.tls.certificate]</code> or <code>[vhosts.tls.acme]</code>. Other vhosts can override that certificate with their own static or ACME-managed source; Fluxheim selects the matching certificate by SNI during the downstream TLS handshake.</p>"
managed_acme_certificates_may_be_absent_during_first_issuance_reloadable_sni_tls_backends_including = "<p>Managed ACME certificates may be absent during first issuance. Reloadable SNI TLS backends, including the default rustls build, treat missing Fluxheim-managed ACME certificate files as pending instead of refusing startup. HTTP-01 challenge routes and the cleartext listener can still serve the issuer validation request, while HTTPS handshakes for that pending SNI either use an available fallback certificate or fail until the certificate files are issued. After the background ACME worker installs the files, Fluxheim reloads the downstream SNI certificate resolver so new handshakes can use them without a process restart. Static certificate paths remain fail-closed: a missing operator-owned certificate is still a configuration/runtime error.</p>"
