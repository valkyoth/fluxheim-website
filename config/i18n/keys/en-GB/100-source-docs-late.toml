reject_request_bodies_unless_a_later_static_only_use_case_is_explicitly_justified = "<li>Reject request bodies unless a later static-only use case is explicitly justified.</li>"
if_host_is_absent_route_only_to_the_configured_legacy_vhost = "<li>If <code>Host</code> is absent, route only to the configured legacy vhost.</li>"
