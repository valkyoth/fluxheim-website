security_rejected_requests_request_smuggling_attempts_admin_auth_failures_path_traversal_denied = "<li><code>security</code>: rejected requests, request-smuggling attempts, admin auth failures, path traversal, denied PHP/CGI execution, and TLS/cert permission failures.</li>"
audit_admin_operations_such_as_snapshot_rollback_reload_purge_cache_activity_reset_load_balancer = "<li><code>audit</code>: admin operations such as snapshot, rollback, reload, purge, cache activity reset, load-balancer member-state, member-weight, or backend-set mutation, certificate renewal, and future account/key changes.</li>"
security_and_audit_logs_should_not_be_silently_disabled_per_vhost_they_may_be_rerouted_or_filter = "<p>Security and audit logs should not be silently disabled per vhost. They may be rerouted or filtered by level, but Fluxheim should make disabling them an explicit high-risk operator choice.</p>"
