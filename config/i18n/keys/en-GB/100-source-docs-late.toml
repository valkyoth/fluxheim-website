the_checker_reports_missing_certificate_key_files_non_file_certificate_key_paths_non_directory_acme = "<p>The checker reports missing certificate/key files, non-file certificate/key paths, non-directory ACME storage paths, symlinked certificate/key/EAB/storage paths including symlinked parent directories, group/world-readable private keys, and group/world-accessible ACME storage directories. Config parsing stays separate from filesystem checks so configuration can still be validated before files are provisioned.</p>"
