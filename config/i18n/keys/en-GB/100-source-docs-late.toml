keep_alive_attempts_must_still_close_the_connection = "<li>Keep-alive attempts must still close the connection.</li>"
http_1_0_requests_must_never_reach_proxy_cache_admin_php_cgi_paths = "<li>HTTP/1.0 requests must never reach proxy/cache/admin/PHP/CGI paths.</li>"
http_0_9_malformed_request_lines_must_be_rejected = "<li>HTTP/0.9 malformed request lines must be rejected.</li>"
