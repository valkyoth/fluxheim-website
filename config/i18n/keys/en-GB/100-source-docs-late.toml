add_file_sink_and_protected_local_spool_directory = "<li>Add file sink and protected local spool directory.</li>"
add_remote_tcp_tls_sink_with_circuit_breaker_and_fallback = "<li>Add remote TCP/TLS sink with circuit breaker and fallback.</li>"
expose_log_health_through_prometheus_admin_status_dropped_logs_spooled_logs_remote_failures_curr = "<li>Expose log health through Prometheus/admin status: dropped logs, spooled logs, remote failures, current circuit state, and reconnect attempts.</li>"
