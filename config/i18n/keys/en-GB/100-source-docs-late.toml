logging_architecture = "<h1 id=\"logging-architecture\">Logging Architecture</h1>"
fluxheim_logging_should_be_structured_asynchronous_and_explicit_about_the_tradeoff_between_reque = "<p>Fluxheim logging should be structured, asynchronous, and explicit about the tradeoff between request latency and durability. Logging must never hide security-relevant events, and remote logging failure must not break normal traffic.</p>"
