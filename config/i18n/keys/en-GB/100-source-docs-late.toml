on_send_failure_the_dispatcher_should_immediately_fallback_for_that_event_trip_the_remote_sink_a = "<p>On send failure, the dispatcher should immediately fallback for that event, trip the remote sink, and increment metrics. Reconnect attempts should use bounded exponential backoff.</p>"
