keep_the_previous_certificate_available_until_the_new_one_is_active = "<li>Keep the previous certificate available until the new one is active.</li>"
the_current_install_helper_implements_the_filesystem_side_of_that_contract_it_validates_basic_pem_sh = "<p>The current install helper implements the filesystem side of that contract. It validates basic PEM shape and size, writes temporary files next to the managed destination, rejects symlinked directories or destination files, keeps backups of existing files while staging, and cleans temporary files on failure. Full certificate/key matching and domain coverage validation belongs in the ACME client step before this helper is called. Failed issuer calls and failed certificate installs do not remove the previous active certificate.</p>"
no_downtime_reload = "<h2 id=\"no-downtime-reload\">No-Downtime Reload</h2>"
runtime_state_should_be_immutable_snapshots_behind_an_atomic_pointer_existing_requests_keep_their_cu = "<p>Runtime state should be immutable snapshots behind an atomic pointer. Existing requests keep their current snapshot. New requests use the latest snapshot after reload. Fluxheim&#x27;s proxy routing state already uses this model for vhost, upstream, cache, and static web policy snapshots. This model applies to:</p>"
vhost_routing = "<li>vhost routing</li>"
upstream_pools = "<li>upstream pools</li>"
cache_policies = "<li>cache policies</li>"
certificate_lookup_maps = "<li>certificate lookup maps</li>"
listener_changes_are_process_level_changes_and_should_use_pingoras_zero_downtime_upgrade_path_rather = "<p>Listener changes are process-level changes and should use Pingora&#x27;s zero-downtime upgrade path rather than in-place mutation.</p>"
reload_classification = "<h2 id=\"reload-classification\">Reload Classification</h2>"
fluxheim_classifies_a_config_change_before_applying_it = "<p>Fluxheim classifies a config change before applying it:</p>"
noop_old_and_new_config_are_identical = "<li><code>Noop</code>: old and new config are identical.</li>"
snapshot_safe_for_in_place_snapshot_swap = "<li><code>Snapshot</code>: safe for in-place snapshot swap.</li>"
processupgrade_requires_pingoras_process_level_zero_downtime_upgrade_path = "<li><code>ProcessUpgrade</code>: requires Pingora&#x27;s process-level zero-downtime upgrade path.</li>"
operators_can_check_the_impact_of_a_planned_config_change = "<p>Operators can check the impact of a planned config change:</p>"
durable_config_history_and_rollback_commands_are_documented_in_config_snapshots_and_rollback = "<p>Durable config history and rollback commands are documented in <a href=\"config-snapshots.html\" class=\"text-cyan-400 hover:text-cyan-300\">Config Snapshots And Rollback</a>.</p>"
snapshot_reload_is_intended_for_routing_cache_policy_static_web_policy_and_certificate_lookup_change = "<p>Snapshot reload is intended for routing, cache policy, static web policy, and certificate lookup changes that do not alter listeners or startup-owned background services.</p>"
process_upgrade_is_required_when = "<p>Process upgrade is required when:</p>"
listener_addresses_change = "<li>listener addresses change</li>"
downstream_tls_mode_changes = "<li>downstream TLS mode changes</li>"
the_configured_tls_backend_changes = "<li>the configured TLS backend changes</li>"
load_balancer_background_service_registration_ownership_changes = "<li>load-balancer background service registration/ownership changes</li>"
this_keeps_the_hot_reload_path_conservative_until_fluxheim_has_explicit_runtime_ownership_for_adding = "<p>This keeps the hot-reload path conservative until Fluxheim has explicit runtime ownership for adding and removing background services after startup.</p>"

