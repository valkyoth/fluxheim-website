before_implementation_is_considered_usable = "<p>Before implementation is considered usable:</p>"
http_1_0_transfer_encoding_chunked_must_be_rejected = "<li>HTTP/1.0 <code>Transfer-Encoding: chunked</code> must be rejected.</li>"
