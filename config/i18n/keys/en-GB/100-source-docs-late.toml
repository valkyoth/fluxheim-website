avoid_disk_or_network_writes_on_request_worker_hot_paths = "<li>Avoid disk or network writes on request worker hot paths.</li>"
add_remote_logging_only_behind_explicit_config_and_optional_compile_features = "<li>Add remote logging only behind explicit config and optional compile features.</li>"
make_overflow_behavior_explicit_instead_of_pretending_logs_are_always_both_non_blocking_and_loss = "<li>Make overflow behavior explicit instead of pretending logs are always both non-blocking and lossless.</li>"
