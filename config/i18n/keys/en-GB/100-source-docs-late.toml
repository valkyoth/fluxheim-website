the_motivation_is_compatibility_with_old_internal_health_checks_plcs_and_legacy_enterprise_equip = "<p>The motivation is compatibility with old internal health checks, PLCs, and legacy enterprise equipment, not public internet service.</p>"
http_0_9_static_mode = "<h2 id=\"http-0-9-static-mode\">HTTP/0.9 Static Mode</h2>"
http_0_9_is_too_old_and_ambiguous_for_pingora_s_normal_http_pipeline_it_should_be_implemented_if = "<p>HTTP/0.9 is too old and ambiguous for Pingora&#x27;s normal HTTP pipeline. It should be implemented, if ever, as a separate raw TCP service.</p>"
