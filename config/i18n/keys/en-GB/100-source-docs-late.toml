renew_after_lets_an_operator_defer_automatic_renewal_until_a_chosen_toml_offset_datetime_for_example = "<p><code>renew_after</code> lets an operator defer automatic renewal until a chosen TOML offset datetime, for example <code>2026-06-01T00:00:00Z</code>. Local TOML datetimes are rejected so the queue cannot interpret operator intent in the wrong timezone.</p>"
when_fluxheim_is_built_with_acme_client_the_runtime_registers_a_background_renewal_service_when_acme = "<p>When Fluxheim is built with <code>acme-client</code>, the runtime registers a background renewal service when ACME-managed vhosts are configured and <code>tls.acme.automation = &quot;background&quot;</code>. This is the default for simple single-process installs. The service observes managed certificate expiry, wakes every <code>tls.acme.renewal.check_interval_secs</code>, and renews missing or due certificates through the same ACME challenge path used by the CLI.</p>"
after_successful_renewal_fluxheim_reloads_the_downstream_sni_certificate_resolver_or_callback_so_new = "<p>After successful renewal, Fluxheim reloads the downstream SNI certificate resolver or callback so new handshakes can use the freshly installed files without restarting. If a TLS backend or listener shape cannot provide a reload handle, Fluxheim logs that a restart or process reload is required.</p>"
this_reload_happens_inside_the_long_running_fluxheim_process_the_gateway_also_owns_a_local_unix_doma = "<p>This reload happens inside the long-running Fluxheim process. The gateway also owns a local Unix-domain certificate reload socket at <code>server.process.certificate_reload_sock</code>, defaulting to:</p>"
the_socket_accepts_only_the_narrow_reload_certificates_operation_and_is_created_with_owner_only_perm = "<p>The socket accepts only the narrow <code>reload-certificates</code> operation and is created with owner-only permissions by the running gateway. It is intended for the same runtime user or container pod, not remote administration. The long-running gateway caps concurrent reload-control requests, and each accepted request still uses a short fixed read timeout. The companion reads the gateway response with a small fixed bound so a compromised or replaced local socket cannot grow companion memory without limit.</p>"
production_packages_include_the_fluxheim_acme_companion_binary_while_keeping_the_integrated_backgrou = "<p>Production packages include the <code>fluxheim-acme</code> companion binary while keeping the integrated background worker for simple installs. In this model, <code>fluxheim.service</code> stays focused on serving traffic and challenge files, while the one-shot <code>fluxheim-acme.service</code> and scheduled <code>fluxheim-acme.timer</code> run renewals as the Fluxheim runtime user. The companion command reuses the same ACME engine and storage layout as the legacy <code>fluxheim acme-renew</code> command, uses systemd credentials or container secrets for EAB material, and writes certificates below the configured <code>tls.acme.storage</code>. When certificates are renewed, it asks the running gateway to reload its certificate handles through <code>server.process.certificate_reload_sock</code>. Set <code>tls.acme.automation = &quot;external&quot;</code> in this mode so the webserver does not also run the background renewal loop.</p>"
