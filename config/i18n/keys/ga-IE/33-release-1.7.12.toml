r1712_released_july_15_2026 = "Foilsithe 15 Iúil 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Cuireann sé meiteashonraí roghnacha, caighdeánbhunaithe leis don taisce, don seachfhreastalaí agus d'achoimrí freagartha"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Deimhníonn sé athlódáil agus aischur seatanna beo fíordheimhnithe, seiceálacha sláine agus marthanacht tar éis atosaithe"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Cuireann sé fianaise in-atáirgthe ar innill FIPS agus hardú fairsing ar an am rite dúchasach leis"
r1712_whats_next_summary = "cuireann sé meiteashonraí caighdeánacha roghnacha, aischur fíordheimhnithe seatanna, fianaise in-atáirgthe ar innill FIPS agus teorainneacha níos láidre don taisce, TLS, Wasm, maolánú agus sruthanna leis."
r1712_release_series_digest = "Sraith Fluxheim 1.7: meiteashonraí roghnacha, caighdeánbhunaithe don taisce, don seachfhreastalaí agus d'achoimrí freagartha; athlódáil agus aischur seatanna beo fíordheimhnithe; fianaise in-atáirgthe ar innill FIPS; uasghráduithe próisis gan aga neamhfhónaimh; samplaí beartais Wasm a tástáladh go neamhspleách; agus teorainneacha níos láidre don taisce, TLS, maolánú, sruthanna agus prótacail."
r1712_standards_based_response_metadata = "Meiteashonraí freagartha bunaithe ar chaighdeáin"
r1712_response_metadata_intro = "Díchumasaítear meiteashonraí freagartha de réir réamhshocraithe. Cumasaigh ach na réimsí atá uait; Díorthaíonn Fluxheim iad as an toradh taisce iarbhír, teip seachfhreastalaí, agus bearta freagartha deiridh gan eochracha taisce, seoltaí inneall, ainmneacha DNS, nó earráidí amh a nochtadh."
r1712_field = "Réimse"
r1712_what_it_reports = "Cad a thuairiscíonn sé"
r1712_cache_status_description = "Torthaí taisce RFC 9211 mar bhuail, chailleann, cur ar aghaidh sean, athbhailíochtú, dul in éag, agus seachbhóthar."
r1712_proxy_status_description = "Sonraí íseal-cardinality RFC 9209 maidir le teipeanna ginte ag Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 thar ábhar teachtaireacht deiridh HTTP tar éis comhbhrú."
r1712_repr_digest_description = "SHA-256 ach amháin nuair a shealbhaíonn Fluxheim an ionadaíocht iomlán roghnaithe."
r1712_live_snapshots_and_rollback = "Seatanna beo agus aischur"
r1712_live_snapshot_intro = "Is féidir le seatanna fíordheimhnithe cumraíocht bhailíochtaithe a fhoilsiú, an ródaire reatha a athsholáthar agus filleadh ar an leagan roimhe gan gnáth-imlonnuithe ródaithe amháin a atosú. Úsáideann gach iarratas an ghlúin chéanna ródaire ó thús go deireadh."
r1712_snapshot_private_directory = "Coinnigh an siopa seat in eolaire príobháideach tiomnaithe; diúltaítear d’eolairí neamhphríobháideacha agus do fhréamhacha córais comhaid atá ann cheana féin."
r1712_snapshot_process_upgrade = "Bain úsáid as uasghrádú próisis nuair a bhíonn seirbhísí sláinte nó fionnachtana ualach-chothromaithe cúlra gníomhach."
r1712_snapshot_integrity_restart = "Rith seiceálacha sláine pictiúr tar éis é a fhoilsiú nó a rolladh siar agus deimhnigh go bhfuil an ghlúin roghnaithe ar marthain don atosú."
r1712_read_snapshot_contract = "Léigh an conradh pictiúr iomlán"
r1712_authorization_cache_bypass = "Seachnaíonn iarratais a iompraíonn <code>Authorization</code> nó <code>Proxy-Authorization</code> cuardach agus stóráil taisce comhroinnte i gcónaí."
r1712_strict_cache_control = "Freagra míchumtha nó contrártha diúltaítear do threoracha <code>Cache-Control</code> in ionad titim siar ar TTLanna cumraithe; Tugtar tosaíocht do <code>s-maxage</code> thar <code>max-age</code>."
r1712_mandatory_revalidation = "Cuireann <code>must-revalidate</code>, <code>proxy-revalidate</code>, agus <code>s-maxage</code> cosc ar athúsáid stale tar éis don úire dul in éag."
r1712_encrypted_cache_upgrade_note = "Nóta uasghrádaithe criptithe-taisce"
r1712_encrypted_cache_upgrade_intro = "Bogann Fluxheim 1.7.12 oibiachtaí taisce diosca criptithe go dtí na heochracha sonraí agus na heochracha innéacs atá ceangailte le fréamh le staid marthanach nonce. Déanann an chéad tosaithe i gcoinne fréamh criptithe níos sine, agus gach uainíocht áitiúil-eochair, glanadh d'aon ghnó an taisce sin sula bhfreastalaíonn sé ar thrácht."
r1712_encrypted_cache_disposable = "Tá sonraí an taisce chriptithe indiúscartha agus ní ceadmhach iad a úsáid mar fhoinse údarásach sonraí."
r1712_encrypted_cache_private_storage = "Tabhair stór príobháideach marthanach do gach fréamh taisce agus ná cóipeáil aon stát idir fréamhacha neamhspleácha."
r1712_encrypted_cache_warmup = "Pleanáil acmhainn tionscnaimh don chéad téamh suas tar éis eochracha a uasghrádú nó a rothlú."
r1712_client_certificate_revocation = "Deimhniú an chliaint a chúlghairm"
r1712_client_certificate_revocation_intro = "Nuair a chaithfidh TLS frithpháirteach deimhnithe cliant cúlghairthe a dhiúltú, cuir bundle teoranta PEM CRL ar fáil. Déanann Fluxheim an slabhra eisitheora iomlán a bhailíochtú agus diúltaíonn sé do pholasaí CRL atá imithe in éag nó atá neamhiomlán."
r1712_client_certificate_revocation_compliance = "Éilíonn fíordheimhniú éigeantach cliant i mód comhlíonta FIPS nó ISO beart CRL freisin. I ngnáthfhíordheimhniú cliant, ní mór seiceáil cúlghairme a chumasú go sainráite."
r1712_fips_backend_evidence = "Fianaise backend FIPS"
r1712_fips_backend_evidence_intro = "Soláthraíonn Fluxheim timpeallachtaí cruthúnais CI pinned ar leithligh do na próifílí OpenSSL-FIPS agus rustls/AWS-LC-FIPS. Tógann agus reáchtálann siad an phróifíl dhénártha chruinn, déanann siad feidhmiú iartheachtach agus deimhnithe in aghaidh an tsrutha TLS, diúltaíonn siad do bheartas neamh-chomhoiriúnach, agus taifeadann siad féiniúlachtaí tiomsaitheora, soláthraí, spleáchais, dhénártha agus íomhá."
r1712_fips_backend_evidence_boundary = "Fianaise inneall in-atáirgthe í seo, ní bailíochtú ar leibhéal an táirge FIPS. Coinnigh na coimeádáin cruthúnais scartha ó ghnáthíomhánna scaoilte agus athbhreithnigh an fhianaise don tógáil cruinn a úsáideann tú."
r1712_read_fips_evidence_guide = "Léigh an treoir fianaise FIPS"
r1712_loader_admission = "Rialuithe lódála modúl"
r1712_loader_admission_description = "Ní mór achoimre sheasta SHA-256 a bheith i manifestí poiblí breiseán. Ní thiomsaítear níos mó ná dhá mhodúl ag an am ar fud an phróisis. Is é 32 MiB an teorainn réamhshocraithe don aschur tiomsaithe agus ní féidir leis dul thar 256 MiB."
r1712_file_identity = "Aitheantas comhaid"
r1712_file_identity_description = "Fluxheim Osclaíonn comhaid formheasta breiseán gan naisc a leanúint, coinníonn an láimhseáil comhad rialta bailíochtaithe, agus léann bearta modúil ón láimhseáil sin gan an cosán a athoscailt."
