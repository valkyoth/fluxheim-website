[home]
meta_description = "Is freastalaí gréasáin ardfheidhmíochta modúlach, seachfhreastalaí droim ar ais agus freastalaí taisce é Fluxheim, tógtha i Rust."
meta_description_secure = "Is freastalaí gréasáin ardfheidhmíochta modúlach, seachfhreastalaí droim ar ais agus freastalaí taisce é Fluxheim. Scríofa i Rust. Slán de réir réamhshocraithe."
meta_description_short = "Freastalaí imeallach agus seachfhreastalaí droim ar ais cuimhne-shábháilte tógtha i Rust."
hero_memory_safe = "Cuimhne-shábháilte"
hero_edge_server = "Freastalaí imeallach"
hero_built_in_rust = "Tógtha i Rust"
hero_line_one = "Seachfhreastalaí droim ar ais modúlach, taisce, cothromóir ualaigh agus óstach statach scríofa"
hero_line_two = "i Rust. Slán de réir réamhshocraithe le TLS, ACME, comhbhrú, beartas imeallach,"
hero_line_three = "aimsiú dinimiciúil upstream agus scáthánú tráchta sábháilte ionsuite."
tag_fluxheim_core = "Croí Fluxheim"
tag_rootless_containers = "Coimeádáin gan fréamh"
features_heading = "Gach rud atá uait ag an imeall"
features_intro = "Tagann Fluxheim mar thógálacha dírithe modúlacha — bain úsáid as an méid atá de dhíth ar do chur i bhfeidhm amháin."
memory_safe_by_design = "Cuimhne-shábháilte de réir dearaidh"
memory_safe_by_design_text = "Scríofa i Rust le toolchain cobhsaí pinnte. Gan ró-shreabhadh maoláin, gan úsáid tar éis saoraithe, gan rásaí sonraí de réir tógála."
fluxheim_http_core = "Croí HTTP Fluxheim"
fluxheim_http_core_text = "A Rust-dúchasach edge am rite le connection pooling, upstream retries, active seiceálacha sláinte, HTTP/2, WebSocket upgrades, agus gRPC pass-through."
load_balancer_control_plane = "Eitleán rialaithe cothromóra ualaigh"
load_balancer_control_plane_text = "Focused 1.5 load-balancer binary agus image le advanced selection, áitiúil persistence, sláinte/ejection beartas, teoranta queueing, agus am rite member rialuithe."
modular_build_profiles = "Próifílí tógála modúlacha"
modular_build_profiles_text = "Compile amháin what you need. Focused próifílí do static suíomh, cache edge, seachfhreastalaí droim ar ais, load balancing, TCP stream proxying, PHP-FPM, GeoIP, scáthánú tráchta, agus comhbhrú-enabled production bundles."
tls_managed_acme = "TLS agus ACME bainistithe"
tls_managed_acme_text = "rustls-first le supported OpenSSL agus FIPS/ISO proof tógáil cosáin, client teastas auth, upstream mTLS, automatic ACME issuance, agus multi-cert SNI."
advanced_cache_system = "Córas taisce ardleibhéil"
advanced_cache_system_text = "Memory, diosca, tiered, agus criptithe cache backends le cache-sábháilte gzip, Zstandard, agus Brotli comhbhrú plus range caching do large objects."
container_native = "Dúchasach do choimeádáin"
container_native_text = "Gan fréamh Podman images do Wolfi, Alpine, SUSE Micro, agus Debian. Systemd/RPM do dúchasach deployments. Zero external assets on startup."
prometheus_opentelemetry = "Prometheus agus OpenTelemetry"
prometheus_opentelemetry_text = "Opt-in Prometheus méadrachtaí éisteoir, OTLP méadrachtaí export, trace context propagation, agus OTLP trace export do full observability."
geo_context_text = "Roghnach áitiúil MMDB lookups do country agus ASN beartas using MaxMind GeoIP2/GeoLite2 nó CIRCL Geo Open datasets. No remote lookup nó downloader in the iarratas cosán."
tcp_stream_proxy = "Seachfhreastalaí srutha TCP"
tcp_stream_proxy_text = "Raw L4 TCP services le dedicated stream bealaí, true idle/lifetime/byte caps, upstream TLS/mTLS rialuithe, weighted/drain/backup beartas, agus bealach-áitiúil PROXY protocol."
php_fpm_support = "Tacaíocht PHP-FPM"
php_fpm_support_text = "Opt-in PHP-FPM FastCGI bridge do WordPress-style front-controller applications. Dian script resolution agus teoranta iarratas handling."
edge_policy_controls = "Rialuithe beartais imeallacha"
edge_policy_controls_text = "Trusted-proxy-aware ACLs, rate teorainneacha, auth subrequests, scáthánú tráchta, regex rewrites, teoranta queues, dian bailíochtú config, agus cruaite iarratas handling."
