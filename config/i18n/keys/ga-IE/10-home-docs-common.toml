last_updated_june_23_2026 = "Nuashonraithe go deireanach: 23 Meitheamh 2026"
no_analytics_cookies = "Gan fianáin anailísíochta"
no_analytics_cookies_text = "Ní úsáideann suíomh Fluxheim fianáin anailísíochta, fianáin fógraíochta, méarlorgaireacht, aitheantóirí stórála áitiúla ná scripteanna anailísíochta tríú páirtí."
language_selector_cookie_text = "The teanga selector uses normal links agus does not need a cookie. If a amach anseo deployment adds a strictly necessary cookie, this notice must be updated roimh that change is enabled."
aggregate_observability = "Infheictheacht chomhiomlán"
aggregate_observability_text = "We collect first-party aggregate observability imeachtaí to comhaireamh visits, teanga usage, leathanach sections, downloads, GitHub redirects, iarratas latency, agus approximate visible time on a leathanach."
events_no_sensitive_text = "These imeachtaí do not contain raw IP addresses, user identifiers, cookie values, browser fingerprints, iarratas bodies, authorization ceanntásca, nó full query strings."
what_we_collect = "Cad a bhailímid"
privacy_collect_text = "The suíomh gréasáin records aggregate operational méadrachtaí: iarratas comhaireamh, leathanach views, selected teanga, normalized leathanach bealach, section, HTTP status class, iarratas duration, download clicks, GitHub redirect clicks, agus approximate leathanach visible time."
country_aggregation_text = "Roghnach country aggregation may be enabled by the operator. When enabled, the server derives a country code in cuimhne agus exports amháin the country code nó unknown."
what_we_do_not_collect = "Cad nach mbailímid"
privacy_do_not_collect_text = "We do not export raw IP addresses, per-user identifiers, analytics cookies, browser fingerprints, complete user agents, referrer URLs, iarratas bodies, authorization ceanntásca, cookie ceanntásca, nó full query strings."
telemetry_use_text = "Telemetry is used to operate the suíomh gréasáin, understand aggregate documentation agus download usage, agus detect reliability problems. It is not used to tógáil próifílí about individual cuairteoirí."
retention = "Coinneáil"
retention_text = "Retention is controlled by the áitiúil Prometheus agus Grafana deployment operated do the suíomh gréasáin. The suíomh gréasáin application does not write a separate analytics database."
purpose_and_lawful_basis = "Cuspóir agus bunús dlíthiúil"
gdpr_basis_text = "The purpose of the suíomh gréasáin telemetry is slándáil, reliability, capacity planning, agus aggregate documentation improvement. The intended lawful basis is legitimate interest in operating agus securing the suíomh gréasáin le privacy-minimised telemetry."
data_minimisation = "Íoslaghdú sonraí"
gdpr_minimisation_text = "Metrics use teoranta labels such as locale, normalized bealach, section, status class, download artifact, GitHub target, agus roghnach country code. The implementation is designed not to store nó export raw IP addresses nó user-level tracking identifiers."
github_redirect_privacy_text = "GitHub outbound clicks are counted in aggregate roimh redirecting the browser to GitHub. GitHub then processes the iarratas under GitHub's own terms agus privacy beartas."
your_rights = "Do chearta"
gdpr_rights_text = "Because the suíomh gréasáin avoids user identifiers agus stores amháin aggregate telemetry, we normally cannot identify a specific visitor inside the méadrachtaí. Privacy nó GDPR questions can be opened through the Fluxheim GitHub project."
translation_notice = "Fógra aistriúcháin"
translation_notice_text = "Déantar aistriúcháin an tsuímh le cabhair AI agus coimeádtar iad ar bhonn iarrachta is fearr. Tá fáilte roimh cheartúcháin agus aistriúcháin fheabhsaithe sna <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">heochracha i18n do shuíomh Fluxheim</a>."
