r1712_released_july_15_2026 = "Publikuar më 15 korrik 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Shton meta të dhënat e meta të dhënave memorie të fshehtë, përfaqësuese dhe përmbledhje të përgjigjeve të bazuara në standarde zgjedhore"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Provon rifreskimin e vërtetë të çastit të drejtpërdrejtë, rikthimin, kontrollet e integritetit dhe rinisjen e qëndrueshmërisë"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Shton prova të riprodhueshme FIPS-backend dhe forcim të gjerë të kohës së funksionimit"
r1712_whats_next_summary = "shton metadatat e standardeve të zgjedhjes, prova të vërtetuara të rikthimit të çastit, dëshmi të riprodhueshme FIPS-backend dhe memorie më të fortë, TLS, Wasm, buffering dhe kufijtë e transmetimit."
r1712_release_series_digest = "Fluxheim Seritë e lëshimit të 1.7: meta të dhënat e meta të dhënave të përmbledhjes së memories dhe të përmbledhjes së përgjigjeve të bazuara në standarde zgjedhore; Ringarkimi dhe rikthimi i autentikuar i fotografisë së drejtpërdrejtë; dëshmi të riprodhueshme FIPS-backend; përmirësimet e procesit me kohë zero ndërprerje; shembuj të politikave Wasm të testuara në mënyrë të pavarur; dhe cache më të fortë, TLS, buffering, stream dhe kufijtë e protokollit."
r1712_standards_based_response_metadata = "Meta të dhënat e përgjigjeve të bazuara në standarde"
r1712_response_metadata_intro = "Të dhënat meta të përgjigjes janë çaktivizuar si parazgjedhje. Aktivizoni vetëm fushat që ju nevojiten; Fluxheim i nxjerr ato nga rezultati aktual i cache-it, dështimi i proxy-it dhe bajtët e përgjigjes përfundimtare pa ekspozuar çelësat e cache-it, adresat e backend-it, emrat e DNS ose gabimet e papërpunuara."
r1712_field = "Fusha"
r1712_what_it_reports = "Ajo që raporton"
r1712_cache_status_description = "RFC 9211 rezultatet e cache-it të tilla si goditja, humbja, përcjellja e ndenjur, rivlerësimi, skadimi dhe anashkalimi."
r1712_proxy_status_description = "RFC 9209 detaje me kardinalitet të ulët për dështimet e krijuara nga Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 mbi përmbajtjen përfundimtare të mesazhit HTTP pas kompresimit."
r1712_repr_digest_description = "SHA-256 vetëm kur Fluxheim mban paraqitjen e plotë të zgjedhur."
r1712_live_snapshots_and_rollback = "Foto të drejtpërdrejta dhe rikthim"
r1712_live_snapshot_intro = "Fotografitë e vërtetuara mund të publikojnë një kandidat të vlefshëm, të zëvendësojnë ruterin e drejtpërdrejtë dhe të kthehen pa rifilluar vendosjet normale vetëm për rrugëtim. Çdo kërkesë qëndron në një brez ruteri nga fillimi në fund."
r1712_snapshot_private_directory = "Mbajeni dyqanin e fotografive në një drejtori të dedikuar private; drejtoritë ekzistuese jo private dhe rrënjët e sistemit të skedarëve refuzohen."
r1712_snapshot_process_upgrade = "Përdorni një përmirësim të procesit kur shërbimet e shëndetit ose zbulimit të balancuesit të ngarkesës në sfond janë aktive."
r1712_snapshot_integrity_restart = "Kryeni kontrollet e integritetit të fotografive pas publikimit ose rikthimit dhe verifikoni që gjenerata e përzgjedhur të mbijetojë rinisjen."
r1712_read_snapshot_contract = "Lexoni kontratën e plotë të fotografisë"
r1712_authorization_cache_bypass = "Kërkesat që përmbajnë <code>Authorization</code> ose <code>Proxy-Authorization</code> anashkalojnë gjithmonë kërkimin dhe ruajtjen e memories së përbashkët."
r1712_strict_cache_control = "Përgjigja e gabuar ose konfliktuale Direktivat <code>Cache-Control</code> refuzohen në vend që të kthehen në TTL të konfiguruara; <code>s-maxage</code> ka përparësi ndaj <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> dhe <code>s-maxage</code> ndalojnë ripërdorimin e ndenjur pas skadimit të freskisë."
r1712_encrypted_cache_upgrade_note = "Shënim për përmirësimin e memories së koduar"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 zhvendos objektet e memories së enkriptuar të diskut te të dhënat e lidhura me rrënjë dhe çelësat e indeksit me gjendje të qëndrueshme nonce. Nisja e parë kundër një rrënjë të koduar më të vjetër, dhe çdo rrotullim i çelësit lokal, e pastron qëllimisht atë memorie të fshehtë përpara se të shërbejë trafikun."
r1712_encrypted_cache_disposable = "Trajtojeni cache-in e koduar si përshpejtim të disponueshëm, jo si burim regjistrimi."
r1712_encrypted_cache_private_storage = "Jepini çdo rrënjë të memories së memories ruajtëse private të vazhdueshme dhe mos kopjoni gjendjen nonce midis rrënjëve të pavarura."
r1712_encrypted_cache_warmup = "Planifikoni kapacitetin e origjinës për ngrohjen e parë pas përmirësimit ose rrotullimit të çelësave."
r1712_client_certificate_revocation = "Revokimi i certifikatës së klientit"
r1712_client_certificate_revocation_intro = "Kur TLS reciprok duhet të refuzojë certifikatat e klientit të revokuara, jepni një paketë PEM CRL të kufizuar. Fluxheim vërteton zinxhirin e plotë të emetuesit dhe refuzon politikën CRL të skaduar ose jo të plotë."
r1712_client_certificate_revocation_compliance = "Vërtetimi i kërkuar i klientit në një modalitet të pajtueshmërisë FIPS ose ISO kërkon gjithashtu një paketë CRL. Autentifikimi i zakonshëm i klientit e mban revokimin si një zgjedhje të qartë."
r1712_fips_backend_evidence = "FIPS prova prapambetje"
r1712_fips_backend_evidence_intro = "Fluxheim ofron mjedise rezistente ndaj CI të mbërthyera veçmas për profilet OpenSSL-FIPS dhe rustls/AWS-LC-FIPS. Ata ndërtojnë dhe ekzekutojnë profilin e saktë binar, ushtrojnë TLS në rrjedhën e poshtme dhe të verifikuar nga certifikata, refuzojnë politikat e papajtueshme dhe regjistrojnë identitetet e përpiluesit, ofruesit, varësinë, binare dhe imazhe."
r1712_fips_backend_evidence_boundary = "Kjo është evidencë e riprodhueshme e mbështetjes, jo vërtetim FIPS në nivel produkti. Mbajini kontejnerët provues të ndarë nga imazhet e lëshimit normal dhe rishikoni provat për ndërtimin e saktë që vendosni."
r1712_read_fips_evidence_guide = "Lexoni udhëzuesin e provave FIPS"
r1712_loader_admission = "Kontrollet e ngarkimit të moduleve"
r1712_loader_admission_description = "Manifestet publike të shtojcave duhet të përmbajnë një digest SHA-256 të fiksuar. Në të gjithë procesin mund të kompilohen njëkohësisht jo më shumë se dy module. Dalja e kompiluar ka kufi të parazgjedhur 32 MiB dhe nuk mund të kalojë 256 MiB."
r1712_file_identity = "Identiteti i skedarit"
r1712_file_identity_description = "Fluxheim hap skedarët e miratuar të shtojcave pa lidhjet e mëposhtme, ruan dorezën e vërtetuar të skedarit të rregullt dhe lexon bajtet e modulit nga ajo dorezë pa rihapur shtegun."
