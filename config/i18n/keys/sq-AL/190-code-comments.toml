p065_proxy_operations_line_with_production_proxy_parity_richer_route_policy_traffic_mirroring = "Linja e operimeve proxy me parity prodhimi, politika route më të pasura, traffic mirroring, dynamic upstream discovery, ndarje modulare runtime/config, asete Apple Silicon dhe Linux ARM64, GeoIP/Geo-Context, arkiva config-tester dhe TCP stream proxying të forcuar"
p066_cache_and_observability_baseline_with_route_scoped_cache_policy_memory_disk_tiered = "Bazë cache dhe observability me politikë cache në nivel route, backend-e memory/disk/tiered, cache disku të enkriptuar, peer fill, range caching, Prometheus dhe eksport OpenTelemetry"
p067_certificate_operations_line_with_tls_policy_profiles_multi_certificate_rustls_sni_managed = "Linja e operimeve të certifikatave me profile politike TLS, rustls SNI me shumë certifikata, issuance dhe renewal ACME të menaxhuar, issuer-a me EAB, sekrete TLS të mbështetura në skedarë dhe njësi renewal"
p068_gateway_foundation_with_vhost_routing_route_level_static_proxy_redirect_actions_static = "Themel gateway me vhost routing, veprime static/proxy/redirect në nivel route, shërbim skedarësh statikë, reverse proxying, rustls TLS, admin control-plane, header-a sigurie, paketim systemd dhe kontejnerë rootless"
