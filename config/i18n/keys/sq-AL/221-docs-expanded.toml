version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Versioni 1.6.37 është pastrimi final i kufijve të crate para Wasm: ACME, observability, cache, load-balancer, PHP-FPM dhe pjesët e native runtime kalojnë në module më të vogla të crate-ve, ndërsa sjellja runtime mbetet stabile."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "Versioni 1.6.37 e bën smoke lokal të observability më të besueshëm duke riprovuar nisje të përkohshme Prometheus dhe Jaeger me porte të reja kur portet host-network konkurrojnë me procese të tjera runner."

