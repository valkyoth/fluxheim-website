what_we_collect = "Çfarë mbledhim"
privacy_collect_text = "Faqja regjistron metrika operacionale agregate: numër request-esh, page views, gjuhën e zgjedhur, route të normalizuar, seksionin, klasën e statusit HTTP, kohëzgjatjen e request-it, klikime shkarkimi, klikime redirect në GitHub dhe kohën e përafërt të dukshmërisë së faqes."
country_aggregation_text = "Agregimi sipas vendit mund të aktivizohet opsionalisht nga operatori. Kur aktivizohet, serveri nxjerr një country code në memorie dhe eksporton vetëm country code ose unknown."
what_we_do_not_collect = "Çfarë nuk mbledhim"
privacy_do_not_collect_text = "Nuk eksportojmë adresa IP raw, identifikues për përdorues, cookies analitike, browser fingerprints, user agents të plota, referrer URL, request bodies, authorization headers, cookie headers ose query strings të plota."
telemetry_use_text = "Telemetria përdoret për të operuar faqen, për të kuptuar përdorimin agregat të dokumentacionit dhe shkarkimeve, dhe për të zbuluar probleme besueshmërie. Nuk përdoret për të ndërtuar profile për vizitorë individualë."
retention = "Ruajtja"
retention_text = "Ruajtja kontrollohet nga deployimi lokal Prometheus dhe Grafana që operohet për faqen. Aplikacioni i faqes nuk shkruan një bazë të veçantë analitike."
purpose_and_lawful_basis = "Qëllimi dhe baza ligjore"
gdpr_basis_text = "Qëllimi i telemetrisë së faqes është siguria, besueshmëria, planifikimi i kapacitetit dhe përmirësimi agregat i dokumentacionit. Baza ligjore e synuar është interesi legjitim për operimin dhe sigurimin e faqes me telemetri të minimizuar për privatësinë."
data_minimisation = "Minimizimi i të dhënave"
gdpr_minimisation_text = "Metrikat përdorin etiketa të kufizuara si locale, route të normalizuar, seksion, klasë statusi, artifact shkarkimi, target GitHub dhe country code opsional. Implementimi është projektuar të mos ruajë ose eksportojë adresa IP raw ose identifikues gjurmimi në nivel përdoruesi."
github_redirect_privacy_text = "Klikimet dalëse në GitHub numërohen në agregat para se shfletuesi të ridrejtohet në GitHub. Më pas GitHub e përpunon request-in sipas kushteve dhe politikës së vet të privatësisë."
your_rights = "Të drejtat tuaja"
gdpr_rights_text = "Meqë faqja shmang identifikuesit e përdoruesve dhe ruan vetëm telemetri agregate, zakonisht nuk mund të identifikojmë një vizitor specifik brenda metrikave. Pyetjet për privatësinë ose GDPR mund të hapen përmes projektit Fluxheim në GitHub."
translation_notice = "Njoftim për përkthimin"
translation_notice_text = "Përkthimet e faqes janë të asistuara nga AI dhe mirëmbahen sipas përpjekjes më të mirë. Korrigjimet dhe përkthimet më të mira janë të mirëpritura te <a href=\"https://github.com/valkyoth/fluxheim-website/tree/main/config/i18n/keys\" class=\"text-cyan-300 hover:text-cyan-200 underline underline-offset-4\">çelësat i18n të faqes Fluxheim</a>."
