[home]
meta_description = "Fluxheim është një server web, reverse proxy dhe server cache me performancë të lartë dhe strukturë modulare, i ndërtuar në Rust."
meta_description_secure = "Fluxheim është një server web, reverse proxy dhe server cache me performancë të lartë dhe strukturë modulare. I shkruar në Rust. I sigurt si parazgjedhje."
meta_description_short = "Server edge dhe reverse proxy i sigurt për memorien, i ndërtuar në Rust."
hero_memory_safe = "I sigurt për memorien"
hero_edge_server = "Server edge"
hero_built_in_rust = "Ndërtuar në Rust"
hero_line_one = "Reverse proxy modular, cache, load balancer dhe host statik i shkruar"
hero_line_two = "në Rust. I sigurt si parazgjedhje me TLS, ACME, kompresim, politika edge,"
hero_line_three = "zbulim dinamik upstream dhe traffic mirroring të sigurt të integruar."
tag_fluxheim_core = "Bërthama Fluxheim"
tag_macos_dev = "Zhvillim macOS"
tag_rootless_containers = "Kontejnerë rootless"
features_heading = "Gjithçka që të duhet në edge"
features_intro = "Fluxheim vjen si ndërtime të fokusuara dhe modulare — përdor vetëm atë që i duhet deployimit tënd."
memory_safe_by_design = "I sigurt për memorien nga dizajni"
memory_safe_by_design_text = "I shkruar në Rust me toolchain stabil të fiksuar. Pa buffer overflow, pa use-after-free dhe pa data race nga ndërtimi."
fluxheim_http_core = "Bërthama HTTP e Fluxheim"
fluxheim_http_core_text = "Runtime edge native në Rust me connection pooling, retry upstream, health checks aktive, HTTP/2, WebSocket upgrades dhe gRPC pass-through."
load_balancer_control_plane = "Control plane për load balancer"
load_balancer_control_plane_text = "Binary dhe image i fokusuar 1.5 për load balancer me përzgjedhje të avancuar, persistencë lokale, politika health/ejection, queueing të kufizuar dhe kontrolle runtime të anëtarëve."
modular_build_profiles = "Profile ndërtimi modulare"
modular_build_profiles_text = "Kompilo vetëm çfarë të duhet. Profile të fokusuara për site statik, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring dhe paketa prodhimi me kompresim."
tls_managed_acme = "TLS dhe ACME i menaxhuar"
tls_managed_acme_text = "rustls-first me rrugë ndërtimi OpenSSL dhe FIPS/ISO proof të mbështetura, auth me certifikatë klienti, upstream mTLS, issuance automatike ACME dhe multi-cert SNI."
advanced_cache_system = "Sistem cache i avancuar"
advanced_cache_system_text = "Backend-e cache në memorie, disk, tiered dhe të enkriptuara, me gzip, Zstandard dhe Brotli të sigurta për cache, plus range caching për objekte të mëdha."
container_native = "Native për kontejnerë"
container_native_text = "Imazhe Podman rootless për Wolfi, Alpine, SUSE Micro dhe Debian. Systemd/RPM për deployime native. Pa asete të jashtme në nisje."
prometheus_opentelemetry = "Prometheus dhe OpenTelemetry"
prometheus_opentelemetry_text = "Prometheus metrics listener opsional, eksport OTLP metrics, trace context propagation dhe eksport OTLP trace për observability të plotë."
geo_context_text = "Lookup lokal opsional MMDB për politika vendi dhe ASN me MaxMind GeoIP2/GeoLite2 ose dataset-e CIRCL Geo Open. Pa lookup të largët ose downloader në request path."
tcp_stream_proxy = "TCP Stream Proxy"
tcp_stream_proxy_text = "Shërbime raw L4 TCP me route stream të dedikuara, kufij realë idle/lifetime/byte, kontrolle upstream TLS/mTLS, politika weighted/drain/backup dhe PROXY protocol lokal për route."
php_fpm_support = "Mbështetje PHP-FPM"
php_fpm_support_text = "Urë FastCGI PHP-FPM opsionale për aplikacione front-controller si WordPress. Zgjidhje strikte script-i dhe trajtim i kufizuar request-i."
edge_policy_controls = "Kontrolle politikash edge"
edge_policy_controls_text = "ACL të vetëdijshme për trusted proxy, rate limits, auth subrequests, traffic mirroring, regex rewrites, queues të kufizuara, validim strikt konfigurimi dhe trajtim i forcuar request-i."
