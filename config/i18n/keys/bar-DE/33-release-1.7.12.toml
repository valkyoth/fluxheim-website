r1712_release_series_digest = "Fluxheim-1.7-Reihe: optionale, standardbasierte Metadaten fia Cache, Proxy und Antwort-Digests; authentifizierts Neulodn und Zurückrolln vo Live-Snapshots; reproduzierbare FIPS-Backend-Nachweis; Prozess-Upgrades ohne Ausfoizeit; unabhängig getestete Wasm-Richtlinienbeispui; und stärkere Grenzn fia Cache, TLS, Pufferung, Streams und Protokolle."
r1712_standards_based_response_metadata = "Standardbasierte Antwortmetadaten"
r1712_response_metadata_intro = "Antwortmetadaten san standardmäßig ausgschaltn. Schalt bloß de Felder ei, de wirklich brauchst; Fluxheim leitet s ausm tatsächlichen Cache-Ergebnis, am Proxy-Fehler und de endgültigen Antwortbytes ab, ohne Cache-Schlüssel, Backend-Adressen, DNS-Namen oder rohe Fehler offenzulegen."
r1712_field = "Feld"
r1712_what_it_reports = "Wos des meldt"
r1712_cache_status_description = "Cache-Ergebnisse nach RFC 9211 wia Treffer, Fehlschlag, Weitergabe vo veraltete Daten, Revalidierung, Ablauf und Umgehung."
