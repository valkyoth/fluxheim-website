r1712_live_snapshots_and_rollback = "Live-Snapshots und Zurückrolln"
r1712_live_snapshot_intro = "Authentifizierte Snapshots kenna an geprüften Kandidaten veröffentlichen, den aktiven Router austauschen und zurückrolln, ohne normale reine Routing-Bereitstellungen neu zum starten. Jede Anfrage bleibt vom Anfang bis zum End auf oana Router-Generation."
r1712_snapshot_private_directory = "Bewahr den Snapshot-Speicher in am eigenen privaten Verzeichnis auf; bestehende ned-private Verzeichnisse und Dateisystemwurzeln werdn abglehnt."
r1712_snapshot_process_upgrade = "Nimm a Prozess-Upgrade, wenn im Hintergrund Load-Balancer-Gsundheits- oder Erkennungsdienste aktiv san."
r1712_snapshot_integrity_restart = "Lass nach Veröffentlichung oder Rollback d Snapshot-Integrität prüfen und kontrollier, dass de ausgewählte Generation an Neustart übersteht."
r1712_read_snapshot_contract = "De vollständigen Snapshot-Vorgaben lesn"
r1712_authorization_cache_bypass = "Anfragen mit <code>Authorization</code> oder <code>Proxy-Authorization</code> umgehn d Suche und Speicherung im gemeinsamen Cache oiwei."
r1712_strict_cache_control = "Fehlerhafte oder widersprüchliche <code>Cache-Control</code>-Antwortanweisungen werdn abglehnt, statt auf konfigurierte TTLs zurückzufallen; <code>s-maxage</code> geht vor <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> und <code>s-maxage</code> verbietn d Wiederverwendung vo veraltete Daten, sobald d Frische abgloffa is."
r1712_encrypted_cache_upgrade_note = "Hinweis zum Upgrade vom verschlüsselten Cache"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 stellt verschlüsselte Disk-Cache-Objekte auf wurzelgebundene Daten- und Indexschlüssel mit dauerhaftem Nonce-Stand um. Beim ersten Start mit oana älteren verschlüsselten Wurzel und bei jeder lokalen Schlüsselrotation wird der Cache absichtlich kalt geleert, bevor Verkehr bedient wird."
r1712_encrypted_cache_disposable = "Behandel den verschlüsselten Cache als wegwerfbare Beschleunigung, ned als maßgebliche Datenquelle."
r1712_encrypted_cache_private_storage = "Gib jeder Cache-Wurzel an dauerhaften privaten Speicher und kopier den Nonce-Stand ned zwischen unabhängige Wurzeln."
r1712_encrypted_cache_warmup = "Plan d Ursprungskapazität fia des erste Aufwärmen nachm Upgrade oder Schlüsselwechsel."
r1712_client_certificate_revocation = "Widerruf vo Client-Zertifikaten"
r1712_client_certificate_revocation_intro = "Wenn gegenseitigs TLS widerrufene Client-Zertifikate ablehnen muaß, stell a begrenzts PEM-CRL-Paket bereit. Fluxheim prüft de vollständige Ausstellerkette und lehnt abgloffene oder unvollständige CRL-Richtlinien ab."
r1712_client_certificate_revocation_compliance = "Verpflichtende Client-Authentifizierung in am FIPS- oder ISO-Pflichtmodus braucht aa a CRL-Paket. Bei normaler Client-Authentifizierung bleibt da Widerruf ausdrücklich optional."
r1712_fips_backend_evidence = "Nachweis fia FIPS-Backends"
r1712_fips_backend_evidence_intro = "Fluxheim stellt getrennt angeheftete CI-Nachweisumgebungen fia de Profile OpenSSL-FIPS und rustls/AWS-LC-FIPS bereit. De bauen und starten genau des Profil-Binärprogramm, testen nachgelagerts und zertifikatsgeprüfts vorgelagerts TLS, lehnen unverträgliche Richtlinien ab und zeichnen Compiler-, Anbieter-, Abhängigkeits-, Binär- und Image-Identitäten auf."
r1712_fips_backend_evidence_boundary = "Des san reproduzierbare Backend-Nachweis, koa FIPS-Validierung vom ganzen Produkt. Halt de Nachweis-Container von normale Release-Images getrennt und prüf d Nachweis genau fia den Build, den ausrollst."
r1712_read_fips_evidence_guide = "Den Leitfaden fia FIPS-Nachweis lesn"
r1712_loader_admission = "Kontrollen fürs Modul-Lodn"
r1712_loader_admission_description = "Öffentliche Plugin-Manifeste brauchan an festen SHA-256-Prüfwert. Im ganzen Prozess werdn höchstens zwoa Module gleichzeitig kompiliert. D kompilierte Ausgab is standardmäßig auf 32 MiB begrenzt und derf 256 MiB ned überschreitn."
r1712_file_identity = "Identität vo da Plugin-Datei"
r1712_file_identity_description = "Fluxheim öffnet freigegebene Plugin-Dateien, ohne Links zum folgen, behält den geprüften Handle vo da regulären Datei und liest d Modulbytes aus dem Handle, ohne den Pfad no amoi aufzumachen."
