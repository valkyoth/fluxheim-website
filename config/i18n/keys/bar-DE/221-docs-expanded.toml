version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "Version 1.6.37 is de letzte Crate-Grenzn-Aufräumarbat vor Wasm: ACME, Observability, Cache, Load-Balancer, PHP-FPM und native Runtime-Innereien wandern in kloane crate-eigene Module, während s Runtime-Verhalten stabil bleibt."

