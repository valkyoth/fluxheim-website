fluxheim_1_7_0_starts_the_optional_wasm_sandbox_foundation_it_proves_approved_root_plugin_loading_manifest_validation_and_bounded_wasmtime_execution_request_response_hooks_are_still_staged_for_later_1_7_x_releases = "Fluxheim 1.7.0 lance la fondation de sandbox WASM optionnelle. Elle prouve le chargement depuis des racines approuvées, la validation de manifeste et l’exécution Wasmtime bornée. Les hooks request/response restent prévus pour de futurs 1.7.x."
