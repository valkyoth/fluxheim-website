version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "La version 1.6.37 est le nettoyage final des frontières de crates avant Wasm : ACME, observabilité, cache, load-balancer, PHP-FPM et internes du runtime natif passent dans des modules plus petits détenus par leurs crates, tout en gardant le comportement stable."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "La version 1.6.37 rend le smoke local d’observabilité plus fiable en relançant Prometheus et Jaeger avec des ports fraîchement alloués quand les ports du réseau hôte entrent en concurrence avec d’autres processus de runner."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "À partir de 1.7.0, Fluxheim ajoute une fondation de sandbox Wasm optionnelle. Elle est désactivée par défaut, incompatible avec privacy-mode et prouve pour l’instant le chargement sûr de plugins et l’exécution bornée avant l’exposition de hooks de politique request/response."
