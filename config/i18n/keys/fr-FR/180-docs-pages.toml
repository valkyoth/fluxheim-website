advanced_026_fluxheim_toml_proxy_operations = "fluxheim.toml - opérations proxy"
advanced_027_regex_support_is_disabled_until_server_regex_enabled_true_is_set_traffic = "Le support regex est désactivé jusqu'à ce que <code>server.regex_enabled = true</code> soit défini. Le mirroring de trafic est compilé via la fonctionnalité <code>traffic-mirror</code> et ne miroir que les méthodes sûres sans body; il ne modifie jamais la réponse principale."
advanced_028_zero_retention_privacy_mode = "Mode privacy sans rétention"
advanced_029_the_privacy_mode_feature_compiles_fluxheim_without_any_caching_or_metrics_functionality = "La fonctionnalité <code>privacy-mode</code> compile Fluxheim sans aucune fonctionnalité de cache ou de métriques, imposant une rétention zéro des logs au niveau du build. Cela convient aux déploiements sensibles à la vie privée où aucune donnée de requête ne doit être stockée ou exportée."
