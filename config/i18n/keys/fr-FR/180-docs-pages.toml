[advanced_page]
advanced_001_advanced_features = "Fonctionnalités avancées"
advanced_002_php_fpm_proxy_operations_admin_api_zero_retention_privacy_mode_waf_wasm = "PHP-FPM, opérations proxy, API admin, mode privacy sans rétention, WAF, extensibilité WASM et futurs modules planifiés."
advanced_003_php_fpm_bridge = "Pont PHP-FPM"
advanced_004_available_since_v1_3_1_via_the_php_fpm_cargo_feature_the = "Disponible depuis v1.3.1 via la fonctionnalité Cargo <code>php-fpm</code>. Le pont PHP-FPM connecte Fluxheim à un pool PHP-FPM actif via le protocole FastCGI. Il prend en charge les applications front-controller de type WordPress avec résolution stricte des scripts et traitement requête/réponse borné."
advanced_005_bash_build_with_php_fpm_support = "bash - build avec support PHP-FPM"
advanced_006_fluxheim_toml_wordpress_front_controller = "fluxheim.toml - front-controller WordPress"
advanced_007_managed_php_fpm = "PHP-FPM géré"
advanced_008_included_in_current_v1_6_28_builds_and_introduced_in_v1_3 = "Inclus dans les builds v1.6.30 actuels et introduit en v1.3.7. Le mode géré conserve le même chemin de requête FastCGI/php-fpm, mais Fluxheim démarre et supervise un processus maître php-fpm privé pour le vhost. php-fpm externe reste le défaut; utilisez le mode géré lorsque vous voulez que Fluxheim génère la configuration du pool et possède le cycle de vie du socket privé."
advanced_009_fluxheim_toml_managed_php_fpm_pool = "fluxheim.toml - pool php-fpm géré"
advanced_010_do_not_set_socket_tcp_or_tcp_upstreams_in_managed_mode_fluxheim = "Ne définissez pas <code>socket</code>, <code>tcp</code> ou <code>tcp_upstreams</code> en mode géré. Fluxheim crée le socket Unix privé sous <code>socket_dir</code>, génère les fichiers de pool php-fpm, arrête le maître lors d'un reload ou shutdown du gateway, et le relance avec backoff borné s'il plante après le démarrage."
advanced_011_how_php_routing_works = "Fonctionnement du routage PHP"
advanced_012_requests_for_existing_php_files_are_routed_directly_to_php_fpm = "Les requêtes vers des fichiers <code>.php</code> existants sont routées directement vers PHP-FPM"
advanced_013_requests_for_non_existent_files_fall_back_to_the_front_controller_index = "Les requêtes vers des fichiers inexistants retombent sur le front-controller (<code>index.php</code>)"
advanced_014_static_assets_css_js_images_are_served_directly_without_touching_php_fpm = "Les assets statiques (<code>.css</code>, <code>.js</code>, images) sont servis directement sans toucher PHP-FPM"
advanced_015_script_resolution_is_strict_only_files_within_the_configured_php_root_are = "La résolution des scripts est stricte - seuls les fichiers dans le <code>root</code> PHP configuré sont transmis à FPM"
advanced_016_fluxheim_acme_companion = "Compagnon fluxheim-acme"
advanced_017_released_in_v1_3_2_fluxheim_acme_is_a_standalone_companion_binary = "Publié en v1.3.2. <code>fluxheim-acme</code> est un binaire compagnon autonome pour gérer le renouvellement des certificats ACME et les opérations de reload hors du processus gateway principal. Il est conçu pour les déploiements conteneur et service-manager externe où le gateway ne possède pas le cycle de renouvellement."
advanced_018_bash_fluxheim_acme_operations = "bash - opérations fluxheim-acme"
advanced_019_the_acme_reload_socket_lets_fluxheim_acme_signal_the_running_gateway_to = "Le socket de reload ACME permet à <code>fluxheim-acme</code> de signaler au gateway actif de récupérer les certificats fraîchement émis sans redémarrage complet. Configurez le chemin du socket dans votre bloc <code>[server]</code>."
advanced_020_fluxheim_toml_acme_reload_socket = "fluxheim.toml - socket de reload ACME"
advanced_021_fluxheim_config_tester = "fluxheim-config-tester"
advanced_022_released_in_v1_3_2_fluxheim_config_tester_is_a_standalone_binary = "Publié en v1.3.2. <code>fluxheim-config-tester</code> est un binaire autonome qui valide un fichier de configuration Fluxheim sans démarrer le gateway. Utile dans les pipelines CI et les entrypoints conteneur où les erreurs de configuration doivent être détectées avant application à un service actif."
advanced_023_bash_validate_config_before_apply = "bash - valider la configuration avant application"
advanced_024_proxy_operations = "Opérations proxy"
