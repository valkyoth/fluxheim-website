advanced_035_compile_time_guarantee_no_data_is_stored_no_external_telemetry_is_exported = "Garantie à la compilation : aucune donnée n'est stockée, aucune télémétrie externe n'est exportée"
advanced_036_admin_api = "API admin"
advanced_037_the_admin_control_plane_exposes_a_local_http_api_for_health_checks = "Le plan de contrôle admin expose une API HTTP locale pour les health checks, le reload de configuration, la purge cache et les requêtes de statut. Par défaut elle est loopback-only et exige un bearer token sur les listeners non-loopback."
