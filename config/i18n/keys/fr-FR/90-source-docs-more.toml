full_never_use_cf_ipcountry_city_device_worker_or_bot_headers_as_authorization_decisions = "<li>Ne jamais utiliser <code>CF-IPCountry</code>, la ville, le device, le worker ou les en-tetes bot comme decisions d'autorisation.</li>"
full_keep_metrics_labels_bounded_country_labels_may_be_allowed_only_as_fixed_two_letter_country_codes_plu = "<li>Garder les labels de metriques bornes. Les labels de pays ne peuvent etre autorises que comme codes pays fixes a deux lettres plus <code>unknown</code> ; ne jamais utiliser des noms de ville libres comme labels.</li>"
