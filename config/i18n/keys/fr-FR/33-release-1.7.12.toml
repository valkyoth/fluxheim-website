r1712_released_july_15_2026 = "Sortie le 15 juillet 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Ajoute des métadonnées facultatives et conformes aux normes pour le cache, le proxy et les empreintes de réponse"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Démontre le rechargement et la restauration authentifiés des instantanés actifs, les contrôles d'intégrité et la persistance après redémarrage"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Ajoute des preuves reproductibles pour les backends FIPS et renforce largement le runtime natif"
r1712_whats_next_summary = "ajoute des métadonnées normalisées facultatives, la preuve d'une restauration authentifiée des instantanés, des preuves reproductibles pour les backends FIPS et des limites renforcées pour le cache, TLS, Wasm, la mise en mémoire tampon et les flux."
r1712_release_series_digest = "Série Fluxheim 1.7 : métadonnées facultatives et conformes aux normes pour le cache, le proxy et les empreintes de réponse ; rechargement et restauration authentifiés des instantanés actifs ; preuves reproductibles pour les backends FIPS ; mises à niveau de processus sans interruption ; exemples de politiques Wasm testés indépendamment ; et limites renforcées pour le cache, TLS, la mise en mémoire tampon, les flux et les protocoles."
r1712_standards_based_response_metadata = "Métadonnées de réponse basées sur des normes"
r1712_response_metadata_intro = "Les métadonnées de réponse sont désactivées par défaut. Activez uniquement les champs dont vous avez besoin ; Fluxheim les dérive du résultat réel du cache, de l'échec du proxy et des octets de réponse finaux sans exposer les clés de cache, les adresses back-end, les noms DNS ou les erreurs brutes."
r1712_field = "Champ de réponse"
r1712_what_it_reports = "Information signalée"
r1712_cache_status_description = "Résultats du cache RFC 9211 tels que les succès, les échecs, les transferts obsolètes, la revalidation, l'expiration et le contournement."
r1712_proxy_status_description = "Détails de faible cardinalité RFC 9209 pour les échecs générés par Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 sur le contenu final du message HTTP après compression."
r1712_repr_digest_description = "SHA-256 uniquement lorsque Fluxheim contient la représentation sélectionnée complète."
r1712_live_snapshots_and_rollback = "Instantanés en direct et restauration"
r1712_live_snapshot_intro = "Les instantanés authentifiés permettent de publier un candidat validé, de remplacer le routeur actif et de revenir à la génération précédente sans redémarrer les déploiements limités au routage. Chaque requête utilise la même génération de routeur du début à la fin."
r1712_snapshot_private_directory = "Conservez les instantanés dans un répertoire privé dédié ; les répertoires existants non privés et les racines de systèmes de fichiers sont rejetés."
r1712_snapshot_process_upgrade = "Utilisez une mise à niveau de processus lorsque les contrôles d'état ou les services de découverte de l'équilibreur de charge fonctionnent en arrière-plan."
r1712_snapshot_integrity_restart = "Exécutez des vérifications de l’intégrité des instantanés après la publication ou la restauration et vérifiez que la génération sélectionnée survit au redémarrage."
r1712_read_snapshot_contract = "Lire le contrat instantané complet"
r1712_authorization_cache_bypass = "Les requêtes transportant <code>Authorization</code> ou <code>Proxy-Authorization</code> contournent toujours la recherche et le stockage dans le cache partagé."
r1712_strict_cache_control = "Les directives <code>Cache-Control</code> de réponse mal formées ou conflictuelles sont rejetées au lieu de revenir aux TTL configurées ; <code>s-maxage</code> est prioritaire sur <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> et <code>s-maxage</code> interdisent la réutilisation périmée après l'expiration de la fraîcheur."
r1712_encrypted_cache_upgrade_note = "Note de mise à niveau du cache chiffré"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 utilise, pour les objets du cache disque chiffré, des clés de données et d'index liées à chaque racine de cache ainsi qu'un état de nonce persistant. Au premier démarrage avec une ancienne racine chiffrée et après chaque rotation de clé locale, ce cache est volontairement purgé avant d'accepter du trafic."
r1712_encrypted_cache_disposable = "Les données du cache chiffré sont jetables et ne doivent pas être considérées comme une source faisant autorité."
r1712_encrypted_cache_private_storage = "Attribuez un stockage privé persistant à chaque racine de cache et ne copiez pas l'état des nonces entre des racines indépendantes."
r1712_encrypted_cache_warmup = "Vérifiez que le serveur d'origine peut absorber le premier préchauffage du cache après une mise à niveau ou une rotation de clé."
r1712_client_certificate_revocation = "Révocation du certificat client"
r1712_client_certificate_revocation_intro = "Lorsque l'authentification TLS mutuelle doit rejeter les certificats clients révoqués, fournissez un ensemble de CRL au format PEM et de taille limitée. Fluxheim valide toute la chaîne d'émetteurs et rejette une politique CRL expirée ou incomplète."
r1712_client_certificate_revocation_compliance = "L'authentification client obligatoire dans un mode de conformité exigeant FIPS ou ISO nécessite également un ensemble de CRL. Pour l'authentification client ordinaire, la vérification de révocation reste explicitement facultative."
r1712_fips_backend_evidence = "Preuve back-end FIPS"
r1712_fips_backend_evidence_intro = "Fluxheim fournit des environnements CI de preuve, épinglés séparément, pour les profils OpenSSL-FIPS et rustls/AWS-LC-FIPS. Ils compilent et exécutent exactement le binaire du profil, testent le TLS descendant et le TLS amont avec vérification de certificat, rejettent les politiques incompatibles et enregistrent l'identité du compilateur, du fournisseur, des dépendances, du binaire et de l'image."
r1712_fips_backend_evidence_boundary = "Il s'agit de preuves reproductibles du backend, et non d'une validation FIPS du produit complet. Séparez les conteneurs de preuve des images de version normales et vérifiez les preuves correspondant exactement au build déployé."
r1712_read_fips_evidence_guide = "Lire le guide des preuves FIPS"
r1712_loader_admission = "Contrôles de chargement des modules"
r1712_loader_admission_description = "Les manifestes publics des modules doivent inclure une empreinte SHA-256 fixe. Au maximum deux modules sont compilés simultanément dans l'ensemble du processus. La sortie compilée est limitée par défaut à 32 MiB et ne peut pas dépasser 256 MiB."
r1712_file_identity = "Identité du fichier du plug-in"
r1712_file_identity_description = "Fluxheim ouvre les fichiers de plug-in autorisés sans suivre les liens, conserve le descripteur du fichier ordinaire validé et lit les octets du module depuis ce descripteur sans rouvrir le chemin."
