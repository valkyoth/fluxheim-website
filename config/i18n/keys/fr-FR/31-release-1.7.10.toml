stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "Stabilise les exemples de migration Wasm exécutables et les tests de sortie ; ajoute des profils de sécurité de réponse HTTP facultatifs, un CORS validé prenant en compte les requêtes, des conseils de nouvelle tentative limitée, un transfert plus strict et une désinfection des en-têtes d'identité, ainsi qu'une analyse et une réécriture plus sûres des en-têtes."
