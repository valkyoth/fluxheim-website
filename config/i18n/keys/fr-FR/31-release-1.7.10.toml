released_july_13_2026 = "Sortie le 13 juillet 2026"
adds_optional_http_response_security_profiles_and_validated_request_aware_cors = "Ajoute des profils de sécurité de réponse HTTP facultatifs et un CORS validé prenant en compte les requêtes"
stabilizes_runnable_wasm_policy_examples_and_the_tests_required_by_the_release_gate = "Stabilise les exemples de politiques Wasm exécutables et les tests requis par la porte de publication"
strengthens_forwarded_identity_headers_header_parsing_and_retry_guidance_for_capacity_limits = "Renforce les en-têtes d'identité transférés, l'analyse des en-têtes et les conseils de nouvelle tentative pour les limites de capacité"
stabilizes_the_wasm_migration_examples_and_adds_optional_http_response_security_request_aware_cors_and_stricter_forwarding_and_header_boundaries = "stabilise les exemples de migration Wasm et ajoute une sécurité de réponse HTTP facultative, un CORS prenant en compte les requêtes et des limites de transfert et d'en-tête plus strictes."
fluxheim_1_7_release_series_independently_tested_migration_examples_bounded_host_callbacks_optional_http_response_security_profiles_validated_request_aware_cors_stricter_forwarded_identity_handling_and_stronger_boundaries_for_wasm_acme_snapshots_geoip_streams_tls_php_fpm_and_static_file_serving = "Série de versions Fluxheim 1.7 : exemples de migration testés indépendamment, rappels d'hôte limités, profils de sécurité de réponse HTTP facultatifs, CORS validé pour les requêtes, gestion plus stricte des identités transmises et limites plus strictes pour Wasm, ACME, instantanés, GeoIP, flux, TLS, PHP-FPM et service de fichiers statiques."
fluxheim_1_7_10_makes_every_migration_family_independently_testable_keeps_the_complete_wasm_smoke_test_in_the_release_gate_and_verifies_that_guest_controlled_symbolic_ids_are_rejected_safely_in_process_host_callbacks_remain_limited_to_finite_non_blocking_operations = "Fluxheim 1.7.10 rend chaque famille de migration testable indépendamment, conserve le test de fumée Wasm complet dans la porte de sortie et vérifie que les identifiants symboliques contrôlés par l'invité sont rejetés en toute sécurité. Les rappels d'hôte en cours restent limités à des opérations finies et non bloquantes."
wasm_host_callbacks = "Rappels de l'hôte Wasm"
callbacks_are_limited_to_finite_symbolic_decoding_bounded_context_reads_and_bounded_state_they_cannot_perform_file_network_ipc_sleep_process_or_third_party_callback_work = "Les rappels sont limités au décodage symbolique fini, aux lectures de contexte limitées et à l'état limité. Ils ne peuvent pas effectuer de tâches de fichiers, de réseau, d'IPC, de veille, de processus ou de rappel tiers."
release_testing = "Tests de version"
each_migration_family_can_run_independently_while_the_release_gate_also_runs_the_complete_smoke_test_and_an_arbitrary_guest_id_decoder_property_test = "Chaque famille de migration peut s'exécuter indépendamment, tandis que la porte de sortie exécute également le test de fumée complet et un test arbitraire des propriétés du décodeur d'ID invité."
http_response_security = "Sécurité des réponses HTTP"
http_response_security_profiles_are_optional_start_with_baseline_use_cross_origin_isolation_only_after_testing_every_script_font_image_sign_in_flow_and_embedded_resource = "Les profils de sécurité de réponse HTTP sont facultatifs. Commencez par <code>baseline</code> ; utilisez l’isolation multi-origine uniquement après avoir testé chaque script, police, image, flux de connexion et ressource intégrée."
profile = "Profil"
what_it_does = "Ce que ça fait"
