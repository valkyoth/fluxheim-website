current_contains_the_active_snapshot_id_fluxheim_uses_an_atomically_replaced_pointer_file_instead_of = "<code>current</code> contient l'id du snapshot actif. Fluxheim utilise un fichier pointeur remplace atomiquement au lieu d'un symlink. Un swap de symlink est un bon design Linux-only, mais le fichier pointeur garde le store simple avec Podman rootless, les montages de volumes restreints et les environnements de developpement non-Unix, tout en utilisant une semantique write-temp-and-rename."
snapshot_config_files_contain_the_validated_effective_config_written_back_as_toml_metadata_files_con = "Les fichiers de config de snapshot contiennent la config effective validee, reecrite en TOML. Les fichiers de metadonnees contiennent l'id du snapshot, l'heure de creation et le message operateur optionnel. Les messages operateur sont trims et limites a 4096 octets de texte non-control avant ecriture ou chargement. Les ids de snapshot generes contiennent le temps Unix plus une sequence locale au processus ; ils n'incluent pas l'id du processus Fluxheim."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_as = "Le store est volontairement conservateur sur l'indirection filesystem. Les ids de snapshot ne peuvent contenir que des lettres ASCII, des chiffres, <code>_</code> et <code>-</code>, et sont limites a 128 octets; la racine du store ne peut pas contenir <code>..</code> ni se trouver sous un repertoire parent symlinke; la racine du store et le repertoire <code>configs</code> doivent etre de vrais repertoires; le repertoire <code>configs</code> doit rester dans le store de snapshots; et <code>current</code>, les fichiers TOML de snapshot et les fichiers TOML de metadonnees sont ouverts comme fichiers reguliers. Les racines de store, pointeurs, configs, metadonnees ou chemins <code>configs</code> symlinkes sont rejetes pour qu'un rollback ne puisse pas etre redirige vers un fichier non approuve par l'operateur. Les ecritures atomiques exigent aussi un vrai repertoire parent deja valide et ne remplacent pas une destination symlinkee. Les lectures de snapshot sont bornees: <code>current</code> est limite a 4 KiB et les lectures TOML/metadonnees de snapshot sont limitees a 16 MiB. Les stores de snapshots sont limites a 1024 snapshots; les operateurs doivent exporter ou purger les anciens snapshots avant cette limite."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_2 = "Le store est volontairement conservateur sur l'indirection filesystem. Les ids de snapshot ne peuvent contenir que des lettres ASCII, des chiffres,"
