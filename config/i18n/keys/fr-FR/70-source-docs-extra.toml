the_runtime_snapshot_model_means_old_requests_can_keep_using_the_config_they_started_with_while_new = "Le modele de snapshot runtime permet aux anciennes requetes de continuer avec la config de depart, tandis que les nouvelles utilisent la nouvelle config apres un swap atomique du pointeur. Le store de snapshots durables donne aux operateurs une cible de rollback auditable et a l'API admin un pointeur courant a appliquer."
