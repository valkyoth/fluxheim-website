it_refuses_to_overwrite_existing_files_unless_force_is_supplied = "<p>La commande refuse d'ecraser les fichiers existants sauf si <code>--force</code> est fourni.</p>"
automation_should_pass_secrets_through_files_not_command_line_values = "<p>L'automatisation devrait transmettre les secrets par fichiers, pas par valeurs de ligne de commande:</p>"
after_initialization_add_vhosts_tls_acme_blocks_to_the_vhosts_that_should_receive_managed_certificat = "<p>Apres initialisation, ajoutez des blocs <code>[vhosts.tls.acme]</code> aux vhosts qui doivent recevoir des certificats geres, rechargez systemd lorsqu'un drop-in a ete cree, puis lancez la commande de renouvellement:</p>"
packaged_actalis_credentials = "<h2 id=\"packaged-actalis-credentials\">Credentials Actalis packages</h2>"
rpm_installs_create_etc_fluxheim_secrets_with_root_only_permissions_and_ship_an_optional_systemd_dro = "<p>Les installations RPM creent <code>/etc/fluxheim/secrets</code> avec des permissions reservees a root et livrent un exemple optionnel de drop-in systemd a:</p>"
to_use_actalis_eab_with_systemd_credentials = "<p>Pour utiliser Actalis EAB avec des credentials systemd:</p>"
then_point_the_issuer_eab_sources_at_credential_names_the_same_toml_works_for_fluxheim_service_fluxh = "<p>Ensuite, pointez les sources EAB de l'emetteur vers des noms de credentials. Le meme TOML fonctionne pour <code>fluxheim.service</code>, <code>fluxheim-acme.service</code> et les secrets conteneur :</p>"
renewal_queue_planning = "<h2 id=\"renewal-queue-planning\">Planification de la file de renouvellement</h2>"
fluxheim_derives_renewal_targets_from_validated_vhost_acme_config_the_planner_is_implemented_and_pro = "<p>Fluxheim derive les cibles de renouvellement depuis la configuration ACME vhost validee. Le planificateur est implemente et produit des elements de file avec:</p>"
