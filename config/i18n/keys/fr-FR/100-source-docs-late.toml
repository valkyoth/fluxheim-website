local_smoke_coverage_starts_fluxheim_with_profile_observability_sends_a_proxied_request_verifies = "<li>La couverture smoke locale démarre Fluxheim avec <code>profile-observability</code>, envoie une requête proxifiée, vérifie <code>traceparent</code> propagation, checks the local metrics listener for Fluxheim series, et optionnelly queries a Prometheus HTTP API. Utilisez <code>scripts/smoke_observability_local.sh</code> ; définissez <code>FLUXHEIM_PROMETHEUS_REQUIRE_FLUXHEIM=1</code> when a local Prometheus scrape job is expected to contain Fluxheim metrics, and <code>FLUXHEIM_PROMETHEUS_REQUIRE_OTLP=1</code> when Prometheus must have its OTLP metrics receiver enabled.</li>"
