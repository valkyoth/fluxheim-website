certificate_expiration_time = "<li>date d'expiration du certificat</li>"
next_renewal_time = "<li>prochaine date de renouvellement</li>"
the_first_renewal_time_should_be_the_later_of = "<p>La premiere date de renouvellement devrait etre la plus tardive entre:</p>"
certificate_not_after_tls_acme_renewal_renew_before_secs = "<li><code>certificate_not_after - tls.acme.renewal.renew_before_secs</code></li>"
tls_acme_renewal_renew_after_when_set = "<li><code>tls.acme.renewal.renew_after</code>, lorsqu'il est defini</li>"
renew_after_lets_an_operator_defer_automatic_renewal_until_a_chosen_toml_offset_datetime_for_example = "<p><code>renew_after</code> permet a un operateur de differer le renouvellement automatique jusqu'a un datetime TOML offset choisi, par exemple <code>2026-06-01T00:00:00Z</code>. Les datetimes TOML locales sont rejetees afin que la queue n'interprete pas l'intention operateur dans le mauvais fuseau horaire.</p>"
when_fluxheim_is_built_with_acme_client_the_runtime_registers_a_background_renewal_service_when_acme = "<p>Lorsque Fluxheim est construit avec <code>acme-client</code>, le runtime enregistre un service de renouvellement en arriere-plan lorsque des vhosts geres par ACME sont configures et que <code>tls.acme.automation = &quot;background&quot;</code> est defini. C'est le comportement par defaut pour les installations simples a processus unique. Le service observe l'expiration des certificats geres, se reveille toutes les <code>tls.acme.renewal.check_interval_secs</code>, et renouvelle les certificats manquants ou dus via le meme chemin de challenge ACME que la CLI.</p>"
after_successful_renewal_fluxheim_reloads_the_downstream_sni_certificate_resolver_or_callback_so_new = "<p>Apres un renouvellement reussi, Fluxheim recharge le resolver ou callback de certificats SNI downstream afin que les nouveaux handshakes puissent utiliser les fichiers fraichement installes sans redemarrage. Si un backend TLS ou une forme de listener ne peut pas fournir de handle de reload, Fluxheim journalise qu'un redemarrage ou un reload de processus est requis.</p>"
this_reload_happens_inside_the_long_running_fluxheim_process_the_gateway_also_owns_a_local_unix_doma = "<p>Ce rechargement se produit dans le processus Fluxheim longue duree. La gateway possede aussi un socket local Unix-domain de rechargement de certificats sous <code>server.process.certificate_reload_sock</code>, par defaut :</p>"
the_socket_accepts_only_the_narrow_reload_certificates_operation_and_is_created_with_owner_only_perm = "<p>Le socket accepte seulement l'operation etroite <code>reload-certificates</code> et il est cree par la gateway en cours d'execution avec des permissions reservees au proprietaire. Il est destine au meme utilisateur runtime ou pod conteneur, pas a l'administration distante. La gateway longue duree borne les requetes de controle de reload concurrentes, et chaque requete acceptee utilise encore un court timeout de lecture fixe. Le compagnon lit la reponse de la gateway avec une petite limite fixe afin qu'un socket local compromis ou remplace ne puisse pas faire croitre la memoire du compagnon sans limite.</p>"
production_packages_include_the_fluxheim_acme_companion_binary_while_keeping_the_integrated_backgrou = "<p>Les paquets de production incluent le binaire compagnon <code>fluxheim-acme</code> tout en gardant le worker en arriere-plan integre pour les installations simples. Dans ce modele, <code>fluxheim.service</code> reste concentre sur le service du trafic et des fichiers de challenge, tandis que le one-shot <code>fluxheim-acme.service</code> et le <code>fluxheim-acme.timer</code> planifie executent les renouvellements comme utilisateur runtime Fluxheim. La commande compagnon reutilise le meme moteur ACME et le meme layout de stockage que la commande legacy <code>fluxheim acme-renew</code>, utilise des credentials systemd ou des secrets conteneur pour le materiel EAB, et ecrit les certificats sous le <code>tls.acme.storage</code> configure. Lorsque les certificats sont renouveles, elle demande a la gateway en cours d'execution de recharger ses handles de certificat via <code>server.process.certificate_reload_sock</code>. Definissez <code>tls.acme.automation = &quot;external&quot;</code> dans ce mode afin que le serveur web n'execute pas aussi la boucle de renouvellement en arriere-plan.</p>"
preview_targets_without_contacting_the_issuer = "<p>Previsualiser les cibles sans contacter l'emetteur:</p>"
check_due_missing_valid_state_before_issuing = "<p>Verifier l'etat du, manquant ou valide avant emission:</p>"
run_renewal_and_request_live_certificate_activation_after_successful_issuance = "<p>Executer le renouvellement et demander l'activation live du certificat apres emission reussie:</p>"
request_only_the_live_certificate_handle_reload_for_example_after_manually_installing_files_below_tl = "<p>Demander uniquement le rechargement live des handles de certificats, par exemple apres installation manuelle de fichiers sous <code>tls.acme.storage</code>:</p>"
enable_the_packaged_timer_after_acme_config_and_credentials_are_installed = "<p>Activer le timer package apres installation de la configuration ACME et des credentials:</p>"
do_not_make_the_webserver_spawn_a_long_lived_helper_process_let_the_service_manager_or_container_orc = "<p>Ne faites pas lancer un processus helper longue duree par le serveur web; laissez le service manager ou l'orchestrateur de conteneurs superviser le compagnon.</p>"
container_renewal = "<h2 id=\"container-renewal\">Renouvellement en conteneur</h2>"
runtime_images_include_both_usr_local_bin_fluxheim_and_usr_local_bin_fluxheim_acme_the_companion_can = "<p>Les images runtime incluent a la fois <code>/usr/local/bin/fluxheim</code> et <code>/usr/local/bin/fluxheim-acme</code>. Le compagnon peut s'executer dans le conteneur gateway deja en cours avec <code>podman exec</code>, ou comme conteneur one-shot separe. Dans les deux cas, il doit voir la meme configuration, le meme stockage ACME, les memes secrets et le meme repertoire <code>/run/fluxheim</code> que la gateway.</p>"
the_gateway_and_companion_must_share_server_process_certificate_reload_sock_the_packaged_container_c = "<p>La gateway et le compagnon doivent partager <code>server.process.certificate_reload_sock</code>. Les configurations conteneur packagees utilisent:</p>"
keep_the_host_side_run_directory_private_to_the_container_runtime_user_and_mount_it_read_write_into = "<p>Gardez le repertoire run cote hote prive pour l'utilisateur runtime du conteneur et montez-le en lecture-ecriture dans les deux conteneurs:</p>"
if_the_gateway_container_is_already_running_the_simplest_operational_commands_are = "<p>Si le conteneur gateway est deja en cours d'execution, les commandes operationnelles les plus simples sont:</p>"
podman_exec_naturally_shares_the_gateway_container_filesystem_secrets_and_reload_socket_it_is_useful = "<p><code>podman exec</code> partage naturellement le systeme de fichiers du conteneur gateway, les secrets et le socket de reload. C'est utile pour les controles manuels, mais les renouvellements planifies sont souvent plus propres sous forme de conteneur compagnon one-shot:</p>"
use_status_before_renew_when_testing_a_new_mount_layout = "<p>Utilisez <code>status</code> avant <code>renew</code> lors du test d'un nouveau layout de montage :</p>"
for_compose_keep_fluxheim_and_fluxheim_acme_on_the_same_network_and_use_the_same_bind_mounts_the_com = "<p>Pour Compose, gardez <code>fluxheim</code> et <code>fluxheim-acme</code> sur le meme reseau et utilisez les memes bind mounts. Le service compagnon ne doit remplacer que l'entrypoint et la commande :</p>"
run_it_on_demand_with = "<p>Lancer a la demande avec :</p>"
for_scheduled_container_renewals_use_a_host_systemd_timer_kubernetes_cronjob_or_the_platform_schedul = "<p>Pour les renouvellements conteneur planifies, utilisez un timer systemd hote, un CronJob Kubernetes ou le scheduler de la plateforme pour demarrer le compagnon one-shot. Gardez <code>tls.acme.automation = &quot;external&quot;</code> afin que la gateway n'execute pas aussi la boucle de renouvellement en arriere-plan.</p>"
runtime_crate_candidates = "<h2 id=\"runtime-crate-candidates\">Crates runtime candidates</h2>"
latest_checked_acme_runtime_candidates = "<p>Derniers candidats runtime ACME verifies:</p>"
instant_acme_0_8_5_apache_2_0_async_pure_rust_acme_client_with_eab_support_this_is_the_current_first = "<li><code>instant-acme 0.8.5</code> : Apache-2.0, client ACME async pur Rust avec prise en charge EAB. C'est le premier candidat actuel car il ne possede pas le modele de listener TLS.</li>"
rustls_acme_0_15_1_apache_2_0_or_mit_useful_reference_for_rustls_focused_certificate_management_but = "<li><code>rustls-acme 0.15.1</code> : Apache-2.0 OR MIT, reference utile pour la gestion de certificats centree sur rustls, mais moins alignee avec les multiples cibles de backend TLS Pingora de Fluxheim.</li>"
fips_iso_required_deployments = "<h2 id=\"fips-iso-required-deployments\">Deploiements exigeant FIPS/ISO</h2>"
managed_fluxheim_acme_is_intentionally_outside_the_strict_fips_iso_required_runtime_boundary_in_1_3 = "<p>L'ACME gere par Fluxheim est volontairement hors de la stricte frontiere runtime requise FIPS/ISO dans <code>1.3.6</code>. Une configuration avec <code>[tls.fips] required = true</code> ou <code>[tls.iso19790] required = true</code> rejette <code>[tls.acme] enabled = true</code>, car la generation de cles de compte ACME, la signature de compte JWS, le HMAC External Account Binding, le transport HTTPS ACME sortant et la generation de certificats de challenge TLS-ALPN ne sont pas entierement routes via le fournisseur valide selectionne.</p>"
for_regulated_deployments_use_local_static_certificate_files_in_vhosts_tls_certificate_and_renew_the = "<p>Pour les deploiements regules, utilisez des fichiers de certificats statiques locaux dans <code>[vhosts.tls.certificate]</code> et renouvelez-les avec un processus externe disposant de son propre paquet de preuves. Si ce processus externe est base sur ACME, conservez la version du client ACME, le mode FIPS/ISO de l'hote, la politique de generation de cles, les preuves CA/audit et les journaux de renouvellement avec les preuves de deploiement. Les profils PKI web publics conservateurs doivent demander des cles de certificat RSA 2048 ou RSA 3072, sauf si l'assesseur accepte explicitement le profil de certificat ECDSA et la chaine selectionnes.</p>"
the_fluxheim_acme_storage_path_hashing_uses_sha_256_and_does_not_use_md5_for_local_account_or_certif = "<p>Le hachage des chemins de stockage ACME de Fluxheim utilise SHA-256 et n'utilise pas MD5 pour les labels locaux de repertoire de compte ou de certificat, mais cela ne suffit pas a faire de l'ACME gere une partie de la frontiere cryptographique approuvee. Traitez <code>fluxheim-acme</code> comme un outil d'automatisation normal jusqu'a ce que l'ACME gere dispose de signatures routees par fournisseur, de generation de cles, d'EAB et de preuves TLS sortantes.</p>"
retry_policy = "<h2 id=\"retry-policy\">Politique de retry</h2>"
failed_renewal_attempts_should_retry_with_bounded_backoff = "<p>Les tentatives de renouvellement echouees devraient reessayer avec un backoff borne:</p>"
start_at_tls_acme_renewal_retry_initial_secs = "<li>demarrer a <code>tls.acme.renewal.retry_initial_secs</code></li>"
grow_up_to_tls_acme_renewal_retry_max_secs = "<li>augmenter jusqu'a <code>tls.acme.renewal.retry_max_secs</code></li>"
never_remove_the_currently_active_certificate_because_of_a_failed_renewal = "<li>ne jamais retirer le certificat actuellement actif a cause d'un renouvellement echoue</li>"
the_scheduler_should_wake_at_least_every_tls_acme_renewal_check_interval_secs_to_catch_newly_due_cer = "<p>Le scheduler devrait se reveiller au moins toutes les <code>tls.acme.renewal.check_interval_secs</code> pour detecter les certificats nouvellement dus et les changements de configuration.</p>"
atomic_install = "<h2 id=\"atomic-install\">Installation atomique</h2>"
renewed_certificates_must_be_installed_atomically = "<p>Les certificats renouveles doivent etre installes atomiquement:</p>"
write_certificate_and_key_to_temporary_files_in_the_acme_storage_directory = "<li>Ecrire le certificat et la cle dans des fichiers temporaires du repertoire de stockage ACME.</li>"
validate_that_the_certificate_parses_matches_the_private_key_and_covers_the_configured_domains = "<li>Valider que le certificat se parse, correspond a la cle privee et couvre les domaines configures.</li>"
flush_files_and_directory_metadata_where_the_platform_supports_it = "<li>Flusher les fichiers et la metadata de repertoire lorsque la plateforme le prend en charge.</li>"
rename_temporary_files_into_place = "<li>Renommer les fichiers temporaires en place.</li>"
keep_the_previous_certificate_available_until_the_new_one_is_active = "<li>Garder le certificat precedent disponible jusqu'a ce que le nouveau soit actif.</li>"
the_current_install_helper_implements_the_filesystem_side_of_that_contract_it_validates_basic_pem_sh = "<p>Le helper d'installation actuel implemente le cote systeme de fichiers de ce contrat. Il valide la forme et la taille PEM de base, ecrit des fichiers temporaires a cote de la destination geree, rejette les repertoires ou fichiers de destination symlinkes, conserve des sauvegardes des fichiers existants pendant le staging, et nettoie les fichiers temporaires en cas d'echec. La validation complete de correspondance certificat/cle et de couverture des domaines appartient a l'etape client ACME avant l'appel de ce helper. Les appels emetteur echoues et les installations de certificat echouees ne suppriment pas le certificat actif precedent.</p>"
no_downtime_reload = "<h2 id=\"no-downtime-reload\">Rechargement sans interruption</h2>"
runtime_state_should_be_immutable_snapshots_behind_an_atomic_pointer_existing_requests_keep_their_cu = "<p>L'etat runtime doit etre compose de snapshots immuables derriere un pointeur atomique. Les requetes existantes gardent leur snapshot actuel. Les nouvelles requetes utilisent le dernier snapshot apres reload. L'etat de routage proxy de Fluxheim utilise deja ce modele pour les snapshots de vhost, upstream, cache et politique web statique. Ce modele s'applique a :</p>"
vhost_routing = "<li>routage vhost</li>"
upstream_pools = "<li>pools upstream</li>"
cache_policies = "<li>politiques de cache</li>"
certificate_lookup_maps = "<li>maps de lookup de certificats</li>"
listener_changes_are_process_level_changes_and_should_use_pingoras_zero_downtime_upgrade_path_rather = "<p>Les changements de listeners sont des changements au niveau processus et doivent utiliser le chemin d'upgrade zero-downtime de Pingora plutot qu'une mutation en place.</p>"
reload_classification = "<h2 id=\"reload-classification\">Classification du reload</h2>"
fluxheim_classifies_a_config_change_before_applying_it = "<p>Fluxheim classe un changement de configuration avant de l'appliquer:</p>"
noop_old_and_new_config_are_identical = "<li><code>Noop</code> : ancienne et nouvelle configuration sont identiques.</li>"
snapshot_safe_for_in_place_snapshot_swap = "<li><code>Snapshot</code>: safe for in-place snapshot swap.</li>"
processupgrade_requires_pingoras_process_level_zero_downtime_upgrade_path = "<li><code>ProcessUpgrade</code>: requires Pingora&#x27;s process-level zero-downtime upgrade path.</li>"
operators_can_check_the_impact_of_a_planned_config_change = "<p>Les operateurs peuvent verifier l'impact d'un changement de configuration planifie:</p>"
durable_config_history_and_rollback_commands_are_documented_in_config_snapshots_and_rollback = "<p>L'historique durable de configuration et les commandes de rollback sont documentes dans <a href=\"config-snapshots.html\" class=\"text-cyan-400 hover:text-cyan-300\">Snapshots de configuration et rollback</a>.</p>"
snapshot_reload_is_intended_for_routing_cache_policy_static_web_policy_and_certificate_lookup_change = "<p>Le reload de snapshot est destine aux changements de routage, politique de cache, politique web statique et lookup de certificats qui ne modifient pas les listeners ni les services en arriere-plan possedes au demarrage.</p>"
process_upgrade_is_required_when = "<p>Une mise a niveau de processus est requise lorsque:</p>"
listener_addresses_change = "<li>listener addresses change</li>"
downstream_tls_mode_changes = "<li>downstream TLS mode changes</li>"
the_configured_tls_backend_changes = "<li>the configured Backend TLS changes</li>"
load_balancer_background_service_registration_ownership_changes = "<li>load-balancer background service registration/ownership changes</li>"
this_keeps_the_hot_reload_path_conservative_until_fluxheim_has_explicit_runtime_ownership_for_adding = "<p>Cela garde le chemin de hot-reload conservateur jusqu'a ce que Fluxheim ait une responsabilite runtime explicite pour ajouter et retirer des services en arriere-plan apres le demarrage.</p>"

[logging_architecture]
logging_architecture_fluxheim_source_docs = "<title>Architecture de logging - Documentation source Fluxheim</title>"
logging_architecture = "<h1 id=\"logging-architecture\">Architecture de logging</h1>"
fluxheim_logging_should_be_structured_asynchronous_and_explicit_about_the_tradeoff_between_reque = "<p>Le logging Fluxheim doit etre structure, asynchrone et explicite sur le compromis entre latence de requete et durabilite. Le logging ne doit jamais masquer les evenements pertinents pour la securite, et un echec du logging distant ne doit pas interrompre le trafic normal.</p>"
goals = "<h2 id=\"goals\">Objectifs</h2>"
use_tracing_as_the_core_instrumentation_api = "<li>Utilisez <code>tracing</code> comme API d'instrumentation centrale.</li>"
emit_production_logs_as_json_through_serde_backed_formatting = "<li>Émettre les logs de production en JSON via un formatage basé sur serde.</li>"
keep_stdout_available_as_the_default_sink_for_systemd_podman_and_local_debugging = "<li>Conserver stdout comme sink par défaut pour systemd, Podman et le débogage local.</li>"
avoid_disk_or_network_writes_on_request_worker_hot_paths = "<li>Éviter les écritures disque ou réseau sur les chemins critiques des workers de requêtes.</li>"
add_remote_logging_only_behind_explicit_config_and_optional_compile_features = "<li>Ajouter le logging distant uniquement derrière une configuration explicite et des fonctionnalités de compilation optionnelles.</li>"
make_overflow_behavior_explicit_instead_of_pretending_logs_are_always_both_non_blocking_and_loss = "<li>Rendre le comportement de débordement explicite au lieu de prétendre que les logs sont toujours non bloquants et sans perte.</li>"
latest_reviewed_crates = "<p>Crates revues recemment :</p>"
tracing_0_1_44_mit = "<li><code>tracing 0.1.44</code>, MIT.</li>"
tracing_subscriber_0_3_23_mit = "<li><code>tracing-subscriber 0.3.23</code>, MIT.</li>"
tracing_appender_0_2_5_mit = "<li><code>tracing-appender 0.2.5</code>, MIT.</li>"
tracing_serde_0_2_0_mit = "<li><code>tracing-serde 0.2.0</code>, MIT.</li>"
log_classes = "<h2 id=\"log-classes\">Classes de logs</h2>"
fluxheim_should_split_logs_by_intent = "<p>Fluxheim devrait séparer les logs par intention :</p>"
access_one_event_per_completed_request = "<li><code>access</code> : un événement par requête terminée.</li>"
error_internal_failures_and_unexpected_runtime_errors = "<li><code>error</code> : défaillances internes et erreurs d'exécution inattendues.</li>"
security_rejected_requests_request_smuggling_attempts_admin_auth_failures_path_traversal_denied = "<li><code>security</code> : requêtes rejetées, tentatives de request smuggling, échecs d'authentification admin, path traversal, exécution PHP/CGI refusée et erreurs de permissions TLS/certificat.</li>"
audit_admin_operations_such_as_snapshot_rollback_reload_purge_cache_activity_reset_load_balancer = "<li><code>audit</code> : operations admin comme snapshot, rollback, reload, purge, reset d'activite cache, etat de membre load-balancer, poids de membre ou mutation de backend-set, renouvellement de certificat et futurs changements de compte/cle.</li>"
security_and_audit_logs_should_not_be_silently_disabled_per_vhost_they_may_be_rerouted_or_filter = "<p>Les logs security et audit ne doivent pas etre desactives silencieusement par vhost. Ils peuvent etre reroutes ou filtres par niveau, mais Fluxheim doit faire de leur desactivation un choix operateur explicite a haut risque.</p>"
event_fields = "<h2 id=\"event-fields\">Champs d'événement</h2>"
access_events_should_include = "<p>Les événements d'accès devraient inclure :</p>"
timestamp = "<li>horodatage</li>"
level = "<li>niveau</li>"
target_module = "<li>cible/module</li>"
request_id = "<li>ID de requete</li>"
vhost = "<li>hote virtuel</li>"
method = "<li>methode</li>"
path = "<li>chemin</li>"
query_present = "<li>query_present</li>"
protocol = "<li>protocole</li>"
status = "<li>statut</li>"
latency_ms = "<li>latency_ms</li>"
remote_addr = "<li>remote_addr</li>"
user_agent_length_capped = "<li>user_agent, longueur limitée</li>"
referer_length_capped = "<li>referer, longueur limitée</li>"
upstream_when_proxied = "<li>upstream, quand la requête est proxifiée</li>"
cache_status_when_cache_participates = "<li>statut du cache, lorsque le cache participe</li>"
tls_when_known = "<li>TLS, lorsque connu</li>"
legacy_protocol_when_future_legacy_static_listeners_are_used = "<li>protocole legacy, lorsque de futurs listeners statiques legacy sont utilises</li>"
audit_security_events_should_include_action_outcome_fields_and_avoid_raw_secret_values = "<p>Les evenements audit/security doivent inclure des champs action/outcome et eviter les valeurs de secret brutes.</p>"
pipeline = "<h2 id=\"pipeline\">Pipeline</h2>"
the_desired_pipeline_has_three_stages = "<p>La pipeline souhaitée comporte trois étapes :</p>"
capture_request_path_emits_tracing_events_with_structured_fields = "<li>Capture : le chemin de requête émet <code>tracing</code> des événements avec des champs structurés.</li>"
buffer_events_enter_a_bounded_async_queue = "<li>Buffer : les événements entrent dans une file asynchrone bornée.</li>"
dispatch_a_background_dispatcher_writes_to_configured_sinks = "<li>Dispatch : un dispatcher en arrière-plan écrit vers les sinks configurés.</li>"
the_request_worker_must_never_perform_slow_remote_network_logging_directly = "<p>Le worker de requête ne doit jamais effectuer directement un logging réseau distant lent.</p>"
overflow_policy = "<h2 id=\"overflow-policy\">Politique de débordement</h2>"
fluxheim_must_expose_an_explicit_overflow_policy = "<p>Fluxheim doit exposer une politique de débordement explicite :</p>"
drop_new_fastest_increments_dropped_log_metrics = "<li><code>drop_new</code> : le plus rapide ; incremente les metriques de logs supprimes.</li>"
block_preserves_logs_but_can_slow_request_handling = "<li><code>block</code> : préserve les logs mais peut ralentir le traitement des requêtes.</li>"
spool_writes_to_a_bounded_durable_disk_queue_best_durability_but_more_operational_complexity = "<li><code>spool</code> : écrit dans une file disque durable bornée ; meilleure durabilité mais complexité opérationnelle accrue.</li>"
without_spool_fluxheim_must_not_claim_zero_data_loss_with_block_fluxheim_must_not_claim_zero_req = "<p>Sans <code>spool</code>, Fluxheim ne doit pas promettre zero perte de donnees. Avec <code>block</code>, Fluxheim ne doit pas promettre zero impact sur la latence des requetes.</p>"
sinks = "<h2 id=\"sinks\">Sinks</h2>"
initial_sinks = "<p>Sinks initiaux :</p>"
stdout_default = "<li><code>stdout</code> : par défaut.</li>"
file_optional_structured_local_file = "<li><code>file</code> : fichier local structuré optionnel.</li>"
remote_tcp_tls_future_production_sink_for_vector_logstash_or_similar = "<li><code>remote_tcp_tls</code> : futur sink de production pour Vector, Logstash ou équivalent.</li>"
remote_udp_future_non_critical_sink_only_never_for_audit_security = "<li><code>remote_udp</code> : futur sink non critique uniquement ; jamais pour audit/security.</li>"
remote_sinks_should_be_optional_compile_time_support_for_example_logging_remote_durable_disk_que = "<p>Les sinks distants devraient être un support optionnel à la compilation, par exemple <code>logging-remote</code>. La prise en charge d'une file disque durable devrait être derrière <code>logging-spool</code>.</p>"
circuit_breaker = "<h2 id=\"circuit-breaker\">Circuit breaker</h2>"
remote_dispatch_should_use_a_circuit_breaker = "<p>Le dispatch distant devrait utiliser un circuit breaker :</p>"
connected_send_to_remote_sink = "<li><code>connected</code> : envoyer vers le sink distant.</li>"
tripped_remote_failed_write_to_stdout_or_spool = "<li><code>tripped</code> : distant en échec ; écrire vers stdout ou le spool.</li>"
recovering_attempt_periodic_reconnect_heartbeat = "<li><code>recovering</code> : tenter une reconnexion/un heartbeat périodique.</li>"
on_send_failure_the_dispatcher_should_immediately_fallback_for_that_event_trip_the_remote_sink_a = "<p>En cas d'echec d'envoi, le dispatcher doit immediatement utiliser le fallback pour cet evenement, declencher le sink distant et incrementer les metriques. Les tentatives de reconnexion doivent utiliser un backoff exponentiel borne.</p>"
security_requirements = "<h2 id=\"security-requirements\">Exigences de securite</h2>"
redact_authorization_cookie_set_cookie_admin_bearer_tokens_acme_eab_values_api_keys_and_configur = "<li>Masquer <code>Authorization</code>, <code>Cookie</code>, <code>Set-Cookie</code>, les bearer tokens admin, valeurs ACME EAB, cles API et en-tetes/champs sensibles configures.</li>"
never_log_request_bodies_by_default = "<li>Ne jamais journaliser les corps de requête par défaut.</li>"
length_cap_paths_headers_error_messages_and_upstream_error_text = "<li>Limiter la longueur des chemins, en-têtes, messages d'erreur et textes d'erreur upstream.</li>"
use_serde_json_formatting_not_hand_built_json_strings = "<li>Utiliser le formatage serde/JSON, pas des chaines JSON construites a la main.</li>"
mark_fallback_source_for_example_log_sink_stdout_fallback_or_log_sink_spool_fallback = "<li>Marquer la source de fallback, par exemple <code>log_sink=&quot;stdout-fallback&quot;</code> ou <code>log_sink=&quot;spool-fallback&quot;</code>.</li>"
make_audit_security_logs_available_to_stdout_even_when_remote_logging_fails = "<li>Rendre les logs audit/security disponibles sur stdout meme lorsque le logging distant echoue.</li>"
protect_local_log_files_and_spool_directories_with_owner_only_permissions_where_supported = "<li>Protéger les fichiers de logs locaux et les répertoires de spool avec des permissions réservées au propriétaire lorsque c'est pris en charge.</li>"
config_shape = "<h2 id=\"config-shape\">Forme de configuration</h2>"
initial_target = "<p>Cible initiale :</p>"
implemented_baseline_logging_access_enabled_controls_a_compact_json_access_event_emitted_from_pi = "<p>Baseline implementee : <code>logging.access.enabled</code> controle un evenement d'acces JSON compact emis depuis le hook <code>logging</code> de Pingora. Il enregistre la methode, le host brut optionnel, le vhost, le chemin optionnel sans query, le statut, la classe de statut a faible cardinalite, le flag d'erreur, l'ID de requete, les octets de corps de requete vus, les octets de corps de reponse vus et la latence. Si les ID de requete sont actives, Fluxheim reutilise un ID de requete entrant valide depuis <code>request_id_header</code> ou en genere un et le transmet a l'upstream avant les mutations normales de policy d'en-tetes. Cette baseline utilise la pile <code>log</code> existante. stderr/stdout et un sink <code>[logging.file]</code> desactive par defaut sont implementes ; le dispatcher asynchrone et les sinks distants restent des travaux futurs.</p>"
logging_level_and_logging_format_are_applied_at_startup_through_env_logger_rust_log_can_still_ov = "<p><code>logging.level</code> et <code>logging.format</code> sont appliques au demarrage via <code>env_logger</code> ; <code>RUST_LOG</code> peut encore remplacer le niveau pour le debogage local. Modifier l'un ou l'autre reglage apres le demarrage necessite actuellement une mise a niveau du processus, car le logger est initialise une seule fois. Le format JSON emet des enregistrements runtime internes structures, tandis que les evenements d'acces restent des enregistrements JSON d'acces directs.</p>"
implementation_stages = "<h2 id=\"implementation-stages\">Étapes d'implémentation</h2>"
add_typed_access_log_config_request_ids_and_baseline_json_access_events_through_log = "<li>Ajouter la configuration typée des access logs, les ID de requête et les événements d'accès JSON de baseline via <code>log</code>.</li>"
add_tracing_json_stdout_formatting_and_bridge_existing_log_records = "<li>Ajouter <code>tracing</code>, le formatage JSON vers stdout et le pont avec les enregistrements <code>log</code> existants.</li>"
add_access_security_audit_event_schema_and_request_ids = "<li>Ajouter le schema des evenements access/security/audit et les ID de requete.</li>"
add_bounded_dispatcher_queue_with_drop_new_and_block_policies = "<li>Ajouter une file de dispatcher bornee avec les policies <code>drop_new</code> et <code>block</code>.</li>"
add_file_sink_and_protected_local_spool_directory = "<li>Ajouter un sink fichier et un répertoire de spool local protégé.</li>"
add_remote_tcp_tls_sink_with_circuit_breaker_and_fallback = "<li>Ajouter un sink TCP/TLS distant avec circuit breaker et fallback.</li>"
expose_log_health_through_prometheus_admin_status_dropped_logs_spooled_logs_remote_failures_curr = "<li>Exposer l'état des logs via le statut Prometheus/admin : logs supprimés, logs spoolés, échecs distants, état courant du circuit et tentatives de reconnexion.</li>"
tests = "<h2 id=\"tests\">Essais</h2>"
required_tests = "<p>Tests requis :</p>"
json_output_contains_expected_request_fields = "<li>La sortie JSON contient les champs de requête attendus.</li>"
secret_fields_are_redacted = "<li>Les champs secrets sont masqués.</li>"
long_fields_are_capped = "<li>Les champs longs sont limités.</li>"
queue_overflow_follows_configured_policy = "<li>Le débordement de file suit la politique configurée.</li>"
remote_failure_falls_back_to_stdout_spool = "<li>Un échec distant bascule vers stdout/spool.</li>"
circuit_breaker_trips_and_recovers = "<li>Le circuit breaker déclenche puis récupère.</li>"
audit_security_events_are_emitted_for_admin_failures_and_denied_requests = "<li>Les evenements audit/security sont emis pour les echecs admin et les requetes refusees.</li>"
file_spool_path_validation_rejects_insecure_paths_where_possible = "<li>La validation des chemins fichier/spool rejette les chemins non sécurisés lorsque c'est possible.</li>"

[legacy_static_http]
legacy_static_http_support_fluxheim_source_docs = "<title>Support HTTP statique legacy - Documentation source Fluxheim</title>"
legacy_static_http_support = "<h1 id=\"legacy-static-http-support\">Support HTTP statique legacy</h1>"
legacy_http_support_is_a_future_experimental_compatibility_feature_for_isolated_devices_that_can = "<p>Le support HTTP legacy est une future fonctionnalite experimentale de compatibilite pour appareils isoles qui ne savent pas parler HTTP moderne. Il ne doit jamais faire partie du binaire Fluxheim par defaut et ne doit jamais tourner sur les chemins listener normaux proxy, cache, admin, PHP, CGI ou TLS.</p>"
the_modern_protocol_focus_for_fluxheim_remains_strict_http_1_1_and_http_2_today_with_http_3_quic = "<p>Le focus protocolaire moderne de Fluxheim reste aujourd'hui HTTP/1.1 strict et HTTP/2, avec HTTP/3/QUIC prevu comme future direction de performance et de securite. Le support de protocole legacy est une exception de compatibilite isolee.</p>"
