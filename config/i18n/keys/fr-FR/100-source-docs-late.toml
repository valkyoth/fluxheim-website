config_shape = "<h2 id=\"config-shape\">Forme de configuration</h2>"
initial_target = "<p>Cible initiale :</p>"
the_otlp_metrics_exporter_accepts_http_and_https_endpoints_use_loopback_http_for_same_host_colle = "<p>The OTLP metrics exporter accepts <code>http://</code> and <code>https://</code> endpoints. Utilisez loopback HTTP for same-host collectors and HTTPS for remote collectors. <code>metrics.otlp.tls_ca_cert_path</code> peut pointer vers un bundle CA PEM pour des collectors PKI privés ; sinon le client HTTPS utilise les racines WebPKI embarquées. Le HTTP en clair vers un collector non-loopback journalise un avertissement au démarrage.</p>"
implementation_stages = "<h2 id=\"implementation-stages\">Étapes d'implémentation</h2>"
harden_current_labels_ensure_request_outcome_labels_are_derived_from_configured_vhost_names_or_f = "<li>Durcir les labels actuels : s'assurer que les labels de résultat de requête ne dérivent que des noms de vhost configurés ou de buckets fixes. Implémenté pour <code>fluxheim_proxy_requests_total</code> : elle utilise les noms de vhost configurés, des buckets fixes de méthode de requête, des classes de résultat fixes et des classes de statut fixes au lieu des codes de statut bruts.</li>"
