[certificate_renewal]
certificate_renewal_and_reload_fluxheim_source_docs = "<title>Renouvellement et rechargement des certificats - Documentation source Fluxheim</title>"
certificate_renewal_and_reload = "<h1 id=\"certificate-renewal-and-reload\">Renouvellement et reload des certificats</h1>"
fluxheim_should_support_both_operator_owned_certificates_and_acme_managed_certificates_manual_certif = "<p>Fluxheim doit prendre en charge les certificats detenus par l'operateur et les certificats geres par ACME. Les certificats manuels sont configures avec <code>cert_path</code> et <code>key_path</code>. Les certificats ACME sont configures par vhost et geres sous <code>tls.acme.storage</code>. Fluxheim derive les chemins de certificats geres sous <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/fullchain.pem</code> et <code>&lt;storage&gt;/certificates/&lt;safe-vhost-segment&gt;/privkey.pem</code> ; le segment est nettoye et suffixe par hash par Fluxheim, il n'est pas fourni par l'operateur. Pour HTTP-01, Fluxheim derive aussi un stockage local de challenge sous <code>&lt;storage&gt;/http-01/&lt;safe-vhost-segment&gt;/</code> et sert directement les fichiers de tokens de challenge surs lorsque <code>tls.acme.challenge = &quot;http-01&quot;</code> est defini. TLS-ALPN-01 est aussi pris en charge dans <code>1.1.0</code> pour le backend rustls par defaut. Pendant le renouvellement, Fluxheim ecrit des certificats de challenge de courte duree sous <code>&lt;storage&gt;/tls-alpn-01/&lt;safe-domain-segment&gt;/</code>, et le resolver SNI rustls les sert seulement lorsque le client propose le protocole ALPN <code>acme-tls/1</code>. DNS-01 reste un travail futur, car les integrations de fournisseurs securisees exigent une gestion explicite des secrets propre au fournisseur plutot que des hooks shell generiques. La publication des challenges utilise le meme stockage gere : les tokens HTTP-01 sont limites a un segment de chemin sur pour les URL, les key-authorizations sont bornees et controlees contre les caracteres de controle, les certificats TLS-ALPN-01 sont generes avec l'extension d'identifiant ACME, les fichiers sont ecrits via des fichiers temporaires, et les destinations symlinkees sont rejetees. Les credentials de compte ACME sont stockes separement sous <code>&lt;storage&gt;/accounts/&lt;safe-issuer-segment&gt;/credentials.json</code>, toujours avec un segment nettoye et suffixe par hash genere par Fluxheim plutot qu'une valeur de configuration brute.</p>"
downstream_tls_listeners_are_explicit_in_server_tls_listen_the_runtime_uses_the_first_global_tls_cer = "<p>Les listeners TLS downstream sont explicites dans <code>server.tls_listen</code>. Le runtime utilise le premier entree globale <code>[[tls.certificates]]</code> comme certificat par defaut pour ces listeners. Si aucun certificat global n'est configure, <code>server.default_vhost</code> peut fournir le fallback via <code>[vhosts.tls.certificate]</code> ou <code>[vhosts.tls.acme]</code>. Les autres vhosts peuvent remplacer ce certificat par leur propre source statique ou geree par ACME ; Fluxheim selectionne le certificat correspondant par SNI pendant le handshake TLS downstream.</p>"
managed_acme_certificates_may_be_absent_during_first_issuance_reloadable_sni_tls_backends_including = "<p>Les certificats ACME geres peuvent etre absents pendant la premiere emission. Les backends TLS SNI rechargeables, y compris le build rustls par defaut, traitent les fichiers de certificats ACME geres par Fluxheim manquants comme en attente au lieu de refuser le demarrage. Les routes de challenge HTTP-01 et le listener en clair peuvent encore servir la requete de validation de l'emetteur, tandis que les handshakes HTTPS pour ce SNI en attente utilisent soit un certificat de fallback disponible, soit echouent jusqu'a l'emission des fichiers de certificat. Apres installation des fichiers par le worker ACME en arriere-plan, Fluxheim recharge le resolver de certificats SNI downstream afin que les nouveaux handshakes puissent les utiliser sans redemarrage du processus. Les chemins de certificats statiques restent fail-closed : un certificat detenu par l'operateur manquant reste une erreur de configuration/runtime.</p>"
storage_permissions = "<h2 id=\"storage-permissions\">Permissions de stockage</h2>"
fluxheim_has_a_runtime_storage_checker_for_operator_owned_certificates_and_acme_storage_directories = "<p>Fluxheim dispose d'un verificateur runtime du stockage pour les certificats detenus par l'operateur et les repertoires de stockage ACME.</p>"
recommended_unix_permissions = "<p>Permissions Unix recommandees:</p>"
private_keys_0600 = "<li>cles privees: <code>0600</code></li>"
acme_storage_directory_0700 = "<li>repertoire de stockage ACME: <code>0700</code></li>"
public_certificate_chains_normal_read_permissions_are_acceptable_for_example_0644 = "<li>chaines de certificats publics: des permissions de lecture normales sont acceptables, par exemple <code>0644</code></li>"
the_checker_reports_missing_certificate_key_files_non_file_certificate_key_paths_non_directory_acme = "<p>Le verificateur signale les fichiers certificat/cle manquants, les chemins certificat/cle qui ne sont pas des fichiers, les chemins de stockage ACME qui ne sont pas des repertoires, les chemins certificat/cle/EAB/stockage symlinkes, y compris les repertoires parents symlinkes, les cles privees lisibles par le groupe ou le monde, et les repertoires de stockage ACME accessibles au groupe ou au monde. Le parsing de configuration reste separe des controles du systeme de fichiers afin que la configuration puisse encore etre validee avant le provisionnement des fichiers.</p>"
secret_handling = "<h2 id=\"secret-handling\">Gestion des secrets</h2>"
acme_issuers_that_require_external_account_binding_such_as_actalis_and_google_trust_services_need_a = "<p>Les emetteurs ACME qui exigent External Account Binding, comme Actalis et Google Trust Services, ont besoin d'un identifiant de cle et d'une cle HMAC. Fluxheim prend en charge les variables d'environnement et les fichiers pour ces valeurs, mais les deploiements de production devraient preferer des secrets adosses a des fichiers:</p>"
systemd_credentials_mounted_under_run_credentials_lt_unit_gt = "<li>credentials systemd montes sous <code>/run/credentials/&lt;unit&gt;/</code></li>"
docker_or_podman_secrets_mounted_under_run_secrets = "<li>secrets Docker ou Podman montes sous <code>/run/secrets/</code></li>"
kubernetes_secret_volumes = "<li>volumes de secrets Kubernetes</li>"
these_mechanisms_keep_secrets_out_of_static_config_files_process_environment_listings_and_container = "<p>Ces mecanismes gardent les secrets hors des fichiers de configuration statiques, des listes d'environnement de processus et des metadonnees d'images conteneur. Ils s'alignent aussi avec les controles de stockage existants de Fluxheim, car l'application doit seulement lire des fichiers ordinaires avec une propriete et des permissions strictes. A l'execution, Fluxheim lit les secrets EAB avec un lecteur de fichier borne, supprime seulement les espaces autour, rejette les valeurs vides ou trop grandes, ouvre les fichiers sans suivre le symlink final sous Linux, et stocke les chaines chargees dans des wrappers memoire zeroizing.</p>"
example_systemd_service_override = "<p>Exemple d'override de service systemd:</p>"
matching_fluxheim_config_credential_names_resolve_below_credentials_directory_when_fluxheim_is_launc = "<p>Configuration Fluxheim correspondante. Les noms de credentials se resolvent sous <code>$CREDENTIALS_DIRECTORY</code> lorsque Fluxheim est lance par systemd, et sous <code>/run/secrets</code> pour les montages de secrets classiques de style conteneur:</p>"
built_in_issuer_names = "<p>Noms d'emetteurs integres:</p>"
letsencrypt_https_acme_v02_api_letsencrypt_org_directory = "<li><code>letsencrypt</code>: <code>https://acme-v02.api.letsencrypt.org/directory</code></li>"
letsencrypt_staging_https_acme_staging_v02_api_letsencrypt_org_directory = "<li><code>letsencrypt-staging</code>: <code>https://acme-staging-v02.api.letsencrypt.org/directory</code></li>"
actalis_https_acme_api_actalis_com_acme_directory_eab_required = "<li><code>actalis</code>: <code>https://acme-api.actalis.com/acme/directory</code>, EAB requis</li>"
google_trust_services_https_dv_acme_v02_api_pki_goog_directory_eab_required = "<li><code>google-trust-services</code>: <code>https://dv.acme-v02.api.pki.goog/directory</code>, EAB requis</li>"
google_trust_services_staging_https_dv_acme_v02_test_api_pki_goog_directory_eab_required = "<li><code>google-trust-services-staging</code>: <code>https://dv.acme-v02.test-api.pki.goog/directory</code>, EAB requis</li>"
google_trust_services_eab_credentials_are_environment_specific_and_single_use_for_account_registrati = "<p>Les credentials EAB Google Trust Services sont propres a l'environnement et a usage unique pour l'enregistrement de compte. Fluxheim conserve des valeurs par defaut separees pour production et staging:</p>"
production_fluxheim_gts_eab_kid_fluxheim_gts_eab_hmac_key = "<li>production: <code>FLUXHEIM_GTS_EAB_KID</code>, <code>FLUXHEIM_GTS_EAB_HMAC_KEY</code></li>"
staging_fluxheim_gts_staging_eab_kid_fluxheim_gts_staging_eab_hmac_key = "<li>staging: <code>FLUXHEIM_GTS_STAGING_EAB_KID</code>, <code>FLUXHEIM_GTS_STAGING_EAB_HMAC_KEY</code></li>"
for_containers_mount_the_same_two_values_as_secrets_and_point_fluxheim_at_the_mounted_files = "<p>Pour les conteneurs, montez les deux memes valeurs comme secrets et pointez Fluxheim vers les fichiers montes:</p>"
environment_variables_remain_useful_for_local_testing_but_they_should_not_be_the_recommended_product = "<p>Les variables d'environnement restent utiles pour les tests locaux, mais elles ne devraient pas etre le chemin de production recommande pour les secrets EAB.</p>"
account_credentials = "<h2 id=\"account-credentials\">Credentials de compte</h2>"
acme_account_credentials_contain_account_identity_and_private_key_material_they_are_not_kept_in_the = "<p>Les credentials de compte ACME contiennent l'identite du compte et le materiau de cle privee. Ils ne sont pas conserves dans la configuration TOML. Fluxheim derive leur chemin de stockage depuis le nom de l'emetteur et les ecrit sous <code>tls.acme.storage</code>:</p>"
the_credential_file_is_bounded_parsed_as_json_written_through_a_temporary_file_installed_with_owner = "<p>Le fichier de credentials est borne, parse comme JSON, ecrit via un fichier temporaire, installe avec des permissions reservees au proprietaire sous Unix et ouvert sans suivre le symlink final sous Linux. Le segment de chemin exact est genere par Fluxheim, donc les noms d'emetteur ne peuvent pas creer de path traversal ni d'emplacements caches dans le systeme de fichiers.</p>"
when_fluxheim_is_built_with_acme_client_it_can_load_existing_credentials_from_that_path_or_create_a = "<p>Lorsque Fluxheim est construit avec <code>acme-client</code>, il peut charger les credentials existants depuis ce chemin ou creer un nouveau compte d'emetteur via <code>instant-acme</code> et persister immediatement les credentials retournes. Les cles HMAC EAB sont traitees comme des cles MAC ACME encodees en base64/base64url avant d'etre transmises au client de l'emetteur. La meme feature contient aussi les chemins d'ordre live HTTP-01 et rustls TLS-ALPN-01 : creer l'ordre, publier le materiel de challenge, marquer les challenges prets, finaliser le CSR genere, recuperer la chaine de certificats, l'installer atomiquement et nettoyer les fichiers de challenge.</p>"
production_packages_and_container_images_ship_the_fluxheim_acme_companion_as_the_preferred_external = "<p>Les paquets de production et images conteneur livrent le compagnon <code>fluxheim-acme</code> comme commande externe preferee de renouvellement. Il utilise le meme moteur ACME, le meme layout de stockage, les memes credentials d'emetteur et le meme planificateur de cibles vhost que la gateway integree, mais garde la planification des renouvellements hors du processus qui sert le trafic :</p>"
by_default_renew_observes_the_managed_certificate_files_and_attempts_only_missing_or_due_certificate = "<p>Par defaut, <code>renew</code> observe les fichiers de certificats geres et ne tente que les certificats manquants ou dus. Si rien ne doit etre renouvele, la commande sort avec succes avec <code>acme attempted: 0</code> et un message de statut indiquant qu'aucun certificat n'est du. La premiere emission n'a normalement pas besoin de <code>--force-renew</code> : les fichiers de certificat manquants sont des cibles dues. La commande affiche chaque cible avec <code>status=due</code>, <code>status=skipped</code> ou <code>status=forced</code>, puis rapporte des lignes <code>renewed:</code> et <code>failed:</code> par cible. Pour les echecs HTTP-01 apres publication des fichiers de challenge, l'echec inclut des URL <code>published_http_01=</code> afin que les operateurs puissent tester les chemins publics exacts que l'emetteur aurait du atteindre. La commande sort avec un code non nul si une cible a echoue, tout en rapportant les renouvellements reussis du meme run.</p>"
fluxheim_acme_renew_also_asks_the_running_gateway_to_reload_its_certificate_handles_after_a_successf = "<p><code>fluxheim-acme renew</code> demande aussi a la gateway en cours d'execution de recharger ses handles de certificats apres un renouvellement reussi lorsque <code>server.process.certificate_reload_sock</code> est accessible. Utilisez <code>reload</code> explicitement apres installation manuelle de fichiers geres:</p>"
the_legacy_integrated_command_is_kept_for_manual_compatibility_but_new_automation_should_use_fluxhei = "<p>La commande integree legacy est conservee pour la compatibilite manuelle, mais la nouvelle automatisation devrait utiliser <code>fluxheim-acme</code>:</p>"
use_force_renew_only_for_deliberate_emergency_rotation_or_testing_when_you_really_need_to_reissue_ce = "<p>Utilisez <code>--force-renew</code> uniquement pour une rotation d'urgence volontaire ou des tests lorsque vous devez vraiment reemettre des certificats encore valides; des renouvellements forces repetes peuvent atteindre les limites de debit de l'emetteur:</p>"
all_is_accepted_as_a_backward_compatible_alias_for_force_renew_but_it_prints_a_deprecation_warning_a = "<p><code>--all</code> est accepte comme alias retrocompatible de <code>--force-renew</code>, mais il affiche un avertissement de deprecation et ne devrait pas etre utilise dans une nouvelle automatisation.</p>"
official_rpm_and_container_release_assets_include_acme_client_by_default_if_you_compile_from_source = "<p>Les assets de release RPM et conteneur officiels incluent <code>acme-client</code> par defaut. Si vous compilez depuis les sources avec une liste de features personnalisee, incluez-le explicitement:</p>"
initialize_acme = "<h2 id=\"initialize-acme\">Initialiser ACME</h2>"
