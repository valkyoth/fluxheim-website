pingora_versions_before_0_8_0_had_http_request_smuggling_vulnerabilities_around_http_1_0_transfe = "<p>Les versions de Pingora avant <code>0.8.0</code> avaient des vulnerabilites HTTP request-smuggling autour du parsing transfer-encoding HTTP/1.0 et du handling premature d'upgrade. Fluxheim suit deja Pingora <code>0.8.0</code>, mais le support legacy doit quand meme ajouter sa propre couche de rejet plus stricte, car les modes de compatibilite sont particulierement exposes aux attaques de parsing ambigu.</p>"
