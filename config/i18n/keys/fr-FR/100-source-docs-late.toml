future_http_0_9_and_headerless_http_1_0_traffic_must_not_create_vhost_labels_from_request_data_u = "<p>Le futur trafic HTTP/0.9 et HTTP/1.0 sans en-tetes ne doit pas creer de labels vhost depuis les donnees de requete. Utilisez <code>legacy_unidentified</code> or a configured legacy listener name.</p>"
