legacy_listeners_must_not_share_server_listen_server_tls_listen_admin_listen_or_metrics_listen_l = "<p>Les listeners legacy ne doivent pas partager <code>server.listen</code>, <code>server.tls_listen</code>, <code>admin.listen</code> ou <code>metrics.listen</code>. Les changements de listener sont des changements de process-upgrade.</p>"
