the_configuration_gauges_are_aggregate_label_free_and_populated_from_validated_configuration_whe = "<p>The configuration gauges are aggregate, label-free, and populated from validated configuration when the metrics listener starts. The local observability smoke verifies the route/vhost cache policy gauges, the request-collapsing policy count, and the maximum configured lock wait timeout. <code>fluxheim_acme_events_total</code> utilise uniquement des labels de cycle de vie bornés : <code>event</code> is <code>pending</code>, <code>renewed</code>, <code>failed</code>, <code>reload_success</code>, <code>reload_failed</code>, <code>reload_unavailable</code>, <code>tick_error</code>, or <code>other</code>. Elle évite intentionnellement les noms de domaine, chemins de certificats, URL de challenge et secrets d'émetteur. <code>fluxheim_php_requests_total</code> and <code>fluxheim_php_request_duration_seconds</code> utilisent les noms de vhost configurés avec des labels bornés de méthode, résultat et classe de statut. <code>outcome</code> is <code>declined</code>, <code>redirect</code>, <code>forbidden</code>, <code>not_found</code>, <code>fpm_error</code>, <code>connect_timeout</code>, <code>request_timeout</code>, <code>connection_error</code>, <code>configuration_error</code>, <code>invalid_response</code>, <code>intercepted</code>, <code>offload</code>, <code>offload_error</code>, <code>response</code>, or <code>other</code>; these metrics avoid raw paths, queries, script filenames, usernames, cookies, and FastCGI params. <code>fluxheim_stream_connections_total</code> and <code>fluxheim_stream_bytes_total</code> utilisent uniquement les noms de routes stream configurés. La connexion stream <code>outcome</code> is bounded to <code>completed</code>, <code>rejected</code>, <code>connect_error</code>, <code>timeout</code>, <code>shutdown</code>, or <code>error</code>. L'octet stream <code>direction</code> is bounded to <code>downstream_to_upstream</code>, <code>upstream_to_downstream</code>, or <code>other</code>. <code>fluxheim_php_stderr_events_total</code> utilise les noms de vhost configurés avec des labels <code>state</code> avec des labels <code>emitted</code>, <code>truncated</code> ou <code>other</code>  ; elle compte la présence de STDERR sans exposer le texte d'erreur PHP. <code>fluxheim_php_fpm_retries_total</code> utilise les noms de vhost configurés avec des labels <code>reason</code> labels of <code>connect_timeout</code>, <code>connection_error</code>, or <code>other</code> ; elle compte les tentatives de retry sans exposer les adresses upstream, chemins de socket, chemins de requête bruts, cookies ou paramètres FastCGI. <code>fluxheim_php_fpm_pool_idle_connections</code> and <code>fluxheim_php_fpm_pool_events_total</code> use configured vhost and pool labels. Le label <code>pool</code> vaut <code>default</code> pour un runtime PHP au niveau vhost, ou le nom de route configure pour un runtime PHP au niveau route. Pool <code>event</code> labels are bounded to <code>connect</code>, <code>reuse</code>, <code>return</code>, <code>drop_stale</code>, <code>discard_full</code>, or <code>other</code>. <code>fluxheim_cache_activity_total</code> utilise uniquement des labels bornés : <code>tier</code> is <code>memory</code>, <code>disk</code>, <code>policy</code>, or <code>other</code>, and <code>event</code> is <code>hit</code>, <code>miss</code>, <code>store</code>, <code>store_refusal</code>, <code>eviction</code>, <code>purge</code>, <code>pass</code>, <code>bypass</code>, <code>stale</code>, <code>revalidate</code>, <code>peer_fill_hit</code>, <code>peer_fill_miss</code>, <code>peer_fill_error</code>, <code>peer_fill_fallback</code>, <code>peer_fill_fail_closed</code>, or <code>other</code>. These metrics intentionally avoid raw hosts, paths, queries, cache keys, peer URLs, and purge identities. <code>fluxheim_cache_activity_scope_total</code> utilise les mêmes labels <code>tier</code> and <code>event</code> bornés plus des labels de noms configurés : <code>scope</code> is <code>vhost</code> or <code>route</code>, <code>vhost</code> est le nom de vhost configuré, et <code>route</code> is empty for vhost cache or the configured route name for route cache. It intentionally avoids raw <code>Host</code>, path, query, cache key, and purge identity labels. Cache operation duration histograms use the same configured-name labels plus bounded <code>phase</code> and <code>operation</code> labels. <code>operation</code> is <code>lookup</code> or <code>lock_wait</code>, afin que les tableaux de bord puissent séparer le coût du lookup de stockage du temps d'attente de request collapsing sans labels de requête à forte cardinalité. Les histogrammes de durée du purger cache utilisent le label purger borné <code>outcome</code> label only, so operators can see when cleanup ticks are getting slow without exposing cache paths, queries, cache keys, and purge identities. Future OpenTelemetry attributes should mirror the same low-cardinality concepts used by admin JSON and Prometheus.</p>"
