for_actalis_the_command_asks_for_the_contact_email_eab_key_id_and_eab_hmac_key_the_hmac_prompt_is_hi = "<p>Pour Actalis, la commande demande l'email de contact, l'id de cle EAB et la cle HMAC EAB. Le prompt HMAC est masque. Par defaut, elle ecrit:</p>"
