fluxheim_load_balancer_events_total_counts_selected_upstreams_retries_all_nodes_down_unavailable = "<li><code>fluxheim_load_balancer_events_total</code> counts selected upstreams, retries, all-nodes-down/unavailable pools, queue wait/full/timeout outcomes, success/failure outcomes, and passive-health ejections with bounded configured vhost/route labels. The <code>upstream</code> est vide sauf si l'opérateur configure une entrée <code>proxy.upstream_aliases</code> entry.</li>"
fluxheim_load_balancer_queue_wait_seconds_observes_bounded_queue_wait_and_timeout_duration_by_co = "<li><code>fluxheim_load_balancer_queue_wait_seconds</code> observe l'attente de file bornée et la durée de timeout par vhost/route configurés et résultat de file borné. Elle ne labelle pas les adresses upstream brutes.</li>"
richer_upstream_health_state_transition_metrics_remain_planned_they_should_not_label_raw_upstrea = "<li>richer upstream health state transition metrics remain planned; they should not label raw upstream addresses unless an explicit low-cardinality alias is configured.</li>"
