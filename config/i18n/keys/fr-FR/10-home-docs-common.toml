events_no_sensitive_text = "Ces événements ne contiennent pas d'adresses IP brutes, d'identifiants utilisateur, de valeurs de cookies, de fingerprints navigateur, de corps de requête, d'en-têtes Authorization ni de query strings complètes."
what_we_collect = "Ce que nous collectons"
privacy_collect_text = "Le site enregistre des métriques opérationnelles agrégées : nombre de requêtes, vues de page, langue sélectionnée, route de page normalisée, section, classe de statut HTTP, durée de requête, clics de téléchargement, clics de redirection GitHub et temps visible approximatif de page."
country_aggregation_text = "Une agrégation optionnelle par pays peut être activée par l'opérateur. Lorsqu'elle est activée, le serveur déduit un code pays en mémoire et exporte uniquement le code pays ou unknown."
what_we_do_not_collect = "Ce que nous ne collectons pas"
