telemetry_use_text = "La telemetry sert à exploiter le site, comprendre l'usage agrégé de la documentation et des téléchargements, et détecter les problèmes de fiabilité. Elle ne sert pas à construire des profils sur des visiteurs individuels."
retention = "Rétention"
retention_text = "La rétention est contrôlée par le déploiement local Prometheus et Grafana exploité pour le site. L'application du site n'écrit pas de base de données d'analytics séparée."
purpose_and_lawful_basis = "Finalité et base légale"
gdpr_basis_text = "La finalité de la telemetry du site est la sécurité, la fiabilité, la planification de capacité et l'amélioration agrégée de la documentation. La base légale visée est l'intérêt légitime à exploiter et sécuriser le site avec une telemetry minimisée pour la confidentialité."
data_minimisation = "Minimisation des données"
gdpr_minimisation_text = "Les métriques utilisent des labels bornés comme la locale, la route normalisée, la section, la classe de statut, l'artefact téléchargé, la cible GitHub et le code pays optionnel. L'implémentation est conçue pour ne pas stocker ni exporter d'adresses IP brutes ou d'identifiants de suivi au niveau utilisateur."
github_redirect_privacy_text = "Les clics sortants vers GitHub sont comptés de manière agrégée avant de rediriger le navigateur vers GitHub. GitHub traite ensuite la requête selon ses propres conditions et sa propre politique de confidentialité."
your_rights = "Vos droits"
gdpr_rights_text = "Comme le site évite les identifiants utilisateur et ne stocke qu'une telemetry agrégée, nous ne pouvons normalement pas identifier un visiteur précis dans les métriques. Les questions de confidentialité ou de RGPD peuvent être ouvertes via le projet GitHub Fluxheim."
