when_an_operator_explicitly_allow_lists_common_request_context_names_fluxheim_generated_context = "<p>Lorsqu'un operateur met explicitement en allow-list des noms courants de contexte de requete, le contexte genere par Fluxheim prime sur les valeurs fournies par le client. <code>X-Original-URI</code>, <code>X-Forwarded-URI</code>, <code>X-Auth-Request-Redirect</code>, <code>X-Forwarded-For</code>, <code>X-Real-IP</code>, <code>X-Forwarded-Host</code>, and <code>X-Forwarded-Proto</code> are built from the current request and trusted proxy chain before the auth subrequest is sent. Repeated <code>Cookie</code> les champs sont joints avec <code>; </code>, ce qui correspond a la requete upstream origin normalisee, afin que le service d'auth et l'origine recoivent la meme structure de cookies lorsque les cookies sont explicitement transmis.</p>"
