stabilizes_runnable_wasm_migration_examples_and_release_gate_testing_adds_optional_http_response_security_profiles_validated_request_aware_cors_bounded_retry_guidance_stricter_forwarding_and_identity_header_sanitization_and_safer_header_parsing_and_rewriting = "실행 가능한 Wasm 마이그레이션 예제 및 릴리스 게이트 테스트를 안정화합니다. 선택적 HTTP 응답 보안 프로필, 검증된 요청 인식 CORS, 제한된 재시도 지침, 더 엄격한 전달 및 ID 헤더 삭제, 더 안전한 헤더 구문 분석 및 재작성을 추가합니다."
