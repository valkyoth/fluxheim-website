adds_conservative_browser_isolation_and_resource_policy_defaults_suitable_for_most_sites = "대부분의 사이트에 적합한 보수적인 브라우저 격리 및 리소스 정책 기본값을 추가합니다."
enables_strict_cross_origin_isolation_for_applications_that_have_tested_every_external_dependency = "모든 외부 종속성을 테스트한 애플리케이션에 대해 엄격한 원본 간 격리를 활성화합니다."
neither_profile_enables_hsts_or_csp_configure_those_separately_after_testing_them_against_the_real_site = "두 프로필 모두 HSTS 또는 CSP를 활성화하지 않습니다. 실제 사이트에서 테스트한 후 별도로 구성합니다."
cors_for_browser_apps = "브라우저 앱용 CORS"
enable_cors_only_when_browser_applications_on_known_origins_must_call_this_route = "알려진 출처의 브라우저 애플리케이션이 이 경로를 호출해야 하는 경우에만 CORS를 활성화하세요."
fluxheim_answers_valid_preflight_requests_locally_rejected_preflights_return_403_without_reaching_the_application = "Fluxheim은 유효한 프리플라이트 요청에 로컬로 응답하며, 거부된 프리플라이트는 애플리케이션에 도달하지 않고 <code>403</code>을 반환합니다."
