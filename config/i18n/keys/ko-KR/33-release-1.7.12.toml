r1712_released_july_15_2026 = "2026년 7월 15일 출시"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "옵트인 표준 기반 캐시, 프록시 및 응답 다이제스트 메타데이터를 추가합니다."
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "인증된 라이브 스냅샷 다시 로드, 롤백, 무결성 검사 및 재시작 지속성을 입증합니다."
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "재현 가능한 FIPS-backend 증거 및 광범위한 기본 런타임 강화를 추가합니다."
r1712_whats_next_summary = "옵트인 표준 메타데이터, 인증된 스냅샷 롤백 증명, 재현 가능한 FIPS-backend 증거, 더 강력한 캐시, TLS, Wasm, 버퍼링 및 스트림 경계를 추가합니다."
r1712_release_series_digest = "Fluxheim 1.7 릴리스 시리즈: 선택적으로 활성화하는 표준 기반 캐시, 프록시 및 응답 다이제스트 메타데이터, 인증된 라이브 스냅샷 적용과 롤백, 재현 가능한 FIPS 백엔드 검증 자료, 무중단 프로세스 업그레이드, 독립적으로 검증된 Wasm 정책 예제, 강화된 캐시·TLS·버퍼링·스트림·프로토콜 경계."
r1712_standards_based_response_metadata = "표준 기반 응답 메타데이터"
r1712_response_metadata_intro = "응답 메타데이터는 기본적으로 비활성화되어 있습니다. 필요한 항목만 활성화하십시오. Fluxheim은 캐시 키, 백엔드 주소, DNS 이름 또는 원본 오류 내용을 노출하지 않고 실제 캐시 결과, 프록시 장애 및 최종 응답 바이트에서 값을 생성합니다."
r1712_field = "항목"
r1712_what_it_reports = "보고 내용"
r1712_cache_status_description = "적중, 미스, 만료 응답 전달, 재검증, 만료 및 우회와 같은 RFC 9211 캐시 결과를 보고합니다."
r1712_proxy_status_description = "Fluxheim이 생성한 장애에 대해 RFC 9209의 제한된 분류 정보를 보고합니다."
r1712_content_digest_description = "압축 후 최종 HTTP 메시지 본문에 대한 RFC 9530 SHA-256 값입니다."
r1712_repr_digest_description = "Fluxheim이 선택된 표현 전체를 보유하는 경우에만 SHA-256 값을 제공합니다."
r1712_live_snapshots_and_rollback = "라이브 스냅샷 및 롤백"
r1712_live_snapshot_intro = "인증된 스냅샷은 검증된 후보를 게시하고, 라이브 라우터를 교체하고, 일반적인 라우팅 전용 배포를 다시 시작하지 않고도 롤백할 수 있습니다. 각 요청은 처음부터 끝까지 하나의 라우터 세대에 유지됩니다."
r1712_snapshot_private_directory = "스냅샷 저장소를 전용 개인 디렉터리에 보관하세요. 기존의 비공개 디렉토리와 파일 시스템 루트는 거부됩니다."
r1712_snapshot_process_upgrade = "백그라운드 로드 밸런서 상태 또는 검색 서비스가 활성화된 경우 프로세스 업그레이드를 사용하십시오."
r1712_snapshot_integrity_restart = "게시 또는 롤백 후 스냅샷 무결성 검사를 실행하고 선택한 세대가 다시 시작해도 유지되는지 확인합니다."
r1712_read_snapshot_contract = "전체 스냅샷 운영 규약 읽기"
r1712_authorization_cache_bypass = "<code>Authorization</code> 또는 <code>Proxy-Authorization</code>를 전달하는 요청은 항상 공유 캐시 조회 및 저장을 우회합니다."
r1712_strict_cache_control = "잘못된 형식 또는 충돌하는 응답 <code>Cache-Control</code> 지시문은 구성된 TTL로 돌아가는 대신 거부됩니다. <code>s-maxage</code>는 <code>max-age</code>보다 우선순위를 갖습니다."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> 및 <code>s-maxage</code>는 최신 상태가 만료된 후 오래된 재사용을 금지합니다."
r1712_encrypted_cache_upgrade_note = "암호화된 캐시 업그레이드 참고 사항"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12는 암호화된 디스크 캐시 객체를 내구성 있는 nonce 상태를 사용하여 루트 바인딩된 데이터 및 인덱스 키로 이동합니다. 이전에 암호화된 루트에 대한 첫 번째 시작과 모든 로컬 키 순환은 트래픽을 제공하기 전에 의도적으로 해당 캐시를 콜드 퍼지합니다."
r1712_encrypted_cache_disposable = "암호화된 캐시는 기준 데이터가 아니라 폐기 가능한 성능 가속 데이터로 취급합니다."
r1712_encrypted_cache_private_storage = "모든 캐시 루트에 영구 개인 저장소를 제공하고 독립 루트 간에 nonce 상태를 복사하지 마세요."
r1712_encrypted_cache_warmup = "업그레이드 또는 키 교체 후 첫 캐시 재구축에 필요한 오리진 서버 용량을 계획합니다."
r1712_client_certificate_revocation = "클라이언트 인증서 해지"
r1712_client_certificate_revocation_intro = "상호 TLS에서 폐기된 클라이언트 인증서를 거부해야 하는 경우 크기가 제한된 PEM CRL 묶음을 제공하십시오. Fluxheim은 전체 발급자 체인을 검증하고 만료되었거나 불완전한 CRL 정책을 거부합니다."
r1712_client_certificate_revocation_compliance = "FIPS 또는 ISO 필수 준수 모드에서 필수 클라이언트 인증에는 CRL 번들도 필요합니다. 일반 클라이언트 인증은 명시적인 선택으로 해지를 유지합니다."
r1712_fips_backend_evidence = "FIPS 백엔드 검증 자료"
r1712_fips_backend_evidence_intro = "Fluxheim은 OpenSSL-FIPS 및 rustls/AWS-LC-FIPS 프로필마다 의존성을 고정한 별도의 CI 검증 환경을 제공합니다. 정확한 프로필 바이너리를 빌드하고 실행하며, 다운스트림 TLS와 인증서 검증이 적용된 업스트림 TLS를 시험하고, 호환되지 않는 정책을 거부한 뒤 컴파일러, 공급자, 의존성, 바이너리 및 이미지 식별자를 기록합니다."
r1712_fips_backend_evidence_boundary = "이는 재현 가능한 백엔드 검증 자료이며 제품 전체의 FIPS 인증을 의미하지 않습니다. 검증 컨테이너를 일반 릴리스 이미지와 분리하고 실제 배포 빌드와 일치하는 자료를 확인하십시오."
r1712_read_fips_evidence_guide = "FIPS 증거 가이드 읽기"
r1712_loader_admission = "모듈 로드 승인 제어"
r1712_loader_admission_description = "공개 매니페스트에는 고정된 SHA-256 해시가 필요합니다. 컴파일은 프로세스 전체에서 동시에 최대 2개만 수행되며, 컴파일 결과물은 기본 32 MiB, 절대 최대 256 MiB로 제한됩니다."
r1712_file_identity = "파일 동일성"
r1712_file_identity_description = "Fluxheim은 링크를 따라가지 않고 승인된 플러그인 파일을 열어 검증된 일반 파일 핸들을 유지합니다. 경로를 다시 열지 않고 그 핸들에서 모듈 바이트를 읽습니다."
