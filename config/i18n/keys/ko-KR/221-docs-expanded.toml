version_1_6_37_is_the_final_pre_wasm_crate_boundary_cleanup_acme_observability_cache_load_balancer_php_fpm_and_native_runtime_internals_move_into_smaller_crate_owned_modules_while_runtime_behavior_stays_stable = "버전 1.6.37은 Wasm 전 마지막 crate 경계 정리입니다. ACME, observability, cache, load-balancer, PHP-FPM, native runtime 내부를 각 crate가 소유하는 더 작은 모듈로 옮기면서 runtime 동작은 안정적으로 유지합니다."

version_1_6_37_keeps_the_local_observability_smoke_more_reliable_by_retrying_disposable_prometheus_and_jaeger_startup_with_freshly_allocated_ports_when_host_network_ports_race_with_other_runner_processes = "버전 1.6.37은 host-network 포트가 다른 runner 프로세스와 경쟁할 때 새로 할당한 포트로 Prometheus와 Jaeger 임시 시작을 재시도하여 로컬 observability smoke를 더 안정적으로 만듭니다."

starting_with_1_7_0_fluxheim_adds_an_optional_wasm_sandbox_foundation_it_is_disabled_by_default_incompatible_with_privacy_mode_and_currently_proves_safe_plugin_loading_plus_bounded_execution_before_request_response_policy_hooks_are_exposed = "1.7.0부터 Fluxheim은 선택적 Wasm 샌드박스 기반을 추가합니다. 기본값으로 비활성화되어 있고 privacy-mode와 함께 사용할 수 없으며, request/response 정책 훅을 공개하기 전에 안전한 플러그인 로딩과 제한된 실행을 검증합니다."
