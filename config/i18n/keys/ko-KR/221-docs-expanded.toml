fluxheim_1_7_3_keeps_wasm_optional_and_adds_constrained_native_http_1_route_decision_hooks_alongside_access_decision_and_header_hooks_plugins_can_continue_deny_or_select_configured_canary_and_mirror_route_branches_but_they_still_cannot_invent_upstreams_bypass_route_matching_override_fluxheim_access_policy_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.3은 Wasm을 계속 선택 기능으로 두고, access-decision 및 header hook 옆에 제한된 native HTTP/1 route-decision hook을 추가합니다. 플러그인은 계속 진행, 거부, 또는 설정된 canary 및 mirror 라우트 분기를 선택할 수 있지만, upstream을 만들어 내거나 라우트 매칭을 우회하거나 Fluxheim 접근 정책을 덮어쓰거나 원시 header, body, 파일시스템 접근, 네트워크 접근, 개인 키 또는 admin API를 받을 수는 없습니다."
route_decisions = "라우트 결정"
route_decision_hooks_can_continue_deny_or_select_only_configured_matching_canary_and_mirror_route_branches = "<code>route-decision</code> hook은 계속 진행, 거부, 또는 설정되어 매칭된 <code>canary</code> 및 <code>mirror</code> 라우트 분기 선택만 할 수 있습니다."
selected_route_policy = "선택된 라우트 정책"
selected_route_acls_rate_limits_concurrency_limits_body_limits_redirects_and_header_policy_still_run_after_a_wasm_route_decision = "선택된 라우트의 ACL, rate limit, concurrency limit, body limit, redirect 및 header policy는 Wasm 라우트 결정 후에도 계속 실행됩니다."

fluxheim_1_7_4_keeps_wasm_optional_and_adds_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_or_deny_but_they_still_cannot_mutate_raw_cache_keys_ttls_tags_response_headers_stored_metadata_or_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.4는 Wasm을 계속 선택 기능으로 유지하면서 access-decision, header, route-decision hook 옆에 제한된 native HTTP/1 cache-policy hook을 추가합니다. 플러그인은 일반 cache 동작 유지, origin 전달, cache 우회, 저장 생략 또는 거부를 선택할 수 있지만 raw cache key, TTL, tag, response header, stored metadata를 변경하거나 raw header, body, 파일시스템 접근, 네트워크 접근, 개인 키, admin API를 받을 수 없습니다."
cache_decisions = "Cache 결정"
cache_lookup_hooks_can_continue_pass_bypass_or_deny_cache_store_hooks_can_continue_skip_storage_or_deny_before_memory_disk_cache_writes = "<code>cache-lookup</code> hooks는 continue, pass, bypass 또는 deny를 선택할 수 있습니다. <code>cache-store</code> hooks는 memory/disk cache writes 전에 continue, skip storage 또는 deny를 선택할 수 있습니다."
cache_policy_limits = "Cache-policy 제한"
cache_hooks_use_a_separate_process_wide_admission_ceiling_so_hot_cache_policy_routes_cannot_starve_access_route_or_header_hooks = "Cache hook은 별도의 process-wide admission 상한을 사용하므로 트래픽이 많은 cache-policy route가 access, route 또는 header hook의 실행 여유를 고갈시키지 않습니다."
fluxheim_1_7_5_keeps_wasm_optional_and_extends_bounded_native_http_1_cache_policy_hooks_alongside_access_decision_header_and_route_decision_hooks_plugins_can_continue_normal_cache_behavior_pass_through_origin_bypass_cache_skip_storage_deny_select_fixed_mobile_desktop_cache_key_variants_and_attach_fixed_cache_store_ttl_tag_and_stored_header_metadata_but_they_still_cannot_emit_arbitrary_cache_key_bytes_arbitrary_ttls_arbitrary_tags_raw_response_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.5는 Wasm을 선택 기능으로 유지하면서 access-decision, header, route-decision hook 옆의 제한된 native HTTP/1 cache-policy hook을 확장합니다. Plugin은 일반 cache 동작 유지, origin 전달, cache 우회, 저장 생략, 거부, 고정 mobile/desktop cache-key variant 선택, 고정 cache-store TTL, tag, stored-header metadata 첨부를 할 수 있습니다. 하지만 임의 cache-key byte, 임의 TTL, 임의 tag, raw response-header, body, filesystem access, network access, private key, admin API는 사용할 수 없습니다."
cache_metadata = "Cache 메타데이터"
cache_lookup_hooks_can_add_fixed_mobile_desktop_cache_key_variants_cache_store_hooks_can_set_fixed_ttl_tag_and_stored_header_metadata = "<code>cache-lookup</code> hook은 고정 mobile/desktop cache-key variant를 추가할 수 있습니다. <code>cache-store</code> hook은 고정 TTL, tag, stored-header metadata를 설정할 수 있습니다."
module_identity = "모듈 ID"
fluxheim_1_7_6_keeps_wasm_optional_and_hardens_the_mature_native_http_1_hook_runtime_compiled_modules_now_carry_identities_scoped_by_plugin_sha_256_digest_abi_version_native_hook_feature_surface_and_fluxheim_version_cache_hooks_also_get_per_vhost_admission_budgets_under_the_process_wide_cache_hook_ceiling_so_one_vhost_cannot_starve_another = "Fluxheim 1.7.6은 Wasm을 선택 기능으로 유지하면서 성숙한 native HTTP/1 hook runtime을 강화합니다. 이제 compiled module은 plugin SHA-256 digest, ABI version, native hook feature surface, Fluxheim version으로 범위가 정해진 identity를 갖습니다. cache hook에는 process-wide cache-hook ceiling 아래에서 vhost별 admission budget도 적용되어 한 vhost가 다른 vhost의 실행 여지를 고갈시키지 못합니다."
compiled_modules_are_tied_to_plugin_digest_abi_version_hook_feature_surface_and_fluxheim_version_so_future_reuse_cannot_cross_release_or_feature_boundaries = "compiled module은 plugin digest, ABI version, hook feature surface, Fluxheim version에 묶이므로 향후 재사용이 release 또는 feature 경계를 넘을 수 없습니다."
process_wide_cache_global_cache_vhost_per_plugin_and_per_attachment_execution_ceilings_prevent_unbounded_plugin_work = "process-wide, cache-global, cache-vhost, per-plugin, per-attachment 실행 상한이 제한 없는 plugin work를 막습니다."
