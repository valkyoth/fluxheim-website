fluxheim_1_7_2_keeps_wasm_optional_and_adds_the_first_bounded_native_http_1_request_header_and_response_header_hook_family_plugins_can_make_approved_synthetic_policy_changes_but_they_still_do_not_receive_raw_headers_bodies_filesystem_access_network_access_private_keys_or_admin_apis = "Fluxheim 1.7.2는 Wasm을 계속 선택 기능으로 두면서 native HTTP/1 request-header와 response-header를 위한 첫 번째 bounded hook 계열을 추가합니다. 플러그인은 승인된 합성 policy 변경을 수행할 수 있지만 raw header, body, 파일시스템 접근, 네트워크 접근, 개인 키, admin API는 여전히 받지 않습니다."
