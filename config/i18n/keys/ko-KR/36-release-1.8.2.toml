r182_summary = "7개 공개 프로필 모두에 서명되지 않은 네이티브 Windows x86_64 ZIP 아카이브를 추가하고, Windows 파일 시스템과 자격 증명 보호를 유지하며, PHP용 SUSE Micro 이미지를 자체 완결형 php-suse-bci 런타임으로 교체했습니다."
r182_verify_checksum = "아카이브를 풀기 전에 게시된 SHA-256 체크섬을 검증하세요."
r182_unsigned_preview = "서명되지 않은 미리 보기:"
r182_windows_unsigned = "서명되지 않은 포터블 미리 보기입니다. SmartScreen과 PowerShell 보안 기능을 계속 활성화하세요. Authenticode 서명과 Windows 서비스 설치 프로그램은 아직 제공되지 않습니다."
r182_macos_unsigned = "서명되지 않은 명령줄 미리 보기입니다. Gatekeeper를 계속 활성화하세요. Developer ID 서명, 공증, launchd 연동은 아직 제공되지 않습니다."
