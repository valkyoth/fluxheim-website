[config_snapshots]
fluxheim_uses_two_layers_for_reload_safety = "Fluxheim uses two layers for reload safety:"
runtime_snapshots_immutable_in_memory_state_behind_arcswap = "Runtime snapshots: immutable in-memory state behind <code>ArcSwap</code>."
durable_snapshots_validated_toml_configs_stored_on_disk_with_a_current_pointer = "Durable snapshots: validated TOML configs stored on disk with a current pointer."
the_runtime_snapshot_model_means_old_requests_can_keep_using_the_config_they_started_with_while_new = "The runtime snapshot model means old requests can keep using the config they started with while new requests use the new config after an atomic pointer swap. The durable snapshot store gives operators an auditable rollback target and the admin API a current pointer to apply."
store_layout = "Store Layout"
use_an_operator_chosen_state_directory_for_example = "Use an operator-chosen state directory, for example"
current_contains_the_active_snapshot_id_fluxheim_uses_an_atomically_replaced_pointer_file_instead_of = "<code>current</code> contains the active snapshot id. Fluxheim uses an atomically replaced pointer file instead of a symlink. A symlink swap is a good Linux-only design, but the pointer file keeps the store straightforward in rootless Podman, restricted volume mounts, and non-Unix development environments while still using write-temp-and-rename semantics."
snapshot_config_files_contain_the_validated_effective_config_written_back_as_toml_metadata_files_con = "Snapshot config files contain the validated effective config, written back as TOML. Metadata files contain the snapshot id, creation time, and optional operator message. Operator messages are trimmed and limited to 4096 bytes of non-control text before they are written or loaded. Generated snapshot ids contain Unix time plus a process-local sequence; they do not include the Fluxheim process id."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_as = "The store is deliberately conservative about filesystem indirection. Snapshot ids may only contain ASCII letters, digits, <code>_</code>, and <code>-</code>, and are limited to 128 bytes; the store root cannot contain <code>..</code> or sit below a symlinked parent directory; the store root and <code>configs</code> directory must be real directories; the <code>configs</code> directory must remain inside the snapshot store; and <code>current</code>, snapshot TOML files, and metadata TOML files are opened as regular files. Symlinked store roots, pointer, config, metadata, or <code>configs</code> paths are rejected so a rollback cannot be redirected to an operator-unapproved file. Atomic writes also require an already validated real parent directory and will not replace a symlinked destination. Snapshot reads are bounded: <code>current</code> is limited to 4 KiB and snapshot TOML/metadata reads are limited to 16 MiB. Snapshot stores are limited to 1024 snapshots; operators should export or prune old snapshots before that limit."
the_store_is_deliberately_conservative_about_filesystem_indirection_snapshot_ids_may_only_contain_2 = "The store is deliberately conservative about filesystem indirection. Snapshot ids may only contain ASCII letters, digits,"
