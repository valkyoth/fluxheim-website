r1712_released_july_15_2026 = "Objavljeno 15. jula 2026"
r1712_adds_opt_in_standards_based_cache_proxy_and_response_digest_metadata = "Dodaje keš memoriju, proxy i metapodatke za analizu odgovora zasnovanih na standardima"
r1712_proves_authenticated_live_snapshot_reload_rollback_integrity_checks_and_restart_persistence = "Dokazuje autentičnost ponovnog učitavanja snimka uživo, vraćanja, provjere integriteta i postojanost ponovnog pokretanja"
r1712_adds_reproducible_fips_backend_evidence_and_broad_native_runtime_hardening = "Dodaje reproducibilne dokaze FIPS-backend i široko prirodno očvršćavanje"
r1712_whats_next_summary = "dodaje metapodatke standarda za opt-in, autentificirani dokaz vraćanja snimka, reproducibilne dokaze FIPS-backend i jaču keš memoriju, TLS, Wasm, međuspremnik i granice toka."
r1712_release_series_digest = "Fluxheim 1.7 serija izdanja: keš memorija, proxy i metapodaci odgovora zasnovani na standardima; ponovno učitavanje i vraćanje autentificiranog snimka uživo; ponovljivi dokazi FIPS-backend; nadogradnje procesa bez zastoja; nezavisno testirani primeri politike Wasm; i jači keš, TLS, međuspremnik, tok i granice protokola."
r1712_standards_based_response_metadata = "Metapodaci odgovora zasnovani na standardima"
r1712_response_metadata_intro = "Metapodaci odgovora su podrazumevano onemogućeni. Omogućite samo polja koja su vam potrebna; Fluxheim ih izvodi iz stvarnog rezultata keširanja, greške proxyja i konačnih bajtova odgovora bez izlaganja ključeva keša, pozadinskih adresa, DNS imena ili sirovih grešaka."
r1712_field = "Polje"
r1712_what_it_reports = "Šta izveštava"
r1712_cache_status_description = "RFC 9211 ishodi keširanja kao što su pogodak, promašaj, zastarjelo prosljeđivanje, ponovna validacija, istek i zaobilaženje."
r1712_proxy_status_description = "RFC 9209 detalji niske kardinalnosti za kvarove koje generiše Fluxheim."
r1712_content_digest_description = "RFC 9530 SHA-256 preko konačnog sadržaja poruke HTTP nakon kompresije."
r1712_repr_digest_description = "SHA-256 samo kada Fluxheim drži kompletan odabrani prikaz."
r1712_live_snapshots_and_rollback = "Snimci uživo i vraćanje"
r1712_live_snapshot_intro = "Ovjereni snimci mogu objaviti potvrđenog kandidata, zamijeniti aktivni ruter i vratiti se bez ponovnog pokretanja normalnih implementacija samo za usmjeravanje. Svaki zahtjev ostaje na jednoj generaciji rutera od početka do kraja."
r1712_snapshot_private_directory = "Čuvajte pohranu snimaka u namjenskom privatnom direktoriju; postojeći ne-privatni direktoriji i korijeni sistema datoteka su odbijeni."
r1712_snapshot_process_upgrade = "Koristite nadogradnju procesa kada su aktivne usluge zdravlja ili otkrivanja pozadinskog balansera opterećenja."
r1712_snapshot_integrity_restart = "Pokrenite provjere integriteta snimka nakon objavljivanja ili vraćanja i provjerite da li je odabrana generacija preživjela ponovno pokretanje."
r1712_read_snapshot_contract = "Pročitajte kompletan snimak ugovora"
r1712_authorization_cache_bypass = "Zahtjevi koji nose <code>Authorization</code> ili <code>Proxy-Authorization</code> uvijek zaobilaze traženje i pohranu dijeljene predmemorije."
r1712_strict_cache_control = "Pogrešan ili konfliktan odgovor <code>Cache-Control</code> direktive se odbijaju umjesto da se vraćaju na konfigurirane TTL-ove; <code>s-maxage</code> ima prioritet nad <code>max-age</code>."
r1712_mandatory_revalidation = "<code>must-revalidate</code>, <code>proxy-revalidate</code> i <code>s-maxage</code> zabranjuju ponovnu upotrebu ustajale nakon isteka svježine."
r1712_encrypted_cache_upgrade_note = "Napomena o nadogradnji šifrovane predmemorije"
r1712_encrypted_cache_upgrade_intro = "Fluxheim 1.7.12 premješta šifrirane objekte predmemorije diska u korijenske podatke i indeksne ključeve s trajnim jednokratnim stanjem. Prvo pokretanje na starijem šifrovanom root-u i svaka rotacija lokalnog ključa, namjerno hladno čisti taj keš prije opsluživanja prometa."
r1712_encrypted_cache_disposable = "Tretirajte šifrirani keš kao jednokratno ubrzanje, a ne izvor zapisa."
r1712_encrypted_cache_private_storage = "Dajte svakom korijenu keša trajnu privatnu pohranu i nemojte kopirati jednokratno stanje između nezavisnih korijena."
r1712_encrypted_cache_warmup = "Planirajte izvorni kapacitet za prvo zagrijavanje nakon nadogradnje ili rotiranja tipki."
r1712_client_certificate_revocation = "Opoziv certifikata klijenta"
r1712_client_certificate_revocation_intro = "Kada zajednički TLS mora odbiti opozvane klijentske certifikate, osigurajte ograničeni PEM CRL paket. Fluxheim potvrđuje kompletan lanac izdavatelja i odbija istekle ili nepotpune CRL politike."
r1712_client_certificate_revocation_compliance = "Zahtijevana provjera autentičnosti klijenta u FIPS ili ISO načinu usklađenosti koji zahtijeva također zahtijeva CRL paket. Obična provjera autentičnosti klijenta zadržava opoziv kao izričitu opt-in."
r1712_fips_backend_evidence = "FIPS backend dokaz"
r1712_fips_backend_evidence_intro = "Fluxheim obezbjeđuje zasebno pričvršćena CI okruženja dokaza za OpenSSL-FIPS i rustls/AWS-LC-FIPS profile. Oni izgrađuju i pokreću tačan binarni profil, vježbaju nizvodno i uzvodno verificiraju certifikate TLS, odbijaju nekompatibilnu politiku i snimaju kompajler, dobavljač, identitete zavisnosti, binarne i slike."
r1712_fips_backend_evidence_boundary = "Ovo je reproducibilan backend dokaz, a ne FIPS validacija na nivou proizvoda. Držite spremnike za dokaz odvojeno od normalnih slika izdanja i pregledajte dokaze za točnu verziju koju implementirate."
r1712_read_fips_evidence_guide = "Pročitajte FIPS vodič za dokaze"
r1712_loader_admission = "Kontrole učitavanja modula"
r1712_loader_admission_description = "Javni manifesti dodataka moraju sadržavati fiksni SHA-256 sažetak. U cijelom procesu istovremeno se mogu kompajlirati najviše dva modula. Kompajlirani izlaz podrazumijevano je ograničen na 32 MiB i ne može preći 256 MiB."
r1712_file_identity = "Identitet fajla"
r1712_file_identity_description = "Fluxheim otvara odobrene datoteke dodataka bez praćenja veza, zadržava validiranu regularnu datoteku i čita bajtove modula iz tog ručka bez ponovnog otvaranja putanje."
