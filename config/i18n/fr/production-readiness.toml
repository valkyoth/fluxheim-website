[[phrase]]
from = "The recommended container mode is rootless with host ports mapped to the container&#x27;s high internal listener ports. If a deployment deliberately runs the container as root for direct low-port binding, keep mounted config, content, certificate, cache, and runtime directories separate and permission them for the chosen runtime user."
to = "Le mode conteneur recommande est rootless, avec les ports hote mappes vers les ports listener internes eleves du conteneur. Si un deploiement execute volontairement le conteneur en root pour binder directement des ports bas, gardez les repertoires montes de config, contenu, certificats, cache et runtime separes et appliquez les permissions pour l'utilisateur runtime choisi."

[[phrase]]
from = "The recommended native package mode binds public ports directly. The packaged default config listens on <code>80</code>, and the systemd unit grants only <code>CAP_NET_BIND_SERVICE</code> so the service can also bind <code>443</code> when TLS is enabled without running Fluxheim as root."
to = "Le mode paquet natif recommande bind les ports publics directement. La config packagee par defaut ecoute sur <code>80</code>, et l'unit systemd n'accorde que <code>CAP_NET_BIND_SERVICE</code> pour que le service puisse aussi binder <code>443</code> quand TLS est active, sans executer Fluxheim en root."

