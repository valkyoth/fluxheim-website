[[phrase]]
from = "Accepted Limitations"
to = "Limites acceptees"

[[phrase]]
from = "Dependency-level"
to = "Au niveau dependance,"

[[phrase]]
from = "code in networking, TLS, OS, and runtime crates is not automatically a vulnerability. It is a review trigger."
to = "dans les crates reseau, TLS, OS et runtime n'est pas automatiquement une vulnerabilite. C'est un declencheur de review."

[[phrase]]
from = "result only means there is no known RustSec advisory for the resolved graph. It does not prove a crate is non-malicious."
to = "clean signifie seulement qu'il n'y a pas d'advisory RustSec connu pour le graphe resolu. Cela ne prouve pas qu'une crate est non malveillante."

[[phrase]]
from = "SBOM files improve traceability, but they do not prevent a malicious build."
to = "Les fichiers SBOM ameliorent la tracabilite, mais ils n'empechent pas un build malveillant."

[[phrase]]
from = "FIPS or ISO/IEC 19790 TLS mode constrains cryptographic providers and TLS configuration. It does not validate unrelated dependency behavior."
to = "Le mode TLS FIPS ou ISO/IEC 19790 contraint les providers cryptographiques et la configuration TLS. Il ne valide pas le comportement de dependances sans rapport."

[[phrase]]
from = "Review every new <code>build.rs</code>, procedural macro crate, <code>*-sys</code> crate, vendored C or assembly source, and native tool invocation."
to = "Examiner chaque nouveau <code>build.rs</code>, crate de macro procedurale, crate <code>*-sys</code>, source C ou assembleur vendoree, et invocation d'outil natif."

[[phrase]]
from = "Treat <code>.cargo/config.toml</code>, Cargo aliases, wrapper scripts, CI workflow changes, and release scripts as executable supply-chain changes."
to = "Traiter <code>.cargo/config.toml</code>, les alias Cargo, scripts wrapper, changements de workflow CI et scripts de release comme des changements supply-chain executables."

[[phrase]]
from = "Review the <code>Cargo.lock</code> diff before running the full test suite."
to = "Examiner le diff <code>Cargo.lock</code> avant d'executer la suite de tests complete."

[[phrase]]
from = "Run <code>cargo deny check</code>, <code>cargo deny check licenses</code>, and <code>cargo audit</code>."
to = "Executer <code>cargo deny check</code>, <code>cargo deny check licenses</code> et <code>cargo audit</code>."

[[phrase]]
from = "Update <code>SECURITY.md</code>, release notes, <code>deny.toml</code>, or <code>.cargo/audit.toml</code> when an advisory exception or license exception changes."
to = "Mettre a jour <code>SECURITY.md</code>, les release notes, <code>deny.toml</code> ou <code>.cargo/audit.toml</code> quand une exception d'advisory ou de licence change."

[[phrase]]
from = "Initialize a <code>supply-chain/</code> directory and commit the generated <code>config.toml</code>, <code>audits.toml</code>, and <code>imports.lock</code>."
to = "Initialiser un repertoire <code>supply-chain/</code> et committer les fichiers generes <code>config.toml</code>, <code>audits.toml</code> et <code>imports.lock</code>."

[[phrase]]
from = "Add <code>cargo vet</code> to CI after the initial policy is stable and false positives are understood."
to = "Ajouter <code>cargo vet</code> a la CI apres stabilisation de la policy initiale et comprehension des faux positifs."

[[phrase]]
from = "A clean <code>cargo audit</code> result only means there is no known RustSec advisory for the resolved graph. It does not prove a crate is non-malicious."
to = "Un resultat <code>cargo audit</code> propre signifie seulement qu'il n'y a pas d'advisory RustSec connu pour le graphe resolu. Cela ne prouve pas qu'une crate est non malveillante."
