locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Rust Supply-Chain Security"
to = "Securite supply-chain Rust"

[[phrase]]
from = "Fluxheim treats the Rust dependency graph as part of the trusted computing base. Rust's memory safety reduces classes of runtime bugs, but it does not protect against a compromised crate, a malicious build script, a procedural macro, a poisoned native dependency, or a maintainer account takeover."
to = "Fluxheim traite le graphe de dependances Rust comme une partie de la trusted computing base. La securite memoire de Rust reduit des classes de bugs runtime, mais elle ne protege pas contre une crate compromise, un build script malveillant, une macro procedurale, une dependance native empoisonnee ou une prise de controle de compte maintainer."

[[phrase]]
from = "This document defines the current supply-chain controls and the hardening roadmap for Fluxheim release work."
to = "Ce document definit les controles supply-chain actuels et la roadmap de durcissement pour le travail de release Fluxheim."

[[phrase]]
from = "Current Controls"
to = "Controles actuels"

[[phrase]]
from = "is committed and release builds use"
to = "est commite et les builds de release utilisent"

[[phrase]]
from = "denies unknown registries, unknown git sources, yanked crates, and unknown licenses by default."
to = "refuse par defaut les registres inconnus, sources git inconnues, crates yanked et licences inconnues."

[[phrase]]
from = "keeps RustSec advisory exceptions explicit and versioned."
to = "garde les exceptions d'advisory RustSec explicites et versionnees."

[[phrase]]
from = "GitHub CI runs formatting, clippy, tests, CodeQL,"
to = "GitHub CI execute formatage, clippy, tests, CodeQL,"

[[phrase]]
from = ", OWASP baseline checks, feature builds, and smoke tests."
to = ", checks baseline OWASP, builds de features et smoke tests."

[[phrase]]
from = "Stable releases generate SPDX and CycloneDX SBOMs from the tagged source tree."
to = "Les releases stables generent des SBOM SPDX et CycloneDX depuis l'arbre source tagge."

[[phrase]]
from = "Stable releases record source archive checksums, binary checksums, SBOM checksums, signed tag verification, container digests, and reproducible-build evidence."
to = "Les releases stables enregistrent les checksums d'archive source, checksums binaires, checksums SBOM, verification de tag signe, digests de conteneur et preuves de build reproductible."

[[phrase]]
from = "Build Scripts And Procedural Macros"
to = "Build scripts et macros procedurales"

[[phrase]]
from = "Cargo build scripts and procedural macros execute code on the build host. Treat them like native build tools, not like passive source files."
to = "Les build scripts Cargo et les macros procedurales executent du code sur l'hote de build. Traitez-les comme des outils de build natifs, pas comme des fichiers source passifs."

[[phrase]]
from = "Fluxheim does not rely on a global \"disable every dependency build script\" switch. Cargo supports overriding some build scripts for"
to = "Fluxheim ne s'appuie pas sur un interrupteur global \"disable every dependency build script\". Cargo supporte l'override de certains build scripts pour les"

[[phrase]]
from = "packages and a package can opt out of its own build script, but stable Cargo does not provide a single project-wide control that safely disables every transitive build script and procedural macro while preserving normal builds."
to = "packages et un package peut desactiver son propre build script, mais Cargo stable ne fournit pas un controle unique a l'echelle du projet qui desactive en securite chaque build script transitif et chaque macro procedurale tout en preservant les builds normaux."

[[phrase]]
from = "Required review for dependency changes:"
to = "Review requis pour les changements de dependances :"

[[phrase]]
from = ", procedural macro crate,"
to = ", crate de macro procedurale,"

[[phrase]]
from = "crate, vendored C or assembly source, and native tool invocation."
to = "crate, source C ou assembleur vendoree, et invocation d'outil natif."

[[phrase]]
from = "Check for environment variable reads, network access, file writes outside"
to = "Verifier les lectures de variables d'environnement, acces reseau, ecritures de fichiers hors"

[[phrase]]
from = ", generated code, compiler/linker wrapper use, and bundled binaries."
to = ", code genere, usage de wrapper compilateur/linker et binaires bundles."

[[phrase]]
from = "Prefer system-provided cryptographic modules for regulated profiles, such as OpenSSL FIPS provider deployments, over vendored native crypto unless the vendor module and build path are explicitly documented."
to = "Preferer les modules cryptographiques fournis par le systeme pour les profils reglementes, comme les deploiements provider OpenSSL FIPS, a la crypto native vendoree sauf si le module vendor et le chemin de build sont explicitement documentes."

[[phrase]]
from = "Do not build untrusted forks, unreviewed dependency branches, or experimental dependency updates in an environment that has release keys, production tokens, registry credentials, SSH agents, or cloud credentials."
to = "Ne construisez pas de forks non fiables, branches de dependances non reviewees ou updates de dependances experimentales dans un environnement qui contient des cles de release, tokens de production, credentials de registre, agents SSH ou credentials cloud."

[[phrase]]
from = "Dependency Update Workflow"
to = "Workflow de mise a jour des dependances"

[[phrase]]
from = "Use <code>cargo update</code> only as a deliberate dependency maintenance step."
to = "Utilisez <code>cargo update</code> uniquement comme etape volontaire de maintenance des dependances."

[[phrase]]
from = "For each update:"
to = "Pour chaque update :"

[[phrase]]
