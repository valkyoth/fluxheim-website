to = "Identifier les nouvelles crates, nouvelles versions majeures, nouveaux publishers, nouveaux build scripts, nouvelles proc macros et nouvelles dependances natives."

[[phrase]]
from = "Run the relevant feature builds and tests for the changed dependency area."
to = "Executer les builds de features et tests pertinents pour la zone de dependance changee."

[[phrase]]
from = ", release notes,"
to = ", release notes,"

[[phrase]]
