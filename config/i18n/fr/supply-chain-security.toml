to = "quand une exception d'advisory ou de licence change."

[[phrase]]
from = "Do not hide dependency churn inside unrelated feature commits."
to = "Ne cachez pas le churn de dependances dans des commits de feature sans rapport."

[[phrase]]
from = "Build Isolation"
to = "Isolation de build"

[[phrase]]
from = "Local development and CI should keep build environments low-trust by default:"
to = "Le developpement local et la CI doivent garder les environnements de build low-trust par defaut :"

[[phrase]]
from = "Use rootless containers or a restricted sandbox for dependency experiments, untrusted forks, and native build investigation."
to = "Utiliser des conteneurs rootless ou une sandbox restreinte pour les experiences de dependances, forks non fiables et investigations de build natif."

[[phrase]]
from = "Keep production secrets out of the shell used for"
to = "Garder les secrets de production hors du shell utilise pour"

[[phrase]]
from = ", and dependency tooling."
to = "et le tooling de dependances."

[[phrase]]
from = "Do not give pull-request workflows from external forks registry push credentials, release signing keys, or production service tokens."
to = "Ne donnez pas aux workflows de pull request depuis des forks externes des credentials de push registre, cles de signature de release ou tokens de service production."

[[phrase]]
from = "Keep image publishing and GitHub release publishing on maintainer-triggered workflows."
to = "Garder la publication d'images et la publication de releases GitHub sur des workflows declenches par les maintainers."

