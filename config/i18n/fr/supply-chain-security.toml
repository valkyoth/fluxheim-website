to = "; il ajoute une preuve de review humain pour le code qui n'a pas d'advisory connu."

[[phrase]]
from = "Embedded Binary Metadata Roadmap"
to = "Roadmap des metadonnees binaires embarquees"

[[phrase]]
from = "Fluxheim already publishes external SBOM files. A future release should evaluate"
to = "Fluxheim publie deja des fichiers SBOM externes. Une future release devrait evaluer"

[[phrase]]
