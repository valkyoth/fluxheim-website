locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = ": shared config, URL token parsing, expiry checks, and route enforcement."
to = " : configuration partagee, parsing de token d'URL, controles d'expiration et enforcement de route."

[[phrase]]
from = ": symmetric HMAC signing."
to = " : signature HMAC symetrique."

[[phrase]]
from = ": asymmetric public-key verification."
to = " : verification asymetrique par cle publique."

[[phrase]]
from = ": optional replay and usage accounting when a state backend is available."
to = " : replay et comptabilisation d'usage optionnels lorsqu'un backend d'etat est disponible."

[[phrase]]
from = "Replace weak legacy signing patterns with modern, reviewable cryptography."
to = "Remplacer les faibles modeles de signature legacy par une cryptographie moderne et revisable."

[[phrase]]
from = "Support stateless verification for high-volume static and media paths."
to = "Prendre en charge la verification stateless pour les chemins statiques et media a fort volume."

[[phrase]]
from = "Support asymmetric verification so Fluxheim can verify links without holding the private signing key."
to = "Prendre en charge la verification asymetrique afin que Fluxheim puisse verifier les liens sans detenir la cle de signature privee."

[[phrase]]
from = "Treat URL tokens as claims with expiry, audience, path, method, and optional entitlement constraints."
to = "Traiter les tokens d'URL comme des claims avec expiration, audience, chemin, methode et contraintes optionnelles d'entitlement."

[[phrase]]
from = "Avoid logging raw tokens, signatures, or entitlement claims."
to = "Eviter de journaliser les tokens bruts, signatures ou claims d'entitlement."

[[phrase]]
from = "Cryptography"
to = "Cryptographie"

[[phrase]]
from = "HMAC-SHA-256 or HMAC-SHA-384 for symmetric deployments;"
to = "HMAC-SHA-256 ou HMAC-SHA-384 pour les deploiements symetriques ;"

[[phrase]]
from = "Ed25519 for asymmetric deployments where application servers sign and Fluxheim verifies with public keys."
to = "Ed25519 pour les deploiements asymetriques ou les serveurs applicatifs signent et Fluxheim verifie avec des cles publiques."

[[phrase]]
from = "Future token formats may include compact JWT or PASETO-like claims, but the module should not accept arbitrary algorithms. Config must define an algorithm allow-list, key IDs, expiry requirements, maximum token size, and key rotation behavior."
to = "Les futurs formats de tokens peuvent inclure des claims JWT compacts ou proches de PASETO, mais le module ne doit pas accepter d'algorithmes arbitraires. La configuration doit definir une allow-list d'algorithmes, des IDs de cles, des exigences d'expiration, une taille maximale de token et le comportement de rotation des cles."

[[phrase]]
from = "Do not use weak digest-only constructions. A signature must cover at least:"
to = "Ne pas utiliser de constructions faibles fondees seulement sur un digest. Une signature doit couvrir au minimum :"

[[phrase]]
from = "normalized path;"
to = "chemin normalise ;"

[[phrase]]
from = "method when configured;"
to = "methode lorsqu'elle est configuree ;"

[[phrase]]
from = "expiry timestamp;"
to = "timestamp d'expiration ;"

[[phrase]]
from = "key ID or policy ID;"
to = "ID de cle ou ID de policy ;"

[[phrase]]
from = "optional audience/tenant/route constraints."
to = "contraintes optionnelles d'audience, tenant ou route."

[[phrase]]
from = "Claims"
to = "Claims"

[[phrase]]
from = "Secure-link claims should be typed and bounded:"
to = "Les claims secure-link doivent etre types et bornes :"

[[phrase]]
from = ": required expiry timestamp;"
to = " : timestamp d'expiration obligatoire ;"

[[phrase]]
from = ": optional not-before timestamp;"
to = " : timestamp not-before optionnel ;"

[[phrase]]
from = ": exact path or policy-approved path prefix;"
to = " : chemin exact ou prefixe de chemin approuve par la policy ;"

[[phrase]]
from = ": optional method allow-list;"
to = " : allow-list de methodes optionnelle ;"

[[phrase]]
from = ": optional vhost/route audience;"
to = " : audience vhost/route optionnelle ;"

[[phrase]]
from = ": optional user or account identifier;"
to = " : identifiant utilisateur ou compte optionnel ;"

[[phrase]]
from = ": optional entitlement tier;"
to = " : niveau d'entitlement optionnel ;"

[[phrase]]
from = ": optional token ID for replay controls;"
to = " : ID de token optionnel pour les controles anti-rejeu ;"

[[phrase]]
from = ": optional transfer budget when accounting exists."
to = " : budget de transfert optionnel lorsqu'une comptabilisation existe."

[[phrase]]
from = "Replay And Usage Controls"
to = "Controles anti-rejeu et d'usage"

[[phrase]]
from = "Replay prevention needs state. It should not be claimed in the stateless core."
to = "La prevention du rejeu necessite de l'etat. Elle ne doit pas etre revendiquee dans le coeur stateless."

[[phrase]]
from = "one-time token IDs;"
to = "IDs de tokens a usage unique ;"

[[phrase]]
from = "max uses per token;"
to = "nombre maximal d'usages par token ;"

[[phrase]]
from = "max distinct client identities per token;"
to = "nombre maximal d'identites client distinctes par token ;"

[[phrase]]
from = "max transferred bytes per token;"
to = "nombre maximal d'octets transferes par token ;"

[[phrase]]
from = "short-lived Bloom-filter style duplicate detection for media segments."
to = "detection de doublons courte duree de style filtre de Bloom pour les segments media."

[[phrase]]
from = "All stateful replay controls must define consistency semantics. In a cluster, operators must choose between local-only, eventual, or strict behavior."
to = "Tous les controles anti-rejeu avec etat doivent definir une semantique de coherence. Dans un cluster, les operateurs doivent choisir entre un comportement local-only, eventual ou strict."

[[phrase]]
from = "Client Binding"
to = "Liaison client"

[[phrase]]
from = "IP-only binding is fragile. If supported, it should be optional and tolerant:"
to = "La liaison uniquement par IP est fragile. Si elle est prise en charge, elle doit etre optionnelle et tolerante :"

[[phrase]]
from = "bind to an IP CIDR range rather than a single IP;"
to = "lier a une plage CIDR IP plutot qu'a une seule IP ;"

[[phrase]]
from = "support future identity or device-posture claims when identity modules exist;"
to = "prendre en charge de futurs claims d'identite ou de posture d'appareil lorsque les modules d'identite existent ;"

[[phrase]]
from = "avoid client binding entirely for privacy-mode deployments."
to = "eviter entierement la liaison client pour les deploiements en privacy-mode."

[[phrase]]
from = "TLS/session binding is future research and must not be promised until the selected Pingora/TLS backends expose enough safe metadata."
to = "La liaison TLS/session releve de recherches futures et ne doit pas etre promise tant que les backends Pingora/TLS selectionnes n'exposent pas assez de metadonnees sures."

[[phrase]]
from = "Never log raw secure-link tokens, signatures, or decoded claims by default."
to = "Ne jamais journaliser par defaut les tokens secure-link bruts, signatures ou claims decodes."

[[phrase]]
from = "Strip secure-link query parameters from access-log paths unless the operator explicitly disables redaction."
to = "Supprimer les parametres de query secure-link des chemins d'access-log sauf si l'operateur desactive explicitement la redaction."

[[phrase]]
from = "should reject replay/accounting features and may reject the whole module until token redaction and no-retention behavior are tested."
to = "doit rejeter les fonctionnalites de replay/accounting et peut rejeter tout le module jusqu'a ce que la redaction des tokens et le comportement sans retention soient testes."

[[phrase]]
from = "Valid signed URL allows access."
to = "Une URL signee valide autorise l'acces."

[[phrase]]
from = "Expired and not-yet-valid tokens deny access."
to = "Les tokens expires ou pas encore valides refusent l'acces."

[[phrase]]
from = "Wrong path, method, audience, or route denies access."
to = "Un mauvais chemin, methode, audience ou route refuse l'acces."

[[phrase]]
from = "Malformed and oversized tokens are rejected safely."
to = "Les tokens malformes et trop grands sont rejetes surement."

[[phrase]]
from = "Tokens are redacted from logs and error output."
to = "Les tokens sont redactes des logs et de la sortie d'erreur."

[[phrase]]
from = "Cache and media routes cannot leak personalized protected content."
to = "Les routes cache et media ne peuvent pas divulguer de contenu protege personnalise."
