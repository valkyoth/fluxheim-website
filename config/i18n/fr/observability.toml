locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Fluxheim supports Prometheus metrics, OpenTelemetry metrics and traces, and structured logging. All observability features are opt-in at compile time."
to = "Fluxheim prend en charge les métriques Prometheus, les métriques et traces OpenTelemetry, ainsi que les logs structurés. Toutes les fonctionnalités d'observabilité sont optionnelles à la compilation."

[[phrase]]
from = "Requires <code class=\"text-gray-400\">metrics</code> feature"
to = "Nécessite la fonctionnalité <code class=\"text-gray-400\">metrics</code>"

[[phrase]]
from = "Requires <code class=\"text-gray-400\">metrics-otlp</code>"
to = "Nécessite <code class=\"text-gray-400\">metrics-otlp</code>"

[[phrase]]
from = "Requires <code class=\"text-gray-400\">otel-tracing</code> + <code class=\"text-gray-400\">otel-otlp</code>"
to = "Nécessite <code class=\"text-gray-400\">otel-tracing</code> + <code class=\"text-gray-400\">otel-otlp</code>"

