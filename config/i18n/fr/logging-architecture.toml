[[phrase]]
from = "as the core instrumentation API."
to = "comme API d'instrumentation centrale."

[[phrase]]
from = "Emit production logs as JSON through serde-backed formatting."
to = "Émettre les logs de production en JSON via un formatage basé sur serde."

[[phrase]]
from = "Keep stdout available as the default sink for systemd, Podman, and local debugging."
to = "Conserver stdout comme sink par défaut pour systemd, Podman et le débogage local."

[[phrase]]
from = "Avoid disk or network writes on request worker hot paths."
to = "Éviter les écritures disque ou réseau sur les chemins critiques des workers de requêtes."

[[phrase]]
from = "Add remote logging only behind explicit config and optional compile features."
to = "Ajouter le logging distant uniquement derrière une configuration explicite et des fonctionnalités de compilation optionnelles."

[[phrase]]
from = "Make overflow behavior explicit instead of pretending logs are always both non-blocking and lossless."
to = "Rendre le comportement de débordement explicite au lieu de prétendre que les logs sont toujours non bloquants et sans perte."

