[[phrase]]
from = "The 1.6 line should start treating those as explicit versioned views with epochs and clear promotion rules. A candidate config should not become current state without validation evidence. Runtime mutations should record the policy epoch they were made under."
to = "La ligne 1.6 doit commencer a les traiter comme des vues versionnees explicites avec epochs et regles de promotion claires. Une config candidate ne doit pas devenir l'etat courant sans evidence de validation. Les mutations runtime doivent enregistrer la policy epoch sous laquelle elles ont ete faites."

[[phrase]]
from = "1.6 Adoption Plan"
to = "Plan d'adoption 1.6"

[[phrase]]
from = "should document the initial runtime fact kinds, policy-proof shape, redaction levels, and epoch terminology. It should not change request behavior."
to = "doit documenter les premiers types de runtime facts, la forme policy-proof, les niveaux de redaction et la terminologie d'epoch. Cela ne doit pas changer le comportement des requetes."

[[phrase]]
from = "Early 1.6 releases should introduce small types in a focused crate or"
to = "Les premieres releases 1.6 doivent introduire de petits types dans une crate ciblee ou"

[[phrase]]
from = "if the shape is still tiny."
to = "si la forme reste petite."

[[phrase]]
from = "The initial types are intentionally not wired into request handling yet. They exist so later 1.6 cutovers can migrate one decision path at a time without inventing new stringly-typed reasons."
to = "Les types initiaux ne sont volontairement pas encore cables dans le request handling. Ils existent pour que les cutovers 1.6 ulterieurs puissent migrer un chemin de decision a la fois sans inventer de nouvelles raisons stringly-typed."

[[phrase]]
from = "Mid 1.6 releases should route selected decision paths through proof objects while replacing Pingora boundaries:"
to = "Les releases 1.6 intermediaires doivent router certains chemins de decision via des objets de preuve tout en remplacant les frontieres Pingora :"

[[phrase]]
from = "route access policy;"
to = "policy d'acces route ;"

[[phrase]]
from = "GeoIP allow/deny behavior;"
to = "comportement GeoIP allow/deny ;"

[[phrase]]
