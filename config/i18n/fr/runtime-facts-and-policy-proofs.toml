[[phrase]]
from = "load-balancer backend selection/ejection;"
to = "selection/ejection de backend load balancer ;"

[[phrase]]
from = "admin runtime mutations."
to = "mutations runtime admin."

[[phrase]]
from = "adds the first native HTTP/1 proxy cutover summary to the server plan. That summary is an eligibility signal, not a traffic switch: the production runtime remains on the compatibility adapter until every configured proxy path either has native parity or is explicitly kept on the compatibility path with a bounded reason. Operators should treat"
to = "ajoute au plan serveur le premier resume de cutover proxy HTTP/1 natif. Ce resume est un signal d'eligibilite, pas un basculement de trafic : le runtime de production reste sur l'adaptateur de compatibilite jusqu'a ce que chaque chemin proxy configure ait soit une parite native, soit soit explicitement maintenu sur le chemin de compatibilite avec une raison bornee. Les operateurs doivent traiter"

[[phrase]]
from = "as rollout evidence for the Pingora-exit line rather than as an active runtime adapter claim."
to = "comme evidence de rollout pour la ligne de sortie Pingora plutot que comme affirmation d'adaptateur runtime actif."

[[phrase]]
from = "adds the broader native runtime cutover summary. It reports remaining blockers such as native HTTP/1 proxy parity, native HTTP/2 downstream parity, admin, metrics, stream, and UDP service adapters. This is still diagnostic evidence only; it does not change the active runtime adapter."
to = "ajoute le resume de cutover runtime natif plus large. Il signale les bloqueurs restants comme la parite proxy HTTP/1 native, la parite downstream HTTP/2 native, admin, metrics, stream et adaptateurs de service UDP. Cela reste seulement de l'evidence diagnostique ; cela ne change pas l'adaptateur runtime actif."

[[phrase]]
from = "Later 1.6 releases may add a bounded in-memory fact ring for admin diagnostics. The ring must be optional, fixed-size, redacted by type, and safe to disable. It must never be required for request forwarding."
to = "Les releases 1.6 ulterieures peuvent ajouter un fact ring en memoire borne pour les diagnostics admin. L'anneau doit etre optionnel, de taille fixe, redige par type et desactivable en securite. Il ne doit jamais etre requis pour le forwarding des requetes."

[[phrase]]
from = "Security Rules"
to = "Regles de securite"

[[phrase]]
from = "Runtime facts do not create authority."
to = "Les runtime facts ne creent pas d'autorite."

[[phrase]]
from = "Policy proofs are deterministic and bounded."
to = "Les policy proofs sont deterministes et bornes."

[[phrase]]
from = "Sensitive identifiers are redacted at type boundaries, not manually at each log site."
to = "Les identifiants sensibles sont rediges aux frontieres de type, pas manuellement a chaque site de log."

[[phrase]]
from = "Metrics stay low-cardinality."
to = "Les metriques restent a faible cardinalite."

[[phrase]]
from = "Admin views expose bounded reasons, not raw secrets or private addresses in privacy-mode builds."
to = "Les vues admin exposent des raisons bornees, pas des secrets bruts ni des adresses privees dans les builds privacy-mode."

[[phrase]]
from = "AI or Wasm consumers may only receive facts explicitly granted by policy."
to = "Les consommateurs IA ou Wasm ne peuvent recevoir que les facts explicitement accordes par policy."

[[phrase]]
from = "Derived or advisory facts are never authoritative unless promoted through a deterministic path."
to = "Les facts derives ou consultatifs ne sont jamais autoritatifs sauf s'ils sont promus via un chemin deterministe."

[[phrase]]
from = "If fact collection fails, request handling must keep its configured fail-open/fail-closed behavior and record only a bounded diagnostic if safe."
to = "Si la collecte de facts echoue, le request handling doit conserver son comportement fail-open/fail-closed configure et enregistrer seulement un diagnostic borne si c'est sur."

[[phrase]]
from = "Why This Matters"
to = "Pourquoi c'est important"

[[phrase]]
from = "Fluxheim has grown beyond a simple proxy. It now has cache, load balancing, admin mutation, snapshots, ACME, stream/UDP work, metrics, traces, and future Wasm/WAF/HTTP3 plans. A typed runtime-fact model lets operators and reviewers ask:"
to = "Fluxheim a grandi au-dela d'un simple proxy. Il a maintenant cache, load balancing, mutation admin, snapshots, ACME, travail stream/UDP, metriques, traces et futurs plans Wasm/WAF/HTTP3. Un modele type de runtime facts permet aux operateurs et reviewers de demander :"

[[phrase]]
from = "why was this request denied?"
to = "pourquoi cette requete a-t-elle ete refusee ?"

[[phrase]]
from = "why did this backend stop receiving traffic?"
to = "pourquoi ce backend a-t-il cesse de recevoir du trafic ?"

[[phrase]]
from = "why was this object not cached?"
to = "pourquoi cet objet n'a-t-il pas ete mis en cache ?"

[[phrase]]
from = "which config epoch made this decision?"
to = "quelle config epoch a pris cette decision ?"

[[phrase]]
from = "which admin action changed this pool?"
to = "quelle action admin a modifie ce pool ?"

[[phrase]]
from = "which facts are safe to export?"
to = "quels facts peuvent etre exportes en securite ?"

[[phrase]]
from = "That makes Fluxheim more self-aware and makes pentest review more local, without turning the proxy into a database."
to = "Cela rend Fluxheim plus conscient de lui-meme et rend la revue pentest plus locale, sans transformer le proxy en base de donnees."
