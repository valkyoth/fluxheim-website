[[phrase]]
from = "Runtime Facts And Policy Proofs"
to = "Runtime Facts et Policy Proofs"

[[phrase]]
from = "Fluxheim should understand its own runtime decisions without becoming a database. The goal is a small, typed, bounded model for operational evidence: what happened, which policy made the decision, and which public/redacted reason can be shown to an operator."
to = "Fluxheim doit comprendre ses propres decisions runtime sans devenir une base de donnees. L'objectif est un modele petit, type et borne pour l'evidence operationnelle : ce qui s'est passe, quelle policy a pris la decision et quelle raison publique ou redigee peut etre montree a un operateur."

[[phrase]]
from = "This is inspired by two internal design patterns:"
to = "Ceci s'inspire de deux modeles de conception internes :"

[[phrase]]
from = "Aesynx: no ambient authority, typed handles, explicit capability movement, bounded telemetry, fail-closed admission gates."
to = "Aesynx : pas d'ambient authority, handles types, mouvement explicite de capabilities, telemetry bornee, admission gates fail-closed."

[[phrase]]
from = "Skrifheim: canonical facts, worlds, policy decisions, redacted debug output, and deterministic proof objects."
to = "Skrifheim : facts canoniques, worlds, decisions de policy, sortie debug redigee et objets de preuve deterministes."

[[phrase]]
from = "Fluxheim should adopt the discipline, not the database engine."
to = "Fluxheim doit adopter la discipline, pas le moteur de base de donnees."

[[phrase]]
from = "Non-Goals"
to = "Non-objectifs"

[[phrase]]
from = "This work must not put a database, graph engine, AI system, or unbounded audit store in the request hot path."
to = "Ce travail ne doit pas placer une base de donnees, un moteur de graphes, un systeme IA ou un audit store non borne dans le hot path des requetes."

[[phrase]]
from = "Runtime facts are not a replacement for logs, metrics, traces, or admin status. They are a typed internal shape that those systems can export safely."
to = "Les runtime facts ne remplacent pas les logs, metriques, traces ou le statut admin. Ils sont une forme interne typee que ces systemes peuvent exporter en securite."

