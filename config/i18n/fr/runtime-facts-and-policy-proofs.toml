[[phrase]]
from = "Security-relevant decisions should move toward small proof objects:"
to = "Les decisions liees a la securite doivent evoluer vers de petits objets de preuve :"

[[phrase]]
from = "The proof is not verbose per-request logging. It is a typed result that keeps policy decisions consistent across access control, cache admission, load-balancer selection, admin mutation, auth-request, GeoIP, rate limiting, Wasm hooks, and future WAF behavior."
to = "La preuve n'est pas du logging verbeux par requete. C'est un resultat type qui garde les decisions de policy coherentes entre controle d'acces, admission cache, selection load balancer, mutation admin, auth-request, GeoIP, rate limiting, hooks Wasm et futur comportement WAF."

