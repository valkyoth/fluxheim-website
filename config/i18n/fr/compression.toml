[[phrase]]
from = "Compression remains opt-in. Default builds do not include compression code, and <code>privacy-mode</code> builds reject compression at compile time because response-body transforms can create side-channel and retention risks."
to = "La compression reste opt-in. Les builds par defaut n'incluent pas le code de compression, et les builds <code>privacy-mode</code> rejettent la compression a la compilation, car les transformations de body de reponse peuvent creer des risques de canal auxiliaire et de retention."

