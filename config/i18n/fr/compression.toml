[[phrase]]
from = "<p>Fluxheim negotiates response compression from <code>Accept-Encoding</code> when <code>compression.enabled = true</code> and the binary is built with at least one codec feature. Gzip is available through <code>compression-gzip</code>, Zstandard through <code>compression-zstd</code>, and Brotli through <code>compression-brotli</code>. <code>q=0</code> is respected for each coding. When multiple accepted codings are enabled, Fluxheim prefers <code>br</code>, then <code>zstd</code>, then <code>gzip</code>.</p>"
to = "<p>Fluxheim negocie la compression de reponse depuis <code>Accept-Encoding</code> lorsque <code>compression.enabled = true</code> et que le binaire est construit avec au moins une feature de codec. Gzip est disponible via <code>compression-gzip</code>, Zstandard via <code>compression-zstd</code> et Brotli via <code>compression-brotli</code>. <code>q=0</code> est respecte pour chaque codage. Lorsque plusieurs codages acceptes sont actives, Fluxheim prefere <code>br</code>, puis <code>zstd</code>, puis <code>gzip</code>.</p>"

[[phrase]]
from = "<li>Negotiates <code>br</code>, <code>zstd</code>, <code>gzip</code>, and identity correctly for compiled codecs.</li>"
to = "<li>Negocie correctement <code>br</code>, <code>zstd</code>, <code>gzip</code> et identity pour les codecs compiles.</li>"
