[[phrase]]
from = "Pingora-exit continuation that shrinks the root compatibility surface and splits native health checks into HTTP/gRPC, database, exec, and TCP/TLS transport helpers with stronger probe bounds."
to = "Continuation de sortie de Pingora qui réduit la surface de compatibilité racine et sépare les health checks natifs en helpers de transport HTTP/gRPC, base de données, exec et TCP/TLS avec des bornes de probe renforcées."

[[phrase]]
from = "Native HTTP/2 upstream client primitive with bounded headers, bodies, trailers, request/response deadlines, and h2 tests for trailer, reset, size, and flow-control behavior."
to = "Primitive client upstream HTTP/2 native avec headers, corps, trailers, deadlines requête/réponse bornés et tests h2 pour trailers, reset, taille et comportement flow-control."

[[phrase]]
from = "Native HTTP/1.1 upstream pooling release with bounded keepalive reuse, pool-size config, upstream idle timeout handling, conservative no-reuse guards, and real socket reuse/expiry tests."
to = "Version de pooling upstream HTTP/1.1 natif avec réutilisation keepalive bornée, configuration de taille de pool, gestion du timeout idle upstream, gardes no-reuse conservatrices et vrais tests de réutilisation/expiration de sockets."

[[phrase]]
from = "Native HTTP/2 hardening release with reusable h2 connection primitives, response trailers, response-write lifetime, handler timeout, bounded DATA capacity, prohibited header/trailer rejection, and request-body zeroization."
to = "Version de durcissement HTTP/2 natif avec primitives de connexion h2 réutilisables, trailers de réponse, durée de vie response-write, timeout de handler, capacité DATA bornée, rejet des headers/trailers interdits et zeroization du corps de requête."

[[phrase]]
from = "Native HTTP/2 preview gate with bounded header/body/stream/frame/send-buffer policy, h2 stack probe tests, and native HTTP/1.0 socket behavior coverage."
to = "Gate de preview HTTP/2 natif avec policy bornée de header/corps/stream/frame/send-buffer, tests de probe de stack h2 et couverture du comportement socket HTTP/1.0 natif."

[[phrase]]
from = "Native HTTP/1 protocol foundation with bounded request-head parsing, body-framing classification, Host validation, persistence classification, chunked decoding, and response-head parsing."
to = "Fondation du protocole HTTP/1 natif avec parsing request-head borné, classification du framing de corps, validation Host, classification de persistance, décodage chunked et parsing response-head."

