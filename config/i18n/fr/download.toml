to = "Build load-balancer HTTP/TCP ciblé sans cache, web statique, PHP, GeoIP, proxy de flux ni miroir de trafic."

[[phrase]]
from = "Static web + reverse proxy + PHP-FPM FastCGI bridge. Ideal for WordPress and PHP front-controller apps. No cache module compiled."
