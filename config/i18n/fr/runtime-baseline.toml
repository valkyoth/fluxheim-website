[[phrase]]
from = "<p>That gate fails when a Pingora crate is present without an exception, when an exception is stale, or when the current Fluxheim version has reached the exception&#x27;s <code>removal_target</code>. <code>cargo test</code> also runs <code>tests/pingora_dependency_policy.rs</code>, which checks the same removal targets against <code>Cargo.lock</code> so deadline drift is visible outside the release gate. Maintainers can test an upcoming release bump before editing <code>Cargo.toml</code> with:</p>"
to = "<p>Ce gate echoue lorsqu'un crate Pingora est present sans exception, lorsqu'une exception est perimee ou lorsque la version Fluxheim actuelle a atteint le <code>removal_target</code> de l'exception. <code>cargo test</code> execute aussi <code>tests/pingora_dependency_policy.rs</code>, qui verifie les memes cibles de retrait contre <code>Cargo.lock</code> afin que la derive de deadline soit visible hors du release gate. Les mainteneurs peuvent tester un prochain bump de release avant de modifier <code>Cargo.toml</code> avec :</p>"

