[[phrase]]
from = "Fluxheim resolves direct proxy upstream names when selecting an upstream peer for a request. If a Podman DNS name is temporarily missing, Fluxheim returns an upstream failure for that request instead of panicking the worker. Keep Fluxheim and its upstream containers on the same user-defined network, and avoid using load-balancer pools for container names that are expected to appear only after Fluxheim has already started until dynamic pool re-resolution is promoted to a stable feature."
to = "Fluxheim resout les noms upstream de proxy direct lors de la selection d'un peer upstream pour une requete. Si un nom DNS Podman manque temporairement, Fluxheim retourne un echec upstream pour cette requete au lieu de faire paniquer le worker. Gardez Fluxheim et ses conteneurs upstream sur le meme reseau user-defined, et evitez les pools load-balancer pour des noms de conteneurs censes apparaitre seulement apres le demarrage de Fluxheim jusqu'a ce que la re-resolution dynamique des pools soit promue en fonctionnalite stable."

