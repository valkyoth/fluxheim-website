[[phrase]]
from = "Image processing is dangerous without hard limits because small compressed files can decode into very large pixel buffers."
to = "Le traitement d'image est dangereux sans limites strictes, car de petits fichiers compresses peuvent se decoder en tres grands buffers de pixels."

[[phrase]]
