[[phrase]]
from = "Security Requirements"
to = "Exigences de securite"

[[phrase]]
from = "The module is disabled by default at compile time and runtime."
to = "Le module est desactive par defaut a la compilation et a l'execution."

[[phrase]]
from = "Transform policy must be explicit per vhost or route."
to = "La policy de transformation doit etre explicite par vhost ou par route."

[[phrase]]
from = "Only configured content types and extensions are eligible."
to = "Seuls les types de contenu et extensions configures sont eligibles."

[[phrase]]
from = "Do not transform untrusted arbitrary binary responses."
to = "Ne pas transformer des reponses binaires arbitraires non fiables."

[[phrase]]
from = "Do not process images from admin, metrics, ACME, CGI, PHP, or legacy listeners."
to = "Ne pas traiter d'images provenant des listeners admin, metrics, ACME, CGI, PHP ou legacy."

[[phrase]]
from = "Reject oversized metadata, malformed files, decoder errors, and unsupported formats with 415 Unsupported Media Type or a configured safe error."
to = "Refuser les metadonnees trop grandes, fichiers malformes, erreurs de decodeur et formats non pris en charge avec 415 Unsupported Media Type ou une erreur sure configuree."

[[phrase]]
from = "Strip EXIF/GPS/comment metadata by default."
to = "Supprimer les metadonnees EXIF/GPS/commentaires par defaut."

[[phrase]]
from = "Do not log raw image bytes or full source URLs with sensitive queries."
to = "Ne pas journaliser les octets image bruts ni les URL source completes avec des queries sensibles."

[[phrase]]
from = "Codec dependencies require license and advisory review before enabling the module in release builds."
to = "Les dependances de codecs exigent une revue licence et advisory avant d'activer le module dans les builds de release."

[[phrase]]
from = "FFI-backed codecs must be behind separate feature flags and never included in default builds."
to = "Les codecs adosses a FFI doivent rester derriere des feature flags separes et ne jamais etre inclus dans les builds par defaut."

