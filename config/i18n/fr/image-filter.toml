to = "limite globale de transformations concurrentes;"

[[phrase]]
from = "transform timeout."
to = "timeout de transformation."

[[phrase]]
from = "All limits must be enforced before decoding where possible and immediately after header parsing when dimensions are known. If dimensions are not known without a full decode, the request should use the stricter input-byte and timeout limits."
to = "Toutes les limites doivent etre appliquees avant le decodage lorsque c'est possible et immediatement apres le parsing des headers lorsque les dimensions sont connues. Si les dimensions ne sont pas connues sans decodage complet, la requete doit utiliser les limites d'octets d'entree et de timeout les plus strictes."

