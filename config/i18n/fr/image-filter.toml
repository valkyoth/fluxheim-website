[[phrase]]
from = "Planned Cargo feature: image-filter."
to = "Feature Cargo prevue: image-filter."

[[phrase]]
from = "This module adds safe, bounded image validation and transformation at the edge. It is intended for small static sites, media-heavy origins, and cache-backed deployments that want predictable image variants without adding a separate image service."
to = "Ce module ajoute une validation et une transformation d'image sures et bornees a l'edge. Il vise les petits sites statiques, les origins riches en medias et les deploiements avec cache qui veulent des variantes d'image previsibles sans ajouter un service d'image separe."

[[phrase]]
from = "Design Goals"
to = "Objectifs de conception"

[[phrase]]
from = "Keep image transformation code out of the default binary."
to = "Garder le code de transformation d'image hors du binaire par defaut."

[[phrase]]
from = "Enable per-vhost and per-route policies."
to = "Permettre des policies par vhost et par route."

[[phrase]]
from = "Support static files and proxied origin responses."
to = "Prendre en charge les fichiers statiques et les reponses d'origin proxifiees."

[[phrase]]
from = "Transform only explicitly allowed image content types."
to = "Transformer uniquement les types de contenu image explicitement autorises."

[[phrase]]
from = "Bound input bytes, decoded pixels, output bytes, CPU time, and concurrency."
to = "Borner les octets d'entree, les pixels decodes, les octets de sortie, le temps CPU et la concurrence."

[[phrase]]
from = "Integrate with cache keys so transformed variants are isolated and purgeable."
to = "S'integrer aux cles de cache afin que les variantes transformees soient isolees et purgeables."

[[phrase]]
from = "Prefer memory-safe Rust codecs where practical."
to = "Preferer des codecs Rust memory-safe lorsque c'est pratique."

