locale_id = "fr-FR"
html_lang = "fr-FR"
[[phrase]]
from = "Extraction Dependency Graph — Fluxheim Source Docs"
to = "Graphe de dependances d'extraction - documentation source Fluxheim"
[[phrase]]
from = "Extraction Dependency Graph"
to = "Graphe de dependances d'extraction"
[[phrase]]
from = "Pingora-exit planning baseline"
to = "baseline de planification de sortie Pingora"
[[phrase]]
from = "Fluxheim should split large modules by dependency direction, not by line count alone. The root crate should keep orchestration and adapters while pure domain logic moves into focused crates that can be tested without the current Pingora runtime."
to = "Fluxheim devrait decouper les gros modules selon la direction des dependances, pas seulement selon le nombre de lignes. Le crate racine devrait garder l'orchestration et les adaptateurs, tandis que la logique domaine pure migre vers des crates focalises qui peuvent etre testes sans le runtime Pingora actuel."
[[phrase]]
from = "Dependency Direction"
to = "Direction des dependances"
[[phrase]]
from = "Target dependency direction:"
to = "Direction cible des dependances :"
[[phrase]]
from = "The root crate may temporarily adapt Pingora request, response, listener, cache, and service types. Domain crates should not depend on those adapters."
to = "Le crate racine peut temporairement adapter les types Pingora de requete, reponse, listener, cache et service. Les crates domaine ne devraient pas dependre de ces adaptateurs."
[[phrase]]
from = "Extraction Order"
to = "Ordre d'extraction"
[[phrase]]
from = "Current area"
to = "Zone actuelle"
[[phrase]]
from = "Target boundary"
to = "Frontiere cible"
[[phrase]]
from = "Why this order"
to = "Pourquoi cet ordre"
[[phrase]]
from = "Mostly filesystem/config snapshot policy; already has a crate and should keep shrinking root admin/runtime coupling."
to = "Principalement une policy de snapshot filesystem/config ; possede deja un crate et devrait continuer a reduire le couplage admin/runtime racine."
[[phrase]]
from = "Pure framing plus the current Pingora L4 connector adapter; split protocol bytes before stream/server replacement."
to = "Framing pur plus l'adaptateur actuel de connecteur Pingora L4 ; separer les octets de protocole avant le remplacement stream/server."
[[phrase]]
from = "Pure parsing/export formatting can move before HTTP runtime changes."
to = "Le parsing pur et le formatage d'export peuvent migrer avant les changements du runtime HTTP."
[[phrase]]
from = "Security-sensitive but mostly request/response policy; extract pure rules before replacing Pingora HTTP types."
to = "Sensible pour la securite mais surtout policy requete/reponse ; extraire les regles pures avant de remplacer les types HTTP Pingora."
[[phrase]]
from = "listener/provider policy"
to = "policy listener/provider"
[[phrase]]
from = "Own downstream listener planning, certificate selection, SNI matching, ALPN/cipher policy, and TLS provider/FIPS checks before replacing the Pingora listener adapter."
to = "Posseder la planification des listeners downstream, la selection de certificats, le matching SNI, la policy ALPN/cipher et les checks provider TLS/FIPS avant de remplacer l'adaptateur listener Pingora."
[[phrase]]
from = "Large filesystem/TLS/runtime integration surface; extract after listener/TLS boundary traits exist."
to = "Grande surface d'integration filesystem/TLS/runtime ; extraire apres l'existence des traits de frontiere listener/TLS."
[[phrase]]
from = "Own task, shutdown, listener, TLS, and server bootstrap abstractions before removing Pingora server services."
to = "Posseder les abstractions task, shutdown, listener, TLS et bootstrap serveur avant de retirer les services serveur Pingora."
[[phrase]]
from = "Continue moving admission, keys, headers, storage plans, and purge logic; keep only Pingora cache adapters in root until HTTP proxy cutover."
to = "Continuer a deplacer admission, cles, headers, plans de stockage et logique de purge ; ne garder dans la racine que les adaptateurs de cache Pingora jusqu'au cutover du proxy HTTP."
[[phrase]]
from = "Last large HTTP cutover; depends on config, protocol, headers, cache, PHP, observability, auth, mirror, compression, TLS, and server boundaries."
to = "Dernier grand cutover HTTP ; depend des frontieres config, protocole, headers, cache, PHP, observabilite, auth, mirror, compression, TLS et serveur."
[[phrase]]
from = "Depends on nearly every domain. Split after domain crates own status DTOs and mutation APIs."
to = "Depend de presque tous les domaines. Decouper apres que les crates domaine possedent leurs DTOs de statut et APIs de mutation."
[[phrase]]
from = "1.6 Rules"
to = "Regles 1.6"
[[phrase]]
from = "Do not create a crate that depends back on the root"
to = "Ne pas creer de crate qui depende en retour du crate racine"
[[phrase]]
from = "Prefer pure request/response view traits over concrete Pingora request headers in domain crates."
to = "Preferer des traits purs de vue request/response aux headers de requete Pingora concrets dans les crates domaine."
[[phrase]]
from = "Keep temporary Pingora adapters narrow and named as adapters."
to = "Garder les adaptateurs Pingora temporaires etroits et nommes comme adaptateurs."
[[phrase]]
from = "When moving code, move tests with the owned logic rather than leaving all private behavior tests in root modules."
to = "Lors du deplacement de code, deplacer les tests avec la logique possedee au lieu de laisser tous les tests de comportement prive dans les modules racine."
[[phrase]]
from = "If a moved file would exceed 500 lines, split it during extraction instead of creating a new oversized exception."
to = "Si un fichier deplace depasserait 500 lignes, le decouper pendant l'extraction au lieu de creer une nouvelle exception surdimensionnee."
[[phrase]]
from = "Review Use"
to = "Usage en review"
[[phrase]]
from = "Pentest and SAST reviews should use this graph to scope findings:"
to = "Les reviews pentest et SAST devraient utiliser ce graphe pour cadrer les findings :"
[[phrase]]
from = "pure parser or policy bug: fix in the domain crate;"
to = "bug pur de parser ou de policy : corriger dans le crate domaine ;"
[[phrase]]
from = "adapter bug: fix in the root adapter and add a domain-crate regression where possible;"
to = "bug d'adaptateur : corriger dans l'adaptateur racine et ajouter si possible une regression dans le crate domaine ;"
[[phrase]]
from = "runtime lifecycle bug: fix through"
to = "bug de lifecycle runtime : corriger via les abstractions"
[[phrase]]
from = "abstractions before touching HTTP proxy orchestration;"
to = "avant de toucher a l'orchestration du proxy HTTP ;"
[[phrase]]
from = "broad proxy lifecycle bug: keep it in the"
to = "bug large de lifecycle proxy : le garder dans la queue"
[[phrase]]
from = "HTTP cutover queue unless it is a release-blocking security fix."
to = "du cutover HTTP sauf s'il s'agit d'un fix de securite bloquant la release."
