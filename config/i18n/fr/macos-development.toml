[[phrase]]
from = "targets Level 1 macOS support: contributors should be able to build and run local development profiles on Apple Silicon Macs. This is not a production macOS support claim."
to = "vise le support macOS de niveau 1 : les contributeurs doivent pouvoir construire et executer des profils de developpement locaux sur des Macs Apple Silicon. Ce n'est pas une promesse de support macOS en production."

[[phrase]]
from = "Linux remains the production baseline for native packages, systemd units, containers, FIPS/ISO evidence, and release-gate parity. macOS support is for local development, site testing, and contributor workflows while Pingora macOS support remains experimental."
to = "Linux reste la baseline de production pour les packages natifs, units systemd, conteneurs, preuves FIPS/ISO et parite de release gate. Le support macOS concerne le developpement local, les tests du site et les workflows contributeur, tandis que le support macOS de Pingora reste experimental."

