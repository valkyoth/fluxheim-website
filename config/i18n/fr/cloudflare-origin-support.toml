locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Cloudflare Origin Support"
to = "Prise en charge de Cloudflare Origin"

[[phrase]]
from = "No Cloudflare module should be compiled into the default binary."
to = "Aucun module Cloudflare ne doit etre compile dans le binaire par defaut."

[[phrase]]
from = "Restore the real visitor IP only for verified Cloudflare-originated requests."
to = "Restaurer l'IP reelle du visiteur uniquement pour les requetes verifiees provenant de Cloudflare."

[[phrase]]
from = "Correlate access logs with Cloudflare Ray IDs."
to = "Correler les journaux d'acces avec les IDs Cloudflare Ray."

[[phrase]]
from = "Support Cloudflare IP range refresh without downtime."
to = "Prendre en charge le rafraichissement des plages IP Cloudflare sans interruption."

[[phrase]]
from = "Support Cloudflare Origin CA certificate issuance as an optional automation."
to = "Prendre en charge l'emission de certificats Cloudflare Origin CA comme automatisation optionnelle."

[[phrase]]
from = "Support Authenticated Origin Pulls as an optional mTLS hardening layer."
to = "Prendre en charge Authenticated Origin Pulls comme couche optionnelle de durcissement mTLS."

[[phrase]]
from = "Keep Cloudflare credentials out of config snapshots and logs."
to = "Garder les identifiants Cloudflare hors des snapshots de configuration et des journaux."

[[phrase]]
from = "No dependency on Cloudflare in default builds."
to = "Aucune dependance a Cloudflare dans les builds par defaut."

[[phrase]]
from = "No automatic mutation of Cloudflare zone settings in the MVP."
to = "Aucune modification automatique des parametres de zone Cloudflare dans le MVP."

[[phrase]]
from = "No promise that Cloudflare global AOP proves the user's specific account."
to = "Aucune promesse que l'AOP global de Cloudflare prouve le compte specifique de l'utilisateur."

[[phrase]]
from = "No replacement for normal ACME/own-certificate support."
to = "Aucun remplacement de la prise en charge ACME normale ou des certificats propres."

[[phrase]]
from = "Reviewed crate candidates as of 2026-05-05:"
to = "Crates candidates examinees au 2026-05-05 :"

[[phrase]]
