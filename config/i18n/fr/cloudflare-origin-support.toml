to = ", BSD-3-Clause : bibliotheque Rust pour l'API Cloudflare v4. Configurer avec"

[[phrase]]
from = "if used so it follows Fluxheim's default TLS direction."
to = "si elle est utilisee afin de suivre l'orientation TLS par defaut de Fluxheim."

[[phrase]]
from = ", MIT/Apache-2.0: local CSR/private-key generation."
to = ", MIT/Apache-2.0 : generation locale de CSR et de cle privee."

[[phrase]]
from = ", MIT/Apache-2.0: CIDR parsing and membership checks."
to = ", MIT/Apache-2.0 : parsing CIDR et controles d'appartenance."

[[phrase]]
from = ", MIT/Apache-2.0: atomic replacement of trusted IP range snapshots or certificate state."
to = ", MIT/Apache-2.0 : remplacement atomique des snapshots de plages IP de confiance ou de l'etat de certificat."

[[phrase]]
from = "Trust Boundary"
to = "Frontiere de confiance"

[[phrase]]
from = "Cloudflare request headers are trusted only when at least one configured trust condition succeeds:"
to = "Les en-tetes de requete Cloudflare ne sont fiables que lorsqu'au moins une condition de confiance configuree reussit :"

[[phrase]]
from = "the direct peer socket IP is in the validated Cloudflare IP range set;"
to = "l'IP socket du pair direct est dans l'ensemble valide de plages IP Cloudflare ;"

[[phrase]]
from = "Authenticated Origin Pulls mTLS verification succeeded;"
to = "la verification mTLS Authenticated Origin Pulls a reussi ;"

[[phrase]]
from = "a future explicit trusted listener is configured for private Cloudflare tunnel traffic."
to = "un futur listener explicitement de confiance est configure pour le trafic de tunnel Cloudflare prive."

[[phrase]]
from = "If none of those conditions succeeds, Fluxheim must treat"
to = "Si aucune de ces conditions ne reussit, Fluxheim doit traiter"

[[phrase]]
from = ", and related headers as untrusted remote input."
to = "et les en-tetes associes comme des entrees distantes non fiables."

[[phrase]]
from = "The direct peer IP should remain available in logs as"
to = "L'IP du pair direct doit rester disponible dans les journaux comme"

[[phrase]]
from = "The restored client IP should be stored separately as"
to = "L'IP client restauree doit etre stockee separement comme"

[[phrase]]
from = "so operators can audit whether traffic is actually coming through Cloudflare."
to = "afin que les operateurs puissent verifier si le trafic passe reellement par Cloudflare."

[[phrase]]
from = "Header Handling"
to = "Traitement des en-tetes"

[[phrase]]
from = "Accepted headers after trust validation:"
to = "En-tetes acceptes apres validation de confiance :"

[[phrase]]
from = ": visitor IP to use for logs, WAF/rate-limit decisions, and admin visibility."
to = " : IP visiteur a utiliser pour les journaux, les decisions WAF/rate-limit et la visibilite admin."

[[phrase]]
from = ": request correlation ID for structured logs and optional response echoing."
to = " : ID de correlation de requete pour les journaux structures et l'echo optionnel en reponse."

[[phrase]]
from = ": coarse country signal for logs/metrics after cardinality controls."
to = " : signal de pays grossier pour journaux/metriques apres controles de cardinalite."

[[phrase]]
from = ": optional scheme metadata, parsed strictly as JSON if needed."
to = " : metadonnees optionnelles de schema, parsees strictement en JSON si necessaire."

[[phrase]]
from = ": optional context fields, never security authorities."
to = " : champs de contexte optionnels, jamais autorites de securite."

[[phrase]]
from = "Reject or ignore malformed IP values."
to = "Rejeter ou ignorer les valeurs IP mal formees."

[[phrase]]
from = "Never let untrusted Cloudflare headers override socket-derived metadata."
to = "Ne jamais laisser des en-tetes Cloudflare non fiables remplacer les metadonnees derivees du socket."

[[phrase]]
from = ", city, device, worker, or bot headers as authorization decisions."
to = ", ville, appareil, worker ou bot comme decisions d'autorisation."

[[phrase]]
from = "Keep metrics labels bounded. Country labels may be allowed only as fixed two-letter country codes plus"
to = "Garder les labels de metriques bornes. Les labels de pays ne peuvent etre autorises que comme codes pays fixes a deux lettres plus"

[[phrase]]
from = "; never use free-form city names as labels."
to = " ; ne jamais utiliser des noms de ville libres comme labels."

[[phrase]]
from = "Redact or bound all header values in logs."
to = "Rediger ou borner toutes les valeurs d'en-tete dans les journaux."

[[phrase]]
from = "IP Range Refresh"
to = "Rafraichissement des plages IP"

[[phrase]]
from = "load a configured pinned Cloudflare IP range file;"
to = "charger un fichier configure et epingle de plages IP Cloudflare ;"

[[phrase]]
from = "validate every CIDR;"
to = "valider chaque CIDR ;"

[[phrase]]
from = "refuse startup if Cloudflare mode requires trusted ranges and none are usable."
to = "refuser le demarrage si le mode Cloudflare exige des plages de confiance et qu'aucune n'est utilisable."

[[phrase]]
from = "fetch Cloudflare's official IP range API daily or on a configured interval;"
to = "recuperer l'API officielle des plages IP Cloudflare chaque jour ou selon un intervalle configure ;"

[[phrase]]
from = "validate the complete response before swapping it in;"
to = "valider la reponse complete avant de l'echanger ;"

[[phrase]]
from = "keep the last known-good range set if refresh fails;"
to = "conserver le dernier ensemble de plages connu comme bon si le rafraichissement echoue ;"

[[phrase]]
from = "last_failure"
to = "last_failure"

[[phrase]]
from = "last_success"
to = "last_success"

[[phrase]]
from = "and active range count in metrics and admin status;"
to = "et le nombre de plages actives dans les metriques et le statut admin ;"

[[phrase]]
from = "never block request workers while refreshing."
to = "ne jamais bloquer les workers de requetes pendant le rafraichissement."

[[phrase]]
from = "or equivalent atomic state so new requests see the fresh range set without interrupting active requests."
to = "ou un etat atomique equivalent afin que les nouvelles requetes voient l'ensemble de plages frais sans interrompre les requetes actives."

[[phrase]]
from = "Origin CA Automation"
to = "Automatisation Origin CA"

[[phrase]]
from = "Cloudflare Origin CA certificates are separate from Let's Encrypt/ACME certificates. They are trusted by Cloudflare for edge-to-origin TLS, not by normal browsers directly."
to = "Les certificats Cloudflare Origin CA sont distincts des certificats Let's Encrypt/ACME. Cloudflare leur fait confiance pour le TLS edge-to-origin, mais les navigateurs normaux ne leur font pas directement confiance."

[[phrase]]
from = "Generate a private key locally with strict permissions."
to = "Generer localement une cle privee avec des permissions strictes."

[[phrase]]
from = "Generate a CSR for configured hostnames."
to = "Generer un CSR pour les hostnames configures."

[[phrase]]
from = "Call the Cloudflare Origin CA create-certificate API."
to = "Appeler l'API create-certificate de Cloudflare Origin CA."

[[phrase]]
from = "Persist certificate and key through Fluxheim's atomic snapshot/storage pattern."
to = "Persister le certificat et la cle via le modele atomique snapshot/storage de Fluxheim."

[[phrase]]
from = "Validate certificate hostnames and expiry."
to = "Valider les hostnames et l'expiration du certificat."

[[phrase]]
from = "Reload TLS state without downtime through the existing cert reload model."
to = "Recharger l'etat TLS sans interruption via le modele existant de reload de certificat."

[[phrase]]
from = "Optionally revoke superseded Origin CA certificates after a safe overlap period."
to = "Revoquer optionnellement les certificats Origin CA remplaces apres une periode de chevauchement sure."

[[phrase]]
from = "API token must be least-privilege and loaded from a secret path or environment, not committed into config snapshots."
to = "Le token API doit etre a moindre privilege et charge depuis un chemin secret ou l'environnement, pas commit dans les snapshots de configuration."

[[phrase]]
from = "Token, CSR private key, and certificate private key must never be logged."
to = "Le token, la cle privee du CSR et la cle privee du certificat ne doivent jamais etre journalises."

[[phrase]]
from = "Renewal should happen well before expiry and expose failures through admin/metrics/logging."
to = "Le renouvellement doit se produire bien avant l'expiration et exposer les echecs via admin, metriques et logging."

[[phrase]]
from = "The operator must be able to disable automation and use their own certificate files."
to = "L'operateur doit pouvoir desactiver l'automatisation et utiliser ses propres fichiers de certificat."

[[phrase]]
from = "Authenticated Origin Pulls"
to = "Authenticated Origin Pulls"

[[phrase]]
from = "Authenticated Origin Pulls add mTLS client-certificate verification from Cloudflare to the origin."
to = "Authenticated Origin Pulls ajoute une verification mTLS par certificat client de Cloudflare vers l'origin."

[[phrase]]
from = "Global AOP: easiest setup, but the Cloudflare-provided client certificate is shared across Cloudflare accounts and proves only that the connection came from Cloudflare's network."
to = "AOP global : configuration la plus simple, mais le certificat client fourni par Cloudflare est partage entre les comptes Cloudflare et prouve seulement que la connexion vient du reseau Cloudflare."

[[phrase]]
from = "Zone-level AOP: uses a user-uploaded certificate and is stricter."
to = "AOP au niveau zone : utilise un certificat televerse par l'utilisateur et est plus strict."

[[phrase]]
from = "Per-hostname AOP: uses a user-uploaded certificate for specific hostnames and is preferred for mixed or high-security deployments."
to = "AOP par hostname : utilise un certificat televerse par l'utilisateur pour des hostnames specifiques et est prefere pour les deploiements mixtes ou haute securite."

[[phrase]]
from = "configured AOP CA bundle per listener/vhost;"
to = "bundle CA AOP configure par listener/vhost ;"

[[phrase]]
from = "certificate verification during TLS handshake where the selected TLS backend supports it;"
to = "verification du certificat pendant le handshake TLS lorsque le backend TLS selectionne la prend en charge ;"

[[phrase]]
from = "certificate reload without dropping active requests;"
to = "reload de certificat sans abandonner les requetes actives ;"

[[phrase]]
from = "metrics/logs for AOP success/failure counts;"
to = "metriques/journaux pour les compteurs de succes/echec AOP ;"

[[phrase]]
from = "clear validation warnings when a deployment relies only on global AOP."
to = "avertissements de validation clairs lorsqu'un deploiement repose seulement sur l'AOP global."

