[[phrase]]
from = "WAF Architecture — Fluxheim Source Docs"
to = "Architecture WAF - Documentation source Fluxheim"
[[phrase]]
from = "WAF Architecture"
to = "Architecture WAF"
[[phrase]]
from = "Fluxheim WAF support is future optional security functionality. It must not be compiled into default builds. The normal secure default remains a small edge proxy/static server focused on strict protocol handling, TLS, cache, logging, and metrics."
to = "Le support WAF de Fluxheim est une future fonctionnalite de securite optionnelle. Il ne doit pas etre compile dans les builds par defaut. Le defaut securise normal reste un petit serveur edge proxy/statique centre sur la gestion stricte des protocoles, TLS, le cache, le logging et les metrics."
[[phrase]]
from = "The WAF goal is to provide a per-vhost request inspection layer that can block, score, or audit suspicious traffic without turning request workers into a slow or unbounded parsing path."
to = "L'objectif WAF est de fournir une couche d'inspection des requetes par vhost capable de bloquer, scorer ou auditer le trafic suspect sans transformer les workers de requete en chemin de parsing lent ou non borne."
[[phrase]]
from = "Long-term scope should cover the web-application security jobs operators expect from F5 BIG-IP ASM/Advanced WAF-class deployments, but through Fluxheim's optional modules and release gates. That includes signature/anomaly scoring, OWASP CRS-compatible rule paths where practical, positive-security policy over time, bot/reputation inputs, per-vhost dry-run/blocking modes, audit evidence, and integration points for load-balancer routing decisions. It is not part of the"
to = "Le perimetre a long terme doit couvrir les taches de securite applicative web attendues par les operateurs de deploiements de classe F5 BIG-IP ASM/Advanced WAF, mais via les modules optionnels et gates de release de Fluxheim. Cela inclut le scoring signature/anomalie, des chemins de regles compatibles OWASP CRS lorsque c'est pratique, une policy de securite positive dans le temps, des entrees bot/reputation, des modes dry-run/blocking par vhost, des preuves d'audit et des points d'integration pour les decisions de routage load-balancer. Cela ne fait pas partie de la release"
[[phrase]]
from = "load-balancer release."
to = "load-balancer."
