to = "Prendre en charge le fonctionnement rootless/local lorsque possible."
[[phrase]]
from = "Route requests to the healthiest backend using current telemetry."
to = "Router les requetes vers le backend le plus sain avec la telemetrie courante."
[[phrase]]
