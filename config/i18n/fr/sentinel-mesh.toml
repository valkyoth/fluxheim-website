[[phrase]]
from = "Sentinel Mesh: Smart WireGuard Load Balancing"
to = "Sentinel Mesh : load balancing WireGuard intelligent"
[[phrase]]
from = "Sentinel Mesh is a future Fluxheim architecture for a self-healing smart load balancer. It combines Pingora's proxy and load-balancing hooks with a private WireGuard transport and real-time backend telemetry. The goal is to route by observed health and load instead of only round-robin or static weights."
to = "Sentinel Mesh est une future architecture Fluxheim pour un load balancer intelligent auto-reparateur. Elle combine les hooks proxy et load-balancing de Pingora avec un transport WireGuard prive et une telemetrie backend temps reel. L'objectif est de router selon la sante et la charge observees plutot que seulement selon round-robin ou poids statiques."
[[phrase]]
from = "This is a design target, not an implemented module."
to = "Ceci est une cible de conception, pas un module implemente."
[[phrase]]
from = "Keep backend traffic private and encrypted even across clouds or sites."
to = "Garder le trafic backend prive et chiffre meme entre clouds ou sites."
[[phrase]]
