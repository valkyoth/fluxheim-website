to = "Exposer un etat operateur clair indiquant pourquoi un backend a ete choisi."
[[phrase]]
from = "Allow manual drain and maintenance controls without restarting Fluxheim."
to = "Permettre des controles manuels de drain et maintenance sans redemarrer Fluxheim."
[[phrase]]
from = "Keep all state transitions testable as ordinary Rust logic."
to = "Garder toutes les transitions d'etat testables comme logique Rust ordinaire."
[[phrase]]
from = "Replacing kernel WireGuard for every deployment. Kernel WireGuard should remain an option when host networking is available and preferred."
to = "Remplacer WireGuard kernel pour chaque deploiement. WireGuard kernel doit rester une option lorsque le reseau host est disponible et prefere."
