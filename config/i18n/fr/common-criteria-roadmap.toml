locale_id = "fr-FR"
html_lang = "fr-FR"
[[phrase]]
from = "Common Criteria Roadmap"
to = "Roadmap Common Criteria"
[[phrase]]
from = "Common Criteria Readiness Roadmap"
to = "Feuille de route de preparation Common Criteria"
[[phrase]]
from = "This document tracks how Fluxheim can use ISO/IEC 15408:2026 concepts as an engineering and evidence framework. It is not a certification claim. Common Criteria evaluation is a product evaluation track, while FIPS 140-3 and ISO/IEC 19790 are cryptographic-module tracks. They can support each other, but they are not interchangeable."
to = "Ce document suit la maniere dont Fluxheim peut utiliser les concepts ISO/IEC 15408:2026 comme framework d'engineering et de preuves. Ce n'est pas une revendication de certification. Une evaluation Common Criteria est une voie d'evaluation produit, tandis que FIPS 140-3 et ISO/IEC 19790 sont des voies pour modules cryptographiques. Elles peuvent se soutenir, mais ne sont pas interchangeables."
[[phrase]]
from = "The practical value for Fluxheim is to make product boundaries, security functions, operator assumptions, tests, and lifecycle evidence explicit enough that a future Protection Profile or Security Target can be written without reconstructing years of engineering decisions."
to = "La valeur pratique pour Fluxheim est de rendre les frontieres produit, fonctions de securite, hypotheses operateur, tests et preuves de cycle de vie assez explicites pour qu'un futur Protection Profile ou Security Target puisse etre redige sans reconstruire des annees de decisions d'engineering."
[[phrase]]
from = "Source Scope"
to = "Portee des sources"
[[phrase]]
from = "The local reference set reviewed was the ISO/IEC 15408:2026 series:"
to = "Le jeu de references local examine etait la serie ISO/IEC 15408:2026:"
[[phrase]]
from = "Part 1: introduction and general model."
to = "Partie 1: introduction et modele general."
[[phrase]]
from = "Part 2: security functional components."
to = "Partie 2: composants fonctionnels de securite."
[[phrase]]
from = "Part 3: security assurance components."
to = "Partie 3: composants d'assurance de securite."
[[phrase]]
from = "Part 4: evaluation methods and activities framework."
to = "Partie 4: framework de methodes et activites d'evaluation."
[[phrase]]
from = "Part 5: predefined packages of security requirements."
to = "Partie 5: paquets predefinis d'exigences de securite."
[[phrase]]
from = "Do not copy licensed standard text into Fluxheim docs. Use this roadmap as a derived engineering checklist only."
to = "Ne copiez pas de texte standard sous licence dans les docs Fluxheim. Utilisez cette roadmap uniquement comme checklist d'engineering derivee."
[[phrase]]
from = "Product Boundary"
to = "Frontiere produit"
[[phrase]]
from = "A future evaluation has to define the Target of Evaluation (TOE). Fluxheim should prepare for multiple possible TOE shapes:"
to = "Une future evaluation doit definir le Target of Evaluation (TOE). Fluxheim doit se preparer a plusieurs formes de TOE possibles:"
[[phrase]]
from = "gateway binary only."
to = "binaire gateway uniquement."
[[phrase]]
from = "RPM installation including systemd units, default directories, and helper binaries."
to = "installation RPM incluant units systemd, repertoires par defaut et binaires helper."
[[phrase]]
from = "Container image including entrypoint, base image, runtime filesystem layout, and"
to = "image conteneur incluant entrypoint, image de base, layout filesystem runtime et"
[[phrase]]
from = "FIPS/ISO OpenSSL profile where the validated OpenSSL provider is outside the Fluxheim TOE but part of the operational environment."
to = "profil OpenSSL FIPS/ISO ou le provider OpenSSL valide est hors du TOE Fluxheim mais fait partie de l'environnement operationnel."
[[phrase]]
from = "For each TOE shape, the evidence should identify:"
to = "Pour chaque forme de TOE, les preuves doivent identifier:"
[[phrase]]
from = "Physical and logical scope."
to = "Portee physique et logique."
[[phrase]]
from = "Required non-TOE hardware, software, firmware, services, and operator procedures."
to = "Materiel, logiciel, firmware, services et procedures operateur non-TOE requis."
[[phrase]]
