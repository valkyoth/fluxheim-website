to = "Fonctionnalite de securite fournie par Fluxheim lui-meme."
[[phrase]]
from = "Security functionality delegated to the operating system, OpenSSL, OpenBao, ACME issuer, container runtime, or external upstream."
to = "Fonctionnalite de securite deleguee au systeme d'exploitation, a OpenSSL, OpenBao, l'emetteur ACME, au runtime conteneur ou a un upstream externe."
[[phrase]]
from = "Interfaces that are security-enforcing or security-supporting."
to = "Interfaces qui appliquent ou soutiennent la securite."
[[phrase]]
from = "Security Problem Definition"
to = "Definition du probleme de securite"
[[phrase]]
from = "Fluxheim should keep a living product-level security problem definition. It should not be limited to cryptography."
to = "Fluxheim doit conserver une definition vivante du probleme de securite au niveau produit. Elle ne doit pas etre limitee a la cryptographie."
[[phrase]]
from = "Candidate assets:"
to = "Assets candidats:"
[[phrase]]
