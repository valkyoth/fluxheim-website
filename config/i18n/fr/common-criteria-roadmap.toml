[[phrase]]
from = "Assurance Evidence"
to = "Preuves d'assurance"
[[phrase]]
from = "The ISO/IEC 15408-3 assurance families are useful as a release evidence checklist even without claiming an EAL."
to = "Les familles d'assurance ISO/IEC 15408-3 sont utiles comme checklist de preuves de release, meme sans revendiquer d'EAL."
[[phrase]]
from = "Fluxheim should maintain:"
to = "Fluxheim doit maintenir:"
[[phrase]]
from = "Architecture notes for security-enforcing modules and interfaces."
to = "Notes d'architecture pour modules et interfaces qui appliquent la securite."
[[phrase]]
from = "Functional specifications for config validation, routing, TLS, ACME, cache, PHP-FPM, admin, snapshots, logging, and telemetry."
to = "Specifications fonctionnelles pour validation de config, routage, TLS, ACME, cache, PHP-FPM, admin, snapshots, logging et telemetrie."
[[phrase]]
from = "Operational guidance and preparative procedures for RPM, container, systemd, and source builds."
to = "Guidance operationnelle et procedures preparatoires pour builds RPM, conteneur, systemd et source."
[[phrase]]
from = "Configuration management evidence: signed tags, SBOMs, lockfiles, release notes, changelog, build scripts, and dependency audit output."
to = "Preuves de gestion de configuration: tags signes, SBOM, lockfiles, notes de release, changelog, scripts de build et sortie d'audit de dependances."
[[phrase]]
from = "Delivery evidence: checksums, signatures, image digests, release runbook, and reproducible-build output where available."
to = "Preuves de livraison: checksums, signatures, digests d'image, release runbook et sortie de build reproductible lorsque disponible."
[[phrase]]
from = "Flaw remediation evidence: security policy, issue process, pentest fixes, CodeQL, cargo-audit, cargo-deny, fuzzing, and regression tests."
to = "Preuves de correction de defauts: security policy, processus d'issues, corrections de pentest, CodeQL, cargo-audit, cargo-deny, fuzzing et tests de regression."
[[phrase]]
from = "Developer test coverage and independent-test entry points that a third party can run without privileged production access."
to = "Couverture de tests developpeur et points d'entree de tests independants qu'un tiers peut executer sans acces production privilegie."
[[phrase]]
from = "Vulnerability analysis records for public-domain issues and pentest findings."
to = "Enregistrements d'analyse de vulnerabilites pour problemes publics et resultats de pentest."
[[phrase]]
from = "Evaluation Methods"
to = "Methodes d'evaluation"
[[phrase]]
from = "ISO/IEC 15408-4 is most useful to Fluxheim as a format for repeatable local security checks."
to = "ISO/IEC 15408-4 est surtout utile a Fluxheim comme format pour controles de securite locaux repetables."
[[phrase]]
from = "Every major security check should have:"
to = "Chaque controle de securite majeur doit avoir:"
[[phrase]]
from = "A stable identifier."
to = "Un identifiant stable."
[[phrase]]
from = "Scope and objective."
to = "Portee et objectif."
[[phrase]]
from = "Required inputs and environment."
to = "Entrees et environnement requis."
[[phrase]]
from = "Tool requirements."
to = "Exigences d'outillage."
[[phrase]]
from = "Execution steps."
to = "Etapes d'execution."
[[phrase]]
from = "Pass/fail criteria."
to = "Criteres pass/fail."
[[phrase]]
from = "Output artifacts to archive."
to = "Artefacts de sortie a archiver."
[[phrase]]
from = "Rationale linking the check to a threat, requirement, or release gate."
to = "Rationale reliant le controle a une menace, une exigence ou un release gate."
[[phrase]]
from = "Existing scripts that fit this pattern include release metadata validation, OWASP baseline checks, FIPS-capable OpenSSL and rustls/AWS-LC validation, config fixture validation, fuzzing targets, cargo-audit, cargo-deny, CodeQL, and PHP-FPM regression tests."
to = "Les scripts existants qui suivent ce modele incluent validation des metadonnees de release, controles baseline OWASP, validation OpenSSL compatible FIPS et rustls/AWS-LC, validation de fixtures de config, targets de fuzzing, cargo-audit, cargo-deny, CodeQL et tests de regression PHP-FPM."
[[phrase]]
from = "Package Strategy"
to = "Strategie de paquets"
[[phrase]]
from = "ISO/IEC 15408-5 packages are useful for long-term planning, but Fluxheim should not claim an EAL or Common Criteria conformance until a real Security Target and accredited evaluation path exist."
to = "Les paquets ISO/IEC 15408-5 sont utiles pour la planification long terme, mais Fluxheim ne doit revendiquer ni EAL ni conformite Common Criteria tant qu'un vrai Security Target et une voie d'evaluation accreditee n'existent pas."
[[phrase]]
from = "Practical near-term approach:"
to = "Approche pratique a court terme:"
[[phrase]]
from = "Use EAL terminology only internally as an evidence maturity reference."
to = "Utiliser la terminologie EAL seulement en interne comme reference de maturite des preuves."
[[phrase]]
from = "Avoid \"EAL-ready\" marketing language."
to = "Eviter le langage marketing \"EAL-ready\"."
[[phrase]]
from = "Prefer \"Common Criteria evidence-aligned\" for documentation."
to = "Preferer \"Common Criteria evidence-aligned\" pour la documentation."
[[phrase]]
from = "Track composed deployments separately, because Fluxheim often depends on OpenSSL, PHP-FPM, OpenBao, container runtimes, ACME issuers, and upstream applications."
to = "Suivre les deploiements composes separement, car Fluxheim depend souvent d'OpenSSL, PHP-FPM, OpenBao, runtimes conteneur, emetteurs ACME et applications upstream."
[[phrase]]
from = "Roadmap"
to = "Roadmap"
[[phrase]]
from = "Phase 1 - Evidence Alignment"
to = "Phase 1 - Alignement des preuves"
[[phrase]]
from = "provides sections for TOE boundary, assumptions, security functions, operational environment, external dependencies, cryptographic module evidence, scanner output, and vulnerability-analysis records."
to = "fournit des sections pour frontiere TOE, hypotheses, fonctions de securite, environnement operationnel, dependances externes, preuves de module cryptographique, sortie de scanner et enregistrements d'analyse de vulnerabilites."
[[phrase]]
from = "stable validation-script identifiers are documented in the evidence template for release metadata, feature validation, FIPS OpenSSL, FIPS rustls, OWASP baseline, SBOM, reproducible-build, cargo-audit, cargo-deny, CodeQL, and aggregated release evidence."
to = "des identifiants stables de scripts de validation sont documentes dans le modele de preuves pour metadonnees de release, validation de features, FIPS OpenSSL, FIPS rustls, baseline OWASP, SBOM, build reproductible, cargo-audit, cargo-deny, CodeQL et preuves de release agregees."
[[phrase]]
from = "Expand docs so each security feature has operator guidance and test evidence."
to = "Etendre les docs pour que chaque feature de securite ait une guidance operateur et des preuves de test."
[[phrase]]
from = "Phase 2 - Security Target Draft"
to = "Phase 2 - Brouillon de Security Target"
[[phrase]]
from = "Draft a non-certification Security Target-style document for one TOE shape: the RPM gateway profile is likely the most concrete first target."
to = "Rediger un document de style Security Target sans certification pour une forme de TOE: le profil gateway RPM est probablement la premiere cible la plus concrete."
[[phrase]]
from = "Define the TOE boundary, security problem, objectives, requirements mapping, and summary specification in Fluxheim terminology."
to = "Definir la frontiere TOE, le probleme de securite, les objectifs, le mapping d'exigences et la specification synthetique dans la terminologie Fluxheim."
[[phrase]]
from = "Keep it explicitly marked as an engineering draft, not an evaluated ST."
to = "Le garder explicitement marque comme brouillon d'engineering, pas comme ST evalue."
[[phrase]]
from = "Phase 3 - Protection Profile Research"
to = "Phase 3 - Recherche de Protection Profile"
[[phrase]]
from = "Check whether an existing firewall, TLS gateway, web server, reverse proxy, or network device Protection Profile can reasonably fit Fluxheim."
to = "Verifier si un Protection Profile existant pour firewall, gateway TLS, serveur web, reverse proxy ou appareil reseau peut raisonnablement convenir a Fluxheim."
[[phrase]]
from = "If no profile fits, document why and identify which SFR groups would need a custom PP or direct-rationale ST."
to = "Si aucun profil ne convient, documenter pourquoi et identifier quels groupes SFR necessiteraient un PP personnalise ou un ST a rationale direct."
[[phrase]]
from = "Phase 4 - External Evaluation Decision"
to = "Phase 4 - Decision d'evaluation externe"
[[phrase]]
from = "Only pursue formal Common Criteria evaluation if there is a sponsor, a fixed TOE boundary, a lab, a target assurance package, and a maintenance budget."
to = "Ne poursuivre une evaluation Common Criteria formelle que s'il existe un sponsor, une frontiere TOE fixe, un laboratoire, un paquet d'assurance cible et un budget de maintenance."
[[phrase]]
from = "Do not combine formal Common Criteria claims with FIPS/ISO cryptographic module claims unless the evidence boundary for each is separately clear."
to = "Ne pas combiner des claims Common Criteria formels avec des claims FIPS/ISO de module cryptographique sauf si la frontiere de preuve de chacun est separement claire."
