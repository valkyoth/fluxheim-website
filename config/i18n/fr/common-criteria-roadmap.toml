to = "Metadonnees d'identite de requete, logs, traces et metriques."
[[phrase]]
from = "PHP-FPM request parameters and spooled request bodies."
to = "Parametres de requete PHP-FPM et corps de requete spoules."
[[phrase]]
from = "Candidate threat classes:"
to = "Classes de menaces candidates:"
[[phrase]]
from = "Remote request smuggling, routing bypass, cache poisoning, header injection, path traversal, request-body exhaustion, and protocol downgrade."
to = "Request smuggling distant, contournement de routage, cache poisoning, injection de headers, path traversal, epuisement de corps de requete et downgrade de protocole."
[[phrase]]
from = "Local filesystem and symlink attacks against runtime state, cache, spool, ACME, snapshot, and TLS paths."
to = "Attaques locales filesystem et symlink contre les chemins runtime state, cache, spool, ACME, snapshot et TLS."
[[phrase]]
from = "Misconfiguration that silently disables security controls."
to = "Mauvaise configuration qui desactive silencieusement les controles de securite."
[[phrase]]
from = "Compromised or lagging upstream services in proxy, PHP-FPM, ACME, OpenBao, OTLP, and future crypto-RPC deployments."
to = "Services upstream compromis ou en retard dans les deploiements proxy, PHP-FPM, ACME, OpenBao, OTLP et futurs crypto-RPC."
[[phrase]]
from = "Supply-chain compromise of build inputs, dependencies, container bases, and release artifacts."
to = "Compromission supply-chain des entrees de build, dependances, bases conteneur et artefacts de release."
[[phrase]]
from = "Candidate operational assumptions:"
to = "Hypotheses operationnelles candidates:"
[[phrase]]
from = "The service runs as a dedicated Unix user."
to = "Le service s'execute avec un utilisateur Unix dedie."
[[phrase]]
from = "Runtime state directories are owned by the service user and not writable by untrusted users."
to = "Les repertoires runtime state appartiennent a l'utilisateur de service et ne sont pas modifiables par des utilisateurs non fiables."
[[phrase]]
from = "Admin endpoints and control sockets are reachable only from trusted networks or local operators."
to = "Les endpoints admin et control sockets ne sont joignables que depuis des reseaux fiables ou par des operateurs locaux."
[[phrase]]
from = "Operators preserve release evidence, SBOMs, checksums, signatures, and module Security Policies."
to = "Les operateurs conservent les preuves de release, SBOM, checksums, signatures et Security Policies des modules."
[[phrase]]
from = "External cryptographic modules and services are installed and operated within their own validation boundaries when a regulated deployment claims them."
to = "Les modules et services cryptographiques externes sont installes et exploites dans leurs propres frontieres de validation lorsqu'un deploiement reglemente les revendique."
[[phrase]]
from = "Functional Requirement Mapping"
to = "Mapping des exigences fonctionnelles"
[[phrase]]
from = "Fluxheim should map existing and planned features to Common Criteria-style security functional areas. This is a roadmap classification, not formal SFR language."
to = "Fluxheim doit mapper les features existantes et prevues vers des domaines fonctionnels de securite de style Common Criteria. C'est une classification de roadmap, pas un langage SFR formel."
[[phrase]]
from = "Security Audit"
to = "Audit de securite"
