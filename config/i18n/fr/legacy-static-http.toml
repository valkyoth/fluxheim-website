to = "doivent etre rejetees."

[[phrase]]
from = "headers must be rejected."
to = "headers doivent etre rejetes."

[[phrase]]
from = "HTTP/0.9 is too old and ambiguous for Pingora&#x27;s normal HTTP pipeline. It should be implemented, if ever, as a separate raw TCP service."
to = "HTTP/0.9 est trop ancien et ambigu pour le pipeline HTTP normal de Pingora. S'il est un jour implemente, il devrait l'etre comme service TCP brut separe."

[[phrase]]
