from = "<thead><tr><th>Interface</th><th>Direction</th><th>Security role</th><th>Evidence</th></tr></thead>\n<tbody>\n<tr><td>Downstream HTTP/TLS listener</td><td>inbound</td><td>TLS policy, host routing, request limits</td><td>config, tests, TLS diagnostics</td></tr>\n<tr><td>Upstream proxy connector</td><td>outbound</td><td>upstream TLS, headers, retries, timeouts</td><td>config, tests</td></tr>\n<tr><td>Static web root</td><td>filesystem</td><td>path traversal and symlink prevention</td><td>tests, docs</td></tr>\n<tr><td>PHP-FPM FastCGI</td><td>outbound/local</td><td>CGI params, body limits, response parsing</td><td>tests, PHP-FPM docs</td></tr>\n<tr><td>Cache store</td><td>filesystem/OpenBao</td><td>object limits, encryption boundary</td><td>config, smoke tests</td></tr>\n<tr><td>ACME challenge and renewal</td><td>inbound/outbound</td><td>certificate lifecycle</td><td>ACME docs, FIPS gates</td></tr>\n<tr><td>Admin API</td><td>inbound</td><td>management and rollback</td><td>admin docs, auth tests</td></tr>\n<tr><td>Control socket</td><td>local IPC</td><td>certificate reload command</td><td>runtime tests, permissions</td></tr>\n<tr><td>OTLP metrics/traces</td><td>outbound</td><td>telemetry metadata export</td><td>config, CA, FIPS gates</td></tr>\n<tr><td>Logs</td><td>outbound/filesystem</td><td>audit trail and diagnostics</td><td>logging config, redaction docs</td></tr>\n</tbody>"
to = "<thead><tr><th>Interface</th><th>Direction</th><th>Role de securite</th><th>Preuve</th></tr></thead>\n<tbody>\n<tr><td>Listener HTTP/TLS downstream</td><td>entrant</td><td>policy TLS, routage host, limites de requete</td><td>config, tests, diagnostics TLS</td></tr>\n<tr><td>Connecteur proxy upstream</td><td>sortant</td><td>TLS upstream, headers, retries, timeouts</td><td>config, tests</td></tr>\n<tr><td>Racine web statique</td><td>systeme de fichiers</td><td>prevention path traversal et symlink</td><td>tests, docs</td></tr>\n<tr><td>PHP-FPM FastCGI</td><td>sortant/local</td><td>parametres CGI, limites de body, parsing de reponse</td><td>tests, docs PHP-FPM</td></tr>\n<tr><td>Stockage cache</td><td>systeme de fichiers/OpenBao</td><td>limites d'objet, frontiere de chiffrement</td><td>config, smoke tests</td></tr>\n<tr><td>Challenge et renouvellement ACME</td><td>entrant/sortant</td><td>cycle de vie des certificats</td><td>docs ACME, gates FIPS</td></tr>\n<tr><td>API admin</td><td>entrant</td><td>gestion et rollback</td><td>docs admin, tests auth</td></tr>\n<tr><td>Socket de controle</td><td>IPC local</td><td>commande de rechargement de certificat</td><td>tests runtime, permissions</td></tr>\n<tr><td>Metriques/traces OTLP</td><td>sortant</td><td>export de metadonnees de telemetrie</td><td>config, CA, gates FIPS</td></tr>\n<tr><td>Logs</td><td>sortant/systeme de fichiers</td><td>audit trail et diagnostics</td><td>config logging, docs de redaction</td></tr>\n</tbody>"
