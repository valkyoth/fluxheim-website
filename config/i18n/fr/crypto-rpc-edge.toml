[[phrase]]
from = "Privacy And Anonymity Research"
to = "Recherche sur confidentialite et anonymat"
[[phrase]]
from = "Crypto RPC privacy is a separate problem from caching and load balancing. A normal reverse proxy can hide the user's IP address from the upstream provider, but the gateway itself can still see the requester, method, params, timing, and response unless the design deliberately removes or blinds that information."
to = "La confidentialite RPC crypto est un probleme separe du cache et du load balancing. Un reverse proxy normal peut cacher l'adresse IP de l'utilisateur au provider upstream, mais la passerelle elle-meme peut encore voir demandeur, methode, params, timing et reponse sauf si le design retire ou aveugle volontairement ces informations."
[[phrase]]
from = "Initial privacy-preserving controls should be practical and honest:"
to = "Les controles initiaux preservant la confidentialite doivent etre pratiques et honnetes :"
[[phrase]]
from = "never log full params, responses, calldata, signatures, addresses, or transaction hashes by default;"
to = "ne jamais journaliser par defaut params complets, reponses, calldata, signatures, adresses ou hashes de transaction;"
[[phrase]]
from = "strip client-identifying headers before upstream unless explicitly allowed;"
to = "retirer les en-tetes identifiant le client avant l'upstream sauf autorisation explicite;"
[[phrase]]
from = "support cache-only answers for finalized/immutable data, where Fluxheim can answer without contacting an upstream for that request;"
to = "prendre en charge des reponses cache-only pour les donnees finalized/immutables, ou Fluxheim peut repondre sans contacter d'upstream pour cette requete;"
[[phrase]]
from = "provide a privacy mode that rejects non-cacheable or identifying methods rather than forwarding them;"
to = "fournir un mode confidentialite qui rejette les methodes non cacheables ou identifiantes plutot que de les transferer;"
[[phrase]]
from = "keep metrics cardinality-safe and avoid labels for addresses, hashes, contracts, ENS names, or raw method params;"
to = "garder les metrics cardinality-safe et eviter les labels pour adresses, hashes, contrats, noms ENS ou params de methode bruts;"
[[phrase]]
from = "document retention behavior for access logs, traces, cache metadata, and upstream health probes."
to = "documenter le comportement de retention pour access logs, traces, metadonnees de cache et health probes upstream."
[[phrase]]
from = "\"Verifiably anonymized\" RPC should remain research/beta until Fluxheim can state and test a real threat model. Candidate future designs:"
to = "Le RPC \"verifiablement anonymise\" doit rester recherche/beta jusqu'a ce que Fluxheim puisse enoncer et tester un vrai threat model. Designs futurs candidats :"
[[phrase]]
from = "blind or relay-based read queries where the public gateway cannot link the external client identity to the upstream query;"
to = "requetes de lecture aveugles ou basees sur relais ou la passerelle publique ne peut pas lier l'identite du client externe a la requete upstream;"
[[phrase]]
from = "anonymous credential or token-bucket rate limiting that does not identify the caller to the RPC gateway;"
to = "rate limiting par credential anonyme ou token-bucket qui n'identifie pas l'appelant aupres de la passerelle RPC;"
[[phrase]]
from = "privacy-preserving audit proofs showing that request bodies and identifying headers were not logged."
to = "preuves d'audit preservant la confidentialite montrant que les corps de requete et les en-tetes identifiants n'ont pas ete journalises."
[[phrase]]
from = "Verification Co-Processing"
to = "Co-traitement de verification"
[[phrase]]
from = "Goal: allow Fluxheim to verify selected blockchain-derived data at the edge before returning or caching it. Instead of trusting one RPC provider's response, Fluxheim can fetch proofs, verify them against a trusted block header or light-client state, and then return data with stronger integrity guarantees."
to = "Objectif : permettre a Fluxheim de verifier a l'edge des donnees selectionnees derivees de la blockchain avant de les retourner ou de les mettre en cache. Au lieu de faire confiance a la reponse d'un seul provider RPC, Fluxheim peut recuperer des preuves, les verifier contre un en-tete de bloc fiable ou un etat de light client, puis retourner des donnees avec des garanties d'integrite plus fortes."
[[phrase]]
from = "Candidate verification modes:"
to = "Modes de verification candidats :"
[[phrase]]
from = "Ethereum account/storage proof verification through"
to = "verification des preuves de compte/storage Ethereum via"
[[phrase]]
from = "using Merkle-Patricia trie proofs against a known state root."
to = "avec des preuves de trie Merkle-Patricia contre une racine d'etat connue."
[[phrase]]
from = "Receipt or transaction inclusion checks against block bodies/receipts roots where proof material is available and bounded."
to = "verifications d'inclusion de receipt ou transaction contre les corps de bloc/racines de receipts lorsque le materiel de preuve est disponible et borne."
[[phrase]]
from = "Header verification through an embedded or sidecar light client such as a Helios-style model."
to = "verification d'en-tetes via un light client embarque ou sidecar, comme un modele de style Helios."
[[phrase]]
from = "ZK proof verification for application-specific state claims where a mature verifier and proof format exist."
to = "verification de preuves ZK pour des affirmations d'etat specifiques a une application lorsqu'un verifieur et un format de preuve matures existent."
[[phrase]]
from = "Candidate config shape:"
to = "Forme de configuration candidate :"
[[phrase]]
from = "Verification must be explicit per method or route."
to = "La verification doit etre explicite par methode ou route."
[[phrase]]
from = "Verification failure must default to fail-closed for protected methods."
to = "L'echec de verification doit etre fail-closed par defaut pour les methodes protegees."
[[phrase]]
from = "Stale light-client checkpoints must make protected verification unavailable rather than silently falling back to provider trust."
to = "Des checkpoints de light client obsoletes doivent rendre la verification protegee indisponible plutot que revenir silencieusement a la confiance dans le provider."
[[phrase]]
from = "Metrics must report verification result classes without labeling addresses, storage slots, transaction hashes, or raw proof identifiers."
to = "Les metrics doivent rapporter les classes de resultat de verification sans labels pour adresses, slots de storage, hashes de transaction ou identifiants de preuve bruts."
[[phrase]]
from = "Dependency guidance:"
to = "Conseils de dependances :"
[[phrase]]
from = "Do not implement cryptographic proof systems from scratch."
to = "Ne pas implementer de systemes de preuve cryptographique depuis zero."
[[phrase]]
from = "Open questions:"
to = "Questions ouvertes :"
[[phrase]]
from = "Whether verification should run in-process, in a worker pool, or in a separate sidecar to isolate expensive proof work."
to = "Determiner si la verification doit s'executer in-process, dans un pool de workers ou dans un sidecar separe pour isoler le travail de preuve couteux."
[[phrase]]
from = "How to represent verified responses to downstream clients without inventing a misleading trust signal."
to = "Comment representer les reponses verifiees aux clients downstream sans inventer un signal de confiance trompeur."
[[phrase]]
