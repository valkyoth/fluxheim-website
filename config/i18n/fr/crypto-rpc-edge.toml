[[phrase]]
from = "Crypto RPC Edge — Fluxheim Source Docs"
to = "Edge RPC crypto - Documentation source Fluxheim"
[[phrase]]
from = "Crypto RPC Edge"
to = "Edge RPC crypto"
[[phrase]]
from = "Status: future optional module family."
to = "Statut: future famille de modules optionnelle."
[[phrase]]
from = "The crypto RPC edge track is a future Fluxheim module family for running blockchain-aware RPC gateways in front of local nodes or hosted-compatible upstreams. It should be designed as focused compile-time modules, not as part of the default web/proxy build."
to = "La piste edge RPC crypto est une future famille de modules Fluxheim pour executer des passerelles RPC conscientes de la blockchain devant des noeuds locaux ou des upstreams compatibles avec des hebergeurs. Elle doit etre concue comme des modules compile-time focalises, pas comme une partie du build web/proxy par defaut."
[[phrase]]
from = "The first concrete target is"
to = "La premiere cible concrete est"
[[phrase]]
from = ": native Ethereum/EVM JSON-RPC reverse proxying, bounded caching, and node-health-aware routing. A later"
to = ": reverse proxy JSON-RPC Ethereum/EVM natif, cache borne et routage conscient de la sante des noeuds. Une revue ulterieure"
[[phrase]]
from = "review can evaluate ENS contenthash routing, but that should remain separate until the Ethereum RPC edge module is stable. Bitcoin, Cardano, and XRPL can use the same broad architecture later, but their finality, method policy, and transport models are different enough that they should be separate modules."
to = "peut evaluer le routage contenthash ENS, mais cela doit rester separe jusqu'a ce que le module edge RPC Ethereum soit stable. Bitcoin, Cardano et XRPL peuvent utiliser plus tard la meme architecture generale, mais leurs modeles de finalite, de policy de methode et de transport sont assez differents pour rester des modules separes."
