[[phrase]]
from = "Batch behavior should be conservative. A batch is cacheable only when every call in the batch is individually cacheable under the current policy. Mixed cacheable/non-cacheable batches should pass through without storing, or be split only after a later design proves response ordering and error behavior."
to = "Le comportement des batchs doit etre conservateur. Un batch est cacheable seulement lorsque chaque appel du batch est individuellement cacheable selon la policy courante. Les batchs mixtes cacheables/non-cacheables doivent passer sans stockage, ou etre scindes seulement apres qu'un design ulterieur prouve l'ordre des reponses et le comportement d'erreur."
