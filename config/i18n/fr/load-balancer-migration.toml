[[phrase]]
from = "after the member has drained to zero in-flight requests. These backend-set mutations are local in-memory changes in the current release. Runtime backend sets are capped at 256 members, and the zero in-flight check is a best-effort mutation-time gate; Fluxheim warns if a narrow race leaves a request completing against a removed or retargeted address. Runtime-added or retargeted members carry address and configured weight only; aliases, tags, backup membership, priority groups, locality metadata, and per-upstream caps remain static-config fields. DNS/file-discovery pools and Maglev selectors reject runtime backend-set mutation."
to = "apres que le membre a ete draine a zero requete in-flight. Ces mutations de backend-set sont des changements locaux en memoire dans la version actuelle. Les backend sets runtime sont limites a 256 membres, et le controle zero in-flight est une barriere best-effort au moment de la mutation; Fluxheim avertit si une course etroite laisse une requete se terminer contre une adresse supprimee ou reciblee. Les membres ajoutes ou recibles au runtime portent uniquement l'adresse et le poids configure; aliases, tags, appartenance backup, groupes de priorite, metadonnees de locality et caps par upstream restent des champs de configuration statique. Les pools DNS/file-discovery et les selecteurs Maglev rejettent la mutation de backend-set au runtime."

