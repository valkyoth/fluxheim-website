[[phrase]]
from = "The following are intentional current load-balancer boundaries. They are not defects in the shipped load-balancer behavior; they are architectural gaps tracked for future module lines."
to = "Les points suivants sont des limites actuelles intentionnelles du load balancer. Ce ne sont pas des defauts du comportement livre; ce sont des ecarts architecturaux suivis pour de futures lignes de modules."

[[phrase]]
from = "Runtime add/remove/update-member operations are available for static upstream pools only. DNS/file/HTTP-discovery pools reject them because discovery refresh owns the live member set."
to = "Les operations runtime add/remove/update-member sont disponibles uniquement pour les pools upstream statiques. Les pools DNS/file/HTTP-discovery les rejettent car le refresh de discovery possede l'ensemble live des membres."

[[phrase]]
from = "Runtime weight changes are available for round-robin and least-* selectors. Hash/ring selectors need future table-rebuild semantics before runtime weights are accepted there."
to = "Les changements de poids runtime sont disponibles pour les selecteurs round-robin et least-*. Les selecteurs hash/ring necessitent une future semantique de reconstruction de table avant d'accepter les poids runtime."

[[phrase]]
from = "Bounded-load consistent hashing is local to one Fluxheim process. It avoids selecting an over-bound hash target when another eligible ring candidate is available, but it does not coordinate load across multiple Fluxheim nodes."
to = "Le hashing consistent bounded-load est local a un processus Fluxheim. Il evite de selectionner une cible de hash au-dessus de la limite lorsqu'un autre candidat de ring eligible est disponible, mais ne coordonne pas la charge entre plusieurs noeuds Fluxheim."

[[phrase]]
from = "UDP, GSLB/DNS steering, WAF, VPN/firewall appliance behavior, and scripted iRules/Lua/Wasm behavior are intentionally separate roadmap lines."
to = "UDP, pilotage GSLB/DNS, WAF, comportement d'appliance VPN/firewall et comportement scriptable iRules/Lua/Wasm sont volontairement des lignes de roadmap separees."

