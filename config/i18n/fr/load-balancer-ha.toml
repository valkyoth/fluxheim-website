locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Load Balancer HA Design Notes"
to = "Notes de conception HA du load balancer"

[[phrase]]
from = "ships managed affinity cookies for one process. This document records the active-active HA design boundary for later"
to = "livre des cookies d'affinite geres pour un processus. Ce document consigne la limite de conception HA active-active pour des travaux"

[[phrase]]
from = "work so operators can separate shipped behavior from planned cluster behavior."
to = "ulterieurs afin que les operateurs puissent separer le comportement livre du comportement cluster planifie."

[[phrase]]
from = "Current 1.5.3 Behavior"
to = "Comportement actuel 1.5.3"

[[phrase]]
from = "emits a signed, opaque cookie on eligible 2xx/3xx backend responses."
to = "emet un cookie signe et opaque sur les reponses backend 2xx/3xx eligibles."

[[phrase]]
from = "Cookie values map to the local bounded persistence table."
to = "Les valeurs de cookie se mappent vers la table de persistance locale bornee."

[[phrase]]
from = "Signing keys are generated locally, rotate daily, and verify the current or previous generation."
to = "Les cles de signature sont generees localement, tournent chaque jour et verifient la generation courante ou precedente."

[[phrase]]
from = "Persistence tables and signing keys are not shared between Fluxheim nodes."
to = "Les tables de persistance et les cles de signature ne sont pas partagees entre les noeuds Fluxheim."

[[phrase]]
from = "Process restart invalidates unmanaged local state and starts a new signing key lineage."
to = "Un redemarrage de processus invalide l'etat local non gere et demarre une nouvelle lignee de cles de signature."

[[phrase]]
from = "Future Active-Active Shape"
to = "Forme active-active future"

[[phrase]]
from = "The planned HA track should replicate only bounded, operationally useful state:"
to = "La piste HA prevue ne doit repliquer que l'etat borne et utile aux operations :"

[[phrase]]
from = "managed-cookie key-to-backend affinity table entries;"
to = "entrees de table d'affinite cle managed-cookie vers backend ;"

[[phrase]]
from = "application-cookie or header persistence decisions when explicitly opted in;"
to = "decisions de persistance par cookie applicatif ou header lorsqu'elles sont explicitement activees ;"

[[phrase]]
from = "administrative member overrides such as"
to = "overrides administratifs de membres tels que"

[[phrase]]
from = "optionally passive-health/circuit state after split-brain and freshness rules are proven."
to = "eventuellement etat passive-health/circuit apres preuve des regles split-brain et freshness."

[[phrase]]
from = "Retry budgets, queue counters, high-cardinality telemetry, and low-value per-request counters should stay node-local unless a later design proves that replication is bounded and useful."
to = "Les budgets de retry, compteurs de queue, telemetrie a forte cardinalite et compteurs par requete de faible valeur doivent rester locaux au noeud, sauf si un design ulterieur prouve qu'une replication est bornee et utile."

[[phrase]]
from = "Peer Protocol Requirements"
to = "Exigences du protocole peer"

[[phrase]]
from = "Any cookie-mirroring implementation must include:"
to = "Toute implementation de mirroring de cookies doit inclure :"

[[phrase]]
from = "mutually authenticated peers;"
to = "peers mutuellement authentifies ;"

[[phrase]]
from = "bounded message size and bounded table sizes;"
to = "taille de message bornee et tailles de tables bornees ;"

[[phrase]]
from = "per-entry TTL and table eviction;"
to = "TTL par entree et eviction de table ;"

[[phrase]]
from = "replay protection through monotonic sequence numbers or signed timestamps;"
to = "protection anti-rejeu par numeros de sequence monotones ou timestamps signes ;"

[[phrase]]
from = "explicit fail-open/fail-closed behavior when peers are unavailable;"
to = "comportement fail-open/fail-closed explicite quand les peers sont indisponibles ;"

[[phrase]]
from = "audit events for peer joins, state import/export, and rejected updates;"
to = "evenements d'audit pour joins de peers, import/export d'etat et updates rejetes ;"

[[phrase]]
from = "metrics for replication lag, dropped updates, rejected updates, and peer health;"
to = "metriques pour lag de replication, updates abandonnes, updates rejetes et sante des peers ;"

[[phrase]]
from = "key rotation that supports overlap across the cluster, not only one process."
to = "rotation de cles prenant en charge le chevauchement dans le cluster, pas seulement dans un processus."

[[phrase]]
from = "Non-Goals For 1.5.3"
to = "Non-objectifs pour 1.5.3"

[[phrase]]
from = "<code>1.5.3</code> does not implement shared signing keys, restart-persistent state, cross-node persistence-table synchronization, or active-active cookie mirroring. Those remain future HA/control-plane work after the local managed-cookie path has passed release and pentest coverage."
to = "<code>1.5.3</code> n'implemente pas de cles de signature partagees, d'etat persistant au redemarrage, de synchronisation cross-node des tables de persistance ni de mirroring active-active des cookies. Ces points restent de futurs travaux HA/control-plane apres que le chemin managed-cookie local a passe la couverture release et pentest."
