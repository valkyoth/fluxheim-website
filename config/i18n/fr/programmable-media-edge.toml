locale_id = "fr-FR"
html_lang = "fr-FR"
[[phrase]]
from = "Programmable Media Edge — Fluxheim Source Docs"
to = "Media edge programmable - Documentation source Fluxheim"
[[phrase]]
from = "Programmable Media Edge"
to = "Media edge programmable"
[[phrase]]
from = "Status: far-future optional module family."
to = "Statut: famille de modules optionnelle a tres long terme."
[[phrase]]
from = "Planned Cargo features:"
to = "Features Cargo prevues :"
[[phrase]]
from = "This track is for media-aware video delivery. It is intentionally separate from the image filter because video processing has a much larger blast radius: manifests, segments, timed metadata, encryption, ad policy, privacy, DRM boundaries, and bandwidth cost all interact."
to = "Cette piste concerne la diffusion video consciente des medias. Elle est separee intentionnellement du filtre d'image, car le traitement video a un rayon d'impact bien plus large: manifestes, segments, metadonnees temporelles, chiffrement, policy publicitaire, confidentialite, frontieres DRM et cout de bande passante interagissent."
[[phrase]]
from = "Keep all video-aware code out of default builds."
to = "Garder tout le code conscient de la video hors des builds par defaut."
[[phrase]]
from = "Start with HLS/DASH manifest parsing and rewriting, not bitstream manipulation."
to = "Commencer par le parsing et la reecriture de manifestes HLS/DASH, pas par la manipulation de bitstream."
[[phrase]]
from = "Preserve normal static/proxy behavior when no media policy is configured."
to = "Preserver le comportement statique/proxy normal lorsqu'aucune media policy n'est configuree."
[[phrase]]
from = "Treat media requests as structured state, not plain text or arbitrary binary blobs."
to = "Traiter les requetes media comme un etat structure, pas comme du texte brut ni des blobs binaires arbitraires."
[[phrase]]
from = "Bound manifest size, segment size, parser complexity, outbound subrequests, cache footprint, and per-vhost media concurrency."
to = "Borner taille de manifeste, taille de segment, complexite du parseur, sous-requetes sortantes, empreinte cache et concurrence media par vhost."
[[phrase]]
from = "identity-aware routing, cache, metrics, and privacy profiles only through explicit policy."
to = "le routage sensible a l'identite, le cache, les metrics et les profils de confidentialite uniquement via une policy explicite."
[[phrase]]
from = "Stage 1: Manifest Engine"
to = "Etape 1 : moteur de manifestes"
[[phrase]]
from = "The first realistic milestone is a manifest-aware engine."
to = "Le premier jalon realiste est un moteur conscient des manifestes."
[[phrase]]
from = "Planned behavior:"
to = "Comportement prevu :"
[[phrase]]
from = "parse HLS playlists ("
to = "parser les playlists HLS ("
[[phrase]]
from = "parse DASH manifests ("
to = "parser les manifestes DASH ("
[[phrase]]
from = ") after XML parser review;"
to = ") apres revue du parseur XML;"
[[phrase]]
from = "normalize and validate segment URLs;"
to = "normaliser et valider les URL de segments;"
[[phrase]]
from = "reject traversal, absolute URL escapes, unexpected schemes, and manifest recursion loops;"
to = "rejeter traversal, echappements d'URL absolues, schemas inattendus et boucles de recursion de manifestes;"
[[phrase]]
from = "rewrite segment URLs for signed routes, cache routes, or media policy routes;"
to = "reecrire les URL de segments pour des routes signees, routes de cache ou routes de media policy;"
[[phrase]]
from = "inject or remove safe timed metadata only when explicitly configured;"
to = "injecter ou retirer des metadonnees temporelles sures uniquement lorsque c'est configure explicitement;"
[[phrase]]
from = "expose manifest metrics such as variant count, segment count, target duration, and parse errors."
to = "exposer des metrics de manifeste comme nombre de variantes, nombre de segments, duree cible et erreurs de parsing."
[[phrase]]
from = "This is the best first step because it avoids decoding video while still unlocking media-specific routing and cache behavior."
to = "C'est le meilleur premier pas, car il evite de decoder la video tout en debloquant un routage et un comportement cache propres aux medias."
[[phrase]]
from = "Stage 2: Segment-Aware Cache And Routing"
to = "Etape 2 : cache et routage conscients des segments"
[[phrase]]
from = "Video segments should not be treated exactly like arbitrary files."
to = "Les segments video ne doivent pas etre traites exactement comme des fichiers arbitraires."
[[phrase]]
from = "identify HLS TS, fMP4, and DASH segment requests;"
to = "identifier les requetes de segments HLS TS, fMP4 et DASH;"
[[phrase]]
from = "isolate cache keys by vhost, route, asset ID, representation, byte range, media sequence, encryption key ID, and policy version;"
to = "isoler les cles de cache par vhost, route, ID d'asset, representation, plage d'octets, sequence media, ID de cle de chiffrement et version de policy;"
[[phrase]]
from = "support bounded range requests for segments;"
to = "prendre en charge les requetes range bornees pour les segments;"
[[phrase]]
from = ", segment immutability policy, and live-window TTLs;"
to = ", la policy d'immutabilite des segments et les TTL de fenetre live;"
[[phrase]]
from = "support stale segment serving only when explicitly safe;"
to = "prendre en charge le service de segments stale seulement lorsqu'il est explicitement sur;"
[[phrase]]
from = "expose per-vhost media cache metrics when"
to = "exposer des metrics de cache media par vhost lorsque"
[[phrase]]
from = "Security baseline:"
to = "Baseline de securite :"
[[phrase]]
from = "never cache personalized encrypted segments unless the policy explicitly marks the variant safe;"
to = "ne jamais mettre en cache des segments chiffres personnalises sauf si la policy marque explicitement la variante comme sure;"
[[phrase]]
from = "never mix users, tenants, regions, or entitlement policies in one segment cache key;"
to = "ne jamais melanger utilisateurs, tenants, regions ou policies d'entitlement dans une seule cle de cache de segment;"
[[phrase]]
from = "never cache media keys or authorization tokens."
to = "ne jamais mettre en cache les cles media ni les tokens d'autorisation."
[[phrase]]
from = "Stage 3: Dynamic Manifest Stitching"
to = "Etape 3 : stitching dynamique de manifestes"
[[phrase]]
from = "Dynamic stitching should operate at the manifest level before any bitstream work is attempted."
to = "Le stitching dynamique doit fonctionner au niveau du manifeste avant toute tentative de travail sur le bitstream."
[[phrase]]
from = "replace configured ad markers with media segment URLs selected by a trusted decision service;"
to = "remplacer les marqueurs publicitaires configures par des URL de segments media choisies par un service de decision fiable;"
[[phrase]]
from = "support per-vhost ad policy;"
to = "prendre en charge une policy publicitaire par vhost;"
[[phrase]]
from = "claims for audience segments;"
to = "des claims pour les segments d'audience;"
[[phrase]]
from = "keep ad decision timeouts isolated from the primary request;"
to = "isoler les timeouts de decision publicitaire de la requete primaire;"
[[phrase]]
from = "fail closed or fall back according to explicit policy;"
to = "echouer ferme ou faire fallback selon une policy explicite;"
[[phrase]]
from = "log only decision IDs and policy IDs, not raw user profiles."
to = "journaliser uniquement les ID de decision et de policy, pas les profils utilisateur bruts."
[[phrase]]
from = "WASM policy plugins may be evaluated later, but only inside a strict sandbox with CPU, memory, wall-time, outbound-network, and host-call limits."
to = "Des plugins de policy WASM peuvent etre evalues plus tard, mais seulement dans une sandbox stricte avec limites CPU, memoire, wall-time, reseau sortant et appels hote."
[[phrase]]
from = "Stage 4: Forensic Watermarking"
to = "Etape 4 : watermarking forensique"
[[phrase]]
from = "Forensic watermarking is high value but high risk. It should remain research until the media parser, cache model, and privacy model are mature."
to = "Le watermarking forensique a une forte valeur mais un risque eleve. Il doit rester en recherche jusqu'a maturite du parseur media, du modele de cache et du modele de confidentialite."
[[phrase]]
from = "Safer first options:"
to = "Premieres options plus sures :"
