to = "capacite a desactiver les identifiants bases sur l'IP et a utiliser des identifiants de compte/session seulement lorsqu'une policy licite le permet."
[[phrase]]
from = "Stage 5: Transmuxing And Packaging"
to = "Etape 5 : transmuxing et packaging"
[[phrase]]
from = "Edge transmuxing is a research track, not an early production feature."
to = "Le transmuxing edge est une piste de recherche, pas une feature de production precoce."
