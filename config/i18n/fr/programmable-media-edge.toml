to = "marqueurs forensiques au niveau manifeste;"
[[phrase]]
from = "personalized segment URL tokens;"
to = "tokens d'URL de segments personnalises;"
[[phrase]]
from = "timed metadata markers where the player and workflow support them."
to = "marqueurs de metadonnees temporelles la ou le player et le workflow les prennent en charge."
[[phrase]]
