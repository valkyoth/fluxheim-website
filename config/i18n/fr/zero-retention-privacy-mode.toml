locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Zero-Retention Privacy Mode — Fluxheim Source Docs"
to = "Mode privacy zero-retention - Documentation source Fluxheim"

[[phrase]]
from = "Zero-Retention Privacy Mode"
to = "Mode privacy zero-retention"

[[phrase]]
from = "Zero-retention privacy mode is a future compile-time build profile for users who want Fluxheim to serve static files and reverse-proxy requests without persisting request logs, client IPs, request metadata, or per-client telemetry."
to = "Le mode privacy zero-retention est un futur profil de build a la compilation pour les utilisateurs qui veulent que Fluxheim serve des fichiers statiques et reverse-proxy des requetes sans conserver les logs de requete, IP client, metadonnees de requete ou telemetrie par client."

[[phrase]]
from = "This is the better name for the requested \"dark mode\": the goal is not visual appearance, but no application-level retention."
to = "C'est le meilleur nom pour le \"dark mode\" demande: l'objectif n'est pas l'apparence visuelle, mais l'absence de retention au niveau applicatif."

[[phrase]]
from = "Honest Boundary"
to = "Frontiere honnete"

[[phrase]]
from = "Fluxheim cannot be literally zero-knowledge at the network layer. A TCP/TLS server necessarily sees the peer address transiently while accepting and routing a connection. The operating system, container runtime, firewall, CDN, and upstream applications may also log traffic."
to = "Fluxheim ne peut pas etre litteralement zero-knowledge au niveau reseau. Un serveur TCP/TLS voit necessairement l'adresse du pair de facon transitoire pendant l'acceptation et le routage d'une connexion. Le systeme d'exploitation, la runtime conteneur, le firewall, le CDN et les applications upstream peuvent aussi journaliser le trafic."

[[phrase]]
from = "The privacy-mode guarantee should be scoped to Fluxheim itself:"
to = "La garantie du privacy-mode doit etre limitee a Fluxheim lui-meme:"

[[phrase]]
from = "no Fluxheim access logs;"
to = "pas d'access logs Fluxheim;"

[[phrase]]
from = "no Fluxheim request audit logs;"
to = "pas d'audit logs de requete Fluxheim;"

[[phrase]]
from = "no Fluxheim request metrics;"
to = "pas de metriques de requete Fluxheim;"

[[phrase]]
from = "no persisted client IPs;"
to = "pas d'IP client persistantes;"

[[phrase]]
from = "no persisted request paths, user agents, cookies, request IDs, or real-IP headers;"
to = "pas de chemins de requete, user-agents, cookies, request IDs ou headers real-IP persistants;"

[[phrase]]
from = "no Fluxheim disk cache of proxied responses;"
to = "pas de cache disque Fluxheim pour les reponses proxifiees;"

[[phrase]]
from = "no client-IP forwarding to upstreams by default."
to = "pas de forwarding d'IP client vers les upstreams par defaut."

[[phrase]]
from = "Operators still need to configure the OS, Podman/systemd, firewall, CDN, and upstream services consistently if they want a whole deployment to be zero-retention."
to = "Les operateurs doivent toujours configurer l'OS, Podman/systemd, le firewall, le CDN et les services upstream de facon coherente s'ils veulent qu'un deploiement complet soit zero-retention."

