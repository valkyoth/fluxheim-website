from = "when an upstream Pingora release exposes equivalent rustls server certificate resolver support and applies per-peer rustls upstream verification policy without requiring ALPN or mTLS to clone the client config first, and exposes an equivalent pre-TLS listener PROXY protocol receive hook with trusted peer enforcement."
to = "lorsqu'une release Pingora upstream expose un support equivalent de resolver de certificat serveur rustls, applique une policy de verification upstream rustls par peer sans exiger ALPN ou mTLS pour cloner d'abord la config client, et expose un hook equivalent pre-TLS de reception du protocole PROXY cote listener avec enforcement des peers de confiance."

