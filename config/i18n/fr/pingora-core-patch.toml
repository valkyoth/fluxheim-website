to = "Pour les builds OpenSSL-only,"

[[phrase]]
from = "owns the native downstream"
to = "possede le builder downstream natif"

[[phrase]]
from = "builder for the fallback-certificate listener path. It applies certificate/key loading, ALPN, cipher, curve, minimum protocol, and client-auth CA policy with typed errors. It also owns OpenSSL SNI certificate storage, reload, pending managed-certificate handling, and certificate application. The remaining Pingora layer is a thin"
to = "pour le chemin listener a certificat de fallback. Il applique le chargement certificat/cle, ALPN, cipher, curve, protocole minimal et policy CA client-auth avec des erreurs typees. Il possede aussi le stockage de certificats SNI OpenSSL, le reload, la gestion des certificats geres pending et l'application de certificats. La couche Pingora restante est un mince"

[[phrase]]
from = "adapter until production listener cutover."
to = "adapter jusqu'au cutover du listener production."

[[phrase]]
from = "has a native rustls HTTP/1 listener preview that accepts a ready"
to = "a une preview de listener HTTP/1 rustls native qui accepte une"

[[phrase]]
from = ", bounds the TLS handshake, and then hands the stream to the same native HTTP/1 parser/handler path used by plain listeners. OpenSSL-only builds also have a matching native HTTP/1 listener preview that accepts an"
to = "prete, borne le handshake TLS, puis transmet le flux au meme chemin parser/handler HTTP/1 natif que les listeners plain. Les builds OpenSSL-only ont aussi une preview de listener HTTP/1 native correspondante qui accepte un"

[[phrase]]
from = ", bounds the handshake, and uses the same native parser/handler. These are the intended replacement paths for the compatibility listener patch once the runtime cutover wires them into official profiles."
to = ", borne le handshake et utilise le meme parser/handler natif. Ce sont les chemins de remplacement prevus pour le patch de listener de compatibilite une fois que le cutover runtime les cable dans les profils officiels."

[[phrase]]
from = "Rustls Upstream Verification Policy"
to = "Policy de verification upstream rustls"

[[phrase]]
from = "Fluxheim also patches the rustls upstream connector so per-peer"
to = "Fluxheim patche aussi le connecteur upstream rustls afin que les policies par peer"

[[phrase]]
from = "policies apply even when no other setting forced Pingora to clone the rustls client config. In Pingora 0.8, the dangerous verifier path was only installed when a cloned config already existed for ALPN or upstream mTLS. Fluxheim exposes explicit upstream TLS verification controls, so the connector must clone the config and install the custom verifier whenever verification is disabled or SNI is absent."
to = "s'appliquent meme lorsqu'aucun autre parametre n'a force Pingora a cloner la config client rustls. Dans Pingora 0.8, le chemin de verifier dangereux n'etait installe que lorsqu'une config clonee existait deja pour ALPN ou le mTLS upstream. Fluxheim expose des controles explicites de verification TLS upstream, donc le connecteur doit cloner la config et installer le verifier custom chaque fois que la verification est desactivee ou que SNI est absent."

[[phrase]]
from = "This is a temporary compatibility patch, not a long-term fork. Keep it small, easy to audit, and limited to the rustls certificate resolver and upstream verification-policy gaps."
to = "C'est un patch temporaire de compatibilite, pas un fork long terme. Gardez-le petit, facile a auditer et limite aux ecarts du resolver de certificat rustls et de la policy de verification upstream."

[[phrase]]
from = "Listener PROXY Protocol Receive"
to = "Reception du protocole PROXY cote listener"

[[phrase]]
from = "Fluxheim also patches Pingora listeners with an opt-in PROXY protocol receive hook that runs after the TCP accept and before downstream TLS or HTTP parsing. The patch adds:"
to = "Fluxheim patche aussi les listeners Pingora avec un hook opt-in de reception du protocole PROXY qui s'execute apres l'accept TCP et avant le parsing TLS ou HTTP downstream. Le patch ajoute :"

[[phrase]]
from = "bounded v1 line parsing with the HAProxy 108-byte limit and bounded v2 payload parsing;"
to = "parsing borne de ligne v1 avec la limite HAProxy de 108 octets et parsing borne de payload v2 ;"

[[phrase]]
from = "mandatory direct-peer trust checks before parsing;"
to = "controles obligatoires de confiance du peer direct avant parsing ;"

[[phrase]]
from = "socket-digest peer-address replacement only after a trusted, valid v1/v2 header."
to = "remplacement de l'adresse peer dans le socket digest seulement apres un header v1/v2 fiable et valide."

[[phrase]]
from = "This is needed because Fluxheim must restore client identity before TLS and HTTP handling when it sits behind a trusted load balancer that speaks PROXY protocol. The v2 parser currently supports TCP4/TCP6 plus LOCAL/UNSPEC frames and skips bounded TLV payloads; TLV interpretation is intentionally not included."
to = "C'est necessaire car Fluxheim doit restaurer l'identite client avant le traitement TLS et HTTP lorsqu'il se trouve derriere un load balancer de confiance qui parle le protocole PROXY. Le parser v2 supporte actuellement TCP4/TCP6 plus les frames LOCAL/UNSPEC et saute les payloads TLV bornes ; l'interpretation TLV n'est volontairement pas incluse."

