[[phrase]]
from = ", the resolver implementation itself lives in"
to = ", l'implementation du resolver elle-meme vit dans"

[[phrase]]
from = ": Fluxheim owns wildcard/exact SNI lookup, the reloadable certificate table, PEM certificate/private-key parsing, and TLS-ALPN challenge certificate loading. The vendored Pingora patch is now only the temporary listener acceptor hook that lets the compatibility runtime pass that resolver into rustls. This keeps Pingora's"
to = ": Fluxheim possede le lookup SNI wildcard/exact, la table de certificats rechargeable, le parsing certificat/cle privee PEM et le chargement des certificats de challenge TLS-ALPN. Le patch Pingora vendore n'est plus que le hook temporaire d'accepteur listener qui laisse le runtime de compatibilite passer ce resolver a rustls. Cela garde le comportement de panic"

[[phrase]]
from = "panic behavior isolated until the native downstream listener replaces the compatibility acceptor."
to = "de Pingora isole jusqu'a ce que le listener downstream natif remplace l'accepteur de compatibilite."

[[phrase]]
from = "also owns the native rustls downstream"
to = "possede aussi le builder downstream rustls natif"

[[phrase]]
from = "builder. That builder applies Fluxheim TLS policy and returns typed errors for protocol, cipher, group, client-auth, and FIPS reporting failures. Until the native listener is wired into production profiles, the compatibility runtime still mirrors the same policy into Pingora's"
to = ". Ce builder applique la policy TLS Fluxheim et retourne des erreurs typees pour les echecs de protocole, cipher, groupe, client-auth et reporting FIPS. Tant que le listener natif n'est pas cable dans les profils production, le runtime de compatibilite reflete encore la meme policy dans le shim"

[[phrase]]
