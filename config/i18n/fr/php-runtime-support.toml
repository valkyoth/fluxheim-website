[[phrase]]
from = "PHP Runtime Support"
to = "Prise en charge du runtime PHP"
[[phrase]]
from = "adds the first production-compatible PHP path through"
to = "ajoute le premier chemin PHP compatible production via"
[[phrase]]
from = ". PHP is not part of the default binary. Each PHP runtime changes the security model from serving files and proxying HTTP to executing user code, so every PHP path is opt-in at compile time and opt-in per vhost or route."
to = ". PHP ne fait pas partie du binaire par defaut. Chaque runtime PHP change le modele de securite, qui passe du service de fichiers et du proxy HTTP a l'execution de code utilisateur ; chaque chemin PHP est donc opt-in a la compilation et par vhost ou route."
[[phrase]]
from = "Use this implementation model:"
to = "Utiliser ce modele d'implementation :"
[[phrase]]
from = ": stable backwards-compatible path for PHP applications. This is implemented in"
to = " : chemin stable et retrocompatible pour les applications PHP. C'est implemente dans"
[[phrase]]
from = "<li>Managed <code>php-fpm</code>: zero-admin deployment mode inside the existing <code>php-fpm</code> feature. Fluxheim generates a minimal private php-fpm pool, spawns and supervises php-fpm, and connects to its private socket while still using the same FastCGI request path as external php-fpm.</li>"
to = "<li><code>php-fpm</code> gere : mode de deploiement zero-admin dans la feature existante <code>php-fpm</code>. Fluxheim genere un pool php-fpm prive minimal, demarre et supervise php-fpm, puis se connecte a son socket prive tout en utilisant le meme chemin de requete FastCGI que php-fpm externe.</li>"
[[phrase]]
from = "feature. Fluxheim generates a minimal private php-fpm pool, spawns and supervises php-fpm, and connects to its private socket while still using the same FastCGI request path as external php-fpm."
to = "Fluxheim genere un pool php-fpm prive minimal, demarre et supervise php-fpm, puis se connecte a son socket prive tout en utilisant le meme chemin de requete FastCGI que php-fpm externe."
