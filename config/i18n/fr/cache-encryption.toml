[[phrase]]
from = "Fluxheim accepts HTTPS OpenBao URLs, plus loopback HTTP URLs for local testing. Non-loopback plaintext HTTP OpenBao addresses are rejected. Transit encrypt/decrypt calls do not follow HTTP redirects, and Transit JSON responses are read through a bounded buffer before parsing so a compromised or misconfigured OpenBao endpoint cannot stream unbounded response bodies into the cache process."
to = "Fluxheim accepte les URLs OpenBao HTTPS, plus les URLs HTTP loopback pour les tests locaux. Les adresses OpenBao HTTP en clair hors loopback sont rejetees. Les appels Transit encrypt/decrypt ne suivent pas les redirections HTTP, et les reponses JSON Transit sont lues via un buffer borne avant parsing afin qu'un endpoint OpenBao compromis ou mal configure ne puisse pas streamer des corps de reponse non bornes dans le processus cache."

