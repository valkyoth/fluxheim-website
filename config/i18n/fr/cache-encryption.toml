to = "et stocke seulement le"

[[phrase]]
from = "ciphertext in the cache backend. Use this when key custody, audit trails, and centralized rotation matter more than the added call latency on disk-cache reads and writes. Because the Transit API encrypts one complete plaintext value per request, Fluxheim caps concurrent OpenBao encrypted commit heap usage and can refuse a large cache fill under pressure rather than buffering too many objects at once."
to = "ciphertext retourne dans le backend de cache. Utiliser ceci lorsque la garde des cles, les pistes d'audit et la rotation centralisee comptent plus que la latence d'appel ajoutee aux lectures et ecritures du cache disque. Comme l'API Transit chiffre une valeur plaintext complete par requete, Fluxheim limite l'usage heap concurrent des commits chiffres OpenBao et peut refuser un gros remplissage de cache sous pression plutot que de bufferiser trop d'objets a la fois."

