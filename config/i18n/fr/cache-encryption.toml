to = "Garder le chiffrement du cache opt-in. Il ajoute du travail CPU pour le chiffrement par cle locale et une dependance reseau/service pour OpenBao Transit."

[[phrase]]
from = "Prefer the local provider when large filesystem cache fills must preserve streaming memory behavior; OpenBao Transit is a whole-object external crypto boundary by design."
to = "Preferer le provider local lorsque de gros remplissages de cache filesystem doivent preserver le comportement memoire streaming ; OpenBao Transit est par conception une frontiere crypto externe whole-object."

[[phrase]]
from = "for high-churn encrypted caches that would otherwise create many small encrypted object files."
to = "pour les caches chiffres a forte rotation qui creeraient sinon beaucoup de petits fichiers objet chiffres."

[[phrase]]
from = "Use memory plus encrypted disk when hot objects should remain fast but disk persistence must be protected."
to = "Utiliser la memoire plus disque chiffre lorsque les objets chauds doivent rester rapides mais que la persistance disque doit etre protegee."

[[phrase]]
