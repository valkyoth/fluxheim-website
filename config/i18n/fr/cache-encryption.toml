[[phrase]]
from = "uses AES-256-GCM with a 64-character hex key loaded from one safe file or credential. It is simple and fast, but Fluxheim must be able to read the raw cache key at startup. Filesystem disk-cache fills use bounded encrypted chunks with this provider, preserving the streaming memory profile of plain filesystem cache writes."
to = "utilise AES-256-GCM avec une cle hex de 64 caracteres chargee depuis un fichier ou credential sur. C'est simple et rapide, mais Fluxheim doit pouvoir lire la cle brute du cache au demarrage. Les remplissages de cache disque filesystem utilisent des chunks chiffres bornes avec ce provider, preservant le profil memoire streaming des ecritures de cache filesystem simples."

[[phrase]]
