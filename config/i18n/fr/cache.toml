locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Fluxheim's cache system supports memory, disk, tiered, and encrypted backends with route-scoped policies, cache locks, stale serving, distributed peer fill, and range caching."
to = "Le système de cache de Fluxheim prend en charge les backends mémoire, disque, hiérarchisés et chiffrés avec des politiques par route, des verrous de cache, le service stale, le peer fill distribué et le range caching."

[[phrase]]
from = "Enabling Cache"
to = "Activation du cache"

[[phrase]]
from = "The <code>cache</code> Cargo feature must be compiled in (default in pre-built binaries). Runtime cache is disabled until configured per-vhost."
to = "La fonctionnalité Cargo <code>cache</code> doit être compilée (par défaut dans les binaires précompilés). Le cache runtime reste désactivé jusqu'à sa configuration par vhost."

[[phrase]]
from = "fluxheim.toml — basic memory cache"
to = "fluxheim.toml - cache mémoire basique"

[[phrase]]
from = "Cache Backends"
to = "Backends de cache"

[[phrase]]
from = "Memory Cache"
to = "Cache mémoire"

[[phrase]]
from = "Fast in-process LRU cache. Lost on restart. Best for frequently accessed small-to-medium objects."
to = "Cache LRU rapide dans le processus. Perdu au redémarrage. Idéal pour les petits et moyens objets fréquemment consultés."

[[phrase]]
from = "Disk Cache"
to = "Cache disque"

[[phrase]]
from = "Persistent on-disk cache. Survives restarts. The storage-bin backend (v1.2.2+) is optimised for larger, high-churn caches."
to = "Cache persistant sur disque. Survit aux redémarrages. Le backend storage-bin (v1.2.2+) est optimisé pour les caches plus volumineux à fort renouvellement."

[[phrase]]
from = "Tiered Cache"
to = "Cache hiérarchisé"

[[phrase]]
from = "Hot memory tier backed by disk. Objects are promoted to memory on repeated access and written through to disk for persistence."
to = "Niveau mémoire chaud adossé au disque. Les objets sont promus en mémoire lors d'accès répétés et écrits sur disque pour la persistance."

[[phrase]]
from = "Encrypted Disk Cache"
to = "Cache disque chiffré"

[[phrase]]
from = "Available since v1.2.3. Cache objects are encrypted at rest using a local key or an OpenBao Transit engine."
to = "Disponible depuis v1.2.3. Les objets de cache sont chiffrés au repos avec une clé locale ou un moteur OpenBao Transit."

[[phrase]]
from = "Cache Policies"
to = "Politiques de cache"

[[phrase]]
from = "Cache Lock (Stampede Prevention)"
to = "Verrou de cache (prévention du stampede)"

[[phrase]]
from = "With <code>[vhosts.cache.lock].enabled = true</code>, only one upstream request is made per cache key when a miss occurs. Other requests wait for the fill to complete and are served from cache."
to = "Avec <code>[vhosts.cache.lock].enabled = true</code>, une seule requête upstream est envoyée par clé de cache lors d'un miss. Les autres requêtes attendent la fin du remplissage et sont servies depuis le cache."

[[phrase]]
from = "Stale While Revalidate"
to = "Stale While Revalidate"

[[phrase]]
from = "With <code>stale_while_revalidate_secs</code>, expired cache entries are served immediately while a background request fills the cache with fresh content. Eliminates tail latency on cache expiry."
to = "Avec <code>stale_while_revalidate_secs</code>, les entrées de cache expirées sont servies immédiatement pendant qu'une requête en arrière-plan remplit le cache avec du contenu frais. Élimine la latence de queue à l'expiration du cache."

[[phrase]]
from = "Distributed Peer Fill"
to = "Peer fill distribué"

[[phrase]]
from = "Available since v1.2.4. When a request misses the local cache, Fluxheim can fetch from a cache peer before going to the upstream origin. Uses a safe"
to = "Disponible depuis v1.2.4. Lorsqu'une requête manque le cache local, Fluxheim peut récupérer auprès d'un pair de cache avant d'aller vers l'origine upstream. Utilise une sémantique sûre"

[[phrase]]
from = "semantics — if the peer doesn't have it, the request falls through to the origin."
to = "- si le pair ne l'a pas, la requête retombe vers l'origine."

[[phrase]]
from = "Range Caching"
to = "Range caching"

[[phrase]]
from = "Available since v1.2.5. Opt-in bounded range caching for large proxy-cache objects — useful for large media files and binary downloads."
to = "Disponible depuis v1.2.5. Range caching borné et optionnel pour les grands objets de proxy-cache, utile pour les gros fichiers média et téléchargements binaires."

[[phrase]]
from = "Fixed-Slice Range Cache (v1.2.6+)"
to = "Cache de ranges en tranches fixes (v1.2.6+)"

[[phrase]]
from = "Extended range-cache mode that supports open-ended, suffix, and multipart byte-range responses by composing cached fixed-size slices."
to = "Mode range-cache étendu qui prend en charge les réponses byte-range ouvertes, suffixes et multipart en composant des tranches de taille fixe mises en cache."

[[phrase]]
from = "Cache Operations"
to = "Opérations de cache"

[[phrase]]
from = "Fluxheim exposes protected cache status and purge endpoints through the admin API. Warming and key inspection are CLI operations."
to = "Fluxheim expose des endpoints protégés de statut et de purge du cache via l'API admin. Le warming et l'inspection des clés sont des opérations CLI."

[[phrase]]
from = "bash — admin API cache operations"
to = "bash - opérations de cache via l'API admin"

[[phrase]]
from = "Local Static-File Caching"
to = "Cache local des fichiers statiques"

[[phrase]]
from = "Opt-in since v1.2.1. When <code>local_static = true</code> is enabled on the cache policy, Fluxheim caches static files from the local filesystem through the cache layer for hot-path performance."
to = "Optionnel depuis v1.2.1. Lorsque <code>local_static = true</code> est activé dans la politique de cache, Fluxheim met en cache les fichiers statiques du système de fichiers local via la couche de cache pour les chemins chauds."

[[phrase]]
from = "<p><strong>Privacy builds:</strong> The <code>cache</code> feature is compile-time incompatible with <code>privacy-mode</code>. Zero-retention deployments must use <code>--no-default-features</code> with <code>profile-privacy</code> to ensure no caching occurs.</p>"
to = "<p><strong>Builds privacy :</strong> La fonctionnalité <code>cache</code> est incompatible avec <code>privacy-mode</code> à la compilation. Les déploiements sans rétention doivent utiliser <code>--no-default-features</code> avec <code>profile-privacy</code> pour garantir qu'aucune mise en cache n'a lieu.</p>"

[[phrase]]
from = "Opt-in since v1.2.1. When"
to = "Optionnel depuis v1.2.1. Lorsque"

[[phrase]]
from = "Privacy builds:"
to = "Builds privacy :"

[[phrase]]
from = "feature is compile-time incompatible with"
to = "fonctionnalité est incompatible à la compilation avec"

[[phrase]]
from = ". Zero-retention deployments must use"
to = ". Les déploiements sans rétention doivent utiliser"

[[phrase]]
from = "to ensure no caching occurs."
to = "pour garantir qu'aucune mise en cache n'a lieu."
