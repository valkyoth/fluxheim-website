locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "GitHub Repository Setup"
to = "Configuration du repository GitHub"

[[phrase]]
from = "This document explains how to connect this local Fluxheim folder to a GitHub repository that already contains placeholder files such as <code>.gitignore</code>, <code>README.md</code>, and <code>LICENSE</code>."
to = "Ce document explique comment connecter ce dossier Fluxheim local a un repository GitHub qui contient deja des fichiers placeholders comme <code>.gitignore</code>, <code>README.md</code> et <code>LICENSE</code>."

[[phrase]]
from = "Before Connecting"
to = "Avant la connexion"

[[phrase]]
from = "From the Fluxheim folder:"
to = "Depuis le dossier Fluxheim :"

[[phrase]]
from = "If the project is not initialized yet:"
to = "Si le projet n'est pas encore initialise :"

[[phrase]]
from = "Fluxheim should keep <code>LICENSE</code> as <code>EUPL-1.2</code>. If the GitHub repository already has a different license file, decide before merging which license is authoritative."
to = "Fluxheim doit garder <code>LICENSE</code> en <code>EUPL-1.2</code>. Si le repository GitHub contient deja un fichier de licence different, decidez avant le merge quelle licence fait autorite."

[[phrase]]
from = "Recommended Safe Path"
to = "Chemin sur recommande"

[[phrase]]
from = "Use this when the remote has files you do not want to accidentally overwrite."
to = "Utilisez ceci lorsque le remote contient des fichiers que vous ne voulez pas ecraser par accident."

