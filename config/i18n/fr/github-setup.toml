[[phrase]]
from = "Open a pull request from <code>integrate-github-main</code> to <code>main</code>, or push to <code>main</code> after reviewing the diff."
to = "Ouvrez une pull request de <code>integrate-github-main</code> vers <code>main</code>, ou pushez vers <code>main</code> apres review du diff."

[[phrase]]
from = "Fast Path For Empty Placeholder Repositories"
to = "Chemin rapide pour repositories placeholders vides"

[[phrase]]
from = "Use this only if the remote files are truly empty/placeholders and you are comfortable replacing them with the local Fluxheim project."
to = "Utilisez ceci seulement si les fichiers remote sont vraiment vides/placeholders et si vous acceptez de les remplacer par le projet Fluxheim local."

[[phrase]]
from = "<code>--force-with-lease</code> is safer than plain <code>--force</code> because it refuses to overwrite new remote commits you have not fetched."
to = "<code>--force-with-lease</code> est plus sur que <code>--force</code> seul, car il refuse d'ecraser de nouveaux commits remote que vous n'avez pas fetches."

