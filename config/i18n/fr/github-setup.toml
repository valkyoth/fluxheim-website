to = "Si la branche remote s'appelle <code>master</code>, utilisez <code>origin/master</code> dans ces commandes ou renommez la branche remote dans GitHub avant de continuer."

[[phrase]]
from = "Create a local integration branch:"
to = "Creer une branche d'integration locale :"

[[phrase]]
from = "Merge the remote history:"
to = "Merger l'historique remote :"

[[phrase]]
from = "Resolve conflicts deliberately:"
to = "Resoudre les conflits deliberement :"

[[phrase]]
