[[phrase]]
from = "OpenTelemetry Tracing"
to = "Tracing OpenTelemetry"

[[phrase]]
from = "Status: stage 1 trace context propagation is implemented behind the optional"
to = "Statut : la propagation de contexte de trace de niveau 1 est implementee derriere la feature optionnelle"

[[phrase]]
from = "Cargo feature. A first bounded OTLP/HTTP trace exporter is implemented behind"
to = "Cargo. Un premier exporteur de traces OTLP/HTTP borne est implemente derriere"

[[phrase]]
from = "for local collectors and Jaeger test setups. Richer internal spans, sampling, exporter health, and TLS/gRPC export remain planned."
to = "pour les collecteurs locaux et les configurations de test Jaeger. Des spans internes plus riches, le sampling, l'etat de l'exporteur et l'export TLS/gRPC restent prevus."

[[phrase]]
from = "Cargo features:"
to = "Features Cargo :"

[[phrase]]
from = ": implemented propagation and access-log correlation."
to = " : propagation et correlation des access logs implementees."

[[phrase]]
from = ": implemented initial OTLP/HTTP JSON trace export."
to = " : premier export de traces JSON OTLP/HTTP implemente."

[[phrase]]
from = "Latest crate candidates checked on 2026-05-05:"
to = "Dernieres crates candidates verifiees le 2026-05-05 :"

[[phrase]]
from = "Tracing is different from metrics and logs. Metrics show aggregate behavior, logs record events, and traces explain the path of a specific request through Fluxheim and its upstream services."
to = "Le tracing est different des metriques et des logs. Les metriques montrent le comportement agrege, les logs enregistrent les evenements, et les traces expliquent le chemin d'une requete precise dans Fluxheim et ses services upstream."

[[phrase]]
from = "Design Goals"
to = "Objectifs de conception"

[[phrase]]
from = "Keep OpenTelemetry code out of default builds."
to = "Garder le code OpenTelemetry hors des builds par defaut."

[[phrase]]
from = "Use W3C Trace Context propagation."
to = "Utiliser la propagation W3C Trace Context."

[[phrase]]
from = "Correlate access logs, security events, and traces through a trace ID."
to = "Correler access logs, evenements de securite et traces via un ID de trace."

[[phrase]]
from = "Pair new operational observability with Prometheus metrics where practical: metrics provide aggregate service health, while OpenTelemetry explains the request path behind those aggregate signals."
to = "Associer la nouvelle observabilite operationnelle aux metriques Prometheus lorsque c'est pertinent : les metriques fournissent l'etat agrege du service, tandis qu'OpenTelemetry explique le chemin de requete derriere ces signaux agreges."

[[phrase]]
from = "Keep tracing overhead bounded through sampling and background export."
to = "Borner le surcout du tracing par sampling et export en arriere-plan."

[[phrase]]
from = "Avoid storing secrets, cookies, authorization headers, raw request bodies, or high-cardinality labels in spans."
to = "Eviter de stocker secrets, cookies, en-tetes d'autorisation, corps de requete bruts ou labels a forte cardinalite dans les spans."

[[phrase]]
from = "Make tracing incompatible with"
to = "Rendre le tracing incompatible avec"

[[phrase]]
from = "unless a future privacy-preserve propagation-only mode is explicitly designed."
to = "sauf si un futur mode propagation-only preservant la confidentialite est explicitement concu."

