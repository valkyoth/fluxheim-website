[[phrase]]
from = "Stage 3: OTLP Trace Export"
to = "Niveau 3 : export de traces OTLP"

[[phrase]]
from = "Trace export is optional and intended to send data to a local OpenTelemetry Collector or tracing backend. Prometheus can receive OTLP metrics over HTTP when its OTLP receiver is enabled, but it is not the direct trace storage target."
to = "L'export de traces est optionnel et sert a envoyer les donnees a un OpenTelemetry Collector local ou a un backend de tracing. Prometheus peut recevoir des metriques OTLP via HTTP lorsque son recepteur OTLP est active, mais ce n'est pas la cible directe de stockage des traces."

[[phrase]]
from = "Implemented in the first exporter:"
to = "Implemente dans le premier exporteur :"

[[phrase]]
from = "background worker;"
to = "worker en arriere-plan ;"

[[phrase]]
from = "bounded queue with drop-on-full behavior;"
to = "file bornee avec comportement drop-on-full ;"

[[phrase]]
from = "OTLP/HTTP JSON export to"
to = "export JSON OTLP/HTTP vers"

[[phrase]]
