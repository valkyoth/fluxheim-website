to = "exposer l'etat de l'exporteur via metriques/statut admin lorsque ces modules sont actives ;"

[[phrase]]
from = "support explicit overflow behavior:"
to = "prendre en charge un comportement d'overflow explicite :"

[[phrase]]
from = "never block request workers on collector availability;"
to = "ne jamais bloquer les workers de requete sur la disponibilite du collecteur ;"

[[phrase]]
from = "use HTTPS for remote collectors unless the network is already isolated and authenticated;"
to = "utiliser HTTPS pour les collecteurs distants sauf si le reseau est deja isole et authentifie ;"

[[phrase]]
from = "redact all configured sensitive fields before export."
to = "rediger tous les champs sensibles configures avant l'export."

[[phrase]]
from = "The exporter supports HTTP and HTTPS. Keep loopback HTTP for local collectors; use HTTPS for collector endpoints that cross a host or container trust boundary. When no private CA bundle is configured, the HTTPS client uses the bundled WebPKI roots. Plaintext HTTP to a non-loopback collector logs a startup warning."
to = "L'exporteur prend en charge HTTP et HTTPS. Garder HTTP en loopback pour les collecteurs locaux ; utiliser HTTPS pour les endpoints de collecteur qui franchissent une frontiere de confiance host ou conteneur. Lorsqu'aucun bundle CA prive n'est configure, le client HTTPS utilise les racines WebPKI embarquees. HTTP en clair vers un collecteur hors loopback journalise un avertissement au demarrage."

