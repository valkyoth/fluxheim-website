to = "bundle CA PEM pour collecteurs HTTPS a PKI privee ;"

[[phrase]]
from = "request-level server spans with trace ID, regenerated span ID, optional parent span ID, method, vhost, resolved route name, status, error flag, body byte counts, cache phase/timing, compression encoding, and PHP-FPM outcome when those modules are compiled in."
to = "spans serveur au niveau requete avec ID de trace, ID de span regenere, ID de span parent optionnel, methode, vhost, nom de route resolu, statut, flag d'erreur, compteurs d'octets de corps, phase/timing de cache, encodage de compression et resultat PHP-FPM lorsque ces modules sont compiles."

[[phrase]]
