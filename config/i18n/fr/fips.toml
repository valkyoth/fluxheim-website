[[phrase]]
from = "property query can fetch an approved cipher, enables OpenSSL default FIPS properties for the process, and verifies that the default fetch path rejects a non-FIPS cipher. The exact schema may grow when more backend proof fields are implemented. The important rule is fail closed: a FIPS/ISO-required config must not silently fall back to a non-validated provider or non-approved cipher."
to = "requete de propriete peut recuperer un cipher approuve, active les proprietes FIPS par defaut d'OpenSSL pour le processus et verifie que le chemin de fetch par defaut refuse un cipher non FIPS. Le schema exact peut evoluer lorsque davantage de champs de preuve backend seront implementes. La regle importante est fail closed: une config FIPS/ISO-required ne doit pas retomber silencieusement sur un provider non valide ou un cipher non approuve."
[[phrase]]
from = "completes the OpenSSL FIPS-capable TLS proof path with an opt-in feature, runtime provider probe, and default-property enforcement; it still does not make a blanket FIPS-compliance claim for the deployment."
to = "complete le chemin de preuve TLS compatible FIPS OpenSSL avec une feature opt-in, une sonde provider runtime et une enforcement des default-properties; il ne fait toujours pas de claim global de compliance FIPS pour le deploiement."
[[phrase]]
from = "are intentionally small proof profiles. They are useful for local provider validation and release evidence, but they are not the only valid way to build a FIPS/ISO-capable Fluxheim binary."
to = "sont volontairement de petits profils de preuve. Ils sont utiles pour la validation locale du provider et les preuves de release, mais ils ne sont pas le seul moyen valide de construire un binaire Fluxheim compatible FIPS/ISO."
[[phrase]]
from = "The recommended strict-boundary pattern is to use local/static certificate files generated and renewed by an approved external process. For conservative public-Web PKI evidence, configure that external process to use RSA 2048 or RSA 3072 certificate keys unless your assessor explicitly accepts an ECDSA profile and chain. Managed ACME can still be compiled into a FIPS-capable TLS binary by adding"
to = "Le modele strict-boundary recommande consiste a utiliser des fichiers de certificats locaux/statiques generes et renouveles par un processus externe approuve. Pour des preuves PKI web publique conservatrices, configurez ce processus externe pour utiliser des cles de certificat RSA 2048 ou RSA 3072 sauf si votre evaluateur accepte explicitement un profil et une chaine ECDSA. Managed ACME peut encore etre compile dans un binaire TLS compatible FIPS en ajoutant"
[[phrase]]
from = "Requires OpenSSL 3.x behavior for the FIPS property query path."
