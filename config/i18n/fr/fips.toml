[[phrase]]
from = "Request IDs and trace correlation IDs are treated as non-secret diagnostic identifiers. They are not used as authentication tokens, authorization decisions, key material, or SSPs."
to = "Les request IDs et trace correlation IDs sont traites comme des identifiants de diagnostic non secrets. Ils ne sont pas utilises comme tokens d'authentification, decisions d'autorisation, materiel de cle ou SSP."
[[phrase]]
from = "Temporary object names are used for collision resistance and race hardening, not for authentication or cryptographic secrecy. The OS RNG remains part of the deployment environment evidence."
to = "Les noms d'objets temporaires servent a la resistance aux collisions et au durcissement contre les races, pas a l'authentification ni au secret cryptographique. Le RNG de l'OS reste une partie des preuves de l'environnement de deploiement."
[[phrase]]
from = "Test and development certificate generation is not production evidence and must not be used to claim a regulated deployment boundary."
to = "La generation de certificats de test et developpement n'est pas une preuve de production et ne doit pas servir a revendiquer une frontiere de deploiement regulee."
[[phrase]]
from = "Admin authentication needs a provider-routed MAC or a different externally-evidenced authentication boundary."
