[[phrase]]
from = "FIPS-Capable Deployment — Fluxheim Source Docs"
to = "Deploiement compatible FIPS - Documentation source Fluxheim"
[[phrase]]
from = "FIPS / ISO-Capable Deployments"
to = "Deploiements compatibles FIPS / ISO"
[[phrase]]
from = "This document defines Fluxheim's FIPS 140-3 and ISO/IEC 19790 direction. It is intentionally strict about language: Fluxheim can provide FIPS/ISO-capable builds and fail-closed configuration enforcement, but Fluxheim itself is not a validated cryptographic module."
to = "Ce document definit la direction FIPS 140-3 et ISO/IEC 19790 de Fluxheim. Le langage est volontairement strict: Fluxheim peut fournir des builds compatibles FIPS/ISO et une enforcement de configuration fail-closed, mais Fluxheim lui-meme n'est pas un module cryptographique valide."
[[phrase]]
from = "For a real FIPS-required deployment, the operator must use a cryptographic module validated by the NIST/CCCS Cryptographic Module Validation Program (CMVP), operate that module in its approved mode, and follow the module's published Security Policy."
to = "Pour un vrai deploiement FIPS-required, l'operateur doit utiliser un module cryptographique valide par le NIST/CCCS Cryptographic Module Validation Program (CMVP), exploiter ce module dans son mode approuve et suivre la Security Policy publiee du module."
[[phrase]]
from = "Current release line:"
to = "Ligne de release actuelle:"
[[phrase]]
from = "Official References"
to = "References officielles"
[[phrase]]
