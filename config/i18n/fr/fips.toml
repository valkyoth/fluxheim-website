to = "Le travail FIPS de Fluxheim doit etre suivi par rapport a ces sources primaires:"
[[phrase]]
from = "Compliance Boundary"
to = "Frontiere de compliance"
[[phrase]]
from = "FIPS validation attaches to a cryptographic module and its tested operating environment, not to a web server merely because it links a library."
to = "La validation FIPS s'attache a un module cryptographique et a son environnement d'exploitation teste, pas a un serveur web simplement parce qu'il lie une bibliotheque."
