[[phrase]]
from = "PHP-FPM production line, managed php-fpm supervision, config tester and ACME companion binaries, FIPS/ISO validation tracks, focused cache/proxy profiles, and security hardening"
to = "Ligne de production PHP-FPM, supervision php-fpm gérée, binaires de test de configuration et compagnon ACME, pistes de validation FIPS/ISO, profils cache/proxy ciblés et durcissement sécurité"

[[phrase]]
from = "Native HTTP/1 upstream/proxy foundation with bounded plain upstream forwarding, native proxy candidate inventory, proxy header parity, privacy-mode handling, and fail-closed eligibility."
to = "Fondation upstream/proxy HTTP/1 native avec forwarding upstream simple borné, inventaire natif des candidats proxy, parité des headers proxy, gestion du mode confidentialité et éligibilité fail-closed."

[[phrase]]
from = "Enterprise load-balancer and runtime-ownership line: focused load-balancer binaries/images, runtime member and weight controls, managed affinity cookies, stream and HTTP boundary work, active and protocol-aware health checks, service discovery, background task ownership, cache crate boundaries, UDP beta guardrails, origin-protection budgets, ARM/macOS assets, and broad security hardening."
to = "Ligne load-balancer entreprise et ownership runtime : binaires/images load-balancer ciblés, contrôles runtime des membres et des poids, cookies d'affinité gérés, travaux de frontière stream et HTTP, health checks actifs et conscients du protocole, service discovery, ownership des tâches d'arrière-plan, frontières du crate cache, garde-fous bêta UDP, budgets de protection origin, assets ARM/macOS et large durcissement sécurité."

[[phrase]]
from = "Proxy operations line with production proxy parity, richer route policy, traffic mirroring, dynamic upstream discovery, modular runtime/config split, Apple Silicon and Linux ARM64 release assets, GeoIP/Geo-Context, config-tester archives, and hardened TCP stream proxying"
to = "Ligne d'exploitation proxy avec parité proxy de production, policy de route enrichie, miroir de trafic, découverte upstream dynamique, séparation runtime/config modulaire, assets de release Apple Silicon et Linux ARM64, GeoIP/Geo-Contexte, archives config-tester et proxy de flux TCP durci"

[[phrase]]
from = "Cache and observability baseline with route-scoped cache policy, memory/disk/tiered backends, encrypted disk cache, peer fill, range caching, Prometheus, and OpenTelemetry export"
to = "Baseline cache et observabilité avec policy de cache par route, backends mémoire/disque/hiérarchisés, cache disque chiffré, peer fill, range caching, Prometheus et export OpenTelemetry"

[[phrase]]
from = "Certificate operations line with TLS policy profiles, multi-certificate rustls SNI, managed ACME issuance and renewal, EAB-capable issuers, file-backed TLS secrets, and renewal units"
to = "Ligne d'exploitation des certificats avec profils de policy TLS, SNI rustls multi-certificats, émission et renouvellement ACME gérés, émetteurs compatibles EAB, secrets TLS adossés à des fichiers et unités de renouvellement"

[[phrase]]
from = "Gateway foundation with vhost routing, route-level static/proxy/redirect actions, static file serving, reverse proxying, rustls TLS, admin control-plane, secure headers, systemd packaging, and rootless containers"
to = "Fondation gateway avec routage vhost, actions statiques/proxy/redirection au niveau route, service de fichiers statiques, reverse proxying, TLS rustls, control-plane admin, headers sécurisés, packaging systemd et conteneurs rootless"

