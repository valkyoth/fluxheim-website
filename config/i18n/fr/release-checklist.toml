to = "Dans le build rustls par defaut, validez le certificat downstream par defaut et au moins un certificat SNI specifique a un vhost par listener TLS."
[[phrase]]
from = "The core smoke generates temporary static certificates and proves static, proxied, and SNI-selected vhosts over a TLS listener."
to = "Le smoke core genere des certificats statiques temporaires et prouve des vhosts statiques, proxifies et selectionnes par SNI sur un listener TLS."
[[phrase]]
from = "ACME config and renewal queue planning are implemented, but account/order and challenge runtime work is not release-ready yet. Do not document automated ACME issuance as operational until that runtime is implemented and tested."
to = "La configuration ACME et la planification de la file de renouvellement sont implementees, mais le travail runtime account/order et challenge n'est pas encore pret pour publication. Ne documentez pas l'emission ACME automatisee comme operationnelle tant que ce runtime n'est pas implemente et teste."
[[phrase]]
from = "Validate production-like TLS storage before startup:"
to = "Validez le stockage TLS proche de la production avant le demarrage :"
[[phrase]]
from = "On Unix, private keys should be owner-only ("
to = "Sous Unix, les cles privees devraient etre reservees au proprietaire ("
[[phrase]]
from = ") and ACME storage directories should be owner-only ("
to = ") et les repertoires de stockage ACME devraient etre reserves au proprietaire ("
