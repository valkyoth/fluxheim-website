[[phrase]]
from = "Release Checklist — Fluxheim Source Docs"
to = "Checklist de publication - documentation source Fluxheim"
[[phrase]]
from = "Use this checklist before publishing a Fluxheim release, changing dependency versions, changing TLS/cache/proxy behavior, or building an image for other people to run."
to = "Utilisez cette checklist avant de publier une version Fluxheim, de modifier les versions des dependances, de changer le comportement TLS/cache/proxy ou de construire une image destinee a etre executee par d'autres."
[[phrase]]
from = "Version And Toolchain"
to = "Version et chaine d'outils"
[[phrase]]
from = "Confirm the Rust version in"
to = "Confirmez la version de Rust dans"
[[phrase]]
from = "Run the release metadata preflight:"
to = "Executez le precontrole des metadonnees de publication :"
[[phrase]]
from = "Check that the pinned Rust version is still the current stable release before release work starts."
to = "Verifiez que la version Rust epinglee est toujours la version stable actuelle avant de commencer le travail de publication."
[[phrase]]
from = "Install or update the tools with locked dependency resolution:"
to = "Installez ou mettez a jour les outils avec une resolution de dependances verrouillee :"
[[phrase]]
from = "Dependency, License, And Advisory Gates"
to = "Gates de dependances, licences et avis"
[[phrase]]
from = "only as a deliberate dependency maintenance step."
to = "uniquement comme une etape volontaire de maintenance des dependances."
[[phrase]]
from = "Before tagging, verify compatible dependency updates are exhausted. This gate intentionally ignores"
to = "Avant de taguer, verifiez que les mises a jour de dependances compatibles sont epuisees. Ce gate ignore volontairement"
[[phrase]]
from = "packages while Fluxheim is still exiting the Pingora compatibility runtime dependency surface:"
to = "les paquets pendant que Fluxheim sort encore de la surface de dependances runtime de compatibilite Pingora :"
[[phrase]]
from = "Pingora-exit line, capture the runtime baseline evidence before tagging."
to = "ligne de sortie de Pingora, capturez les preuves de baseline runtime avant de taguer."
[[phrase]]
from = "mode records locked dependency trees and the per-profile Pingora dependency surface, including native web TLS proof profiles;"
to = "mode enregistre les arbres de dependances verrouilles et la surface de dependances Pingora par profil, y compris les profils de preuve TLS web native ;"
[[phrase]]
from = "mode also records the default release-binary size and local performance baseline:"
to = "mode enregistre aussi la taille du binaire de publication par defaut et la baseline de performance locale :"
[[phrase]]
from = "Review every new dependency for maintenance status and SPDX license metadata."
to = "Passez en revue chaque nouvelle dependance pour son statut de maintenance et ses metadonnees de licence SPDX."
[[phrase]]
from = "Review every new build script, procedural macro,"
to = "Passez en revue chaque nouveau script de build, macro procedurale,"
[[phrase]]
from = "crate, vendored native source, native tool invocation, Cargo alias, and CI workflow edit as build-host code execution."
to = "crate, source native vendoree, invocation d'outil natif, alias Cargo et modification de workflow CI comme de l'execution de code sur l'hote de build."
[[phrase]]
from = "strict: unknown registries, git sources, and unknown licenses stay denied."
to = "strict : les registres inconnus, sources git et licences inconnues restent refuses."
[[phrase]]
from = "exceptions narrow, versioned, and documented with a removal condition."
to = "les exceptions etroites, versionnees et documentees avec une condition de retrait."
[[phrase]]
from = "For unmaintained transitive dependencies inherited from Pingora or TLS backends, prefer upstream fixes over local forks. Track the package, advisory ID, upstream source, Fluxheim reachability, and removal condition in"
to = "Pour les dependances transitives non maintenues heritees de Pingora ou des backends TLS, preferez les corrections upstream aux forks locaux. Suivez le paquet, l'ID d'avis, la source upstream, l'accessibilite Fluxheim et la condition de retrait dans"
[[phrase]]
from = "and release notes. Do not promote an ignored advisory from warning to accepted risk without a written reason."
to = "et les notes de publication. Ne transformez pas un avis ignore de simple avertissement en risque accepte sans justification ecrite."
[[phrase]]
from = "Run the release wrapper:"
to = "Executez le wrapper de publication :"
