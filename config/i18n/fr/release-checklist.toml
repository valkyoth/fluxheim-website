from = "release, confirm the stable core binaries compile. This matrix intentionally excludes post-1.0 modules such as load balancing, metrics, admin, ACME runtime, WAF, PHP/CGI, Cloudflare automation, legacy HTTP, and WASM."
to = "release, confirmez que les binaires core stables compilent. Cette matrice exclut volontairement les modules post-1.0 comme load balancing, metrics, admin, runtime ACME, WAF, PHP/CGI, automatisation Cloudflare, HTTP legacy et WASM."
[[phrase]]
