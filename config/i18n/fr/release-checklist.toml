from = ". Do not also enable an advanced CodeQL workflow for the same repository; GitHub rejects advanced SARIF uploads when default setup is active."
to = ". N'activez pas aussi un workflow CodeQL avance pour le meme depot ; GitHub rejette les televersements SARIF avances lorsque la configuration par defaut est active."
[[phrase]]
from = "Confirm the Rust CI workflow still runs the core feature matrix in both check and release modes, plus the"
