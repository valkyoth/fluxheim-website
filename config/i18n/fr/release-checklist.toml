[[phrase]]
from = "Stable Release Security And Stability Gate"
to = "Gate de securite et de stabilite des publications stables"
[[phrase]]
from = "Passing memory-safe Rust builds is not enough for a proxy. Before every stable release, run this gate against the stable modules included in that release and record the results in the release notes. For"
to = "Reussir des builds Rust memory-safe ne suffit pas pour un proxy. Avant chaque publication stable, executez ce gate sur les modules stables inclus et consignez les resultats dans les notes de publication. Pour"
