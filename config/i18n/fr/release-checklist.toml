to = "le perimetre gateway est defini dans le plan de versionnement et doit couvrir des configurations gateway multi-sites representatives avant un tag stable."
[[phrase]]
from = "For the stable-release gate without incubator module checks, use:"
to = "Pour le gate de publication stable sans controles des modules incubateurs, utilisez :"
[[phrase]]
from = "Run the core localhost smoke directly when changing stable static/proxy behavior:"
to = "Executez directement le smoke core localhost lorsque le comportement stable static/proxy change :"
[[phrase]]
from = "<p>This smoke requires <code>openssl</code> for a temporary self-signed certificate. It covers HTTP static hosting, HTTP proxying, static certificate storage validation, HTTPS static hosting, and HTTPS proxying.</p>"
to = "<p>Ce smoke exige <code>openssl</code> pour un certificat auto-signe temporaire. Il couvre l'hebergement statique HTTP, le proxy HTTP, la validation du stockage de certificats statiques, l'hebergement statique HTTPS et le proxy HTTPS.</p>"
[[phrase]]
from = "for a temporary self-signed certificate. It covers HTTP static hosting, HTTP proxying, static certificate storage validation, HTTPS static hosting, and HTTPS proxying."
to = "pour un certificat auto-signe temporaire. Il couvre l'hebergement statique HTTP, le proxy HTTP, la validation du stockage de certificats statiques, l'hebergement statique HTTPS et le proxy HTTPS."
[[phrase]]
from = "Confirm GitHub CodeQL default setup is enabled for"
to = "Confirmez que la configuration par defaut GitHub CodeQL est activee pour"
