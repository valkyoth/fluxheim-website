[[phrase]]
from = "TLS And Certificate Storage"
to = "TLS et stockage des certificats"
[[phrase]]
from = "Static certificate chains and private keys are supported. Bought certificates remain a first-class deployment mode."
to = "Les chaines de certificats statiques et les cles privees sont prises en charge. Les certificats achetes restent un mode de deploiement de premier rang."
[[phrase]]
