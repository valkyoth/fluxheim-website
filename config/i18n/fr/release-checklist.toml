from = ", the target is the gateway core needed for representative multi-site configs. For later minors, include every module promoted to"
to = ", la cible est le core gateway necessaire aux configurations multi-sites representatives. Pour les minors suivantes, incluez chaque module promu en"
[[phrase]]
from = "in that release."
to = "dans cette publication."
[[phrase]]
from = "Local checks that can be run from this repository:"
to = "Controles locaux executables depuis ce depot :"
[[phrase]]
from = "Run the local gate wrapper:"
to = "Executez le wrapper de gate local :"
[[phrase]]
from = "For faster iteration before release week, run the same local gate in check mode:"
to = "Pour iterer plus vite avant la semaine de publication, executez le meme gate local en mode check :"
[[phrase]]
from = "The stable gate includes the mapped OWASP Top 10 2025 baseline in quick"
to = "Le gate stable inclut la baseline OWASP Top 10 2025 mappee en mode rapide"
[[phrase]]
from = "mode. Run the deeper representative-test mode when the release touches request handling, admin, PHP, TLS, logging, cache, dependency, or error-handling code:"
to = "mode. Executez le mode de test representatif plus profond lorsque la publication touche au traitement des requetes, admin, PHP, TLS, logging, cache, dependances ou code de gestion d'erreurs :"
[[phrase]]
from = "The stable gate includes the promoted cache and observability smoke tests for the"
to = "Le gate stable inclut les smoke tests cache et observability promus pour la"
[[phrase]]
from = "plus representative Debian and Alpine variant builds. This catches workspace, packaging, and image build context mistakes before an immutable tag is pushed."
to = "plus des builds de variantes Debian et Alpine representatifs. Cela detecte les erreurs de workspace, packaging et contexte de build d'image avant qu'un tag immuable soit pousse."
[[phrase]]
from = "beta changes, include the optional UDP smoke before tagging:"
to = "modifications beta, incluez le smoke UDP optionnel avant de taguer :"
[[phrase]]
from = "with that gate for a longer local soak when UDP forwarding, rate limits, or passive health behavior changed."
to = "avec ce gate pour un soak local plus long lorsque le forwarding UDP, les limites de debit ou le comportement de sante passive ont change."
[[phrase]]
from = "If a release builder cannot run Podman, do not skip this silently. Run the image gate on another builder and attach the evidence before tagging. The emergency-only bypass is:"
to = "Si un builder de publication ne peut pas executer Podman, ne l'ignorez pas silencieusement. Executez le gate d'image sur un autre builder et joignez les preuves avant de taguer. Le contournement reserve aux urgences est :"
[[phrase]]
from = "Optional gates below still cover slower or environment-specific checks such as TLS backend matrices, load testing, fuzz target compilation, and full Podman variant image smoke tests."
to = "Les gates optionnels ci-dessous couvrent toujours les controles plus lents ou propres a l'environnement, comme les matrices de backends TLS, les tests de charge, la compilation des cibles de fuzz et les smoke tests complets des variantes d'image Podman."
[[phrase]]
from = "For release-candidate validation, run the deeper local gate. It enables the TLS backend matrix, OpenSSL FIPS-capable validation, rustls/AWS-LC FIPS-capable validation, local TLS scan, local load smoke, raw request-framing smoke, and fuzz target compile check:"
to = "Pour la validation d'un release candidate, executez le gate local plus profond. Il active la matrice de backends TLS, la validation compatible OpenSSL FIPS, la validation rustls/AWS-LC compatible FIPS, le scan TLS local, le smoke de charge local, le smoke de framing brut des requetes et le controle de compilation des cibles de fuzz :"
[[phrase]]
from = "If the local release builder can run the rest of the deep gate but is not an AWS-LC-supported rustls FIPS builder, disable only that gate and attach rustls evidence from the supported builder separately:"
to = "Si le builder local de publication peut executer le reste du deep gate mais n'est pas un builder rustls FIPS pris en charge par AWS-LC, desactivez uniquement ce gate et joignez separement les preuves rustls du builder pris en charge :"
[[phrase]]
from = "Enable optional local matrices when the release includes those deliverables:"
to = "Activez les matrices locales optionnelles lorsque la publication inclut ces livrables :"
[[phrase]]
from = "For release builders that are expected to have a working OpenSSL FIPS provider, make absence a hard failure:"
to = "Pour les builders de publication censes avoir un fournisseur OpenSSL FIPS fonctionnel, faites de son absence un echec dur :"
[[phrase]]
from = "Dependency and license policy:"
to = "Politique de dependances et licences :"
[[phrase]]
from = "Static analysis and regression suite:"
to = "Analyse statique et suite de regression :"
[[phrase]]
from = "Direct unsafe policy. Fluxheim"
to = "Politique unsafe directe. Fluxheim"
[[phrase]]
from = "; this is enforced by the normal compile, clippy, and feature-matrix gates. Do not add direct"
to = "; c'est impose par les gates de compilation normale, clippy et matrice de fonctionnalites. N'ajoutez pas de blocs directs"
[[phrase]]
from = "blocks or raw FFI to Fluxheim source. Prefer safe wrapper crates for platform APIs and safe task/waker primitives in tests."
to = "ni de FFI brute au source Fluxheim. Preferez des crates wrapper sures pour les API plateforme et des primitives task/waker sures dans les tests."
[[phrase]]
from = "Panic and overflow policy. Release artifacts build with"
to = "Politique panic et overflow. Les artefacts de publication sont construits avec"
[[phrase]]
from = "through clippy. Keep operational errors on"
to = "via clippy. Gardez les erreurs operationnelles sur"
[[phrase]]
from = "or explicit fallback responses. Test-only assertions may continue using panicking helpers."
to = "ou sur des reponses de fallback explicites. Les assertions reservees aux tests peuvent continuer a utiliser des helpers qui paniquent."
[[phrase]]
from = "Native dependency policy. FIPS-capable profiles can intentionally pull native cryptographic modules such as OpenSSL providers or"
to = "Politique de dependances natives. Les profils compatibles FIPS peuvent volontairement tirer des modules cryptographiques natifs comme des fournisseurs OpenSSL ou"
[[phrase]]
from = ". Record the provider/module certificate, compiler, platform, and Security Policy in release evidence, and run sanitizer builds where supported by that native dependency and target platform."
to = ". Consignez le certificat fournisseur/module, le compilateur, la plateforme et la Security Policy dans les preuves de publication, et executez des builds sanitizer lorsqu'ils sont pris en charge par cette dependance native et la plateforme cible."
[[phrase]]
from = "Secret handling policy. Admin bearer tokens are read into zeroizing buffers, hashed, and compared through a vetted constant-time equality primitive. Keep new long-lived credentials in"
to = "Politique de gestion des secrets. Les bearer tokens admin sont lus dans des buffers zeroizing, haches et compares via une primitive d'egalite en temps constant verifiee. Gardez les nouveaux identifiants a longue duree de vie dans"
[[phrase]]
from = "for any equality check involving authentication tokens, signing secrets, or derived verifiers. Disk cache encryption keys and OpenBao tokens are long-lived credentials and must follow this policy. Do not classify normal cache object bodies as secrets unless a future module explicitly stores private user data."
to = "pour tout controle d'egalite impliquant des jetons d'authentification, secrets de signature ou verificateurs derives. Les cles de chiffrement du cache disque et les jetons OpenBao sont des identifiants a longue duree de vie et doivent suivre cette politique. Ne classez pas les corps d'objets de cache normaux comme secrets sauf si un futur module stocke explicitement des donnees utilisateur privees."
[[phrase]]
from = "Third-party unsafe inventory. Before a stable release, run"
to = "Inventaire unsafe tiers. Avant une publication stable, executez"
[[phrase]]
from = "as an informational dependency review and record unexpected changes in the release notes. Do not treat every dependency-level unsafe finding as an automatic blocker: the networking, TLS, OS, and runtime stack may contain audited unsafe internals. Treat new unsafe in direct dependencies as a review trigger alongside"
to = "comme revue informative des dependances et consignez les changements inattendus dans les notes de publication. Ne traitez pas chaque constat unsafe au niveau dependance comme un bloqueur automatique : la pile reseau, TLS, OS et runtime peut contenir des internes unsafe audites. Traitez le nouvel unsafe dans les dependances directes comme un declencheur de revue aux cotes de"
[[phrase]]
from = "Supply-chain evidence. Stable release gates must generate SPDX and CycloneDX SBOMs with"
to = "Preuves de supply chain. Les gates de publication stable doivent generer des SBOM SPDX et CycloneDX avec"
[[phrase]]
from = ", record their checksums, and run a local reproducible-build check that compiles the release binary twice from separate target directories and compares the resulting executable hash. This does not prove cross-machine bit-for-bit reproducibility; it proves the published builder can reproduce its own release artifact from the tagged source and pinned lockfile. Cross-distro/container reproducibility remains a future hardening goal."
to = ", enregistrer leurs sommes de controle et executer un controle local de build reproductible qui compile deux fois le binaire de publication depuis des repertoires target separes et compare le hash de l'executable obtenu. Cela ne prouve pas une reproductibilite bit pour bit entre machines ; cela prouve que le builder de publication peut reproduire son propre artefact depuis la source taguee et le lockfile epingle. La reproductibilite cross-distro/container reste un futur objectif de durcissement."
[[phrase]]
from = "Human dependency review. Track the"
to = "Revue humaine des dependances. Suivez le"
[[phrase]]
from = "adoption path in"
to = "chemin d'adoption dans"
[[phrase]]
from = "Rust Supply-Chain Security"
to = "Securite de la supply chain Rust"
[[phrase]]
from = "a blocking release gate until the initial exemption set and trusted audit imports have been reviewed."
to = "un gate de publication bloquant tant que l'ensemble initial d'exemptions et les imports d'audits de confiance n'ont pas ete revus."
[[phrase]]
from = "Request framing and smuggling regression tests. The unit suite must keep coverage for ambiguous"
to = "Tests de regression de framing et smuggling de requetes. La suite unitaire doit conserver la couverture des cas ambigus"
[[phrase]]
from = "values, and redirect target construction. Later stable modules must add their own malicious-input regression tests before release."
to = "valeurs et construction de cibles de redirection. Les modules stables ulterieurs doivent ajouter leurs propres tests de regression pour entrees malveillantes avant publication."
[[phrase]]
from = "Run the raw-socket framing smoke before tagging a stable proxy release:"
to = "Executez le smoke de framing raw-socket avant de taguer une publication proxy stable :"
[[phrase]]
from = "This smoke bypasses browser/client normalization and verifies malformed request framing is rejected on the wire."
to = "Ce smoke contourne la normalisation navigateur/client et verifie que le framing de requete malforme est rejete sur le fil."
[[phrase]]
from = "Header scrubbing checks. The 1.0 smoke must continue proving that the default response policy does not expose version banners and strips common upstream implementation headers from proxied responses. Later stable modules must prove equivalent secret/banner scrubbing for their own outputs."
to = "Controles de nettoyage des en-tetes. Le smoke 1.0 doit continuer a prouver que la politique de reponse par defaut n'expose pas de bannieres de version et retire les en-tetes courants d'implementation upstream des reponses proxifiees. Les modules stables ulterieurs doivent prouver un nettoyage equivalent des secrets/bannieres pour leurs propres sorties."
[[phrase]]
from = "Local load test with a release binary and a representative 1.0 config:"
to = "Test de charge local avec un binaire de publication et une configuration 1.0 representative :"
[[phrase]]
from = "Watch CPU, memory, open file descriptors, and logs during this test. The server should reject or shed load cleanly rather than panic."
to = "Surveillez CPU, memoire, descripteurs de fichiers ouverts et logs pendant ce test. Le serveur devrait rejeter ou delester proprement la charge plutot que paniquer."
[[phrase]]
from = "Fluxheim also includes a local wrapper for this check:"
to = "Fluxheim inclut aussi un wrapper local pour ce controle :"
[[phrase]]
from = "The default duration is intentionally modest. Tune it for release validation:"
to = "La duree par defaut est volontairement modeste. Ajustez-la pour la validation de publication :"
[[phrase]]
from = "TLS policy check. The current Fluxheim TLS listener configuration uses the selected Pingora TLS backend defaults and does not expose user-configurable cipher-suite or protocol-version settings yet. Release scans are therefore the enforcement gate: a stable release must not ship if the selected default TLS backend negotiates deprecated protocol versions or weak cipher suites."
to = "Controle de politique TLS. La configuration actuelle des listeners TLS Fluxheim utilise les valeurs par defaut du backend TLS Pingora selectionne et n'expose pas encore de parametres de suites de chiffrement ou versions de protocole configurables par l'utilisateur. Les scans de publication sont donc le gate d'application : une publication stable ne doit pas etre livree si le backend TLS par defaut selectionne negocie des versions de protocole obsoletes ou des suites faibles."
[[phrase]]
from = "Local TLS smoke. The localhost smoke already proves a static certificate over a TLS listener. For a deeper local scan, use a temporary copy of the latest stable"
to = "Smoke TLS local. Le smoke localhost prouve deja un certificat statique sur un listener TLS. Pour un scan local plus profond, utilisez une copie temporaire de la derniere version stable"
[[phrase]]
from = "release against the release binary. Re-check the latest stable tag before each release; as of 2026-05-06, GitHub lists"
to = "contre le binaire de publication. Reverifiez le dernier tag stable avant chaque publication ; au 2026-05-06, GitHub indique"
[[phrase]]
from = "as the latest stable release:"
to = "comme derniere version stable :"
[[phrase]]
from = "Fluxheim also includes a local wrapper that starts a temporary TLS listener, downloads the pinned stable scanner, and stores the report:"
to = "Fluxheim inclut aussi un wrapper local qui demarre un listener TLS temporaire, telecharge le scanner stable epingle et stocke le rapport :"
[[phrase]]
from = "Do not vendor this script into the repository. Re-download it for release validation and record the commit/version it reports."
to = "Ne vendorez pas ce script dans le depot. Retelechargez-le pour la validation de publication et consignez le commit ou la version qu'il rapporte."
[[phrase]]
from = "Checks that should be run by the maintainer from a deployment-like environment:"
to = "Controles que le mainteneur devrait executer depuis un environnement proche du deploiement :"
[[phrase]]
from = "Run an authenticated or allowlisted OWASP ZAP/Burp active scan against a staging deployment that has no real secrets, users, or customer content."
to = "Executez un scan actif OWASP ZAP/Burp authentifie ou allowliste contre un deploiement de staging qui ne contient pas de vrais secrets, utilisateurs ou contenus client."
[[phrase]]
from = "or a public TLS scanner against the real public hostname after DNS, certificates, and firewall rules are final."
to = "ou un scanner TLS public contre le vrai nom d'hote public une fois DNS, certificats et regles de pare-feu finalises."
[[phrase]]
from = ", or Gatling load test from a separate host. Local loopback hides network and socket pressure."
to = ", ou un test de charge Gatling depuis un hote separe. La loopback locale masque la pression reseau et socket."
[[phrase]]
from = "Run a slow-client test from a separate host to confirm header/body timeouts and connection limits are effective. If using a tool such as"
to = "Executez un test slow-client depuis un hote separe pour confirmer que les timeouts header/body et les limites de connexion sont efficaces. Si vous utilisez un outil comme"
[[phrase]]
from = ", point it only at infrastructure you own."
to = ", pointez-le uniquement vers une infrastructure que vous possedez."
[[phrase]]
from = "Confirm upstream handoff uses one of the supported safe deployment patterns: private network, loopback/service network, TLS upstream verification, or mTLS where the backend supports it."
to = "Confirmez que le handoff upstream utilise l'un des modeles de deploiement surs pris en charge : reseau prive, reseau loopback/service, verification TLS upstream ou mTLS lorsque le backend le prend en charge."
[[phrase]]
from = "Confirm trusted-proxy settings are not enabled for public traffic unless the actual ingress proxy IP ranges are pinned and reviewed."
to = "Confirmez que les parametres trusted-proxy ne sont pas actives pour le trafic public sauf si les plages IP reelles du proxy d'ingress sont epinglees et revues."
[[phrase]]
from = "Fuzzing gate:"
to = "Gate de fuzzing :"
[[phrase]]
from = "Before tagging a stable release, add or run fuzz targets for custom parser and policy code rather than Pingora internals. For"
to = "Avant de taguer une publication stable, ajoutez ou executez des cibles de fuzz pour les parseurs et le code de politique propres plutot que les internes Pingora. Pour"
[[phrase]]
from = ", cover Host normalization, redirect URL construction, header mutation policy, static path resolution, cache key generation, and cache-header parsing. Later stable modules must add fuzz targets for their own parsers and security policy boundaries."
to = ", couvrez la normalisation Host, la construction d'URL de redirection, la politique de mutation des en-tetes, la resolution des chemins statiques, la generation des cles de cache et le parsing des en-tetes cache. Les modules stables ulterieurs doivent ajouter des cibles de fuzz pour leurs propres parseurs et limites de politique de securite."
[[phrase]]
from = "Fuzzing is release-blocking if it finds a panic, path escape, open redirect, request-boundary ambiguity, or unbounded memory growth."
to = "Le fuzzing bloque la publication s'il trouve un panic, une echappee de chemin, une redirection ouverte, une ambiguite de limite de requete ou une croissance memoire non bornee."
[[phrase]]
from = "Initial fuzz targets live under"
to = "Les cibles de fuzz initiales se trouvent sous"
[[phrase]]
from = "and can be run with"
to = "et peuvent etre executees avec"
[[phrase]]
from = "Increase the runtime substantially before a stable tag. Keep generated corpora and artifacts out of git unless a minimized regression case should be promoted into a normal unit test."
to = "Augmentez fortement la duree d'execution avant un tag stable. Gardez les corpus et artefacts generes hors de git sauf si un cas de regression minimise doit etre promu en test unitaire normal."
[[phrase]]
from = "Property-testing gate:"
to = "Gate de property testing :"
[[phrase]]
from = "includes property-based checks for Host normalization, dynamic request-header templates, and ACME retry backoff. These tests are intended to protect invariants that are easy to miss with hand-picked examples."
