[[phrase]]
from = "GeoIP metrics and trace attributes remain bounded follow-up work; do not add high-cardinality labels from city, latitude/longitude, or raw database fields."
to = "Les metriques GeoIP et attributs de trace restent un travail de suivi borne ; n'ajoutez pas de labels a haute cardinalite depuis la ville, latitude/longitude ou champs bruts de base de donnees."
