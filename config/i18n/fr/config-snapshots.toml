to = "L'endpoint reload renvoie"

[[phrase]]
from = "when the current snapshot requires a process upgrade, such as listener, TLS backend/mode, admin service, or metrics service, or startup-owned load-balancer service changes. Existing requests keep their old runtime snapshot; new requests use the freshly swapped proxy snapshot."
to = "lorsque le snapshot courant exige un upgrade de processus, par exemple listener, backend/mode TLS, service admin ou metrics, ou changements de service load-balancer possedes par le startup. Les requetes existantes gardent leur ancien snapshot runtime ; les nouvelles utilisent le snapshot proxy recemment swappe."

[[phrase]]
from = "Load-balancer service changes include adding or removing vhost/route pools and changing static pool members, file/DNS/HTTP discovery sources, discovery refresh intervals, or HTTP discovery bearer-token files. These refresh loops are registered at process startup, so use the normal supervisor/process-upgrade path for those changes."
to = "Les changements de service load-balancer incluent l'ajout ou la suppression de pools vhost/route et la modification de membres statiques de pool, sources de discovery fichier/DNS/HTTP, intervalles de refresh discovery ou fichiers de bearer-token de discovery HTTP. Ces boucles de refresh sont enregistrees au demarrage du processus ; utilisez donc le chemin normal supervisor/process-upgrade pour ces changements."

