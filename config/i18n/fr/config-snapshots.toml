locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Fluxheim uses two layers for reload safety:"
to = "Fluxheim utilise deux couches pour securiser les reloads :"

[[phrase]]
from = "Runtime snapshots: immutable in-memory state behind <code>ArcSwap</code>."
to = "Snapshots runtime : etat memoire immutable derriere <code>ArcSwap</code>."

[[phrase]]
from = "Durable snapshots: validated TOML configs stored on disk with a current pointer."
to = "Snapshots durables : configs TOML validees stockees sur disque avec un pointeur courant."

[[phrase]]
from = "The runtime snapshot model means old requests can keep using the config they started with while new requests use the new config after an atomic pointer swap. The durable snapshot store gives operators an auditable rollback target and the admin API a current pointer to apply."
to = "Le modele de snapshot runtime permet aux anciennes requetes de continuer avec la config de depart, tandis que les nouvelles utilisent la nouvelle config apres un swap atomique du pointeur. Le store de snapshots durables donne aux operateurs une cible de rollback auditable et a l'API admin un pointeur courant a appliquer."

[[phrase]]
from = "Store Layout"
to = "Layout du store"

[[phrase]]
from = "Use an operator-chosen state directory, for example"
to = "Utilisez un repertoire d'etat choisi par l'operateur, par exemple"

[[phrase]]
from = "<code>current</code> contains the active snapshot id. Fluxheim uses an atomically replaced pointer file instead of a symlink. A symlink swap is a good Linux-only design, but the pointer file keeps the store straightforward in rootless Podman, restricted volume mounts, and non-Unix development environments while still using write-temp-and-rename semantics."
to = "<code>current</code> contient l'id du snapshot actif. Fluxheim utilise un fichier pointeur remplace atomiquement au lieu d'un symlink. Un swap de symlink est un bon design Linux-only, mais le fichier pointeur garde le store simple avec Podman rootless, les montages de volumes restreints et les environnements de developpement non-Unix, tout en utilisant une semantique write-temp-and-rename."

[[phrase]]
from = "Snapshot config files contain the validated effective config, written back as TOML. Metadata files contain the snapshot id, creation time, and optional operator message. Operator messages are trimmed and limited to 4096 bytes of non-control text before they are written or loaded. Generated snapshot ids contain Unix time plus a process-local sequence; they do not include the Fluxheim process id."
to = "Les fichiers de config de snapshot contiennent la config effective validee, reecrite en TOML. Les fichiers de metadonnees contiennent l'id du snapshot, l'heure de creation et le message operateur optionnel. Les messages operateur sont trims et limites a 4096 octets de texte non-control avant ecriture ou chargement. Les ids de snapshot generes contiennent le temps Unix plus une sequence locale au processus ; ils n'incluent pas l'id du processus Fluxheim."

[[phrase]]
from = "The store is deliberately conservative about filesystem indirection. Snapshot ids may only contain ASCII letters, digits, <code>_</code>, and <code>-</code>, and are limited to 128 bytes; the store root cannot contain <code>..</code> or sit below a symlinked parent directory; the store root and <code>configs</code> directory must be real directories; the <code>configs</code> directory must remain inside the snapshot store; and <code>current</code>, snapshot TOML files, and metadata TOML files are opened as regular files. Symlinked store roots, pointer, config, metadata, or <code>configs</code> paths are rejected so a rollback cannot be redirected to an operator-unapproved file. Atomic writes also require an already validated real parent directory and will not replace a symlinked destination. Snapshot reads are bounded: <code>current</code> is limited to 4 KiB and snapshot TOML/metadata reads are limited to 16 MiB. Snapshot stores are limited to 1024 snapshots; operators should export or prune old snapshots before that limit."
to = "Le store est volontairement conservateur sur l'indirection filesystem. Les ids de snapshot ne peuvent contenir que des lettres ASCII, des chiffres, <code>_</code> et <code>-</code>, et sont limites a 128 octets; la racine du store ne peut pas contenir <code>..</code> ni se trouver sous un repertoire parent symlinke; la racine du store et le repertoire <code>configs</code> doivent etre de vrais repertoires; le repertoire <code>configs</code> doit rester dans le store de snapshots; et <code>current</code>, les fichiers TOML de snapshot et les fichiers TOML de metadonnees sont ouverts comme fichiers reguliers. Les racines de store, pointeurs, configs, metadonnees ou chemins <code>configs</code> symlinkes sont rejetes pour qu'un rollback ne puisse pas etre redirige vers un fichier non approuve par l'operateur. Les ecritures atomiques exigent aussi un vrai repertoire parent deja valide et ne remplacent pas une destination symlinkee. Les lectures de snapshot sont bornees: <code>current</code> est limite a 4 KiB et les lectures TOML/metadonnees de snapshot sont limitees a 16 MiB. Les stores de snapshots sont limites a 1024 snapshots; les operateurs doivent exporter ou purger les anciens snapshots avant cette limite."

