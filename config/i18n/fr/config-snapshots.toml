[[phrase]]
from = "The fail endpoint validates the previous snapshot and applies it with the same snapshot-safe reload gate. It also moves the durable current pointer back only after the running proxy accepts the rollback."
to = "L'endpoint fail valide le snapshot precedent et l'applique avec le meme gate de reload snapshot-safe. Il ne remet aussi le pointeur courant durable en arriere qu'apres acceptation du rollback par le proxy en cours."

[[phrase]]
from = "Report health-check results from a local watchdog:"
to = "Rapporter les resultats de health-check depuis un watchdog local :"

[[phrase]]
from = "Successful reports confirm the pending snapshot once"
to = "Les rapports reussis confirment le snapshot en attente lorsque"

[[phrase]]
from = "is reached. Failed reports roll back when the observed error rate exceeds"
to = "est atteint. Les rapports echoues declenchent un rollback lorsque le taux d'erreur observe depasse"

[[phrase]]
from = "Pending validation fails closed. If the validation window expires before a confirm request, the Pingora self-healing watchdog attempts the same known-good rollback without waiting for operator traffic. Admin requests also enforce the deadline as a secondary guard."
to = "La validation en attente echoue en mode ferme. Si la fenetre de validation expire avant une requete confirm, le watchdog self-healing Pingora tente le meme rollback known-good sans attendre le trafic operateur. Les requetes admin appliquent aussi la deadline comme garde secondaire."

[[phrase]]
from = "Public proxy traffic does not confirm or roll back pending snapshots. This keeps unauthenticated data-plane clients from influencing admin reload state. Only authenticated admin self-healing actions, local watchdog expiry, and explicit operator-driven health reports can advance pending validation."
to = "Le trafic proxy public ne confirme pas et ne rollback pas les snapshots en attente. Cela empeche les clients data-plane non authentifies d'influencer l'etat admin reload. Seules les actions admin self-healing authentifiees, l'expiration du watchdog local et les rapports de sante explicites pilotes par l'operateur peuvent faire avancer la validation en attente."

