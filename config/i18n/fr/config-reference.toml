[[phrase]]
from = "Relative filesystem paths are resolved from the config file directory. Config sources must be real TOML files or real directories. Fluxheim rejects a symlink used as the top-level config source, rejects config sources below a symlinked directory, and ignores symlinked TOML entries inside split config directories, so a reload cannot be redirected through an unexpected filesystem pointer."
to = "Les chemins filesystem relatifs sont resolus depuis le repertoire du fichier de config. Les sources de config doivent etre de vrais fichiers TOML ou de vrais repertoires. Fluxheim rejette un symlink utilise comme source de config top-level, rejette les sources de config sous un repertoire symlinke et ignore les entrees TOML symlinkees dans les repertoires de config split, afin qu'un reload ne puisse pas etre redirige par un pointeur filesystem inattendu."
[[phrase]]
from = "Each TOML file is size-limited to 1 MiB; large deployments should use a split config directory instead of one huge file. Split config directories are limited to 256 visible TOML files."
to = "Chaque fichier TOML est limite a 1 MiB; les grands deploiements doivent utiliser un repertoire de config split plutot qu'un seul enorme fichier. Les repertoires de config split sont limites a 256 fichiers TOML visibles."
[[phrase]]
from = "Configured filesystem paths are also rejected when any existing path component is a symlink; missing final directories may still be created by the owning runtime module, but never through a symlinked prefix."
