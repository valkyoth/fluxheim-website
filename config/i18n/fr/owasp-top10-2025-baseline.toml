[[phrase]]
from = "OWASP Top 10 2025 Baseline — Fluxheim Source Docs"
to = "Baseline OWASP Top 10 2025 - documentation source Fluxheim"
[[phrase]]
from = "OWASP Top 10 2025 Baseline"
to = "Baseline OWASP Top 10 2025"
[[phrase]]
from = "This page maps Fluxheim&#x27;s automated checks to the OWASP Top 10 2025 categories. It is a baseline gate, not a compliance certificate. Some OWASP risks are application/business-logic risks that Fluxheim cannot prove for an origin application. The goal is to keep the web-server, reverse-proxy, PHP-FPM, cache, admin, TLS, and release controls from regressing."
to = "Cette page mappe les checks automatises de Fluxheim sur les categories OWASP Top 10 2025. C'est un gate de baseline, pas un certificat de conformite. Certains risques OWASP relevent de l'application ou de la logique metier, et Fluxheim ne peut pas les prouver pour une application origin. L'objectif est d'empecher les regressions des controles web-server, reverse-proxy, PHP-FPM, cache, admin, TLS et release."
[[phrase]]
from = "This page maps Fluxheim's automated checks to the OWASP Top 10 2025 categories. It is a baseline gate, not a compliance certificate. Some OWASP risks are application/business-logic risks that Fluxheim cannot prove for an origin application. The goal is to keep the web-server, reverse-proxy, PHP-FPM, cache, admin, TLS, and release controls from regressing."
to = "Cette page mappe les checks automatises de Fluxheim sur les categories OWASP Top 10 2025. C'est un gate de baseline, pas un certificat de conformite. Certains risques OWASP relevent de l'application ou de la logique metier, et Fluxheim ne peut pas les prouver pour une application origin. L'objectif est d'empecher les regressions des controles web-server, reverse-proxy, PHP-FPM, cache, admin, TLS et release."
