locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "WASM Extensibility"
to = "Extensibilite WASM"

[[phrase]]
from = "optional module family after the"
to = "famille de modules optionnelle apres la ligne runtime"

[[phrase]]
from = "Pingora-exit runtime line."
to = "de sortie Pingora."

[[phrase]]
from = "Planned Cargo features:"
to = "Features Cargo prevues :"

[[phrase]]
from = "Latest crate candidates checked on 2026-05-05:"
to = "Dernieres crates candidates verifiees le 2026-05-05 :"

[[phrase]]
from = "WASM extensibility gives Fluxheim a sandboxed way to run operator-provided logic without compiling that logic into the Fluxheim binary. It should be treated as a major extension boundary, not as a small scripting feature."
to = "L'extensibilite WASM donne a Fluxheim une maniere sandboxee d'executer de la logique fournie par l'operateur sans compiler cette logique dans le binaire Fluxheim. Elle doit etre traitee comme une grande frontiere d'extension, pas comme une petite feature de scripting."

[[phrase]]
from = "The same runtime should cover the operational jobs commonly solved with F5 iRules, nginx Lua/OpenResty, HAProxy Lua/SPOE, and VCL-like cache policy hooks, instead of creating separate partial extension systems."
to = "Le meme runtime doit couvrir les taches operationnelles souvent resolues avec F5 iRules, nginx Lua/OpenResty, HAProxy Lua/SPOE et des hooks de policy cache de type VCL, au lieu de creer des systemes d'extension partiels separes."

[[phrase]]
from = "This is capability parity, not syntax compatibility: Fluxheim should expose typed, versioned host calls and bounded decisions rather than embedding Tcl, Lua, or an unrestricted scripting language."
to = "C'est une parite de capacites, pas une compatibilite syntaxique : Fluxheim doit exposer des appels hote types et versionnes ainsi que des decisions bornees plutot qu'embarquer Tcl, Lua ou un langage de script non restreint."

[[phrase]]
from = "Design Goals"
to = "Objectifs de conception"

[[phrase]]
from = "Keep WASM runtime code out of default builds."
to = "Garder le code runtime WASM hors des builds par defaut."

[[phrase]]
from = "Use a reviewed standard ABI where practical."
to = "Utiliser une ABI standard revue lorsque c'est pratique."

[[phrase]]
from = "Start with request/response header hooks, access-control hooks, and bounded cache-policy hooks."
to = "Commencer par des hooks d'en-tetes requete/reponse, des hooks de controle d'acces et des hooks de policy cache bornes."

[[phrase]]
from = "Cover the safe subset of iRules/Lua-style jobs over time: conditional routing, pool selection, persistence-key choice, synthetic deny/error responses, header mutation, logging/redaction, mirror/shadow selection, and cache policy."
to = "Couvrir progressivement le sous-ensemble sur des taches de style iRules/Lua : routage conditionnel, selection de pool, choix de cle de persistance, reponses deny/error synthetiques, mutation d'en-tetes, journalisation/redaction, selection mirror/shadow et policy cache."

[[phrase]]
from = "Make all host calls explicit, small, and auditable."
to = "Rendre tous les appels hote explicites, petits et auditables."

[[phrase]]
from = "Keep plugin execution bounded by memory, fuel, wall-time, and output limits."
to = "Borner l'execution des plugins par des limites de memoire, fuel, wall-time et sortie."

[[phrase]]
from = "Prevent plugins from seeing secrets, bodies, filesystem, network, or admin APIs unless explicitly granted by policy."
to = "Empecher les plugins de voir secrets, corps, systeme de fichiers, reseau ou APIs admin sauf autorisation explicite par policy."

[[phrase]]
from = "Make plugin failures isolated from the process and from unrelated requests."
to = "Isoler les echecs de plugin du processus et des requetes sans rapport."

[[phrase]]
from = "Stage 1: Header, Access-Control, And Cache Policy Hooks"
to = "Etape 1 : hooks d'en-tetes, controle d'acces et policy cache"

[[phrase]]
from = "The first useful scope should cover the common extension cases without exposing request bodies or arbitrary I/O."
to = "Le premier perimetre utile doit couvrir les cas d'extension courants sans exposer les corps de requete ni des E/S arbitraires."

[[phrase]]
from = "Allowed hooks:"
to = "Hooks autorises :"

[[phrase]]
from = "request headers before upstream selection;"
to = "en-tetes de requete avant selection upstream ;"

[[phrase]]
from = "response headers before sending to the client;"
to = "en-tetes de reponse avant envoi au client ;"

[[phrase]]
from = "access-control decision: allow, deny with status, or continue;"
to = "decision de controle d'acces : autoriser, refuser avec statut ou continuer ;"

[[phrase]]
from = "cache lookup/admission decision: bypass, pass, continue, or deny;"
to = "decision de lookup/admission cache : bypass, pass, continue ou deny ;"

[[phrase]]
from = "bounded cache-key component decision with typed inputs and low-cardinality output limits;"
to = "decision bornee de composant de cle cache avec entrees typees et limites de sortie a faible cardinalite ;"

[[phrase]]
from = "cache store-admission decision for TTL override, tag assignment, and safe response-header mutation;"
to = "decision d'admission en cache pour override TTL, affectation de tags et mutation sure d'en-tetes de reponse ;"

[[phrase]]
from = "synthetic response with small bounded body for deny/error cases."
to = "reponse synthetique avec petit corps borne pour les cas deny/error."

[[phrase]]
from = "Non-goals for the first stage:"
to = "Non-objectifs de la premiere etape :"

[[phrase]]
from = "streaming body mutation;"
to = "mutation de corps en streaming ;"

[[phrase]]
from = "filesystem access;"
to = "acces au systeme de fichiers ;"

[[phrase]]
from = "outbound network access;"
to = "acces reseau sortant ;"

[[phrase]]
from = "spawning processes;"
to = "demarrage de processus ;"

[[phrase]]
from = "direct raw cache object access;"
to = "acces direct aux objets cache bruts ;"

[[phrase]]
from = "admin/control API access."
to = "acces API admin/control."

[[phrase]]
from = "Stage 2: Proxy ABI Compatibility"
to = "Etape 2 : compatibilite ABI proxy"

[[phrase]]
from = "Fluxheim should evaluate a proxy-oriented WASM ABI rather than inventing a large custom API."
to = "Fluxheim doit evaluer une ABI WASM orientee proxy plutot qu'inventer une grande API custom."

[[phrase]]
from = "Compatibility goals:"
to = "Objectifs de compatibilite :"

[[phrase]]
from = "map Fluxheim request/response lifecycle into a stable plugin contract;"
to = "mapper le lifecycle requete/reponse Fluxheim vers un contrat plugin stable ;"

[[phrase]]
from = "expose only the subset of ABI calls Fluxheim can implement safely;"
to = "exposer uniquement le sous-ensemble d'appels ABI que Fluxheim peut implementer surement ;"

[[phrase]]
from = "reject unsupported ABI calls with deterministic errors;"
to = "rejeter les appels ABI non pris en charge avec des erreurs deterministes ;"

[[phrase]]
from = "version the host ABI and require plugin compatibility checks at startup;"
to = "versionner l'ABI hote et exiger des controles de compatibilite plugin au demarrage ;"

[[phrase]]
from = "support per-vhost and per-route plugin attachment."
to = "prendre en charge l'attachement de plugins par vhost et par route."

[[phrase]]
from = "Compatibility does not mean every existing plugin should run unchanged. The security boundary and host-call behavior must stay explicit."
to = "La compatibilite ne signifie pas que chaque plugin existant doit fonctionner sans changement. La frontiere de securite et le comportement des appels hote doivent rester explicites."

[[phrase]]
from = "Stage 3: WASI And Policy Plugins"
to = "Etape 3 : plugins WASI et policy"

[[phrase]]
from = "WASI should be separate from header/access-control plugins."
to = "WASI doit etre separe des plugins d'en-tetes/controle d'acces."

[[phrase]]
from = "Potential use cases:"
to = "Cas d'utilisation possibles :"

[[phrase]]
from = "media policy decisions;"
to = "decisions de policy media ;"

[[phrase]]
from = "custom auth decision transforms;"
to = "transforms de decision auth custom ;"

[[phrase]]
from = "custom log redaction;"
to = "redaction de logs custom ;"

[[phrase]]
from = "specialized request classification;"
to = "classification de requete specialisee ;"

[[phrase]]
from = "feature-specific plugins that do not need direct filesystem or network access."
to = "plugins specifiques a une feature qui n'ont pas besoin d'acces direct au systeme de fichiers ou au reseau."

[[phrase]]
from = "WASI capabilities must be disabled by default and granted explicitly:"
to = "Les capacites WASI doivent etre desactivees par defaut et accordees explicitement :"

[[phrase]]
from = "no filesystem by default;"
to = "pas de systeme de fichiers par defaut ;"

[[phrase]]
from = "no network by default;"
to = "pas de reseau par defaut ;"

[[phrase]]
from = "no clocks beyond coarse time unless needed;"
to = "pas d'horloges au-dela du temps grossier sauf besoin ;"

[[phrase]]
from = "no randomness beyond host-provided safe APIs;"
to = "pas d'alea au-dela des APIs sures fournies par l'hote ;"

[[phrase]]
from = "no environment variables by default;"
to = "pas de variables d'environnement par defaut ;"

[[phrase]]
from = "no inherited process state."
to = "pas d'etat de processus herite."

[[phrase]]
from = "Resource Limits"
to = "Limites de ressources"

[[phrase]]
from = "Required limits:"
to = "Limites requises :"

[[phrase]]
from = "maximum module size;"
to = "taille maximale de module ;"

[[phrase]]
from = "maximum compiled artifact size;"
to = "taille maximale d'artefact compile ;"

[[phrase]]
from = "maximum linear memory;"
to = "memoire lineaire maximale ;"

[[phrase]]
from = "maximum fuel/instruction budget;"
to = "budget fuel/instructions maximal ;"

[[phrase]]
from = "maximum wall-time;"
to = "wall-time maximale ;"

[[phrase]]
from = "maximum log bytes emitted by plugin;"
to = "octets de log maximum emis par plugin ;"

[[phrase]]
from = "maximum header mutations;"
to = "mutations d'en-tetes maximales ;"

[[phrase]]
from = "maximum synthetic response size;"
to = "taille maximale de reponse synthetique ;"

[[phrase]]
from = "maximum per-vhost concurrent plugin executions."
to = "executions concurrentes maximales de plugin par vhost."

[[phrase]]
from = "Compiled modules should be cached only with strong isolation by module hash, ABI version, feature set, and Fluxheim version."
to = "Les modules compiles ne doivent etre caches qu'avec une isolation forte par hash de module, version ABI, ensemble de features et version Fluxheim."

[[phrase]]
from = "Disabled by default at compile time and runtime."
to = "Desactive par defaut a la compilation et au runtime."

[[phrase]]
from = "Plugin files must be regular files below approved directories."
to = "Les fichiers plugin doivent etre des fichiers reguliers sous des repertoires approuves."

[[phrase]]
from = "Plugin paths must reject symlinks and symlinked parents."
to = "Les chemins plugin doivent rejeter les symlinks et parents symlinkes."

[[phrase]]
from = "Plugin modules must be hashed and recorded in admin status."
to = "Les modules plugin doivent etre hashes et enregistres dans le statut admin."

[[phrase]]
from = "Host calls must never expose admin tokens, ACME/EAB secrets, private keys, authorization headers, cookies, raw request bodies, or filesystem paths unless explicitly allowed and redacted."
to = "Les appels hote ne doivent jamais exposer tokens admin, secrets ACME/EAB, cles privees, en-tetes d'autorisation, cookies, corps de requete bruts ou chemins de systeme de fichiers sauf autorisation explicite et redaction."

[[phrase]]
from = "Plugins must not control routing destinations or upstream TLS verification directly. Cache-key influence is allowed only through constrained typed hook outputs that Fluxheim validates, bounds, and records."
to = "Les plugins ne doivent pas controler directement les destinations de routage ni la verification TLS upstream. L'influence sur la cle cache n'est autorisee qu'a travers des sorties de hook typees et contraintes que Fluxheim valide, borne et enregistre."

[[phrase]]
from = "Plugin panics, traps, timeout, or fuel exhaustion must produce configured fail behavior and must not crash Fluxheim."
to = "Les panics, traps, timeouts ou epuisements de fuel des plugins doivent produire le comportement d'echec configure et ne doivent pas crasher Fluxheim."

[[phrase]]
from = "should reject WASM features by default."
to = "doit rejeter les features WASM par defaut."

[[phrase]]
from = "WASM engine dependencies require license, advisory, and supply-chain review."
to = "Les dependances de moteur WASM exigent une revue licence, advisory et supply-chain."

