locale_id = "fr-FR"
html_lang = "fr-FR"

[[phrase]]
from = "Advanced Features"
to = "Fonctionnalités avancées"

[[phrase]]
from = "PHP-FPM, proxy operations, admin API, zero-retention privacy mode, WAF, WASM extensibility, and planned future modules."
to = "PHP-FPM, opérations proxy, API admin, mode privacy sans rétention, WAF, extensibilité WASM et futurs modules planifiés."

[[phrase]]
from = "PHP-FPM Bridge"
to = "Pont PHP-FPM"

[[phrase]]
from = "Available since v1.3.1 via the <code>php-fpm</code> Cargo feature. The PHP-FPM bridge connects Fluxheim to a running PHP-FPM pool using the FastCGI protocol. It supports WordPress-style front-controller applications with strict script resolution and bounded request/response handling."
to = "Disponible depuis v1.3.1 via la fonctionnalité Cargo <code>php-fpm</code>. Le pont PHP-FPM connecte Fluxheim à un pool PHP-FPM actif via le protocole FastCGI. Il prend en charge les applications front-controller de type WordPress avec résolution stricte des scripts et traitement requête/réponse borné."

[[phrase]]
from = "bash — build with PHP-FPM support"
to = "bash - build avec support PHP-FPM"

[[phrase]]
from = "fluxheim.toml — WordPress front-controller"
to = "fluxheim.toml - front-controller WordPress"

[[phrase]]
from = "Managed PHP-FPM"
to = "PHP-FPM géré"

[[phrase]]
from = "Included in current v1.6.28 builds and introduced in v1.3.7. Managed mode keeps the same FastCGI/php-fpm request path, but Fluxheim starts and supervises a private php-fpm master process for the vhost. External php-fpm remains the default; use managed mode when you want Fluxheim to generate the pool config and own the private socket lifecycle."
to = "Inclus dans les builds v1.6.28 actuels et introduit en v1.3.7. Le mode géré conserve le même chemin de requête FastCGI/php-fpm, mais Fluxheim démarre et supervise un processus maître php-fpm privé pour le vhost. php-fpm externe reste le défaut; utilisez le mode géré lorsque vous voulez que Fluxheim génère la configuration du pool et possède le cycle de vie du socket privé."

[[phrase]]
from = "fluxheim.toml — managed php-fpm pool"
to = "fluxheim.toml - pool php-fpm géré"

[[phrase]]
from = "Do not set <code>socket</code>, <code>tcp</code>, or <code>tcp_upstreams</code> in managed mode. Fluxheim creates the private Unix socket under <code>socket_dir</code>, generates the php-fpm pool files, shuts the master down on reload or gateway shutdown, and respawns it with bounded backoff if it crashes after startup."
to = "Ne définissez pas <code>socket</code>, <code>tcp</code> ou <code>tcp_upstreams</code> en mode géré. Fluxheim crée le socket Unix privé sous <code>socket_dir</code>, génère les fichiers de pool php-fpm, arrête le maître lors d'un reload ou shutdown du gateway, et le relance avec backoff borné s'il plante après le démarrage."

[[phrase]]
from = "How PHP routing works"
to = "Fonctionnement du routage PHP"

[[phrase]]
from = "Requests for existing <code>.php</code> files are routed directly to PHP-FPM"
to = "Les requêtes vers des fichiers <code>.php</code> existants sont routées directement vers PHP-FPM"

[[phrase]]
from = "Requests for non-existent files fall back to the front controller (<code>index.php</code>)"
to = "Les requêtes vers des fichiers inexistants retombent sur le front-controller (<code>index.php</code>)"

[[phrase]]
from = "Static assets (<code>.css</code>, <code>.js</code>, images) are served directly without touching PHP-FPM"
to = "Les assets statiques (<code>.css</code>, <code>.js</code>, images) sont servis directement sans toucher PHP-FPM"

[[phrase]]
from = "Script resolution is strict — only files within the configured PHP <code>root</code> are passed to FPM"
to = "La résolution des scripts est stricte - seuls les fichiers dans le <code>root</code> PHP configuré sont transmis à FPM"

[[phrase]]
from = "fluxheim-acme Companion"
to = "Compagnon fluxheim-acme"

[[phrase]]
from = "Released in v1.3.2. <code>fluxheim-acme</code> is a standalone companion binary for managing ACME certificate renewal and reload operations outside of the main gateway process. It is designed for container and external service-manager deployments where the gateway does not own the renewal lifecycle."
to = "Publié en v1.3.2. <code>fluxheim-acme</code> est un binaire compagnon autonome pour gérer le renouvellement des certificats ACME et les opérations de reload hors du processus gateway principal. Il est conçu pour les déploiements conteneur et service-manager externe où le gateway ne possède pas le cycle de renouvellement."

[[phrase]]
from = "bash — fluxheim-acme operations"
to = "bash - opérations fluxheim-acme"

[[phrase]]
from = "The ACME reload socket lets <code>fluxheim-acme</code> signal the running gateway to pick up freshly issued certificates without a full restart. Configure the socket path in your <code>[server]</code> block."
to = "Le socket de reload ACME permet à <code>fluxheim-acme</code> de signaler au gateway actif de récupérer les certificats fraîchement émis sans redémarrage complet. Configurez le chemin du socket dans votre bloc <code>[server]</code>."

[[phrase]]
from = "fluxheim.toml — ACME reload socket"
to = "fluxheim.toml - socket de reload ACME"

[[phrase]]
from = "Released in v1.3.2. <code>fluxheim-config-tester</code> is a standalone binary that validates a Fluxheim config file without starting the gateway. Useful in CI pipelines and container entrypoints where config errors should be caught before being applied to a running service."
to = "Publié en v1.3.2. <code>fluxheim-config-tester</code> est un binaire autonome qui valide un fichier de configuration Fluxheim sans démarrer le gateway. Utile dans les pipelines CI et les entrypoints conteneur où les erreurs de configuration doivent être détectées avant application à un service actif."

[[phrase]]
from = "bash — validate config before apply"
to = "bash - valider la configuration avant application"

[[phrase]]
from = "Proxy Operations"
to = "Opérations proxy"

[[phrase]]
from = "Fluxheim v1.4.x adds migration-focused proxy operations on top of the 1.4.0 proxy parity baseline: regex routes, method routing, WebSocket upgrades, auth subrequests, safe traffic mirroring, dynamic upstream discovery, and a read-only local ops socket."
to = "Fluxheim v1.4.x ajoute des opérations proxy orientées migration au-dessus de la baseline de parité proxy 1.4.0 : routes regex, routage par méthode, upgrades WebSocket, sous-requêtes d'auth, mirroring de trafic sûr, découverte upstream dynamique et socket ops local en lecture seule."

[[phrase]]
from = "fluxheim.toml — proxy operations"
to = "fluxheim.toml - opérations proxy"

[[phrase]]
from = "Regex support is disabled until <code>server.regex_enabled = true</code> is set. Traffic mirroring is compiled through the <code>traffic-mirror</code> feature and mirrors safe bodyless methods only; it never changes the primary response."
to = "Le support regex est désactivé jusqu'à ce que <code>server.regex_enabled = true</code> soit défini. Le mirroring de trafic est compilé via la fonctionnalité <code>traffic-mirror</code> et ne miroir que les méthodes sûres sans body; il ne modifie jamais la réponse principale."

[[phrase]]
from = "Zero-Retention Privacy Mode"
to = "Mode privacy sans rétention"

[[phrase]]
from = "The <code>privacy-mode</code> feature compiles Fluxheim without any caching or metrics functionality, enforcing zero log retention at the build level. This is suitable for privacy-sensitive deployments where no request data should be stored or exported."
to = "La fonctionnalité <code>privacy-mode</code> compile Fluxheim sans aucune fonctionnalité de cache ou de métriques, imposant une rétention zéro des logs au niveau du build. Cela convient aux déploiements sensibles à la vie privée où aucune donnée de requête ne doit être stockée ou exportée."

[[phrase]]
from = "bash — zero-retention privacy build"
to = "bash - build privacy sans rétention"

[[phrase]]
from = "What privacy-mode enforces"
to = "Ce que privacy-mode impose"

[[phrase]]
from = "No cache module compiled — caching is impossible at the binary level"
to = "Aucun module cache compilé - le caching est impossible au niveau du binaire"

[[phrase]]
from = "No metrics module compiled — no Prometheus or OTLP export"
to = "Aucun module métriques compilé - aucun export Prometheus ou OTLP"

[[phrase]]
from = "Access logs may be disabled in the config"
to = "Les access logs peuvent être désactivés dans la configuration"

[[phrase]]
from = "Compile-time guarantee: no data is stored, no external telemetry is exported"
to = "Garantie à la compilation : aucune donnée n'est stockée, aucune télémétrie externe n'est exportée"

[[phrase]]
from = "Admin API"
to = "API admin"

[[phrase]]
from = "The admin control-plane exposes a local HTTP API for health checks, config reload, cache purge, and status queries. It defaults to loopback-only and requires a bearer token on non-loopback listeners."
to = "Le plan de contrôle admin expose une API HTTP locale pour les health checks, le reload de configuration, la purge cache et les requêtes de statut. Par défaut elle est loopback-only et exige un bearer token sur les listeners non-loopback."

[[phrase]]
from = "bash — admin API endpoints"
to = "bash - endpoints API admin"

[[phrase]]
from = "WASM Extensibility"
to = "Extensibilité WASM"

[[phrase]]
from = "Planned — v1.6"
to = "Planifié - v1.6"

[[phrase]]
from = "Fluxheim's WASM extensibility layer is planned for the 1.6 release. It will support nginx-Lua-style request/response hooks and VCL-like cache policy hooks through WebAssembly modules."
to = "La couche d'extensibilité WASM de Fluxheim est prévue pour la release 1.6. Elle prendra en charge des hooks requête/réponse de style nginx-Lua et des hooks de politique cache de type VCL via des modules WebAssembly."

[[phrase]]
from = "Compile-time opt-in <code>wasm</code> feature"
to = "Fonctionnalité <code>wasm</code> optionnelle à la compilation"

[[phrase]]
from = "Hook points: request received, upstream response, cache policy, response send"
to = "Points de hook : requête reçue, réponse upstream, politique cache, envoi de réponse"

[[phrase]]
from = "Shared memory model between WASM modules and the host"
to = "Modèle mémoire partagé entre modules WASM et hôte"

[[phrase]]
from = "Sandboxed execution with bounded resource limits"
to = "Exécution sandboxée avec limites de ressources bornées"

[[phrase]]
from = "WAF Architecture"
to = "Architecture WAF"

[[phrase]]
from = "Planned — future"
to = "Planifié - futur"

[[phrase]]
from = "A Web Application Firewall module is documented in the architecture but not enabled in the current stable builds. It is planned as a compile-time optional module with rule-based request filtering, rate limiting per IP/path/method, and configurable block/log/challenge responses."
to = "Un module Web Application Firewall est documenté dans l'architecture mais pas activé dans les builds stables actuels. Il est prévu comme module optionnel à la compilation avec filtrage de requêtes par règles, rate limiting par IP/chemin/méthode et réponses block/log/challenge configurables."

[[phrase]]
from = "Load Balancer"
to = "Load Balancer"

[[phrase]]
from = "The <code>load-balancer</code> feature adds Fluxheim's load-balancer control plane and health checks to the proxy runtime. It is opt-in and available today via <code>profile-load-balancer</code> or <code>profile-load-balancer-edge</code>."
to = "La fonctionnalité <code>load-balancer</code> ajoute le plan de contrôle load-balancer et les health checks de Fluxheim au runtime proxy. Elle est optionnelle et disponible aujourd'hui via <code>profile-load-balancer</code> ou <code>profile-load-balancer-edge</code>."

[[phrase]]
from = "fluxheim.toml — upstream pool with health checks"
to = "fluxheim.toml - pool upstream avec health checks"

