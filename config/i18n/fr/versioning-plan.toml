[[phrase]]
from = "Versioning Plan — Fluxheim Source Docs"
to = "Plan de versioning - Documentation source Fluxheim"
[[phrase]]
from = "Versioning Plan"
to = "Plan de versioning"
[[phrase]]
from = "Fluxheim should use SemVer, but with a conservative interpretation: a feature is not considered stable just because it compiles. A feature becomes stable only after it has docs, config validation, tests, release checks, and a clear security boundary."
to = "Fluxheim doit utiliser SemVer, mais avec une interpretation conservatrice: une feature n'est pas consideree stable simplement parce qu'elle compile. Une feature devient stable seulement apres documentation, validation de config, tests, checks de release et une frontiere de securite claire."
[[phrase]]
from = "The main lesson from the roadmap is to avoid shipping one giant 1.0. The"
to = "La lecon principale de la roadmap est d'eviter de livrer un enorme 1.0. La ligne"
[[phrase]]
from = "line is the basic-sites preview: static HTML, vhosts, static TLS, containers, and simple whole-vhost proxying. Version"
to = "est la preview basic-sites: HTML statique, vhosts, TLS statique, conteneurs et proxying simple whole-vhost. La version"
[[phrase]]
from = "should be the first stable gateway release that can migrate Fluxheim's own representative multi-site configs without losing core behavior. Larger modules then graduate in later minor releases."
to = "doit etre la premiere release gateway stable capable de migrer les configs multi-sites representatives de Fluxheim sans perdre le comportement core. Les modules plus grands graduent ensuite dans des releases mineures ulterieures."
[[phrase]]
from = "Versioning Rules"
to = "Regles de versioning"
[[phrase]]
from = ": incubator releases. Config shape and behavior may still change."
to = ": releases incubateur. La forme de config et le comportement peuvent encore changer."
[[phrase]]
from = ": stable core bugfixes only."
to = ": uniquement bugfixes core stables."
[[phrase]]
from = ": add stable, production-supported modules without breaking existing 1.x configs."
to = ": ajouter des modules stables supportes en production sans casser les configs 1.x existantes."
