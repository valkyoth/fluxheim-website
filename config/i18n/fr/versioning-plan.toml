from = ": allowed only for breaking config/API behavior or major threat-model changes that cannot be feature-gated safely."
to = ": autorise seulement pour des changements cassants de config/API ou de grands changements de threat model qui ne peuvent pas etre feature-gates en securite."
[[phrase]]
from = "Security fixes should be backported to the latest stable minor when practical."
to = "Les correctifs de securite doivent etre backportes vers le dernier minor stable lorsque c'est pratique."
[[phrase]]
from = "Every public release must pass the matching release security and stability gate in"
to = "Chaque release publique doit passer le gate de securite et stabilite de release correspondant dans"
[[phrase]]
from = "Preview releases may document known gaps, but must still pass dependency, license, static/proxy smoke, and container checks for the behavior they claim."
to = "Les releases preview peuvent documenter les lacunes connues, mais doivent quand meme passer les checks dependances, licence, smoke static/proxy et conteneur pour le comportement qu'elles revendiquent."
