[[phrase]]
from = "Focused 1.5 load-balancer binary and image with advanced selection, local persistence, health/ejection policy, bounded queueing, and runtime member controls."
to = "Binaire et image load-balancer 1.5 ciblés avec sélection avancée, persistance locale, politiques de santé/éjection, files bornées et contrôles de membres à l'exécution."

[[phrase]]
from = "Compile only what you need. Focused profiles for static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring, and compression-enabled production bundles."
to = "Compilez seulement ce dont vous avez besoin. Profils ciblés pour site statique, cache edge, reverse proxy, équilibrage de charge, proxy de flux TCP, PHP-FPM, GeoIP, miroir de trafic et bundles de production avec compression."

[[phrase]]
from = "rustls-first with supported OpenSSL and FIPS/ISO proof build paths, client certificate auth, upstream mTLS, automatic ACME issuance, and multi-cert SNI."
to = "rustls d'abord, avec chemins de build OpenSSL et FIPS/ISO pris en charge, authentification par certificat client, mTLS upstream, émission ACME automatique et SNI multi-certificats."

[[phrase]]
from = "Advanced Cache System"
to = "Système de cache avancé"

[[phrase]]
from = "Memory, disk, tiered, and encrypted cache backends with cache-safe gzip, Zstandard, and Brotli compression plus range caching for large objects."
to = "Backends de cache mémoire, disque, hiérarchisés et chiffrés avec compression gzip, Zstandard et Brotli compatible cache, plus cache par plages pour les grands objets."

[[phrase]]
from = "Container Native"
to = "Natif conteneur"

[[phrase]]
from = "Rootless Podman images for Wolfi, Alpine, SUSE Micro, and Debian. Systemd/RPM for native deployments. Zero external assets on startup."
to = "Images Podman rootless pour Wolfi, Alpine, SUSE Micro et Debian. Systemd/RPM pour les déploiements natifs. Aucun asset externe au démarrage."

[[phrase]]
from = "Opt-in Prometheus metrics listener, OTLP metrics export, trace context propagation, and OTLP trace export for full observability."
to = "Listener de métriques Prometheus optionnel, export OTLP des métriques, propagation du contexte de trace et export OTLP des traces pour une observabilité complète."

[[phrase]]
from = "Optional local MMDB lookups for country and ASN policy using MaxMind GeoIP2/GeoLite2 or CIRCL Geo Open datasets. No remote lookup or downloader in the request path."
to = "Lookups MMDB locaux optionnels pour les politiques pays et ASN avec les jeux de données MaxMind GeoIP2/GeoLite2 ou CIRCL Geo Open. Aucun lookup distant ni téléchargeur dans le chemin de requête."

[[phrase]]
from = "TCP Stream Proxy"
to = "Proxy de flux TCP"

[[phrase]]
from = "Raw L4 TCP services with dedicated stream routes, true idle/lifetime/byte caps, upstream TLS/mTLS controls, weighted/drain/backup policy, and route-local PROXY protocol."
to = "Services TCP L4 bruts avec routes de flux dédiées, limites réelles d'inactivité, de durée de vie et d'octets, contrôles TLS/mTLS upstream, politiques pondérées/drain/secours et protocole PROXY local à la route."

[[phrase]]
from = "PHP-FPM Support"
to = "Support PHP-FPM"

[[phrase]]
from = "Opt-in PHP-FPM FastCGI bridge for WordPress-style front-controller applications. Strict script resolution and bounded request handling."
to = "Bridge PHP-FPM FastCGI optionnel pour les applications front-controller de style WordPress. Résolution stricte des scripts et traitement borné des requêtes."

[[phrase]]
from = "Edge Policy Controls"
to = "Contrôles de politique edge"

[[phrase]]
from = "Trusted-proxy-aware ACLs, rate limits, auth subrequests, traffic mirroring, regex rewrites, bounded queues, strict config validation, and hardened request handling."
