[[phrase]]
from = "Focused 1.5 load-balancer binary and image with advanced selection, local persistence, health/ejection policy, bounded queueing, and runtime member controls."
to = "Fokussiertes 1.5-Load-Balancer-Binary und Image mit erweiterter Auswahl, lokaler Persistenz, Health-/Ejection-Richtlinien, begrenztem Queueing und Laufzeitsteuerung für Mitglieder."

[[phrase]]
from = "Compile only what you need. Focused profiles for static site, cache edge, reverse proxy, load balancing, TCP stream proxying, PHP-FPM, GeoIP, traffic mirroring, and compression-enabled production bundles."
to = "Kompiliere nur, was du brauchst. Fokussierte Profile für statische Sites, Cache Edge, Reverse Proxy, Load Balancing, TCP-Stream-Proxying, PHP-FPM, GeoIP, Traffic Mirroring und produktionsfähige Bundles mit Kompression."

[[phrase]]
from = "rustls-first with supported OpenSSL and FIPS/ISO proof build paths, client certificate auth, upstream mTLS, automatic ACME issuance, and multi-cert SNI."
to = "rustls-first mit unterstützten OpenSSL- und FIPS/ISO-Nachweis-Buildpfaden, Client-Zertifikatsauthentifizierung, Upstream-mTLS, automatischer ACME-Ausstellung und Multi-Zertifikat-SNI."

[[phrase]]
from = "Advanced Cache System"
to = "Erweitertes Cache-System"

[[phrase]]
from = "Memory, disk, tiered, and encrypted cache backends with cache-safe gzip, Zstandard, and Brotli compression plus range caching for large objects."
to = "Memory-, Disk-, Tiered- und verschlüsselte Cache-Backends mit cache-sicherer gzip-, Zstandard- und Brotli-Kompression plus Range-Caching für große Objekte."

[[phrase]]
from = "Container Native"
to = "Container-nativ"

[[phrase]]
from = "Rootless Podman images for Wolfi, Alpine, SUSE Micro, and Debian. Systemd/RPM for native deployments. Zero external assets on startup."
to = "Rootless-Podman-Images für Wolfi, Alpine, SUSE Micro und Debian. Systemd/RPM für native Deployments. Keine externen Assets beim Start."

[[phrase]]
from = "Opt-in Prometheus metrics listener, OTLP metrics export, trace context propagation, and OTLP trace export for full observability."
to = "Optionaler Prometheus-Metrics-Listener, OTLP-Metrics-Export, Trace-Context-Propagation und OTLP-Trace-Export für vollständige Observability."

[[phrase]]
from = "Optional local MMDB lookups for country and ASN policy using MaxMind GeoIP2/GeoLite2 or CIRCL Geo Open datasets. No remote lookup or downloader in the request path."
to = "Optionale lokale MMDB-Lookups für Länder- und ASN-Richtlinien mit MaxMind GeoIP2/GeoLite2 oder CIRCL Geo Open-Datensätzen. Kein Remote-Lookup oder Downloader im Request-Pfad."

[[phrase]]
from = "TCP Stream Proxy"
to = "TCP-Stream-Proxy"

[[phrase]]
from = "Raw L4 TCP services with dedicated stream routes, true idle/lifetime/byte caps, upstream TLS/mTLS controls, weighted/drain/backup policy, and route-local PROXY protocol."
to = "Rohe L4-TCP-Dienste mit dedizierten Stream-Routen, echten Idle-/Lifetime-/Byte-Limits, Upstream-TLS/mTLS-Kontrollen, Weighted-/Drain-/Backup-Richtlinien und routenlokalem PROXY-Protokoll."

[[phrase]]
from = "PHP-FPM Support"
to = "PHP-FPM-Unterstützung"

[[phrase]]
from = "Opt-in PHP-FPM FastCGI bridge for WordPress-style front-controller applications. Strict script resolution and bounded request handling."
to = "Optionale PHP-FPM-FastCGI-Bridge für Front-Controller-Anwendungen im WordPress-Stil. Strikte Skriptauflösung und begrenzte Request-Verarbeitung."

[[phrase]]
from = "Edge Policy Controls"
to = "Edge-Richtlinienkontrollen"

